AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  Exclude:
    - vendor/**/*
    - tmp/**/*
    - "*.gemspec"
  SuggestExtensions: false

# MASTER2 style: terse, dense, intentional
# Align with axioms: ONE_JOB, FAIL_VISIBLY, PRESERVE_THEN_IMPROVE

# --- Metrics: relax for genuine complexity, catch truly bloated code ---
Metrics/MethodLength:
  Max: 25
  CountAsOne: [array, hash, heredoc]

Metrics/ClassLength:
  Max: 200

Metrics/ModuleLength:
  Max: 200

Metrics/BlockLength:
  Max: 50
  Exclude:
    - "test/**/*"
    - "data/**/*"

Metrics/AbcSize:
  Max: 41

Metrics/CyclomaticComplexity:
  Max: 15

Metrics/PerceivedComplexity:
  Max: 15

Metrics/ParameterLists:
  Max: 6

# --- Style: enforce frozen_string_literal (already done), minimal else ---
Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: comma

# Disable overly opinionated style cops
Style/Documentation:
  Enabled: false

Style/Lambda:
  Enabled: false

Style/SymbolArray:
  Enabled: false

Style/WordArray:
  Enabled: false

Style/ClassAndModuleChildren:
  Enabled: false

Style/NumericPredicate:
  Enabled: false

Style/ZeroLengthPredicate:
  Enabled: false

Style/NegatedIf:
  Enabled: false

Style/GuardClause:
  Enabled: false

# --- Naming: enforce readable names ---
Naming/MethodParameterName:
  MinNameLength: 2
  AllowedNames: [e, k, v, n, m, i, j, x, y, t, p, q, id, to, io]

# --- Lint: enforce all real bugs ---
Lint/MissingSuper:
  Enabled: false  # MASTER2 uses mixins heavily

# --- Layout: consistent, readable ---
Layout/LineLength:
  Max: 120
  AllowedPatterns:
    - '^\s*#'
    - '^\s*[A-Z_]+ ='


# MASTER2 uses dmesg-style log tags (llm0, cred0, refl0) -- intentional
Naming/VariableNumber:
  Enabled: false

# DuplicateBranch fires on intentional fallthrough and default clauses
Lint/DuplicateBranch:
  Enabled: false

# Unused keyword args are often part of a normalized interface signature
Lint/UnusedMethodArgument:
  AllowUnusedKeywordArguments: true

# PredicatePrefix/Method: MASTER2 uses check_, verify_, ensure_ intentionally
Naming/PredicatePrefix:
  Enabled: false

Naming/PredicateMethod:
  Enabled: false

# AccessorMethodName: MASTER2 has set_forced_model! etc by design
Naming/AccessorMethodName:
  Enabled: false

# Style/ModuleFunction: MASTER2 uses `extend self` throughout.
# `module_function` makes included methods private -- WRONG for modules that
# are both included into classes AND called as MASTER::Mod.method().
# Never autocorrect extend self -> module_function in this codebase.
Style/ModuleFunction:
  Enabled: false

