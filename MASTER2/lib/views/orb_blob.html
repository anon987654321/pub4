<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blob Orb</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#050505}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Monochrome mint ramp - 16 stops from black to mint
const MINT=[90,240,182];
const RAMP=[];
for(let i=0;i<16;i++){
  const t=i/15;
  if(t<0.5){
    const s=t*2;
    RAMP.push([
      Math.round(5+MINT[0]*s*0.6),
      Math.round(5+MINT[1]*s*0.6),
      Math.round(5+MINT[2]*s*0.6)
    ]);
  }else{
    const s=(t-0.5)*2;
    RAMP.push([
      Math.round(MINT[0]*0.6+(255-MINT[0]*0.6)*s*0.4),
      Math.round(MINT[1]*0.6+(255-MINT[1]*0.6)*s*0.3),
      Math.round(MINT[2]*0.6+(255-MINT[2]*0.6)*s*0.3)
    ]);
  }
}
function shade(intensity){
  const idx=Math.min(15,Math.max(0,Math.floor(intensity*15)));
  const c=RAMP[idx];
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{willReadFrequently:true});
let w,h,scale=2;
let U,V,nextU,nextV;
let audio=0,state='idle';

function resize(){
  w=Math.floor(window.innerWidth/scale);
  h=Math.floor(window.innerHeight/scale);
  canvas.width=w;canvas.height=h;
  
  // Initialize fields
  U=new Float32Array(w*h);
  V=new Float32Array(w*h);
  nextU=new Float32Array(w*h);
  nextV=new Float32Array(w*h);
  
  // U starts at 1.0 everywhere
  U.fill(1.0);
  V.fill(0.0);
  
  // Seed V at center
  const cx=Math.floor(w/2),cy=Math.floor(h/2);
  const r=15;
  for(let y=cy-r;y<cy+r;y++){
    for(let x=cx-r;x<cx+r;x++){
      if(x>=0&&x<w&&y>=0&&y<h){
        const dx=x-cx,dy=y-cy;
        if(dx*dx+dy*dy<r*r){
          V[y*w+x]=1.0;
        }
      }
    }
  }
}
resize();
window.addEventListener('resize',resize);

function laplacian(field,i,x,y){
  const l=x>0?field[i-1]:field[i];
  const r=x<w-1?field[i+1]:field[i];
  const u=y>0?field[i-w]:field[i];
  const d=y<h-1?field[i+w]:field[i];
  return l+r+u+d-4*field[i];
}

function draw(){
  // Gray-Scott parameters
  const dU=0.16;
  const dV=0.08;
  let feed=0.037+audio*0.025;
  let kill=0.06-audio*0.015;
  
  // State affects feed/kill
  if(state==='thinking'){
    feed*=0.8;
    kill*=1.2;
  }else if(state==='speaking'){
    feed*=1.3;
    kill*=0.9;
  }
  
  // Compute reaction-diffusion
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const i=y*w+x;
      const u=U[i],v=V[i];
      const lapU=laplacian(U,i,x,y);
      const lapV=laplacian(V,i,x,y);
      
      const uvv=u*v*v;
      nextU[i]=u+dU*lapU-uvv+feed*(1-u);
      nextV[i]=v+dV*lapV+uvv-(feed+kill)*v;
      
      // Clamp
      nextU[i]=Math.max(0,Math.min(1,nextU[i]));
      nextV[i]=Math.max(0,Math.min(1,nextV[i]));
    }
  }
  
  // Swap buffers
  const tmpU=U;U=nextU;nextU=tmpU;
  const tmpV=V;V=nextV;nextV=tmpV;
  
  // Render
  const img=ctx.createImageData(w,h);
  for(let i=0;i<w*h;i++){
    const intensity=V[i];
    const idx=Math.min(15,Math.max(0,Math.floor(intensity*15)));
    const c=RAMP[idx];
    const dith=((i%w+Math.floor(i/w))%2)*8-4;
    img.data[i*4]=Math.min(255,Math.max(0,c[0]+dith));
    img.data[i*4+1]=Math.min(255,Math.max(0,c[1]+dith));
    img.data[i*4+2]=Math.min(255,Math.max(0,c[2]+dith));
    img.data[i*4+3]=255;
  }
  ctx.putImageData(img,0,0);
  
  requestAnimationFrame(draw);
}

// Audio
navigator.mediaDevices?.getUserMedia({audio:true}).then(stream=>{
  const actx=new AudioContext(),src=actx.createMediaStreamSource(stream),an=actx.createAnalyser();
  an.fftSize=256;src.connect(an);
  const data=new Uint8Array(an.frequencyBinCount);
  (function loop(){
    an.getByteFrequencyData(data);
    let sum=0;for(let i=0;i<50;i++)sum+=data[i];
    audio=sum/50/255;
    requestAnimationFrame(loop);
  })();
}).catch(()=>{});

// State and audio from parent
window.addEventListener('message',e=>{
  if(e.data?.type==='state')state=e.data.mode;
  if(e.data?.type==='audio')audio=e.data.level;
});

draw();
</script>
</body>
</html>
