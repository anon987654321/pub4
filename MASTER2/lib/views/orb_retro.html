<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retro Orb</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#050505;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.scanlines{position:fixed;inset:0;background:repeating-linear-gradient(transparent 0px,transparent 2px,rgba(0,0,0,0.15) 2px,rgba(0,0,0,0.15) 4px);pointer-events:none;z-index:10}
.crt{position:fixed;inset:0;box-shadow:inset 0 0 120px rgba(0,0,0,0.7);pointer-events:none;z-index:11}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="scanlines"></div>
<div class="crt"></div>
<script>
// Monochrome mint ramp
const MINT=[90,240,182];
const RAMP=[];
for(let i=0;i<16;i++){
  const t=i/15;
  if(t<0.5){
    const s=t*2;
    RAMP.push([
      Math.round(5+MINT[0]*s*0.6),
      Math.round(5+MINT[1]*s*0.6),
      Math.round(5+MINT[2]*s*0.6)
    ]);
  }else{
    const s=(t-0.5)*2;
    RAMP.push([
      Math.round(MINT[0]*0.6+(255-MINT[0]*0.6)*s*0.4),
      Math.round(MINT[1]*0.6+(255-MINT[1]*0.6)*s*0.3),
      Math.round(MINT[2]*0.6+(255-MINT[2]*0.6)*s*0.3)
    ]);
  }
}

const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let w,h,cx,cy;
let audio=0,state='idle';
let waveform=new Float32Array(256);
let prevFrame=null;

function resize(){
  w=Math.min(256,window.innerWidth);
  h=Math.min(256,window.innerHeight);
  canvas.width=w;
  canvas.height=h;
  canvas.style.width=window.innerWidth+'px';
  canvas.style.height=window.innerHeight+'px';
  cx=w/2;cy=h/2;
  prevFrame=null;
}
resize();
window.addEventListener('resize',resize);

function drawPixel(x,y,intensity){
  if(x<0||x>=w||y<0||y>=h)return;
  const idx=Math.min(15,Math.max(0,Math.floor(intensity*15)));
  const c=RAMP[idx];
  ctx.fillStyle=`rgb(${c[0]},${c[1]},${c[2]})`;
  ctx.fillRect(Math.floor(x),Math.floor(y),1,1);
}

function hilbertPhaseShift(wave){
  // Simple approximation: delay by 1/4 wavelength
  const shifted=new Float32Array(wave.length);
  const delay=Math.floor(wave.length/4);
  for(let i=0;i<wave.length;i++){
    shifted[i]=wave[(i+delay)%wave.length];
  }
  return shifted;
}

function drawLissajous(){
  // Phosphor persistence - fade previous frame
  if(prevFrame){
    const img=ctx.getImageData(0,0,w,h);
    for(let i=0;i<img.data.length;i+=4){
      img.data[i]=Math.floor(img.data[i]*0.92);
      img.data[i+1]=Math.floor(img.data[i+1]*0.92);
      img.data[i+2]=Math.floor(img.data[i+2]*0.92);
    }
    ctx.putImageData(img,0,0);
  }else{
    ctx.fillStyle='#050505';
    ctx.fillRect(0,0,w,h);
  }
  prevFrame=true;
  
  // Phase-shifted waveform for XY
  const shifted=hilbertPhaseShift(waveform);
  
  // Scale based on state
  let scale=30;
  if(state==='thinking')scale*=0.6;
  else if(state==='speaking')scale*=1.2;
  
  // Draw Lissajous with beam brightness
  let prevX=null,prevY=null;
  const samples=128;
  
  for(let i=0;i<samples;i++){
    const idx=Math.floor(i*waveform.length/samples);
    const x=cx+waveform[idx]*scale;
    const y=cy+shifted[idx]*scale;
    
    if(prevX!==null){
      // Beam brightness = inverse of speed
      const dx=x-prevX,dy=y-prevY;
      const dist=Math.sqrt(dx*dx+dy*dy);
      const speed=dist;
      const brightness=Math.min(1,3/Math.max(0.5,speed));
      
      // Bresenham line with brightness
      let x1=Math.floor(prevX),y1=Math.floor(prevY);
      let x2=Math.floor(x),y2=Math.floor(y);
      const ddx=Math.abs(x2-x1),ddy=Math.abs(y2-y1);
      const sx=x1<x2?1:-1,sy=y1<y2?1:-1;
      let err=ddx-ddy;
      
      while(true){
        drawPixel(x1,y1,brightness);
        if(x1===x2&&y1===y2)break;
        const e2=2*err;
        if(e2>-ddy){err-=ddy;x1+=sx}
        if(e2<ddx){err+=ddx;y1+=sy}
      }
    }
    
    prevX=x;
    prevY=y;
  }
}

function frame(){
  drawLissajous();
  requestAnimationFrame(frame);
}

// Audio
navigator.mediaDevices?.getUserMedia({audio:true}).then(stream=>{
  const actx=new AudioContext();
  const src=actx.createMediaStreamSource(stream);
  const an=actx.createAnalyser();
  an.fftSize=512;
  an.smoothingTimeConstant=0.8;
  src.connect(an);
  const timeDomain=new Uint8Array(an.fftSize);
  
  (function audioLoop(){
    an.getByteTimeDomainData(timeDomain);
    
    // Convert to Float32 normalized
    for(let i=0;i<waveform.length;i++){
      waveform[i]=(timeDomain[i]-128)/128;
    }
    
    // Calculate audio level
    let sum=0;
    for(let i=0;i<waveform.length;i++)sum+=Math.abs(waveform[i]);
    audio=sum/waveform.length;
    
    requestAnimationFrame(audioLoop);
  })();
}).catch(()=>{
  // No audio - generate silence/idle pattern
  waveform.fill(0);
});

// State and audio from parent
window.addEventListener('message',e=>{
  if(e.data?.type==='state')state=e.data.mode;
  if(e.data?.type==='audio')audio=e.data.level;
});

frame();
</script>
</body>
</html>
