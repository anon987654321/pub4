<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Orb</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#050505}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Monochrome mint ramp
const MINT=[90,240,182];
const RAMP=[];
for(let i=0;i<16;i++){
  const t=i/15;
  if(t<0.5){
    const s=t*2;
    RAMP.push([
      Math.round(5+MINT[0]*s*0.6),
      Math.round(5+MINT[1]*s*0.6),
      Math.round(5+MINT[2]*s*0.6)
    ]);
  }else{
    const s=(t-0.5)*2;
    RAMP.push([
      Math.round(MINT[0]*0.6+(255-MINT[0]*0.6)*s*0.4),
      Math.round(MINT[1]*0.6+(255-MINT[1]*0.6)*s*0.3),
      Math.round(MINT[2]*0.6+(255-MINT[2]*0.6)*s*0.3)
    ]);
  }
}

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{willReadFrequently:true});
let w,h,scale=2,audio=0,state='idle',fftData=null,time=0,rotX=0,rotY=0;
let points=[],edges=[];

function resize(){
  w=Math.floor(window.innerWidth/scale);
  h=Math.floor(window.innerHeight/scale);
  canvas.width=w;canvas.height=h;
  initGeometry();
}

function initGeometry(){
  points=[];
  const n=80;
  const phi=(1+Math.sqrt(5))/2;
  
  // Fibonacci sphere distribution
  for(let i=0;i<n;i++){
    const y=1-(i/(n-1))*2;
    const r=Math.sqrt(1-y*y);
    const theta=2*Math.PI*i/phi;
    points.push({
      x:Math.cos(theta)*r,
      y:y,
      z:Math.sin(theta)*r,
      neighbors:[]
    });
  }
  
  // Build adjacency (connect nearest neighbors)
  edges=[];
  for(let i=0;i<points.length;i++){
    const p=points[i];
    const dists=[];
    for(let j=0;j<points.length;j++){
      if(i===j)continue;
      const q=points[j];
      const dx=p.x-q.x,dy=p.y-q.y,dz=p.z-q.z;
      const dist=Math.sqrt(dx*dx+dy*dy+dz*dz);
      dists.push({idx:j,dist});
    }
    dists.sort((a,b)=>a.dist-b.dist);
    
    // Connect to 3 nearest
    for(let k=0;k<3;k++){
      const j=dists[k].idx;
      if(!p.neighbors.includes(j)){
        p.neighbors.push(j);
        edges.push([i,j]);
      }
    }
  }
}

function sphericalHarmonic(theta,phi){
  // Y00 (breathing), Y1m (tilt), Y2m (lobing)
  let bass=0,mid=0,high=0;
  if(fftData){
    for(let i=0;i<10;i++)bass+=fftData[i];
    for(let i=10;i<30;i++)mid+=fftData[i];
    for(let i=30;i<60;i++)high+=fftData[i];
    bass/=10*255;
    mid/=20*255;
    high/=30*255;
  }
  
  // Spherical harmonics
  const Y00=0.28;
  const Y10=0.49*Math.cos(theta);
  const Y20=0.32*(3*Math.cos(theta)*Math.cos(theta)-1);
  
  return 1+Y00*bass*0.3+Y10*mid*0.2+Y20*high*0.15;
}

function draw(){
  time+=0.016;
  rotY+=0.008+audio*0.02;
  rotX=Math.sin(time*0.5)*0.3;
  
  // State affects rotation
  if(state==='thinking'){
    rotY+=0.01;
  }else if(state==='speaking'){
    rotY+=0.02;
  }
  
  ctx.fillStyle='rgba(5,5,5,0.15)';
  ctx.fillRect(0,0,w,h);
  
  const img=ctx.getImageData(0,0,w,h);
  const cx=w/2,cy=h/2;
  const cosY=Math.cos(rotY),sinY=Math.sin(rotY);
  const cosX=Math.cos(rotX),sinX=Math.sin(rotX);
  const baseRadius=35+audio*15;
  
  // Project points with spherical harmonic deformation
  const projected=points.map((p,i)=>{
    const theta=Math.acos(p.y);
    const phi=Math.atan2(p.z,p.x);
    const radiusMod=sphericalHarmonic(theta,phi);
    
    const sx=p.x*baseRadius*radiusMod;
    const sy=p.y*baseRadius*radiusMod;
    const sz=p.z*baseRadius*radiusMod;
    
    let x=sx*cosY-sz*sinY;
    let z=sx*sinY+sz*cosY;
    let y=sy*cosX-z*sinX;
    z=sy*sinX+z*cosX;
    
    const fov=80;
    const s=fov/(fov+z);
    return{px:cx+x*s,py:cy+y*s,z,s,idx:i};
  });
  
  // Draw edges (back to front)
  const edgeList=edges.map(([i,j])=>{
    const a=projected[i],b=projected[j];
    const avgZ=(a.z+b.z)/2;
    return{a,b,z:avgZ};
  });
  edgeList.sort((a,b)=>a.z-b.z);
  
  for(const {a,b,z} of edgeList){
    const depth=(z+50)/100;
    const opacity=depth<0?0.3:1.0;
    const intensity=depth*opacity*0.7;
    const idx=Math.min(15,Math.max(0,Math.floor(intensity*15)));
    const c=RAMP[idx];
    
    // Bresenham line
    let x1=Math.floor(a.px),y1=Math.floor(a.py);
    let x2=Math.floor(b.px),y2=Math.floor(b.py);
    const dx=Math.abs(x2-x1),dy=Math.abs(y2-y1);
    const sx=x1<x2?1:-1,sy=y1<y2?1:-1;
    let err=dx-dy;
    
    while(true){
      if(x1>=0&&x1<w&&y1>=0&&y1<h){
        const i=(y1*w+x1)*4;
        img.data[i]=Math.max(img.data[i],c[0]);
        img.data[i+1]=Math.max(img.data[i+1],c[1]);
        img.data[i+2]=Math.max(img.data[i+2],c[2]);
        img.data[i+3]=255;
      }
      if(x1===x2&&y1===y2)break;
      const e2=2*err;
      if(e2>-dy){err-=dy;x1+=sx}
      if(e2<dx){err+=dx;y1+=sy}
    }
  }
  
  // Draw points
  projected.sort((a,b)=>a.z-b.z);
  for(const p of projected){
    const px=Math.floor(p.px),py=Math.floor(p.py);
    if(px<1||px>=w-1||py<1||py>=h-1)continue;
    
    const depth=(p.z+50)/100;
    const intensity=depth*0.8;
    const idx=Math.min(15,Math.max(0,Math.floor(intensity*15)));
    const c=RAMP[idx];
    const dith=((px+py)%2)*8-4;
    
    for(let dy=0;dy<2;dy++){
      for(let dx=0;dx<2;dx++){
        const i=((py+dy)*w+px+dx)*4;
        img.data[i]=Math.min(255,c[0]+dith);
        img.data[i+1]=Math.min(255,c[1]+dith);
        img.data[i+2]=Math.min(255,c[2]+dith);
        img.data[i+3]=255;
      }
    }
  }
  
  ctx.putImageData(img,0,0);
  requestAnimationFrame(draw);
}

// Audio
navigator.mediaDevices?.getUserMedia({audio:true}).then(stream=>{
  const actx=new AudioContext(),src=actx.createMediaStreamSource(stream),an=actx.createAnalyser();
  an.fftSize=256;src.connect(an);
  fftData=new Uint8Array(an.frequencyBinCount);
  (function loop(){
    an.getByteFrequencyData(fftData);
    let sum=0;for(let i=0;i<50;i++)sum+=fftData[i];
    audio=sum/50/255;
    requestAnimationFrame(loop);
  })();
}).catch(()=>{});

// State and audio from parent
window.addEventListener('message',e=>{
  if(e.data?.type==='state')state=e.data.mode;
  if(e.data?.type==='audio')audio=e.data.level;
});

resize();
window.addEventListener('resize',resize);
draw();
</script>
</body>
</html>
