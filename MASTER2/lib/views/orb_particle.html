<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Particle Orb</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#050505}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Monochrome mint ramp
const MINT=[90,240,182];
const RAMP=[];
for(let i=0;i<16;i++){
  const t=i/15;
  if(t<0.5){
    const s=t*2;
    RAMP.push([
      Math.round(5+MINT[0]*s*0.6),
      Math.round(5+MINT[1]*s*0.6),
      Math.round(5+MINT[2]*s*0.6)
    ]);
  }else{
    const s=(t-0.5)*2;
    RAMP.push([
      Math.round(MINT[0]*0.6+(255-MINT[0]*0.6)*s*0.4),
      Math.round(MINT[1]*0.6+(255-MINT[1]*0.6)*s*0.3),
      Math.round(MINT[2]*0.6+(255-MINT[2]*0.6)*s*0.3)
    ]);
  }
}
function shade(intensity){
  const idx=Math.min(15,Math.max(0,Math.floor(intensity*15)));
  const c=RAMP[idx];
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{willReadFrequently:true});
let w,h,scale=2,audio=0,state='idle',fftData=null;
let particles=[];

function resize(){
  w=Math.floor(window.innerWidth/scale);
  h=Math.floor(window.innerHeight/scale);
  canvas.width=w;canvas.height=h;
  initParticles();
}

function initParticles(){
  particles=[];
  const cx=w/2,cy=h/2;
  for(let i=0;i<120;i++){
    const angle=Math.random()*Math.PI*2;
    const r=Math.random()*30;
    particles.push({
      x:cx+Math.cos(angle)*r,
      y:cy+Math.sin(angle)*r,
      vx:(Math.random()-0.5)*2,
      vy:(Math.random()-0.5)*2,
      history:[],
    });
  }
}

function draw(){
  const cx=w/2,cy=h/2;
  
  // FFT band weights
  let bassWeight=0.5,midWeight=0.5,highWeight=0.5;
  if(fftData){
    let bass=0,mid=0,high=0;
    for(let i=0;i<20;i++)bass+=fftData[i];
    for(let i=20;i<60;i++)mid+=fftData[i];
    for(let i=60;i<100;i++)high+=fftData[i];
    bassWeight=bass/20/255;
    midWeight=mid/40/255;
    highWeight=high/40/255;
  }
  
  // State affects weights
  if(state==='thinking'){
    bassWeight*=1.5;
    highWeight*=0.5;
  }else if(state==='speaking'){
    midWeight*=1.5;
  }
  
  // Apply boid rules
  const perceptionRadius=25;
  const separationDist=8;
  
  for(const p of particles){
    let sepX=0,sepY=0,sepCount=0;
    let aliX=0,aliY=0,aliCount=0;
    let cohX=0,cohY=0,cohCount=0;
    
    for(const other of particles){
      if(other===p)continue;
      const dx=other.x-p.x,dy=other.y-p.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      
      if(dist<perceptionRadius){
        // Separation
        if(dist<separationDist){
          sepX-=dx/dist;
          sepY-=dy/dist;
          sepCount++;
        }
        // Alignment
        aliX+=other.vx;
        aliY+=other.vy;
        aliCount++;
        // Cohesion
        cohX+=other.x;
        cohY+=other.y;
        cohCount++;
      }
    }
    
    // Average forces
    if(sepCount>0){
      sepX/=sepCount;
      sepY/=sepCount;
    }
    if(aliCount>0){
      aliX/=aliCount;
      aliY/=aliCount;
    }
    if(cohCount>0){
      cohX/=cohCount;
      cohY/=cohCount;
      cohX=(cohX-p.x)*0.01;
      cohY=(cohY-p.y)*0.01;
    }
    
    // Apply weighted forces
    p.vx+=sepX*highWeight*0.5+aliX*midWeight*0.05+cohX*bassWeight;
    p.vy+=sepY*highWeight*0.5+aliY*midWeight*0.05+cohY*bassWeight;
    
    // Speed limit
    const speed=Math.sqrt(p.vx*p.vx+p.vy*p.vy);
    const maxSpeed=3+audio*2;
    if(speed>maxSpeed){
      p.vx=(p.vx/speed)*maxSpeed;
      p.vy=(p.vy/speed)*maxSpeed;
    }
    
    // Update position
    p.x+=p.vx;
    p.y+=p.vy;
    
    // Wrap edges
    if(p.x<0)p.x+=w;
    if(p.x>=w)p.x-=w;
    if(p.y<0)p.y+=h;
    if(p.y>=h)p.y-=h;
    
    // Trail history
    p.history.push({x:p.x,y:p.y});
    if(p.history.length>3)p.history.shift();
  }
  
  // Render with trails
  ctx.fillStyle='rgba(5,5,5,0.2)';
  ctx.fillRect(0,0,w,h);
  
  const img=ctx.getImageData(0,0,w,h);
  
  for(const p of particles){
    const speed=Math.sqrt(p.vx*p.vx+p.vy*p.vy);
    const intensity=Math.min(1,speed/5);
    
    // Draw trail
    for(let i=0;i<p.history.length;i++){
      const pos=p.history[i];
      const trailIntensity=intensity*(i+1)/p.history.length*0.5;
      const px=Math.floor(pos.x),py=Math.floor(pos.y);
      if(px>=0&&px<w&&py>=0&&py<h){
        const idx=Math.min(15,Math.max(0,Math.floor(trailIntensity*15)));
        const c=RAMP[idx];
        const ii=(py*w+px)*4;
        img.data[ii]=Math.max(img.data[ii],c[0]);
        img.data[ii+1]=Math.max(img.data[ii+1],c[1]);
        img.data[ii+2]=Math.max(img.data[ii+2],c[2]);
        img.data[ii+3]=255;
      }
    }
    
    // Draw particle
    const px=Math.floor(p.x),py=Math.floor(p.y);
    if(px>=0&&px<w&&py>=0&&py<h){
      const idx=Math.min(15,Math.max(0,Math.floor(intensity*15)));
      const c=RAMP[idx];
      const dith=((px+py)%2)*8-4;
      const ii=(py*w+px)*4;
      img.data[ii]=Math.min(255,c[0]+dith);
      img.data[ii+1]=Math.min(255,c[1]+dith);
      img.data[ii+2]=Math.min(255,c[2]+dith);
      img.data[ii+3]=255;
      
      // Extra pixel for visibility
      if(px+1<w){
        const ii2=(py*w+px+1)*4;
        img.data[ii2]=c[0];
        img.data[ii2+1]=c[1];
        img.data[ii2+2]=c[2];
        img.data[ii2+3]=255;
      }
    }
  }
  
  ctx.putImageData(img,0,0);
  requestAnimationFrame(draw);
}

// Audio
navigator.mediaDevices?.getUserMedia({audio:true}).then(stream=>{
  const actx=new AudioContext(),src=actx.createMediaStreamSource(stream),an=actx.createAnalyser();
  an.fftSize=256;src.connect(an);
  fftData=new Uint8Array(an.frequencyBinCount);
  (function loop(){
    an.getByteFrequencyData(fftData);
    let sum=0;for(let i=0;i<50;i++)sum+=fftData[i];
    audio=sum/50/255;
    requestAnimationFrame(loop);
  })();
}).catch(()=>{});

// State and audio from parent
window.addEventListener('message',e=>{
  if(e.data?.type==='state')state=e.data.mode;
  if(e.data?.type==='audio')audio=e.data.level;
});

resize();
window.addEventListener('resize',resize);
draw();
</script>
</body>
</html>
