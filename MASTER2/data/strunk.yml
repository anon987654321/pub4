# Strunk & White output filter -- applied to LLM responses before display
# Rule: omit needless words. active voice. no hedging. no filler.

# Full-sentence preambles to strip (AI throat-clearing)
preambles:
  - "I'd be happy to help with that."
  - "I'd be happy to help!"
  - "I'd be happy to help."
  - "Happy to help!"
  - "Great question!"
  - "Certainly!"
  - "Of course!"
  - "Absolutely!"
  - "Sure!"
  - "Sure thing!"
  - "Of course, I'd be happy to"
  - "I'm glad you asked."
  - "That's a great question."
  - "That's an excellent question."
  - "I understand your question."

# Inline hedging phrases -- replace with nothing or shorter form
hedges:
  - pattern: "I think that "
    replace: ""
  - pattern: "I believe that "
    replace: ""
  - pattern: "I think "
    replace: ""
  - pattern: "I believe "
    replace: ""
  - pattern: "In my opinion, "
    replace: ""
  - pattern: "It's worth noting that "
    replace: ""
  - pattern: "It is worth noting that "
    replace: ""
  - pattern: "It's important to note that "
    replace: ""
  - pattern: "It is important to note that "
    replace: ""
  - pattern: "Please note that "
    replace: ""
  - pattern: "Note that "
    replace: ""
  - pattern: "Keep in mind that "
    replace: ""
  - pattern: "It should be noted that "
    replace: ""
  - pattern: "As you may know, "
    replace: ""
  - pattern: "As you probably know, "
    replace: ""
  - pattern: "you can simply "
    replace: "you can "
  - pattern: "you can easily "
    replace: "you can "
  - pattern: "simply use "
    replace: "use "
  - pattern: "just use "
    replace: "use "
  - pattern: "feel free to "
    replace: ""

# Filler endings to strip from last line
endings:
  - "I hope this helps!"
  - "I hope this helps."
  - "Hope this helps!"
  - "Hope this helps."
  - "Let me know if you have any questions!"
  - "Let me know if you have any questions."
  - "Let me know if you need anything else!"
  - "Let me know if you need anything else."
  - "Feel free to ask if you need more help!"
  - "Feel free to ask if you need more help."
  - "Is there anything else I can help you with?"
  - "Is there anything else you'd like to know?"
  - "Do you have any other questions?"

# Code-flooding preambles -- strip when LLM narrates before dumping a block
code_preambles:
  - "Here is the updated "
  - "Here's the updated "
  - "Here is the full "
  - "Here's the full "
  - "Here is the complete "
  - "Here's the complete "
  - "Below is the "
  - "The following code "
  - "Here is the code"
  - "Here's the code"
  - "I have updated "
  - "I've updated "
  - "I have added "
  - "I've added "
  - "I have made the following changes"
  - "I've made the following changes"
