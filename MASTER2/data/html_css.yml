# HTML & CSS Rules — constitutional code quality for web markup
# MASTER2 enforces these when generating or reviewing HTML/CSS

principles:
  - "Semantic HTML5 elements over generic div/span"
  - "No inline styles — all styling in external CSS"
  - "No CSS frameworks (Bootstrap, Tailwind) — vanilla CSS only"
  - "Mobile-first responsive design with min-width media queries"
  - "Accessibility: ARIA labels, alt text, focus management, color contrast"
  - "No JavaScript for layout or styling — CSS-only solutions"
  - "Logical properties (margin-inline, padding-block) over physical"

html:
  required:
    - "lang attribute on <html>"
    - "charset meta tag"
    - "viewport meta tag"
    - "<main> landmark for primary content"
    - "<nav> for navigation"
    - "<header>/<footer> for page structure"
  avoid:
    - "<div> when a semantic element exists"
    - "<br> for spacing (use CSS margin/padding)"
    - "<table> for layout"
    - "Inline event handlers (onclick, onsubmit)"

css:
  methodology: "BEM-inspired naming, flat selectors"
  max_specificity: "0-2-0 (two classes max)"
  units:
    font_size: "rem"
    spacing: "rem or em"
    layout: "fr, %, vh/vw"
    borders: "px"
  custom_properties: "Use CSS custom properties for theming"
  dark_mode: "prefers-color-scheme media query"
  animations: "prefers-reduced-motion respected"

performance:
  - "Critical CSS inlined in <head>"
  - "Non-critical CSS loaded async"
  - "No @import in CSS (use <link>)"
  - "Minimize reflows: avoid layout thrashing"
  - "will-change only when measured"
