# Programming language detection — maps file extensions to rule families.
# Loaded by Review::LanguageAxioms. Add new languages here, not in code.

extension_map:
  .rb:      [ruby, rails, universal]
  .rake:    [ruby, rails, universal]
  .gemspec: [ruby, universal]
  .sh:      [zsh, universal]
  .zsh:     [zsh, universal]
  .bash:    [zsh, universal]
  .html:    [html_erb, universal]
  .erb:     [html_erb, universal]
  .htm:     [html_erb, universal]
  .css:     [css_scss, universal]
  .scss:    [css_scss, universal]
  .sass:    [css_scss, universal]
  .js:      [javascript, universal]
  .mjs:     [javascript, universal]
  .jsx:     [javascript, universal]
  .ts:      [javascript, universal]
  .tsx:     [javascript, universal]
  .py:      [python, universal]
  .go:      [go, universal]
  .rs:      [rust, universal]
  .java:    [java, universal]
  .kt:      [kotlin, universal]
  .yml:     [yaml, universal]
  .yaml:    [yaml, universal]
  .json:    [json, universal]
  .md:      [markdown, universal]
  .toml:    [toml, universal]
  .conf:    [config, universal]

# Content-based indicators (when extension is absent or ambiguous).
# If indicator regex matches file content, language family is applied.
content_indicators:
  ruby:
    - "^#!.*ruby"
    - "^require ['\"]"
    - "^class .* < "
    - "^def .*\\bself\\."
  python:
    - "^#!.*python"
    - "^import \\w"
    - "^from \\w+ import"
    - "def \\w+\\(self"
  zsh:
    - "^#!.*(zsh|bash|sh)"
    - "^setopt "
    - "^autoload "
  javascript:
    - "^const |^let |^var "
    - "^import .* from "
    - "^export (default|const|function)"
  go:
    - "^package \\w"
    - "^import \\("
    - "^func \\w+\\("
