---
- id: ONE_SOURCE
  category: engineering
  protection: PROTECTED
  priority: 10
  title: One Source of Truth
  statement: Every piece of knowledge has exactly one authoritative representation.
    Extract on second use.
  source: The Pragmatic Programmer
  suggest: Possible duplicate constant. Consider extracting to a shared location.
  auto_fixable: true
  llm_strategies: [extract_constant, extract_method]
- id: SIMPLEST_WORKS
  category: engineering
  protection: PROTECTED
  priority: 10
  title: Simplest Thing That Works
  statement: The simplest working solution wins. Complexity multiplies failure modes.
  source: Unix Philosophy
  auto_fixable: true
  llm_strategies: [inline, remove_abstraction, simplify]
- id: ONE_JOB
  category: engineering
  protection: PROTECTED
  priority: 10
  title: One Job Per Thing
  statement: A module, class, or function has one reason to change. Do one thing well.
  source: Clean Code by Robert C. Martin
  suggest: Multiple classes in one file. Consider splitting into separate files.
  auto_fixable: true
  llm_strategies: [extract_class, extract_method, split_file]
- id: EXTEND_DONT_MODIFY
  category: engineering
  protection: PROTECTED
  priority: 7
  title: Extend, Don't Modify
  statement: Open for extension, closed for modification. Add behavior without changing
    existing code.
  source: SOLID Principles
  auto_fixable: true
  llm_strategies: [introduce_polymorphism, extract_strategy]
- id: SUBSTITUTABLE
  category: engineering
  protection: PROTECTED
  priority: 7
  title: Children Honor Parents
  statement: Subtypes must be substitutable for their base types. A child class never
    breaks parent's contract.
  source: SOLID Principles
- id: SMALL_INTERFACES
  category: engineering
  protection: PROTECTED
  priority: 7
  title: Small Specific Interfaces
  statement: Many specific interfaces beat one general interface. Clients shouldn't
    depend on methods they don't use.
  source: SOLID Principles
- id: DEPEND_ON_ABSTRACTIONS
  category: engineering
  protection: PROTECTED
  priority: 7
  title: Depend on Abstractions
  statement: Depend on abstractions, not concretions. High-level modules don't depend
    on low-level modules.
  source: SOLID Principles
- id: NO_SURPRISES
  category: engineering
  protection: PROTECTED
  priority: 10
  title: No Surprises
  statement: Systems behave as users expect. Match mental models. Surprising behavior
    is a bug.
  source: The Pragmatic Programmer
  auto_fixable: false
- id: COMPOSABLE
  category: engineering
  protection: PROTECTED
  priority: 7
  title: Design for Composition
  statement: Components work standalone and combined. Independently testable. Freely
    composable.
  source: Unix Philosophy
- id: FAIL_VISIBLY
  category: engineering
  protection: PROTECTED
  priority: 10
  title: Fail Visibly
  statement: Errors surface immediately. Never swallow exceptions. Silent failures
    compound into disasters.
  source: Release It! by Michael Nygard
  suggest: Don't use bare rescue. Specify exception type and handle or re-raise.
  auto_fixable: true
  llm_strategies: [add_rescue_clause, specify_exception]
- id: DEADLINES
  category: engineering
  protection: PROTECTED
  priority: 7
  title: Every Call Has a Deadline
  statement: External calls have explicit timeouts. Infinity is not a timeout. Hanging
    is worse than failing.
  source: Release It! by Michael Nygard
  suggest: 'Add explicit timeout to external call (e.g., open_timeout: 5, read_timeout:
    10).'
  auto_fixable: true
  llm_strategies: [add_timeout, wrap_net_call]
- id: MERGE
  category: structural
  protection: PROTECTED
  priority: 5
  title: Merge Duplicates
  statement: Combine duplicates into one source. Two representations of the same knowledge
    become one.
  source: Refactoring by Martin Fowler
  auto_fixable: true
  llm_strategies: [extract_method, extract_constant]
- id: FLATTEN
  category: structural
  protection: PROTECTED
  priority: 5
  title: Flatten Nesting
  statement: Remove unnecessary nesting levels. Deep hierarchies obscure intent and
    multiply complexity.
  source: Refactoring by Martin Fowler
  suggest: Deep nesting detected (>6 levels). Consider extracting methods or using
    guard clauses.
  auto_fixable: true
  llm_strategies: [guard_clause, extract_method, flatten_nesting]
- id: DEFRAGMENT
  category: structural
  protection: PROTECTED
  priority: 5
  title: Group Related Code
  statement: Move related things adjacent. Scattered code forces readers to reconstruct
    context.
  source: Refactoring by Martin Fowler
- id: DECOUPLE
  category: structural
  protection: PROTECTED
  priority: 7
  title: Decouple Dependencies
  statement: Hidden dependencies become explicit. Every coupling point is a failure
    point.
  source: Refactoring by Martin Fowler
  auto_fixable: true
  llm_strategies: [inject_dependency, extract_interface]
- id: HOIST
  category: structural
  protection: PROTECTED
  priority: 3
  title: Hoist Invariants
  statement: Move invariants out of repetition. Computation inside loops wastes resources
    and obscures intent.
  source: Refactoring by Martin Fowler
- id: PRUNE
  category: structural
  protection: PROTECTED
  priority: 5
  title: Prune Dead Paths
  statement: Remove dead and unreachable code. Dead code hides bugs and burdens maintenance.
  source: Refactoring by Martin Fowler
  suggest: Dead code marker found. Remove or fix the code.
  auto_fixable: true
  llm_strategies: [delete_dead_code]
- id: COALESCE
  category: structural
  protection: PROTECTED
  priority: 3
  title: Coalesce Operations
  statement: Merge sequential same-type operations. Five inserts become one bulk.
    Three API calls become one batch.
  source: Refactoring by Martin Fowler
- id: REFLOW
  category: structural
  protection: PROTECTED
  priority: 3
  title: Reflow by Importance
  statement: Order by importance, then chronology. Public API at top, helpers at bottom.
    Constants before methods.
  source: Clean Code by Robert C. Martin
- id: LEAVE_BETTER
  category: process
  protection: PROTECTED
  priority: 7
  title: Leave It Better
  statement: Every change improves the codebase. Fix nearby broken windows. Never
    degrade.
  source: Clean Code by Robert C. Martin
- id: ONE_CHANGE
  category: process
  protection: PROTECTED
  priority: 5
  title: Change One Thing
  statement: Modify one thing at a time. Commit often. Verify each step.
  source: Refactoring by Martin Fowler
- id: TEST_FIRST
  category: process
  protection: PROTECTED
  priority: 7
  title: Test Before Fix
  statement: Write the failing test before the fix. If you can't test it, you can't
    prove it.
  source: Test-Driven Development by Kent Beck
- id: SKELETON_FIRST
  category: process
  protection: PROTECTED
  priority: 5
  title: Build Skeleton First
  statement: Build the thinnest working slice first. Skeleton before flesh. Validate
    the path before optimizing.
  source: The Pragmatic Programmer
- id: MEASURE_THEN_OPTIMIZE
  category: process
  protection: PROTECTED
  priority: 5
  title: Measure Before Optimizing
  statement: No optimization without metrics. Measure, don't guess.
  source: Unix Philosophy
- id: REVERSIBLE
  category: process
  protection: PROTECTED
  priority: 5
  title: Make It Reversible
  statement: Every action can be undone. Edits, config changes, state mutations need
    rollback.
  source: The Pragmatic Programmer
- id: BE_CONCISE
  category: communication
  protection: PROTECTED
  priority: 7
  title: Be Concise
  statement: Vigorous writing is concise. No unnecessary words, sentences, or tokens.
  source: The Elements of Style by Strunk & White
  auto_fixable: false
- id: SELF_EXPLAINING
  category: communication
  protection: PROTECTED
  priority: 10
  title: Code Explains Itself
  statement: Code is self-explanatory. Comments explain why, not what.
  source: Clean Code by Robert C. Martin
- id: VISUAL_HIERARCHY
  category: communication
  protection: PROTECTED
  priority: 3
  title: Clear Visual Hierarchy
  statement: Structure defines importance. Important code is visually prominent.
  source: The Elements of Typographic Style by Robert Bringhurst
- id: STEADY_RHYTHM
  category: communication
  protection: PROTECTED
  priority: 3
  title: Steady Rhythm
  statement: Spacing and arrangement create steady visual and logical rhythm.
  source: The Elements of Typographic Style by Robert Bringhurst
- id: DEGRADE_GRACEFULLY
  category: resilience
  protection: PROTECTED
  priority: 7
  title: Degrade Gracefully
  statement: Works offline. Works without API. Works with failures. Never fully broken.
  source: Release It! by Michael Nygard
- id: EXPECT_FAILURE
  category: resilience
  protection: PROTECTED
  priority: 7
  title: Expect Failure
  statement: 'Every operation considers: what if this fails? Plan the unhappy path.'
  source: Stoic Philosophy
- id: APPEND_ONLY
  category: resilience
  protection: PROTECTED
  priority: 5
  title: Append-Only History
  statement: History is never mutated. Append-only enables replay, prevents data loss.
  source: Event Sourcing Principles
- id: JUST_ENOUGH
  category: aesthetic
  protection: PROTECTED
  priority: 5
  title: Just Enough
  statement: Not too much, not too little. Right-sized responses, complexity, intervention.
  source: Swedish Design Philosophy
- id: LEAST_POWER
  category: aesthetic
  protection: PROTECTED
  priority: 7
  title: Use Least Power
  statement: Choose the weakest tool that works. Use :cheap before :strong. Use grep
    before LLM.
  source: W3C Design Principles
- id: VISIBLE_REPAIRS
  category: aesthetic
  protection: PROTECTED
  priority: 3
  title: Visible Repairs
  statement: Fixes are features. Document repairs visibly. Addressed debt is beautiful.
  source: Japanese Aesthetics
- id: ANTICIPATE_NEEDS
  category: aesthetic
  protection: PROTECTED
  priority: 5
  title: Anticipate Needs
  statement: Predict what the user needs next. Suggest before asked. Prepare before
    requested.
  source: Japanese Hospitality
- id: DONT_FORCE
  category: aesthetic
  protection: PROTECTED
  priority: 3
  title: Don't Force It
  statement: Don't force solutions. The right solution flows naturally.
  source: Taoist Philosophy
- id: SELF_APPLY
  category: meta
  protection: ABSOLUTE
  title: Apply to Itself
  statement: A system that asserts quality must achieve its own standards. MASTER
    passes through MASTER.
  source: Recursive Quality
- id: SHOW_COST_FIRST
  category: meta
  protection: PROTECTED
  title: Show Cost First
  statement: Show what operations cost before execution. No surprise spend or side
    effects.
  source: User Trust Principles
- id: DEPTH_ON_DEMAND
  category: meta
  protection: PROTECTED
  title: Depth on Demand
  statement: Simple by default. Essential first. Complexity only when requested.
  source: Interaction Design Principles
- id: USER_FRIENDLY
  category: meta
  protection: PROTECTED
  title: User-Friendly Design
  statement: Visibility. User control. Error prevention. Consistency. Recognition
    over recall.
  source: 10 Usability Heuristics by Jakob Nielsen
- id: PRESERVE_FIRST
  category: governance
  protection: ABSOLUTE
  priority: 10
  title: Preserve Then Improve
  statement: Never break working code. Understand before changing. Improve without
    regressing.
  source: 'master.yml golden_rule: PRESERVE_THEN_IMPROVE_NEVER_BREAK'
- id: CHESTERTONS_FENCE
  category: governance
  protection: PROTECTED
  priority: 7
  title: Understand Before Removing
  statement: Before removing any code or feature, understand why it exists. If you
    cannot explain its purpose, do not remove it.
  source: G.K. Chesterton
- id: PARETO
  category: governance
  protection: NEGOTIABLE
  priority: 5
  title: 80/20 Rule
  statement: 80% of value comes from 20% of effort. Focus on high-impact changes first.
  source: Vilfredo Pareto
- id: LINDY
  category: governance
  protection: NEGOTIABLE
  priority: 5
  title: Lindy Effect
  statement: Old solutions that still work will likely keep working. Prefer battle-tested
    over novel.
  source: Nassim Taleb
- id: GALLS_LAW
  category: governance
  protection: PROTECTED
  priority: 7
  title: Complex From Simple
  statement: A complex system that works evolved from a simple system that worked.
    Start simple.
  source: John Gall
- id: HYRUMS_LAW
  category: governance
  protection: PROTECTED
  priority: 7
  title: Observable Behavior Becomes API
  statement: With enough users, every observable behavior becomes a dependency. Guard
    public interfaces.
  source: Hyrum Wright
- id: POSTELS_LAW
  category: governance
  protection: PROTECTED
  priority: 7
  title: Robustness Principle
  statement: Be conservative in what you send, liberal in what you accept.
  source: Jon Postel (RFC 761)
- id: OCCAMS_RAZOR
  category: governance
  protection: NEGOTIABLE
  priority: 5
  title: Simplest Explanation
  statement: Among competing solutions, the one with fewest assumptions is usually
    correct.
  source: William of Ockham
- id: FUNCTIONAL_CORE
  category: functional
  protection: PROTECTED
  priority: 7
  title: Functional Core, Imperative Shell
  statement: Pure logic at the center, side effects at the edges. Testable core, thin
    IO boundary.
  source: Gary Bernhardt
  auto_fixable: true
  llm_strategies: [extract_pure_function, move_io_to_boundary]
- id: IDEMPOTENT
  category: functional
  protection: PROTECTED
  priority: 7
  title: Idempotent Operations
  statement: Same input produces same result regardless of repetition. Safe to retry.
  source: Distributed Systems
  auto_fixable: false
- id: EXPLICIT
  category: functional
  protection: PROTECTED
  priority: 7
  title: Explicit Over Implicit
  statement: Make behavior visible. Hidden magic creates hidden bugs.
  source: Python Zen / Clean Code
- id: CQS
  category: functional
  protection: PROTECTED
  priority: 5
  title: Command-Query Separation
  statement: Methods either change state or return data, never both.
  source: Bertrand Meyer
  auto_fixable: true
  llm_strategies: [split_command_query]
- id: PURE_FUNCTIONS
  category: functional
  protection: NEGOTIABLE
  priority: 5
  title: Pure Functions
  statement: No side effects, deterministic output. Prefer pure transforms over stateful
    procedures.
  source: Functional Programming
- id: IMMUTABLE
  category: functional
  protection: NEGOTIABLE
  priority: 5
  title: Immutability by Default
  statement: Freeze data on creation. Mutate only when necessary and document why.
  source: Functional Programming
- id: CACHE_FIRST
  category: performance
  protection: PROTECTED
  priority: 7
  title: Cache Aggressively
  statement: Cache LLM responses, computations, and lookups. Semantic cache before
    API call.
  source: MASTER/principles.yml
  auto_fixable: true
  llm_strategies: [add_memoize, add_semantic_cache]
- id: GUARD_EXPENSIVE
  category: performance
  protection: PROTECTED
  priority: 7
  title: Guard Expensive Operations
  statement: Check preconditions before costly work. Fail fast, fail cheap.
  source: MASTER/principles.yml
- id: PRECOMPUTE
  category: performance
  protection: NEGOTIABLE
  priority: 5
  title: Precompute Expensive Math
  statement: Move invariant calculations outside loops. Lookup tables over repeated
    computation.
  source: MASTER/principles.yml
- id: PROSE_NOT_LISTS
  category: communication
  protection: PROTECTED
  priority: 7
  title: Prose Over Lists
  statement: Write connected prose. Bullet lists fragment reasoning and hide relationships.
  source: MASTER/principles.yml
- id: ACCESSIBLE_FIRST
  category: communication
  protection: PROTECTED
  priority: 7
  title: Accessible Then Technical
  statement: Lead with plain language, layer in technical detail. Never jargon-first.
  source: MASTER/principles.yml
- id: NO_ABBREVIATIONS
  category: communication
  protection: NEGOTIABLE
  priority: 5
  title: No Abbreviations
  statement: Spell it out. Abbreviations exclude newcomers and create ambiguity.
  source: MASTER/principles.yml
- id: SQUINT_TEST
  category: aesthetic
  protection: PROTECTED
  priority: 7
  title: Squint Test
  statement: Code should reveal structure when squinted at. Visual rhythm matters.
  source: Sandi Metz
- id: ANALOG_WARMTH
  category: aesthetic
  protection: NEGOTIABLE
  priority: 5
  title: Analog Warmth Over Digital Perfection
  statement: Slight imperfection feels human. Over-polished feels sterile.
  source: MASTER/principles.yml
- id: TYPOGRAPHY
  category: aesthetic
  protection: PROTECTED
  priority: 7
  title: Typography Discipline
  statement: Curly quotes, em dashes, proper ellipsis. Typographic care signals quality.
  source: MASTER/principles.yml
- id: AUDIO_SMOOTH
  category: aesthetic
  protection: NEGOTIABLE
  priority: 3
  title: Audio-Reactive Smoothing
  statement: Audio visualizations use exponential smoothing. Never raw FFT data.
  source: MASTER/principles.yml
- id: DUAL_DETECT
  category: verification
  protection: PROTECTED
  priority: 7
  title: Dual Detection
  statement: Check both literal patterns and conceptual violations. Regex + LLM together.
  source: MASTER/principles.yml
- id: SILENCE_DEFAULT
  category: verification
  protection: PROTECTED
  priority: 7
  title: Silence by Default
  statement: Only report actionable findings. No noise, no filler, no congratulations.
  source: MASTER/principles.yml
- id: MASS_CURATE
  category: verification
  protection: NEGOTIABLE
  priority: 5
  title: Mass Generation with Curation
  statement: Generate many alternatives, curate ruthlessly. Quantity enables quality.
  source: MASTER/principles.yml
- id: WET
  category: engineering
  protection: NEGOTIABLE
  priority: 7
  title: Write Everything Twice
  statement: Duplication is better than the wrong abstraction. Copy first, abstract
    after the pattern has proven stable. The Rule of Three applies.
  source: Sandi Metz / Programmer's Oath
  conflicts_with: [ONE_SOURCE]
  when: "Before the pattern has been used 3+ times"
  note: "Overrides ONE_SOURCE in early feature work. After 3 uses, extract."

- id: AHA
  category: engineering
  protection: NEGOTIABLE
  priority: 7
  title: Avoid Hasty Abstractions
  statement: Optimize for change, not for eliminating duplication. Prefer duplication
    over an abstraction you're not sure about. Wrong abstractions are worse than wet
    code.
  source: Kent C. Dodds
  conflicts_with: [ONE_SOURCE]
  when: "Abstraction would serve fewer than 3 concrete cases"
  note: "Overrides ONE_SOURCE when abstraction is premature."

- id: RUBBER_DUCK
  category: process
  protection: NEGOTIABLE
  priority: 5
  title: Rubber Duck Debugging
  statement: Explain the problem aloud to find clarity. Articulating to an imaginary
    listener surfaces hidden assumptions and reveals the answer.
  source: The Pragmatic Programmer
  auto_fixable: false

- id: BLAME_SELF
  category: process
  protection: NEGOTIABLE
  priority: 7
  title: Assume Your Bug First
  statement: The framework, library, and OS work correctly. Start from that assumption.
    Blame your own code first; blame the tool only after exhausting all other options.
  source: The Pragmatic Programmer
  auto_fixable: false

- id: GIT_BISECT
  category: process
  protection: NEGOTIABLE
  priority: 5
  title: Version Control as Time Machine
  statement: Use git bisect to find regressions. Huge commits and uncommitted changes
    are a safety hazard. Commit small, commit often.
  source: The Pragmatic Programmer
  auto_fixable: false
  smells: [huge_commits, uncommitted_code]

- id: FINISH_FIRST
  category: process
  protection: PROTECTED
  priority: 9
  title: Finish One Task Fully Before Starting the Next
  statement: Never abandon a task mid-flight to start another. Complete, verify, and
    commit the current task before moving on. Partial work compounds into drift, broken
    state, and lost context. If interrupted, leave a clear checkpoint before switching.
  source: MASTER2 operating principles
  auto_fixable: false
  smells: [task_drift, context_switch, incomplete_work]
- id: STRUCTURAL_INTEGRITY
  category: architecture
  protection: PROTECTED
  priority: 9
  title: Structural Integrity
  statement: >
    Code and data must be structurally sound at every level: atomic (method/key),
    local (module/file), systemic (layer/service), and holistic (whole codebase).
    Defects at any level propagate upward. Apply merge, defrag, decouple, hoist,
    dead-code removal, naming normalisation, and layering enforcement continuously.
  source: MASTER2 structural audit doctrine
  suggest: >
    Run structural_optimization analysis. Check for: god objects, naming drift,
    data duplication, layering violations, scattered related logic, buried constants.
  auto_fixable: true
  llm_strategies: [merge_duplicates, extract_module, hoist_constant, split_god_object]
  smells: [god_class, data_duplication, naming_drift, layering_violation, dead_code, defrag_opportunity]
- id: META_COHERENCE
  category: architecture
  protection: PROTECTED
  priority: 8
  title: Meta-Coherence
  statement: >
    The system must be coherent at every meta-level: code reflects data, data reflects
    constitution, constitution reflects axioms, axioms reflect intent. When a rule is
    added at one level it must be propagated to all relevant levels. When an insight is
    discovered through analysis it must be encoded back into the system so it can
    detect and fix itself.
  source: MASTER2 self-improvement doctrine
  suggest: >
    When adding a rule or insight, ask: is this in the data layer? in the axioms? in
    the constitution? in the smell detectors? in the selfrun pipeline? If not, codify it.
  auto_fixable: false
  llm_strategies: [codify_insight, propagate_rule, encode_pattern]
  smells: [uncodified_insight, rule_lives_only_in_code, data_without_detector]
- id: INVERTED_PYRAMID
  category: layout
  protection: PROTECTED
  priority: 9
  title: Inverted Pyramid — Most Important First
  statement: >
    Every file, module, class, method, and document is laid out top-to-bottom
    by descending importance. Readers and LLMs consume from the top; the most
    signal-dense content must appear first. Apply at every level: file (public
    API before private helpers), section (summary before detail), line (subject
    before predicate), argument (required before optional).
  source: Journalism inverted pyramid + LLM context-window locality
  suggest: >
    Reflow this unit so the most critical content is at the top.
    For Ruby: constants → public interface → core logic → helpers → private.
    For YAML: metadata → ABSOLUTE rules → PROTECTED → ADJUSTABLE → examples.
    For Zsh: shebang+options → constants → main function → helpers → call site.
    For Markdown: title+summary → key concepts → usage → detail → edge cases.
    For method bodies: guard clauses → happy path → error handling → cleanup.
  auto_fixable: true
  llm_strategies: [reflow_by_importance, hoist_public_interface, sink_private_helpers]
  smells: [private_before_public, helpers_before_core, detail_before_summary,
           required_after_optional, critical_after_trivial, setup_after_logic]
- id: STRUNK_WHITE
  category: prose
  protection: PROTECTED
  priority: 9
  title: "Elements of Style — Brevity, Clarity, Meaning"
  statement: >
    Every word, name, and character in every file earns its place or is cut.
    Apply Strunk & White at every layer: identifier names, method bodies,
    comments, error messages, YAML prose, and LLM-generated output.
    Omit needless words. Prefer the active voice. Use definite, specific,
    concrete language. Put the emphatic idea last in a sentence; most important
    section first in a file. Express parallel ideas in parallel form.
    Never affect a breezy or bureaucratic manner.
  source: "Strunk & White, The Elements of Style (4th ed.)"
  rules:
    omit_needless_words:
      statement: "Vigorous writing is concise. Omit every word that serves no purpose."
      code_translation: "No filler identifiers (data, info, thing, object, value, result alone),
        no filler comments ('This method does X' when def name already says so),
        no filler phrases in strings ('in order to', 'the fact that', 'it is important to note')."
    active_voice:
      statement: "Prefer the active voice. The active voice is usually more direct and vigorous."
      code_translation: "Method names are verbs in active form: enforce (not be_enforced),
        scan (not be_scanned), reflow (not get_reflowed). Error messages name the actor:
        'Enforcer rejected X' not 'X was rejected'."
    positive_form:
      statement: "Put statements in positive form. Avoid tame, colourless, hesitating negatives."
      code_translation: "Guard clauses state what is wrong, not what is missing.
        'raise if path.nil?' → 'raise \"path required\"'. Prefer presence checks over absence checks."
    definite_concrete:
      statement: "Prefer the specific to the general, the definite to the vague, the concrete to the abstract."
      code_translation: "Name things by what they ARE, not what they contain.
        axiom_list not data; violation_count not number; council_persona not item.
        Error messages name the exact file, value, or constraint violated."
    parallel_form:
      statement: "Express coordinate ideas in similar form."
      code_translation: "Method families share grammatical structure: scan/enforce/reflow, not
        scan/do_enforcement/run_reflow. Enum members parallel: :shallow/:own/:deep/:full."
    emphatic_end:
      statement: "The emphatic word belongs at the end of a sentence."
      code_translation: "In a method chain, the transforming verb comes last.
        In an error message, the actionable instruction is the final clause."
    no_qualifiers:
      statement: "Do not overstate. Rather, very, little, pretty — cut them."
      code_translation: "No 'basically', 'essentially', 'actually', 'simply', 'just',
        'really', 'quite' in comments, messages, or doc strings."
    do_not_explain_the_obvious:
      statement: "Do not explain what the reader can see for themselves."
      code_translation: "Comments explain WHY, never WHAT. 'def reflow' needs no comment
        saying '# This method reflows a file'. Comment only when intent would be opaque."
  auto_fixable: false
  llm_strategies:
    - omit_filler_words
    - rename_to_concrete_noun
    - convert_passive_to_active
    - remove_redundant_comment
    - sharpen_error_message
  smells:
    - filler_identifier
    - redundant_comment
    - passive_error_message
    - filler_phrase_in_string
    - vague_noun_identifier
    - zombie_noun
    - qualifier_word
- id: ZEN_METHOD
  category: craft
  protection: PROTECTED
  priority: 8
  title: Zen Method — One Thing, Perfectly
  statement: >
    Every method does exactly one thing at exactly one level of abstraction.
    It has the right name (a single active verb or specific noun), fits in 7 lines
    or fewer, requires no rescue clause, nests no deeper than one conditional,
    and needs no comment to explain what it does.
    A method that satisfies all five conditions is beautiful. Name it when found.
  source: Kent Beck, SLAP principle, Unix philosophy
  virtues:
    - single_responsibility
    - one_abstraction_level
    - right_name
    - minimal_lines
    - no_defensive_clutter
  auto_fixable: false
  llm_strategies: [extract_method, rename_to_intent, flatten_abstraction, remove_rescue_noise]
  smells: [multi_responsibility, mixed_abstraction, over_long_method, rescue_in_pure_method]

- id: AESTHETIC_VIRTUE
  category: craft
  protection: ADJUSTABLE
  priority: 7
  title: Aesthetic Virtue — Exalt Beautiful Code
  statement: >
    Code quality is not only the absence of defects; it is the presence of beauty.
    Beautiful code is recognised, named, and celebrated — not just the absence of noise.
    The system actively scores beauty: naming elegance, composability, orthogonality,
    domain language purity, density, and constitutional alignment.
    A codebase that satisfies its own axioms is self-referentially beautiful.
  source: "Knuth, The Art of Computer Programming; Dijkstra, The Humble Programmer"
  dimensions:
    beauty_score:
      description: "Positive integer counting aesthetic virtues detected in a file or method"
      increments:
        - zen_method_found: +3
        - no_comment_needed: +2
        - perfect_name: +2
        - domain_language_pure: +2
        - composable_chain: +1
        - orthogonal_module: +2
        - dense_expressive: +1
        - constitutional_alignment: +3
    exemplar:
      description: "A method or module so well-crafted it is stored as a positive example for future LLM prompts"
    constitutional_alignment:
      description: "0–10 score per axiom: how well the codebase embodies the axiom (not just avoids violating it)"
  auto_fixable: false
  llm_strategies: [identify_exemplar, score_beauty, praise_virtue, store_exemplar]
