# Compression patterns — filler words and verbose phrases stripped before LLM
# Used by Stages::Compress to reduce token usage per GUARD_EXPENSIVE axiom

fillers:
  - "basically"
  - "essentially"
  - "actually"
  - "literally"
  - "definitely"
  - "certainly"
  - "obviously"
  - "clearly"
  - "simply"
  - "just"
  - "really"
  - "very"
  - "quite"
  - "somewhat"
  - "kind of"
  - "sort of"
  - "a bit"
  - "a little"
  - "you know"
  - "I mean"
  - "like"

phrases:
  - "I was wondering if you could"
  - "Could you please"
  - "I would like you to"
  - "I need you to"
  - "Can you help me"
  - "I am looking for"
  - "I want to know"
  - "Please help me"
  - "I'd appreciate it if"
  - "Would you be able to"
  - "It would be great if"
  - "I think maybe"
  - "I'm not sure but"
  - "as you may know"
  - "needless to say"
