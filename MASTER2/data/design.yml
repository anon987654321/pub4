version: 1
name: "Design + Refactor Codex"
description: "Programmatic rules for typography, layout, visual hierarchy, and code craftsmanship."

terminal_typography:
  description: "Rules for terminal/CLI output -- enforced by check_structural_smells on lib/ui/"
  max_line_length: 100          # wrap or truncate beyond this
  indent_unit: 2                # spaces; never tabs
  section_gap: 1                # blank lines between logical sections
  column_min_width: 8           # minimum column width for tabular output
  truncation_glyph: "..."        # U+2026; never "..."
  numeric_alignment: right      # numbers right-aligned in tables
  status_icons:
    success: "[ok]"
    failure: "[fail]"
    warning: "⚠"
    info:    "ℹ"
    pending: "◦"
    bullet:  "*"
    arrow:   "->"
    chevron: "❯"               # prompt character only
  color_semantics:
    green:   "success, clean state"
    red:     "error, failure, blocked"
    yellow:  "warning, dirty state, cost"
    cyan:    "model name, identifier"
    dim:     "metadata, secondary info, omitted content"
    bold:    "emphasis, section header, prompt character"
  actionable_errors:
    required: true
    format: "⚠  device0: description\n   -> action hint"
  spinner_exit:
    blank_line_after: true      # always puts after success/error
    success_color: green
    failure_color: red
  dmesg_format: "device0 at parent0: description -- no prefix symbols, no box art"

typography:
  line_length:
    min_ch: 45
    max_ch: 75
    ideal_ch: 66
    mobile_min_ch: 35
    mobile_max_ch: 50
  line_height:
    body:
      min: 1.4
      max: 1.6
      preferred: 1.5
    headings:
      min: 1.0
      max: 1.2
    coupling_rule:
      condition: "line_length_ch > 60"
      required_min_line_height: 1.5
  type_scale:
    default_ratio: 1.25
    alternatives:
      - 1.2
      - 1.333
      - 1.618
  letter_spacing:
    all_caps:
      min_em: 0.05
      max_em: 0.15
    heading_min_em: -0.02
    body_lowercase_recommended: 0.0
  contrast:
    normal_text_min: 4.5
    large_text_min: 3.0
  limits:
    max_font_families: 2
    max_font_weights: 3
    max_distinct_font_sizes: 8
  mobile:
    min_input_font_px: 16
    min_touch_target_px: 44
    recommended_touch_target_px: 48

layout:
  grid:
    default_columns: 12
    base_spacing_unit_px: 8
    spacing_scale_px: [4, 8, 16, 24, 32, 48, 64]
  ratio:
    golden: 1.618
    preferred_two_column_split: [62, 38]
  white_space:
    rule: "internal <= external"
  reading_patterns:
    - "f_pattern"
    - "z_pattern"
    - "gutenberg_diagram"
  anti_patterns:
    - "long centered body text"
    - "justified text without hyphenation"
    - "critical CTA outside thumb-safe zone"

visual_hierarchy:
  size_ratios:
    min_step: 1.2
    h1_body_min: 2.0
    h1_body_max: 3.0
    h2_body_min: 1.5
    h2_body_max: 2.0
    h3_body_min: 1.25
    h3_body_max: 1.5
  weight_contrast:
    min_delta: 200

tufte:
  data_ink_ratio_target: 0.9
  lie_factor_target: 1.0
  chartjunk_forbidden:
    - "gratuitous_3d"
    - "decorative_backgrounds"
    - "heavy_non_data_grids"
    - "moire_patterns"

code_craft:
  naming:
    classes: "CamelCase nouns"
    methods: "snake_case verbs"
    predicates: "question_mark_suffix"
    mutators: "bang_suffix_when_dangerous"
    constants: "SCREAMING_SNAKE_CASE"
  functions:
    max_lines: 20
    ideal_lines: 5
    max_params: 3
    single_responsibility: true
    no_side_effects_for_queries: true
    command_query_separation: true
    avoid_flag_arguments: true
  clean_code:
    boy_scout_rule: true
    dry: true
    guard_clauses_preferred: true
    law_of_demeter: true
    no_null_return_preferred: true
  refactoring:
    behavior_preserving: true
    two_hats_required: true
    small_steps_only: true
    tests_required_before_refactor: true
    separate_refactor_from_feature_work: true
  smells:
    long_method: { threshold: 15, preferred_fix: "extract_method" }
    long_parameter_list: { threshold: 3, preferred_fix: "introduce_parameter_object" }
    deep_nesting: { threshold: 3, preferred_fix: "guard_clauses" }
    duplicate_code: { similarity_threshold: 0.8, preferred_fix: "extract_shared_unit" }
    feature_envy: { preferred_fix: "move_method" }
    repeated_switch: { preferred_fix: "replace_with_polymorphism" }

automation:
  css_detection:
    flag_if:
      - "line_length_ch < 45 or line_length_ch > 75"
      - "line_height < 1.4 for body text"
      - "all_caps && (letter_spacing_em < 0.05 || letter_spacing_em > 0.15)"
      - "font_size_px < 16 for body/input text"
      - "contrast_ratio < 4.5 for normal text"
      - "font_families_count > 2"
      - "font_weights_count > 3"
      - "touch_target_px < 44"
  output_profiles:
    concise:
      detail: "summary_only"
    audit:
      detail: "include_violation_evidence_and_fix_hints"

boot_invariants:
  dmesg_format: "device0 at parent0: description -- no prefix symbols, no box art, no brackets"
  single_entry_point: "banner called exactly once, from pipeline/repl.rb. bin/master never calls Boot directly"
  stale_locks_at_start: "cleanup_stale_locks! runs before REPL loop, never after"
  deploy_dir_only: "deploy scripts live exclusively under deploy/. No ad-hoc scripts in sh/ or root"

safe_require_pattern:
  description: "Optional modules use safe_require with silent: true. Never warn at boot for expected-absent modules"
  usage: "safe_require 'module_name', silent: true"
  rationale: "Clean dmesg boot output -- noise-free unless genuinely unexpected"

preserve:
  rationale: "Streamline means remove redundancy, not information"
  polish_rules:
    - "'Streamline' means remove redundancy, not information"
    - "'Polish' means refine wording, not delete output"
    - "'Minimize' applies to tokens in prompts, not diagnostic output"
    - "'Simplify' means reduce complexity, not reduce completeness"
  boot_message:
    format: "OpenBSD dmesg style, 5-7 lines"
    never: "Collapse to single cryptic line"
  diagnostic_output:
    rule: "Structured multi-line output is intentional -- verbose is correct here"
    never: "Compress to cryptic abbreviations"
  help_text:
    minimum_info: ["command name and syntax", "brief description", "at least one example"]
    never: "Truncate below minimum_info"
  spinner_feedback:
    rule: "Progress indicators show elapsed time and current step"

structural_optimization:
  description: >
    Taxonomy of structural optimization techniques, applicable at atomic (method/key),
    local (module/file), systemic (layer), holistic (whole codebase), and meta
    (the system's model of itself) levels. Apply continuously during selfrun and review.

  techniques:
    merge:
      description: "Combine identical or near-identical units into one authoritative version"
      triggers: ["same logic in 2+ places", "parallel class hierarchies", "duplicate YAML keys", "synonym constants"]
      levels: [atomic, local, systemic]
      anti_pattern: "copy-paste with minor variation"
      fix: "extract to shared method/module/constant; parameterise differences"

    defrag:
      description: "Relocate scattered related logic so cohesive things are co-located"
      triggers: ["feature split across 3+ files", "YAML keys for same concept in different files", "half the logic here, half there"]
      levels: [local, systemic]
      anti_pattern: "logic about X living in a file named Y"
      fix: "move to canonical home; update all call-sites"

    decouple:
      description: "Sever direct dependencies; inject or configure instead of hard-wiring"
      triggers: ["hardcoded class name", "hardcoded path constant", "module calling up its own stack", "UI inside business logic"]
      levels: [atomic, local, systemic]
      anti_pattern: "FeatureEnvy, InappropriateIntimacy, LayeringViolation"
      fix: "dependency injection, config-driven, event bus, interface boundary"

    hoist:
      description: "Lift buried logic to the appropriate higher level where it belongs"
      triggers: ["constant computed inside method on every call", "regex recompiled in hot path", "config read inline", "magic number without name"]
      levels: [atomic, local]
      anti_pattern: "premature burial -- logic deeper than its natural home"
      fix: "extract to initializer, class constant, or config file"

    dead_code_removal:
      description: "Delete unreachable methods, unused constants, never-read YAML keys, orphaned files"
      triggers: ["method never called", "YAML key never grep'd in lib/", "constant defined but not referenced", "commented-out blocks > 5 lines"]
      levels: [atomic, local, systemic]
      anti_pattern: "code commented 'just in case'"
      fix: "delete; git history is the backup"

    normalise:
      description: "Make the same concept represented identically everywhere (naming, schema, scale)"
      triggers: ["banned vs forbidden vs blocked vs prohibited", "priority vs weight vs tier vs level", "axiom schema differs per file"]
      levels: [atomic, local, systemic, data]
      anti_pattern: "naming drift, schema drift"
      fix: "pick canonical name/schema; migrate all sites; add linter rule"

    abstract:
      description: "Introduce a missing abstraction where a pattern repeats without a name"
      triggers: ["same 4-line idiom in 5+ places", "caller has to know too much about callee internals", "no word for a concept that clearly exists"]
      levels: [local, systemic]
      anti_pattern: "abstraction gap"
      fix: "name the concept; extract class/module/YAML section; document"

    layer:
      description: "Enforce strict layering -- each layer may only call downward"
      triggers: ["UI code in business logic", "persistence in domain model", "enforcement calling LLM", "analysis writing to disk"]
      levels: [systemic, holistic]
      anti_pattern: "LayeringViolation, GoThroughTheRoof"
      fix: "move code to correct layer; return result upward; inject dependencies"

    split:
      description: "Divide a god object into focused single-responsibility units"
      triggers: ["file > 300 lines", "module with 4+ unrelated concerns", "class with > 10 public methods", "YAML file mixing 3 concepts"]
      levels: [local, systemic]
      anti_pattern: "GodClass, GodModule, GodYAML"
      fix: "extract by responsibility axis; one file per concept"

    codify:
      description: "Encode discovered insights, rules, patterns back into the data layer so the system can detect and fix itself"
      triggers: ["insight exists only in a PR comment", "rule enforced only in code review", "pattern found manually but no smell detector", "analysis question asked but not persisted"]
      levels: [meta, meta_meta]
      anti_pattern: "uncodified insight -- knowledge that lives only in human heads or chat history"
      fix: "add to axioms.yml / smells.yml / design_codex.yml / language_axioms.yml; wire to selfrun"

  levels:
    atomic: "single method, key, constant, line"
    local: "file, module, class, YAML section"
    systemic: "layer, subsystem, feature area"
    holistic: "whole codebase, all data, all config"
    meta: "the system's rules about itself (axioms, constitution, codex)"
    meta_meta: "the system's rules about its rules (how axioms are structured, how codex evolves)"

  application_order:
    - dead_code_removal    # clear the ground first
    - normalise            # establish canonical vocabulary
    - merge                # collapse duplicates
    - defrag               # co-locate related things
    - hoist                # lift buried logic
    - abstract             # name recurring patterns
    - decouple             # sever hard dependencies
    - layer                # enforce stack discipline
    - split                # break god objects
    - codify               # encode what was learned back into data

  selfrun_phases:
    phase1_static: [dead_code_removal, normalise, merge, hoist]
    phase2_semantic: [defrag, abstract, decouple]
    phase3_architectural: [layer, split]
    phase4_meta: [codify]

  checklist:
    atomic:
      - "Are there 2+ methods that do the same thing?"
      - "Is there a magic number/string that needs a name?"
      - "Is there a regex compiled inside a hot path?"
      - "Is there a method named get_X (smell: generic verb)?"
    local:
      - "Does this file do more than one job?"
      - "Is there logic about X living in a file named Y?"
      - "Are there dead methods (never called)?"
      - "Does this YAML key appear in another file too?"
    systemic:
      - "Does any layer call upward in the stack?"
      - "Are there 3+ ways to load the same config?"
      - "Is the same concept named differently in different modules?"
      - "Do multiple modules implement the same pattern independently?"
    holistic:
      - "Is every rule in code also in the data layer?"
      - "Does the constitution reflect the axioms?"
      - "Are all analysis insights encoded as smell detectors?"
      - "Is there a single canonical home for each type of knowledge?"
    meta:
      - "When we discover a new pattern, do we codify it immediately?"
      - "Do the axioms cover all the techniques in this taxonomy?"
      - "Is the taxonomy itself versioned and evolvable?"
      - "Can selfrun detect violations of its own structural rules?"

importance_flow:
  description: >
    Every file is a document. Documents are read top-to-bottom.
    The most important content must be at the top. Apply the inverted pyramid
    at every level of granularity -- file, section, method, line, argument.
    This is not optional formatting; it is structural communication.

  principle: "most important first, least important last -- always"

  levels:
    file:
      description: "Macro layout of a source file"
      order:
        ruby:
          - "# frozen_string_literal: true"
          - "require / require_relative"
          - "Module/class constants (SCREAMING_SNAKE)"
          - "Class-level DSL (attr_*, validates, belongs_to, has_many...)"
          - "Public class methods (.new, .call, .build...)"
          - "Public instance methods -- core interface"
          - "Public instance methods -- secondary"
          - "protected methods"
          - "private methods -- called most -> called least"
          - "END: private one-liners, aliases"
        yaml:
          - "version, name, description (metadata)"
          - "ABSOLUTE protection rules"
          - "PROTECTED rules"
          - "ADJUSTABLE / contextual rules"
          - "Examples, templates, commentary"
        zsh:
          - "#!/usr/bin/env zsh"
          - "set -euo pipefail + setopt"
          - "Constants / configuration"
          - "Main function (main())"
          - "Helper functions -- by call order"
          - "main call site (main \"$@\")"
        markdown:
          - "# Title -- one line"
          - "One-sentence summary"
          - "Key concept or TL;DR"
          - "Usage / quickstart"
          - "Reference / details"
          - "Edge cases / appendix"

    section:
      description: "Within any coherent block (class body, YAML section, doc section)"
      rule: "Lead with the invariant/contract, follow with implementation detail"
      examples:
        - "YAML: required keys before optional keys"
        - "Ruby method: guard clauses before happy path"
        - "Comment block: what/why before how"

    method:
      description: "Within a method body"
      order:
        - "Guard clauses (early returns for invalid input)"
        - "Setup / variable binding"
        - "Core logic (the one thing the method does)"
        - "Result construction"
        - "Error handling / rescue"
        - "Cleanup / ensure"
      anti_pattern: "Rescue clause before main logic; setup after core logic"

    argument:
      description: "Method/function parameter ordering"
      order:
        - "Required positional arguments"
        - "Optional positional arguments (with defaults)"
        - "Required keyword arguments"
        - "Optional keyword arguments"
        - "Block (always last)"
      anti_pattern: "Optional param before required; **opts before named keywords"

    line:
      description: "Within a single expression"
      rule: "Subject (what acts) before predicate (what happens); condition before consequence"
      examples:
        - "result = compute(x) -- not compute(x) => result"
        - "return early if invalid? -- not if invalid? then return end"
        - "important && secondary -- not secondary && important"

  smells:
    private_before_public:
      check: "private keyword appears before any public method definition"
      severity: high
      autofix: true

    helpers_before_core:
      check: "Helper/utility method defined above the primary method that calls it"
      severity: medium
      autofix: true

    detail_before_summary:
      check: "File/section opens with implementation detail rather than public contract"
      severity: medium
      autofix: false

    required_after_optional:
      check: "Required method parameter follows an optional one"
      severity: high
      autofix: true

    setup_after_logic:
      check: "Variable assignment after core logic expression in same method"
      severity: low
      autofix: true

    rescue_before_logic:
      check: "rescue clause wraps the entire method body instead of minimal scope"
      severity: medium
      autofix: false

  reflow_command:
    trigger: "reflow <path>"
    description: >
      LLM-assisted reflow pass. Reads the file, scores each section by importance
      (public API > private helper, summary > detail, required > optional),
      reorders sections preserving all logic, writes result. Runs enforcer after.
    prompt_hint: >
      Reflow this file top-to-bottom by descending importance.
      Most important content first: public interface, core logic, guards.
      Least important last: private helpers, cleanup, edge cases.
      Preserve all logic exactly -- only reorder sections.
      Output the complete reflowed file.

  linting:
    ruby_checks:
      - "private before def: scan for 'private' keyword followed immediately by a method that is called from public context"
      - "rescue wraps def body: def foo ... rescue ... end pattern"
      - "optional param before required: def foo(a = 1, b) -- SyntaxError in Ruby but watch for keyword variants"
    yaml_checks:
      - "examples before rules: scan for 'example' or 'template' key appearing before 'rules' or 'detect'"
      - "ADJUSTABLE before PROTECTED"
    zsh_checks:
      - "helper function defined before main function"
      - "main call site before function definitions"

prose_style:
  # Strunk & White -- Elements of Style -- applied to every word in every file.
  # Rule zero: if a word does not add meaning, remove it.

  source: "Strunk & White, The Elements of Style (4th ed.) mapped to code"

  principle: "omit needless words -- in names, comments, messages, and data"

  rules:
    omit_needless_words:
      description: "Every identifier, comment, and string is as short as it can be without losing meaning."
      banned_filler_identifiers:
        - data       # -> name what the data IS: axiom_list, violation_count, persona
        - info       # -> specific noun: file_stats, build_result
        - thing      # always replaceable
        - item       # -> element, axiom, violation, persona
        - object     # -> the actual Ruby class name
        - value      # -> cost, score, count, ratio
        - result     # only acceptable as a Result monad variable; never as a concept
        - temp       # -> name what it holds
        - tmp        # same
        - stuff       # unconditionally banned
        - misc       # unconditionally banned
        - helper     # -> name what the help IS
        - util       # -> name the domain
        - manager    # -> Coordinator, Registry, Router, Store
        - handler    # -> name what is handled: ViolationReporter, AxiomLoader
        - processor  # -> name the transform: Reflower, Enforcer, Scanner
      banned_filler_phrases:
        - "in order to"
        - "the fact that"
        - "it is important to note"
        - "it should be noted"
        - "please note"
        - "as you can see"
        - "needless to say"
        - "at the end of the day"
        - "basically"
        - "essentially"
        - "actually"
        - "simply"
        - "just"       # in prose; fine in code as keyword
        - "really"
        - "quite"
        - "very"
        - "a little"
        - "sort of"
        - "kind of"
      banned_qualifier_words_in_prose:
        - rather
        - little
        - pretty
        - fairly

    active_voice:
      description: "Methods, error messages, and comments use active voice."
      good_examples:
        - "Enforcer rejected axiom STRUNK_WHITE"
        - "Scanner found 3 violations"
        - "reflow rewrites the file"
      bad_examples:
        - "X was rejected by the enforcer"
        - "3 violations were found"
        - "the file is rewritten by reflow"
      method_naming:
        rule: "Method names are active verbs: enforce, scan, reflow, build, load, write."
        banned_passive_prefixes: [get_, do_, perform_, process_, run_, handle_, execute_, manage_]
        exceptions: [run_phase1, run_phase2, run_phase3]  # selfrun phases use run_ by convention

    definite_concrete:
      description: "Name things by what they ARE, not what they contain or do in the abstract."
      pattern: "noun = domain concept, not container type"
      examples:
        bad:  [data_list, info_hash, value_array, item_count, object_map]
        good: [axiom_list, violation_hash, cost_array, persona_count, model_map]

    parallel_form:
      description: "Coordinate things share grammatical structure."
      method_families:
        - [scan, enforce, reflow, review]          # all verbs, all present tense
        - [shallow, own, deep, full]               # all adjectives
        - [build, load, write, parse]              # all verbs
      anti_pattern: "scan / do_enforcement / run_reflow -- inconsistent verb form"

    do_not_explain_the_obvious:
      description: "Comments explain WHY, never WHAT the next line does."
      rule: "If the comment restates the method name or the expression, delete the comment."
      good_comment: "# Weaviate throws on cold-start; suppress until first successful ping"
      bad_comment:  "# This calls the LLM with the prompt"
      test: "Cover the comment. Can you still understand the code? If yes, cut the comment."

    sharpen_error_messages:
      description: "Error messages name the exact constraint, file, and value violated."
      structure: "[actor] [verb] [noun]: [specific detail]. [optional: action hint]"
      examples:
        bad:
          - "An error occurred"
          - "Invalid value"
          - "Something went wrong"
          - "Could not process"
        good:
          - "GroundedContext: file not found: lib/executor/context.rb"
          - "Enforcer: ABSOLUTE axiom DRY violated in pipeline.rb:42 -- duplicate require"
          - "LLM: token budget exceeded (128 000 / 60 000). Pass depth: :shallow to reduce context."

    zombie_nouns:
      description: "Zombie nouns (nominalizations) drain vigour. Convert to verbs."
      examples:
        bad:  [the refactoring of, a validation of, the enforcement of, the processing of]
        good: [refactor, validate, enforce, process]
      pattern: "If a noun ends in -tion, -ment, -ance, -ence, -ity, and a verb form exists -- use the verb."

  linting:
    applies_to: [comments, string_literals, error_messages, yaml_descriptions, method_names, variable_names]
    severity_map:
      filler_identifier: high      # data, info, thing, stuff, misc
      redundant_comment: medium    # comment restates method name
      passive_error_message: medium
      filler_phrase_in_string: low
      qualifier_word_in_string: low
      zombie_noun: low

aesthetic_excellence:
  # How the system recognises, scores, and exalts beautiful code.
  # Beauty is the presence of virtue, not only the absence of defect.

  principle: "exalt the excellent; do not only punish the poor"

  beauty_score:
    description: >
      A positive integer displayed alongside violation count.
      High score = beautiful. Zero violations + high score = exemplary.
    display: "✦ {score}"
    virtues:
      zen_method:
        points: 3
        test: "Method ≤ 7 lines, one responsibility, one abstraction level, no rescue, nesting ≤ 1"
      no_comment_needed:
        points: 2
        test: "Method/class has zero comments and is self-evident from names alone"
      perfect_name:
        points: 2
        test: "Name is a single active verb or specific domain noun; makes its comment redundant"
      domain_language_pure:
        points: 2
        test: "All names in a module drawn from one semantic field (e.g. all judicial, all musical, all geometric)"
      composable_chain:
        points: 1
        test: "Method chain reads as natural subject->verb->object English"
      orthogonal_module:
        points: 2
        test: "Module has zero shared mutable state with any other module"
      dense_expressive:
        points: 1
        test: "Method expresses ≥ 3 meaningful operations in ≤ 5 lines"
      self_referential:
        points: 3
        test: "System satisfies its own axioms when run against itself"

  exemplar_registry:
    file: "data/exemplars.yml"
    description: >
      Methods and modules so well-crafted they serve as positive examples
      in future LLM prompts. Stored with name, file, why it's beautiful.
    fields: [name, file, lines, beauty_score, virtue, why]
    injection: "Cited in LLM system message as: EXEMPLARS: {name} in {file} -- {why}"

  constitutional_alignment:
    description: >
      For each axiom, a score 0-10 of how well the codebase embodies it --
      not just avoids violations. Rendered as a sparkline in `status`.
    sparkline_chars: "░▒▓█"
    display_example: "DRY ████░  KISS █████  ZEN ███░░"

  council_praise:
    description: >
      Council personas can emit PRAISE votes in addition to APPROVE/REJECT.
      A PRAISE vote logs the reason to the exemplar registry.
    verdict_values: [APPROVE, REJECT, PRAISE]
    praise_format: "PRAISE: {what} because {why}"

  read_aloud_test:
    description: >
      Code that reads as fluent English prose when spoken aloud is structurally beautiful.
      Injected as a heuristic into the LLM prompt.
    prompt_hint: >
      Read your output aloud (mentally). If it flows as natural English --
      subject acts on object, guards come first, the important thing is named first --
      then it is well-structured. Revise until it reads cleanly.

  interface_ratio:
    description: "Public methods : private helpers. Ideal ≥ 1.0. Penalise ratios below 0.3."
    beauty_threshold: 1.0
    smell_threshold: 0.3
    label: "interface dominates implementation"

  fractal_consistency:
    description: >
      The same design principles applied at method, class, module, and system level.
      When detected at all four levels simultaneously, the codebase is self-similar -- beautiful.
