# Detection patterns: language-specific axioms + cross-language smells

# Language-specific beauty axioms for MASTER2's refactoring engine
# Detection rules + design philosophy across all supported languages

ruby:
  - id: prefer_each_with_object
    name: "Prefer each_with_object over inject for hash"
    detect: '\.(inject|reduce)\(\s*\{\s*\}\s*\)'
    suggest: "Use .each_with_object({}) instead -- eliminates mutable-return footgun"
    severity: warning
    autofix: false
  - id: guard_clause_over_nested
    name: "Favor guard clauses over nested conditionals"
    detect: '^\s*def \w+.*\n\s*if .+\n(?:.*\n)*?\s*else\n(?:.*\n)*?\s*end\s*$'
    suggest: "Flatten to: return ... unless condition"
    severity: info
    autofix: false
  - id: safe_navigation_chain
    name: "Use &. safe navigation consistently"
    detect: '(\w+)\s*&&\s*\1\.\w+'
    suggest: "Rewrite to x&.foo&.bar"
    severity: warning
    autofix: true
  - id: freeze_collection_constants
    name: "Freeze all collection literals assigned to"
    detect: '^\s*[A-Z][A-Z_]*\s*=\s*[\[{](?!.*\.freeze)'
    suggest: "Add .freeze to prevent mutation: CONST = [...].freeze"
    severity: warning
    autofix: true
  - id: module_function_over_extend_self
    name: "Prefer module_function where appropriate"
    detect: 'extend self\n.*class << self'
    suggest: "Consider module_function for cleaner intent"
    severity: info
    autofix: false
  - id: keyword_args_over_positional
    name: "Enforce keyword arguments for ≥3 parameters"
    detect: 'def \w+\([^)]*,\s*[^:)]+,\s*[^:)]+,\s*[^:)]+\)'
    suggest: "Use keyword arguments for clarity and safety"
    severity: info
    autofix: false
  - id: kernel_coercion
    name: "Prefer Array(), Hash(), String() kernel coercions"
    detect: '(\w+)\s*\.\s*nil\?\s*\?\s*\[\]\s*:\s*\1|(\w+)\s*\|\|\s*\[\]'
    suggest: "Use Array(x) instead of x.nil? ? [] : x"
    severity: info
    autofix: true
  - id: include_comparable
    name: "Use Comparable instead of manual comparison"
    detect: 'def <\(|def >\(|def <=>\('
    suggest: "include Comparable and define <=> only"
    severity: info
    autofix: false
  - id: rescue_on_def
    name: "Move begin/rescue wrapping entire method to"
    detect: '^\s*def \w+.*\n\s*begin\n(?:.*\n)*?\s*rescue'
    suggest: "Put rescue directly on the def block"
    severity: info
    autofix: false
  - id: use_tap
    name: "Promote tap for inline debugging and"
    detect: '(\w+)\s*=\s*\w+\.new\n\s*\1\.\w+\s*=.*\n\s*\1\s*$'
    suggest: "Use Foo.new.tap { |o| o.bar = val }"
    severity: info
    autofix: false
  - id: percent_literal_arrays
    name: "Favor %i[] and %w[] for symbol/string"
    detect: '\[:[a-z_]+,\s*:[a-z_]+,\s*:[a-z_]+'
    suggest: "Use %i[a b c] for symbol arrays"
    severity: info
    autofix: true
  - id: transform_keys_values
    name: "Use transform_keys/transform_values over manual hash iteration"
    detect: '\.each_with_object\(\{\}\)\s*\{\s*\|\(k,\s*v\),\s*h\|'
    suggest: "Use .transform_values { |v| ... } (Ruby 2.5+)"
    severity: info
    autofix: false
  - id: use_then_pipeline
    name: "Use .then for single-line pipeline transforms"
    detect: '(\w+)\s*=\s*\w+\(.*\)\n\s*\w+\(\1\)'
    suggest: "Chain with .then { |r| next_step(r) }"
    severity: info
    autofix: false
  - id: hash_fetch_over_bracket_or
    name: "Prefer Hash#fetch over [] with ||"
    detect: '\w+\[:\w+\]\s*\|\|'
    suggest: "Use hash.fetch(:key, default) for nil-vs-false safety"
    severity: info
    autofix: false
  - id: private_section_placement
    name: "Enforce single private section at bottom"
    detect: 'private\s+:\w+'
    suggest: "Use a single 'private' keyword with methods below it"
    severity: info
    autofix: false
  - id: silent_rescue_nil
    name: "Rescue swallows error and returns nil"
    detect: 'rescue\s+StandardError\s*\n\s*nil\s*$'
    suggest: "FAIL_VISIBLY: log the error before returning nil -- rescue StandardError => e; Logging.warn(...); nil"
    severity: warning
    autofix: true
  - id: streaming_without_epipe
    name: "Streaming write without EPIPE rescue"
    detect: 'connection\.write.*\n(?:(?!rescue Errno::EPIPE)[\s\S])*?connection\.flush'
    suggest: "EXPECT_FAILURE: SSE/WebSocket writes must rescue Errno::EPIPE for client disconnect"
    severity: warning
    autofix: true
  - id: stale_deprecation_marker
    name: "Deprecated marker on actively-used alias"
    detect: '#\s*deprecated:\s*use\s+'
    suggest: "PRUNE: either migrate all callers to the new name or remove the deprecated marker"
    severity: info
    autofix: false

rails:
  - id: detect_n_plus_one
    name: "Detect N+1 queries by static pattern"
    detect: '\.(each|map|collect)\s*(do|\{).*\.\w+\.\w+'
    suggest: "Add .includes(:association) to prevent N+1"
    severity: warning
    autofix: false
  - id: strict_loading
    name: "Enforce strict_loading on associations"
    detect: '(has_many|belongs_to|has_one)\s+:\w+(?!.*strict_loading)'
    suggest: "Add strict_loading: true for dev/test"
    severity: info
    autofix: false
  - id: scope_over_class_method
    name: "Prefer scopes over class methods for"
    detect: 'def self\.\w+.*\n\s*where\('
    suggest: "Use scope :name, -> { where(...) }"
    severity: info
    autofix: false
  - id: find_each_over_each
    name: "Use find_each for batch processing"
    detect: '\.(all\.each|where\(.*\)\.each)\b'
    suggest: "Use .find_each(batch_size: 1000) for memory efficiency"
    severity: warning
    autofix: false
  - id: no_update_attribute
    name: "Replace update_attribute with update!"
    detect: '\.update_attribute\('
    suggest: "update_attribute skips validations -- use update!"
    severity: error
    autofix: true
  - id: callback_extraction
    name: "Extract long callbacks to service objects"
    detect: '(after_create|before_save|after_save)\s+:\w+(?=.*\n(?:.*\n){5,})'
    suggest: "Extract callback logic >5 lines to a service object"
    severity: info
    autofix: false
  - id: frozen_string_literal_auto
    name: "Auto-add frozen_string_literal magic comment"
    detect: '\A(?!# frozen_string_literal)'
    suggest: "Add # frozen_string_literal: true as first line"
    severity: warning
    autofix: true
  - id: pluck_over_map
    name: "Prefer pluck over map for single-column"
    detect: '\.\w+\.map\(&:\w+\)'
    suggest: "Use .pluck(:column) to avoid AR object instantiation"
    severity: info
    autofix: false
  - id: use_delegate
    name: "Use delegate instead of manual delegation"
    detect: 'def (\w+)\n\s*\w+\.\1\n\s*end'
    suggest: "Use delegate :method, to: :association"
    severity: info
    autofix: false
  - id: strong_params_exhaustive
    name: "Enforce strong parameters exhaustiveness"
    detect: '\.permit\('
    suggest: "Cross-reference .permit() list with schema.rb columns"
    severity: info
    autofix: false

zsh:
  - id: quote_variables
    name: "Always quote $variables"
    detect: '(?<!["\x27\\])\$\w+(?!["\x27])'
    suggest: 'Use "$VAR" to prevent word splitting and glob expansion'
    severity: error
    autofix: true
  - id: double_bracket_test
    name: "Use [[ ]] over [ ]"
    detect: '(?<!\[)\[\s+[^[]'
    suggest: "Use [[ ... ]] for safe conditionals"
    severity: warning
    autofix: true
  - id: dollar_paren_over_backtick
    name: "Replace backticks with $(command)"
    detect: '`[^`]+`'
    suggest: "Use $(command) -- nestable and readable"
    severity: warning
    autofix: true
  - id: local_in_functions
    name: "Use local for function variables"
    detect: '^\w+\(\)\s*\{[^}]*\n\s+\w+='
    suggest: "Declare with 'local' to prevent global leaks"
    severity: warning
    autofix: false
  - id: parameter_expansion_default
    name: "Prefer ${var:-default} over if/then"
    detect: 'if \[ -z "\$\w+" \]; then\s+\w+=\w+'
    suggest: 'Use ${var:-default} for concise defaults'
    severity: info
    autofix: false
  - id: strict_mode
    name: "Use set -euo pipefail at script"
    detect: '^#!/.*(?:ba|z)sh\n(?!set -)'
    suggest: "Add 'set -euo pipefail' after shebang"
    severity: error
    autofix: true
  - id: useless_cat
    name: "Replace cat file | command with"
    detect: 'cat\s+\S+\s*\|'
    suggest: "Use command < file (Useless Use of Cat)"
    severity: info
    autofix: true
  - id: heredoc_for_multiline
    name: "Use heredocs for multi-line strings"
    detect: 'echo\s+".*"\n\s*echo\s+".*"\n\s*echo\s+"'
    suggest: "Use heredoc: cat <<'EOF'"
    severity: info
    autofix: false
  - id: banned_external_commands
    name: "Banned external commands -- use pure"
    detect: '\b(sed|awk|tr|grep|cut|wc|head|tail|find|sort|uniq|basename|dirname|realpath|readlink|seq|expr|xargs|python|python3|bash|getopts|sudo)\b'
    suggest: "Replace with pure zsh: sed->${var//a/b}, awk->${(s:,:)str}[n], grep->${(M)arr:#*pat*}, find->**/*.ext(.), basename->${f:t}, dirname->${f:h}, realpath->${f:A}, sort->${(o)arr}, uniq->${(u)arr}, wc->${#arr}, head->${arr[1,n]}, tail->${arr[-n,-1]}"
    severity: error
    autofix: false
  - id: no_modifier_t_without_full_path
    name: "Glob :t modifier loses full path"
    detect: '\*\*\/\*\(\/\s*:t\)'
    suggest: "Remove :t from glob qualifier -- iterate full paths and use ${f:t} inline if basename needed. :t in glob loses the directory component causing broken path reconstruction."
    severity: error
    autofix: false
  - id: zparseopts_over_getopts
    name: "Use zparseopts instead of getopts"
    detect: '\bgetopts\b'
    suggest: "Use zparseopts -D -E -F (zsh/zutil) -- supports long options, cleaner than getopts"
    severity: warning
    autofix: false
  - id: setopt_extended_glob
    name: "setopt extendedglob required for advanced patterns"
    detect: '^#!/.*zsh\n(?!.*setopt.*extendedglob)'
    suggest: "Add 'setopt nullglob extendedglob' after set -euo pipefail"
    severity: warning
    autofix: true
  - id: typeset_A_for_dicts
    name: "Use typeset -A for associative arrays"
    detect: 'declare\s+-A\b'
    suggest: "Prefer typeset -A over declare -A in zsh (typeset is the canonical zsh form)"
    severity: info
    autofix: true

  - id: semantic_elements
    name: "Enforce semantic HTML5 elements"
    detect: '<div\s+class="(header|footer|nav|main|sidebar|article|section)"'
    suggest: "Use <header>, <footer>, <nav>, <main>, <aside>, <article>, <section>"
    severity: warning
    autofix: true
  - id: img_alt_required
    name: "Require alt on every <img>"
    detect: '<img\s+(?![^>]*alt=)'
    suggest: "Add alt= attribute (use alt=\"\" for decorative images)"
    severity: error
    autofix: false
  - id: button_over_anchor
    name: "Prefer <button> over <a href=\"#\">"
    detect: '<a\s+href=["'']#["'']'
    suggest: "Use <button> for actions -- accessible by default"
    severity: warning
    autofix: false
  - id: time_element
    name: "Use <time datetime=\"\"> for dates"
    detect: '\d{4}-\d{2}-\d{2}(?!.*<time)'
    suggest: "Wrap dates in <time datetime=\"ISO8601\">"
    severity: info
    autofix: false
  - id: html_lang
    name: "Enforce lang attribute on <html>"
    detect: '<html(?!\s+[^>]*lang=)'
    suggest: "Add lang=\"en\" (or appropriate locale)"
    severity: error
    autofix: true
  - id: no_inline_styles
    name: "Replace inline styles with classes"
    detect: '\bstyle="[^"]*"'
    suggest: "Extract to CSS class for cacheability"
    severity: warning
    autofix: false
  - id: erb_partials
    name: "Use ERB partials for repeated blocks"
    detect: null
    suggest: "Extract repeated ≥3-line blocks to _partial.html.erb"
    severity: info
    autofix: false
  - id: content_tag_helpers
    name: "Prefer content_tag/tag helpers over raw HTML"
    detect: '["'']<\w+[^"'']*>["'']'
    suggest: "Use Rails tag() or content_tag() helpers"
    severity: info
    autofix: false
  - id: aria_on_interactive
    name: "Enforce ARIA on non-semantic interactive elements"
    detect: '<(div|span)\s+[^>]*onclick'
    suggest: "Add role= and tabindex= for accessibility"
    severity: warning
    autofix: false
  - id: lazy_loading_images
    name: "Use loading=\"lazy\" on below-fold images"
    detect: '<img\s+(?![^>]*loading=)'
    suggest: "Add loading=\"lazy\" for below-fold images"
    severity: info
    autofix: true

css_scss:
  - id: logical_properties
    name: "Prefer logical properties over physical"
    detect: '(margin|padding)-(left|right):'
    suggest: "Use margin-inline-start/end, padding-inline-start/end for RTL support"
    severity: info
    autofix: true
  - id: custom_properties_over_magic
    name: "Replace magic numbers with CSS custom"
    detect: '(?:margin|padding|gap|font-size):\s*\d+px'
    suggest: "Extract to var(--spacing-*) or var(--size-*)"
    severity: info
    autofix: false
  - id: gap_over_margins
    name: "Prefer gap over margin hacks for"
    detect: '\+\s*\w+\s*\{[^}]*margin-(left|top):'
    suggest: "Use gap on the flex/grid container instead"
    severity: info
    autofix: false
  - id: clamp_typography
    name: "Use clamp() for fluid typography"
    detect: '@media.*\{[^}]*font-size:'
    suggest: "Use font-size: clamp(1rem, 2.5vw, 1.5rem)"
    severity: info
    autofix: false
  - id: mobile_first
    name: "Enforce mobile-first media queries"
    detect: '@media\s*\(\s*max-width'
    suggest: "Use min-width (mobile-first, progressive enhancement)"
    severity: warning
    autofix: false
  - id: use_forward_over_import
    name: "Replace @import with @use/@forward in SCSS"
    detect: '@import\s+["\x27]'
    suggest: "@import is deprecated -- use @use/@forward"
    severity: warning
    autofix: false
  - id: no_important
    name: "Detect and flag !important"
    detect: '!\s*important'
    suggest: "Restructure selectors to avoid specificity bankruptcy"
    severity: warning
    autofix: false
  - id: is_where_selectors
    name: "Use :is()/:where() for selector grouping"
    detect: '(\.[a-z]+\s+\.\w+),\s*(\.[a-z]+\s+\.\w+),\s*(\.[a-z]+\s+\.\w+)'
    suggest: "Use :is(.a, .b, .c) .target for grouped selectors"
    severity: info
    autofix: false
  - id: consistent_naming
    name: "Enforce consistent naming convention (BEM or"
    detect: '__.*--.*\n(?:.*\n)*?(?!.*__)'
    suggest: "Pick one naming convention (BEM or utility) per project"
    severity: info
    autofix: false
  - id: intrinsic_sizing
    name: "Replace fixed dimensions with intrinsic sizing"
    detect: 'width:\s*\d+px;\s*\n\s*height:\s*\d+px'
    suggest: "Use min/max-width and aspect-ratio for responsive behavior"
    severity: info
    autofix: false

javascript:
  - id: const_by_default
    name: "Prefer const by default, let only"
    detect: '\blet\s+(\w+)\s*='
    suggest: "Use const unless the variable is reassigned"
    severity: warning
    autofix: false
  - id: optional_chaining
    name: "Use optional chaining ?. over &&"
    detect: '(\w+)\s*&&\s*\1\.\w+'
    suggest: "Rewrite to obj?.foo?.bar"
    severity: warning
    autofix: true
  - id: nullish_coalescing
    name: "Use ?? over || for defaults"
    detect: '(\w+)\s*\|\|\s*\w+'
    suggest: "Use ?? when 0 or '' are valid values"
    severity: info
    autofix: false
  - id: for_of_over_for_in
    name: "Prefer for...of over for...in for arrays"
    detect: 'for\s*\(\s*(const|let|var)\s+\w+\s+in\s+'
    suggest: "Use for...of (for...in iterates prototype properties)"
    severity: error
    autofix: true
  - id: template_literals
    name: "Use template literals over concatenation"
    detect: '["'']\s*\+\s*\w+\s*\+\s*["'']'
    suggest: "Use `Hello ${name}!` template literals"
    severity: warning
    autofix: true
  - id: fetch_over_xhr
    name: "Prefer fetch over XMLHttpRequest"
    detect: 'new\s+XMLHttpRequest'
    suggest: "Use the Fetch API with async/await"
    severity: warning
    autofix: false
  - id: array_from_over_slice
    name: "Use Array.from() or spread over slice.call"
    detect: 'Array\.prototype\.slice\.call'
    suggest: "Use Array.from(arrayLike) or [...arrayLike]"
    severity: info
    autofix: true
  - id: add_event_listener
    name: "Enforce addEventListener over onclick"
    detect: '\.\s*onclick\s*='
    suggest: "Use addEventListener for multiple listeners"
    severity: warning
    autofix: false
  - id: destructuring
    name: "Use destructuring for multi-property access"
    detect: 'const\s+\w+\s*=\s*\w+\.\w+;\s*\nconst\s+\w+\s*=\s*\w+\.\w+;'
    suggest: "Use const { a, b } = obj;"
    severity: info
    autofix: false
  - id: async_await_over_then
    name: "Prefer async/await over .then() chains"
    detect: '\.then\(.*\.then\(.*\.then\('
    suggest: "Use async/await for readability"
    severity: warning
    autofix: false

universal:
  - id: meaningful_names
    name: "Name things for the reader"
    detect: '\b(tmp|temp|data|result|val|ret|obj|str|arr|buf)\b\s*='
    suggest: "Use domain-specific names over generic placeholders"
    severity: info
    autofix: false
  - id: single_abstraction_level
    name: "One level of abstraction per function"
    detect: null
    suggest: "Don't mix orchestration with implementation in the same method"
    severity: info
    autofix: false
  - id: fail_loudly
    name: "Fail loudly with context"
    detect: 'rescue\s*$|catch\s*\(\s*\)|except\s*:|catch\s*{}'
    suggest: "Catch specific errors, log context, re-raise or return Result"
    severity: warning
    autofix: false
  - id: vertical_proximity
    name: "Related code should be adjacent"
    detect: null
    suggest: "Called functions should be near their callers within the same file"
    severity: info
    autofix: false
  - id: consistent_file_structure
    name: "Consistent file structure order"
    detect: null
    suggest: "Order: magic comments -> requires -> module -> constants -> public -> private -> end"
    severity: info
    autofix: false
  - id: why_not_what_comments
    name: "Comments explain why, not what"
    detect: '#\s*(increment|set|get|update|return|initialize|create|add)\s+\w+'
    suggest: "Comments should explain intent, not restate the code"
    severity: info
    autofix: false
  - id: immutability_by_default
    name: "Immutability by default"
    detect: null
    suggest: "Prefer frozen/const/immutable forms -- mutate only when necessary"
    severity: info
    autofix: false
  - id: consistent_quoting
    name: "Consistent string quoting within a file"
    detect: null
    suggest: "Normalize to project convention (single or double quotes)"
    severity: info
    autofix: false
  - id: typographic_excellence
    name: "Typographic excellence in user-facing text"
    detect: '["'']\.\.\.["'']|["'']--["'']'
    suggest: 'Use ... (ellipsis), -- (em dash), "" (curly quotes) in UI strings'
    severity: info
    autofix: true
  - id: progressive_disclosure
    name: "Progressive disclosure in APIs and UIs"
    detect: null
    suggest: "Group >5 options into sub-commands or collapsible sections"
    severity: info
    autofix: false
  - id: dead_code_elimination
    name: "Eliminate dead/unreachable code"
    detect: '(return|exit|raise|throw)\s+.*\n\s*\w+'
    suggest: "Remove unreachable code after return/exit/raise/throw"
    severity: warning
    autofix: true
  - id: consistent_error_strategy
    name: "Consistent error handling strategy per module"
    detect: null
    suggest: "Don't mix Result objects, exceptions, and nil-returns in one module"
    severity: info
    autofix: false
  - id: trailing_commas
    name: "Trailing commas in multi-line collections"
    detect: null
    suggest: "Add trailing commas so adding elements produces one-line diffs"
    severity: info
    autofix: true
  - id: whitespace_as_punctuation
    name: "Whitespace as punctuation"
    detect: '\n{4,}'
    suggest: "One blank line between sections, never >2 consecutive blank lines"
    severity: info
    autofix: true
  - id: small_files
    name: "Files under 300 lines"
    detect: null
    suggest: "Split files >300 lines at module boundaries"
    severity: warning
    autofix: false
# RUBY BEAUTY -- Design philosophy (restored from master.yml v71.3.0)

ruby_beauty:
  frozen_string_literals:
    rule: "# frozen_string_literal: true at top of every Ruby file"
    rationale: "Performance gain, prevents accidental mutation"
  keyword_arguments:
    rule: "Use keyword args for methods with 2+ params"
    example: "def create(name:, email:, role: 'user')"
    rationale: "Self-documenting, order-independent, default values"
  safe_navigation:
    operator: "&."
    example: "user&.profile&.avatar_url"
    rationale: "Prevents NoMethodError on nil, cleaner than &&"
  string_interpolation:
    rule: 'Use "#{}" over concatenation'
    rationale: "More readable, handles types automatically"
  blocks_parens_braces:
    rule: "Use {} for one-line, do/end for multi-line"
    rationale: "Readability convention, visual distinction"
  tell_dont_ask:
    rule: "Tell objects what to do, don't ask for data then act"
    antipattern: "if user.admin? then user.grant_access end"
    pattern: "user.grant_access_if_admin"
  small_methods:
    rule: "Methods under 10 lines ideal, max 20"
    technique: "Extract till you drop"
  stepdown_rule:
    rule: "Code reads like newspaper -- most important first"
    structure: "Public methods -> Private helpers -> Implementation details"
  boy_scout_rule:
    rule: "Leave code better than you found it"
    application: "Fix small issues while working on features"
# RAILS DOCTRINE -- Framework philosophy (restored from master.yml v71.3.0)

rails_doctrine:
  convention_over_configuration:
    rule: "Sensible defaults reduce decisions"
    application: "Follow Rails conventions, don't fight the framework"
    benefit: "Shared mental model across Rails developers"
  programmer_happiness:
    rule: "Optimize for developer joy, not just performance"
    application: "Beautiful APIs, minimal configuration, helpful errors"
  sharp_knives:
    rule: "Trust developers with power tools, no guard rails"
    responsibility: "With great power comes careful testing"
  integrated_systems:
    rule: "Solve whole problem, not assembled parts (Omakase)"
    application: "Use Rails stack: Hotwire, Turbo, Stimulus, Solid Queue"
    avoid: "Frankenstack of incompatible tools"
  monolith_first:
    rule: "Start monolith, extract services when team >15"
    rationale: "Microservices = distributed monolith for small teams"
  progress_over_stability:
    rule: "Ship features, break things, iterate quickly"
    balance: "In production: stability over progress"
  beautiful_code:
    rule: "Code should be elegant, not just functional"
    criteria: [readable, maintainable, expressive, concise]
# HTML/CSS PRINCIPLES -- Markup and styling philosophy

html_css_principles:
  semantic_html:
    rule: "Use HTML elements for their meaning, not appearance"
    elements: [header, nav, main, article, section, aside, footer]
    avoid: "div soup, span abuse"
  no_divitis:
    rule: "Maximum 2 wrapper divs"
    solution: "Use semantic elements, flexbox, grid"
  css_composition:
    rule: "Prefer semantic component-level SCSS with BEM naming"
    avoid: "Tailwind-style atomic CSS"
  modern_layout:
    techniques: [flexbox, grid, container_queries]
    avoid: [floats, absolute_positioning_for_layout, tables_for_layout]
  accessibility:
    requirements: [semantic_html, aria_labels, keyboard_navigation, color_contrast_4_5]
    test: "Tab through page, use screen reader"
  mobile_first:
    rule: "Base styles mobile, @media min-width for desktop"
    pattern: "min-width media queries, not max-width"
# LARGE HTML DOCUMENTS -- Inline CSS/JS strategy

large_html_documents:
  rationale: "Business plans, presentations, visualizations often require inline CSS/JS"
  document_types:
    business_plan:
      characteristics: [verbose, commented, external_libraries, print_friendly]
      formatting: preserve_readability
    production_app:
      characteristics: [minified, compressed, performance_critical]
      formatting: minimal_whitespace
  inline_css:
    organization: "CSS variables -> Resets -> Layout -> Components -> Utilities"
    css_variables: "Define all colors/spacing/fonts in :root"
    modern_only: "Flexbox, grid, container queries -- no floats or positioning hacks"
    mobile_first: "Base styles mobile, min-width media queries for desktop"
    performance: "will-change only on animating elements, CSS containment for sections"
  inline_js:
    production: "Minified, compressed vars, no whitespace"
    development: "Readable, commented, structured: Config -> Utils -> Classes -> Init -> Events"
    es6: "const/let, arrow functions, destructuring, template literals"
    dom_safety: "Check element existence before manipulation"
    memory: "Track timers in Set, clear on beforeunload"
    event_delegation: "Add listeners to container, check event.target"
  formatting_strategy:
    production: "Minify JS/CSS, inline everything, optimize for size"
    business_plan: "Readable formatting, comments, educational"
    default: "Extract to separate files"
# NORWEGIAN LANGUAGE -- Bokmål writing rules

norwegian:
  dialect: "bokmål"
  rules:
    - "Short sentences"
    - "Avoid anglicisms"
    - "Active voice preferred"
    - "Plain language over academic"
  style: "Omit needless words, be direct"

  # From ruby-style-guide and rails-style-guide (study repos)
  style_guide_rules:
    ruby:
      - id: method_length_limit
        rule: "Methods must not exceed 10 lines"
        severity: warning
      - id: predicate_naming
        rule: "Predicate methods end with ? -- no is_/has_/can_ prefix"
        detect: 'def\s+(is_|has_|can_|does_)\w+'
        severity: warning
      - id: no_and_or
        rule: "Use && and || -- never and/or for control flow"
        detect: '\b(and|or)\b'
        severity: warning
      - id: no_nested_ternary
        rule: "Never nest ternary operators"
        detect: '\?.*\?.*:'
        severity: error
      - id: trailing_comma
        rule: "Use trailing commas in multiline literals"
        severity: info
    rails:
      - id: skinny_controllers
        rule: "Controllers delegate to models/services -- no business logic"
        severity: warning
      - id: no_inline_render
        rule: "Never render inline: in controllers"
        detect: 'render\s+inline:'
        severity: error
      - id: extract_callbacks
        rule: "Extract callbacks >5 lines to service objects"
        severity: info
      - id: scope_over_class_method
        rule: "Prefer scope over class method for queries"
        severity: info
      - id: no_default_scope
        rule: "Avoid default_scope -- use explicit scopes"
        detect: '\bdefault_scope\b'
        severity: warning

# ── Cross-language smells ──────────────────────────────────────────────────
# Smell patterns with suggestions
# From master.yml v38.2

generic_verbs:
  process: [transform, parse, validate, normalize, sanitize]
  handle: [respond_to, dispatch, route, intercept]
  get: [fetch, retrieve, find, query, load, extract]
  set: [assign, update, configure, initialize, bind]
  do: [execute, invoke, trigger, activate]
  manage: [coordinate, orchestrate, supervise, govern]
  run: [execute, spawn, invoke, dispatch]

vague_nouns:
  data: [payload, credentials, configuration, attributes]
  info: [metadata, details, parameters, settings]
  thing: [entity, resource, component, module]
  object: [model, record, instance, document]
  value: [amount, quantity, metric, score]
  item: [element, entry, record, member]
  stuff: [content, material, payload, resources]

thresholds:
  nesting_depth: 4
  method_length: 50
  parameter_count: 5
  class_count_per_file: 3
  line_length: 120
  file_lines: 300
  class_methods: 10
  min_duplicate_count: 3

bloaters:
  long_method:
    check: "> method_length lines"
    fix: Extract method
  god_class:
    check: "> file_lines or > class_methods public methods"
    fix: Extract class
  primitive_obsession:
    check: Repeated primitive patterns
    fix: Introduce value object
  long_parameter_list:
    check: "> parameter_count parameters"
    fix: Parameter object

couplers:
  feature_envy:
    check: Method uses other class more than self
    fix: Move method
  inappropriate_intimacy:
    check: Classes know too much about each other
    fix: Extract class
  message_chains:
    check: Long chains like a.b.c.d
    fix: Hide delegate

dispensables:
  dead_code:
    check: Unreachable or unused code
    fix: Delete it
  lazy_class:
    check: Class does almost nothing
    fix: Inline or merge
  duplicate_code:
    check: Same logic in multiple places
    fix: Extract method/class

architecture:
  cyclic_dependency:
    check: A requires B requires A
    fix: Dependency inversion
  scattered_functionality:
    check: Related code in many files
    fix: Colocate

rails_specific:
  erb_sprawl:
    symptoms:
      - partial_explosion_over_5
      - deep_partial_nesting_over_3
    fixes:
      - consolidate
      - extract_view_component
      - use_turbo_frames

  divitis:
    symptoms:
      - excessive_nesting_over_5
      - non_semantic_markup
    fixes:
      - use_semantic_html
      - stimulus_component
      - turbo_frame_boundaries

  stimulus_antipatterns:
    symptoms:
      - action_sprawl_over_5
      - target_explosion_over_10
    fixes:
      - stimulus_components
      - extract_controller
      - use_outlets

  hotwire_misuse:
    symptoms:
      - full_page_turbo
      - missing_turbo_streams
    fixes:
      - turbo_frame_wrap
      - respond_turbo_stream

pwa_specific:
  offline_capability:
    symptoms:
      - no_service_worker
      - no_offline_fallback
    fixes:
      - register_service_worker
      - cache_strategies

  cache_invalidation:
    symptoms:
      - stale_assets
      - no_cache_busting
    fixes:
      - versioned_cache_names
      - cache_first_network

html_css_quality:
  accessibility:
    symptoms:
      - missing_alt_text
      - no_aria_labels
      - keyboard_nav_broken
    fixes:
      - add_alt_attributes
      - aria_label_buttons
      - tabindex_focus_trap

  semantic_html:
    symptoms:
      - div_soup
      - improper_heading_hierarchy
    fixes:
      - use_semantic_tags
      - proper_h1_h6_order

# Language axioms are defined in language_axioms.yml
# See: data/language_axioms.yml for 78 language-specific beauty rules
language_axiom_categories:
  - ruby
  - rails
  - zsh
  - html_erb
  - css_scss
  - javascript
  - universal


structural_optimization:
  # Detectors for each technique in the structural_optimization codex
  # Reference: data/design_codex.yml structural_optimization.techniques

  merge_opportunity:
    check: "Same logic (≥4 lines) appears in 2+ locations"
    fix: "Extract to shared method/module; parameterise differences"
    severity: high
    autofix: true

  defrag_opportunity:
    check: "Logic about concept X lives primarily in file named Y"
    fix: "Move to canonical home module; update call-sites"
    severity: medium
    autofix: false

  naming_drift:
    check: "Same concept referred to by different names across files"
    examples: ["banned/forbidden/blocked/prohibited", "priority/weight/tier/level", "council/chamber"]
    fix: "Pick canonical name; migrate all sites; add normalise rule"
    severity: medium
    autofix: true

  data_duplication:
    check: "Same fact (model ID, rule text, constant value) defined in 2+ YAML files"
    fix: "Single source file; other files reference or import"
    severity: high
    autofix: true

  layering_violation:
    check: "Module calls upward in stack (UI in domain, enforcement calling LLM, analysis writing disk)"
    fix: "Return result upward; inject dependencies; use event pattern"
    severity: critical
    autofix: false

  dead_code:
    check: "Method/constant/YAML key defined but never referenced in lib/"
    fix: "Delete; git history is the backup"
    severity: medium
    autofix: true

  uncodified_insight:
    check: "Analysis insight or discovered pattern not present in axioms.yml/smells.yml/design_codex.yml"
    fix: "Codify immediately: add to appropriate data file; wire to selfrun detector"
    severity: high
    autofix: false

  god_yaml:
    check: "Single YAML file mixes 3+ unrelated concept categories"
    fix: "Split by responsibility axis; one file per concept domain"
    severity: medium
    autofix: false

  schema_drift:
    check: "Same type of data structured with different keys/types/scales in different YAML files"
    examples: ["axiom schemas: {id,priority} vs {id,severity} vs {name,tier}", "ranking: integer vs float vs categorical"]
    fix: "Normalise to single canonical schema; migrate all instances"
    severity: medium
    autofix: true

  abstraction_gap:
    check: "Same 3+ line idiom repeated 5+ times without a named abstraction"
    examples: ["YAML.safe_load_file + File.exist? + rescue pattern (18+ occurrences)", "File.join(MASTER.root,'data',name) pattern (35+ occurrences)"]
    fix: "Name the concept; extract to Paths.load_data_file or equivalent"
    severity: medium
    autofix: true

  buried_constant:
    check: "Magic string/number/regex defined inside a method body rather than hoisted to constant"
    fix: "Extract to named constant at module level"
    severity: low
    autofix: true

  unused_yaml_key:
    check: "YAML key defined but never grep'd in any .rb file under lib/"
    examples: ["language_axioms.yml html/css axioms", "council.yml config: section", "axioms.yml llm_strategies key"]
    fix: "Delete or wire to a detector/consumer"
    severity: low
    autofix: false

importance_flow:
  # Detectors for INVERTED_PYRAMID axiom violations
  # Reference: data/design_codex.yml importance_flow

  private_before_public:
    check: "private/protected keyword appears above a public method in same class scope"
    fix: "Move private block to bottom of class; hoist public methods above it"
    severity: high
    autofix: true

  helpers_before_core:
    check: "A method is defined before the public method that is its primary caller"
    fix: "Move helper below its caller; readers encounter call-site before implementation"
    severity: medium
    autofix: true

  rescue_wraps_def:
    check: "def foo / rescue / end pattern -- rescue wrapping entire method body"
    fix: "Narrow rescue to the expression that can raise; move guard to first line"
    severity: medium
    autofix: false

  required_after_optional:
    check: "def foo(a=1, b) -- required keyword param after optional positional"
    fix: "Reorder: required positional -> optional positional -> required kw -> optional kw"
    severity: high
    autofix: true

  setup_after_core:
    check: "Variable assignment line after a non-assignment core logic expression in same method"
    fix: "Hoist setup to top of method; core logic follows"
    severity: low
    autofix: true

  yaml_examples_before_rules:
    check: "YAML key named 'example', 'template', or 'sample' appears before 'rules', 'detect', or 'check'"
    fix: "Move examples/templates to bottom of their section"
    severity: low
    autofix: true

  yaml_adjustable_before_protected:
    check: "ADJUSTABLE protection entry appears before PROTECTED entry in same YAML file"
    fix: "Reorder: ABSOLUTE -> PROTECTED -> ADJUSTABLE"
    severity: medium
    autofix: true

  zsh_helper_before_main:
    check: "Function definition appears before the 'main' or primary function in a Zsh script"
    fix: "Define main() first; helper functions follow in call order"
    severity: low
    autofix: true

  detail_before_summary:
    check: "File or section opens with implementation detail (private method, edge case, cleanup) before any public contract"
    fix: "Add public interface summary at top; push detail down"
    severity: medium
    autofix: false

  argument_entropy:
    check: "Method has 4+ params and they are not ordered: required -> optional -> keyword -> block"
    fix: "Reorder params by importance; extract to options hash if > 5"
    severity: medium
    autofix: true

strunk_white:
  # Prose quality detectors -- Strunk & White applied to identifiers, comments, and strings.
  # Reference: data/design_codex.yml prose_style, axiom STRUNK_WHITE

  filler_identifier:
    check: "Variable or method named 'data', 'info', 'thing', 'stuff', 'misc', 'temp', 'tmp', 'item', 'object', 'value' without qualification"
    fix: "Replace with the specific domain noun: axiom_list, violation_count, model_name"
    severity: high
    autofix: false

  vague_noun_identifier:
    check: "Method or class named *Manager, *Handler, *Processor, *Helper, *Util, *Service without a domain prefix"
    fix: "Name by domain role: ViolationReporter, AxiomLoader, CostTracker -- not DataManager"
    severity: medium
    autofix: false

  redundant_comment:
    check: "Comment that restates the immediately following method name or expression (e.g., '# This method returns X' above 'def return_x')"
    fix: "Delete the comment. If intent is opaque, rewrite it to explain WHY, not WHAT."
    severity: medium
    autofix: true

  passive_error_message:
    check: "Error or warning string containing 'was rejected', 'were found', 'was created', 'is handled', 'be processed'"
    fix: "Rewrite in active voice: 'Enforcer rejected X', 'Scanner found N violations'"
    severity: medium
    autofix: true

  filler_phrase_in_string:
    check: "String literal containing 'in order to', 'the fact that', 'it is important to note', 'it should be noted', 'please note', 'as you can see', 'needless to say'"
    fix: "Cut the filler phrase; state the substance directly"
    severity: low
    autofix: true

  qualifier_word:
    check: "Comment or string containing 'basically', 'essentially', 'actually', 'simply', 'really', 'quite', 'very', 'pretty', 'rather', 'sort of', 'kind of'"
    fix: "Cut the qualifier. If the statement needs hedging, rewrite it to be precise instead."
    severity: low
    autofix: true

  zombie_noun:
    check: "Comment or prose string using nominalization when a verb form exists: 'the refactoring of', 'the enforcement of', 'a validation of', 'the processing of'"
    fix: "Convert to verb: 'refactor', 'enforce', 'validate', 'process'"
    severity: low
    autofix: true

  obvious_comment:
    check: "Comment text matches the immediately following identifier (e.g., '# loads the file' above 'File.read')"
    fix: "Delete comment. Code already says what it does. Comment only when WHY is non-obvious."
    severity: low
    autofix: true

  passive_prefix_method:
    check: "Method defined with banned passive prefix: get_, do_, perform_, process_, run_, handle_, execute_, manage_"
    fix: "Rename to active verb: fetch, scan, enforce, reflow. Exception: run_phase1/2/3 by convention."
    severity: medium
    autofix: false
