# UI/UX & SEO Rules — constitutional quality for user experience
# MASTER2 enforces these when generating or reviewing user-facing code

ux_principles:
  - "Respond to every user action within 100ms"
  - "Show progress for operations >1 second"
  - "Error messages explain what happened AND what to do next"
  - "Undo is always available for destructive actions"
  - "Sensible defaults — zero-config for common cases"
  - "Progressive disclosure — show essentials first, details on demand"
  - "Consistent interaction patterns across all views"

accessibility:
  wcag_level: "AA minimum"
  requirements:
    - "All interactive elements keyboard-accessible"
    - "Focus indicators visible and obvious"
    - "Color is never the sole indicator of state"
    - "Contrast ratio ≥4.5:1 for normal text, ≥3:1 for large text"
    - "Screen reader tested (VoiceOver, NVDA)"
    - "Skip navigation link for keyboard users"
    - "Form inputs have visible labels (not just placeholder)"

seo:
  technical:
    - "Semantic HTML structure (h1 → h2 → h3, never skip levels)"
    - "Unique <title> and <meta description> per page"
    - "Canonical URLs for duplicate content"
    - "Structured data (JSON-LD) for rich snippets"
    - "Fast load time (<3s on 3G)"
    - "Mobile-friendly (responsive, no horizontal scroll)"
    - "Valid HTML (no parsing errors)"
  content:
    - "One H1 per page"
    - "Descriptive link text (never 'click here')"
    - "Alt text for all meaningful images"
    - "URL slugs are human-readable"

performance_budget:
  first_contentful_paint: "1.8s"
  largest_contentful_paint: "2.5s"
  cumulative_layout_shift: "0.1"
  total_blocking_time: "200ms"
