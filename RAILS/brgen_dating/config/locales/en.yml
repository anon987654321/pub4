# Engine-local strings.
#
# Every engine string used to live in brgen/config/locales, which made a
# literal in the markup the path of least resistance for engine work and left
# the engine unmountable anywhere else. Rails::Engine appends
# config/locales/*.yml to I18n.load_path on its own -- no wiring beyond this
# file existing -- and I18n deep-merges across load paths, so keys under the
# same namespace in the host file stay reachable.
#
# Keys the host already carries are NOT copied here. Use them.
en:
  dating:
    home_blurb: "Meet people nearby. Swipe to like or pass."
    bio: "Bio"
    gender: "Gender"
    location: "Location"
    visible_label: "Make profile visible"
    profile_photo: "Profile photo"
    photo_of: "Photo of %{name}"
    selfie_of: "Selfie from %{name}"
    visibility: "Visibility"
    visibility_visible: "visible"
    visibility_hidden: "hidden"
    visible_note: "Your profile is visible to others in your city."
    hidden_note: "Your profile is hidden — no one can see it."
    hide_profile: "Hide profile"
    show_profile: "Show profile"
    genders:
      man: "Man"
      woman: "Woman"
      nonbinary: "Non-binary"
      other: "Other"
    looking_for_options:
      man: "Men"
      woman: "Women"
      everyone: "Everyone"
