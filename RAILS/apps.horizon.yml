# Aspirational features — out of scope for agents unless explicitly requested.
# Canonical active inventory: apps.yml (status: done). Do not implement horizon items by default.

agent_policy: ignore

horizon:
  brgen:
    core:
      - { name: AI feed ranking, status: planned }
      - { name: creator monetization, status: planned }
      - { name: inbound ActivityPub storage, status: planned, notes: "outbound federation is done; the inbox verifies remote Create/Announce/Like and drops them, because storing them needs remote media proxying, remote moderation and a blocklist" }
      - { name: recurring events / ticketing beyond an external link, status: planned }
      - { name: messenger voice and video calls (WebRTC), status: planned }
    subapp_tv:
      - { name: live stream infrastructure, status: planned }
    subapp_dating:
      - { name: premium memberships / boost / super-like purchases, status: planned }
    subapp_marketplace:
      - { name: AI recommendations, status: planned }
      - { name: coupons / referral credit / bundle pricing, status: planned }
      - { name: anonymised buyer-seller contact relay, status: planned, notes: "needs inbound mail routing and per-listing addresses on vm23; brgen.no mail is outbound-verified only" }
    subapp_playlist:
      - { name: creator donations / ad-free tier, status: planned }
  amber:
    wardrobe:
      - { name: fashion embeddings (pgvector), status: planned }
      - { name: visual similarity search, status: planned }
      - { name: virtual fitting room, status: planned }
      - { name: mood matcher, status: planned }
      - { name: event outfit planner, status: planned }
      - { name: sustainable styles / resale, status: planned }
      - { name: weather-based suggestions, status: planned }
      - { name: global trends / local designer highlights, status: planned }
      - { name: style agents (MASTER integration), status: planned }
  bsdports:
    core:
      - { name: FreeBSD/NetBSD ports parsers, status: planned, notes: "OpenBSD-only production scope" }
      - { name: semantic package search (pgvector), status: planned }
      - { name: infrastructure knowledge graph, status: planned }
      - { name: OpenBSD package intelligence, status: planned }
