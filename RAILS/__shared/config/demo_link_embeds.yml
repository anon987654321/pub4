# Real, public, embeddable media for the brgen and amber demo feeds, and the
# posts that carry it. Data rather than Faker: every link is a real recording by
# an artist from the Bergen area or by a Bergen institution.
#
# Each link was checked against its provider's public oEmbed endpoint on
# 2026-09-15, and title, author_name and thumbnail_url are that answer. The
# seeders store them with the post, so seeding asks no provider and queues no
# lookup. A link that later stops resolving still renders, as the plain link.
#
# Read by Shared::LinkEmbed.demo_posts. A post's text has to carry its link,
# because a save that finds a different link starts the embed over.
