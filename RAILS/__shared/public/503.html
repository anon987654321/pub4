<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Midlertidig utilgjengelig</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Helvetica Neue Pro", "Helvetica Neue", Arial, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100dvh;
      margin: 0;
      padding:
        max(1rem, env(safe-area-inset-top, 0px))
        max(1.25rem, env(safe-area-inset-right, 0px))
        max(1rem, env(safe-area-inset-bottom, 0px))
        max(1.25rem, env(safe-area-inset-left, 0px));
      place-items: center;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    main { width: min(100%, 36rem); padding-block: 3rem; }
    h1 { max-width: 20ch; font-size: clamp(1.5rem, 5vw, 2.25rem); line-height: 1.25; letter-spacing: -0.02em; }
    p { max-width: 34rem; }
    a { color: inherit; text-underline-offset: 0.15em; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
    .code { font: 700 0.8rem/1.25 ui-monospace, monospace; letter-spacing: .08em; }
  </style>
</head>
<body>
  <main>
    <p class="code">503</p>
    <h1>Vi er straks tilbake.</h1>
    <p>Tjenesten er midlertidig utilgjengelig. Ingenting skal gå tapt bare fordi boksen trenger en pause.</p>
    <p><a href="/">Prøv igjen</a></p>
  </main>
</body>
</html>
