<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Midlertidig utilgjengelig</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Helvetica Neue Pro", "Helvetica Neue", Arial, sans-serif;
    }
    body {
      display: grid;
      min-height: 100dvh;
      margin: 0;
      padding: env(safe-area-inset-top, 0px) 1.25rem env(safe-area-inset-bottom, 0px);
      place-items: center;
    }
    main { width: 100%; max-width: 36rem; padding-block: 3rem; }
    p { max-width: 34rem; line-height: 1.5; }
    a { color: inherit; }
    .code { font: 700 0.8rem/1.25 ui-monospace, monospace; letter-spacing: .08em; }
  </style>
</head>
<body>
  <main>
    <p class="code">503</p>
    <h1>Vi er straks tilbake.</h1>
    <p>Tjenesten er midlertidig utilgjengelig. Ingenting skal gå tapt bare fordi boksen trenger en pause.</p>
    <p><a href="/">Prøv igjen</a></p>
  </main>
</body>
</html>
