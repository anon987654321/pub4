production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  declutter_hygiene:
    class: DeclutterHygieneJob
    queue: default
    schedule: at 6am every day
  # See brgen's copy: guest rows accumulate permanently without this.
  prune_guest_users:
    class: Shared::PruneGuestUsersJob
    queue: default
    schedule: every day at 3:45am

development:
  declutter_hygiene:
    class: DeclutterHygieneJob
    queue: default
    schedule: every day at 6am
