  # Se merknaden i en.yml. Hvert tips har tittel (hva), brødtekst (hvorfor) og
  # prinsippet det er hentet fra.
  closet:
    garments:
      one: "%{count} plagg"
      other: "%{count} plagg"
    groups:
      one: "%{count} gruppe"
      other: "%{count} grupper"
    is_are:
      one: "er"
      other: "er"
    materials:
      wool: "ull"
      silk: "silke"
      linen: "lin"
      leather: "skinn"
      denim: "denim"
      cotton: "bomull"
    tips:
      clean_needed:
        title: "Vask eller luft %{garments}"
        body: "Merket som trenger rens. Skittentøy på lager trekker møll og setter flekker — stell kommer før oppbevaring."
        principle: "Stell før oppbevaring"
      repair:
        title: "Reparer eller kvitt deg med %{garments}"
        body: "En reparasjonsbunke som aldri flytter seg er lagerplass brukt på plagg du ikke kan gå med. Sett av én reparasjonsøkt, eller gi dem videre."
        principle: "Kintsugi — lapp synlig framfor å kaste"
      tailor:
        title: "%{garments} venter på skredder"
        body: "Passform er forskjellen på å eie et plagg og å bruke det. Skredderarbeid gjør dødt lager til rotasjon."
        principle: "Passform framfor mengde"
      condition:
        title: "%{garments} er registrert som utslitt eller klar for pensjon"
        body: "Tilstand føres per eier, ikke per plagg. Ta avgjørelsen nå framfor å la dem oppta plass på beste stang."
        principle: "Bestem én gang, ikke om igjen"
      material_wool:
        title: "%{garments} i %{material}"
        body: "Luft mellom bruk framfor å vaske; vask kaldt og tørk flatt. Ull renser seg selv med et døgn på henger."
        principle: "Materialet bestemmer metoden"
      material_silk:
        title: "%{garments} i %{material}"
        body: "Håndvask kaldt eller rens, og hold unna direkte lys — silke falmer raskere enn den slites."
        principle: "Materialet bestemmer metoden"
      material_linen:
        title: "%{garments} i %{material}"
        body: "Vask varmt og heng fuktig; skrukkene er materialet, ikke en feil."
        principle: "Materialet bestemmer metoden"
      material_leather:
        title: "%{garments} i %{material}"
        body: "Behandle to ganger i året, aldri pakk i plast, og tørk unna varme."
        principle: "Materialet bestemmer metoden"
      material_denim:
        title: "%{garments} i %{material}"
        body: "Vask sjelden og med vrangen ut. Hver vask koster indigo."
        principle: "Materialet bestemmer metoden"
      material_cotton:
        title: "%{garments} i %{material}"
        body: "Vask kaldt og heng til tørk; det er tørketrommelen, ikke bruken, som tynner bomull."
        principle: "Materialet bestemmer metoden"
      seasonal_archive:
        title: "Arkiver %{garments} som er utenfor sesong"
        body: "Bare denne sesongen hører hjemme innen rekkevidde. Pakk resten rent og merket; skapet du ser bør være skapet du kan bruke i dag."
        principle: "Sesongrotasjon — interiøret følger året"
      fold:
        title: "Brett %{garments} som er strikket"
        body: "Strikk strekker seg i skulderen om det henges. Brett dem i stående stabler så hvert plagg synes ovenfra framfor å bli begravd."
        principle: "Stående arkivering — alt synlig samtidig"
      hang:
        title: "Heng %{garments} som holder en fasong"
        body: "Silke, lin og skredderarbeid holder linjen på henger og mister den i en stabel. Gi dem skulderbredde avstand."
        principle: "Støtt fasongen plagget allerede har"
      breathe:
        title: "%{garments} i skinn trenger å puste"
        body: "Bomullsposer, aldri plast. Det er innestengt fuktighet som sprekker skinn, ikke bruk."
        principle: "Materialet bestemmer metoden"
      archived_stale:
        title: "%{garments} står i sesongarkivet"
        body: "Arkivet gjør nytte bare om noe kommer tilbake. Hent fram de som har fått sesongen sin igjen, så arkivet forblir en syklus og ikke en kirkegård."
        principle: "Rotasjon, ikke oppsamling"
      prime_reach:
        title: "Sett %{garments} du bruker mest innen beste rekkevidde"
        body: "Feltet mellom hofte og skulder koster verken bøying eller strekk. De mest brukte plaggene hører hjemme der, og ingenting annet."
        principle: "Rekkeviddesoner — antropometrisk planlegging"
      deep_storage:
        title: "Flytt %{garments} du er glad i men ikke bruker, til øyehøyde"
        body: "Et plagg som gir glede og likevel aldri brukes, er som regel et plagg du ikke ser. Bytt plass med noe du griper etter på autopilot."
        principle: "Synlighet driver bruk"
      category_zones:
        title: "Sone stangen: %{zones}"
        body: "Grupper etter kategori før noe annet, største gruppe nærmest døra. Å sette sammen antrekk blir en tur langs stangen framfor et søk."
        principle: "Sirkulasjon — ordne langs bevegelsesretningen"
      color_run:
        title: "La hver sone gå fra lyst til mørkt"
        body: "Innen en kategori, sorter etter valør framfor kulør. En gradient leses som én komponert flate; spredt farge leses som rot selv med identiske plagg."
        principle: "Valørgradient — tonal komposisjon"
      density:
        title: "%{categories} %{verb} overfylt"
        body: "Over omtrent %{crowded} plagg slutter en kategori å være mulig å bla i — du bruker den fremste tredelen og glemmer resten. Tynn ned mot %{airy}–%{crowded}."
        principle: "Ma — mellomrommet er en del av komposisjonen"
      duplicates:
        title: "%{group_word} med nesten like plagg, %{count} til overs"
        body: "Behold den beste i hver gruppe og gi resten videre. To like plagg er ett plagg og én avgjørelse du tar hver morgen."
        principle: "Én av hvert, og den beste"
      one_in_one_out:
        title: "%{added} inn, %{released} ut det siste kvartalet"
        body: "Garderoben vokser raskere enn den slipper. Én inn, én ut holder volumet fast, så skapet aldri trenger å omorganiseres igjen."
        principle: "Én inn, én ut"
      negative_space:
        title: "%{joy} av %{total} plagg gir glede"
        body: "De andre %{count} er dem du skyver forbi for å nå disse. Tom stang er ikke sløsing — det er det som gjør de gjenværende plaggene synlige."
        principle: "Tomrommet er designet"
