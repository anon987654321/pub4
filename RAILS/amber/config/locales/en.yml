  # ClosetOrganization's rules. Every tip carries a title (what to do), a body
  # (why), and the principle it borrows from, so the advice is auditable rather
  # than oracular.
  closet:
    garments:
      one: "%{count} garment"
      other: "%{count} garments"
    groups:
      one: "%{count} group"
      other: "%{count} groups"
    is_are:
      one: "is"
      other: "are"
    materials:
      wool: "wool"
      silk: "silk"
      linen: "linen"
      leather: "leather"
      denim: "denim"
      cotton: "cotton"
    tips:
      clean_needed:
        title: "Wash or air %{garments}"
        body: "Marked clean-needed. Clothes stored dirty attract moths and set stains — care comes before storage."
        principle: "Care before storage"
      repair:
        title: "Repair or release %{garments}"
        body: "A repair pile that never moves is storage spent on garments you cannot wear. Book one repair session or release them."
        principle: "Kintsugi — mend visibly rather than discard"
      tailor:
        title: "%{garments} waiting on tailoring"
        body: "Fit is the difference between owning a garment and wearing it. Tailoring converts dead stock into rotation."
        principle: "Fit over quantity"
      condition:
        title: "%{garments} logged as worn out or for retirement"
        body: "Condition is recorded per owner, not per garment. Decide each one now rather than letting it occupy prime rail space."
        principle: "Decide once, not repeatedly"
      material_wool:
        title: "%{garments} in %{material}"
        body: "Air between wears instead of washing; wash cold and dry flat. Wool self-cleans if given a day on a hanger."
        principle: "Material dictates method"
      material_silk:
        title: "%{garments} in %{material}"
        body: "Hand wash cool or dry clean, and keep out of direct light — silk fades faster than it wears out."
        principle: "Material dictates method"
      material_linen:
        title: "%{garments} in %{material}"
        body: "Wash warm and hang damp; the creases are the material, not a fault."
        principle: "Material dictates method"
      material_leather:
        title: "%{garments} in %{material}"
        body: "Condition twice a year, never seal in plastic, and dry away from heat."
        principle: "Material dictates method"
      material_denim:
        title: "%{garments} in %{material}"
        body: "Wash rarely and inside out. Every wash costs indigo."
        principle: "Material dictates method"
      material_cotton:
        title: "%{garments} in %{material}"
        body: "Wash cool and line dry; the dryer, not wear, is what thins cotton."
        principle: "Material dictates method"
      seasonal_archive:
        title: "Archive %{garments} that are out of season"
        body: "Only the current season belongs in reach. Box the rest clean and labelled; the closet you see should be the closet you can wear today."
        principle: "Seasonal rotation — the interior changes with the year"
      fold:
        title: "Fold %{garments} that are knitted"
        body: "Knits stretch at the shoulder if hung. Fold them into vertical stacks so each one is visible from above rather than buried."
        principle: "Vertical filing — everything visible at once"
      hang:
        title: "Hang %{garments} that hold a structure"
        body: "Silk, linen and tailoring keep their line on a hanger and lose it in a stack. Give them shoulder-width spacing."
        principle: "Support the structure the garment has"
      breathe:
        title: "%{garments} in leather need to breathe"
        body: "Cotton bags, never plastic. Trapped moisture is what cracks a hide, not use."
        principle: "Material dictates method"
      archived_stale:
        title: "%{garments} are in seasonal archive"
        body: "Archive earns its keep only if it comes back. Resurface the ones whose season has returned so the archive stays a cycle, not a graveyard."
        principle: "Rotation, not accumulation"
      prime_reach:
        title: "Put %{garments} you wear most in prime reach"
        body: "The band between hip and shoulder costs no bending or stretching. Your most-worn garments belong there and nothing else does."
        principle: "Reach zones — anthropometric planning"
      deep_storage:
        title: "Move %{garments} that are loved but unworn to eye level"
        body: "A garment that sparks joy and is never worn is usually a garment you cannot see. Trade its position with something you reach for on autopilot."
        principle: "Visibility drives use"
      category_zones:
        title: "Zone the rail: %{zones}"
        body: "Group by category before anything else, largest group nearest the door. Outfit-building becomes a walk along the rail instead of a search."
        principle: "Circulation — arrange along the path of movement"
      color_run:
        title: "Run each zone light to dark"
        body: "Within a category, order by value rather than hue. A gradient reads as one composed surface; scattered colour reads as clutter even when the garments are identical."
        principle: "Value gradient — tonal composition"
      density:
        title: "%{categories} %{verb} crowded"
        body: "Above roughly %{crowded} garments a category stops being browsable — you wear the front third and forget the rest. Thin toward %{airy}–%{crowded}."
        principle: "Ma — the interval is part of the composition"
      duplicates:
        title: "%{group_word} of near-identical garments, %{count} surplus"
        body: "Keep the best of each and release the rest. Two of the same garment is one garment and one decision you make every morning."
        principle: "One of each, and the best one"
      one_in_one_out:
        title: "%{added} in, %{released} out over the last quarter"
        body: "The wardrobe is growing faster than it is releasing. One in, one out keeps the volume fixed so the closet never has to be reorganised again."
        principle: "One in, one out"
      negative_space:
        title: "%{joy} of %{total} garments spark joy"
        body: "The other %{count} are the ones you push past to reach these. Empty rail is not waste — it is what makes the remaining garments visible."
        principle: "Negative space is the design"
