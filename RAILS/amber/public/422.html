<!doctype html>
<html lang="nb">
<head>

  <meta charset="utf-8">

  <link rel="stylesheet" href="/styles/errors.css">
  <style>
    :root { --x-bg: #efefef; --x-text: #333333; --x-accent: #000000; --x-border: #888888; --x-text-secondary: #4d4d4d; --x-font: "Helvetica Neue Pro", "Helvetica Neue", Arial, sans-serif; }
    .error-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.25rem; justify-content: center; }

      border: 1px solid var(--x-border); border-radius: 4px; text-decoration: none; font-weight: 600;
    }
    .error-actions a.primary { background: var(--x-accent); color: var(--x-bg); border-color: var(--x-accent); }
    .kicker { color: var(--x-text-secondary); font-size: 0.875rem; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Amber · 422</p>

    </header>
    <article>
      <p>Noe i forespørselen var ugyldig. Gå tilbake og prøv igjen.</p>
      <p lang="en" style="margin-top:0.5rem;color:var(--x-text-secondary);font-size:0.9em">The change you wanted was rejected. Go back and try again.</p>
      <nav class="error-actions" aria-label="Neste steg">
        <a class="primary" href="javascript:history.back()">Tilbake</a>
