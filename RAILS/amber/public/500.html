<!doctype html>
<html lang="nb">
<head>
  <title>Noe gikk galt — Amber</title>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <link rel="stylesheet" href="/styles/errors.css">
  <style>
    :root { --x-bg: #faf8f5; --x-text: #1a1612; --x-accent: #8b4513; --x-border: #d4cfc6; --x-text-secondary: #6b635a; --x-font: Georgia, "Caprasimo", serif; }
    .error-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.25rem; justify-content: center; }
    .error-actions a, .error-actions button {
      display: inline-flex; align-items: center; min-height: 44px; padding: 0.5rem 1rem;
      border: 1px solid var(--x-border); border-radius: 4px; text-decoration: none; font-weight: 600;
      background: transparent; color: inherit; font: inherit; cursor: pointer;
    }
    .error-actions a.primary, .error-actions button.primary { background: var(--x-accent); color: #fff; border-color: var(--x-accent); }
    .kicker { color: var(--x-text-secondary); font-size: 0.875rem; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Amber · 500</p>
    <header>
      <h1 style="font-size:1.5rem;margin-bottom:0.75rem">Noe gikk galt</h1>
    </header>
    <article>
      <p>Vi traff en uventet feil. Prøv igjen om et øyeblikk — garderoben din er trygt lagret.</p>
      <p lang="en" style="margin-top:0.5rem;color:var(--x-text-secondary);font-size:0.9em">Something went wrong on our side. Your wardrobe is safe — try again shortly.</p>
      <nav class="error-actions" aria-label="Neste steg">
        <button type="button" class="primary" onclick="location.reload()">Prøv igjen</button>
        <a href="/">Hjem</a>
        <a href="/items">Garderobe</a>
      </nav>
    </article>
  </main>
</body>
</html>
