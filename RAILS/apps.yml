# Rails deploy matrix — canonical inventory for RAILS.
#
# deploy_root: tracked tree copied to /home/<app>/app by <app>.sh
# status: done | port | missing | planned
#
# Verify claims: cd MASTER && bundle exec ruby bin/cli  →  /scan RAILS/<app>
# Human summary: RAILS/README.md and per-app README.md
# Shared engine: RAILS/shared (pub4-shared gem)
#
# Stack default: Rails 8.1, Ruby 3.4, SQLite, Falcon, Solid Queue/Cache, relayd TLS
#
# Reconciled: 2026-07-07 — feature statuses verified against landed code + OPENBSD/data/debt.yml.
# Planned/aspirational work lives in apps.horizon.yml (agent: ignore). Active apps: 0 port/missing gaps.

apps:

  brgen:
    title: Brgen
    domain: brgen.no
    port: 38182
    stack_now: SQLite3, Rails 8, Hotwire, Falcon, Active Storage, Solid Queue, Solid Cache, OpenBSD, relayd
    stack_later: PostgreSQL where needed, city graph scaling, richer SNI/domain routing
    deploy_script: RAILS/brgen/brgen.sh
    deploy_root: RAILS/brgen
    public: true
    features:
      core:
        - { name: User model + auth,                                       status: done }
        - { name: Community (slug, name, description),                     status: done }
        - { name: Post (title, content, hot/fresh/top scopes),             status: done }
        - { name: Comment (threaded, polymorphic, controversial scope),    status: done }
        - { name: Vote / Like (polymorphic, karma side-effect),            status: done }
        - { name: Hashtag + Tagging join,                                  status: done }
        - { name: Mention model,                                           status: done }
        - { name: Votable concern,                                         status: done }
        - { name: Hotwire broadcasts_refreshes,                            status: done }
        - { name: OmniAuth (Vipps / Google / Snapchat),                       status: done, notes: "google/github/vipps/snapchat providers in omniauth.rb; Shared::OmniauthCallbacksController persists external_identities" }
        - { name: Reaction (polymorphic on posts/messages, ActionCable),    status: done }
        - { name: Follow (self-join, no self-follows, notifications),       status: done }
        - { name: Notification (like/follow/custom, mark_as_read),          status: done }
        - { name: DirectMessage (conversation_between, mark_as_read),       status: done }
        - { name: full-text search (SQLite FTS5),                           status: done, notes: "posts_fts + marketplace live search + /search global endpoint" }
        - { name: reading_time_minutes on posts,                            status: done, notes: "Post#reading_time_minutes on post card + show" }
        - { name: city-scoped subdomain routing,                           status: done, notes: "DomainRegistry + city switcher UI" }
        - { name: proximity / geolocation filtering,                       status: done, notes: "nearby#index, locations#update, geolocation Stimulus, dating radius filter" }
        - { name: moderation tools,                                        status: done, notes: "ModerationWorkflow, admin/reports, ModerationReport, ModerationFlag, TrustScore" }
        - { name: media pipeline (Active Storage variants),                status: done, notes: "Shared::MediaProcessable + MediaProcessingJob on post/listing/dating/message/playlist/takeaway/tv; responsive_image_tag + blurhash" }
        - { name: identity + trust primitives (OAuth subjects, merge, reputation), status: done, notes: "identity_providers, external_identities, account_merges, trust_signals; wired via OmniAuth callbacks + TrustScore" }
        - { name: photo/multimodal upload (visitor allowed on public surface), status: done, notes: "intentionally open for chat vision; see WIRING_NOTES.md" }
        - { name: unified Activity graph emission,                         status: done, notes: "ActivityTrackable + EventEmitter across playlist/marketplace/takeaway/tv/dating verticals; see WIRING_NOTES.md" }
        - { name: shared model concerns (Notifiable, ActivityTrackable, GeoLocatable, Votable, Commentable, Taggable promoted), status: done, notes: "reduced local duplication/sprawl; see shared/app/models/concerns/shared/ + WIRING_NOTES" }
        - { name: MASTER frontend/cosmetic scan rules (web_rules, cosmetic_rules, FrontendAuditor), status: done, notes: "scan_profiles.cosmetic + frontend_production_gate + frontend_auditor_gate" }
        - { name: Reddit scrape seed (rephrase + Strunk & White),          status: done, notes: "RedditSeed + ContentRewriter + StrunkWhitePass" }
        - { name: SEO / affiliate / newsletter kit (shared),                 status: done, notes: "Shared::SeoKit, json_ld, affiliate_disclosure, newsletter_cta" }
        - { name: affiliate inventory persistence (AffiliateProduct),         status: done, notes: "affiliate_products table + upsert_from_feed! + rake affiliate:{import,health,seed_placeholders,drop_placeholders}; deals read the table, not a live call per render" }
        - { name: TradeDoubler product import,                                status: done, notes: "Client uses Products matrix URI + fid, productFeeds discovery, search/unlimited modes, offers parse. Gated on TRADEDOUBLER_TOKEN. Nightly AffiliateImportJob. Live response still needs operator approval of brgen.no as publisher + programmes. Placeholders until then." }
        - { name: TradeDoubler publisher ownership verification,              status: done, notes: "Their publisher team verifies by loading a page showing the account Site ID, plus a visible contact email and a reachable cookie policy (support thread 2026-08-07). Site footer renders TRADEDOUBLER_SITE_ID and SITE_CONTACT_EMAIL when set — deliberately NOT gated on TRADEDOUBLER_TOKEN, which is issued after approval. /cookies already names TradeDoubler and is footer-linked. Pinned by brgen/test/helpers/publisher_verification_test.rb. OPERATOR: set both env values on vm23; SITE_CONTACT_EMAIL must be a mailbox that receives." }
        - { name: TradeDoubler vouchers + conversions + Link Converter,       status: done, notes: "AffiliateVoucher, AffiliateConversion, POST /webhooks/tradedoubler (fail-closed), LinkConverterSyncJob → public/js/td-lc.js, EPI helpers, weekly newsletter merges exclusives" }
        - { name: First-party partner marketing UI,                          status: done, notes: "Partner::Program/Membership/Click/Conversion + PartnerMarketing attribution + /partner/programs + /p/:token click redirect" }
        - { name: permission-marketing newsletters (Seth Godin editions),    status: done, notes: "NewsletterComposer + NewsletterVisuals + NewsletterEdition + postpro/repligen hero; weekly deals use Affiliate + EPI + vouchers" }
        - { name: AI feed ranking,                                         status: planned, agent: ignore }
        - { name: creator monetization,                                    status: planned, agent: ignore }
        - { name: maps surface,                                            status: done, notes: "maps. subdomain, Places index/show, Mapbox home" }
        - { name: Events (city listing, RSVP, capacity, cancellation),      status: done, notes: "Event + EventRsvp; upcoming keeps running multi-day events; three-way RSVP because interested is the majority answer on every event platform; cancel! notifies attendees rather than deleting; emits EventCreated to the city strip" }
      subapp_tv:
        - { name: "Tv::Channel (slug, avatar, banner, subscribers_count)", status: done, notes: "patch_tv_models.sh" }
        - { name: "Tv::Video (status machine, duration_formatted)", status: done }
        - { name: "Tv::Broadcast (stream_key, go_live!/end_live!)", status: done }
        - { name: "Tv::Subscription", status: done }
        - { name: "Tv::ViewEvent", status: done }
        - { name: "Tv::Show", status: done, notes: "tv_shows migration + ShowsController" }
        - { name: "Tv::Episode", status: done, notes: "tv_episodes migration + belongs_to show/video" }
        - { name: video upload + Active Storage variants,                  status: done, notes: "Tv::Video video_file + thumbnail; webp poster/thumb variants via MediaProcessable" }
        - { name: live stream infrastructure,                              status: planned, agent: ignore, notes: "BLOCKER (verified 2026-07-27): needs a media server (nginx-rtmp / MediaMTX / SRS) plus transcoding, none of which exists. ffmpeg is not installed on vm23 either (see MASTER/DEBT.md), so the transcoding dependency is absent on the target host. Tv::Broadcast already models stream_key/go_live!/end_live! — the gap is infrastructure, not app code." }
        - { name: VideoPublished / BroadcastScheduled events,             status: done, notes: "VideoPublished on status=published; BroadcastScheduled via tracks_activity + BroadcastStarted/Ended" }
      subapp_dating:
        - { name: "Dating::Profile (user, bio, interests)", status: done }
        - { name: "Dating::Like (user, liked_user)", status: done }
        - { name: "Dating::Dislike (user, disliked_user)", status: done }
        - { name: "Dating::Match (Matchmaking — mutual likes)", status: done }
        - { name: swipe UI (Turbo Streams, Stimulus),                       status: done }
        - { name: city + radius filter,                                     status: done, notes: "Matchmaking radius_km + neighborhood scope" }
        - { name: match → messaging handoff,                                status: done, notes: "Dating::Match#announce_match → Conversation.find_or_create_direct" }
        - { name: photos on profile,                                        status: done, notes: "has_many_attached photos, edit purge, ProfileMediaJob variants" }
        - { name: premium memberships / boost purchases,                    status: planned, agent: ignore }
      subapp_marketplace:
        notes: >
          Native Marketplace::* is live. Solidus path (solidus + solidus_starter_frontend
          + solidus_marketplace) is the Amazon-parity target; enable with SOLIDUS_MARKETPLACE=1.
          See brgen/docs/SOLIDUS_MARKETPLACE.md.
        items:
        - { name: "Marketplace::Product (name, description, price, image)", status: done, notes: "Marketplace::Listing native Rails 8" }
        - { name: "Marketplace::Category", status: done }
        - { name: "Marketplace::Review", status: done, notes: "reviews table + Marketplace::ReviewsController; buyer-order gate + rating refresh" }
        - { name: schema.org Product microdata in views,                    status: done }
        - { name: "Marketplace::Order (state machine)", status: done }
        - { name: buyer–seller Chat,                                        status: done, notes: "Conversation#create from listing show" }
        - { name: geo-localized listings,                                   status: done, notes: "listing lat/lng + GeoLocatable near scope + radius_km filter in listings#index" }
        - { name: locale subdomain routing (markedsplass/markadur/…),      status: done, notes: "DomainRegistry aliases + routes derived from SUBAPP_ALIASES + marketplace_root_url helper" }
        - { name: FTS filtering,                                            status: done, notes: "live_search on listings/stores/deals + saved searches" }
        - { name: solidus core mount (catalog/cart/checkout/admin),         status: planned, notes: "Gemfile + initializer + /solidus mount stub ready; solidus:install on staging only (SOLIDUS_MARKETPLACE=1). BLOCKER (verified 2026-07-27): database.yml is sqlite3 in all four environments incl. production, and Solidus supports Postgres/MySQL — not SQLite — for production. So this is a Postgres migration first, not a gem install. Secondary: initializer itself says never run solidus:install on the hot 1GB VPS, and solidus_marketplace is pinned at 0.1.0 (legacy) against Solidus 4.7." }
        - { name: solidus_starter_frontend storefront,                     status: planned, notes: "Amazon-like PDP/cart/checkout UI after solidus:install" }
        - { name: solidus_marketplace multi-seller,                        status: planned, notes: "3P sellers; gem 0.1.0 legacy — validate on Solidus 4.7" }
        - { name: Amazon feature parity map,                               status: planned, notes: "PDP, search facets, cart, multi-seller, reviews, order history — see SOLIDUS_MARKETPLACE.md" }
        - { name: AI recommendations,                                       status: planned, agent: ignore }
      subapp_playlist:
        - { name: "Playlist::Set (name, description, user)", status: done }
        - { name: "Playlist::Track (name, artist, audio_url, set)", status: done }
        - { name: schema.org microdata in views,                            status: done, notes: "MusicPlaylist/MusicRecording itemtypes in _player + json_ld_for on show" }
        - { name: "Playlist::Listen", status: done, notes: "playlist_listens + ListensController swipe tracking" }
        - { name: embeddable player,                                        status: done, notes: "playlists#embed iframe route + playlist_player Stimulus + external embed URLs" }
        - { name: Spotify/YouTube/SoundCloud import,                        status: done, notes: "Playlist::TrackImport + playlist/imports#create" }
        - { name: city-scoped trending feed,                                status: done, notes: "Playlist::Playlist.city_trending used where listed; playlists#index is deliberate radio_tunnel immersive home (trending elsewhere)" }
        - { name: expiration dates on tracks,                               status: done, notes: "expires_at on playlist_tracks + unexpired scope + hosted_tracks form" }
        - { name: creator donations / ad-free tier,                         status: planned, agent: ignore }
      subapp_takeaway:
        - { name: "Takeaway::Item (name, description, price)", status: done, notes: "Takeaway::MenuItem" }
        - { name: "Takeaway::Order (user, status:string)", status: done }
        - { name: Restaurant model (geocoding),                             status: done, notes: "Takeaway::Restaurant geocode_if_needed + city anchor offsets + lat/lng index" }
        - { name: MenuItem availability state machine,                      status: done, notes: "available flag + available_for_order? + order_item menu_item_must_be_available validation" }
        - { name: Order full state machine (placed→delivered),              status: done, notes: "Takeaway::Order TRANSITIONS pending→delivered + transition_to! + status notifications" }

