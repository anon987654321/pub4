        - { name: richer weather agent suggestions,                        status: planned, agent: ignore }
        - { name: global trends / local designer highlights,               status: planned, agent: ignore }
        - { name: style agents (MASTER integration),                       status: planned, agent: ignore }
        - { name: live video streaming,                                    status: planned, agent: ignore }

  bsdports:
    title: bsdports
    domain: bsdports.org
    port: 47312
    stack_now: SQLite3, Rails 8, Hotwire, Falcon, Active Storage, OpenBSD, relayd
    stack_later: PostgreSQL, pgvector, infrastructure knowledge graph, OpenBSD package intelligence
    deploy_script: RAILS/bsdports/bsdports.sh
    deploy_root: RAILS/bsdports
    public: true
    features:
      core:
        - { name: Platform (name) — OpenBSD/FreeBSD/NetBSD,                  status: done, notes: "platforms table seeded openbsd/freebsd/netbsd" }
        - { name: Category (name, platform),                                status: done, notes: "categories.platform_id scoped slug" }
        - { name: Port (name, summary, url, description, category, platform), status: done, notes: "ports.platform_id + pkgpath unique per platform; comment field is OpenBSD COMMENT" }
        - { name: Dependency model,                                         status: done }
        - { name: SecurityAdvisory model,                                   status: done }
        - { name: Maintainer model,                                         status: done }
        - { name: live search on name/summary/description (Hotwire),       status: done, notes: "ports_fts + PortsSearch" }
        - { name: OpenBSD ports tree import (Makefile walk + HTTPS fallback), status: done, notes: "MakefileParser + Importer + PortsImportJob; unresolved deps logged to ImportRun. Three sources, best metadata first: local /usr/ports tree, then ports.tar.gz over HTTPS (full metadata, gated on 2 GB free via BSDPORTS_PORTS_TARBALL=1), then the mirror's published package index (names+versions only, 13k rows). The old FTP fallback was unreachable — the importer raised on a missing tree before it — and pointed at /pub/OpenBSD/ports/<cat>/INDEX, which 404s; FtpIndexFetcher/IndexParser deleted 2026-08-05." }
        - { name: FreeBSD/NetBSD ports parsers,                            status: planned, agent: ignore, notes: "OpenBSD-only production scope; platforms seeded inactive" }
        - { name: dependency tree visualization,                            status: done, notes: "Dependency.tree_for cycle guard + _dependency_tree.html.erb role=tree + reverse-deps on show" }
        - { name: ports tree scheduled re-import job,                       status: done, notes: "recurring.yml nightly_ports_import + PortsImportJob on bulk queue + db/queue_schema.rb" }
        - { name: WCAG AAA compliance pass,                                status: done, notes: "ARIA tree/list roles on port surfaces, aria-labelledby dep graph (decorative SVG), exploration copy; not a full-site AAA audit" }
        - { name: AI exploration assistant,                                status: done, notes: "Ports::ExploreAssistant + ports#explore JSON summary on show" }
      planned:
        - { name: semantic package search (pgvector),                      status: planned, agent: ignore }
        - { name: infrastructure knowledge graph,                          status: planned, agent: ignore }
        - { name: OpenBSD package intelligence,                            status: planned, agent: ignore }

