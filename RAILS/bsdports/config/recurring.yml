production:
  nightly_ports_import:
    class: PortsImportJob
    queue: bulk
    # No args: PortsImportJob#perform takes keywords only, and these three
    # values were identical to its defaults. As a YAML sequence they were
    # splatted positionally (3 hashes into a kwargs-only method) and raised
    # ArgumentError, so the nightly import never ran.
    schedule: every day at 3am

  advisory_refresh:
    class: SecurityAdvisoryRefreshJob
    queue: bulk
    schedule: every day at 4am

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
