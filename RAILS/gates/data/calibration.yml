# Human calibration set for design gates (P5).
# Labels: pass | soft | fail
# Gate agreement keeps scores from drifting into cargo-cult regex.
#
# Process (monthly):
#   1. Add ~20 labeled screens (fixture or captured HTML path)
#   2. ruby RAILS/gates/runner.rb calibration
#   3. Review false positives/negatives + weight suggestions
#   4. Optionally apply: GATE_CALIBRATION_APPLY=1
#
# human is ground truth. Gate scores are hypotheses.

schema: 1
agreement_floor: 0.85
# Soft-band: human=soft accepts gate pass OR soft fail OR score within 15 of target
soft_band: 15

# Optional weight overrides applied when GATE_CALIBRATION_APPLY=1 writes
# calibration_weights.yml (visual quality dimensions).
tune:
  quality_weights:
    landmarks: 20
    hierarchy: 20
    cta_budget: 15
    guest_open: 15
    dialect_purity: 15
    density: 15
  quality_target: 80
  layout_search_target: 90
  exemplar_min_ratio: 0.85

labels:
  # --- Marketplace tile ---
  - id: marketplace_tile_good
    fixture: fixtures/exemplars/good_marketplace_tile.html
    surface: marketplace
    exemplar: marketplace_tile
    human: pass
    rater: seed
    notes: "Tise/Bol price-first whole-card tile"

  - id: marketplace_tile_bad
    fixture: fixtures/exemplars/bad_marketplace_tile.html
    surface: marketplace
    exemplar: marketplace_tile
    human: fail
    rater: seed
    notes: "Title-first + feed-card dialect leak"

