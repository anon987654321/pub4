# The gate registry. One row per gate, and this file is the only place a gate
# is declared.
#
# It replaces four hand-maintained tables that had to agree with each other:
# runner.rb's GATE_MAP (name -> file), IN_PROCESS (name -> class),
# SUBPROCESS_ONLY (the set difference of those two, stored by hand) and
# GATE_COVERED_BY (leaf -> composite). Adding a gate meant editing up to four
# places, and GATE_MAP's file paths outlived the shims they pointed at.
#
# Fields
#   require     path under RAILS/gates/, loaded before the class is named
#   class       Deploy::* constant answering .run and returning a GateResult
#   pass        success line; %{apps} / %{schemas} / %{assets} resolve via
#               runner.rb's COUNTERS
#   covered_by  the composite that already runs this gate as a leaf, so --all
#               does not run it twice
#   script      set instead of require/class for gates that stay subprocesses
#   env_flags   ENV name -> keyword argument, passed to .run when the var is "1"
#   needs       preconditions the machine must satisfy for this gate to measure
#               anything. Today the only value is `browser`, which was runner.rb's
#               hardcoded BROWSER_BACKED list — a fifth hand-maintained table of
#               exactly the kind this file replaced.
#
# There is deliberately no `cost` field, and it is not an oversight.
#
# A cost declared here is a number somebody typed once, and this registry exists
# because four such tables drifted from each other. The failure a cost field is
# meant to catch is a gate that DOUBLES — constitutional_scan at 48 minutes on
# brgen, rendered_suite at an hour on a Mac — and a declaration can never show a
# doubling; only a history can. The ledger already records duration_ms per gate
# per run, so runner.rb prints each gate's measured median before it starts and
# says "unmeasured here" for the ones this machine has never run. A gate whose
# median moves is visible in `runner.rb --ledger`.
#
# Order is run order.

production:
  require: lib/host/production
  class: Deploy::ProductionGate
  pass: "Production gate passed for %{apps} Rails apps."
  env_flags:
    GATE_SKIP_NESTED: skip_nested

rendered_invariants:
  needs: [browser]
  require: lib/rendered/rendered_invariants
