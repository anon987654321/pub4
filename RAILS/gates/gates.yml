# Does a press on this control reach this control? elementFromPoint at each
# control centre, so deliberate stacking (fixed nav, modal, chat widget) is
# not mistaken for a defect the way rect intersection would.
occlusion:
  needs: [browser]
  require: lib/rendered/occlusion
  class: Deploy::OcclusionGate
  pass: "ok: every control answers a press at its own centre"
  covered_by: rendered_suite

# PERF-100. The vitals sampler in hotwire.js has beaconed LCP/CLS/INP at one
# percent for some time and nothing ever failed on the numbers; GATE_ADEQUACY
# item 8 records the hole. Source half asserts the field collection still runs,
# live half measures the two paint metrics against a budget.
web_vitals_budget:
  require: lib/rendered/web_vitals_budget
  class: Deploy::WebVitalsBudget
  pass: "ok: LCP and CLS within budget, field collection intact"

# PWA-100 and BRGEN-115. Three manifests, and nothing checked that the icons
# they declare exist or that brgen's name follows the host's city. An icon
# resolves from two public roots — the app's and the shared engine's, which
# mounts its own ActionDispatch::Static — so a check that reads one of them
# reports two apps as broken when they are not.
pwa_installable:
  require: lib/source/pwa_installable
  class: Deploy::PwaInstallable
  pass: "ok: three manifests installable, icons resolve, brgen follows its host"
