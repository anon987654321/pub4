<!DOCTYPE html>
<html lang="nb">
<head><meta charset="utf-8"><title>Live</title></head>
<body>
  <a class="skip-link" href="#main-content">Skip to main</a>
  <main id="main-content">
    <div class="page-header live-header">
      <h1>Live</h1>
      <nav class="live-sort feed-tabs">
        <a href="/live?sort=hot">Hot</a>
        <a href="/live?sort=fresh">New</a>
      </nav>
    </div>
    <section class="live-rules"><details><summary>Local &amp; anonymous — ground rules</summary></details></section>
    <form class="compose-box live-compose" action="/live" method="post">
      <textarea name="post[content]" maxlength="500"></textarea>
      <input type="submit" value="Post Live" />
    </form>
    <section class="live-feed" id="live-feed">
      <article class="live-card">
        <header class="live-card-meta"><span class="live-card-author">anon</span></header>
        <p class="live-card-body">Free coffee by the fountain</p>
      </article>
    </section>
  </main>
</body>
</html>
