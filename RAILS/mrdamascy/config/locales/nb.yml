  about:
    language: Språk
    title: Fra Damaskus med kjærlighet
    story_title: Historien
    story: Bestefar solgte shawarma ved Souq al-Hamidiyah i Damaskus — toum hver morgen, lam tynt skåret, brød fra steinovnen. I dag griller vi samme oppskrift på Danmarksplass i Bergen, med samme gjestfrihet og kortere vei til maten.
    fair_title: Rettferdig mat, rettferdig vei
    fair: 'Ingen Foodora mellom oss: pengene går direkte til kjøkkenet som lager maten din. Du betaler med Vipps på 3 steg — raskere enn å klikke deg gjennom åtte skjermer.'
    world_tour_title: Verdensturné i kebab
    world_tour_body: Menyen vår er en hyllest til kebabens store byer — fra Damaskus til Berlin, Beirut til Sydney. Én kjøkkenedør, hele verdens grillede arv.
    credits_title: Takk til de store
    credit_damaskus: 'Damaskus — sjelen i merket: toum, tarator og knefeh fra gatene ved Souq al-Hamidiyah.'
    credit_beirut: 'Beirut — Joseph og Jabbour: mager, smakfull lam shawarma med granateple-løk.'
    credit_berlin: 'Berlin — Hasir (1971, döner-sandwichens oppfinner), Mustafa''s Gemüse Kebap, Rüyam og Imren Grill: grønnsaker med førstegangsplass og sauser med gavmildhet.'
    credit_bursa: 'Bursa — İskender siden 1867: smør, tomatsaus og yoghurt i hellig rekkefølge.'
    credit_gaziantep: 'Gaziantep — UNESCOs kebab-by: Ali Nazik og verdens beste baklava.'
    credit_istanbul: 'Istanbul — Dürümzade: dürüm med ren gatemat-energi.'
    credit_tel_aviv: 'Tel Aviv/NYC — Miznon: blomkål som hovedperson, stemmen til en showmann.'
    credit_bergen: 'Bergen — Emil''s Kebab (Bergens beste ifølge BT, Wolt Awards 2023) og Bergens kebabkultur: rene hansker, kvartover, salatbar og kebabrull.'
    credit_gdk: 'GDK — klubbkort og Boss-boks: deal-energi vi har lånt med glede.'
    credit_stockholm: Stockholm — kebabpizzaens fødested.
