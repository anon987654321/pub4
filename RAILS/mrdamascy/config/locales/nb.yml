    fairness_title: Uten mellomledd
    fairness_body: Du betaler kjøkkenet direkte med Vipps — null provisjon til mellommenn. Mer til bakeren, bøndene og kokkene.
    orders_link: Se bestillingene dine
    story_body: Mr. Damascy startet med bestefars shawarma-spyd ved Souq al-Hamidiyah i Damaskus. I dag spinner samme oppskrifter i Bergen — med toum laget hver morgen og brød fra bakeren neste dør.
    vipps_title: Vipps på 3 steg
    vipps_body: Velg rett, trykk «Betal med Vipps», godkjenn i Vipps-appen. Ingen kortfelter, ingen promo-koder — rabatter legges inn automatisk.
