    vipps_security_title: Trygg betaling med Vipps
    vipps_security: Betalingen går gjennom Vipps — vi ser aldri kortet ditt, for du trenger det aldri. Godkjenn med fingeravtrykk eller kode, ferdig.
    salatbar_title: Salatbar-kulturen
    salatbar_body: Bergen lærte oss salatbaren — rødkål, mais, sylteagurk, alt. Den beholder vi. Den er gratis, som den hører hjemme.
