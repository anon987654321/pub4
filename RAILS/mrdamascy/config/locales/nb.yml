  origins:
    damaskus: Oppskriften fra bestefars shawarma-bod ved Souq al-Hamidiyah. Hvitløkssausen lages hver morgen — toum som dere husker den.
    beirut: Beirut skjærer lammen tynt og gavmildt — Joseph og Jabbour lærte oss at granateple og rødløk er beste vennepar. Én bit, og du står på Corniche.
    berlin: 'Hasir oppfant döner-sandwichen i 1971, og Mustafa gjorde køen til en institusjon. Vår versjon er full av grønnsaker — som Berlin selv: travel, varm og overraskende grønn.'
    adana: Fra Adanas kullgriller — sterk, røykfylt og helt ærlig. Dürümzade i Istanbul lærte oss at et godt dürüm spises med begge hender og litt ærefrykt.
    bergen: Kvartover-ærlig, salatbar med god selvtillit, middagskebab når regnet har satt inn. Emil lærte oss rene hansker og store porsjoner — Bergen lærte oss å dele dem i løpet.
    dubai: Gatene i Dubai legger pommes frites inne i wrapen — og hvem er vi til å si nei? Sprøtt, salt og overraskende perfekt.
    tel_aviv: Miznon gjorde blomkålen til stjernen, og vi nikket anerkjennende. Helstekt med sitron — grønnsaken får førstegangsplassen.
    bursa: İskender har servert smør, tomatsaus og yoghurt siden 1867. Vi rører ikke arven — vi lar smøret flyte.
    gaziantep: Gaziantep er kebabens UNESCO-by. Ali Nazik med røyket aubergine, og baklava som knaser som høstløv.
    familie: Fest-mezzeen kommer ikke fra én by — den kommer fra alle middagsbordene i Damaskus. Deles med hendene, avsluttes med «Sahtein!»
    stockholm: Stockholm fant opp kebabpizzaen, og vi takker med respekt og ekstra ost. Lørdagsmat uten diskusjon.
    sydney: Sent på kvelden i Sydney fins HSP — Halal Snack Pack. Pommes, kjøtt, ost og kokkens hemmelige saus. Nattmatens svar på en klem.
