  about:
    language: Language
    title: From Damascus with love
    story_title: The story
    story: Grandfather sold shawarma by Souq al-Hamidiyah in Damascus — toum every morning, lamb carved thin, bread from the stone oven. Today we grill the same recipe at Danmarksplass in Bergen, with the same hospitality and a shorter road to your food.
    fair_title: Fair food, fair road
    fair: 'No Foodora between us: the money goes straight to the kitchen that makes your food. You pay with Vipps in 3 steps — faster than clicking through eight screens.'
    world_tour_title: A world tour of kebab
    world_tour_body: Our menu is a tribute to kebab's great cities — from Damascus to Berlin, Beirut to Sydney. One kitchen door, the whole grilled heritage of the world.
    credits_title: Thanks to the greats
    credit_damaskus: 'Damascus — the soul of the brand: toum, tarator and knefeh from the streets by Souq al-Hamidiyah.'
    credit_beirut: 'Beirut — Joseph and Jabbour: lean, flavourful lamb shawarma with pomegranate onion.'
    credit_berlin: 'Berlin — Hasir (1971, inventor of the döner sandwich), Mustafa''s Gemüse Kebap, Rüyam and Imren Grill: vegetables in the front row and sauces with generosity.'
    credit_bursa: 'Bursa — İskender since 1867: butter, tomato sauce and yoghurt in holy order.'
    credit_gaziantep: 'Gaziantep — UNESCO''s kebab city: Ali Nazik and the world''s best baklava.'
    credit_istanbul: 'Istanbul — Dürümzade: dürüm with pure street-food energy.'
    credit_tel_aviv: 'Tel Aviv/NYC — Miznon: cauliflower as the lead actor, the voice of a showman.'
    credit_bergen: 'Bergen — Emil''s Kebab (Bergen''s best according to BT, Wolt Awards 2023) and Bergen kebab culture: clean gloves, the quarter-kilo, the salad bar and the kebab roll.'
    credit_gdk: 'GDK — loyalty card and the Boss Box: deal energy we happily borrowed.'
    credit_stockholm: Stockholm — the birthplace of kebab pizza.
    credit_sydney: 'Sydney — the after-midnight HSP: the night''s answer to a hug.'
    credit_dubai: Dubai — fries inside the wrap. Simple genius.
    vipps_security_title: Secure payment with Vipps
    vipps_security: Payment goes through Vipps — we never see your card, because you never need one. Approve with fingerprint or code, done.
    salatbar_title: The salad-bar culture
    salatbar_body: Bergen taught us the salad bar — red cabbage, corn, pickles, everything. We're keeping it. It's free, like it should be.
    contact_title: Find us
    address_label: Address
    hours_label: Opening hours
    phone_label: Phone
    back: Back to the menu
    credit_adana: The Adana dürüm is grilled over coals the way Istanbul's streets demand.
    fairness_title: No middlemen
    fairness_body: You pay the kitchen directly with Vipps — zero commission to middlemen. More for the baker, the farmers and the cooks.
    orders_link: See your orders
    story_body: Mr. Damascy began with grandfather's shawarma spit at Damascus' Souq al-Hamidiyah. Today the same recipes spin in Bergen — toum made fresh each morning, bread from the bakery next door.
    vipps_title: Vipps in 3 steps
    vipps_body: Pick a dish, tap Pay with Vipps, approve in the Vipps app. No card fields, no promo codes — discounts apply automatically.
    worldtour_title: A world tour of kebab
    worldtour_intro: 'We tasted our way around the world and took the best from every city:'
