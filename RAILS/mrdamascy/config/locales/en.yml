  origins:
    damaskus: The recipe comes from grandfather's shawarma stall by Souq al-Hamidiyah. The garlic sauce is made every morning — toum the way you remember it.
    beirut: Beirut carves its lamb thin and generous — Joseph and Jabbour taught us that pomegranate and red onion are the best of friends. One bite and you're standing on the Corniche.
    berlin: 'Hasir invented the döner sandwich in 1971, and Mustafa turned the queue into an institution. Our version is loaded with vegetables — like Berlin itself: busy, warm and surprisingly green.'
    adana: From Adana's charcoal grills — hot, smoky and completely honest. Dürümzade in Istanbul taught us that a good dürüm is eaten with both hands and a little awe.
    bergen: Quarter-kilo honest, a salad bar with self-confidence, dinner kebab when the rain sets in. Emil taught us clean gloves and big portions — Bergen taught us to share them on the go.
    dubai: The streets of Dubai tuck french fries inside the wrap — and who are we to say no? Crunchy, salty and unexpectedly perfect.
    tel_aviv: Miznon made cauliflower the star, and we nodded in respect. Whole-roasted with lemon — the vegetable gets front-row billing.
    bursa: İskender has served butter, tomato sauce and yoghurt since 1867. We don't touch the heritage — we let the butter flow.
    gaziantep: Gaziantep is UNESCO's kebab city. Ali Nazik with smoky aubergine, and baklava that crackles like autumn leaves.
    familie: The festive mezze comes from no single city — it comes from every dinner table in Damascus. Shared by hand, finished with 'Sahtein!'
    stockholm: Stockholm invented kebab pizza, and we say thank you with respect and extra cheese. Saturday food, no debate.
    sydney: Late at night in Sydney there's the HSP — Halal Snack Pack. Fries, meat, cheese and the chef's secret sauce. The night's answer to a hug.
