default: &default
  adapter: sqlite3
  journal_mode: WAL
  pool: <%= ENV.fetch("FALCON_WORKERS", ENV.fetch("RAILS_MAX_THREADS") { 5 }) %>
  timeout: 5000

development:
  primary:
    <<: *default
    database: storage/development.sqlite3
  cache:
    <<: *default
    database: storage/development_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/development_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/development_cable.sqlite3
    migrations_paths: db/cable_migrate

# TEST_DB_ID gives a test run its own database files.
#
# Rails already suffixes per parallel *worker* (storage/test.sqlite3_0, _1, …),
# which is why a single suite is fine. It does not suffix per *session*, and this
# repo is worked by several agents in one checkout: two `rails test` runs in brgen
# open the same files, and with journal_mode WAL and a 5s timeout the loser gets
# SQLite3::BusyException on every test. Measured 2026-08-10 — one run reported 279
# errors, all "database is locked", against a tree whose serial run was clean.
#
# Unset it and nothing changes: CI and a lone developer keep storage/test.sqlite3
# exactly as before. Set it per session (`export TEST_DB_ID=$$`, or any distinct
# string) and the runs stop colliding.
test:
  primary:
    <<: *default
    database: storage/test<%= ENV["TEST_DB_ID"] %>.sqlite3
  cache:
    <<: *default
    database: storage/test_cache<%= ENV["TEST_DB_ID"] %>.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/test_queue<%= ENV["TEST_DB_ID"] %>.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/test_cable<%= ENV["TEST_DB_ID"] %>.sqlite3
    migrations_paths: db/cable_migrate

production:
  primary:
    <<: *default
    database: storage/production.sqlite3
  cache:
    <<: *default
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
