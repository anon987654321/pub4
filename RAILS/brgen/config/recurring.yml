# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  compose_daily_newsletter:
    class: ComposeNewsletterEditionJob
    queue: bulk
    args: ["daily"]
    schedule: every day at 7:30am

  daily_digest_email:
    class: DailyDigestJob
    queue: bulk
    schedule: every day at 8am

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  compose_weekly_deals_newsletter:
    class: ComposeNewsletterEditionJob
    queue: bulk
    args: ["weekly_deals"]
    schedule: every monday at 7:30am

  weekly_deals_digest:
    class: WeeklyDealsJob
    queue: bulk
    schedule: every monday at 8am

  weekly_stats_rollup:
    class: WeeklyStatsJob
    queue: bulk
    schedule: every monday at 7am

  cache_health_check:
    class: CacheHealthJob
    queue: bulk
    schedule: every day at 4am

  cable_health_check:
    class: CableHealthJob
    queue: bulk
    schedule: every hour at minute 7

  queue_failure_digest:
    class: QueueFailureDigestJob
    queue: bulk
    schedule: every day at 5am

  nightly_search_index_rebuild:
    class: NightlySearchIndexRebuildJob
    queue: bulk
    schedule: every day at 2am

  affiliate_import:
    class: AffiliateImportJob
    queue: bulk
    schedule: every day at 3:15am
  # Weekly, and the one report that can tell "nobody clicked" from "tracking is
  # broken" — which a network dashboard reports as the same zero.
  partner_attribution_report:
    class: PartnerAttributionReportJob
    queue: bulk
    schedule: every monday at 6am

  link_converter_sync:
    class: LinkConverterSyncJob
    queue: bulk
    schedule: every 5 minutes

  monthly_analytics_rollup:
    class: MonthlyAnalyticsRollupJob
    queue: bulk
    schedule: every month on the first at 3am

  expired_messages_sweep:
    class: ExpiredMessagesSweepJob
    queue: bulk
    schedule: every 15 minutes

  # Tells a seller a week before their listing lapses. Nothing is deleted or
  # hidden by it — `live` already keeps an expired listing off public surfaces —
  # so this is only the warning.
  listing_expiry_notices:
    class: ListingExpiryJob
    queue: bulk
    schedule: every day at 9am

  # `alive` already hides an expired story everywhere, so this is about the bytes
  # rather than the visibility: without it the rows and their Active Storage
  # blobs accumulate forever on a 1 GB VPS.
  expired_stories_sweep:
    class: ExpiredStoriesSweepJob
    queue: bulk
    schedule: every hour at minute 20

  # Runs saved searches that have alerts switched on. The job self-limits to one
  # alert per search per 6 hours, so the schedule sets how fresh an alert can be,
  # not how often anyone is interrupted.
  saved_search_alerts:
    class: SavedSearchAlertJob
    queue: bulk
    schedule: every 30 minutes

  # Written but never scheduled. resume_session mints a real User row for every
  # cookieless visitor, so this table grows with crawler traffic and nothing was
  # ever going to remove those rows. Needs the (guest, created_at) index from
  # migration 20260801160000.
  prune_guest_users:
    class: Shared::PruneGuestUsersJob
    queue: bulk
    schedule: every day at 3:45am

  # GDPR erasure: anonymise accounts whose 30-day deletion grace has elapsed.
  purge_deleted_users:
    class: UserPurgeJob
    queue: bulk
    schedule: every day at 3:50am

  # Point-in-time backup of production.sqlite3 (VACUUM INTO + gzip, keep 7).
  # Real backups while litestream is uninstalled; same-disk until an off-host
  # PUB4_BACKUP_DIR or a litestream s3:// replica is configured.
  database_snapshot:
    class: Shared::DatabaseSnapshotJob
    queue: bulk
    schedule: every day at 2:20am
