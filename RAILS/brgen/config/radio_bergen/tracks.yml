# Radio Bergen restored track manifest.
#
# The binaries live beside this manifest now, at brgen/public/audio/akmd/, and
# are tracked: vps-deploy is `git pull --ff-only`, so an untracked file can
# never reach the box, and a manifest naming files the server does not have is
# the inert-config shape this repo keeps producing. 113 MB of already-128kbps
# audio against a 3.3 GB .git is the same trade .gitignore makes for demo-each.
#
# Playback rights: cleared by the operator 2026-08-27. AKMD is the crew (Alt
# Kult Ma Do) and Chase Swayze is its Houston affiliate, so every track here is
# ours to publish. The one file that was not — a commercially released J Dilla
# track sitting in the same pub2 folder — was deleted rather than copied.

meta:
  source_archive: anon987654321/pub2
  restored_for: pub4
  product: Radio Bergen
  review_required:
    - licensing
    - attribution
    - takedown_contact
    - cache_policy

