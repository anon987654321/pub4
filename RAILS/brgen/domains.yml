# Host pattern for agents. Not loaded at runtime.
#
# Source of truth for cities and marketplace aliases:
#   Brgen::DomainRegistry  (lib/brgen/domain_registry.rb)
# Agent entry with the subapp table:
#   AGENTS.md
#
# CITY_NETWORK_DOMAINS is product membership; LIVE_DOMAINS is operator-verified
# TLS readiness. The city network footer, search palette and mobile switcher
# use DomainRegistry.live_network_entries, so pending domains stay out of public
# links until DNS and TLS are verified. A click changes apex and tenant; it
# does not merge city data. Verticals are subdomains of the city apex, not path
# prefixes or separate Rails apps. Every ENTRIES city follows this host rule.
# Apexes are usually the city with a vowel missing
# (brgen.no, oshlo.no, lndon.uk, chcago.us).

# <subapp>.<city-apex>
#
#   brgen.no                 lsangeles.com                 main feed
#   markedsplass.brgen.no    marketplace.lsangeles.com     marketplace (word is localized)
#   dating.brgen.no          dating.lsangeles.com
#   markedsplass.brgen.no/food marketplace.lsangeles.com/food   marketplace food
  takeaway.brgen.no        takeaway.lsangeles.com              legacy food host
#   tv.brgen.no              tv.lsangeles.com
#   maps.brgen.no            maps.lsangeles.com
#   radio.brgen.no        radio.lsangeles.com
#   messenger.brgen.no       messenger.lsangeles.com
#
# ai.brgen.no is MASTER, not a vertical. amberapp.art is a different app.

primary:
  name: Brgen
  city: Bergen
  country: Norway
  language: nb
  tld: no
  domains:
    core: brgen.no
    marketplace: markedsplass.brgen.no
    food: markedsplass.brgen.no/food
    dating: dating.brgen.no
    takeaway: takeaway.brgen.no
    tv: tv.brgen.no
    maps: maps.brgen.no
    playlist: radio.brgen.no
    messenger: messenger.brgen.no
