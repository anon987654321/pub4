<!doctype html>
<html lang="nb">
<head>
  <title>Siden finnes ikke — brgen</title>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="/styles/errors.css">
  <style>
    :root { --x-bg: #0f0f12; --x-text: #e8e6ef; --x-accent: #7c6cf0; --x-border: #3a3748; }
    .error-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.25rem; justify-content: center; }
    .error-actions a {
      display: inline-flex; align-items: center; min-height: 44px; padding: 0.5rem 1rem;
      border: 1px solid var(--x-border); border-radius: 4px; text-decoration: none; font-weight: 600;
    }
    .error-actions a.primary { background: var(--x-accent); color: #fff; border-color: var(--x-accent); }
    .kicker { color: var(--x-text-secondary); font-size: 0.875rem; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">brgen · 404</p>
    <header>
      <h1 style="font-size:1.5rem;margin-bottom:0.75rem">Siden finnes ikke</h1>
    </header>
    <article>
      <p>Adressen matcher ingen side. Prøv hjem, Live eller markedsplassen — du trenger ikke konto.</p>
      <p lang="en" style="margin-top:0.5rem;color:var(--x-text-secondary);font-size:0.9em">That page is gone or never existed. Try home, Live, or the marketplace.</p>
      <nav class="error-actions" aria-label="Neste steg">
        <a class="primary" href="/">Hjem</a>
        <a href="/live">Live</a>
        <a href="/search">Søk</a>
        <a href="https://markedsplass.brgen.no/">Markedsplass</a>
      </nav>
    </article>
  </main>
</body>
</html>
