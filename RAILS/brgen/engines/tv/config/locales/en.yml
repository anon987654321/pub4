# Engine-local strings.
#
# Every engine string used to live in brgen/config/locales, which made a
# literal in the markup the path of least resistance for engine work and left
# the engine unmountable anywhere else. Rails::Engine appends
# config/locales/*.yml to I18n.load_path on its own -- no wiring beyond this
# file existing -- and I18n deep-merges across load paths, so keys under the
# same namespace in the host file stay reachable.
#
# Keys the host already carries are NOT copied here. Use them.
en:
  tv:
    add_comment: "Add a comment"
    add_note: "Add a note"
    channel_actions_aria: "Channel actions"
    channel_results_aria: "TV channel results"
    channels_empty_body: "Channels will appear when creators publish."
    city_tv: "%{city} TV"
    discussion: "Discussion"
    live_streams_list_aria: "Live streams list"
    live_streams_unavailable: "Live streaming is not running yet. The form saves the stream, but no streaming server can receive video and sound."
    no_channels_match: "No channels match this search."
    note_timestamp: "Timestamp (seconds)"
    notes: "Notes"
    recent: "Recent"
    share: "Share"
    shows_aria: "TV shows"
    videos: "Videos"
