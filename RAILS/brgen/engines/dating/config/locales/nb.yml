    bio: "Bio"
    gender: "Kjønn"
    location: "Sted"
    visible_label: "Gjør profilen synlig"
    profile_photo: "Profilbilde"
    photo_of: "Bilde av %{name}"
    selfie_of: "Selfie fra %{name}"
    visibility: "Synlighet"
