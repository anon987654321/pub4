# Engine-local strings.
#
# Every engine string used to live in brgen/config/locales, which made a
# literal in the markup the path of least resistance for engine work and left
# the engine unmountable anywhere else. Rails::Engine appends
# config/locales/*.yml to I18n.load_path on its own -- no wiring beyond this
# file existing -- and I18n deep-merges across load paths, so keys under the
# same namespace in the host file stay reachable.
#
# Keys the host already carries are NOT copied here. Use them.
nb:
  marketplace:
    precise_coordinates: "Nøyaktige koordinater (valgfritt)"
    top: "Topp"
    verified: "Verifisert"
    order_notification:
      offer_accepted: "Tilbudet er godtatt"
      offer_accepted_body: "Tilbudet ditt på %{title} ble godtatt."
      offer_declined: "Tilbudet er avslått"
      offer_declined_body: "Tilbudet ditt på %{title} ble avslått."
      payment_received: "Betaling mottatt"
      payment_received_body: "Betaling for %{title} er gjennomført."
      payment_confirmed: "Betaling bekreftet"
      payment_confirmed_body: "Betalingen din for %{title} er bekreftet."
      on_its_way: "På vei"
      delivered: "Levert"
    stripe_connect_id: "Stripe Connect-konto"
    stripe_connect_hint: "acct_… fra Stripe Connect. Utbetalinger blir stående til dette er satt og Stripe er konfigurert."
    payouts: Utbetalinger
    payout_release: Send utbetaling
    payout_release_confirm: Sende denne utbetalingen til den tilkoblede Stripe-kontoen?
    payout_sent: Utbetaling sendt
    payout_not_configured: Stripe Connect er ikke satt opp — utbetalingen blir stående.
    payout_not_pending: Den utbetalingen venter ikke på sending.
    payout_held: Holdes til fjorten dager etter levering, uten åpen retur.
    payout_statuses:
      pending: venter
      sent: sendt
      blocked: blokkert
