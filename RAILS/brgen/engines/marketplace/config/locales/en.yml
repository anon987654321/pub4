# Engine-local strings.
#
# Every engine string used to live in brgen/config/locales, which made a
# literal in the markup the path of least resistance for engine work and left
# the engine unmountable anywhere else. Rails::Engine appends
# config/locales/*.yml to I18n.load_path on its own -- no wiring beyond this
# file existing -- and I18n deep-merges across load paths, so keys under the
# same namespace in the host file stay reachable.
#
# Keys the host already carries are NOT copied here. Use them.
en:
  marketplace:
    precise_coordinates: "Precise coordinates (optional)"
    top: "Top"
    verified: "Verified"
    order_notification:
      offer_accepted: "Offer accepted"
      offer_accepted_body: "Your offer for %{title} was accepted."
      offer_declined: "Offer declined"
      offer_declined_body: "Your offer for %{title} was declined."
      payment_received: "Payment received"
      payment_received_body: "Payment for %{title} cleared."
      payment_confirmed: "Payment confirmed"
      payment_confirmed_body: "Your payment for %{title} is confirmed."
      on_its_way: "On its way"
      delivered: "Delivered"
    stripe_connect_id: "Stripe Connect account"
    stripe_connect_hint: "acct_… from Stripe Connect. Payouts stay pending until this is set and Stripe is configured."
    payouts: Payouts
    payout_release: Send payout
    payout_release_confirm: Send this payout to the connected Stripe account?
    payout_sent: Payout sent
    payout_not_configured: Stripe Connect is not configured — the payout stays pending.
    payout_not_pending: That payout is not waiting to be sent.
    payout_held: Held until fourteen days after delivery, with no open return.
    payout_statuses:
      pending: pending
      sent: sent
      blocked: blocked
