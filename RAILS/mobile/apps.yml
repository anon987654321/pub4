# Mobile distribution matrix.
# One source of truth for the installable products that get native store envelopes.
# Secrets and signing fingerprints stay in environment variables.

apps:
  brgen:
    name: Brgen
    host: brgen.no
    url: https://brgen.no/
    kind: core
    android:
      package: no.brgen.brgen
      certificate_env: BRGEN_ANDROID_CERT_SHA256
    ios:
      bundle_id: no.brgen.brgen
      team_id_env: APPLE_TEAM_ID
  radio:
    name: Brgen Radio
    host: radio.brgen.no
    url: https://radio.brgen.no/
