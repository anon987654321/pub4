  # Engine-owned keys. Namespaced under shared: so an app can keep its own
  # flash: block without colliding, and because the call sites say
  # t("shared.flash.…") — appended at top level they resolved to nothing at all.
  shared:
    # Flash messages raised by the engine's own controllers and concerns. These were
    # 30 hardcoded English strings until 2026-08-11, shown over an nb UI in all three
    # apps at once — the shared engine was the largest single block of the 169 the
    # controller_flash lint counts, and the one the original hand count missed.
    flash:
