# Canonical design token anchors — keep in sync with _x_base.scss defaults and face.css :root.
# Regenerate face :root: ruby RAILS/scripts/generate_face_root_css.rb

# Luxury minimalist additions for wardrobe/product UIs (Aesop/Toteme/Nécessaire inspired)
# Warm neutrals, generous spacing, refined typography. Use in amber + shared product views.
luxury:
  # Light mode (preferred for calm product viewing)
  light_bg: "#f8f5f0"
  light_surface: "#ffffff"
  light_text: "#2c2824"
  light_muted: "#6b665f"
  light_border: "#e6e0d8"
  light_accent: "#8c7a5e"   # warm taupe/gold
  # Dark mode (compatible with existing)
  dark_bg: "#1a1816"
  dark_surface: "#24221f"
  dark_text: "#e8e4dc"
  dark_muted: "#8a8278"
  dark_border: "#3a3630"
  dark_accent: "#a38b6f"
  # Shared luxury scale (more breathing room than minimal)
  space_xs: "0.5rem"
  space_sm: "0.875rem"
  space_md: "1.5rem"
  space_lg: "2.25rem"
  space_xl: "3rem"
  space_2xl: "4rem"
  radius_sm: "6px"
  radius_md: "10px"
  radius_lg: "14px"
  # Typography scale
  font_size_display: "2rem"
  font_size_title: "1.5rem"
  font_size_body: "1rem"
  font_size_meta: "0.875rem"
  letter_spacing_tight: "-0.01em"
  line_height_tight: "1.25"
  line_height_relaxed: "1.6"

face_root:
  anchors:
    c_text: "oklch(86% 0.02 300)"
    x_text: "#d8d6e0"
    c_accent: "oklch(78% 0.10 300)"
    c_danger: "oklch(60% 0.14 35)"
    c_code: "oklch(74% 0.11 275)"
  font_mono: '"JetBrainsMono Nerd Font", "JetBrains Mono", "Cascadia Code", "Fira Code", ui-monospace, monospace'
  font_label: '"JetBrainsMono Nerd Font","JetBrains Mono","Cascadia Code",ui-monospace,"SFMono-Regular",Menlo,monospace'
  face_bg: "#0f0e0d"
  derived:
    face_fg: "var(--c-text)"
    face_muted: "color-mix(in srgb, var(--c-text) 35%, transparent)"
    face_dim: "color-mix(in srgb, var(--c-text) 18%, transparent)"
    face_soft: "color-mix(in srgb, var(--c-text) 8%, transparent)"
    mood_accent: "var(--c-accent)"
    border_faint: "color-mix(in srgb, var(--face-fg) 10%, transparent)"
    border_soft: "color-mix(in srgb, var(--face-fg) 14%, transparent)"
    border_strong: "color-mix(in srgb, var(--face-fg) 24%, transparent)"
    hover_tint: "color-mix(in srgb, var(--face-fg) 8%, transparent)"
  layout:
    radius-xs: "0"
    radius-sm: "0"
    radius-md: "0"
    radius-lg: "0"
    radius-pill: "0"
    face-bar-height: "36px"
    # Additive-blending budget: ~17k points; raising size/glow/decay together
    # (the 2026-07-09 "pristine detail tier": 0.024/1.38/0.88) overflows the
    # framebuffer into a solid white oval. These are the last-known-good values.
    face-particle-size: "0.019"
    face-glow-scale: "1.22"
    face-phosphor-decay: "0.80"
    transition-fast: "180ms"
    transition-normal: "300ms"
    ease-out: "cubic-bezier(0.25,0.1,0.25,1)"
    ease-linear: "cubic-bezier(0,0,1,1)"
    ease-in-out: "cubic-bezier(0.4,0,0.6,1)"
    ease-spring: "cubic-bezier(0.32,0.72,0,1)"
    z-canvas: "1"
    z-chrome: "10"
    z-ui: "90"
    z-overlay: "100"
    z-modal: "1000"
    z-toast: "1100"
    z-skip: "2000"

openbsd_wscons:
  x_bg: "#000000"
  x_surface: "#000000"
  x_surface_elevated: "#0a140a"
  x_search_bg: "#0f1a0f"
  x_text: "#63c363"
  x_text_secondary: "#3d7a3d"
  x_border: "#1a3a1a"
  x_hover: "rgba(99, 195, 99, 0.1)"
  x_hover_subtle: "rgba(99, 195, 99, 0.03)"
  x_accent: "#63c363"
  x_accent_hover: "#4fa34f"
  x_danger: "#ff6b6b"
  x_font: '"JetBrains Mono", ui-monospace, monospace'
  x_font_size: "12px"
  x_line_height: "16px"
  x_radius_pill: "0"
  x_radius_card: "0"

# Dark flat SGI-IRIX/8-bit chrome — used by pub4_stack social apps (_x_base.scss), not MASTER face.
# Flat: no bevels, no box-shadow. Subtle radii for cards and controls. Cool
# graphite/indigo palette in place of x.com's black/blue.
social:
  x_bg: "#17161c"
  x_surface: "#17161c"
  x_surface_elevated: "#211f28"
  x_search_bg: "#232030"
  x_text: "#d8d6e0"
  x_text_secondary: "#8a879c"
  x_border: "#46435a"
  x_hover: "rgba(216, 214, 224, 0.1)"
  x_hover_subtle: "rgba(216, 214, 224, 0.03)"
  x_accent: "#7c6fd6"
  x_accent_hover: "#9686e8"
  x_danger: "#d1594a"
  x_font: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'
  x_font_size: "16px"
  x_line_height: "20px"
  x_radius_xs: "4px"
  x_radius_sm: "8px"
  x_radius_md: "12px"
  x_radius_pill: "9999px"
  x_radius_card: "16px"
  x_radius_lg: "16px"
  x_sidebar: "275px"
  x_feed_max: "600px"
  x_widgets: "350px"
  x_layout_max: "1265px"

light:
  x_bg: "#ffffff"
  x_surface: "#ffffff"
  x_surface_elevated: "#f7f9f9"
  x_search_bg: "#eff3f4"
  x_text: "#0f1419"
  x_text_secondary: "#536471"
  x_border: "#eff3f4"
  x_hover: "rgba(15, 20, 25, 0.1)"
  x_hover_subtle: "rgba(15, 20, 25, 0.03)"
  x_accent: "#1d9bf0"
  x_accent_hover: "#1a8cd8"
  x_danger: "#f4212e"
