  takeaway: { accent: "#e07b39", hover: "#c26a30" }
  playlist: { accent: "#12b6c4", hover: "#0f9aa6" }
  maps: { accent: "#5b8fd4", hover: "#4a7ab8" }         # cool cartography blue-gray
