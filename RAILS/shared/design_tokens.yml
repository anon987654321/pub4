# Canonical design token anchors — keep in sync with _dialect_tokens.scss defaults and face.css :root.
# Regenerate face :root: ruby RAILS/tools/generate_face_root_css.rb
#
# Dialect → consumer map (do not merge casually):
#   social       → brgen + shared shell (IRIX flat dark/light)
#   light        → light-mode overlay for social apps (theme toggle)
#   luxury       → amber wardrobe (Aesop/Toteme warm neutrals)
#   openbsd_wscons → bsdports terminal green (opt-in via body class)
#   face_root    → MASTER web face.css :root only (CRT-flat, all radii 0)
# Intent: social = soft radii; face/bsdports = CRT-flat zeros; luxury = calm product.
# Light social = indigo on cool paper (not Twitter #1d9bf0). Vertical accents: vertical_accents: below.

# Shared motion + elevation (borders, never box-shadow) — export via CSS vars in apps.
# Layout chrome is the family contract across MASTER face + RAILS apps (dialects may
# restyle surfaces; they must not invent a second z-scale, tap floor, or skip-link).
shared_chrome:
  space_2xs: "0.25rem"
  space_xs: "0.5rem"
  space_sm: "0.75rem"
  space_md: "1.5rem"
  space_lg: "2rem"
  space_xl: "3rem"
  space_2xl: "4rem"
  color_success: "#00ba7c"
  color_warning: "#c9a227"
  color_info: "#5b9fd4"
  color_danger: "#d1594a"
  focus_ring: "2px solid var(--accent, var(--accent, currentColor))"
  elev_1: "1px solid var(--border)"
  elev_2: "1px solid var(--border)"
  transition_fast: "180ms"
  transition_normal: "300ms"
  ease_out: "cubic-bezier(0.25,0.1,0.25,1)"
  ease_spring: "cubic-bezier(0.32,0.72,0,1)"
  font_size_meta: "0.8125rem"
  font_size_body: "1rem"
  font_size_title: "1.25rem"
  font_size_display: "1.75rem"
  measure_body: "66ch"
  # Family layout chrome (12px = face inset-t/r/b/l base; 44px = WCAG + face-bar)
  chrome_inset: "0.75rem"
  tap_min: "44px"
  bar_height: "44px"
  page_gutter: "clamp(16px, 5vw, 48px)"
  feed_max: "600px"

# Luxury minimalist additions for wardrobe/product UIs (Aesop/Toteme/Nécessaire inspired)
# Warm neutrals, generous spacing, refined typography. Use in amber + shared product views.
luxury:
  # Light mode (preferred for calm product viewing)
  light_bg: "#f8f5f0"
  light_surface: "#ffffff"
  light_text: "#2c2824"
  light_muted: "#6b665f"
  light_border: "#e6e0d8"
  light_accent: "#8c7a5e"   # warm taupe/gold
  # Dark mode (compatible with existing)
  dark_bg: "#1a1816"
  dark_surface: "#24221f"
  dark_text: "#e8e4dc"
  dark_muted: "#8a8278"
  dark_border: "#3a3630"
  dark_accent: "#a38b6f"
  # Shared luxury scale (more breathing room than minimal); includes 2xs for dense chrome
  space_2xs: "0.25rem"
  space_xs: "0.5rem"
  space_sm: "0.75rem"
  space_md: "1.5rem"
  space_lg: "2rem"
  space_xl: "3rem"
  space_2xl: "4rem"
  color_success: "#00ba7c"
  color_warning: "#c9a227"
  color_info: "#5b9fd4"
  radius_sm: "6px"
  radius_md: "10px"
  radius_lg: "14px"
  # Typography scale
  font_size_display: "2rem"
  font_size_title: "1.5rem"
  font_size_body: "1rem"
  font_size_meta: "0.875rem"
  letter_spacing_tight: "-0.01em"
  line_height_tight: "1.25"
  line_height_relaxed: "1.6"

face_root:
  anchors:
    c_text: "oklch(86% 0.02 300)"
    x_text: "#d8d6e0"
    c_accent: "oklch(78% 0.10 300)"
    c_danger: "oklch(60% 0.14 35)"
    c_code: "oklch(74% 0.11 275)"
  font_mono: '"JetBrainsMono Nerd Font", "JetBrains Mono", "Cascadia Code", "Fira Code", ui-monospace, monospace'
  font_label: '"JetBrainsMono Nerd Font","JetBrains Mono","Cascadia Code",ui-monospace,"SFMono-Regular",Menlo,monospace'
  face_bg: "black"
  derived:
    face_fg: "var(--c-text)"
    face_muted: "color-mix(in srgb, var(--c-text) 35%, transparent)"
    face_dim: "color-mix(in srgb, var(--c-text) 18%, transparent)"
    face_soft: "color-mix(in srgb, var(--c-text) 8%, transparent)"
    mood_accent: "var(--c-accent)"
    canvas_mood_accent: "var(--c-accent)"
    border_faint: "color-mix(in srgb, var(--face-fg) 10%, transparent)"
    border_soft: "color-mix(in srgb, var(--face-fg) 14%, transparent)"
    border_strong: "color-mix(in srgb, var(--face-fg) 24%, transparent)"
    hover_tint: "color-mix(in srgb, var(--face-fg) 8%, transparent)"
  layout:
    radius-xs: "0"
    radius-sm: "0"
    radius-md: "0"
    radius-lg: "0"
    radius-pill: "0"
    # Aliases of shared_chrome so face HUD and RAILS tab/chrome share one floor.
    # chrome-inset is emitted once in generate_face_root_css (before --inset-*).
    tap-min: "44px"
    face-bar-height: "44px"
    bar-height: "44px"
    hud-tier-status: "calc(var(--face-bar-height) + var(--safe-bottom) + 8px)"
    hud-tier-caption: "calc(var(--face-bar-height) + var(--safe-bottom) + 44px)"
    # Additive-blending budget: ~17k points; raising size/glow/decay together
    # (the 2026-07-09 "pristine detail tier": 0.024/1.38/0.88) overflows the
    # framebuffer into a solid white oval. These are the last-known-good values.
    face-particle-size: "0.019"
    face-glow-scale: "1.22"
    face-phosphor-decay: "0.80"
    transition-fast: "180ms"
    transition-normal: "300ms"
    ease-out: "cubic-bezier(0.25,0.1,0.25,1)"
    ease-linear: "cubic-bezier(0,0,1,1)"
    ease-in-out: "cubic-bezier(0.4,0,0.6,1)"
    ease-spring: "cubic-bezier(0.32,0.72,0,1)"
    z-canvas: "1"
    z-chrome: "10"
    z-ui: "90"
    z-overlay: "100"
    z-modal: "1000"
    z-toast: "1100"
    z-skip: "2000"

# BRGEN_OLD dark — dark-inverted port of the real 2014 desktop.css/mobile.css
# from pub/__OLD_BACKUPS/BRGEN_OLD. True neutral grayscale, no accent hue,
# Arial. chrome_bg is the utility-bar tone (darker than bg), mirroring
# the original's dark #333 bar against a white page.
brgen_old_dark:
  bg: "#000000"
  surface: "#1a1a1a"
  surface_elevated: "#1a1a1a"
  search_bg: "#222222"
  text: "#e0e0e0"
  text_secondary: "#969696"
  border: "#333333"
  accent: "#f2f2f2"
  accent_hover: "#d0d0d0"
  danger: "#e46151"
  font: "Arial, Helvetica, sans-serif"
  chrome_bg: "#0d0d0d"
  radius_xs: "4px"
  radius_sm: "8px"
  radius_md: "12px"
  radius_pill: "9999px"
  radius_card: "8px"
  radius_lg: "8px"

brgen_old_light:
  bg: "#ffffff"
  surface: "#ffffff"
  surface_elevated: "#f2f2f2"
  search_bg: "#f0f0f0"
  text: "#222222"
  text_secondary: "#666666"
  border: "#d9d9d9"
  accent: "#1a1a1a"
  accent_hover: "#000000"
  danger: "#b24c3f"
  font: "Arial, Helvetica, sans-serif"
  chrome_bg: "#333333"
  radius_xs: "4px"
  radius_sm: "8px"
  radius_md: "12px"
  radius_pill: "9999px"
  radius_card: "8px"
  radius_lg: "8px"

openbsd_wscons:
  bg: "#000000"
  surface: "#000000"
  surface_elevated: "#0a140a"
  search_bg: "#0f1a0f"
  text: "#63c363"
  text_secondary: "#3d7a3d"
  border: "#1a3a1a"
  hover: "rgba(99, 195, 99, 0.1)"
  hover_subtle: "rgba(99, 195, 99, 0.03)"
  accent: "#63c363"
  accent_hover: "#4fa34f"
  danger: "#ff6b6b"
  font: '"JetBrains Mono", ui-monospace, monospace'
  font_size: "12px"
  line_height: "16px"
  radius_pill: "0"
  radius_card: "0"

# Dark flat SGI-IRIX/8-bit chrome — used by the shared stack social apps (_dialect_tokens.scss), not MASTER face.
# Flat: no bevels, no box-shadow. Subtle radii for cards and controls. Cool
# graphite/indigo palette in place of x.com's black/blue.
social:
  bg: "#17161c"
  surface: "#17161c"
  surface_elevated: "#211f28"
  search_bg: "#232030"
  text: "#d8d6e0"
  text_secondary: "#8a879c"
  border: "#46435a"
  hover: "rgba(216, 214, 224, 0.1)"
  hover_subtle: "rgba(216, 214, 224, 0.03)"
  accent: "#7c6fd6"
  accent_hover: "#9686e8"
  danger: "#e46151"
  font: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'
  font_size: "16px"
  line_height: "20px"
  radius_xs: "4px"
  radius_sm: "8px"
  radius_md: "12px"
  radius_pill: "9999px"
  radius_card: "16px"
  radius_lg: "16px"
  # social = soft (not CRT-flat zeros — those are face_root / openbsd_wscons)
  space_2xs: "0.25rem"
  space_xs: "0.5rem"
  space_sm: "0.75rem"
  space_md: "1rem"
  space_lg: "1.5rem"
  space_xl: "2rem"
  color_success: "#00ba7c"
  color_warning: "#c9a227"
  color_info: "#5b9fd4"
  transition_fast: "180ms"
  transition_normal: "300ms"
  ease_out: "cubic-bezier(0.25,0.1,0.25,1)"
  ease_spring: "cubic-bezier(0.32,0.72,0,1)"
  sidebar: "275px"
  feed_max: "600px"
  widgets: "350px"
  layout_max: "1265px"

light:
  # Indigo/graphite light — not Twitter blue. Keeps brand across dark/light.
  bg: "#f7f6fa"
  surface: "#ffffff"
  surface_elevated: "#eeedf3"
  search_bg: "#e8e6ef"
  text: "#1a1824"
  text_secondary: "#5c586e"
  border: "#d4d1de"
  hover: "rgba(26, 24, 36, 0.1)"
  hover_subtle: "rgba(26, 24, 36, 0.03)"
  accent: "#5b4fc4"
  accent_hover: "#4a3fb0"
  danger: "#a9483c"

