  api:
    brand: "MASTER lov-API"
    title: "MASTER lov-API: kodegjennomgang etter regler, over HTTPS"
    heading: "MASTER lov-API"
    lede: >-
      Send kildefiler og få tilbake hver MASTER-lov de bryter, med linje og begrunnelse. Faste regler, ingen modell:
      samme svar hver gang, på sekunder.
