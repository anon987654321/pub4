    usage_lede: "Send opptil 20 filer som JSON med nøkkelen din som bearer-token."
    response_lede: "Hvert funn oppgir fil, linje, lov og alvorlighet, og svaret viser månedens forbruk."
    limits_heading: "Grenser"
    limit_files: "Opptil %{files} filer per forespørsel, %{kilobytes} kB hver. Én fil er én sjekk."
    limit_quota: >-
      Kvoten nullstilles den første hver måned (UTC). En forespørsel som ikke får plass, avvises i sin helhet og
      koster ingenting.
    limit_errors: >-
      401 ugyldig nøkkel, 402 abonnementet er ikke aktivt, 422 ugyldig forespørsel, 429 kvote eller
      hastighetsgrense.
    limit_account: >-
      GET /api/v1/key viser forbruk; POST /api/v1/key/rotate bytter nøkkel; POST /api/v1/key/portal åpner betaling.
