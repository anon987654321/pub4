add_newline = false
palette = "master_phosphor"
format = "$directory$git_branch$git_status$character"

[palettes.master_phosphor]
black = "#000000"
red = "#ff3344"
green = "#10a37f"
yellow = "#c9a227"
blue = "#5b8def"
magenta = "#8b5cf6"
cyan = "#4285f4"
white = "#e7e9ea"

[character]
success_symbol = "master[\\$](bold red)"
error_symbol = "master[\\$](bold red)"
format = "$symbol "

[directory]
style = "bold red"
format = "[$path]($style)"
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = "[$branch](red) "
symbol = ""

[git_status]
format = "[$all_status](dim red) "

[cmd_duration]
format = "[$duration](dim) "
min_time = 500

[time]
disabled = true

[os]
disabled = true

[ruby]
disabled = true