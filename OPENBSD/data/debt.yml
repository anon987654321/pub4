# Actionable deploy debt — open items agents should work unless blocked.
# Operator deploy debt. Narrative ops notes: OPENBSD/RUNBOOK.md, OPENBSD/DECISIONS.md.
# Feature inventory: RAILS/apps.yml. Deferred features: apps.horizon.yml (agent: ignore).
#
# tag:
#   operator-priority — a human must act (money, hardware, a force-push, root).
#                       Fix before declaring a deploy healthy.
#   agent-workable    — ordinary code work, no human decision needed. This is the
#                       default the header describes; it was implicit until
#                       2026-08-03, when items of this kind were first filed here
#                       and neither existing tag was true of them.
#   agent-ignore      — do not chase during narrow patches (scan noise, horizon).
#
# An entry that documents its own fix inside `summary` is still open as far as
# open_debt_count (MASTER/lib/deploy/operator_docs.rb) is concerned — move it to
# closed: or the count overstates. Three were sitting that way on 2026-08-03.

open:
  - id: off_host_dr
    tag: operator-priority
    summary: Litestream replicas are same-disk only; off-host replica still needed
  - id: multi_app_ram
    tag: operator-priority
    summary: >
      vm23 ~1GB cannot reliably keep master + brgen + amber resident;
      UVM out-of-swap kills ruby34 when all three boot. Raise RAM (≥2GB)
      or run amber on-demand. After restarts: master → brgen → amber → relayd.
      Smoke: sh OPENBSD/bin/deploy-smoke.sh (ALLOW_AMBER_DOWN=1 if amber policy is optional).
      2026-08-05: it also shows up as a STARTUP RACE, not only as an OOM kill,
      and that form looks like a broken app. amber needs ~20s to signal ready;
      Falcon SIGKILLs the worker if that misses its health-check window, so
      while another app's CI has the box at load 5+ amber restarts, gets killed,
      and rcctl reports amber(failed) with port 61352 closed. It is not broken —
      `bin/rails runner` boots it fine (BOOT_OK) and on a quiet box it logs
      "Finished startup" then ready:true within ~20s and stays. The fix is to
      wait for the deploy to finish and restart, not to debug amber. bsdports is
      a fourth app the entry above never contemplated; four do not fit at all.
      Do NOT reproduce this by hand without --health-check-timeout 300: the rc.d
      passes it, a bare `falcon serve` defaults to 30s, and the worker then dies
      at exactly +30s, which reads as confirmation of a timeout theory that is
      wrong.

  # --- Security review 2026-07-27. VERIFIED BY INSPECTION, not yet fixed.
  - id: internet_app_runs_as_passwordless_root_user
    tag: operator-priority
    summary: >
      etc/doas.conf:1 is `permit nopass keepenv dev as root` — blanket,
      passwordless, keepenv, no cmd restriction — while etc/rc.d/master:12 sets
      daemon_user="dev". MASTER is the internet-facing app on ai.brgen.no, so
      ANY code execution as dev is root with no password. brgen/amber/bsdports
      correctly run as their own users; only master does not.
      NOTE scoping doas via cmd rules (as etc/doas.conf.example documents) does
      NOT work here: the deploy pipeline invokes `doas zsh` 27x, `doas sh` 8x,
      `doas ksh` 6x, `doas su` 2x — a root shell is equivalent to blanket root.
      The real fix is a dedicated master user + chown, not doas scoping.
      The chat entry point into exec was closed 2026-07-27 (see git log,
      "stop visitor chat reaching the Fold"), but the escalation primitive
      remains for any other code-exec-as-dev path.
      REDUCED, NOT CLOSED, re-measured 2026-08-03. The `keepenv` half is gone (see
      the closed entry doas_keepenv_is_a_root_rce): dev's rule is now a five-variable
      setenv allowlist, so the environment-injection route to root no longer exists.
      What this entry is actually about is unchanged — etc/rc.d/master:22 still sets
      daemon_user="dev" and the dev rule is still nopass with no command scoping, so
      any code execution as dev on the internet-facing app is still root without a
      password. The fix named above stands: a dedicated master user + chown, not doas
      scoping.
  - id: secrets_in_process_argv_and_world_readable_home
    tag: operator-priority
    summary: >
      etc/rc.d/{master,brgen,amber,bsdports} pass SECRET_KEY_BASE,
      MASTER_BRIDGE_TOKEN and the LLM API keys inside daemon_flags, so they
      become ksh argv readable by any local account via `ps auxww`. A foothold
      in one app user yields every other app's SECRET_KEY_BASE — cross-app
      signed-cookie forgery. Compounded by vps_ci.sh:88 / RAILS/_runtime_gate.sh:71
      running `chmod o+x /home/dev` while OPERATOR.sh installs /home/dev/.zshrc
      at mode 644 with real keys in it. Move secrets to the sourced /etc/*.env.
      The CI-lock half is FIXED 2026-08-01. The lock lives in root-owned 0755
      /var/db/pub4 via the one definition in OPENBSD/lib/ci_lock.sh, which all three
      former copies (vps_ci.sh, vps_master_scan.sh, vps_weekly_integrity.sh) now
      source; the mode dropped from 666 to 644, and a PUB4_CI_LOCK override pointing
      outside that directory is refused with a message rather than obeyed. An
      unprivileged account cannot create anything in a root-owned directory, so there
      is no symlink for root to follow — the fix is the directory, not the flags. The
      lock file itself is never unlinked on the way through, because a second holder
      opening a fresh inode is the one thing a mutex exists to prevent.
      The secrets half is CLOSED for the three Rails apps 2026-08-02, and the
      argv claim was corrected by measurement. What ps actually showed on vm23:
      `ps auxww` (argv) had ZERO SECRET_KEY_BASE hits — the daemon does `exec
      falcon`, so the ksh whose -c string held the secret is replaced, and rc_bg
      backgrounds the su/sh wrappers so they are gone from the steady state too.
      The secret lived in falcon's ENVIRON (`doas ps auxwwe`, root-only, and
      unavoidable — Rails must read ENV["SECRET_KEY_BASE"]). The genuine cross-
      account exposure was the ENV FILE at rest: /etc/amber.env and
      /etc/bsdports.env were root:WHEEL 640, and dev is in wheel, so dev — or any
      wheel member — could read another app's SECRET_KEY_BASE off disk. brgen.env
      was already root:brgen.
      Fix: brgen/amber/bsdports rc.d now `. /etc/<app>.env && export ...
      SECRET_KEY_BASE ...` inside the exec (as the app user; the env files hold a
      bare KEY=value so the value must be re-exported, found the hard way when the
      bsdports canary crash-looped on a blank secret), and the env files are
      chowned root:<app> 640 (OPERATOR.sh now creates them that way). Verified
      live: dev can no longer read brgen/amber/bsdports .env, argv exposure is 0,
      all apps public-200. Rolled out one app at a time, canaried on bsdports.
      master is deliberately NOT changed: it runs as dev, so its keys are already
      in a dev-owned falcon environ (no cross-account gain), and master.env is
      600 root:wheel — sourcing would require loosening it to dev-readable 640,
      a downgrade for nothing. The boot-window argv flash (su/sh wrappers hold the
      command string for ~1s at startup) is closed for the apps by not putting the
      secret in daemon_flags at all; for master it is accepted.
      STILL OPEN (separate, untouched): vps_ci.sh / RAILS/_runtime_gate.sh run
      `chmod o+x /home/dev`, and OPERATOR.sh installs /home/dev/.zshrc 644 with real
      keys in it — a world-traversable home over a key-bearing dotfile.
      RE-MEASURED 2026-08-03, and this half is smaller than written. /home/dev is
      still drwx-----x (vps_ci.sh:88 and RAILS/_runtime_gate.sh:71 both still run the
      chmod) and .zshrc is still 644, so the traversal is real — but the dotfile no
      longer carries secrets: `grep -c "KEY\|TOKEN\|SECRET" /home/dev/.zshrc` is 0.
      What remains is a world-traversable home over a world-readable dotfile with
      nothing sensitive in it. Worth removing the two chmods on principle; it is no
      longer a key-disclosure path. The argv half stays closed — `ps auxww` from the
      dev account returns zero SECRET_KEY_BASE/MASTER_BRIDGE_TOKEN/*_API_KEY hits.
  - id: committed_rails_master_key_public_repo
    tag: operator-priority
    summary: >
      MASTER/web/config/master.key and credentials.yml.enc are tracked AND
      present on origin/main of github.com/anon987654321/pub4, which is PUBLIC
      (verified: unauthenticated API returns 200). Listed in two .gitignore
      files, but ignoring never untracks. Blast radius is limited — the file
      contains only secret_key_base, and production does not use it (MASTER runs
      SECRET_KEY_BASE_DUMMY=1; the Rails apps read SECRET_KEY_BASE from
      /etc/*.env) — but it must be untracked, rotated, and purged from history.
      UNTRACKED 2026-08-02 in 139c907e6, operator-authorised. The key stays on disk
      and `git check-ignore --no-index` confirms MASTER/.gitignore:1 now actually
      applies, so `git add -A` cannot pull it back. Committed as its own scoped commit
      after verifying the shared index held nothing else staged — this repository
      shares one git index across concurrent agent worktrees, so a staged-but-
      uncommitted deletion would have been the worse end state.
      Three credentials.yml.enc remain tracked (MASTER/web, RAILS/amber,
      RAILS/bsdports) and are left alone: ciphertext without a key, and amber and
      bsdports never had one, which is the same pattern with only the decorative half
      remaining.
      STILL OPEN, and neither belongs to an agent: rotate secret_key_base, then purge
      the blob from history — a force-push to a public repository.
      RE-MEASURED 2026-08-03, and untracking bought less than this entry implies.
      `git rm` removed the file from the tip only. The blob entered at 039c26a07
      (2026-03-13), that commit is still an ancestor of origin/main, and
      `git cat-file -p 039c26a07:MASTER/web/config/master.key` returns the key today.
      The repo is still public (unauthenticated API 200). So the key has been world-
      readable for the ~5 months between those two dates and remains fetchable by
      anyone who clones — untracking changed what `git add -A` can do, not what an
      attacker can read.
      Ordering matters and is the opposite of the sentence above: ROTATE FIRST. A
      history purge is a force-push to a public repository, cannot be relied on
      (forks, clones, GitHub's own unreachable-object retention, any archiver), and
      does nothing about the five months already elapsed. Rotation is what actually
      ends the exposure; the purge is hygiene afterwards and is optional. Treat the
      current secret_key_base as burned regardless of what happens to the history.
      Blast radius is still limited for the reason the original entry gives —
      production reads SECRET_KEY_BASE from /etc/*.env and MASTER runs
      SECRET_KEY_BASE_DUMMY=1 — so this is not an emergency, but it is not closed by
      the untracking either.
  - id: brgen_allow_unauthenticated_access_is_a_noop
    tag: operator-priority
    summary: >
      shared/.../authentication.rb:18-22 returns early when User has a `guest`
      column, so in brgen allow_unauthenticated_access does nothing and
      resume_session mints a real User row for every anonymous visitor. Every
      "requires a session" control in brgen is therefore reachable by anyone.
      STILL OPEN, and now documented as deliberate in the concern itself: guests
      get a soft Current.user on purpose (use the product without signup) and
      require_real_user is the identity gate. What is unresolved is that
      allow_unauthenticated_access reads like a control and is a no-op, so an
      author who writes it gets nothing and no warning.
      The DoS half is CLOSED. Guest password digests are created at
      BCrypt::Engine::MIN_COST (5ms) instead of the production cost 12 (measured
      1,025ms on vm23's single core, hit by 38.9% of 275,334 logged brgen requests);
      a guest password can never be used to sign in, so cost 4 is exactly as
      unusable as cost 12.
      The unbounded-growth half is CLOSED 2026-08-01: Shared::PruneGuestUsersJob is
      scheduled daily at 3:45am in brgen and amber (both have the guest column;
      bsdports does not), and migration 20260801160000 adds the
      (guest, created_at) index its scan needs — without it the job was a full scan
      of the largest table, 99.3% of which was throwaway guest rows (102,778
      measured 2026-08-01). Covered by
      brgen/test/jobs/prune_guest_users_job_test.rb.

  # --- RAILS completeness + UI/UX review 2026-08-03. Everything below was found by
  # measuring the running apps and the served pages, not by reading the tree; none of
  # it was tracked anywhere. UI_REFINEMENTS.md's checklists cannot catch these,
  # because a landed row and a wrong-but-landed row look identical from the outside.
  - id: amber_bsdports_stop_and_stay_down
    tag: operator-priority
    summary: >
      Found amber and bsdports both dead on 2026-08-03; brgen was fine. Ports 61352
      and 47312 closed on vm23, `doas rcctl check amber` reported amber(failed), and
      nothing had restarted them. `doas rcctl restart` brought both back in ~2s with
      no config change and no deploy, so the trees at /home/<app>/{app,shared} and the
      pkg_scripts entries were all intact — they had simply stopped.
      Cause NOT established. resource_guard is ruled out, which is the assumption to
      resist: /var/db/resource_guard_shed was EMPTY and shedding fired on 17 of the
      last 300 ticks (5.7%), so the guard was not parking them (contrast the 48%
      measured 2026-07-29 in OPENBSD/CLAUDE.md). There is no production.log on the box
      to work from. multi_app_ram is the obvious suspect and the box is consistent
      with it — 1GB physmem, 85MB free with all three up, 1.4G of 2.5G swap in use,
      mem_avail hovering 9-16% against the guard's own 8/14 thresholds — but nothing
      measured ties the two together yet.
      Why this went unnoticed for an unknown length of time: it is invisible from
      outside. relayd still terminates TLS with a valid per-host cert, so the failure
      shape is `SSL certificate verify ok` followed by `Empty reply from server`, and
      curl reports http_code 000 rather than a 5xx. Nothing in the repo, the gates or
      DNS looks wrong. Worse, the gates read a down app as green: layout_geometry
      PASSED having skipped all 17 of its checks because the ports were closed, and
      user_flow / payment_honesty skip their live halves the same way. External
      alerting is filed separately and closed; whatever it watches, it did not catch
      this.
      Wanted: something that fails when a port that should be listening is not.
  - id: brgen_city_carousel_links_dead
    tag: operator-priority
    summary: >
      brgen/app/views/layouts/application.html.erb:107-116 renders 29 city domains as
      real anchors (`https://<domain>/`) on every page of every surface, and the live
      homepage ships all 29. They do not resolve: 6/6 sampled on 2026-08-03
      (longyearbyn.no, stvanger.no, trndheim.no, kbenhvn.dk, lndon.uk, newyrk.us) fail
      to connect. brgen is a one-city platform advertising a network of 29 that is not
      there — this is the single most user-visible honesty problem in the tree, and it
      is on 100% of pageviews.
      Operator-priority because the fix is a product/money call, not a code call:
      either buy and stand up the domains (registrar spend + relayd/acme work per
      city, already tracked as the city-domains task) or stop rendering links to
      hosts that do not answer. A cheap middle path is to gate the list on a
      periodically-refreshed reachability check and render only the live ones, which
      degrades to "just brgen.no" today and grows by itself as cities come up.
  - id: brgen_layout_query_cost_and_page_weight
    tag: agent-workable
    summary: >
      Two costs paid on every brgen pageview, on a box measured at 85MB free.
      N+1 in the global layout: application.html.erb:96 does a Ruby-level
      `.sum { |c| c.unread_count_for(Current.user) }` over every non-channel
      conversation, and Conversation#unread_count_for (models/conversation.rb:128) is
      itself a find_by plus a count — so 2 queries per DM thread, added to every
      authenticated render of every page, purely to decide a badge number. Wants to be
      one grouped query, or a counter the message write maintains.
      Page weight: the served homepage is 232KB, of which 43KB is duplicated inline
      SVG — 147 instances of 22 unique shapes, because the 5 feed-action icons are
      re-emitted per post across 25 posts. ~19% of the document, gzip notwithstanding,
      on a mobile-first social product. A <symbol> sprite emitted once plus <use>
      removes it without touching the icon helper's call sites.
  - id: rails_flash_strings_untranslated
    tag: agent-workable
    summary: >
      144 hardcoded English flash strings across the three apps — amber 48 (items 13,
      outfits 10, declutter 7), brgen host 44 (posts 7, email_subscriptions 5, live 5),
      brgen engines 51 (playlist collaborations 5, marketplace checkouts 4) — counted
      as `(notice|alert): "..."` in app/controllers. bsdports has 1.
      brgen renders nb by default (live homepage: title "Bergen — Brgen", h1 "Hjem"),
      so every successful create/update/destroy shows an English toast in an otherwise
      Norwegian UI. UI_REFINEMENTS.md records chrome i18n as landed and it is — the
      gap is that chrome_i18n_lint checks chrome and never looks at controller
      flashes, so this whole class was never in scope. Extend the lint first, then the
      strings, or it comes straight back.
  - id: rails_no_breakpoint_token
    tag: agent-workable
    summary: >
      design_tokens.yml carries color, space, motion, elevation and per-dialect maps
      but no viewport scale, so responsive breakpoints are written by hand and have
      drifted apart. brgen alone mixes 768px, 767px, 48rem (=768px), 700px, 480px,
      1264px and 1265px; amber uses 768/640/1280px and 36rem; shared uses 480px,
      40rem, 768px, 1280px. The 767/768 and 1264/1265 pairs are the tell — those are
      off-by-one attempts at the same edge, which is exactly the bug a token exists to
      prevent. Everything else in this design system is single-sourced; this is the
      one axis that is not.
  - id: playlist_engine_untested
    tag: agent-workable
    summary: >
      engines/playlist has 26 Ruby files and 26 views and zero tests — the only one of
      the five verticals with none (dating 1, takeaway 1, tv 1, marketplace 3). It is
      the second-largest engine. This was masked twice over: the engine suites did not
      run at all until 2026-08-03 (see rails_coverage_contract_is_tautological), and
      the coverage ratchet in RAILS/test/coverage_ratchet_test.rb counts only the host
      tree, so an engine at zero does not move it. Whatever lands here should also
      teach the ratchet to see engines, or the next extraction repeats it.

  - id: operator_docs_module_is_unreferenced
    tag: agent-workable
    summary: >
      MASTER/lib/deploy/operator_docs.rb is read by nothing. Grepping MASTER and
      OPENBSD for OperatorDocs returns only the constitutional scanner's own
      activity log, i.e. the file has been scanned, never called. Found 2026-08-03
      while checking that the debt.yml edits parsed.
      Its ROOT was also wrong — File.expand_path("../../../..", __dir__) from
      MASTER/lib/deploy resolves to the directory containing the checkout, so both
      OPERATOR_PATH and DEBT_PATH pointed at files that do not exist. Every method
      then degraded to its empty default without raising: open_debt_count answered 0
      against a 14-item register, and render_deploy printed its four headings over
      four blank values. Fixed to ../../.. and verified (open_debt_count 14,
      render_deploy renders real recipes), but a correct module with no callers is
      still dead wiring.
      The decision this entry exists to force: wire it or delete it. /orient deploy
      is the plausible consumer — MASTER/lib/pub4/status_report.rb already answers
      the backlog question independently, with its own correct path, which is why
      nothing ever noticed this one was broken. Two readers of the same file, one
      live and one dead, is the duplication to collapse.

  # --- RAILS audit 2026-07-26. The crash-level items from this pass are fixed
  # (see git log and the closed: entries below); what remains open here is
  # structural — gates, coverage, and non-raising dead wiring.
  - id: rails_gates_not_wired
    tag: operator-priority
    summary: >
      PARTIALLY RESOLVED 2026-07-27 — shared_wiring, stimulus_components_adoption,
      css_constitution and payment_honesty are now in check-rails source_gates and
      all four pass. Wiring them surfaced three stale contract assertions in the
      already-wired `rails contracts` step (amber matting jobs, brgen ranking
      control location, amber archive copy), which is presumably why check-rails
      was not being run; those are fixed and the runner is now green. STILL OPEN
      below.
      SECOND PASS 2026-08-01 — the wiring half and all four named defects are
      closed. What remains open is at the bottom.
      Wiring: page_simulation, flow_journey, gate_mutation and deploy_drift are now
      in check-rails source_gates. The reason they had been left out did not survive
      measurement — all four together run in 1.4s off the deploy host, because each
      degrades to its source half when no app is listening, and deploy_drift reports
      INCONCLUSIVE rather than green. release, rendered_suite, visual_contract and
      constitutional_scan run in a new deep tier (--profile=full or
      CHECK_RAILS_DEEP=1) with its own 2400s timeout, since constitutional_scan
      alone is four full MASTER scans (measured 1779s).
      visual_contract_gate: grading extracted into VisualContractGate.grade and
      graded three ways — a contract route answering 5xx is a hard failure, a11y
      violations and severe console errors block under VISUAL_STRICT=1 (their live
      counts have never been measured from this tree), pixel drift is reported and
      blocks only against an explicit VISUAL_DRIFT_MAX_RATIO because the baseline is
      the previous capture. Tested without Chrome.
      release_gate: a missing Bundler no longer exits 0 on the whole gate. Two
      thirds of it needs no Bundler — eight plain-ruby contract tests and four
      in-process gate classes still run; only the per-app dartsass and importmap
      steps are recorded as unchecked, and GATE_STRICT_INCONCLUSIVE=1 makes that
      blocking.
      constitutional_scan_gate: parses the violation count out of each scan and
      compares it against a per-target ceiling in
      RAILS/gates/data/constitutional_budget.yml (brgen 410, amber 214, bsdports 99,
      shared 210, measured 2026-08-01), ratcheting down only, same contract as
      MASTER's rake lint:spine. Chasing zero is still not the goal; adding findings
      now fails. Verified end to end — all four at ceiling.
      generated_asset_gate: the service-worker check compared app_dir/public/,
      which no app has, so both File.file? guards were false and the check was
      unreachable. It compares app/views/pwa/service-worker.js, where
      tools/build_workbox.mjs actually writes.
      Also fixed while in there: the three subprocess gates (release,
      visual_contract, rails_runtime) are started with system() and do not inherit
      runner.rb's Encoding.default_external, so under the C locale that
      integrity_gate.rb deliberately uses they crashed with "invalid byte sequence
      in US-ASCII" — reproduced in release.rb. All three now require
      OPENBSD/lib/utf8 themselves.
      STILL OPEN: the design-craft stack warns and returns when the app port is
      closed, which off the deploy host is always. payment_honesty_gate still only
      greps routes.rb for /checkout|webhooks/. Nothing calls gates/runner.rb --all.
      THIRD PASS 2026-08-03. The payment_honesty half is closed, and it was worse
      than "only greps": the grep ran against the HOST routes.rb, which still matches
      /webhooks/ on webhooks/tradedoubler, so an unrelated affiliate route had been
      standing in for the PSP callbacks ever since marketplace moved to an engine. It
      now asserts both `checkout` and `webhooks` against the engine's own routes.rb
      via a two-lookahead pattern.
      Same pass, same cause: payment_honesty, layout_search and user_flow were all
      still keyed on brgen/app/.../marketplace/... paths that the engine split had
      moved, so all three failed on "missing" files — indistinguishable from the
      files being deleted, and layout_search never reached its 32-candidate design
