# Actionable deploy debt — open items agents should work unless blocked.
# Operator deploy debt. Narrative ops notes: OPENBSD/RUNBOOK.md, OPENBSD/DECISIONS.md.
# Feature inventory: RAILS/apps.yml. Deferred features: apps.horizon.yml (agent: ignore).

open:
  - id: off_host_dr
    tag: operator-priority
    summary: Litestream replicas are same-disk only; off-host replica still needed
  - id: multi_app_ram
    tag: operator-priority
    summary: >
      vm23 ~1GB cannot reliably keep master + brgen + amber resident;
      UVM out-of-swap kills ruby34 when all three boot. Raise RAM (≥2GB)
      or run amber on-demand. After restarts: master → brgen → amber → relayd.
      Smoke: sh OPENBSD/bin/deploy-smoke.sh (ALLOW_AMBER_DOWN=1 if amber policy is optional).

  # --- Security review 2026-07-27. VERIFIED BY INSPECTION, not yet fixed.
  - id: internet_app_runs_as_passwordless_root_user
    tag: operator-priority
    summary: >
      etc/doas.conf:1 is `permit nopass keepenv dev as root` — blanket,
      passwordless, keepenv, no cmd restriction — while etc/rc.d/master:12 sets
      daemon_user="dev". MASTER is the internet-facing app on ai.brgen.no, so
      ANY code execution as dev is root with no password. brgen/amber/bsdports
      correctly run as their own users; only master does not.
      NOTE scoping doas via cmd rules (as etc/doas.conf.example documents) does
      NOT work here: the deploy pipeline invokes `doas zsh` 27x, `doas sh` 8x,
      `doas ksh` 6x, `doas su` 2x — a root shell is equivalent to blanket root.
      The real fix is a dedicated master user + chown, not doas scoping.
      The chat entry point into exec was closed 2026-07-27 (see git log,
      "stop visitor chat reaching the Fold"), but the escalation primitive
      remains for any other code-exec-as-dev path.
  - id: bplan_is_deployed_but_has_no_source_here
    tag: operator-priority
    summary: >
      bplan is a live public service — etc/relayd.conf routes
      bplan.pub.healthcare to it, etc/rc.d/bplan starts it, etc/bplan.env.sample
      and a doas rule exist — but there is no RAILS/bplan in this repository and
      no entry in RAILS/apps.yml, which START_HERE.md names as the feature
      source of truth.
      Consequence: every review in the 2026-07-26/27 pass structurally could not
      see it. None of the security, scalability or gate findings apply to it,
      and none of the fixes reached it. It also runs the same rc.d shape as the
      other apps, so it very likely carries the same secrets-in-daemon_flags
      exposure (rails-app.tmpl:3) with nobody able to confirm.
      On a .healthcare domain this is the highest-uncertainty surface in the
      estate. Either bring the source in-tree and add it to apps.yml, or record
      where it actually lives and who reviews it.
  - id: doas_keepenv_is_a_root_rce
    tag: operator-priority
    summary: >
      etc/doas.conf:1 uses `keepenv`, which preserves the caller's environment
      across the privilege boundary. For a Ruby stack that includes RUBYOPT,
      RUBYLIB, GEM_HOME and BUNDLE_*, so `RUBYOPT=-r/tmp/x.rb doas <anything>`
      is arbitrary code execution as root by construction — no shell required.
      MASTER/bin/tts-worker:18-22 already scrubs exactly that variable set
      before boot because it does not trust it; keepenv hands the same set to
      root.
      This is INDEPENDENT of command scoping: dropping keepenv does not
      restrict which commands run, so it does not hit the `doas zsh` problem
      that makes cmd rules unworkable. It is the cheapest real reduction
      available.
      Do NOT simply delete keepenv: OPERATOR.sh:875 reads
      ${I_UNDERSTAND_DNS_WIPE:-0} from the environment and the documented call
      is `I_UNDERSTAND_DNS_WIPE=1 doas zsh OPERATOR.sh --stage-1`, so that gate
      needs env to cross. Use an allowlist instead:
        permit nopass setenv { I_UNDERSTAND_DNS_WIPE I_UNDERSTAND_CONSOLE_RISK } dev as root
      SEQUENCING: the repo's doas.conf IS the live config — resource_guard.sh
      on the host copies it to /etc/doas.conf every 5 minutes, so any edit
      propagates to production within one tick. Land the resource_guard fix
      (committed, not yet deployed) and verify doas syntax on the VM with
      `doas -C /etc/doas.conf -u dev id` before changing this file.
  - id: root_dot_sources_dev_owned_repo_every_5min
    tag: operator-priority
    summary: >
      etc/crontab.vm23:12 runs resource_guard.sh as root every 5 minutes, and
      resource_guard.sh:64-68 dot-sources ${GUARD_REPO:-/home/dev/pub4}/OPENBSD/
      validate_doas.ksh and stale_ci_cleanup.ksh — i.e. root EXECUTES files from
      a dev-owned git checkout. Write access to either file is root code
      execution within 5 minutes, independent of doas.
      Consequence for remediation: install_doas_conf_from_repo then copies the
      REPO's doas.conf over /etc/doas.conf, so hand-editing /etc/doas.conf on
      the host is reverted on the next tick. Fix the repo file first.
      Also validate_doas.ksh:30 writes /tmp/doas.conf.install.$$ (PID-predictable,
      world-writable dir) and cp's it to /etc/doas.conf without -h/-P.
  - id: secrets_in_process_argv_and_world_readable_home
    tag: operator-priority
    summary: >
      etc/rc.d/{master,brgen,amber,bsdports,bplan} pass SECRET_KEY_BASE,
      MASTER_BRIDGE_TOKEN and the LLM API keys inside daemon_flags, so they
      become ksh argv readable by any local account via `ps auxww`. A foothold
      in one app user yields every other app's SECRET_KEY_BASE — cross-app
      signed-cookie forgery. Compounded by vps_ci.sh:88 / RAILS/_runtime_gate.sh:71
      running `chmod o+x /home/dev` while OPERATOR.sh installs /home/dev/.zshrc
      at mode 644 with real keys in it. Move secrets to the sourced /etc/*.env.
      Also vps_ci.sh:22-28 (ensure_ci_lock) runs, as root via `doas sh -c`,
      `touch /var/tmp/pub4-ci.lock` then `chmod 666` on it — a fixed, predictable
      path in a world-writable directory with no -h/-P, so a pre-planted symlink
      redirects the root chmod onto an attacker-chosen file. PUB4_CI_LOCK is
      env-overridable (vps_master_scan.sh:7). Move the lock to a root-owned dir
      (e.g. /var/db/pub4/ci.lock) and drop the 666.
  - id: committed_rails_master_key_public_repo
    tag: operator-priority
    summary: >
      MASTER/web/config/master.key and credentials.yml.enc are tracked AND
      present on origin/main of github.com/anon987654321/pub4, which is PUBLIC
      (verified: unauthenticated API returns 200). Listed in two .gitignore
      files, but ignoring never untracks. Blast radius is limited — the file
      contains only secret_key_base, and production does not use it (MASTER runs
      SECRET_KEY_BASE_DUMMY=1; the Rails apps read SECRET_KEY_BASE from
      /etc/*.env) — but it must be untracked, rotated, and purged from history.
  - id: payment_webhooks_unverified
    tag: operator-priority
    summary: >
      marketplace/webhooks_controller.rb checks only that a Stripe-Signature
      header is PRESENT and never computes the HMAC; the Vipps handler has no
      check at all. Both are public POSTs with skip_forgery_protection and no
      rate limit, and order ids are sequential — forge an event, mark any order
      paid, trigger fulfilment. UNVERIFIED by me; from the 2026-07-27 review.
  - id: brgen_allow_unauthenticated_access_is_a_noop
    tag: operator-priority
    summary: >
      shared/.../authentication.rb:18-22 returns early when User has a `guest`
      column, so in brgen allow_unauthenticated_access does nothing and
      resume_session mints a real User row for every anonymous visitor. Every
      "requires a session" control in brgen is therefore reachable by anyone.
      Also a DoS: has_secure_password means each cookieless request costs a
      bcrypt hash (measured 460ms at cost 12) plus a write under SQLite's single
      writer — roughly 2 req/s saturates the 1-vCPU VM — and
      Shared::PruneGuestUsersJob is never enqueued or scheduled anywhere, with
      no index on users.guest, so the rows accumulate permanently.

  # --- RAILS audit 2026-07-26. The crash-level items from this pass are fixed
  # (see git log and the closed: entries below); what remains open here is
  # structural — gates, coverage, and non-raising dead wiring.
  - id: rails_gates_not_wired
    tag: operator-priority
    summary: >
      Five gates are invoked by no runner, deploy script or CI entrypoint:
      shared_wiring, stimulus_components_adoption, release, visual_contract,
      constitutional_scan. Nothing calls gates/runner.rb --all, and
      _deploy.sh runs zero Ruby gates. Worse, the whole design-craft stack
      (layout_geometry, surface_schema, visual_quality, user_flow,
      design_metrics, human_walkthrough, payment_honesty, guest_flow) warns
      and returns when the app port is closed — i.e. always, in CI. This is
      why the marketplace webhook routing bug survived: payment_honesty_gate
      only greps routes.rb for the string /checkout|webhooks/.
      Also: visual_contract_gate computes drift/a11y counts and never exits
      non-zero; release_gate exits 0 when bundler is missing;
      constitutional_scan_gate downgrades all findings to warnings;
      generated_asset_gate compares a service-worker path no app uses.
  - id: rails_coverage_contract_is_tautological
    tag: operator-priority
    summary: >
      test/controller_coverage_contract_test.rb and model_coverage_contract_test.rb
      assert only that source files contain class/def strings — they never boot
      Rails or call a method, so they pass against a body of `raise`. Real
      controller-test coverage: amber 30/31 missing, brgen 74/83, bsdports 11/12.
      Money and trust paths (stripe/vipps checkout, moderation_workflow,
      trust_score, account_merger, identity_assurer, shared/sso_token) have
      zero tests; sso_token also has no replay/nonce protection on its 120s token.
  - id: rails_silent_wiring_breaks
    tag: agent-ignore
    summary: >
      Non-raising but dead: pwa-standalone Stimulus controller referenced in
      amber+bsdports layouts does not exist; offline-feed emitted by amber
      item cards is brgen-only; submit->form-submit#lock and click->reply#toggle
      target methods/controllers that do not exist (reply form is permanently
      hidden); content_for :body_attrs is never yielded so notification badges
      never clear; several Turbo broadcasts use implicit to_partial_path with
      no matching partial; shared/prune_guest_users_job is never enqueued;
      mailer.html.erb subject line has an || vs ?: precedence bug.

