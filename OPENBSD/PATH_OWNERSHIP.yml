---
# What every path under OPENBSD/ is for, its risk, and the check that governs
# it. Keys are relative to this directory; `../` reaches the repo root. Globs
# are allowed. Check commands run from the repo root, so their paths start
# there. test/test_path_ownership.rb fails when a key names nothing, when a
# top-level entry here has no key, or when a check names a file that is gone.
ownership:
  "*.md":
    purpose: deploy front door, runbook, recipes, and agent gotchas with the standing refusals
    risk: high
    check: OPENBSD/bin/check
  man:
    purpose: BSD manuals for the operator surface, pub4-admin(8) and vps-deploy(8)
    risk: low
    check: mandoc -Tlint OPENBSD/man/man8/pub4-admin.8 OPENBSD/man/man8/vps-deploy.8
  PATH_OWNERSHIP.yml:
    purpose: this map
    risk: low
    check: ruby OPENBSD/test/test_path_ownership.rb
  ../MASTER/data/operator_seams.yml:
    purpose: operator-only work and its closing evidence; features live in RAILS/apps.yml,
      operator recipes in data/operator.yml
    risk: medium
    check: MASTER/bin/operator status
  ../RAILS/apps.yml:
    purpose: canonical app/domain/port/deploy inventory
    risk: critical
    check: OPENBSD/bin/check-rails
  ../RAILS/apps.horizon.yml:
    purpose: aspirational features (agent ignore)
    risk: low
    check: OPENBSD/bin/check-rails
  ../MASTER/checks/checks.yml:
    purpose: the check registry — every RAILS and OPENBSD/checks check is declared
      there and run through MASTER/checks/runner.rb
    risk: critical
    check: OPENBSD/bin/check-rails
  ../MASTER/checks/lib/production.rb:
    purpose: production Rails contract
    risk: high
    check: OPENBSD/bin/check-rails
  ../RAILS/__shared/:
    purpose: shared Rails engine and deploy helpers
    risk: high
    check: OPENBSD/bin/check-rails
  ../RAILS/*/*.sh:
    purpose: per-app deploy scripts
    risk: critical
    check: ruby OPENBSD/checks/verify_deploy_identity.rb
  OPERATOR.sh:
    purpose: full OpenBSD installer/deployer, run as root on vm23
    risk: critical
    check: OPENBSD/bin/check-openbsd
  _net.sh:
    purpose: DNS, NSD, DNSSEC and certificate helpers OPERATOR.sh sources
    risk: high
    check: ruby OPENBSD/checks/shell_syntax_check.rb
  bin/deploy_all.sh:
    purpose: workstation recovery path that reapplies box config (its header
      says why it stays unrun)
    risk: critical
    check: ruby OPENBSD/checks/shell_syntax_check.rb
  bin/vps_ci.sh:
    purpose: serial app CI entrypoint on vm23
    risk: high
    check: ruby OPENBSD/checks/shell_syntax_check.rb
  bin/resource_guard.sh:
    purpose: unprivileged manual entrypoint; refuses root and delegates to the installed runner
    risk: high
    check: ruby OPENBSD/checks/vps_safety_check.rb
  "bin/*.ksh":
    purpose: doas validation and the manual master recovery path
    risk: high
    check: ruby OPENBSD/checks/shell_syntax_check.rb
  "bin/*.exp":
    purpose: recovery-only console automation, gated by I_UNDERSTAND_CONSOLE_RISK
    risk: critical
    check: ruby OPENBSD/checks/vps_safety_check.rb
  emergency_cpu.sh:
    purpose: unprivileged manual emergency entrypoint; refuses root and delegates to the fixed installed runner
    risk: high
    check: ruby OPENBSD/checks/vps_safety_check.rb
  backup_priv.sh:
    purpose: nightly encrypted ~/priv backup; stays at the top because vm23's
      /etc/daily.local runs it by this path (its header names the line)
    risk: high
    check: ruby OPENBSD/checks/shell_syntax_check.rb
  deploy_inventory.json:
    purpose: deploy identity and public service inventory, generated by
      bin/sync_deploy_inventory.rb
    risk: high
    check: ruby OPENBSD/checks/verify_deploy_identity.rb
  checks/integrity_check.rb:
    purpose: full local deploy check chain
    risk: high
    check: ruby OPENBSD/checks/integrity_check.rb
  "*.rb":
    purpose: config sync from the box and one-off operator tools
    risk: high
    check: OPENBSD/bin/check-openbsd
  vm_resource.yml:
    purpose: vm23 resource budget, mirroring resource_guard.sh
    risk: medium
    check: OPENBSD/bin/check
  bin/:
    purpose: operator entry points — checks, vps-deploy, vps-state, DNS render,
      domain_watch.rb (run weekly from etc/weekly.local), dr-pull — and the
      deploy, CI, install and recovery shell they call
    risk: critical
    check: OPENBSD/bin/check-openbsd
  lib/:
    purpose: the path every tree's checks require for the check kernel (a reader of
      MASTER/checks/support/check_result.rb) plus the shared shell helpers
    risk: critical
    check: ruby OPENBSD/test/test_check_lib.rb
  checks/:
    purpose: the check scripts (health check, config drift, installed targets,
      safety, smoke, identity, integrity chain) and the domain, DNS and port
      check classes MASTER/checks/checks.yml registers
    risk: high
    check: OPENBSD/bin/check-openbsd
  data/:
    purpose: dns policy, domain inventory and the operator command list
    risk: high
    check: OPENBSD/bin/check-openbsd
  test/:
    purpose: OPENBSD contract tests, run by bin/check
    risk: medium
    check: OPENBSD/bin/check
  etc/:
    purpose: repo mirror of live /etc configs
    risk: critical
    check: OPENBSD/bin/check-openbsd
  usr/local/bin/resource_guard.sh:
    purpose: root-owned load-shedding runner; sources only the installed stale-cleanup helper, never checkout code
    risk: critical
    check: ruby OPENBSD/checks/vps_safety_check.rb
  usr/local/bin/emergency_cpu.sh:
    purpose: root-owned emergency CPU recovery runner; sources only the installed stale cleanup helper, never checkout code
    risk: critical
    check: ruby OPENBSD/checks/vps_safety_check.rb
  usr/local/sbin/pub4-admin:
    purpose: root-owned fixed-verb service/deploy/CI broker; no shell text or arbitrary paths
    risk: critical
    check: ruby OPENBSD/checks/vps_safety_check.rb
  usr/local/libexec/ci-prepare.ksh:
    purpose: fixed app/account/storage preparation with path ownership and symlink validation
    risk: critical
    check: ruby OPENBSD/checks/vps_safety_check.rb
  usr/local/libexec/ci-run.ksh:
    purpose: bounded CI launcher; runs Bundler and tests as the allowlisted app user
    risk: critical
    check: ruby OPENBSD/checks/vps_safety_check.rb
  usr/local/libexec/ci-sync.ksh:
    purpose: app-owned CI copy-tree sync from the fixed repository, never root filesystem mutation
    risk: critical
    check: ruby OPENBSD/checks/vps_safety_check.rb
  usr/local/libexec/rails-task.ksh:
    purpose: closed Rails runtime task dispatcher; app code and Bundler run as the selected app user
    risk: critical
    check: ruby OPENBSD/checks/vps_safety_check.rb
  usr/:
    purpose: root cron jobs installed to /usr/local/bin and helpers root sources
      from /usr/local/libexec
    risk: critical
    check: ruby OPENBSD/checks/installed_targets_check.rb
  var/:
    purpose: nsd.conf and the unsigned zones bin/render_dns.rb generates
    risk: critical
    check: ruby OPENBSD/bin/render_dns.rb --check
  home/:
    purpose: repo mirror of the johann@brgen.no mail client (.muttrc, .mailcap,
      bin/mailimg), installed by OPERATOR.sh's setup_mail_client
    risk: low
    check: sh -n OPENBSD/home/johann/bin/mailimg
  dev/:
    purpose: operator Mac helpers and the git hooks MASTER/bin/operator hooks
      installs; nothing here reaches vm23
    risk: low
    check: ruby OPENBSD/test/test_githooks.rb