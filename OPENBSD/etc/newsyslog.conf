# REPO MIRROR of /etc/newsyslog.conf on vm23. OPERATOR.sh installs this file,
# so it must be the WHOLE config, not just our additions.
#
# It previously contained only the four pub4 entries at the bottom. Installing
# that over the base config deleted every OpenBSD default rule, so nothing
# rotated /var/log/{messages,daemon,pflog,secure,authlog,maillog}. Measured
# 2026-08-08: messages 1.9G, daemon 1.9G, pflog 637M, /var at 106% -- into the
# reserve. The brgen CI test step then died after 94s with no output of its own
# because it could not write, the deploy reported "Tests: Rails failed", and
# nothing said why. dmesg was a wall of "uid 0 on /var: file system full".
#
# The default block below is verbatim from OpenBSD 7.8's own etc.tgz
# (/var/sysmerge/etc.tgz on the box), not reconstructed from memory. Validated
# with `newsyslog -nv -f` before installing.
#
#	$OpenBSD: newsyslog.conf,v 1.38 2022/01/05 18:34:23 deraadt Exp $
#
# configuration file for newsyslog
#
# logfile_name		owner:group     mode count size when  flags
/var/cron/log		root:wheel	600  3     10   *     Z
/var/log/authlog	root:wheel	640  7     *    168   Z
/var/log/daemon				640  5     300  *     Z
/var/log/lpd-errs			640  7     10   *     Z
/var/log/maillog			640  7     *    24    Z
/var/log/messages			644  5     300  *     Z
/var/log/secure				600  7     *    168   Z
/var/log/wtmp				644  7     *    $M1D4 B ""
/var/log/xferlog			640  7     250  *     Z
/var/log/pflog				600  3     250  *     ZB "pkill -HUP -u root -U root -t - -x pflogd"
/var/www/logs/access.log		644  4     *    $W0   Z "pkill -USR1 -u root -U root -x httpd"
/var/www/logs/error.log			644  7     250  *     Z "pkill -USR1 -u root -U root -x httpd"

# pub4 application logs (see OPENBSD/etc/newsyslog.conf in the repo).
# These four used to be the ENTIRE file: the repo mirror carried only them and
# OPERATOR.sh installed it over the base config, so every OpenBSD default rule
# above was lost. messages and daemon reached 1.9G each, pflog 637M, and /var
# hit 106% — which killed the brgen CI mid-deploy with no error of its own.
/var/log/openbsd_setup.log		root:wheel 640 12 * $W0D0 Z
/var/log/openbsd_transactions.log	root:wheel 640 12 * $W0D0 Z
/var/log/cert-renewal.log		root:wheel 640 12 * $W0D0 Z
/var/log/resource_guard_history.log	root:wheel 640 12 * $W0D0 Z
