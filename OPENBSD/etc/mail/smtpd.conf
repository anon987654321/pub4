# brgen.no mail. Inbound for the domain lands in the mapped local user's
# Maildir; everything the machine itself generates (cron, smartd, daily(8))
# keeps going to the local mbox as before.

pki mail.brgen.no cert "/etc/ssl/brgen.no.fullchain.pem"
pki mail.brgen.no key  "/etc/ssl/private/brgen.no.key"

table aliases  file:/etc/mail/aliases
table domains  file:/etc/mail/domains
table virtuals file:/etc/mail/virtuals

listen on socket
listen on lo0
# Port 25 with STARTTLS. No submission (587) listener on purpose: mutt runs on
# this host and hands mail to the local socket, so there is no remote client to
# authenticate and no password to keep. Add one only when a client needs it.
listen on vio0 tls pki mail.brgen.no hostname mail.brgen.no

action "local_mail" mbox alias <aliases>
action "receive"    maildir "/home/%{dest.user}/Maildir" virtual <virtuals>
action "outbound"   relay helo mail.brgen.no

match from any   for domain <domains> action "receive"
match from local for local            action "local_mail"
match from local for any              action "outbound"
