# THIS FILE IS THE REPO MIRROR OF /etc/doas.conf. It is NO LONGER auto-synced to
# vm23: root cron used to install it every tick (resource_guard.sh, then
# relayd-watchdog and config-drift-check via validate_doas.ksh), but that was root
# executing a script and installing a doas.conf out of a dev-owned checkout — root
# code execution on the next tick for anyone who could write either file, and it
# reverted hand-hardening of the live file within minutes. All three heal paths were
# removed. doas policy is now installed only by OPERATOR.sh (root-run, deliberate),
# so an edit here reaches vm23 on the next OPERATOR.sh sync, not on a cron tick.
# validate_doas.ksh still installs+validates (dev can reach root AND an allowlisted
# variable still crosses, rolling back from a timestamped backup on failure) when
# OPERATOR.sh calls it. Verify by hand after a sync:
#
#   doas -C /etc/doas.conf -u dev id
#   I_UNDERSTAND_DNS_WIPE=1 doas printenv I_UNDERSTAND_DNS_WIPE
#
# `keepenv` used to be on the dev rule. It preserves the caller's whole environment
# across the privilege boundary, and for a Ruby stack that includes RUBYOPT, RUBYLIB,
# GEM_HOME and BUNDLE_* — so `RUBYOPT=-r/tmp/x.rb doas <anything>` was arbitrary code
# execution as root by construction, no shell required (TODO.md:
# doas_keepenv_is_a_root_rce). MASTER/bin/tts-worker already scrubs exactly that
# variable set before boot because it does not trust it; keepenv handed the same set
# to root.
#
# Command scoping cannot fix this — the pipeline invokes `doas zsh` 27x, `doas sh` 8x
# and `doas ksh` 6x, and a root shell is equivalent to blanket root. Dropping keepenv
# is independent of that, which is why it is the cheapest real reduction available.
#
# The allowlist is measured, not guessed: these are the variables that scripts run
# under doas read and never assign themselves. I_UNDERSTAND_DNS_WIPE gates
# OPERATOR.sh --stage-1 and I_UNDERSTAND_CONSOLE_RISK gates vps_console*.exp (both
# human-only, START_HERE.md); RUN_PRODUCTION_SEEDS, SKIP_MASTER_SCAN and MAIL_IMG_FMT
# are operator toggles read in OPERATOR.sh. Everything else OPERATOR.sh reads
# (APP_PORTS, BACKEND_PORT, BRGEN_IP, DOMAIN_BACKEND, HYP_IP, STATE_FILE, TMPFILES)
# it declares itself, and the deploy scripts export inside the doas'd command string
# rather than across the boundary.
#
# A variable missing from this list fails closed and loudly — OPERATOR.sh refuses
# stage-1 and names the variable to set — so extend it only with the same evidence.
permit nopass setenv { I_UNDERSTAND_DNS_WIPE I_UNDERSTAND_CONSOLE_RISK RUN_PRODUCTION_SEEDS SKIP_MASTER_SCAN MAIL_IMG_FMT } dev as root
# Blanket rule for dev deploy flows (O9 option a).
permit nopass keepenv root as root
# RAILS/_deploy.sh's deploy_tracked_app calls doas again from inside the
# already-elevated deploy_app doas hop (useradd/mkdir/chown/rcctl/etc.) --
# without this, that second hop fails with "doas: Operation not permitted"
# since only dev->root was permitted, not root->root.
#
# keepenv stays on this one deliberately: it is root->root, so it grants an attacker
# nothing they do not already have, and stripping it would remove the environment the
# outer dev->root hop just established out from under the inner one.
