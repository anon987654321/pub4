# The repo mirror of /etc/doas.conf. No cron path installs it: root installing a
# doas.conf out of a dev-owned checkout is root code execution for anyone who can
# write the checkout, and it reverts hand-hardening of the live file within a tick.
# OPERATOR.sh installs it on a deliberate root run, through validate_doas.ksh,
# which checks that dev still reaches root and an allowlisted variable still
# crosses, and rolls back from a timestamped backup when either fails. An edit
# here reaches vm23 only on that run, so verify the live file, not this one:
#
#   doas -C /etc/doas.conf id
#   I_UNDERSTAND_DNS_WIPE=1 doas printenv I_UNDERSTAND_DNS_WIPE
#
# The first command has no -u because -u names the TARGET user, not the caller
# (doas(1): "Execute the command as user. The default is root."). `doas -C
# /etc/doas.conf -u dev id` therefore asks whether dev may run id as dev, which
# no rule permits, and prints `deny` on a box where the rule below is wide open.
# Without -u it prints `permit nopass`, which is the answer this check wants.
#
# Anything that executes as dev is root, with no password and no prompt. dev is
# the ssh login, the account bin/vps-deploy and a terminal's MASTER/bin/master run
# as, and the owner of /home/dev/pub4, which agent sessions write to every day, so
# the trust boundary is every commit that reaches that checkout. The daemons sit
# outside it: brgen, amber, bsdports and master run as their own users, none in
# wheel and none with a rule here. sshd refuses root logins and passwords, so the
# reachable door is a dev key.
#
# Command scoping cannot narrow the dev rule. doas.conf(5) matches `cmd` and its
# `args` against what the caller passes, and the deploy escalates through root
# shells (doas zsh, sh, su, ksh), which are blanket root, and through `doas rcctl
# set <svc> flags` with the service in a variable, which writes flags root runs at
# the next boot. Dropping nopass fails too: every escalation is non-interactive —
# cron, an ssh one-shot, bin/vps-deploy per step — and `persist` spares only the
# second prompt, never the first.
#
# The rule is survivable because keepenv is off it, no cron path installs this
# file, root cron execs no file inside the checkout, and validate_doas.ksh rolls
# back. The one narrowing that works is a single root-installed entry point such
# as /usr/local/sbin/operator-deploy, holding every step bin/vps-deploy escalates
# for, with dev permitted only `cmd` that file: `cmd` matches what doas executes,
# so the boundary becomes the root install rather than the pull. It inverts the
# bootstrap — a hotfix needs a root install first — and turns every doas call site
# into one new script, so take it as a scheduled rebuild of the deploy with
# OPERATOR.sh as the installer, and remove dev from wheel in the same pass. Reopen
# this when the deploy is rebuilt, when a fourth account needs root, or when
# anything other than a deliberate operator action runs as dev on the box.
#
# keepenv stays off the dev rule because it preserves the caller's whole
# environment across the privilege boundary, and for a Ruby stack that includes
# RUBYOPT, RUBYLIB, GEM_HOME and BUNDLE_* — so `RUBYOPT=-r/tmp/x.rb doas <anything>`
# is arbitrary code execution as root by construction, no shell required.
# MASTER/bin/tts-worker scrubs exactly that variable set before boot because it
# does not trust it.
#
# The allowlist is measured, not guessed: these are the variables that scripts run
# under doas read and never assign themselves. I_UNDERSTAND_DNS_WIPE gates
# OPERATOR.sh --stage-1 and I_UNDERSTAND_CONSOLE_RISK gates vps_console*.exp (both
# human-only, START_HERE.md); RUN_PRODUCTION_SEEDS, SKIP_MASTER_SCAN and MAIL_IMG_FMT
# are operator toggles read in OPERATOR.sh. Everything else OPERATOR.sh reads
# (APP_PORTS, BACKEND_PORT, BRGEN_IP, DOMAIN_BACKEND, HYP_IP, STATE_FILE, TMPFILES)
# it declares itself, and the deploy scripts export inside the doas'd command string
# rather than across the boundary.
#
# A variable missing from this list fails closed and loudly — OPERATOR.sh refuses
# stage-1 and names the variable to set — so extend it only with the same evidence.
permit nopass setenv { I_UNDERSTAND_DNS_WIPE I_UNDERSTAND_CONSOLE_RISK RUN_PRODUCTION_SEEDS SKIP_MASTER_SCAN MAIL_IMG_FMT } dev as root
# Blanket rule for dev deploy flows (O9 option a).
permit nopass keepenv root as root
# RAILS/_deploy.sh's deploy_tracked_app calls doas again from inside the
# already-elevated deploy_app doas hop (useradd/mkdir/chown/rcctl/etc.) --
# without this, that second hop fails with "doas: Operation not permitted"
# since only dev->root was permitted, not root->root.
#
# keepenv stays on this one deliberately: it is root->root, so it grants an attacker
# nothing they do not already have, and stripping it would remove the environment the
# outer dev->root hop just established out from under the inner one.
