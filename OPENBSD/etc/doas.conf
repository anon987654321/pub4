permit nopass keepenv dev as root
# Blanket rule for dev deploy flows (O9 option a).
permit nopass keepenv root as root
# RAILS/_deploy.sh's deploy_tracked_app calls doas again from inside the
# already-elevated deploy_app doas hop (useradd/mkdir/chown/rcctl/etc.) --
# without this, that second hop fails with "doas: Operation not permitted"
# since only dev->root was permitted, not root->root.
