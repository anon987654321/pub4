# httpd(8): ACME challenges and HTTP to HTTPS redirect per httpd.conf(5)

server "*" {
  listen on 0.0.0.0 port 80

  location "/.well-known/acme-challenge/*" {
    root "/acme"
    request strip 2
  }

  location * {
    block return 301 "https://$HTTP_HOST$REQUEST_URI"
  }
}

# postpro output, which is personal photographs. Loopback, not `*`: pf is
# default-deny and its pass rules name 22, 53, 80 and 443, so this was
# unreachable from outside — but only because of another daemon's config.
# Reach it over an ssh tunnel: ssh -L 6666:127.0.0.1:6666 dev@brgen.no
server "brgen.no" {
  listen on 127.0.0.1 port 6666
  root "/postpro"
  directory index index.html
}

