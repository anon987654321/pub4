---
ownership:
  funding.yml:
    purpose: canonical economics, ventures, funders, deadlines
    risk: critical
    check: cd BPLAN && make validate
  build_plans.rb:
    purpose: static HTML per venture + index
    risk: high
    check: cd BPLAN && make build_plans
  build_legats.rb:
    purpose: legat HTML + manifest.yml
    risk: high
    check: cd BPLAN && make build_legats
  rails/bplan.sh:
    purpose: VPS deploy — app tree + content symlink
    risk: critical
    check: zsh -n BPLAN/rails/bplan.sh
  rails/:
    purpose: standalone Rails 8 app (port 39282)
    risk: high
    check: cd BPLAN/rails && bundle exec rails test
  bplan.yml:
    purpose: deploy manifest (not in RAILS/apps.yml)
    risk: medium
    check: ruby -e "require 'yaml'; YAML.load_file('BPLAN/bplan.yml')"
  .deployignore:
    purpose: content sync exclusions on VPS
    risk: medium
    check: test -f BPLAN/.deployignore