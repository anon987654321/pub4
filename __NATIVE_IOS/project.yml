name: Pub4Mobile
options:
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  xcodeVersion: "26.0"
  minimumXcodeGenVersion: "2.46.0"
configs:
  Brgen: release
  Radio: release
  Dating: release
  TV: release
  Takeaway: release
  Marketplace: release
  Maps: release
  Messenger: release
  Amber: release

targets:
  Pub4Mobile:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Pub4Mobile.entitlements
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Brgen:
          PRODUCT_BUNDLE_IDENTIFIER: no.brgen.brgen
          MOBILE_APP_URL: https://brgen.no/
          MOBILE_APP_HOST: brgen.no
          MOBILE_APP_NAME: Brgen
        Radio:
          PRODUCT_BUNDLE_IDENTIFIER: no.brgen.radio
          MOBILE_APP_URL: https://radio.brgen.no/
          MOBILE_APP_HOST: radio.brgen.no
          MOBILE_APP_NAME: Brgen Radio
        Dating:
          PRODUCT_BUNDLE_IDENTIFIER: no.brgen.dating
          MOBILE_APP_URL: https://dating.brgen.no/
          MOBILE_APP_HOST: dating.brgen.no
          MOBILE_APP_NAME: Brgen Dating
        TV:
          PRODUCT_BUNDLE_IDENTIFIER: no.brgen.tv
          MOBILE_APP_URL: https://tv.brgen.no/
          MOBILE_APP_HOST: tv.brgen.no
          MOBILE_APP_NAME: Brgen TV
        Takeaway:
          PRODUCT_BUNDLE_IDENTIFIER: no.brgen.takeaway
          MOBILE_APP_URL: https://takeaway.brgen.no/
          MOBILE_APP_HOST: takeaway.brgen.no
          MOBILE_APP_NAME: Brgen Takeaway
        Marketplace:
          PRODUCT_BUNDLE_IDENTIFIER: no.brgen.marketplace
          MOBILE_APP_URL: https://markedsplass.brgen.no/
          MOBILE_APP_HOST: markedsplass.brgen.no
          MOBILE_APP_NAME: Brgen Marketplace
        Maps:
          PRODUCT_BUNDLE_IDENTIFIER: no.brgen.maps
          MOBILE_APP_URL: https://maps.brgen.no/
          MOBILE_APP_HOST: maps.brgen.no
          MOBILE_APP_NAME: Brgen Maps
        Messenger:
          PRODUCT_BUNDLE_IDENTIFIER: no.brgen.messenger
          MOBILE_APP_URL: https://messenger.brgen.no/
          MOBILE_APP_HOST: messenger.brgen.no
          MOBILE_APP_NAME: Brgen Messenger
        Amber:
          PRODUCT_BUNDLE_IDENTIFIER: fashion.amber.app
          MOBILE_APP_URL: https://amber.fashion/
          MOBILE_APP_HOST: amber.fashion
          MOBILE_APP_NAME: Amber

schemes:
  Brgen:
    build:
      targets:
        Pub4Mobile: all
    run:
      config: Brgen
    archive:
      config: Brgen
  Radio:
    build:
      targets:
        Pub4Mobile: all
    run:
      config: Radio
    archive:
      config: Radio
  Dating:
    build:
      targets:
        Pub4Mobile: all
    run:
      config: Dating
    archive:
      config: Dating
  TV:
    build:
      targets:
        Pub4Mobile: all
    run:
      config: TV
    archive:
      config: TV
  Takeaway:
    build:
      targets:
        Pub4Mobile: all
    run:
      config: Takeaway
    archive:
      config: Takeaway
  Marketplace:
    build:
      targets:
        Pub4Mobile: all
    run:
      config: Marketplace
    archive:
      config: Marketplace
  Maps:
    build:
      targets:
        Pub4Mobile: all
    run:
      config: Maps
    archive:
      config: Maps
  Messenger:
    build:
      targets:
        Pub4Mobile: all
    run:
      config: Messenger
    archive:
      config: Messenger
  Amber:
    build:
      targets:
        Pub4Mobile: all
    run:
      config: Amber
    archive:
      config: Amber
