---
job: extension
config:
  name: johann_v1
  process:
  - type: sd_trainer
    training_folder: null
    device: mps
    trigger_word: johann
    network:
      type: lora
      linear: 32
      linear_alpha: 16
    save:
      dtype: float16
      save_every: 250
      max_step_saves_to_keep: 4
      push_to_hub: false
    datasets:
    - folder_path: null
      caption_ext: txt
      caption_dropout_rate: 0.08
      shuffle_tokens: false
      cache_latents_to_disk: true
      resolution: [512, 768, 1024]
    train:
      batch_size: 1
      steps: 1800
      skip_first_sample: true
      gradient_accumulation_steps: 1
      train_unet: true
      train_text_encoder: false
      gradient_checkpointing: true
      noise_scheduler: flowmatch
      optimizer: adamw8bit
      lr: 5e-5
      ema_config:
        use_ema: true
        ema_decay: 0.995
      dtype: bf16
    model:
      name_or_path: black-forest-labs/FLUX.1-dev
      is_flux: true
      quantize: true
      low_vram: true
    sample:
      sampler: flowmatch
      sample_every: 250
      width: 1024
      height: 1024
      seed: 42
      walk_seed: true
      guidance_scale: 3.5
      sample_steps: 28
    meta:
      name: johann_v1
      version: "1.0"
      master_trigger: johann