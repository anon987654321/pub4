# PF firewall per pf.conf(5) - OpenBSD 7.8
ext_if = "vio0"
brgen_ip = "$BRGEN_IP"
hyp_ip = "$HYP_IP"
set skip on lo
set block-policy return
set loginterface \$ext_if
set limit { states 10000, frags 5000 }
block log all
match in all scrub (no-df random-id)
table <bruteforce> persist
block quick from <bruteforce>
pass out quick on \$ext_if all
pass in on \$ext_if inet proto tcp to \$ext_if port 22 keep state (max-src-conn 15, max-src-conn-rate 5/3, overload <bruteforce> flush global)
pass in on \$ext_if inet proto { tcp, udp } to \$brgen_ip port 53 keep state
pass in on \$ext_if inet proto tcp to \$ext_if port { 80, 443 } keep state
pass in on \$ext_if inet proto tcp to \$ext_if port { 25, 587 } keep state
pass inet proto icmp all icmp-type { echoreq, unreach, timex }
