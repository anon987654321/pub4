# Litestream replication for Rails SQLite databases.
# Set LITESTREAM_REPLICA_URL (s3://bucket or file:///var/backups/litestream) in /etc/master.env.
# Install: pkg_add litestream; cp to /etc/litestream.yml; rcctl enable litestream; rcctl start litestream

access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}

dbs:
  - path: /home/brgen/app/db/production.sqlite3
    replicas:
      - url: ${LITESTREAM_REPLICA_URL}/brgen/production
  - path: /home/brgen/app/db/production_cache.sqlite3
    replicas:
      - url: ${LITESTREAM_REPLICA_URL}/brgen/cache
  - path: /home/brgen/app/db/production_queue.sqlite3
    replicas:
      - url: ${LITESTREAM_REPLICA_URL}/brgen/queue
  - path: /home/brgen/app/db/production_cable.sqlite3
    replicas:
      - url: ${LITESTREAM_REPLICA_URL}/brgen/cable

  - path: /home/amber/app/db/production.sqlite3
