---
job: extension
config:
  name: "ragnhild_v1"
  process:
  - type: sd_trainer
    training_folder: "/Users/mac/Documents/GitHub/pub4/DEPLOY/repligen/lora/ragnhild/weights"
    device: mps
    trigger_word: "ragnhild"
    network:
      type: lora
      linear: 16
      linear_alpha: 16
    save:
      dtype: float16
      save_every: 250
      max_step_saves_to_keep: 4
      push_to_hub: false
    datasets:
    - folder_path: "/Users/mac/Documents/GitHub/pub4/DEPLOY/repligen/lora/ragnhild/train"
      caption_ext: txt
      caption_dropout_rate: 0.05
      shuffle_tokens: false
      cache_latents_to_disk: true
      resolution: [512, 768, 1024]
    train:
      batch_size: 1
      steps: 1000
      gradient_accumulation_steps: 1
      train_unet: true
      train_text_encoder: false
      gradient_checkpointing: true
      noise_scheduler: flowmatch
      optimizer: adamw8bit
      lr: 1e-4
      ema_config:
        use_ema: true
        ema_decay: 0.99
      dtype: bf16
    model:
      name_or_path: "black-forest-labs/FLUX.1-dev"
      is_flux: true
      quantize: true
      low_vram: true
    sample:
      sampler: flowmatch
      sample_every: 250
      width: 1024
      height: 1024
      prompts:
      - "ragnhild, woman, portrait, natural light, detailed face"
      - "photo of ragnhild, woman, candid, soft background"
      - "ragnhild, woman, studio portrait, neutral backdrop"
      neg: ""
      seed: 42
      walk_seed: true
      guidance_scale: 4
      sample_steps: 20
    meta:
      name: "[name]"
      version: "1.0"
      master_trigger: "ragnhild"
meta:
  name: "[name]"
  version: "1.0"
