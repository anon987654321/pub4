# Rails deploy matrix — canonical inventory for DEPLOY/rails.
#
# deploy_root: tracked tree copied to /home/<app>/app by <app>.sh
# status: done | port | missing | planned
#
# Verify claims: cd MASTER && bundle exec ruby bin/cli  →  /scan DEPLOY/rails/<app>
# Human summary: DEPLOY/rails/README.md and per-app README.md
# Shared engine: DEPLOY/rails/shared (pub4-shared gem)
#
# Stack default: Rails 8.1, Ruby 3.4, SQLite, Falcon, Solid Queue/Cache, relayd TLS

apps:

  brgen:
    title: Brgen
    domain: brgen.no
    port: 38182
    stack_now: SQLite3, Rails 8, Hotwire, Falcon, Active Storage, Solid Queue, Solid Cache, OpenBSD, relayd
