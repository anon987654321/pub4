# AN303/AN1709: Solid Queue recurring jobs template

production:
  daily_digest:
    class: Shared::NotificationDeliveryJob
    queue: critical
    schedule: at 8am every day
  weekly_stats:
    class: Shared::AnalyticsRollupJob
    queue: bulk
    args: [{ period: "weekly" }]
    schedule: at 6am every Monday
  nightly_search_rebuild:
    class: Shared::SearchIndexRebuildJob
    queue: default
    schedule: at 3am every day
  monthly_analytics:
    class: Shared::AnalyticsRollupJob
    queue: bulk
    args: [{ period: "monthly" }]
    schedule: at 4am on day 1
  dead_letter_digest:
    class: Shared::DeadLetterDigestJob
    queue: bulk
    schedule: at 7am every day
  clear_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12