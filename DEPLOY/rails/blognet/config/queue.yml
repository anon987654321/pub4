# AN302: Queue priority tiers

default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "critical"
      threads: 3
      processes: 1
      polling_interval: 0.5
    - queues: "default"
      threads: 5
      processes: 1
      polling_interval: 1
    - queues: "bulk"
      threads: 2
      processes: 1
      polling_interval: 2

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default