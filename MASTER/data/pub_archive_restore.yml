meta:
  name: pub_archive_restore
  updated: "2026-07-07"
  purpose: "Lessons recovered from pub, pub2, and pub3 without restoring unsafe defaults."

sources:
  pub:
    head: "a3185f4ec6e6"
    date: "2026-05-07"
  pub2:
    head: "ad05242c97ff"
    date: "2026-05-07"
  pub3:
    head: "835f9199d605"
    date: "2026-05-07"

pub:
  classification: "legacy Rails app and installer archive"
  restore:
    - "brgen social model lessons: posts, comments, follows, likes, notifications, direct messages"
    - "README/installer app names for brgen subapps and retired apps"
    - "Devise/OAuth and live-search ideas now represented by shared Rails concerns and app-level auth/search"
  do_not_restore:
    - "PostgreSQL-only pg_search assumptions into SQLite production apps"
    - "placeholder comment AJAX handlers"
    - "unscoped direct-message APIs that bypass current app auth conventions"
  product_lessons:
    - "Old working apps should be compared by model/controller behavior, not by README ambition alone."
    - "Subapps belong under brgen when their domain and tenant behavior is shared."
    - "Legacy APIs need explicit auth and tenant checks before restoration."

pub2:
  classification: "audio product archive"
  restore:
    - "AKMD lofi mastering chain as a Ruby FFmpeg wrapper"
    - "Radio Bergen manifest format"
    - "audio-reactive visualizer concept"
    - "Web Audio analyser and reduced-motion patterns"
  do_not_restore:
    - "generated MP3 binaries"
    - "monolithic index.html architecture"
    - "external media autoplay as a production dependency"
    - "unreviewed public playback rights"
  product_lessons:
    - "Audio features need both signal chain reproducibility and rights metadata."
    - "Visualizer code must degrade when Web Audio or autoplay is blocked."
    - "Reduced-motion is part of production readiness, not polish."
    - "Track manifests should be data, not hardcoded in views."

pub3:
  classification: "governance and infrastructure archive"
  restore:
    - "evidence scoring"
    - "convergence detection"
    - "quality dashboard concept"
    - "AIGHT local CLI ideas"
    - "platform detection for OpenBSD, Cygwin, Termux, macOS, Linux"
    - "port single-source-of-truth lesson"
    - "domain candidates and PTR hints"
    - "privcam, pub_attorney, and mytoonz app implementations under archived Rails apps"
    - "baibl and blognet as retired recovery-only contexts"
  do_not_restore:
    - "auto_execute permission defaults"
    - "bypass_confirmation permission defaults"
    - "require_approval=false defaults"
    - "Redis deployment assumptions"
    - "PF rule exposing 10000:65535"
    - "random production port allocation"
    - "bash/sed/grep-only gates"
  environment_constraints:
    cygwin:
      - "Do not assume tool sandbox PATH matches the user's Cygwin terminal."
      - "After two failed local audio/GUI attempts, give a terminal command instead of fighting the environment."
      - "Translate paths explicitly between Windows and POSIX forms."
    openbsd:
      - "Prefer Ruby gates and rc.d/ksh services over ad hoc shell."
      - "Keep Rails app ports on loopback behind relayd."
      - "DNS, TLS, relayd, pf, and rcctl checks must be separately observable."
    github_archives:
      - "Archive repos are evidence, not automatic truth."
      - "Restore concepts into small reviewed modules."
      - "Record do-not-restore decisions beside restored artifacts."
      - "Retired app names must not reappear in active deploy scripts."

gates:
  required:
    - "ruby MASTER/tools/convergence/evidence_gate.rb"
    - "ruby RAILS/archive_restore_gate.rb"
    - "ruby RAILS/check_production_gate.rb"
