---
- name: triad_default
  description: Default pipeline — deep scan, autofix sweep, council review.
    Runs hourly and after any /chat or CLI session that mutated MASTER source.
    User never types this; agent_commands/triad_command runs all three.
  trigger: scheduled
  interval_s: 3600
  command: "triad deep ."
  enabled: true
  state: pending
  last_run_at: 0
- name: nightly_dreams
  description: Consolidate memories during low-activity periods
  trigger: scheduled
  interval_s: 86400
  command: dreams consolidate
  enabled: true
  state: done
  last_run_at: 1778024187
- name: weekly_scan
  description: Weekly codebase axiom scan for regressions
  trigger: scheduled
  interval_s: 604800
  command: scan
  enabled: true
  state: pending
  last_run_at: 0
- name: data_integrity_check
  description: Detect and recover from corrupted data/ YAML files (LLM error strings
    written as file content)
  trigger: scheduled
  interval_s: 3600
  command: "/scan data/"
  enabled: true
  state: running
  last_run_at: 1777590915
