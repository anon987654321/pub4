---
# Standing orders — event and manual triggers only. No scheduled intervals.
# trigger: event  — fires when matching bus event is published
# trigger: pre_tool — fires before a tool call matching on: pattern
# trigger: manual  — only runs when explicitly called via /command
#
# Runtime state (state/last_run_at/last_error) lives here temporarily.
# TODO: move state fields to .master/standing_orders_state.yml once
#       standing_orders.rb splits config from FSM state.

- name: auto_default
  description: Scan + sweep + council after any source mutation. Primary self-maintenance loop.
  trigger: event
  on: "tool:after"
  filter: "Write|Edit|Create|FilePatch"
  exclude: "data/|test/"
  command: auto .
  enabled: true
  state: pending
  last_run_at: 0

- name: data_integrity_check
  description: Scan data/ YAML files for corruption after any data/ write.
  trigger: event
  on: "tool:after"
  filter: "data/"
  command: /scan data/
  enabled: true
  state: pending
  last_run_at: 0

- name: dreams
  description: Consolidate memories. Run via /dreams or after session end.
  trigger: manual
  command: dreams consolidate
  enabled: true
  state: pending
  last_run_at: 0

- name: architecture_audit
  description: Review data/* for shape misfit (files >200 lines, overlapping keys, misnamed modules). Run via /audit architecture.
  trigger: manual
  command: audit architecture
  callable: architecture_audit
  enabled: true
  state: pending
  last_run_at: 0

- name: constitution_drift
  description: Scan lib/ against the axioms after any source mutation; emit improved/regressed/steady so regressions are caught the moment they land.
  trigger: event
  on: "tool:after"
  filter: "Write|Edit|Create|FilePatch"
  exclude: "data/|test/|knowledge/"
  command: audit constitution
  callable: constitution_drift
  enabled: true
  state: pending
  last_run_at: 0

- name: autocommit_post_chat
  description: After any turn that mutated source, generate a Strunk-style commit message and commit.
  trigger: event
  on: "tool:after"
  filter: "Write|Edit|Create|FilePatch"
  command: git autocommit
  callable: autocommit
  enabled: true
  state: pending
  last_run_at: 0

- name: restart_master_on_web_edit
  description: Restart MASTER service when web/ files change so edits take effect immediately.
  trigger: event
  on: "tool:after"
  filter: "web/"
  command: doas rcctl restart master
  callable: restart_master
  enabled: true
  state: pending
  last_run_at: 0

- name: pre_edit_scan
  description: Before any Edit/Write, scan the target file and surface existing violations alongside the proposed change.
  trigger: pre_tool
  on: "Write|Edit|FilePatch"
  command: scan {target_file}
  enabled: true
  state: pending
  last_run_at: 0

- name: live_preview_gate
  description: After editing a web view or asset, verify the page renders within 10s. Block commit on failure.
  trigger: event
  on: "tool:after"
  filter: "web/app/views/|web/app/assets/"
  command: preview gate
  enabled: true
  state: pending
  last_run_at: 0

- name: reverse_introspection
  description: Every 10th commit, feed MASTER its own last 5 commits and ask whether it approves them.
  trigger: event
  on: "git:commit"
  every: 10
  command: audit introspect
  enabled: true
  state: pending
  last_run_at: 0

- name: test_generation
  description: When a scan rule definition changes, auto-generate test cases proving it fires and passes correctly.
  trigger: event
  on: "tool:after"
  filter: "judge/scan/rules/"
  command: test generate rules
  enabled: true
  state: pending
  last_run_at: 0

- name: rails_stack_audit
  description: Audit Rails apps for the StimulusReflex stack. Run via /audit rails.
  trigger: manual
  command: scan rails_stack
  enabled: false
  state: pending
  last_run_at: 0

- name: openbsd_man_page_first
  description: Read the OpenBSD man page for any command, tool, or service before using it. OpenBSD tools differ from Linux equivalents in flags, config syntax, and behavior.
  trigger: manual
  command: man {tool}
  enabled: true
  state: pending
  last_run_at: 0

- name: zsh_ruby_only
  description: All shell scripting must use zsh or Ruby. Bash, Python, and Perl are banned everywhere — scripts, one-liners, deploy files, and tool output.
  trigger: pre_tool
  on: "Write|Edit|FilePatch"
  command: lint shell_language {target_file}
  enabled: true
  state: pending
  last_run_at: 0
