# config_status: aspirational  # spec exists, runtime wiring pending
# Web routes for the live canvas surface. Read by the Rails app at boot.
# Source: openclaw + #87.
routes:
  - path: "/canvas"
    controller: canvas
    action: show
  - path: "/canvas/stream"
    controller: canvas
    action: stream     # SSE
  - path: "/canvas/event"
    controller: canvas
    action: post_event # used by EventBus relay
