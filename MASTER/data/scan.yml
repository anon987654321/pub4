scan_profiles:
  default: full
  core:
    laws: core
    aliases:
    - quick
    description: Core axiom and small-function findings after a deep scan
  full:
    laws: '*'
    aliases:
    - all
    description: All registered scan Laws
  axioms_only:
    laws: axioms
    aliases:
    - axioms
    description: Constitutional Laws only
  solid_focus:
    laws: solid_focus
    aliases:
    - solid
    description: SOLID Laws plus constitutional Laws
  critical:
    laws: '*'
    severity:
    - error
    - veto
    description: Only error and veto findings for urgent triage
  solid:
    laws: solid_focus
    description: SOLID Law focus
  axioms:
    laws: axioms
    description: Constitutional axioms only
  cosmetic:
    laws: cosmetic
    aliases:
    - style
    - hygiene
    - perfection
    description: Hygiene, micro-typography, naming, and style-perfection lint
  aesthetic:
    laws: aesthetic
    aliases:
    - pixel
    - ui
    - ux
    - design
    description: Pixel-perfect UI/UX, typography, flat design, Fitts/Hick, Rams tags
  rails:
    laws: '*'
    aliases: []
    description: Full deep scan intended for RAILS app trees (use path RAILS/<app>)

scan_workers: 6

session_modes:
  default: strict
  env: MASTER_MODE
  modes:
    loose:
      scan_profile: cosmetic
      council: false
      autofix_llm: false
      autofix_mechanical: true
      semantic_sample: 0
      max_fix_passes: 3
      description: Hygiene and style only; no LLM fix loop
    balanced:
      scan_profile: full
      council: risky
      autofix_llm: true
      autofix_mechanical: true
      semantic_sample: 0
      max_fix_passes: 8
      description: Sampled scan/fix; council on multi-file/security
    strict:
      scan_profile: full
      council: true
      autofix_llm: true
      autofix_mechanical: true
      semantic_sample: 0.1
      max_fix_passes: 15
      severity_floor: warning
      description: >-
        Default. Every Law, violations and opportunities; semantic read of every file with a
        finding and a rotating tenth of the rest, the whole tree in ten days; council at the end
