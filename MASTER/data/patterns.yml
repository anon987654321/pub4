# Merged from former violation_priors.yml — Bayesian violation priors (architecture #14).
# prior_p: base probability a random file contains this violation (0.0-1.0).
# language_modifiers: multiplicative adjustments per language (1.0 = neutral).
# FixLoop#ordered_rules uses (prior_p x posterior) as secondary sort key after
# violation_counts. High-probability rules run early; rules that have never
# fired on a given extension are deprioritised. Posterior is updated at
# runtime from observed violation counts; this holds the cold-start priors only.
violation_priors:
  DRY:
    prior_p: 0.60
    language_modifiers: { ruby: 1.2, yaml: 0.8, html: 0.9, css: 1.0, js: 1.1 }
  LINEARITY:
    prior_p: 0.55
