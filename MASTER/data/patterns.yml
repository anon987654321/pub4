    - old: Master::Scan
      new: Master::Judge::Scan
    - old: Master::Council
      new: Master::Judge::Council
    - old: Master::Session
      new: Master::Trace::Session
    - old: Master::Axioms
      new: Master::Ground::Rules

# Merged from former auth_profiles.yml — auth profile lanes (OAuth/CLI before
# API keys, OpenCrabs/OpenClaw pattern).
auth_profiles:
  schema: 1
  lanes:
    - id: claude_cli
      kind: cli
      command: claude
      priority: 1
      models:
        - claude-cli:claude-opus-4-8
    - id: codex_cli
      kind: cli
      command: codex
      priority: 2
      models: []
    - id: copilot_oauth
      kind: oauth
      env_token: GITHUB_COPILOT_TOKEN
      priority: 3
      models: []
    - id: openrouter_api
      kind: api_key
      env: OPENROUTER_API_KEY
      priority: 10
      models: []

# Merged from former cli.yml — operator-tunable CLI pacing, replay, and diagnostic limits.
cli:
  schema: 1
  idle_sleep_seconds: 60
  replay_turns: 5
  dmesg_buffer_lines: 80
  multiline_max_lines: 500
  history_limit: 2000

# Merged from former evidence.yml — runtime evidence policy loaded by Master::Ground::Evidence.
evidence:
  schema: 1
  sources:
    test_pass: { trust: 0.95, verify: "exit_code == 0" }
    static_analysis: { trust: 0.80, verify: "exit_code == 0" }
    scan_clean: { trust: 0.80, verify: "violations.empty?" }
    type_check: { trust: 0.75, verify: "exit_code == 0" }
    doc_link: { trust: 0.60, verify: "status == 200 and claim_present" }
    git_blame: { trust: 0.55, verify: "attributed" }
    user_assertion: { trust: 0.40, verify: "confirmed" }
    llm_consensus: { trust: 0.35, verify: "at least two distinct providers" }
  required_for: [modification, merge, security_fix, schema_change]
  combine:
    model: independent_probabilities
    min_total_trust: 0.75
    require_at_least_one_strong: true
  artifacts_required:
    file_read: [sha256_prefix, byte_count]
    modification: [unified_diff]
    completion: [exit_code, stdout_tail]
  audit:
    log_to: .master/evidence.jsonl
    retention_days: 90

# Merged from former heartbeat.yml — heartbeat jobs, all disabled. Schedule-based
# maintenance removed. These actions are now triggered by events or manual
# slash commands: prune_memory -> /dreams, self_test -> auto_default standing
# order (fires after any source mutation), prune_undo -> manual: /prune undo,
# snapshot -> manual: /snapshot.
heartbeat:
  - name: prune_memory
    action: prune_memory
    enabled: false
    description: Use /dreams instead.
  - name: self_test
    action: self_test
    interval_seconds: 3600
    enabled: true
    description: Periodic MASTER self-scan.
  - name: prune_undo
    action: prune_undo
    enabled: false
    description: Use /prune undo instead.
  - name: snapshot
    action: snapshot
    enabled: false
    description: Use /snapshot instead.

# Merged from former refusal_templates.yml — refusal scaffolding when MASTER
# cannot or should not act. Source: OpenAI / Anthropic system-prompt
# reunification (#74). Loaded by PersonalityPromptBuilder#add_refusal_policy.
refusal_templates:
  capability_disclosure:
    no_internet_yet: "MASTER reads local data and runs local tools; no live web access in this turn"
    no_secret_creation: "MASTER does not generate secrets; bring your own and rotate via signify"
    no_silent_destruction: "MASTER will not run irreversible commands without explicit user confirmation"
  refusal_phrasing:
    style: "decline once, propose alternative once, stop"
    forbidden: ["I'm sorry but I cannot", "as an AI", "I'd be happy to", filler_apology]
    example_good: "Out of scope: production push during freeze. Alternative: branch-only commit, deploy after Friday."

# Merged from former vocabulary.yml — sacred user-spoken terms. Historical intent
# was for scan rules and rename tooling to refuse rewriting these, but no code
# ever actually enforced that; kept as reference documentation of naming
# conventions actively used across the codebase, not as an enforced policy.
# Add a term only when the user has named it explicitly and consistently.
vocabulary:
  sacred_terms:
    - soul        # data/soul.yml + SOUL.md — constitutional schema
    - tribunal    # user's word for /review; code says "council"
    - council     # canonical code path for tribunal
    - fix         # /fix, FixLoop
    - scan        # /scan, Scanner
    - sweep       # legacy alias for fix; do not rename
    - master      # the agent name
    - axiom       # immutable principle
    - persona     # council member identity
    - heartbeat   # the idle pulse
    - propose     # propose-tree
  rename_policy: "Never rewrite, alias, or wrap a sacred_term. If a refactor needs a new file, build alongside; the sacred name stays anchored to its original symbol."
  synonyms:
    tribunal: council
    sweep: fix
