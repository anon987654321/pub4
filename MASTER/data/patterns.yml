      - cheap
      - fast
      - local
      - browser_local
      council: optional
    medium:
      examples:
      - docs
      - config
      - preview-gated browser modules
      allowed_models:
      - default
      - fast
      - strong
      council: targeted
    high:
      examples:
      - file mutation
      - autonomous actions
      - auth
      - security
      - production runtime
      allowed_models:
