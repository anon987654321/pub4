# Transcendent TTS — emotion-aware multi-engine orchestration.
# Research lineage: Chatterbox (paralinguistics), mlx-audio (Apple SOTA),
# CosyVoice/IndexTTS2 (emotion), DiffSinger/CoMelSinger (melodic contours).
transcendent:
  enabled: true
  default_mode: transcendent
  personality: warm_erratic
  engine_chain: mlx,chatterbox,edge_melodic,edge,say
  emotion_enabled: true
  melodic_enabled: true
  melodic_threshold: 0.45
  max_chars: 900
  mlx_model: mlx-community/chatterbox-fp16
  mlx_voice: default
  exaggeration: 0.62
  cfg_weight: 0.42
  chatterbox_device: mps
  reference_clip: ""