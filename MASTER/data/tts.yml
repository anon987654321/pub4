# Transcendent TTS — emotion-aware multi-engine orchestration (MLX / Replicate).
#
# THIS FILE DECIDES HOW MASTER SOUNDS ON THE COMMAND LINE. Transcendent.load_config
# reads it, `enabled` and `default_mode` are what Speech.synthesis_mode consults,
# and Speech.synthesize hands the text to Transcendent.synthesize whenever that
# mode comes back "transcendent" -- which is what `default_mode: transcendent`
# below asks for. The path is Cli::Session::ResultDisplay -> Voice::Playback.speak
# -> Playback.synthesize -> Speech.synthesize, so it runs on every spoken reply.
# bin/tts-speak takes the same door directly, exporting MASTER_TTS_MODE=transcendent.
#
# The web half does not: health_controller, tts_controller and TtsJob all enter
# through synthesize_streaming_to_file, which goes socket -> oneshot -> espeak and
# never reaches Transcendent. MASTER/DECISIONS.md records why it is not simply
# wired up. On OpenBSD, enabled alone forces transcendent mode and `engine_chain`
# here is overridden by MASTER_TTS_ENGINE_CHAIN or Engines::OPENBSD_CHAIN, so the
# chain below is the Mac's.
#
# The header this replaces said "NOTHING RUNNING READS THIS ... every key below,
# the engine chain included, is inert", from a caller trace that stopped one frame
# short of Playback. It was wrong in the direction that costs most: a reader was
# told the file governs nothing, over the subsystem that speaks. Corrected
# 2026-09-06 by tracing each caller. An older line above it claimed
# "OPENBSD/etc/rc.d/master sets MASTER_TTS_MODE=classic", and rc.d sets no such
# thing; the variable is read at speech.rb's synthesis_mode and offered,
# commented out, in OPENBSD/etc/master.env.sample.
transcendent:
  enabled: true
  default_mode: transcendent
  personality: warm_erratic
  # mlx needs Python 3.10+ (brew install python@3.11). Until then: fast Edge voices.
  engine_chain: replicate_kokoro, edge_melodic, edge, say
  emotion_enabled: true
  # The pentatonic contour: a stylistic mode, for lyrical text only.
  melodic_enabled: true
  melodic_threshold: 0.28
  # Phrase segmentation and the rests between phrases, without the contour.
  # Separate from melodic_* because it is rhythm rather than style. Costs one
  # Edge round trip per phrase, capped at Melody::MAX_PHRASES; false restores a
  # single call at one rate and one pitch.
  phrase_rhythm_enabled: true
  # Read a Norwegian clause with a Norwegian voice. Off: data/voice.yml sets
  # single_voice: osman and persona_affects_text_only: true, and this is the one
  # thing that contradicts it. See MASTER/DECISIONS.md.
  phrase_language_switching: false
  phrase_language_voices:
    nb: finn
    en: ~
  max_chars: 900
  # Local MLX (Apple Silicon)
  mlx_model: mlx-community/Kokoro-82M-bf16
  mlx_voice: af_bella
  mlx_speed: 1.18
  exaggeration: 0.62
  cfg_weight: 0.42
  chatterbox_device: mps
  reference_clip: ""
  # Replicate cloud (VPS / OpenBSD primary)
  replicate_model: jaaari/kokoro-82m
  replicate_voice: af_bella
  replicate_speed: 1.18
  replicate_exaggeration: 0.62
  replicate_cfg_weight: 0.42
  # Cost/speed note: ~$0.008-0.015 per 1K chars; superior consistency on server vs local MLX
