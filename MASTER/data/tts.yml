# Transcendent TTS — emotion-aware multi-engine orchestration.
transcendent:
  enabled: true
  default_mode: transcendent
  personality: warm_erratic
  # VPS: replicate_kokoro when REPLICATE_API_TOKEN set. Workstation: mlx if Python 3.10+.
  engine_chain: replicate_kokoro,edge_melodic,edge,mlx,say
  replicate_model: jaaari/kokoro-82m
  replicate_voice: af_bella
  replicate_speed: 1.18
  emotion_enabled: true
  melodic_enabled: true
  melodic_threshold: 0.28
  max_chars: 900
  mlx_model: mlx-community/Kokoro-82M-bf16
  mlx_voice: af_bella
  mlx_speed: 1.18
  exaggeration: 0.62
  cfg_weight: 0.42
  chatterbox_device: mps
  reference_clip: ""