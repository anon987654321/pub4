engineering_balance:
  overengineered:
    - item: generic_web_placeholder_slots
      action: consolidated — 146 placeholder rows removed; micro_interactions.yml is canonical
    - item: visual_bridge_EVENT_MAP_dupe
      action: transitional; registry classifyEvent is canonical path
    - item: face_part_monolith_blobs
      action: modules absorb incrementally; do not split further until hot paths stable
  underengineered:
    - item: face3d_blendshape_migration
      action: canonical render — 2D phosphor pixels on invisible 3D topology; WebGL face retired
    - item: tts_true_streaming
      action: partial bytes shipped; full MSE playback deferred
    - item: release_gate_local_ruby
      action: run via bundle exec ruby34 on VPS; Mac system Ruby 2.6 is not authoritative
  brutalist_opportunities:
    cli:
      - MASTER_BRUTALIST=1 boot banner exposes H/C/mode dmesg lines
      - step transitions zero easing in brutalist profile
    web:
      - brutalist-strip pre exposes entropy confidence mode
      - square borders zero radius monospace labels
      - dmesg as primary error surface not modals
    face3d:
      - lower phosphor decay harsher dither steps
      - expose lit_pixels and blend targets in dev panel