    why: >
      Planning document, 222 KB, written against values rather than tokens
      throughout. Naming the token in each mention is worth doing when the file
      is split by owner (wishlist: no single document holds half the repo's
      prose). Until then this is one entry rather than a hundred edits to a file
      that is being restructured anyway.
  - value: 6px
