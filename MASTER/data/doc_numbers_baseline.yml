# Dimensional values written in prose without naming the token that owns them,
# tolerated with a reason. MASTER/test/test_doc_numbers.rb fails on anything not
# listed, and fails again when an entry stops being untraceable.
#
# The list only shrinks. A number here is a number two files can disagree about.

"RAILS/UI_REFINEMENTS.md":
  - value: 44px
    why: >
      A record of refinements already made. Rewriting a historical note to name
      today's token would change what the record says happened. Permanent
      exemption while the file stays a changelog; if it becomes prescriptive,
      the numbers come out.

"RAILS/shared/reference/affiliate_banner/README.md":
  - value: 44px
    why: >
      Not prescribed — criticised. The line reads "Comic Sans MS at 44px,
      against a two-family type rule", in a list of what is wrong with a
      third-party reference banner we chose not to copy. Naming --tap-min here
      would say the opposite of what the sentence says, and there is no token
      that owns a font size we rejected. Permanent while the file stays a
      critique; if it ever prescribes anything, the numbers come out.
