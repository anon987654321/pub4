  - value: 10px
    why: Same as 44px — luxury.radius_md restated in a planning note.
  - value: 14px
    why: Same as 44px — luxury.radius_lg restated in a planning note.
  - value: 1265px
    why: >
      Same as 44px, and the sharpest case: social.layout_max is a layout
      constant that exists in exactly one other place. Two files carrying 1265px
