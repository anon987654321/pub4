# Decision-proposal biases, read by Ground::BiasGuard when annotating self-improvement
# proposals. Distinct from rules.yml's biases: section (output-text scanning,
# hallucination/sycophancy/simulation) — same word, two different pipeline stages.
confirmation_bias:
  countermeasure: "Generate three counter-arguments before accepting a fix that only confirms the scanner result."
sunk_cost_bias:
  countermeasure: "Compare the current path against a simpler rollback or rewrite before investing more effort."
authority_bias:
  countermeasure: "Treat named tools and models as fallible; require local evidence before accepting their output."
recency_bias:
  countermeasure: "Prioritize severity x frequency x age, not most-recent findings alone."
