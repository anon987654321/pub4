#Strunk & White filter applied to LLM responses# Preambles to strip
preambles:
  - "I'd be happy to help"
  - "Great question"
  - "Certainly"
  - "Of course"
  - "Sure"
  - "Sure thing"
  - "I understand your question"
  - "That's a great question"
  - "That's an excellent question"

# Hedging phrases replacement
hedges:
  - pattern: "I think "
    replace: ""
  - pattern: "I believe "
    replace: ""
  - pattern: "In my opinion, "
    replace: ""
  - pattern: "It's worth noting that "
    replace: ""
  - pattern: "It is worth noting that "
    replace: ""
  - pattern: "It's important to note that "
    replace: ""
  - pattern: "It is important to note that "
    replace: ""
  - pattern: "Please note that "
    replace: ""
  - pattern: "Note that "
    replace: ""
  - pattern: "Keep in mind that "
    replace: ""
  - pattern: "It should be noted that "
    replace: ""
  - pattern: "As you may know, "
    replace: ""
  - pattern: "As you probably know, "
    replace: ""
  - pattern: "you can simply "
    replace: "you can "
  - pattern: "you can easily "
    replace: "you can "
  - pattern: "simply use "
    replace: "use "
  - pattern: "just use "
    replace: "use "
  - pattern: "feel free to "
    replace: ""

# Endings to stripendings:
  - "I hope this helps"
  - "Let me know if you have any questions"
  - "Let me know if you need anything else"
  - "Feel free to ask if you need more help"
  - "Is there anything else I can help you with"
  - "Is there anything else you'd like to know"
  - "Do you have any other questions"

# Code‑block preambles
code_preambles:
  - "Here is the updated"
  - "Here's the updated"
  - "Here is the full"
  - "Here's the full"
  - "Here is the complete"
  - "Here's the complete"
  - "Below is the"
  - "The following code"
  - "Here is the code"
  - "Here's the code"
  - "I have updated"
  - "I've updated"
  - "I have added"
  - "I've added"
  - "I have made the following changes"
  - "I've made the following changes"