defaults:
  safe_mode: true
  max_active_loops: 1
  loop_cooldown_seconds: 30

loops:
  autofix:
    env: MASTER_AUTOFIX
    max_run_seconds: 1800
    min_sleep_seconds: 300
  watch:
    env: MASTER_WATCH
    max_run_seconds: 900
    min_sleep_seconds: 1
  watcher:
    env: MASTER_WATCHER
    max_run_seconds: 0
    min_sleep_seconds: 30
  heartbeat:
    env: MASTER_BACKGROUND
    max_run_seconds: 120
    min_sleep_seconds: 60

load:
  load_avg_1m:
    warn: 1.5
    crit: 2.5
  master_rss_mb:
    warn: 512
    crit: 768
