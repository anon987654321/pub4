    - *deepseek_chat
    - *gemini_pro
    - *mistral_large
    - *claude_sonnet
    - *gpt_4o
    - *gemini_flash
    - *command_r_plus
  cheap:
    - *gemini_flash
    - *mistral_small
    - *llama_70b
    - *qwen_coder
    - *gemma_2_9b_free
    - *gemini_flash_lite
    - *yi_lightning
  fast:
    - *groq_llama_3_3_70b
    - *cerebras_llama_3_1_8b
    - *gemini_flash_lite
    - *gemini_2_flash_exp_free
  free:
