# Model routing profile — tool-capable models only.
# MASTER requires function calling. Non-tool models are banned.

routing:
  enabled: true
  strategy: weighted
  escalation_enabled: true
  escalation_tier: strong

weights:
  quality: 0.50
  speed: 0.25
  cost: 0.25

fallback_policy:
  retries_per_tier: 1
  on:
    - timeout
    - network_error
    - refusal

models:
  # Default — Claude Sonnet via OpenRouter. Tool-capable, excellent at code.
  default:
    - id: anthropic/claude-sonnet-4-5
      score: { quality: 0.97, speed: 0.80, cost: 0.50 }

  # Strong — for architecture, review, complex generation
  strong:
    - id: anthropic/claude-sonnet-4-5
      score: { quality: 0.97, speed: 0.80, cost: 0.50 }
    - id: openai/gpt-4o
      score: { quality: 0.90, speed: 0.82, cost: 0.45 }
    - id: google/gemini-2.5-pro
      score: { quality: 0.93, speed: 0.75, cost: 0.40 }

  # Fast — for summarization, short tasks; still tool-capable
  fast:
    - id: anthropic/claude-haiku-4-5
      score: { quality: 0.82, speed: 0.95, cost: 0.80 }
    - id: google/gemini-2.5-flash
      score: { quality: 0.79, speed: 0.95, cost: 0.85 }
    - id: openai/gpt-4o-mini
      score: { quality: 0.78, speed: 0.93, cost: 0.82 }

  # Free fallback — DeepSeek-R1 supports tools, available free on OpenRouter
  free:
    - id: deepseek/deepseek-r1:free
      score: { quality: 0.85, speed: 0.70, cost: 1.00 }
    - id: deepseek/deepseek-chat:free
      score: { quality: 0.80, speed: 0.75, cost: 1.00 }

routes:
  code_generation:  strong
  architecture:     strong
  review:           strong
  summarization:    fast
  exploration:      fast
  fallback_default: default
