# Model routing profile — OpenRouter primary, Replicate optional.
# OpenRouter free tier: meta-llama/llama-3.3-70b-instruct:free (8 req/min)
# Replicate: disabled (insufficient credit as of 2026-03-20)

routing:
  enabled: true
  strategy: weighted
  escalation_enabled: true
  escalation_tier: strong
  provider: openrouter

weights:
  quality: 0.50
  speed: 0.25
  cost: 0.25

fallback_policy:
  retries_per_tier: 1
  on:
    - timeout
    - network_error
    - refusal

models:
  default:
    - id: meta-llama/llama-3.3-70b-instruct:free
      score: { quality: 0.82, speed: 0.85, cost: 1.0 }

  strong:
    - id: anthropic/claude-sonnet-4-5
      score: { quality: 0.95, speed: 0.75, cost: 0.60 }
    - id: openai/gpt-4o
      score: { quality: 0.93, speed: 0.80, cost: 0.55 }
    - id: meta-llama/llama-3.3-70b-instruct:free
      score: { quality: 0.82, speed: 0.85, cost: 1.0 }

  cheap:
    - id: meta-llama/llama-3.3-70b-instruct:free
      score: { quality: 0.82, speed: 0.85, cost: 1.0 }
    - id: google/gemini-flash-1.5-8b
      score: { quality: 0.75, speed: 0.90, cost: 0.95 }

routes:
  code_generation:    default
  refactoring:        default
  architecture:       strong
  review:             default
  explanation:        cheap
  exploration:        cheap
  fallback_default:   cheap
