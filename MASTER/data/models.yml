# Model routing profile — Grok primary (API or keyless browser), OpenRouter free fallback.

schema: 1
routing:
  enabled: true
  strategy: weighted
  escalation_enabled: true
  escalation_tier: strong
  provider: agy

weights: &weights
  quality: 0.50
  speed: 0.25
  cost: 0.25

fallback_policy:
  # Error categories that stop retrying a model and move to the next one, read by
  # ModelRouter#failover_skip_categories.
  #
  # Three things were wrong with this block and all three are why it did nothing.
  # The key was written bare as `on:`, which YAML 1.1 parses as the boolean true —
  # `fallback_policy["on"]` was nil and `fallback_policy[true]` held the list. It
  # had no reader at all. And its vocabulary was invented: `network_error`,
  # `refusal`, `insufficient_balance` and `quota_exceeded` are not Result
  # categories this codebase produces, so wiring it as written would have matched
  # nothing. These five are the categories `Result.err(category:)` actually
  # carries.
  #
  # A rate-limited or out-of-budget model cannot succeed on an immediate retry, so
  # both belong here. `provider_error` deliberately does not: a transient 5xx is
  # what in-place retry exists for. `retries_per_tier` was removed — the retry
  # count has one source, `failover.max_retries` below.
  "on":
    - timeout
    - no_api_key
    - rate_limit
    - budget

failover:
  sequence: [fast, default, medium, strong]
  cooldown_seconds: 300
  cooldown_tiers: [30, 60, 300]
  skip_ttl_ms: 600000
  max_retries: 2

