# Model routing profile — Replicate-native + tool-capable models.
# All models routed through Bridges::Replicate when REPLICATE_API_KEY is set.

routing:
  enabled: true
  strategy: weighted
  escalation_enabled: true
  escalation_tier: strong
  provider: replicate

weights:
  quality: 0.50
  speed: 0.25
  cost: 0.25

fallback_policy:
  retries_per_tier: 1
  on:
    - timeout
    - network_error
    - refusal

models:
  # Default — DeepSeek-R1 (reasoning + code, best on Replicate for coding tasks)
  default:
    - id: deepseek-ai/deepseek-r1
      score: { quality: 0.93, speed: 0.72, cost: 0.80 }

  # Strong — best reasoning/architecture work
  strong:
    - id: deepseek-ai/deepseek-r1
      score: { quality: 0.93, speed: 0.72, cost: 0.80 }
    - id: openai/gpt-4o
      score: { quality: 0.90, speed: 0.80, cost: 0.55 }
    - id: meta/meta-llama-3.1-405b-instruct
      score: { quality: 0.88, speed: 0.65, cost: 0.60 }

  # Fast — lower cost, still capable
  fast:
    - id: deepseek-ai/deepseek-v3
      score: { quality: 0.87, speed: 0.80, cost: 0.90 }
    - id: openai/o4-mini
      score: { quality: 0.82, speed: 0.88, cost: 0.85 }
    - id: mistralai/mistral-large-2
      score: { quality: 0.84, speed: 0.82, cost: 0.82 }
    - id: meta/meta-llama-3-70b-instruct
      score: { quality: 0.80, speed: 0.85, cost: 0.90 }

routes:
  code_generation:  strong
  architecture:     strong
  review:           strong
  summarization:    fast
  exploration:      fast
  fallback_default: default
