# Model routing profile — OpenRouter primary, Replicate optional.
# Free tier: meta-llama/llama-3.3-70b-instruct primary, qwen/qwen3-coder fallback.
# stepfun/step-3.5-flash removed: endpoint not found on OpenRouter.
# Replicate: disabled (insufficient credit as of 2026-03-20)

routing:
  enabled: true
  strategy: weighted
  escalation_enabled: true
  escalation_tier: strong
  provider: openrouter

weights:
  quality: 0.50
  speed: 0.25
  cost: 0.25

fallback_policy:
  retries_per_tier: 1
  on:
    - timeout
    - network_error
    - refusal

models:
  default:
    - id: meta-llama/llama-3.3-70b-instruct:free
      score: { quality: 0.78, speed: 0.70, cost: 1.0 }
    - id: qwen/qwen3-coder:free
      score: { quality: 0.75, speed: 0.65, cost: 1.0 }
    - id: deepseek/deepseek-r1-0528:free
      score: { quality: 0.73, speed: 0.55, cost: 1.0 }

  strong:
    - id: anthropic/claude-sonnet-4-6
      score: { quality: 0.95, speed: 0.75, cost: 0.60 }
    - id: openai/gpt-4o
      score: { quality: 0.93, speed: 0.80, cost: 0.55 }
    - id: nvidia/nemotron-3-super-120b-a12b:free
      score: { quality: 0.90, speed: 0.75, cost: 1.0 }

  cheap:
    - id: meta-llama/llama-3.3-70b-instruct:free
      score: { quality: 0.78, speed: 0.70, cost: 1.0 }
    - id: qwen/qwen3-coder:free
      score: { quality: 0.75, speed: 0.65, cost: 1.0 }
    - id: openai/gpt-oss-120b:free
      score: { quality: 0.72, speed: 0.60, cost: 1.0 }

routes:
  code_generation:    default
  refactoring:        default
  architecture:       strong
  review:             default
  explanation:        cheap
  exploration:        cheap
  fallback_default:   cheap
