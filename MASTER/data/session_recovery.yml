# Session recovery spec — resumable long-running tasks.
# Source: master.json v225 reunification.
# Files matching this schema live at ROOT/.session_recovery (gitignored).

schema:
  version: 1
  metadata:
    task_description: string
    started_at:       iso8601
    last_checkpoint:  iso8601
  files:
    completed:    [{path: string, operations: array, sha256: string}]
    in_progress: [{path: string, checkpoint: "line_N | section_X"}]
    pending:     [{path: string, priority: "low | normal | high"}]
    failed:      [{path: string, error: string, attempts: integer}]
  context:
    key_decisions:    array
    patterns_applied: array
    blockers:         array
    env_variables:    map

policies:
  write_after:        "every_file"        # checkpoint cadence
  keep_history:       3                    # rotated archives
  archive_on_complete: true
  abandon_after_days: 14
