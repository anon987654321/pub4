    source: DRY — The Pragmatic Programmer (Hunt & Thomas, 1999)
    name: Don't Repeat Yourself
    tier: principle
    severity: warning
    autofix: true
    violates_law: SINGULARITY
    # No `duplicate_code` alias: it is a live learned smell with its own findings,
    # so claiming it here made a lookup ambiguous. An alias is a retired id — the
    # four KISS carries below are the shape — and one naming a rule that still
    # exists is a fold nobody finished. See the note above the smell.
    tension: DRY conflicts with WET/AHA — singularity wins for data, DRY wins for code.
  - id: KISS
    source: KISS — Keep It Simple (Kelly Johnson, U.S. Navy 1960)
    name: Keep It Simple
    tier: principle
    severity: warning
    autofix: true
