    surface: "#ffffff"
    surface_elevated: "#ffffff"
    search_bg: "#ffffff"
    text: "#333333"
    text_secondary: "#4d4d4d"
    border: "#666666"
    hover: "rgba(26, 24, 36, 0.1)"
    hover_subtle: "rgba(26, 24, 36, 0.03)"
    accent: "#000000"
    accent_hover: "#4a3fb0"
    danger: "#a9483c"
  # brgen vertical accent map (single source — mirrored in $vertical-accents in brgen's application.scss)
  #
  # Every accent below was tuned to be legible AS INK on a light surface, which
  # makes all seven too light to carry light ink themselves: against --bg
  # (#f7f6fa) they measure 1.77–3.46:1. Anything painting on one of these uses
  # --accent-ink, not --bg. The ink's value lives in $vertical-accent-ink in
  # brgen's application.scss, which is where it is measured. When adding a
  # vertical, check every
  # column, not just the one you need — the `hover` column is the one that has
  # been missed twice.
  vertical_accents:
    marketplace: { accent: "#98876e", hover: "#8d7e66", light: "#98876e" }
    tv: { accent: "#dc635c", hover: "#b83a33", light: "#dc635c" }
    dating: { accent: "#00d4aa", hover: "#00b391", light: "#009579" }
    takeaway: { accent: "#e07b39", hover: "#c26a30", light: "#c26a30" }
    playlist: { accent: "#12b6c4", hover: "#0f9aa6", light: "#0e8a94" }
    maps: { accent: "#5b8fd4", hover: "#4a7ab8", light: "#5585c5" }
    messenger: { accent: "#6b7fd7", hover: "#5566c4", light: "#6b7fd7" }
  vertical_accent_ink: "#110f19"
  # The rhythm scale. Every spacing, radius, line-height and weight literal in the
  # family's stylesheets must land on a step below, or on a token that resolves to
  # one. Operator::ScaleLint reads this; scale_lint_test.rb ratchets the findings.
  #
  # This is the same argument `viewport:` above makes, applied to the axis it says
  # is already single-sourced and is not. Colour, motion, elevation and the dialect
  # maps are single-sourced. Rhythm was never measured, and on 2026-08-15 it
  # measured 539 spacing literals over 93 distinct values, and 13 distinct
  # line-heights for what is one body-text rhythm.
  #
  # NOT CSS custom properties, and mostly cannot be: `padding: 0.35rem` is a
  # literal an author typed, and no variable exists that would have stopped them.
  # Like `viewport:`, this is a declared set that a lint asserts the sheets obey,
  # not a variable the sheets consume.
  scale:
    space_px: [0, 1, 2, 3, 4, 8, 12, 16, 20, 24, 28, 32, 36, 40, 44, 48, 56, 64, 72, 80, 96, 128]
    letter_spacing_em: [-0.03, -0.02, -0.01, 0, 0.05, 0.08, 0.14]
    line_height: [1, 1.25, 1.4, 1.5, 1.6]
    radius_px: [0, 2, 4, 8, 12, 16]
    font_weight: [400, 500, 600, 700, 800]
    opacity: [0.03, 0.05, 0.08, 0.1, 0.12, 0.2, 0.4, 0.6, 0.8]
    duration_ms: [180, 300]
    baselines:
      apps:
        off_scale_space: 7
        off_scale_line_height: 2
        absolute_line_height: 0
        off_scale_radius: 0
        off_scale_font_weight: 0
        off_scale_tracking: 0
        off_scale_opacity: 27
        off_scale_duration: 20
      face:
        off_scale_space: 9
        off_scale_radius: 0
        off_scale_line_height: 0
        absolute_line_height: 0
        off_scale_font_weight: 0
        off_scale_tracking: 10
        off_scale_opacity: 29
        off_scale_duration: 30

engineering_fit:
  classify: 'For every problem, decide: under-engineered, over-engineered, or perfectly
    engineered — and say why.'
  under: Misses real failure modes the artifact will hit. Add only what the artifact
    actually carries.
  over: Carries machinery the artifact will never load. Strip it; defer until the
    load shows up.
  fit: Solution matches the load and the failure modes — no slack, no shortfall.
  why_required: State the load the artifact carries (users, edge cases, lifetimes,
    blast radius). The verdict follows from the load.
# Conduct rules: how to work. These are not lexical detectors but behavioral mandates.
conduct:
  HOSTILE_AUDIT:
    priority: 1
    principle: self_apply
    mandate: "Systematically interrogate every project rule/law. Accuse self of violation, propose multiple remediations, cherry-pick the robust solution, and commit. No filler."
    trigger: "significant_change, architectural_shift, or explicit request"
  NO_FILLER:
    priority: 2
    principle: anti_simulation
    mandate: "Conversational filler ('Got it', 'Sure', 'I will now...') is simulation noise. Lead immediately with the action or the result."
    trigger: "every_reply"
beauty:
  typography_bringhurst:
  - choose_appropriate_typeface_for_function
  - set_text_in_sizes_that_suit_its_nature
  - use_vertical_motion_that_suits_typeface
  - rhythm_proportion_modulation_harmony
  architecture_ando:
  - simplicity_silence_emptiness
  - light_shadow_materiality
  - geometry_nature_coexistence
  - space_between_as_important_as_form
  design_rams:
  - innovative_useful_aesthetic
  - unobtrusive_honest_long_lasting
  - thorough_environmentally_friendly
  - as_little_design_as_possible
  code_martin:
  - meaningful_names_intention_revealing
  - functions_do_one_thing_small
  - comments_explain_why_not_what
  - error_handling_separate_from_logic
  zen_japanese:
    wabi_sabi: imperfect_authentic
    ma: emptiness_pause
    kanso: eliminate_essence
self_test:
  laws_apply_to_self:
    ROBUSTNESS: scan lib/ for bare_rescue + missing timeouts
    SINGULARITY: rules.yml entries unique by id; no two YAMLs define same key
    LINEARITY: no nesting_depth > 4 in lib/
    PROXIMITY: test files within 1 directory of source
    ABSTRACTION: no class > god_class threshold in lib/
    DENSITY: no method > long_method threshold in lib/
    KERNEL_ADHERENCE: infra_helpers.rb wiring layer present; rule adherence >= 35%
    PRINCIPLE_MAP: every rule id named by data/principle_map.yml resolves to a registered
      rule, and every covered principle names at least one. The reverse direction —
      every registered rule traced by some principle — is `rake lint:principle_trace`,
      a ratcheting ceiling, because it has never been zero.
  fail_action: publish self_violation event; refuse autoloop fixes that don't restore
    the law
veto_patterns:
  secrets:
    detect: sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|-----BEGIN.*KEY-----
    apply: move_to_env
    violates_law: ROBUSTNESS
  sql_injection:
    # Was `execute|query.*#\{`. The alternation binds as `(execute)|(query.*#\{)`,
    # so the bare word `execute` anywhere on a line was an unconditional merge
    # blocker. 87 findings in lib/, every one read and classified, 0 real:
    #
    #   `def execute_resync`, `execute_job`, `pre_execute?`, `phase: "post_execute"`
    #   `@db.execute(sql, [args])` — the parameterized form this rule prescribes
    #   `@db.execute(<<~SQL, args)` — likewise, via heredoc
    #   `"context: gathering for query=#{query[0, 60]}"` — a log line
    #   `# Unsafe shell never executes.` — a comment
    #
    # The one candidate that looked real was `WHERE #{where.join(" AND ")}` in
    # ground/knowledge_store/feedback_events.rb. Checked: provider_errors_query
    # builds `where` from the literals "event_type = ?" and "dimension = ?" and
    # puts every value in `args`. Parameterized. Also a false positive.
    #
    # Now: execute/query called with a quoted string that carries an
    # interpolation. Backreferenced quoting, `(["'])(?:(?!\1).)*`, so that
    # `query("... name='#{name}'")` — a single quote inside a double-quoted SQL
    # string, which is the classic injection shape — is not skipped.
    #
    # KNOWN GAP, and it is the important one: this cannot see interpolation
    # inside a heredoc, because scan_lines is per line and the `<<~SQL` line
    # carries no `#{`. Catching SQL built across lines needs an AST rule, not a
    # lexical veto. Tracked in TODO.md rather than pretended away here.
    detect: (?:execute|query)\w*\s*\(\s*(["'])(?:(?!\1).)*#\{
    apply: parameterize
    violates_law: ROBUSTNESS
  unfinished:
    # Was "\\.\\.\\.|TODO|FIXME|pending", which fired 119 times in lib/ and was
    # wrong 119 times. Measured 2026-08-12, every finding read and classified:
    #
    #   49  the word "pending" — @pending, the "pending" order state in
    #       VALID_STATES, and the substring inside depending / spending
    #   41  an ellipsis in prose or in documented syntax — "\n... [truncated]",
    #       %i[...], for...of, require(...).permit(...)
    #   26  Ruby's exclusive range operator — lines[0...-1], (1...lines.length)
    #    3  the source of the rules that detect TODO/FIXME, quoting it
    #
    # Zero real unfinished work, at :veto — the strongest severity there is.
    # 119 false vetoes do not gate anything; they teach the reader that a veto is
    # noise, which costs more than the rule was ever worth.
    #
    # Narrowed rather than deleted — the intent is right, only the reach was
    # wrong. Three clauses, each doing one thing:
    #
    #   #[^\n]*\b(TODO|FIXME)\b   a marker in a comment, which is what a marker
    #                             is. The last three false vetoes were TODO
    #                             inside the regex literals of the rules that
    #                             detect TODO; none has a `#` before it.
    #   ^\s*\.\.\.\s*$            a stubbed body — `...` alone on its line. This
    #                             is the shape lexical TODO_FIXME does not have,
    #                             and the reason to keep a veto here at all.
    #   (pending removed)         a legitimate order state in this codebase
    #                             (VALID_STATES) and a substring of depending
    #                             and spending. No narrowing rescues a word.
    #
    # The comment clause deliberately does not carry TODO_FIXME's hardcoded
    # `path.include?("/review/scan/rules/")` exemption. Copying an exemption into
    # a second file is how the two drift; being precise about what a marker looks
    # like needs no exemption at all.
    #
    # Pinned in both directions in test/test_scan_rule_false_positives.rb, per
    # that file's own rule: a narrowing has to prove what it still catches.

    # Narrowed a third time, by the same measurement. `\b` holds between the O and
    # the dot, so `TODO.md` — the backlog CLAUDE.md tells every agent to cite — read
    # as a work marker. Every veto it raised across lib/ and law/ was that filename,
    # none was unfinished work, so the rule punished the house rule that sends a
    # reader there. The lookahead sits on the marker rather than on the line, so
    # `# TODO: fix, and see TODO.md` still vetoes on the marker.
    detect: "#[^\\n]*\\b(TODO|FIXME)\\b(?!\\.md)|^\\s*\\.\\.\\.\\s*$"
    # The only veto pattern that means to read comments — a marker lives in one.
    # Every other pattern is about code, and a comment describing shell safety or
    # SQL injection is documentation, not the thing. See VetoPatternRule.
    reads_comments: true
    apply: complete_or_track
    violates_law: ROBUSTNESS
  unsafe_calls:
    # Interpolation is the arbitrary-code-execution risk. `system("cmd", arg, arg)`
    # is the safe arg-array form style.yml prescribes as the FIX for this, so
    # vetoing it too was a contradiction and the source's biggest false positive.
    # Every clause requires a `#{...}` reaching a shell.
    #
    # Narrowed again 2026-08-12, 23 findings in lib/ -> 3, all 20 removed ones
    # read and classified first:
    #
    #    9  a markdown fence inside a Ruby string — "```#{lang}", "```\n#{code}"
    #    6  a markdown code span in prose — "task `#{topic}`", "- `#{path}` (…)"
    #    2  backticks whose content is Shellwords.escape'd, which is the fix
    #    2  Open3 in the arg-array form, which is also the fix
    #    1  "`#{body}`", a string being wrapped in backticks for display
    #
    # Three changes. The backtick clause now needs a SINGLE backtick — `(?<!`)`(?!`)`
    # — which drops every triple-fence; it needs a space inside the backticks, so a
    # bare `#{path}` code span is not a command; and it refuses Shellwords.escape.
    # Open3 now only fires when the FIRST argument is one quoted string holding both
    # a space and an interpolation, which is the shape that reaches a shell — the
    # old `\([^)]*#\{` matched interpolation in any argument of the safe form.
    #
    # The quoted-string clauses use a backreference, `(["'])(?:(?!\1).)*`, instead
    # of `["'][^"']*`. The old class stopped at the first quote of EITHER kind, so
    # `system("rm -rf '#{dir}'")` — a shell string quoting an interpolated path,
    # which is exactly the dangerous case — did not match at all.
    #
    # What survives in lib/, and should: ps with an interpolated $USER
    # (ground/host_budget.rb), a wholly interpolated command
    # (trace/snapshot_collector.rb), and an interpolated interpreter path
    # (voice/engines.rb). Two take their value from ENV.
    detect: (?:system|exec)\s*\(\s*(["'])(?:(?!\1).)*#\{|%x[\{(\[<][^)}\]>]*#\{|(?<!`)`(?!`)(?![^`\n]*Shellwords\.escape)(?=[^`\n]*#\{)[^`\n]*\s[^`\n]*`|Open3\.\w+\s*\(\s*(["'])(?:(?!\2).)*\s(?:(?!\2).)*#\{
    apply: add_safe_nav
    violates_law: ROBUSTNESS
anti_patterns:
  forbidden:
  - pattern: eval\(.*user.*\)
    reason: arbitrary_code_execution
  - pattern: rm -rf /
    reason: data_loss
  - pattern: while true.*no sleep
    reason: resource_exhaustion
  - pattern: system\(.*\$\{
    reason: command_injection
  - pattern: Marshal\.load
    reason: deserialization_rce
  - pattern: open\(.*\$\{
    reason: shell_through_open
  discouraged:
  - pattern: god_object
    reason: violates_solid_srp
  - pattern: premature_optimization
    reason: violates_yagni
  - pattern: defensive_copying_everywhere
    reason: complexity_for_imagined_failure
  - pattern: speculative_generality
    reason: yagni_in_disguise
principle_priorities:
  # tier1/append_only, show_cost, degrade_gracefully and tier2/least_power,
  # open_closed, liskov, interface_segregation, dependency_inversion,
  # test_first, skeleton_first and tier3/user_friendly restored 2026-07-12
  # from data/axioms.jsonl (deleted — superseded by this section) after a
  # gap audit found no equivalent principle recorded anywhere else.
  tier1_critical:
  - evidence: "@assumption -> validate"
  - reversible: "@irreversible -> add_rollback"
  - security: "@untrusted -> validate_sanitize"
  - self_apply: "@output -> must_pass_own_constitution"
  - append_only: "@history_or_audit_log -> never_mutate_append_only"
  - show_cost: "@operation_has_cost -> show_cost_before_execution"
  - degrade_gracefully: "@dependency_unavailable -> degrade_not_break"
  tier2_quality:
  - dry: "@duplication>=3 -> abstract"
  - kiss: "@complexity>10 -> simplify"
  - srp: "@two_reasons_to_change -> split"
  - least_power: "@task_solvable_by_cheap_tool -> use_cheap_before_llm"
  - open_closed: "@behavior_change -> extend_not_modify"
  - liskov: "@subclass -> preserve_parent_contract"
  - interface_segregation: "@fat_interface -> split_by_client"
  - dependency_inversion: "@high_level_module -> depend_on_abstraction"
  - test_first: "@fix_or_feature -> write_failing_test_first"
  - skeleton_first: "@new_feature -> thinnest_working_slice_first"
  tier3_polish:
  - explicit: "@implicit -> make_explicit"
  - minimalism: "@bloat -> subtract"
  - rhythm: "@inconsistent -> align"
  - user_friendly: "@interface_change -> visibility_control_prevention_consistency_recognition"
preserve_user_intent:
  forbidden_changes_during_refactor:
  - public_method_signature
  - error_class_raised
  - return_type_shape
  - side_effects_order
  - log_format_consumed_by_others
  require_explicit_approval_for: behavior_change
ground_truth_check:
  require_fresh_read_before:
  - claim_task_complete
  - council_vote_on_change
  - commit_creation
  cache_max_age_seconds: 5
phantom_recovery:
  detectors:
    gaslighting_preamble: "/^(I('ll| will| can| would)|Let me|Sure,)/i"
    text_repetition_loop: same 60-char span repeats >= 3 times
    xml_tool_call_failure: "<tool> open without close OR malformed JSON in args"
    empty_tool_response: tool returned nil twice in a row
  # Detected and reported, but never counted toward the halt ladder below.
  #
  # Three of the four detectors name a malfunction: output that loops, a tool
  # call that will not parse, a tool that answered nothing twice. Discarding,
  # escalating the model tier and finally halting are all sane answers to those.
  #
  # gaslighting_preamble is not one of them. It is a style rule — soul.yml's
  # anti_simulation, already enforced on the reply itself by voice/output_guard
  # (through cli/stages/render), review/prompt_filter and the personality
  # prompt — and its pattern matches
  # any reply opening "I can", "I would", "Let me" or "Sure,". A model writing
  # ordinary English is working, not malfunctioning, so letting it spend the
  # ladder ends the conversation for a phrasing preference.
  style_only:
  - gaslighting_preamble
  recovery:
  - discard last response, reset context to last successful checkpoint
  - switch model tier (escalate or fall back) on second occurrence
  - publish phantom:detected event, halt loop on third
failure_taxonomy:
  # A paid provider spend limit — out of credit, over quota. No examples key:
  # the pattern is Fix::Constants::EXHAUSTED_RE, because the examples grammar
  # (word_word -> word[ ._-]?word) cannot express the bare HTTP 402 this failure
  # often arrives as. max_retries is 0 because an in-place retry cannot succeed;
  # recovery is Io::QuotaGate re-probing on FailureTaxonomy.backoff_seconds,
  # not a retry count here.
  exhausted:
    strategy: pause_and_reprobe
    max_retries: 0
  transient:
    examples:
    - network_timeout
    - rate_limit
    - temp_file_conflict
    - provider_overload
    strategy: exponential_backoff
    max_retries: 3
  permanent:
    examples:
    - syntax_error
    - missing_dependency
    - permission_denied
    - schema_violation
    strategy: fail_fast
    max_retries: 0
  ambiguous:
    examples:
    - partial_write
    - unknown_error
    - half_committed_state
    strategy: human_intervention
    checkpoint_before: true
# The only evidence model in the repo. Weights sum, a threshold ends the turn,
# and producers say which command can earn each kind -- Master::Core::Proof is
# the Ruby source and a test pins the two together.
evidence_scoring:
  weights:
    test_pass: 35
    scan_clean: 25
    code_review: 20
    log_analysis: 10
    profiling_data: 10
  pass_threshold: 80
  block_threshold: 50
  # What can actually produce each kind of proof. The kind used to be whatever the
  # model wrote in the effect, so exec(["true"], evidence: "test_pass") was worth
  # 35 and four of them ended the turn — the fold graded its own paper. A command
  # that does not run the tests cannot be a passing test run.
  #
  # Unmatched scores nothing rather than blocking the effect: the fold may run what
  # it likes, it just cannot claim credit for it. Mirrors Master::Core::Proof
  # PRODUCERS, which is the Ruby source, and a test pins the two together.
  producers:
    test_pass: 'rake\s+test|rails\s+test|rspec|minitest|bin/(?:ci|check|gate)|ruby\S*\s[^;|]*\btest/'
    scan_clean: 'bin/(?:check|gate|scan)|rubocop|brakeman|bundler-audit|rake\s+(?:lint|audit|scan)'
    code_review: 'bin/(?:review|critique)|rake\s+(?:review|critique)'
    log_analysis: 'journalctl|dmesg|rcctl|/var/log|\.log\b'
    profiling_data: 'benchmark|stackprof|ruby-prof|memory_profiler|--profile'
# The two optional fields a rule or a learned smell may carry, and where they
# land. Both reach Finding.build from semantic_rules.rb and meta_rules.rb, so a
# value written here is visible on the finding. time_horizon and a provenance
# sub-block were declared beside them and read by nothing at all — not by the
# scanner, the council, or a gate — so the schema described three fields and
# governed two.
schema_metadata:
  optional_fields:
    reversibility: free | cheap | surgical | impossible
    blast_radius: 'files_touched: integer'
paths:
  skip_dirs:
  - ".git"
  - vendor
  - tmp
  - var
  - node_modules
  - ".bundle"
  - coverage
  - log
  - dist
  - knowledge
  - three_build
  tree:
    max_depth: 2
    max_lines: 200
  # Paths the agent may never write or stage. The constitution it is judged by
  # and the spine that folds its effects must not be rewritable by an effect.
  # Prefix match; a trailing "/" marks a directory subtree.
  immutable:
  - data/rules.yml
  - data/soul.yml
  # Both entries, not just the directory: the fold spine moved to lib/core/ on
  # 2026-08-12 and its entrypoint is lib/core.rb, which holds VERBS, Effect and
  # Secret. A `lib/core/` entry alone would leave the closed verb set writable
  # by an effect — the exact rewrite this rule exists to block.
  - lib/core.rb
  - lib/core/
thresholds:
  class:
    max_methods: 6
    max_lines: 200
  convergence:
    consecutive_clean_runs_required: 2
    max_iterations: 15
    stagnant_threshold: 3
    genetic_autofix_candidates: 3
languages:
  ruby:
    version: 3.3+
    frozen_string_literal: required
    guard_clauses: true
    rescue: specify_type_always
    naming: snake_case
    max_params: 3
  rails:
    version: 8+
    stack:
    - solid_queue
    - solid_cache
    - solid_cable
    frontend: hotwire
    testing: minitest
    database: sqlite_default
    security:
    - strong_parameters
    - csrf
    - csp
    - ssl
    - hsts
  zsh:
    shebang: "#!/usr/bin/env zsh"
    options: set -euo pipefail; setopt nullglob extendedglob
  openbsd:
    service: rcctl
    packages: pkg_add
    firewall: pf
    privilege: doas
    http: httpd
    ssh:
      permit_root_login: false
      password_auth: false
      max_auth_tries: 3
  norwegian:
    dialect: bokmål
    rules:
    - Short sentences
    - Avoid anglicisms
    - Active voice
    - Plain language
prediction_engine:
  null_usage:
    confidence: 0.95
    autofix: null_object_pattern
  abbreviation:
    confidence: 0.99
    autofix: expand_to_full_name
  nesting_depth:
    confidence: 0.92
    autofix: extract_method
# Three sets of patterns the law reads directly: what a shell may not run, what
# an injection attempt looks like, and how a refusal has to read. They were in
# patterns.yml among the MOTD copy, the cron jobs and the webhook endpoints;
# only these three are law, so only these three moved.
#
# banned_commands is the enforced list — Io::Shell reads it and warns on a match,
# and the personality prompt names it. forbidden_commands is the reference table
# the same commands are explained by. They are not the same membership and the
# difference is deliberate rather than drift: python is banned and has no zsh
# replacement to offer, while grep, uniq and sort are explained here without
# being warned about, since a scan pipeline uses all three legitimately.
#
# auto_remediation was a third statement of the same axis — eleven rows of
# command to zsh expansion, which is forbidden_commands' replacement column with
# the prose cut — and no reader. Deleted rather than kept in step by hand.
zsh:
  forbidden_commands:
  - command: awk
    replacement: 'zsh array/string field splitting: ${${(s:,:)line}[4]}'
  - command: sed
    replacement: 'zsh parameter expansion: ${var//search/replace}'
  - command: tr
    replacement: 'zsh case conversion: ${(L)var} ${(U)var}'
  - command: grep
    replacement: 'zsh pattern matching: ${(M)arr:#*pattern*}'
  - command: cut
    replacement: 'zsh field splitting: ${${(s:delim:)var}[N]}'
  - command: head
    replacement: 'zsh array slicing: ${arr[1,10]}'
  - command: tail
    replacement: 'zsh array slicing: ${arr[-5,-1]}'
  - command: uniq
    replacement: 'zsh unique flag: ${(u)arr}'
  - command: sort
    replacement: 'zsh sort flags: ${(o)arr} (asc) / ${(O)arr} (desc)'
  - command: bash
    replacement: zsh — never use bash
  - command: find
    replacement: 'zsh glob qualifiers: **/*.rb(.)'
  - command: wc
    replacement: 'zsh length/count: ${#var} / ${#arr}'
  - command: sudo
    replacement: doas on OpenBSD
  native_patterns:
    string_replace: "${var//find/replace}"
    case_lower: "${(L)var}"
    case_upper: "${(U)var}"
    trim_whitespace: "${${var##[[:space:]]#}%%[[:space:]]#}"
    split_to_array: "${(s:delim:)var}"
    array_join: "${(j:,:)arr}"
    array_unique: "${(u)arr}"
    array_sort_asc: "${(o)arr}"
    array_sort_desc: "${(O)arr}"
    array_reverse: "${(Oa)arr}"
    array_filter_match: "${(M)arr:#*pattern*}"
    array_filter_exclude: "${arr:#*pattern*}"
    remove_crlf: "${var//$'\\r'/}"
  # Three exceptions to the list above — complex regex needing PCRE, multi-file
  # operations beyond globbing, binary data processing. Prose, because it was a
  # list and nothing read it: PersonalityPromptBuilder assembles five zsh lines
  # from banned_commands, forbidden_commands, native_patterns, ssh_reading and
  # token_economics, and never reached this key. A declaration with no reader is
  # the tree's most common defect; guidance a reader can see is not.
  banned_commands:
  - python
  - bash
  - sed
  - awk
  - tr
  - wc
  - head
  - tail
  - cut
  - find
  - sudo
  token_economics:
    philosophy: 'Replacing multi‑tool shell pipelines with pure Zsh parameter expansion
      eliminates process boundaries, collapses multiple grammars into one, reduces
      reasoning entropy for LLMs, and converts runtime overhead into in‑memory transforms
      — saving both tokens and wall‑clock time.

      '
    example_bad:
      code: awk -F, '{print $4}' | sed 's/\r//g' | tr '[:upper:]' '[:lower:]'
      cost: 3 grammars, pipes + subshells, I/O transformations
    example_good:
      code: cleaned=${var//$'\r'/}; lower=${(L)cleaned}; fourth=${${(s:,:)lower}[4]}
      cost: One grammar, one evaluation model, no process boundaries
    benefit: Model reasons locally instead of globally across pipeline
  ssh_reading:
    rule: cat path — read the whole file once, never stitch output with grep/head/tail
    rationale: Partial reads yield partial (wrong) changes. Same rule as workflow
      and rules.yml PRESERVE_FIRST.

# Merged from former injection_patterns.yml — prompt/shell injection detection.
injection:
  prompt_injection:
  - "ignore (?:previous|all|your) instructions"
  - "disregard (?:your )?(?:system )?prompt"
  - "you are now (?:a|an|in)"
  - "pretend (?:to be|you are|you're)"
  - "new instructions:"
  - "\\[SYSTEM\\]"
  - "###\\s*SYSTEM"
  - "(?:act|behave|respond) as (?:if )?(?:you (?:are|were)|a|an) (?!assistant|helpful)"
  - "override (?:your )?(?:safety|guidelines|rules|instructions)"
  - "jailbreak"
  - "forget (?:everything|all|your)"
  - "override (?:axiom|principle|rule)"
  - "disregard (?:axiom|principle|rule|safety)"
  - "new system prompt"
  shell_injection:
    multiline_pattern: "```(?:bash|sh|zsh|shell)\\n.*?(?:rm\\s+-rf|curl\\b.*?\\|\\s*(?:bash|sh)\\b|wget\\b.*?\\|\\s*(?:bash|sh)\\b)"
  modes:
    permissive: "match -> block; no match -> pass"
    default_deny: "match -> block; no match -> require explicit allowlist token"

# Merged from former refusal_templates.yml — refusal scaffolding when MASTER
# cannot or should not act. Source: OpenAI / Anthropic system-prompt
# reunification (#74). Loaded by PersonalityPromptBuilder#add_refusal_policy.
refusal_templates:
  capability_disclosure:
    no_internet_yet: "MASTER reads local data and runs local tools; no live web access in this turn"
    no_secret_creation: "MASTER does not generate secrets; bring your own and rotate via signify"
    no_silent_destruction: "MASTER will not run irreversible commands without explicit user confirmation"
  refusal_phrasing:
    style: "decline once, propose alternative once, stop"
    forbidden: ["I'm sorry but I cannot", "as an AI", "I'd be happy to", filler_apology]
    example_good: "Out of scope: production push during freeze. Alternative: branch-only commit, deploy after Friday."
# `autofix:` here is a claim lib/operator/autofix_reach.rb checks and the runtime never
# reads: LearnedSmellsRule declares autofix: false for the rule and Finding.build
# is handed no autofix at all. Seven of the eight named a transform implemented
# nowhere — rescue_standard_error, add_frozen_string_literal, create_issue,
# extract_named_constant, delete_phrase, rewrite_indicative,
# extract_shared_method — so the gate reported seven promises no code could keep.
# The eighth went with trailing_ws below, and the list now names no transform.
#
# `severity:` is declared rather than left to LearnedSmellsRule's `:warning`
# default. A smell reports under its own id, so a report grouped by severity
# reads these rows and not the reader's fallback.
learned_smells:
# bare_rescue and trailing_ws were removed 2026-09-05, by the test the long_line
# and debug_output deletions used: how many findings land on a line no other rule
# reports.
#
# trailing_ws is a strict duplicate. Its pattern is TRAILING_WHITESPACE's
# (lexical_rules.rb) and neither carries a path exemption or a language scope, so
# a four-line probe across .yml, .md and .css scored 4 findings and 0 unique.
#
# bare_rescue is worse than a duplicate. law/universal.rb's FAIL_VISIBLY says in
# its own header that it folds BARE_RESCUE, and it deliberately does NOT match
# `rescue => e`: that form rescues StandardError, which is the fix BARE_RESCUE
# prescribes. So the smell's findings were either FAIL_VISIBLY's again (0 unique
# on a silent rescue) or a report against correct code — measured both ways, on
# a rescue that logs and re-raises and on one that discards. A pattern whose only
# unique findings are the fix is not a narrowing job.
#
# Deleting it also closes rule_hygiene's last id_case_collision: bare_rescue and
# BARE_RESCUE were one rule to a reader and two to every registry that keys on an
# id, which is how a rule's findings, priors and exemptions split in silence.
# frozen_string was removed 2026-09-10, and it failed the uniqueness test harder
# than the five before it: not duplicated, but with no true positive at all. Its
# pattern reads `String.new`, `%q(` and `%Q(` as unfrozen strings. Over lib/ and
# law/ it scores five findings and all five are in
# lib/review/scan/rules/universal_rules.rb, where they are rule fixtures — the
# `fires:`/`does_not_fire:` examples other rules are written against. The premise
# is wrong besides: in a file declaring `frozen_string_literal: true` a percent
# literal is frozen anyway, and `String.new` is how you deliberately ask for a
# mutable one, so the rule fires on the fix. lint:frozen is the real check for
# the magic comment.
# debug_output was removed 2026-08-12, for the same reason as long_line above and
# with the same evidence. It carried the SAME id as the registered DEBUG_OUTPUT
# rule, so their findings were not even distinguishable in a report — where
# long_line at least differed by case. The registered rule is :error with a
# working autofix; this copy was :warning with `autofix: remove_debug_call`, a
# name that appears nowhere but in this file.
#
# Its own comment said the narrowing had to carry "the same operator exclusions
# the DEBUG_OUTPUT Ruby rule carries" — two regexes kept in step by hand, which
# is the definition of the defect. That reasoning lives on in the registered
# rule and in test_debug_output_ignores_a_local_named_p, which pins it.
# todo_comment was removed 2026-09-05, and it is the long_line case exactly.
# Its pattern was a strict subset of the registry's TODO_FIXME — same
# `\b(TODO|FIXME|HACK)\b(?!\.md)` lookahead, one marker fewer (XXX) — so every
# finding it could make outside one directory was a duplicate by construction.
# The one directory is the point: TODO_FIXME exempts `/review/scan/rules/`,
# because a rule that names a marker is a detector and not a marker. Over
# MASTER/lib the smell scored 4 findings and 3 unique, and all 3 were inside that
# exemption — lexical_rules.rb:63 and web_rules.rb:97,99, which are the exempted
# rule sources. So its whole unique yield was a quiet override of another rule's
# exemption, at confidence 0.7 where the registered rule says :info.
- id: magic_number
  # A number in a comment is prose about a number, not a magic literal — the
  # bare regex scored 6,318 findings, sampled 100% comment text. skip_comments
  # blanks comment-only lines before matching (meta_rules.rb#findings_for_smell).
  skip_comments: true
  # Was "\b\d{2,}\b" — any two-digit-or-longer run anywhere, which is 4318
  # findings across the tree and is mostly years, versions, timestamps and
  # numbers that already have names.
  #
  # cross_file_analysis.rb's MAGIC_NUMBER learned this on 2026-07-31 and carries
  # the exemptions: skip years, and skip a literal that sits on the right of a
  # constant assignment or a keyword, because "PATTERN_CACHE_MAX = 512" is the
  # fix this rule recommends and firing on it made the count go up. The
  # declarative twin never got them. It does now — the same three exemptions a
  # single pattern can express.
  pattern: "(?<![\\w.])(?<!= )(?<!: )(?!19\\d{2}(?![\\d.]))(?!20\\d{2}(?![\\d.]))\\d{2,}(?![\\w.])"
  confidence: 0.85
  # A named constant is a thing you extract in code, not in prose. Without this
  # the pattern fires on any number in a markdown transcript or a data file,
  # where "extract a constant" is not an available move.
  mediums: [ruby, javascript, html, zsh]
  severity: warning
# long_line was removed 2026-08-12. It restated the registered LONG_LINE rule as a
# raw regex and produced 334 findings across lib/, of which THREE landed on a line
# no other rule reports — and all three are in lib/io/llm.rb, which LONG_LINE
# deliberately exempts. So the copy was 331 duplicates plus a quiet override of an
# exemption, reported at :warning where the real rule says :info and with the id as
# its whole message.
#
# The same test the EMPTY_RESCUE deletion used: how many findings are unique to
# it. The three entries that survive it — magic_number, duplicate_code and
# sycophancy — are the only implementations of what they detect. Six of the nine
# this list once held have now failed it. Four failed the first way: a raw regex
# restating a registered rule, plus whatever that rule deliberately spares. The
# last two failed a second way, which is worth naming separately because the
# first test does not catch it — a regex with no true positive anywhere in the
# tree, whose whole yield is other rules' fixtures and its own subject matter.
- id: sycophancy
  pattern: "\\b(?:absolutely|certainly|of course|happy to help)\\b"
  confidence: 0.99
  severity: warning
# future_tense was removed 2026-09-10, with frozen_string and for the same
# reason: twelve findings over lib/ and law/, and not one of them a hedge in
# MASTER's output. Six are a detector's own text — SIMULATION's fixture and its
# regex, two model prompts in semantic_rules.rb, StrunkPass's own strip list —
# and the rest are refusal messages naming a consequence in correct English
# ("reset would discard concurrent work", "the tier could not run"). SIMULATION
# (universal_rules.rb) is the live rule for this and is deliberately narrower:
# `will\s+\w+`, `would\s+\w+`, `let's`, with the rule directory exempted. A bare
# modal-verb regex cannot tell a hedge from a sentence about consequence, which
# is the distinction the whole rule turns on.
# DRY carried `duplicate_code` in its aliases while duplicate_code was still a
# live smell with 51 findings over lib/, 48 of them on a line no other rule
# reports. An alias is a retired id; one pointing at a live rule makes every
# lookup ambiguous and is a fold nobody finished. Resolved in the direction the
# measurement gives: the smell is the only implementation of what it detects, so
# the alias went and the rule stayed.
- id: duplicate_code
  pattern: "\\b(?:copy|duplicate|same as)\\b"
  confidence: 0.75
  severity: warning
# god_class/n_plus_one learned_smells removed 2026-07-12: god_class's regex
# (^\s*class\b) matched every class declaration with zero signal, riding
# alongside the real AST-based NO_GOD_CLASS rule (structural_rules.rb:78);
# n_plus_one's regex matched the FIX keywords (includes/preload/eager_load),
# not the problem, riding alongside the real N_PLUS_ONE rule
# (universal_rules.rb:40). Both were redundant, one was backwards.
# A rule with no detect_* key has no detector in this file. Look for it by id:
# most live in law/ (one file per domain), the rest in the scanner registry
# under lib/review/scan/rules/. A few are folded into another rule and are
# reported under that rule's id — those carry folded_into.
#
# They were each written here as `detect_lexical: ~` with that sentence after
# it, 87 times. The key is read for truthiness everywhere it is read at all,
# so nil said exactly what absent says.
rules:
