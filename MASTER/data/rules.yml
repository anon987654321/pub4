  unit:
  - id: SIMPLEST_WORKS
    source: XP — do the simplest thing that could possibly work (Ward Cunningham)
    name: Fewest moving parts that solve the problem
    tier: kernel
    severity: error
    autofix: false
    detect_semantic: Does this unit introduce unnecessary complexity?
    fix: Delete abstractions until it hurts. KISS.
  - id: FAIL_VISIBLY
    source: Fail Fast (Jim Shore, IEEE Software 2004)
    name: Surface errors immediately
    tier: kernel
    severity: error
    autofix: false
    # Same regex as BARE_RESCUE above, deliberately kept in step rather than
    # deduplicated: FAIL_VISIBLY is a soul.yml code_rule and BARE_RESCUE is a style
    # rule, so which one survives is a constitutional question, filed in
    # TODO.md as `two_rules_share_one_rescue_regex`.
    detect_lexical: ~ # migrated to law/ (domain files; find by id)
    detect_semantic: Does this code swallow exceptions or fail silently?
    fix: Catch specific errors, log context, re-raise or return Result.
  - id: BE_CONCISE
    source: Strunk & White / Clean Code — brevity
    name: Avoid unnecessary words, tokens, or lines
    tier: kernel
    severity: warning
    autofix: true
    detect_semantic: Does this unit contain unnecessary verbosity?
    fix: Omit needless words. Omit needless code.
  - id: DRY
    source: DRY — The Pragmatic Programmer (Hunt & Thomas, 1999)
    name: Don't Repeat Yourself
    tier: principle
    severity: warning
    autofix: false
    violates_law: SINGULARITY
    aliases:
    - duplicate_code
    detect_semantic: Are two units expressing the same idea twice?
    fix: MERGE or DEFRAG. Pass the difference as an argument; never copy a block to
      vary one literal.
    tension: DRY conflicts with WET/AHA — singularity wins for data, DRY wins for code.
  - id: KISS
    source: KISS — Keep It Simple (Kelly Johnson, U.S. Navy 1960)
    name: Keep It Simple
    tier: principle
    severity: warning
    autofix: false
    violates_law: LINEARITY
    aliases:
    - long_method
    - god_class
    - nesting_depth
    - arity
    detect_semantic: Does this unit introduce complexity the problem doesn't require?
    fix: FLATTEN nesting; SPLIT god classes; INLINE single-call helpers; delete abstractions
      until it hurts.
  - id: LEAST_ASTONISHMENT
    source: Principle of Least Astonishment (POLA) — not least resistance
    name: Principle of Least Astonishment
    tier: principle
    severity: warning
    autofix: false
    # The id does not repeat "principle": the P in POLA is already that word, and
    # a doubled synonym belongs least of all in the rule against names that
    # surprise their reader. Astonishment over surprise matches the source line
    # and the acronym; surprise is the more natural English and is an alias.
    # Aliases exist because an id appears in findings, exemptions and priors.
    aliases:
    - pola
    - pola_principle
    - no_surprises
    detect_semantic: Does the name promise behavior the implementation contradicts,
      or would a reader be surprised by this behavior generally?
    fix: NAME truthfully; rename when the implementation drifts. Prefer predictable
      over clever.
  - id: SRP
    source: SOLID — Single Responsibility Principle (Robert C. Martin)
    name: Single Responsibility
    tier: solid
    severity: warning
    autofix: false
    detect_semantic: Does this class have more than one reason to change?
    fix: Extract concerns into focused classes.
  - id: OPEN_CLOSED
    source: Open-Closed Principle (Bertrand Meyer; SOLID, R.C. Martin)
    name: Open for extension, closed for modification
    tier: solid
    severity: warning
    autofix: false
    detect_structural: case/when or is_a?/instance_of? chain (3+ branches) dispatching
      on a type tag — see OpenClosedRule
    detect_semantic: Must you modify core code to extend this?
    fix: Strategy pattern, dependency injection, hooks.
  - id: LISKOV
    source: Liskov Substitution Principle (Barbara Liskov, 1987)
    name: Subtypes must substitute for base types
    tier: solid
    severity: warning
    autofix: false
    detect_structural: subclass method refuses the parent's contract (raises NotImplementedError/NoMethodError)
      or requires more args than the parent — see LiskovRule
    detect_semantic: Does a subclass break the parent's contract?
    fix: Use composition if substitutability fails.
  - id: INTERFACE_SEGREGATION
    source: SOLID — Interface Segregation (Robert C. Martin)
    name: No fat interfaces
    tier: solid
    severity: warning
    autofix: false
    detect_structural: module with 8+ public methods included by 2+ classes in the same
      file — see InterfaceSegregationRule (same-file heuristic; cross-file inclusion
      stays semantic-only)
    detect_semantic: Does this interface force implementors to stub unused methods?
    fix: Split into smaller role-based interfaces.
  - id: DEPENDENCY_INVERSION
    source: SOLID — Dependency Inversion (Robert C. Martin)
    name: Depend on abstractions, not concretions
    tier: solid
    severity: warning
    autofix: false
    detect_structural: initialize hardcodes Service/Client/Adapter/Gateway/Repository/Provider.new
      instead of accepting it as a parameter — see DependencyInversionRule
    detect_semantic: Does this class directly instantiate its dependencies?
    fix: Inject dependencies through constructor.
  - id: ONE_JOB
    source: SRP / Unix philosophy — do one thing
    name: Each module has one clear reason to change
    tier: philosophy
    severity: warning
    autofix: false
    detect_semantic: Does this module handle unrelated responsibilities?
    fix: Split into focused modules.
  - id: COMPOSABLE
    source: Unix philosophy / functional composition
    name: Small pieces that combine cleanly
    tier: philosophy
    severity: info
    autofix: false
    detect_semantic: Is this monolithic where it could be composed from smaller parts?
    fix: Build small pieces that combine cleanly.
  - id: CQS
    source: Command-Query Separation (Bertrand Meyer, Eiffel/OOSC)
    name: Separate queries from state mutations
    tier: design
    severity: warning
    autofix: true
    detect_structural: cqs
    fix: 'Split: query() + command(). Never mix.'
    languages:
    - ruby
  - id: LAW_OF_DEMETER
    source: Law of Demeter (Ian Holland, Northeastern, 1987)
    name: Only talk to immediate friends
    tier: design
    severity: warning
    autofix: true
    detect_lexical: ~ # lives in the registry (law twin retired 2026-08-21)
    detect_semantic: Does this code reach through multiple objects?
    fix: Add delegate method. Talk only to direct collaborators.
  - id: COMPOSITION_OVER_INHERITANCE
    source: Design Patterns (Gang of Four, 1994)
    name: Favor has_a over is_a
    tier: design
    severity: info
    autofix: false
    detect_semantic: Is inheritance used for code reuse rather than substitutability?
    fix: Use composition. Mixins for shared behavior.
  - id: SMALL_FUNCTIONS
    source: Clean Code — functions should be small (R.C. Martin)
    name: Methods under 10 lines ideal, max 20
    tier: clean_code
    severity: warning
    autofix: true
    detect_structural: long_method
    fix: 'Extract: validate(), calculate(), persist().'
  - id: FEW_ARGUMENTS
    source: Clean Code — minimize arguments (R.C. Martin)
    name: Ideal is zero to two arguments
    tier: clean_code
    severity: warning
    autofix: true
    detect_lexical: ~ # lives in the registry (law twin retired 2026-08-21)
    fix: Group into keyword arguments or parameter object.
    languages:
    - ruby
  - id: ONE_ABSTRACTION_LEVEL
    source: Clean Code — one level of abstraction per function
    name: Each function at one abstraction level
    tier: clean_code
    severity: info
    autofix: false
    detect_semantic: Does this function mix high-level policy with low-level detail?
    fix: Extract low-level detail into helper methods.
  - id: STEPDOWN
    source: Clean Code — the Stepdown Rule (Robert C. Martin)
    name: Functions call only one level below
    tier: clean_code
    severity: info
    autofix: false
    detect_semantic: Does this code read top-down like a newspaper?
    fix: Public methods at top, private helpers below.
  - id: BOUNDARY_ISOLATION
    source: Boundaries (Gary Bernhardt) / Clean Architecture
    name: Wrap third-party code at the edge
    tier: clean_code
    severity: warning
    autofix: false
    detect_semantic: Does third-party API surface leak into core logic?
    fix: Wrap in adapter. Keep it from leaking.
  - id: NO_MAGIC
    source: Clean Code — no magic numbers (Robert C. Martin)
    name: No unexplained constants or flags
    tier: clean_code
    severity: warning
    autofix: true
    detect_semantic: Are there unexplained numeric literals or boolean flags?
    fix: Extract to named constants.
  - id: FAIL_FAST
    source: Fail Fast (Jim Shore, IEEE Software 2004)
    name: Report errors at detection point
    tier: reliability
    severity: warning
    autofix: true
    detect_semantic: Does this code defer error reporting instead of failing immediately?
    fix: Raise or return Result.err at point of detection.
  - id: IDEMPOTENT
    source: Idempotency — REST / distributed systems design
    name: Same operation, same result
    tier: reliability
    severity: info
    autofix: false
    detect_semantic: Would repeating this operation produce different results?
    fix: Use set_value() instead of increment(). Add idempotency keys.
  - id: DEFENSIVE_INPUT
    source: Defensive programming / Postel's Law
    name: Never trust input at system boundaries
    tier: reliability
    severity: warning
    autofix: true
    detect_semantic: Is external input used without validation?
    fix: Validate at boundaries. Whitelist, sanitize.
  - id: GRACEFUL_DEGRADATION
    source: Release It! graceful degradation (Michael Nygard)
    name: Partial functionality beats total failure
    tier: reliability
    severity: warning
    autofix: false
    detect_semantic: Does one failure crash everything?
    fix: Circuit breakers, timeouts, fallback to stale data.
  - id: NO_SIDE_EFFECTS
    source: Functional programming / Clean Code
    name: Functions should not change state they do not own
    tier: functional
    severity: info
    autofix: false
    detect_semantic: Does this function modify external state silently?
    fix: Make side effects explicit. Return values instead of mutating.
  - id: IMMUTABLE
    source: Effective Java — minimize mutability (Joshua Bloch); FP
    name: Default to immutable data
    tier: functional
    severity: info
    autofix: false
    detect_lexical: ~ # migrated to law/ (domain files; find by id)
    detect_semantic: Are mutable objects shared across threads or scopes?
    fix: Freeze collections. Use frozen/const by default.
    languages:
    - ruby
  - id: PURE_FUNCTIONS
    source: Functional programming — referential transparency
    name: Same input, same output
    tier: functional
    severity: info
    autofix: true
    detect_semantic: Does this function depend on hidden state?
    fix: Pass all dependencies as parameters.
  - id: PRIMITIVE_OBSESSION
    source: 'Refactoring code smell: Primitive Obsession (Fowler)'
    name: Replace repeated primitives with value objects
    tier: refactoring
    severity: info
    autofix: false
    detect_structural: method with 4+ params matching common primitive-hint names (id/name/type/status/count/...)
      — see PrimitiveObsessionRule (single-method heuristic; genuine false-positive
      risk on generic-but-unrelated primitives, semantic check is the real filter)
    detect_semantic: Are primitives used where a value object would be clearer?
    fix: Create a value object.
  - id: FEATURE_ENVY
    source: 'Refactoring code smell: Feature Envy (Fowler)'
    name: A method more interested in another object than its own
    tier: refactoring
    severity: warning
    autofix: false
    detect_structural: method's dominant receiver is called 4+ times, more than local
      (@ivar/self) access — see FeatureEnvyRule (single-method heuristic, same-file
      only)
    detect_semantic: Is this method more interested in another object's data than its
      own?
    fix: Move the method (or the envious part of it) to the object it talks to most.
  - id: MESSAGE_CHAIN
    source: 'Refactoring code smell: Message Chains (Fowler)'
    name: Avoid a.b.c.d chains
    tier: refactoring
    severity: warning
    autofix: true
    detect_lexical: ~ # folded into another rule; no detector of its own
    folded_into: LAW_OF_DEMETER # same detector; one law, two ids
    fix: Talk only to immediate collaborators.
  - id: MIDDLE_MAN
    source: 'Refactoring code smell: Middle Man (Fowler)'
    name: Eliminate pure-delegation classes
    tier: refactoring
    severity: info
    autofix: false
    detect_semantic: Does this class delegate most methods to another?
    fix: Remove middle man. Talk directly.
  - id: LAZY_CLASS
    source: 'Refactoring code smell: Lazy Class (Fowler)'
    name: Remove classes too small to justify existence
    tier: refactoring
    severity: info
    autofix: false
    detect_semantic: Is this class doing too little to earn its existence?
    fix: Inline into caller.
  - id: DIVERGENT_CHANGE
    source: 'Refactoring code smell: Divergent Change (Fowler)'
    name: Split classes changed for unrelated reasons
    tier: refactoring
    severity: warning
    autofix: false
    detect_semantic: Is this class modified for multiple unrelated reasons?
    fix: Split by axis of change.
  - id: SPECULATIVE_GENERALITY
    source: 'Refactoring code smell: Speculative Generality (Fowler); YAGNI'
    name: Remove code for hypothetical needs
    tier: refactoring
    severity: info
    autofix: true
    detect_semantic: Is this code written for a future requirement that does not exist
      yet?
    fix: Delete it. YAGNI.
  - id: INAPPROPRIATE_INTIMACY
    source: 'Refactoring code smell: Inappropriate Intimacy (Fowler)'
    name: Do not access another class's private data
    tier: refactoring
    severity: warning
    autofix: false
    detect_semantic: Does this code access internals of another class?
    fix: Use public interface. Enforce boundaries.
  - id: SYSTEM_STATUS
    source: 'Nielsen Heuristic #1 — Visibility of system status (NN/g)'
    name: Keep users informed of progress
    tier: ux
    severity: info
    autofix: true
    detect_semantic: Does this long operation provide feedback to the user?
    fix: Spinner, progress bar, status message.
  - id: USER_CONTROL
    source: 'Nielsen Heuristic #3 — User control and freedom (NN/g)'
    name: Support undo and emergency exits
    tier: ux
    severity: info
    autofix: false
    detect_semantic: Can the user undo or cancel this operation?
    fix: Add undo support. Confirm destructive actions.
  - id: ERROR_RECOVERY
    source: 'Nielsen Heuristic #9 — Help users recover from errors (NN/g)'
    name: Error messages must name the problem and suggest a fix
    tier: ux
    severity: warning
    autofix: false
    detect_semantic: Do error messages explain what went wrong and what to do?
    fix: Name the problem. Suggest a fix. Show context.
  - id: AESTHETIC_MINIMALISM
    source: 'Nielsen Heuristic #8 — Aesthetic and minimalist design (NN/g)'
    name: Show only relevant information
    tier: ux
    severity: info
    autofix: false
    detect_semantic: Does this output contain information that does not earn its place?
    fix: Every element must earn its place.
  - id: MATCH_REAL_WORLD
    source: 'Nielsen Heuristic #2 — Match between system and the real world (NN/g)'
    name: Speak the user's language, not system internals
    tier: ux
    severity: info
    autofix: false
    detect_semantic: Does this expose implementation jargon instead of a real-world
      term the user already knows?
    fix: Mirror the user's language and real-world conventions; order info naturally.
  - id: RECOGNITION_OVER_RECALL
    source: 'Nielsen Heuristic #6 — Recognition rather than recall (NN/g)'
    name: Show options instead of requiring the user to remember them
    tier: ux
    severity: info
    autofix: false
    detect_semantic: Does this require the user to remember information across steps
      instead of showing it?
    fix: Make objects, actions, and options visible; minimize memory load.
  - id: FLEXIBILITY_EFFICIENCY
    source: 'Nielsen Heuristic #7 — Flexibility and efficiency of use (NN/g)'
    name: Provide shortcuts for experts without cluttering novices' path
    tier: ux
    severity: info
    autofix: false
    detect_semantic: Does this serve only novice or only expert users when both accelerators
      and defaults could coexist?
    fix: Add shortcuts for experts; keep sensible defaults for novices.
  - id: HELP_AND_DOCUMENTATION
    source: 'Nielsen Heuristic #10 — Help and documentation (NN/g)'
    name: Provide searchable, concrete, task-focused help
    tier: ux
    severity: info
    autofix: false
    detect_semantic: If the user gets stuck here, is there searchable, concrete, task-focused
      help nearby?
    fix: Add context-sensitive help with concrete steps; keep it easy to search.
  - id: CONSISTENCY
    source: 'Nielsen Heuristic #4 — Consistency and standards (NN/g)'
    name: Same term means same thing everywhere
    tier: ux
    severity: warning
    autofix: false
    detect_semantic: Are the same concepts named differently in different places?
    fix: Follow conventions. One name per concept.
  - id: COST_TRANSPARENCY
    source: MASTER-native (surface LLM token cost)
    name: Show LLM costs in real-time
    tier: llm
    severity: warning
    autofix: true
    detect_semantic: Are API calls made without showing token count or cost?
    fix: Display [$0.0023, 847 tokens] after each call.
  - id: CACHE_LLM
    source: MASTER-native (cache LLM responses)
    name: Cache deterministic LLM responses
    tier: llm
    severity: info
    autofix: true
    detect_semantic: Is the same prompt sent multiple times without caching?
    fix: Hash prompt, cache response with bounded TTL.
  - id: GUARD_EXPENSIVE_OPS
    source: MASTER-native (guard expensive operations); Nielsen heuristic 5, error prevention
    name: Confirm before costly or destructive operations
    tier: safety
    severity: error
    autofix: false
    detect_lexical: ~ # migrated to law/ (domain files; find by id)
    detect_semantic: Does this execute an expensive or destructive operation without
      confirmation?
    fix: Cost estimate before execution. Require opt-in for danger.
  - id: NO_FLAG_ARGUMENTS
    source: Clean Code — no flag arguments (Robert C. Martin)
    name: A flag that selects behavior means two things hiding as one
    tier: clean_code
    severity: warning
    autofix: false
    detect_lexical: ~ # lives in the registry (law twin retired 2026-08-21)
    detect_semantic: Does a boolean cause this unit to do two different things? In a
      contract, does one condition branch into contradictory obligations?
    fix: Split into two distinct units. Each does one thing.
  - id: NO_OUTPUT_ARGUMENTS
    source: Clean Code — no output arguments (Robert C. Martin)
    name: Return results, never secretly modify what was passed in
    tier: clean_code
    severity: warning
    autofix: false
    detect_semantic: Does this modify its arguments instead of returning a result? Does
      this clause silently alter a definition from a prior section?
    fix: Return the result. Leave inputs untouched.
  - id: NO_SELECTOR_ARGUMENTS
    source: FlagArgument (Martin Fowler) / Clean Code
    name: Arguments that switch behavior indicate hidden multiplicity
    tier: clean_code
    severity: warning
    autofix: false
    detect_semantic: Is an argument used as a switch to select between behaviors? Does
      a field mean different things in different contexts?
    fix: Separate functions, separate types, separate document sections.
  - id: DESIGN_BY_CONTRACT
    source: Design by Contract (Bertrand Meyer, Eiffel/OOSC)
    name: State what you expect, what you promise, what must remain true
    tier: reliability
    severity: info
    autofix: false
    detect_semantic: Are preconditions, postconditions, and invariants left implicit?
      Does this API lack documentation of valid inputs and guaranteed outputs?
    fix: Make contracts explicit. Preconditions, postconditions, invariants.
  - id: CRASH_EARLY
    source: The Pragmatic Programmer — Crash Early (Hunt & Thomas)
    name: A dead process does less damage than a corrupted one
    tier: reliability
    severity: warning
    autofix: false
    detect_semantic: Does this limp along in a broken state instead of stopping cleanly?
      Does this continue after contraindication signals?
    fix: Stop when invariants break. A clean crash is recoverable. Corruption is not.
  - id: DEFINE_ERRORS_OUT
    source: A Philosophy of Software Design — Define Errors Out of Existence (Ousterhout)
    name: Design so error conditions cannot arise
    tier: design
    severity: info
    autofix: false
    detect_semantic: Is this handling errors that could be eliminated by redesigning
      the interface? Does this validation reject input that better design would prevent?
    fix: Redesign so the error cannot occur.
  - id: SURFACE_AREA
    source: API design — minimize public surface area
    name: Minimize the boundary between inside and outside
    tier: design
    severity: warning
    autofix: false
    detect_semantic: Is the public interface larger than necessary? Does this contract
      have more exceptions than rules?
    fix: Fewer public methods. Fewer clauses. Fewer points of contact mean fewer points
      of failure.
  - id: PROGRESSIVE_DISCLOSURE
    source: Progressive disclosure (Jakob Nielsen, NN/g)
    name: Reveal complexity only as needed
    tier: ux
    severity: info
    autofix: false
    detect_semantic: Does this present all complexity at once? Does this front-load
      definitions before stating obligations?
    fix: Lead with the simple case. Reveal depth on demand.
  - id: FEEDBACK_LOOPS
    source: 'Nielsen Heuristic #1 — feedback (NN/g)'
    name: Every action must produce observable feedback
    tier: ux
    severity: warning
    autofix: false
    detect_semantic: Does this perform work without reporting progress? Does this protocol
      lack checkpoints?
    fix: Close the loop. Every action produces feedback. Every milestone gets measured.
  - id: DATA_CLASS
    source: 'Refactoring code smell: Data Class (Fowler)'
    name: Data without behavior is a missed abstraction
    tier: refactoring
    severity: info
    autofix: false
    detect_semantic: Does this hold data but contain no behavior? Is logic scattered
      across other modules? Is this a spreadsheet of raw numbers with formulas elsewhere?
    fix: Push behavior into the data. Methods belong with the data they operate on.
  - id: PARALLEL_INHERITANCE
    source: 'Refactoring code smell: Parallel Inheritance Hierarchies (Fowler)'
    name: Two hierarchies that must change in lockstep
    tier: refactoring
    severity: warning
    autofix: false
    detect_semantic: Does adding a type in one hierarchy require adding one in another?
      Does a new product line require changes in both catalog and billing?
    fix: Merge the hierarchies or use composition.
  - id: REFUSED_BEQUEST
    source: 'Refactoring code smell: Refused Bequest (Fowler)'
    name: Inheriting what you do not use
    tier: refactoring
    severity: info
    autofix: false
    detect_semantic: Does this variant ignore most of what it inherits? Does this addendum
      negate most of the base agreement?
    fix: Use composition instead of inheritance.
  - id: PROSE_ACTIVE_VOICE
    source: Strunk, Elements of Style (1918) Rule 10 — use the active voice
    name: Prefer the active voice in all written output
    tier: density
    severity: info
    autofix: false
    detect_lexical: ~ # migrated to law/ (domain files; find by id)
    detect_semantic: Does this sentence use passive voice where active would be shorter
      and clearer?
    fix: 'Recast active: ''the bug was fixed by X'' -> ''X fixed the bug''.'
    languages:
    - prose
    - markdown
    - ruby
  - id: PROSE_POSITIVE_FORM
    source: Strunk, Elements of Style (1918) Rule 11 — put statements in positive form
    name: State assertions in positive form
    tier: density
    severity: info
    autofix: false
    detect_semantic: Is this phrased as a negation where a direct positive verb exists
      (did not remember -> forgot, not honest -> dishonest)?
    fix: 'Replace ''not + word'' with the affirmative: ''did not pass'' -> ''failed''.'
    languages:
    - prose
    - markdown
    - ruby
  - id: PROSE_OMIT_QUALIFIERS
    source: Strunk, Elements of Style (1918) — the leech words
    name: Cut hollow intensifiers and hedges
    tier: density
    severity: warning
    autofix: false
    detect_lexical: ~ # migrated to law/ (domain files; find by id)
    fix: Delete the qualifier; let the verb or noun carry the weight.
    languages:
    - prose
    - markdown
    - ruby
  - id: PROSE_PARALLEL_FORM
    source: Strunk, Elements of Style (1918) Rule 15 — co-ordinate ideas in similar
      form
    name: Express parallel ideas in parallel grammatical form
    tier: clarity
    severity: info
    autofix: false
    detect_semantic: Do items in this list or series mix grammatical forms (noun, verb
      phrase, clause) where one form should hold throughout?
    fix: 'Make series elements match: all imperatives, or all nouns, never a blend.'
    languages:
    - prose
    - markdown
  - id: PROSE_RELATED_WORDS
    source: Strunk, Elements of Style (1918) Rule 16 — keep related words together
    name: Keep subject, verb, and modifiers adjacent to what they govern
    tier: clarity
    severity: info
    autofix: false
    detect_semantic: Is a modifier or subject separated from its referent so the sentence
      misreads on first pass?
    fix: Move the modifier next to the word it modifies; close the subject-verb gap.
    languages:
    - prose
    - markdown
  - id: PROSE_ONE_TOPIC_PARAGRAPH
    source: Strunk, Elements of Style (1918) Rules 8–9 — paragraph as the unit
    name: One topic per paragraph, opened by a topic sentence
    tier: clarity
    severity: info
    autofix: false
    detect_semantic: Does this paragraph cover more than one topic, or bury its point
      below the first sentence?
    fix: Split per topic; lead each paragraph with its claim.
    languages:
    - prose
    - markdown
  - id: GRICE_COOPERATIVE
    source: Grice — cooperative principle (quantity, quality, relation, manner)
    name: Every message obeys the four conversational maxims
    tier: clarity
    severity: info
    autofix: false
    detect_semantic: Does this comment/commit/message violate a maxim — say more or
      less than needed (quantity), assert the unverified (quality), drift off-point
      (relation), or read unclearly/out of order (manner)?
    fix: Trim to what is needed, assert only the verified, stay on point, order it plainly.
    languages:
    - prose
    - markdown
    - ruby
  - id: RAILS_THIN_CONTROLLER_SEMANTIC
    name: Controllers delegate business rules to models and services
    autofix: false
    severity: warning
    tier: solid
    mode: violation
    languages:
    - ruby
    detect_semantic: If this is a Rails controller, flag actions that own business rules,
      multi-model orchestration, or heavy queries instead of delegating to models/services.
      Cite method names. If not a controller or already thin, CLEAN.
  - id: RAILS_VIEW_PURITY
    name: Views present assigns and hold no business logic
    autofix: false
    severity: warning
    tier: solid
    mode: violation
    languages:
    - html
    - erb
    detect_semantic: If this is a Rails view/partial, flag non-presentation logic (queries,
      persistence, multi-step condition trees that belong in helpers/models). Prefer
      CLEAN when the view only presents assigns.
  - id: AESTHETIC_FLAT_SEMANTIC
    name: Flat surfaces on an 8px rhythm, no ornamental depth
    autofix: false
    severity: info
    tier: cosmetic
    mode: opportunity
    languages:
    - css
    - scss
    - html
    - javascript
    detect_semantic: 'Score pixel-perfect flat UI: reject ornamental shadow/blur/glow,
      uneven spacing off 8px rhythm, weak hierarchy, and decorative particles. Propose
      concrete token/spacing/type fixes. If already flat and rhythmic, CLEAN.'
  - id: AESTHETIC_RAMS_SEMANTIC
    name: Useful, understandable, unobtrusive, honest, thorough
    autofix: false
    severity: info
    tier: cosmetic
    mode: opportunity
    languages:
    - html
    - css
    - scss
    detect_semantic: Apply Dieter Rams useful/understandable/unobtrusive/honest/thorough
      to this UI surface. Flag dishonest progress, missing empty/error states, chrome
      that competes with content. CLEAN if solid.

# Prose law vocabulary, one entry per natural language.
#
# Strunk's rules describe a shape, not an English word list: an intensifier
# that adds emphasis and no information, a passive that hides its actor. Every
# language with those has its own words for them, and holding the words inside
# the detector made law/prose.rb English-only by accident. Held here, a second
# language is a data edit — `ids` names the laws it generates, and law/prose.rb
# defines one per entry.
#
# `paths` is load-bearing rather than decoration. Norwegian `bare` (only) is an
# English word this tree uses constantly — "a bare regex", "bare true", "a bare
# div" — so a vocabulary let loose outside the files its language is written in
# returns nothing but false positives. Each entry names where it is spoken.
#
# `keep` holds the senses that are not the defect: the same word doing
# contrastive, comparative, temporal or determiner work. Every pattern in it
# was earned against a measured false positive, and law/prose.rb carries the
# count and the evidence for each.
#
# The same principle in code and in design is not repeated here. A needless
# parameter is DEAD_CODE, needless ornament is the design_rules below, and one
# statement of a rule is the point.
prose:
  en:
    spoken_in: '.'
    file_languages: [markdown, ruby]
    # Where the language is written inside those files. English here is the
    # prose in comments, so the detector has to skip the code around them;
    # `values` reads a locale file, where the strings are the prose and the keys
    # are not.
    reads: comments
    ids:
      qualifiers: PROSE_OMIT_QUALIFIERS
      passive: PROSE_ACTIVE_VOICE
    fixtures:
      qualifiers: { bad: '# This is very fast.', good: '# This is fast.' }
      passive:
        bad: '# The bug was fixed by the maintainer.'
        good: '# The maintainer fixed the bug.'
    # `actually` and `literally` are absent on purpose. Both read as leeches
    # and neither is one here: they are contrastive, setting what is against
    # what was claimed, which is this repo's recurring subject. 85 and 4 hits
    # respectively, every one of them that use.
    leeches: [very, rather, really, quite, pretty, somewhat, just, basically, simply]
    keep:
      - 'rather than'                              # a contrast, not a degree
      - 'rather\s*$'                               # "rather than" wrapped mid-phrase
      - 'just (?:as|because|before|after|when)'    # a comparison
      - '(?:not|never)\s+(?:just|simply|only)'     # a negation
      - 'n''t\s+(?:just|simply|only)'
      # English past participles are not all -ed, and the temporal sense is the
      # commonest one this tree uses: "what you just wore", "the first response
      # just set", "a profile they had just seen".
      - 'just\s+(?:been\s+)?(?:\w+ed|wore|worn|set|sent|seen|written|wrote|read|made|got|put|left|took|taken|came|went|said|found|ran|saw|built|began|gave|given|held|kept|lost|met|paid|ran|shown|told|thought)'
      # English past participles are not all -ed. "a profile they had just seen",
      # "the line was just written", "had just been sent" are all the temporal
      # sense, and an auxiliary in front of `just` is what marks it.
      - '(?:had|has|have|was|were)\s+just\s+(?:been\s+)?\w+'
      - '(?:the|this|that|its) very'               # a determiner picking a thing out
      # Measured against STUDIO's 138. `just` before a position or a quantity
      # measures rather than minimises — "pads land just under the kit", "just
      # enough to stop the DC step popping", "harmonics from the content just
      # below the cliff".
      - 'just\s+(?:enough|about|above|below|over|under|short|past|now|then)'
      # `quite` after a negation means fully, so cutting it says the opposite:
      # "the piano body GM never quite nails" would become a claim that GM never
      # nails it at all.
      - '(?:not|never|n''t|hardly)\s+(?:quite|really)'
      - 'simply because'                           # a cause, not a manner
      # An adverb modifies the next word across a space. `pretty-printed` is one
      # word and the rule's sense of `pretty` is not in it.
      - '\bpretty-\w'
    passive:
      auxiliary: '(?:was|were|been)'
      participle: '(?:\w+ly\s+)?\w+ed'
      # `by` marks an agent here, but the same word marks a manner: "tuned by
      # feel", "transcribed by ear", "measured by hand". Those say how the thing
      # was done rather than who did it, and there is no active voice to move
      # them to — "feel tuned the sigma" is not a sentence.
      agent: 'by(?!\s+(?:ear|feel|hand|eye|design|accident|default|mistake|now|then)\b)'
  nb:
    # Bokmål reaches the tree through the Rails locale files and nowhere else;
    # every comment in the repo is English. Scoped there, `bare` is Norwegian.
    spoken_in: '(?:\A|[/.])nb\.yml\z'
    file_languages: [yaml]
    reads: values
    ids:
      qualifiers: PROSE_OMIT_QUALIFIERS_NB
      passive: PROSE_ACTIVE_VOICE_NB
    fixtures:
      qualifiers:
        bad: 'tittel: Dette er veldig raskt'
        good: 'tittel: Dette er raskt'
      passive:
        bad: 'notis: Feilen ble rettet av vedlikeholderen'
        good: 'notis: Vedlikeholderen rettet feilen'
    # `egentlig` and `faktisk` are held out for the same reason `actually` is:
    # both mark a contrast with what was assumed rather than grading anything.
    #
    # `bare` is held out on measured evidence. It reads as English `just` and
    # carries the same split, but in this tree the restrictive sense is the only
    # one present: all 11 hits were "du kan bare slette dine egne kommentarer",
    # "bare medlemmer poster", "Dating er bare for voksne". Bokmål has no other
    # word for that "only", so deleting it inverts the sentence — the copy stops
    # saying what a reader may not do. English `just` keeps its place because
    # the merely sense does appear there; here it does not.
    leeches: [veldig, svært, ganske, nokså, temmelig, virkelig, simpelthen]
    keep:
      - 'heller enn'          # rather than
      - 'ikke bare'           # not only
    # Bokmål builds the periphrastic passive with bli/ble/blitt and marks the
    # agent with `av`, which is the same shape the English rule judges.
    passive:
      auxiliary: '(?:ble|blitt)'
      participle: '\w+(?:et|dd|tt|t)'
      agent: 'av'

# Folded from data/design_rules.yml — one file for all rules.
design_rules:
  typography:
    line_length:
      min_ch: 45
      max_ch: 75
      ideal_ch: 66
      mobile_min_ch: 35
      mobile_max_ch: 50
      # The x.com-shaped feed is a short measure on purpose: --feed-max 600px at
      # brgen's 18px root is ~45ch, not 66. Legal/prose keeps ideal_ch. Worn
      # measure is geometry_type.rb reading worn_type.profiles, not this token.
      feed_min_ch: 35
      feed_max_ch: 55
      action: Flag readable prose blocks outside range. Prefer max-width in ch units. Count worn characters, not the CSS token.
    line_height:
      # Must match RAILS/shared/design_tokens.yml scale.line_height and ScaleLint.
      # Off-scale values (1.45, 1.55, 1.3, …) are debt — do not invent new ones.
      # PRESERVE_THEN_IMPROVE_NEVER_BREAK: absolute px line-heights on :root stay
      # until a measured screenshot pass; unitless steps only for new prose rules.
      allowed: [1, 1.25, 1.4, 1.5, 1.6]
      body_min: 1.4
      body_max: 1.6
      body_accessibility_min: 1.5
      body_preferred: 1.5
      heading_min: 1.0
      heading_max: 1.25
      heading_preferred: 1.25
      long_line_threshold_ch: 60
      long_line_min: 1.5
      forbid_absolute_px: true
      action: >
        Use only allowed unitless steps. Prefer 1.5 for prose, 1.25 for titles,
        1.6 for relaxed quotes. Flag absolute px line-heights and off-scale ratios.
        Cross-check RAILS Pub4::ScaleLint baselines before inventing a step.
    type_scale:
      default_ratio: 1.25
      marketing_ratio: 1.333
      allowed_ratios:
        minor_third: 1.2
        major_third: 1.25
        perfect_fourth: 1.333
        golden: 1.618
      base_px: 16
      action: Prefer a modular scale; flag arbitrary one-off font sizes.
    letter_spacing:
      all_caps_min_em: 0.05
      all_caps_max_em: 0.15
      heading_tight_min_em: -0.02
      lowercase_body_should_letterspace: false
      action: Add tracking to all-caps labels; reject letter-spaced lowercase prose.
    hierarchy:
      min_size_ratio_between_levels: 1.2
      h1_body_min_ratio: 2.0
      h1_body_max_ratio: 3.0
      h2_body_min_ratio: 1.5
      h2_body_max_ratio: 2.0
      h3_body_min_ratio: 1.25
      h3_body_max_ratio: 1.5
      min_weight_delta: 200
      max_font_families: 2
      max_font_weights: 3
      max_font_sizes: 8
      action: Ensure hierarchy is visible by size, weight, placement, or contrast.
    optical_margins:
      # Bringhurst: geometric box edge ≠ optical text edge.
      hanging_punctuation: true
      list_marker_hang: true
      blockquote_border_in_margin: true
      measure_css_token: "--measure"
      measure_ideal_ch: 66
      apply_to: [prose, editorial, legal, post_show]
      do_not_apply_to: [feed_card, nav, marketplace_tile, chrome]
      action: >
        Prefer hanging-punctuation on prose; hang list markers and quote rules
        into the margin so the text edge reads true. Wire max-width: var(--measure)
        (66ch) on continuous reading surfaces, not on dense social chrome.
    micro:
      orphans: 3
      widows: 3
      hyphens: auto
      hyphenate_limit_chars: [6, 3, 2]
      hyphenate_limit_lines: 2
      default_features: [kern, liga, clig, onum, pnum]
      contextual_features:
        abbreviations: [smcp, c2sc]
        tables: [lnum, tnum]
        all_caps: [case]
      body_numerals: oldstyle-nums
      table_numerals: tabular-nums
      river_word_spacing_em: -0.05
      justify_only_with_hyphens: true
      justify_never_on_mobile: true
      quotes: locale
      norwegian_guillemets: true
      print_margins: [2, 3, 4, 6]
      void_target: 0.70
      action: >
        Enable OpenType kern/liga/clig/onum/pnum on prose; oldstyle-nums in
        body, tabular-nums in tables; hyphens auto with 6/3/2 limits;
        orphans/widows 3. Reader is Design::Thresholds.micro_typography.
    accessibility:
      normal_text_contrast: 7.0
      large_text_contrast: 4.5
      body_min_px: 16
      recommended_body_px: 18
      mobile_input_min_px: 16
      action: Reject unreadable contrast and mobile input text below 16px.
  layout_rules:
    grid:
      columns: 12
      base_unit_px: 8
      # Subset used by surface_rules eight_px_rhythm. Full membership is
      # RAILS/shared/design_tokens.yml scale.space_px (incl. 12/20/28/36/40/44…).
      # Do not invent steps outside that scale; prefer tokens over literals.
      source: RAILS/shared/design_tokens.yml#scale.space_px
      allowed_spacing_px:
      - 4
      - 8
      - 12
      - 16
      - 20
      - 24
      - 32
      - 40
      - 44
      - 48
      - 64
      - 96
      action: Prefer 8px rhythm and 12-column structure; allow 4px for hairline adjustments. Full scale in design_tokens.
    proportion:
      golden_ratio: 1.618
      split_main_ratio: 0.618
      split_sidebar_ratio: 0.382
      action: Use proportional splits for major panels instead of arbitrary widths.
    whitespace:
      internal_not_greater_than_external: true
      gap_over_margin: true
      paragraph_margin_em: 1.5
      section_padding_min_rem: 4
      section_padding_max_rem: 8
      action: Padding should not exceed separation between unrelated groups; use gap before margin hacks.
    reading_patterns:
      text_heavy: f_pattern
      landing_page: z_pattern
      primary_area: top_left
      terminal_area: bottom_right
      weak_area: bottom_left
      action: Place critical information along the dominant scan path.
    alignment:
      avoid_default_center_alignment: true
      center_text_max_lines: 3
      body_text_alignment: left
      rag: right
      action: Use asymmetry and alignment before decoration.
    touch:
      target_min_px: 44
      target_recommended_px: 48
      thumb_zone_primary_actions: bottom_center
      action: Flag critical mobile interactions in unreachable top corners.
  ultraminimalism:
    philosophy:
      typography_is_design: true
      absence_is_material: true
      remove_until_nothing_left_to_remove: true
      less_but_better: true
      action: Prefer absence, typography, alignment, and whitespace over ornamental UI.
    swiss_style:
      left_aligned_ragged_right: true
      sans_serif_default: Inter
      alternative_faces:
      - Helvetica
      - Akzidenz-Grotesk
      - IBM Plex Sans
      visible_grid_optional: false
      font_feature_settings:
        Inter: '"ss03" 1'
      action: Use an invisible mathematical grid with type-led hierarchy.
    negative_space:
      primary_design_material: true
      chunk_forms_by_proximity: true
      avoid_tunnel_vision_distance: true
      card_padding_px: 24
      section_gap_px: 48
      hero_breathing_room_px: 96
      content_width: min(66ch, 100% - 3rem)  # aligned with typography.line_length.ideal_ch / --measure
      action: Space communicates grouping; whitespace must clarify relationships.
    color:
      max_palette_roles: 4
      roles:
      - primary
      - secondary
      - accent
      - highlight
      prefer_monochrome_with_one_accent: true
      action: Reject color variety when value, spacing, and type can do the work.
    interaction:
      minimal_js_default: Stimulus
      no_build_options:
      - Stimulus
      - PetiteVue
      - Alpine
      - VanJS
      - HTMX
      progressive_enhancement_required: true
      data_attributes_bridge_behavior: true
      action: Keep behavior small, recoverable, and legible in HTML.
    design_tokens:
      required_for_generation: true
      exact_token_use: true
      token_categories:
      - color
      - spacing
      - radius
      - typography
      - motion
      action: Inject tokens before generation; flag new ad-hoc values.
    prompting:
      constitutional_rules: true
      positive_constraints_over_negative: true
      self_refine_loop: true
      designer_personas:
      - Dieter Rams
      - Massimo Vignelli
      - Josef Mueller-Brockmann
      require_design_rationale_before_code: true
      action: Force design decisions before code; iterate by critique then revision.
    automated_iteration:
      screenshot_first: true
      ferrum_capture: true
      visual_regression: BackstopJS
      max_iterations: 5
      target_score: 95
      action: Capture, compare, critique, patch, and repeat until differences are intentional.
    mcp:
      enabled_targets:
      - filesystem
      - puppeteer
      - git
      - figma
      - accessibility
      primitives:
      - tools
      - resources
      - prompts
      action: Prefer standard tool bridges over bespoke glue when integrating design automation.
  visual_design:
    semantics:
      reject_arbitrary_decoration: true
      action: Every ornament must communicate state, hierarchy, affordance, or tone.
    syntactics:
      enforce_visual_grammar: true
      action: Reuse spacing, color, radius, and type tokens consistently.
    pragmatics:
      must_be_understandable: true
      action: Prefer self-explanatory affordances over clever ambiguity.
    rams:
      useful: true
      understandable: true
      unobtrusive: true
      honest: true
      thorough: true
      action: Score design changes against Dieter Rams-style usefulness and honesty.
    font_personality:
      traditional_trustworthy: serif
      modern_innovative: geometric_sans
      accessible_interface: humanist_sans
      impact: bold_display
      action: Match typography mood to content rather than trend.
    screen_legibility:
      prefer_high_x_height: true
      prefer_open_apertures: true
      disambiguate_characters:
      - 1/l/I
      - 0/O
      - B/8
      action: Design for degraded conditions and small sizes first.
  motion_and_sound:
    timing:
      avoid_quantized_feel: true
      preserve_silence: true
      action: Treat pauses, decay, and negative space as first-class design elements.
    audio_accessibility:
      no_autoplay_without_intent: true
      mute_path_required: true
      must_not_mask_speech: true
      must_not_conflict_with_screen_readers: true
      graceful_failure_required: true
      action: Sound is feedback, not surprise; silence must always be available.
    sonic_hierarchy:
      foreground: critical_state_change
      midground: interaction_confirmation
      background: ambience_or_texture
      action: Layer sounds like UI depth; avoid frequency and attention masking.
  data_visualization:
    data_ink_ratio_target: 1.0
    lie_factor_target: 1.0
    reject_chartjunk: true
    small_multiples_require_identical_scales: true
    sparklines_no_frames_or_ticks: true
    action: Remove non-data ink unless it adds comprehension.
  automated_css_analysis:
    # Each flag should name an enforcer. Flags without enforce: are guidance only.
    checks:
    - id: off_scale_line_height
      enforce: [LINE_HEIGHT_ON_SCALE, Pub4::ScaleLint]
    - id: absolute_line_height
      enforce: [LINE_HEIGHT_ON_SCALE, Pub4::ScaleLint]
    - id: measure_bounds
      enforce: [geometry_type worn_type.profiles]
    - id: hanging_list_markers
      enforce: [geometry_type check_hanging]
    - id: micro_typography
      enforce: [Design::Thresholds.micro_typography]
    - id: touch_target
      enforce: [TOUCH_TARGET_MIN]
    - id: eight_px_rhythm
      enforce: [surface_rules spacing scan, Pub4::ScaleLint]
    - id: chrome_i18n
      enforce: [Pub4::ChromeI18nLint]
    flag:
    - line length outside typography.line_length bounds
    - line height below typography.line_height.body_min for prose
    - off-scale unitless line-height not in typography.line_height.allowed
    - absolute px line-height on prose (prefer unitless; ScaleLint absolute_line_height)
    - continuous prose without max-width measure (66ch / var(--measure))
    - all caps without letter spacing
    - body text below 16px
    - contrast below WCAG AAA thresholds (7:1 body, 4.5:1 large)
    - more than two font families
    - more than three font weights
    - spacing off the 4px or 8px grid
    - touch targets below 44px
    - centered prose longer than three lines
    - justified text without hyphenation
    - prose missing orphans/widows 3
    - hyphenation without hyphenate-limit-chars 6 3 2
    - prose missing default OpenType kern/liga/clig/onum/pnum
    - body numerals not oldstyle-nums
    - tables missing tabular/lining numerals
    - heading hierarchy ratios below 1.2
    - font weight differences below 200
    - decorative chart ink that does not encode data
    - decorative UI elements that do not encode state, hierarchy, affordance, or tone
    - non-token spacing, radius, color, or typography values in generated UI
  ux_laws:
    fitts:
      target_min_px: 44
      target_recommended_px: 48
      primary_action_min_px: 48
      action: Flag interactive controls smaller than 44px; prefer 48px for primary actions.
    hick:
      max_visible_choices: 7
      nav_items_warn: 9
      action: Flag navigation or action groups with more than 7 peer choices without progressive disclosure.
    chunking:
      max_items_per_group: 7
      action: Group long lists; flag flat menus over 7±2 items.
    progressive_disclosure:
      require_advanced_hidden: true
      action: Advanced/secondary controls should start collapsed or on secondary surfaces.

  # Worn type — what the visitor sees, not what the stylesheet declares.
  # Reader: RAILS/gates/support/geometry_type.rb (and GeometryProbe TYPE_WALK).
  # MASTER/lib/design/thresholds.rb#worn_profile is the Ruby face.
  # A profile with no reader is inert; test_design_rules_worn_type.rb holds that.
  worn_type:
    type_scale_ratio: 1.25
    type_scale_tolerance_px: 1.5
    baseline_module_px: 4
    hanging_marker_max_inset_px: 0
    golden_split:
      min: 0.55
      max: 0.70
    profiles:
      feed:
        measure_min_ch: 35
        measure_max_ch: 55
        mobile_min_ch: 30
        mobile_max_ch: 50
        rhythm_off_max_pct: 25
        empty_min_pct: 20
        empty_max_pct: 75
        accents_max: 2
      catalog:
        measure_min_ch: 20
        measure_max_ch: 50
        rhythm_off_max_pct: 15
        empty_min_pct: 15
        empty_max_pct: 70
        accents_max: 2
        require_tabular_nums: true
      chat:
        measure_min_ch: 0
        measure_max_ch: 0
        rhythm_off_max_pct: 45
        empty_min_pct: 10
        empty_max_pct: 85
        accents_max: 2
      immersive:
        measure_min_ch: 0
        measure_max_ch: 0
        rhythm_off_max_pct: 40
        empty_min_pct: 8
        empty_max_pct: 90
        accents_max: 2
      map:
        measure_min_ch: 0
        measure_max_ch: 0
        label_min_px: 12
        rhythm_off_max_pct: 40
        empty_min_pct: 0
        empty_max_pct: 100
        accents_max: 2
      legal:
        measure_min_ch: 55
        measure_max_ch: 75
        rhythm_off_max_pct: 20
        empty_min_pct: 25
        empty_max_pct: 70
        accents_max: 1
      auth:
        measure_min_ch: 0
        measure_max_ch: 0
        rhythm_off_max_pct: 30
        empty_min_pct: 20
        empty_max_pct: 80
        accents_max: 2
    action: >
      Judge each surface under its profile. Count worn characters, computed
      sizes, baselines, tabular figures, accent hues, empty ratio, and
      main/aside split. Do not grep stylesheets for these.
  pixel_perfection:
    forbidden_css:
    - box-shadow
    - text-shadow
    - 'filter: blur'
    - backdrop-filter
    - glassmorphism
    - soft glow
    # The last two are the WebGL spellings of "soft glow". They belong in this
    # key because it is read into the design prompt, so the model is told the ban
    # rather than only scanned for it; FACE_POINT_IS_ONE_PIXEL and
    # NO_WEBGL_GLOW_PASS in law/javascript.rb are what enforce them.
    - additive second pass behind a point cloud
    - gl_PointSize above 1.0
    forbidden_patterns:
    - 'box-shadow\s*:'
    - 'text-shadow\s*:'
    - filter\s*:\s*[^;]*blur\s*\(
    - 'backdrop-filter\s*:'
    - 'text-shadow\s*:'
    forbid_arbitrary_radius_px_above: 16
    eight_px_rhythm:
    - 0
    - 4
    - 8
    - 12
    - 16
    - 20
    - 24
    - 32
    - 40
    - 48
    - 64
    - 96
    magic_color_hex_ban_inline: true
    image_smoothing_enabled: false
    exception_policy:
      allowed: true
      scope: single named component, not a blanket relaxation
      must_document_at_point_of_use: true
      must_state_reason: true
      action: A forbidden pattern may be used for one specific, named element when flatness
        would remove its only legible depth or affordance cue -- document the reason in
        a comment where the exception lives, the same way a one-off structural exception
        gets documented, rather than relaxing the rule generally or leaving it unexplained.
    action: 'Pixel-perfect flat UI: no blur/glow/shadow ornament; spacing on 8px rhythm; tokens over magic
      colors. Exceptions follow exception_policy -- scoped and documented, not silent.'
  rams_checklist:
    useful: Does this control or surface serve a concrete user goal?
    understandable: Is hierarchy and affordance obvious without decoration?
    unobtrusive: Does chrome recede so content leads?
    honest: Does UI state match system state without fake progress?
    thorough: Are empty, loading, error, and reduced-motion states designed?
    action: Score UI diffs against Rams criteria in council and aesthetic scan tags.

  # Family UI polish playbook — MASTER scanners + RAILS CI ratchets apply these.
  # Implemented 2026-07-31 polish waves; keep automated so re-introduction fails.
  ui_polish:
    default_locale: nb
    available_locales: [nb, en]
    chrome_i18n:
      action: >
        Shell and empty/search chrome must use I18n t() keys (empty.*, search.*,
        nav.*, auth.*). Hardcoded English "No …" titles and "Search …" placeholders
        are debt. Ratchet: RAILS/shared/lib/pub4/chrome_i18n_lint.rb (CI).
        Opt-out: <%# chrome_i18n: ok %> above the line.
      empty_partial: shared/empty_state
      empty_requires_action: true
      empty_cta_lint: RAILS/shared/lib/pub4/empty_state_lint.rb
      adhoc_empty_lint: RAILS/shared/lib/pub4/adhoc_empty_lint.rb
    space_not_lines:
      action: >
        List/grid cards separate with gap + surface elevation, not hairline
        box borders. Forms and CRT dialect (bsdports) may keep 1px borders.
        Prefer border: 0; background: var(--surface-elevated).
    type_tokens:
      action: >
        Page titles use var(--text-title, 1.25rem) and var(--font). Do not hardcode
        font-size: 20px for headers. Dialect fonts (Caprasimo luxury, JetBrains
        mono CRT) only on named brand surfaces.
      tokens:
        text_title: 1.25rem
        text_display: 1.75rem
        page_header_min_height: 48px
    flat_ui:
      action: >
        No ornamental box-shadow/text-shadow/backdrop-filter/filter blur.
        Floating chrome uses 1px border + elevated surface. GATE_AUTOFIX strips
        shadows. Exception policy under pixel_perfection.exception_policy.
    btn_aliases:
      action: >
        Family supports both btn-primary and btn--primary (and btn-ghost /
        btn--ghost). Empty-state CTAs should emit both class names.
    playbook_order:
      - strip_flat_ui_shadows
      - wire_empty_search_to_t
      - align_page_header_type_tokens
      - space_not_lines_list_cards
      - verify_empty_state_cta_lint
      - verify_chrome_i18n_lint
    action: >
      When polishing RAILS or MASTER/web UI, run this playbook. Prefer mechanical
      autofix + CI ratchets over one-off manual style. Never raise lint baselines
      to silence new debt.

# No operator_principles section here, and no standing orders anywhere in this
# file. Orders about how to work — sweep to convergence, run the gate yourself,
# one SSH session, restart after a deploy — are not properties of source text, so
# no detector can match one and this catalogue is the wrong registry for them.
# They are conduct rules in law/practice.rb, which PersonalityPromptBuilder#add_rules
# emits whole as master_style; filed here they were cut to 480 characters.
style:
  # Ruby, shell, and git style rules enforced by MASTER.
  # Scan rules reference these; Personality injects them into every LLM system prompt.
  # Authoritative upstream clones: script/clone_style_guides.sh → knowledge/style_guides/
  # Codified index: data/runtime.yml#style_guides (ruby/rails/js/css/seo gates)

  # Rules that are not about any one medium. line_order declares
  # applies_to: [ruby, yaml, erb, js, css, html, sh, md] — every medium this
  # repo writes — and sat inside the Ruby bucket declaring it; comment
  # discipline, identifier naming and the blank-line limit are the same shape.
  # Filed by language, applied everywhere: the bucket was the wrong axis.
  universal:

    comments_max_lines: 1           # class/module/method comments: 1 line or none
    comments_require_why: true      # only add when WHY is non-obvious (hidden constraint, workaround)
    comments_reassess_on_touch: true  # every edit re-reads each comment in the file: delete if obvious,
                             # rewrite Strunk-and-White style if kept (active voice, omit needless
                             # words, concrete verbs, one line). No grandfathered fluff.
    comments_forbidden:
      - what_comments      # never describe what the code does — identifiers do that
      - yard_doc_blocks    # no # Public:, # Returns, # param - style blocks
      - section_separators # no # ----, # ====, # ---- Public API ---- etc.
      - numbered_steps     # no # 1., # 2. inline step comments
      - multi_line_prose   # cut verbosity; one line survives, paragraph does not

    line_order_rule: "Inverted Pyramid — reorder lines/blocks so the most important content comes first."
    line_order_rationale: "Reader who stops at the top third still has the gist. Public API > primary behavior > helpers > privates > edge cases."
    line_order_sequence:
      - "frozen_string_literal + requires"
      - "module/class declaration + headline docstring (≤1 line)"
      - "public API methods, ordered by call-frequency / importance"
      - "primary algorithm or main loop"
      - "private helpers in order of dependency"
      - "constants and lookup tables (unless small enough to inline at top)"
      - "edge-case handlers, rescue branches, fallback paths"
    line_order_applies_to: [ruby, yaml, erb, js, css, html, sh, md]
    line_order_enforced_by: "sweep IMPORTANCE_ORDER technique; council Maintainer + Layperson personas"

    naming_spell_out: true        # no abbreviations: index not idx, signature not sig, temporary_path not tmp
    naming_paths_rule: "Rails-parameterized slug density — snake_case paths; each token a concrete noun or verb; Strunk omit needless words."
    naming_paths_inspired_by: "ActiveSupport::Inflector#parameterize (meaning and density, not hyphen separator)"
    naming_paths_format: snake_case
    naming_paths_max_tokens: 4
    naming_paths_forbidden_tokens: [main, misc, base, util, helper, handlers, handler, manager, service, object, thing, stuff, tmp, old, new, copy, final, v2, data, info]
    naming_paths_examples_good: [crawl_browser, domain_alignment_gate, browser_probe_support, operator_principles]
    naming_paths_examples_bad: [misc_util, cbp, foo_helper, main_base, util_service]
    naming_forbidden_abbreviations:
      - idx
      - sig
      - tmp
      - buf
      - val
      - ret
      - obj
      - str
      - arr
      - num
      - cnt
      - ptr
      - msg   # unless it IS the domain term (e.g., a Message object named msg is ok if short-lived)
    naming_rule: "Spell identifiers out. Domain names can be short (id, url, ip) — abbreviations cannot."

    blank_lines_max_consecutive: 1     # no double blank lines anywhere

  ruby:
    quotes: double  # always double-quoted strings; single only inside regex or '\1' backrefs
    frozen_string: true  # every .rb file must start with # frozen_string_literal: true

    bugs_to_avoid:
      - pattern: "Dir.chdir"
        reason: "process-wide; thread-unsafe in multi-threaded agents"
        fix: "pass -C root to git; expand paths with File.expand_path"

      - pattern: "Prism.parse(src, freeze: true)"
        reason: "freeze: kwarg dropped in Ruby 3.4"
        fix: "Prism.parse(src)"

      - pattern: "next if condition inside flat_map"
        reason: "next if returns nil into flat_map, producing nil entries in output"
        fix: "next [] if condition"

      - pattern: "rescue => e (multi-line bare rescue)"
        reason: "unclear; explicitly name StandardError for clarity"
        fix: "rescue StandardError => e"

      - pattern: "rescue nil (inline rescue returning nil)"
        reason: "inline rescue already catches StandardError; rescue nil is correct idiom"
        note: "do NOT change to rescue StandardError — that returns the class object, not nil"

      - pattern: "@bus&.publish(...) || value"
        reason: "when bus is present, returns bus result (truthy), masking the real value"
        fix: "call @bus&.publish(...) on its own line; return value separately"

      - pattern: "backtick shell commands with interpolation"
        reason: "shell injection risk"
        fix: "Open3.capture2e('cmd', '-flag', arg) with arg arrays"

      - pattern: "system/Open3 with string interpolation"
        reason: "shell injection risk"
        fix: "Open3.capture2e(*%w[cmd -flag], variable) with separate arguments"

      - pattern: "mutate state before publishing event that reads old state"
        reason: "event receives new state instead of previous state"
        fix: "capture prev = current before mutation; use prev in publish/return"

    prefer_string_methods_rule: "Prefer start_with? / include? / end_with? / split over regex when string methods suffice."
    prefer_string_methods_rationale: "Regex is expressive but noisy. Use it when patterns require it, not as a default."
    prefer_string_methods_prefer:
      - "str.start_with?(prefix)        over  str.match?(/^prefix/)"
      - "str.include?(substr)           over  str.match?(/substr/)"
      - "str.end_with?(suffix)          over  str.match?(/suffix$/)"
      - "str.split(sep, n)              over  str.scan(/pattern/)"
    prefer_string_methods_still_use_regex_for:
      - 'Character classes: /[a-z]/, /\d+/'
      - "Anchored multiline patterns"
      - "Alternation with more than 2 branches"

    outsource_to_gems_rule: "If a well-maintained gem solves the problem correctly, use it. Do not reimplement."
    outsource_to_gems_rationale: "Gems carry tests, edge cases, and maintenance. Home-grown duplicates carry bugs."
    outsource_to_gems_examples:
      - "flay for AST-level duplicate detection"
      - "reek for code smell analysis"
      - "rubocop for style enforcement"
      - "prism for Ruby parsing"
    outsource_to_gems_caveat: "Evaluate gem quality first: maintained, tested, minimal footprint."


  shell:
    decorations_forbidden:
      - "=== banner ===" # no ASCII section banners
      - "--- separator ---"
      - "*** header ***"
      - "emoji in print/echo output"  # no ✅ ❌ 🚀 etc. in scripts
      - "numbered step comments"      # no # Step 1:, # Phase 2: etc.

    credentials_forbidden: true  # never hardcode passwords/tokens in scripts

    prefer:
      - "pure zsh parameter expansion over external tools (see zsh_patterns.yml)"
      - "Open3.capture2e with arg arrays in Ruby over shell interpolation"
      - "File.expand_path over pwd + concatenation"
      - "print -r -- \"$(<file)\" to read files in zsh (not cat, not bare < file via SSH — triggers pager)"
      - "lines=(\"${(@f)$(<file)}\") for line arrays; last 50: print -l $lines[-50,-1]"

  git:
    commit_style_voice: active           # "Fix bug" not "Fixed bug", "Add feature" not "Added feature"
    commit_style_format: "type: short summary\n\nBody if needed."
    commit_style_subject_max: 72
    commit_style_no_what_if_diff_shows: true  # don't describe what changed if the diff makes it obvious
    commit_style_separate_concerns: true      # don't mix bug fixes with style changes in one commit

    forbidden:
      - "Dir.chdir in Ruby before git commands"
      - "string-interpolated git commands"
      - "rm -rf in deploy scripts without explicit guard"

  # No operator directives under style: — they are conduct rules in law/practice.rb.
  # The block that stood here duplicated this file's own ruby.comments.reassess_on_touch
  # and html/css sections.

  erb:
    html_safe: explicit_only_after_sanitize
    partials: locals_over_instance_variables
    content_for: [title, description, head, json_ld, widgets, scripts]
    helpers: [tag, class_names, dom_id, sanitize]
    forbidden: [raw_user_html_safe, heredoc_views, inline_script_blocks, bem_classes, utility_class_soup]
    on_edit:
      - flatten_if_divitis
      - extract_repeated_to_partial
      - wire_i18n_for_literals
      # Family polish (design_rules.ui_polish / MASTER/docs/UI_POLISH_PLAYBOOK.md)
      - strip_flat_ui_shadows
      - wire_empty_search_to_t
      - align_page_header_type_tokens
      - space_not_lines_list_cards

  # Conversation directives — how MASTER addresses the user. Operator_directives
  # above shape MASTER's coding work; these shape its dialogue, voice, and
  # social register. Personality injects them verbatim into the system prompt.
  conversation_directives:
    - "Track what the user already knows; don't restate background they've established this session."
    - "Use the user's name when they've shared it; never invent one."
    - "When the user asks X, surface adjacent Y they likely also want — don't wait to be asked."
    - "Mirror the user's politeness register; terse to terse, formal to formal, profane to profane."
    - "When uncertain about intent, ask one focused question instead of guessing and acting."
    - "After a heavy exchange, respect silence; don't fill space with unprompted new threads."
    - "Note relational milestones in memory: first share of X, breakthroughs, recurring concerns."
    - "Disagree gracefully and concretely; never sycophantically agree to keep rapport."
    - "Calibrate humor to the user's register; never humor a tense moment."
    - "When looping the same point, acknowledge it; don't restate."
    - "Trust differs by domain: high in OpenBSD/Ruby, lower in subjective UI/voice calls — say so."

  # html, css, typography, nielsen, a11y — restored from master4.yml/master7.yml
  # (universal_quality_framework v66)

  html:
    semantic_only: true
    bare_tag_targeting: true        # nav a not .nav__link; section, article, aside, etc.
    forbidden:
      - divitis                     # no excessive nesting; no styling-only divs
      - class_attribute_when_tag_targetable
      - non_semantic_markup
      - copy_paste_html
      - framework_class_explosion   # no class="row col-md-6 mt-4 px-2 d-flex" soup
    landmarks:
      - header
      - nav
      - main
      - article
      - section
      - aside
      - footer
    forms_label_required: every input has a label
    forms_input_type_specific: email/url/tel/date — never bare type=text
    forms_autocomplete: "set autocomplete on every meaningful input"

  css:
    targeting: bare_tag_first        # tag selectors > attribute selectors > id; class only when nothing else fits
    layer_order: [base, components, utilities]
    custom_properties: ":root with --safe-top, --safe-right, --safe-bottom, --safe-left"
    units_length: rem                    # px only for borders <2px and 1px hairlines
    units_typography: "rem with clamp() for fluid type"
    # Was "rem multiples of .25 (4px grid)" -- silently allowed 28/36/44/52/
    # 56/60px, which design_rules.yml's eight_px_rhythm (the rule real code
    # actually enforces, per Master::Design::Thresholds) rejects. Matches
    # design_rules.yml now instead of a looser, unenforced rule of its own.
    units_spacing: "design_rules.yml pixel_perfection.eight_px_rhythm: 4/8/12/16/20/24/32/40/48/64/96px only"
    forbidden:
      - "!important except for utility overrides"
      - inline_style_attributes
      - vendor_prefixes_in_2026     # autoprefixer or skip
      - framework_class_bloat
    perf_content_visibility: "auto on long-scroll sections"
    perf_will_change: "only when actually animating, then remove"

  typography:
    style: swiss                     # objective, hierarchical, generous whitespace
    # Was "Helvetica, Arial, system-ui, sans-serif" -- didn't match either
    # design_rules.yml's stated default (Inter) or what the RAILS apps
    # actually ship (shared/_dialect_tokens.scss's real stack, below). Synced to
    # the real shipped stack rather than picking a third, different value.
    families_sans: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'
    families_mono: "ui-monospace, Menlo, Consolas, monospace"
    scale_base: 16px
    scale_ratio: 1.25                    # major-third
    leading: 1.5                     # body
    measure: 65ch                    # ideal line length
    rules:
      - "one type family per surface (mono OR sans, not both unless purposeful)"
      - "size hierarchy via scale — never arbitrary px values"
      - "color contrast >= WCAG 2.2 AAA on body text (7:1)"
      - "tracking: tighten display, loosen all-caps (.08em)"
      - "no centered body copy; left-align for left-to-right languages"

  accessibility:
    # Body text earns AAA in both modes (12.51:1 dark, 16.26:1 light, measured
    # 2026-08-03). The secondary/accent tier does not, and saying "AAA" flatly made
    # a blanket claim the palette has never met. The live number is a ceiling in
    # RAILS/gates/data/css_budget.yml (contrast_below_aa / contrast_below_aaa) so it
    # falls rather than drifts; design_rules.yml keeps 7.0 as the target it moves toward.
    target: wcag_2_2_aa_with_aaa_body_text
    requirements:
      - keyboard_navigation_complete
      - focus_visible_always
      - aria_only_when_html_insufficient
      - reduced_motion_respected         # @media (prefers-reduced-motion: reduce)
      - color_scheme_respected           # @media (prefers-color-scheme: dark)
      - color_not_only_signal
      - text_resizable_to_200pct
      - skip_to_main_link
      - alt_text_meaningful_or_empty
    forbidden:
      - tabindex_above_zero
      - autoplay_media_with_sound
      - removing_focus_outline_without_replacement
      - text_in_images_for_meaning

  parametric_design:
    principle: "components vary along measured axes (density, scale, contrast) — not by copy-paste variants"
    examples:
      - "spacing: --gap-{xs,sm,md,lg,xl} = .25/.5/1/2/4 rem"
      - "color: oklch with hue/chroma/lightness vars; light+dark via lightness flip"
      - "type: clamp(min, fluid, max) per scale step, no per-breakpoint overrides"

  cultural_sensitivity:
    text_direction: "honor dir=rtl; mirror layouts; logical properties (margin-inline-start)"
    locale_specific: "use Intl.DateTimeFormat / NumberFormat; never assume MM/DD/YYYY"
    color_meaning: "red=danger is Western; verify per locale"
    imagery: "diverse representation; avoid culture-specific idioms in core UI"
# The Rails stack this fleet runs. Lifted out of style.ruby on 2026-08-22:
# versions, gem APIs and StimulusReflex patterns are stack truth, not a style
# rule, and burying them under style.ruby put 58 of the file's leaf values
# three and four levels deep inside a block about how to write Ruby.
rails_stack:
  # Current stable versions (May 2026)
  rails: "8.1.3.1"
  turbo_rails: "2.0.23"    # 9 actions: append prepend before after replace update remove morph refresh
  stimulus: "3.x"          # static targets, values, outlets API
  pagy: "43.x"             # Pagy::OPTIONS (not Pagy::DEFAULT — redesigned API in 43.0)
  stimulus_reflex: "3.5"   # complementary to Turbo; opt-in only for advanced reactive features

  asset_pipeline: propshaft  # default in Rails 8; do not use Sprockets
  javascript: importmap      # default; esbuild only when CSS-in-JS components needed
  queue: solid_queue         # SQLite-backed by default
  cache: solid_cache         # SQLite-backed by default
  cable: solid_cable         # SQLite-backed by default

  authentication: "rails generate authentication"  # built-in, no devise
  database: sqlite3          # default; PostgreSQL only when explicitly required

  pagy_api:
    backend:  "include Pagy::Backend"   # in ApplicationController
    frontend: "include Pagy::Frontend"  # in ApplicationHelper
    options:  "Pagy::OPTIONS[:limit] = 25"  # NOT Pagy::DEFAULT (that was 8.x)
    overflow: "Pagy::OPTIONS[:overflow] = :last_page"

  turbo_stream_actions:
    - append
    - prepend
    - before
    - after
    - replace
    - update
    - remove
    - morph   # morphs DOM — preserves element state; opt-in via data-turbo-permanent
    - refresh  # triggers full page refresh with morphing

  stimulus_api:
    targets: "static targets = [\"name\"]"       # auto-generates nameTarget, nameTargets, hasNameTarget
    values:  "static values = { url: String }"   # auto-generates urlValue, hasUrlValue, urlValueChanged
    outlets: "static outlets = [\"other\"]"      # cross-controller communication
    lifecycle: [connect, disconnect, initialize]  # + nameTargetConnected/Disconnected

  stimulus_components:
    source: "https://stimulus-components.com"
    install: "bin/importmap pin @stimulus-components/<name>"
    available:
      - { name: character-counter, use: "post/comment character limits" }
      - { name: clipboard, use: "copy URL/code to clipboard" }
      - { name: dialog, use: "modal dialogs, confirmations" }
      - { name: dropdown, use: "nav menus, user menus" }
      - { name: notification, use: "toast alerts" }
      - { name: carousel, use: "image galleries, product photos" }
      - { name: sortable, use: "drag-reorder lists" }
      - { name: rails-nested-form, use: "dynamic has-many form fields" }
      - { name: password-visibility, use: "show/hide password toggle" }

  # Default StimulusReflex stack — Julian Rubisch's pattern set.
  # Install for every new Rails 8 + StimulusReflex 3.5 app unless explicitly opted out.
  stimulus_reflex_stack:
    cubism:                 "resource-scoped presence (who's-here, typing indicators) over Kredis"
    futurism:               "lazy-load expensive list rows; futurize(@record) placeholder + IntersectionObserver"
    optimism:               "real-time ActiveModel validation broadcast as selector morphs (drop-in)"
    all_futures:            "Redis-backed virtual ActiveModel for facets/wizards without session bloat"
    solder:                 "auto-cache <details>/accordion open state per [user, key]"
    cable_ready_callbacks:  "after_create_commit / after_update_commit CableReady DSL on AR models"

  stimulus_reflex_patterns:
    morph_heuristics:
      page_morph:     "spans multiple regions OR want regular controller render. Always scope with data-reflex-root."
      selector_morph: "single element, side-stepping the controller. Inline edit, list-item update, validation hint."
      nothing_morph:  "no DOM patch — only CableReady ops or dispatch_event to a Stimulus controller."
    tool_choice: "Turbo for anything covered by an HTTP verb (navigation, forms). StimulusReflex for everything else."
    cable_ready_ops:
      morph:                "list bodies — pass children_only: true"
      inner_html:           "form reset (morph won't clear inputs)"
      insert_adjacent_html: "infinite scroll, append-only feeds"
      outer_html:           "Futurism replacement, inline-edit toggle"
      dispatch_event:       "nothing morphs that kick a Stimulus controller"
      add_css_class:        "validation hints (Optimism-style)"
      set_focus:            "post-edit UX"
    anti_patterns:
      - "mutating state via GET — REST violation"
      - "hidden form + Turbo Stream for state — flickers; SR fits better"
      - "inline render in reflex — always partials/components, never heredocs"
      - "overusing connect lifecycle — prefer Outlets and useIntersection"
      - "morph to clear form inputs — use inner_html"
      - "class attributes where a tag selector works"
      - "hardcoded step counts in wizards"
      - "session-backed wizard state on multi-server — use kredis or all_futures"
    named_patterns:
      infinite_scroll:    "InfiniteScrollReflex#load_more + sentinel div + insert_adjacent_html before sentinel"
      inline_edit:        "ToggleReflex toggles show ↔ edit partial via selector morph"
      wizard:             "WizardReflex#step dispatching on @current_step; state in kredis or all_futures"
      nested_form:        "NestedFormReflex#add_fields uses .build + fields_for; needs accepts_nested_attributes_for"
      validation_inline:  "Optimism + debounced:input event (not raw input — prevents flooding)"
      autosave:           "Submittable concern; before_reflex branches create/update via element.dataset.signed_id"

  core_web_vitals:
    lcp: "<2.0s"   # Largest Contentful Paint (tightened from 2.5s in March 2026)
    inp: "responsive"  # Interaction to Next Paint
    cls: "< 0.1"   # no layout shifts — set explicit width/height on images and embeds
    font_display: "swap"  # font-display: swap in all font-face rules

  rubocop_omakase:
    quotes: double       # double-quoted strings everywhere in app/
    hash_syntax: modern  # { a: :b } not { :a => :b }
    trailing_commas: true  # in multi-line arrays/hashes/arguments
    method_calls: "Foo.method not Foo::method"
    test_assertions: "assert_not not assert !"

  realtime_hierarchy:
    - "Turbo Drive — full-page navigation"
    - "Turbo Frames — scoped page updates"
    - "Turbo Streams — server-push DOM operations"
    - "Stimulus — client-side interactivity"
    - "StimulusReflex — opt-in for advanced RPC reactive features"

