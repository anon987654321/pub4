    # How this house draws dimension. Applies to every surface in every tree --
    # MASTER's face, brgen's radio tunnel, and anything either of them grows into.
    #
    # The illusion is carried by MOTION, not by shading. A field of flat points,
    # each one a screen-space sprite, reads as a solid volume the moment it rotates
    # coherently: the eye reconstructs the form from parallax alone. That is the
    # kinetic depth effect, demonstrated by Wallach and O'Connell in 1953, and it is
    # the whole technique. There is no lighting model to get wrong because there is
    # no surface to light.
    #
    # This is a house style AND the cheap answer, which is why it is a rule rather
    # than a preference. A point cloud needs one vertex buffer, a vertex shader that
    # projects and sets gl_PointSize, and a fragment shader that draws a soft dot.
    # A mesh renderer needs a scene graph, a material system and blend modes -- which
    # is most of what a 3D library is, and is why the face carries a patched THREE
    # build whose patch nobody wrote down.
  - id: KINETIC_DEPTH
    name: Depth comes from motion, never from shaded surfaces
    tier: design
    severity: warning
    autofix: true
    config:
      technique: point_cloud
      principle: >-
        Depth is implied by coherent motion, never by shaded surfaces. Flat 2D
        points that move together read as one solid volume; this is the kinetic
        depth effect and it is the house way of drawing dimension.
      depth_cues:
        - parallax_under_rotation
        - point_size_attenuation_with_distance
        - brightness_and_alpha_falloff
        - density
      forbidden:
        - lit_meshes
        - material_systems
        - per_surface_shading
      renderer: raw_webgl_points
      action: >-
        Draw dimension as a field of projected points. Reach for gl.POINTS and two
        short shaders before reaching for a 3D library, and never introduce a
        scene graph to solve a problem a point cloud already solves.
      exceptions: >-
        MASTER's face still uses THREE for its wireframe mesh. That is history
        rather than intent, and the migration path is already open --
        web/public/particle_kernel.js calls itself the Pixel Field kernel and says
        it exists to replace ad-hoc particle loops in face, codebase and ecology one
        at a time. It is 2D today: its cells carry x, y, vx, vy and no z, and it
        draws through getContext("2d"). Adding a depth axis and a gl.POINTS
        renderer is the work; rewriting a mesh by hand is not.
      already_correct: >-
        brgen's radio tunnel (app/javascript/radio_brgen_tunnel.js) is raw WebGL
        with a 2D fallback and no library at all. It is the reference
        implementation, not the exception.
      constraint_that_still_holds: >-
        Deferred WebGL boot is sacred (DECISIONS.md). A point cloud is cheaper than
        a mesh, which makes the primer gate easier to honour, not optional.
  - id: VISUAL_DESIGN
    name: Semantics, syntactics and pragmatics of a surface
    tier: design
    severity: warning
    autofix: true
    config:
      semantics:
        reject_arbitrary_decoration: true
        action: Every ornament must communicate state, hierarchy, affordance, or tone.
      syntactics:
        enforce_visual_grammar: true
        action: Reuse spacing, color, radius, and type tokens consistently.
      pragmatics:
        must_be_understandable: true
        action: Prefer self-explanatory affordances over clever ambiguity.
      rams:
        useful: true
        understandable: true
        unobtrusive: true
        honest: true
        thorough: true
        action: Score design changes against Dieter Rams-style usefulness and honesty.
      font_personality:
        traditional_trustworthy: serif
        modern_innovative: geometric_sans
        accessible_interface: humanist_sans
        impact: bold_display
        action: Match typography mood to content rather than trend.
      screen_legibility:
        prefer_high_x_height: true
        prefer_open_apertures: true
        disambiguate_characters:
        - 1/l/I
        - 0/O
        - B/8
        action: Design for degraded conditions and small sizes first.
  - id: MOTION_AND_SOUND
    name: Motion timing and sonic hierarchy
    tier: design
    severity: warning
    autofix: true
    config:
      timing:
        avoid_quantized_feel: true
        preserve_silence: true
        action: Treat pauses, decay, and negative space as first-class design elements.
      audio_accessibility:
        no_autoplay_without_intent: true
        mute_path_required: true
        must_not_mask_speech: true
        must_not_conflict_with_screen_readers: true
        graceful_failure_required: true
        action: Sound is feedback, not surprise; silence must always be available.
      sonic_hierarchy:
        foreground: critical_state_change
        midground: interaction_confirmation
        background: ambience_or_texture
        action: Layer sounds like UI depth; avoid frequency and attention masking.
  - id: DATA_VISUALIZATION
    name: Honest encoding limits for charts
    tier: design
    severity: warning
    autofix: true
    config:
      data_ink_ratio_target: 1.0
      lie_factor_target: 1.0
      reject_chartjunk: true
      small_multiples_require_identical_scales: true
      sparklines_no_frames_or_ticks: true
      action: Remove non-data ink unless it adds comprehension.
  - id: AUTOMATED_CSS_ANALYSIS
    name: What an automated CSS pass must measure
    tier: design
    severity: warning
    autofix: true
    config:
      # Each flag should name an enforcer. Flags without enforce: are guidance only.
      checks:
      - id: off_scale_line_height
        enforce: [LINE_HEIGHT_ON_SCALE, Operator::ScaleLint]
      - id: absolute_line_height
        enforce: [LINE_HEIGHT_ON_SCALE, Operator::ScaleLint]
      - id: measure_bounds
        enforce: [geometry_type worn_type.profiles]
      - id: hanging_list_markers
        enforce: [geometry_type check_hanging]
      - id: micro_typography
        enforce: [Design::Thresholds.micro_typography]
      - id: touch_target
        enforce: [TOUCH_TARGET_MIN]
      - id: eight_px_rhythm
        enforce: [surface_rules spacing scan, Operator::ScaleLint]
      - id: chrome_i18n
        enforce: [Operator::ChromeI18nLint]
      flag:
      - line length outside typography.line_length bounds
      - line height below typography.line_height.body_min for prose
      - off-scale unitless line-height not in typography.line_height.allowed
      - absolute px line-height on prose (prefer unitless; ScaleLint absolute_line_height)
      - continuous prose without max-width measure (66ch / var(--measure))
      - all caps without letter spacing
      - body text below 16px
      - contrast below WCAG AAA thresholds (7:1 body, 4.5:1 large)
      - more than two font families
      - more than three font weights
      - spacing off the 4px or 8px grid
      - touch targets below 44px
      - centered prose longer than three lines
      - justified text without hyphenation
      - prose missing orphans/widows 3
      - hyphenation without hyphenate-limit-chars 6 3 2
      - prose missing default OpenType kern/liga/clig/onum/pnum
      - body numerals not oldstyle-nums
      - tables missing tabular/lining numerals
      - heading hierarchy ratios below 1.2
      - font weight differences below 200
      - decorative chart ink that does not encode data
      - decorative UI elements that do not encode state, hierarchy, affordance, or tone
      - non-token spacing, radius, color, or typography values in generated UI
  - id: UX_LAWS
    name: Fitts, Hick and progressive disclosure limits
    tier: design
    severity: warning
    autofix: true
    config:
      fitts:
        target_min_px: *touch_min_px
        target_recommended_px: *touch_recommended_px
        primary_action_min_px: *touch_recommended_px
        action: Flag interactive controls smaller than 44px; prefer 48px for primary actions.
      hick:
        max_visible_choices: 7
        nav_items_warn: 9
        action: Flag navigation or action groups with more than 7 peer choices without progressive disclosure.
      chunking:
        max_items_per_group: 7
        action: Group long lists; flag flat menus over 7±2 items.
      progressive_disclosure:
        require_advanced_hidden: true
        action: Advanced/secondary controls should start collapsed or on secondary surfaces.

    # Worn type — what the visitor sees, not what the stylesheet declares.
    # Reader: RAILS/gates/support/geometry_type.rb (and GeometryProbe TYPE_WALK).
    # MASTER/lib/design/thresholds.rb#worn_profile is the Ruby face.
    # A profile with no reader is inert; test_design_rules_worn_type.rb holds that.
  - id: WORN_TYPE
    name: Per-surface type profiles and their tolerances
    tier: design
    severity: warning
    autofix: true
    config:
      type_scale_ratio: 1.25
      type_scale_tolerance_px: 1.5
      baseline_module_px: 4
      hanging_marker_max_inset_px: 0
      golden_split:
        min: 0.55
        max: 0.70
      profiles:
        feed:
          measure_min_ch: 35
          measure_max_ch: 55
          mobile_min_ch: 30
          mobile_max_ch: 50
          rhythm_off_max_pct: 25
          empty_min_pct: 20
          empty_max_pct: 75
          accents_max: 2
        catalog:
          measure_min_ch: 20
          measure_max_ch: 50
          rhythm_off_max_pct: 15
          empty_min_pct: 15
          empty_max_pct: 70
          accents_max: 2
          require_tabular_nums: true
        chat:
          measure_min_ch: 0
          measure_max_ch: 0
          rhythm_off_max_pct: 45
          empty_min_pct: 10
          empty_max_pct: 85
          accents_max: 2
        immersive:
          measure_min_ch: 0
          measure_max_ch: 0
          rhythm_off_max_pct: 40
          empty_min_pct: 8
          empty_max_pct: 90
          accents_max: 2
        map:
          measure_min_ch: 0
          measure_max_ch: 0
          label_min_px: 12
          rhythm_off_max_pct: 40
          empty_min_pct: 0
          empty_max_pct: 100
          accents_max: 2
        legal:
          measure_min_ch: 55
          measure_max_ch: 75
          rhythm_off_max_pct: 20
          empty_min_pct: 25
          empty_max_pct: 70
          accents_max: 1
        auth:
          measure_min_ch: 0
          measure_max_ch: 0
          rhythm_off_max_pct: 30
          empty_min_pct: 20
          empty_max_pct: 80
          accents_max: 2
      rag:
        inspect_from_lines: 5
        extreme_last_line_ratio: 0.12
      action: >
        Judge each surface under its profile. Count worn characters, computed
        sizes, baselines, tabular figures, accent hues, empty ratio, and
        main/aside split. Do not grep stylesheets for these.
  - id: PIXEL_PERFECTION
    name: Forbidden CSS, the 8px rhythm and its exception policy
    tier: design
    severity: warning
    autofix: true
    config:
      forbidden_css:
      - box-shadow
      - text-shadow
      - 'filter: blur'
      - backdrop-filter
      - glassmorphism
      - soft glow
      # The last two are the WebGL spellings of "soft glow". They belong in this
      # key because it is read into the design prompt, so the model is told the ban
      # rather than only scanned for it; FACE_POINT_IS_ONE_PIXEL and
      # NO_WEBGL_GLOW_PASS in law/javascript.rb are what enforce them.
      - additive second pass behind a point cloud
      - gl_PointSize above 1.0
      forbidden_patterns:
      - 'box-shadow\s*:'
      - 'text-shadow\s*:'
      - filter\s*:\s*[^;]*blur\s*\(
      - 'backdrop-filter\s*:'
      forbid_arbitrary_radius_px_above: 16
      # Same list as layout_rules.grid.allowed_spacing_px — one axis, one
      # spelling. 44 is tap_min; the name says eight, but 4, 12, 20 and 44
      # are on the 4px grid too.
      eight_px_rhythm: *eight_px_rhythm
      magic_color_hex_ban_inline: true
      image_smoothing_enabled: false
      exception_policy:
        allowed: true
        scope: single named component, not a blanket relaxation
        must_document_at_point_of_use: true
        must_state_reason: true
        action: A forbidden pattern may be used for one specific, named element when flatness
          would remove its only legible depth or affordance cue -- document the reason in
          a comment where the exception lives, the same way a one-off structural exception
          gets documented, rather than relaxing the rule generally or leaving it unexplained.
      action: 'Pixel-perfect flat UI: no blur/glow/shadow ornament; spacing on 8px rhythm; tokens over magic
        colors. Exceptions follow exception_policy -- scoped and documented, not silent.'
  - id: RAMS_CHECKLIST
    name: Rams' ten principles as a ship checklist
    tier: design
    severity: warning
    autofix: true
    config:
      useful: Does this control or surface serve a concrete user goal?
      understandable: Is hierarchy and affordance obvious without decoration?
      unobtrusive: Does chrome recede so content leads?
      honest: Does UI state match system state without fake progress?
      thorough: Are empty, loading, error, and reduced-motion states designed?
      action: Score UI diffs against Rams criteria in council and aesthetic scan tags.

    # Family UI polish playbook — MASTER scanners + RAILS CI ratchets apply these.
    # Implemented 2026-07-31 polish waves; keep automated so re-introduction fails.
  - id: UI_POLISH
    name: Locale coverage, empty states and flat-UI vocabulary
    tier: design
    severity: warning
    autofix: true
    config:
      default_locale: nb
      available_locales: [nb, en]
      chrome_i18n:
        action: >
          Shell and empty/search chrome must use I18n t() keys (empty.*, search.*,
          nav.*, auth.*). Hardcoded English "No …" titles and "Search …" placeholders
          are debt. Ratchet: RAILS/shared/lib/operator/chrome_i18n_lint.rb (CI).
          Opt-out: <%# chrome_i18n: ok %> above the line.
        empty_partial: shared/empty_state
        empty_requires_action: true
        empty_cta_lint: RAILS/shared/lib/operator/empty_state_lint.rb
        adhoc_empty_lint: RAILS/shared/lib/operator/adhoc_empty_lint.rb
      space_not_lines:
        action: >
          List/grid cards separate with gap + surface elevation, not hairline
          box borders. Forms and CRT dialect (bsdports) may keep 1px borders.
          Prefer border: 0; background: var(--surface-elevated).
      type_tokens:
        action: >
          Page titles use var(--text-title, 1.25rem) and var(--font). Do not hardcode
          font-size: 20px for headers. Dialect fonts (Caprasimo luxury, JetBrains
          mono CRT) only on named brand surfaces.
        tokens:
          text_title: 1.25rem
          text_display: 1.75rem
          page_header_min_height: 48px
      flat_ui:
        action: >
          No ornamental box-shadow/text-shadow/backdrop-filter/filter blur.
          Floating chrome uses 1px border + elevated surface. GATE_AUTOFIX strips
          shadows. Exception policy under pixel_perfection.exception_policy.
      btn_aliases:
        action: >
          Family supports both btn-primary and btn--primary (and btn-ghost /
          btn--ghost). Empty-state CTAs should emit both class names.
      playbook_order:
        - strip_flat_ui_shadows
        - wire_empty_search_to_t
        - align_page_header_type_tokens
        - space_not_lines_list_cards
        - verify_empty_state_cta_lint
        - verify_chrome_i18n_lint
      action: >
        When polishing RAILS or MASTER/web UI, run this playbook. Prefer mechanical
        autofix + CI ratchets over one-off manual style. Never raise lint baselines
        to silence new debt.

  - id: PWA
    name: Offline-first, data agency and native-grade motion
    tier: design
    severity: warning
    autofix: true
    config:
      philosophy:
        performance_is_the_design: true
        offline_is_a_designed_state: true
        radical_lightness: true
        action: Treat speed, the offline state, and data cost as design surfaces, not
          engineering afterthoughts. The apps already ship a manifest, a service worker
          and offline controllers; the budget is what is missing.
      weight:
        ceiling_lives_in: RAILS/gates/data/, in the css_budget.yml ratchet shape —
          a number measured from a real run that only ever ratchets down.
        measured_2026_08_31: tracked application.css is 204KB brgen, 110KB amber,
          64KB bsdports. JS builds are gitignored (RAILS/*/public/assets/), so only
          the CSS is reproducible outside a build.
        action: Set a ceiling from a run of this tree, never from another product's
          published figure — Pinterest's 150KB and Tinder's 20KB CSS describe their
          trees, not this one, and a ceiling nothing measured is a wish. A budget
          nothing enforces is a comment.
      offline_first:
        queue_writes_for_background_sync: true
        cache_read_paths: true
        design_the_disconnected_screen: true
        action: The network-loss state earns the same care as the happy path. Starbucks
          fills a cart offline and sends it on reconnect; Trivago answers a dropped
          connection with a branded playable maze rather than an error.
      user_agency_over_data:
        honour_save_data_header: true
        placeholder_before_full_asset: true
        state_the_cost_before_the_download: true
        action: Let the reader decide when to spend data, and say what it costs first.
          Twitter Lite renders 1KB blurred thumbnails and fetches the full asset on tap.
      native_grade_motion:
        target_fps: 60
        virtualize_long_feeds: true
        optimistic_render_from_cache: true
        action: Render only the visible slice of a feed, and paint a detail view from
          cached data before the fetch returns, so navigation never shows a spinner.
  # No operator_principles section here, and no standing orders anywhere in this
  # file. Orders about how to work — sweep to convergence, run the gate yourself,
  # one SSH session, restart after a deploy — are not properties of source text, so
  # no detector can match one and this catalogue is the wrong registry for them.
  # They are conduct rules in law/practice.rb, which PersonalityPromptBuilder#add_rules
  # emits whole as master_style; filed here they were cut to 480 characters.
prose:
  en:
    spoken_in: '.'
    file_languages: [markdown, ruby]
    # Where the language is written inside those files. English here is the
    # prose in comments, so the detector has to skip the code around them;
    # `values` reads a locale file, where the strings are the prose and the keys
    # are not.
    reads: comments
    ids:
      qualifiers: PROSE_OMIT_QUALIFIERS
      passive: PROSE_ACTIVE_VOICE
    fixtures:
      qualifiers: { bad: '# This is very fast.', good: '# This is fast.' }
      passive:
        bad: '# The bug was fixed by the maintainer.'
        good: '# The maintainer fixed the bug.'
    # `actually` and `literally` are absent on purpose. Both read as leeches
    # and neither is one here: they are contrastive, setting what is against
    # what was claimed, which is this repo's recurring subject. 85 and 4 hits
    # respectively, every one of them that use.
    leeches: [very, rather, really, quite, pretty, somewhat, just, basically, simply]
    keep:
      - 'rather than'                              # a contrast, not a degree
      - 'rather\s*$'                               # "rather than" wrapped mid-phrase
      - 'just (?:as|because|before|after|when)'    # a comparison
      - '(?:not|never)\s+(?:just|simply|only)'     # a negation
      - 'n''t\s+(?:just|simply|only)'
      # English past participles are not all -ed, and the temporal sense is the
      # commonest one this tree uses: "what you just wore", "the first response
      # just set", "a profile they had just seen".
      - 'just\s+(?:been\s+)?(?:\w+ed|wore|worn|set|sent|seen|written|wrote|read|made|got|put|left|took|taken|came|went|said|found|ran|saw|built|began|gave|given|held|kept|lost|met|paid|ran|shown|told|thought)'
      # English past participles are not all -ed. "a profile they had just seen",
      # "the line was just written", "had just been sent" are all the temporal
      # sense, and an auxiliary in front of `just` is what marks it.
      - '(?:had|has|have|was|were)\s+just\s+(?:been\s+)?\w+'
      - '(?:the|this|that|its) very'               # a determiner picking a thing out
      # Measured against Dilla's 138-file historical corpus. `just` before a position or a quantity
      # measures rather than minimises — "pads land just under the kit", "just
      # enough to stop the DC step popping", "harmonics from the content just
      # below the cliff".
      - 'just\s+(?:enough|about|above|below|over|under|short|past|now|then)'
      # `quite` after a negation means fully, so cutting it says the opposite:
      # "the piano body GM never quite nails" would become a claim that GM never
      # nails it at all.
      - '(?:not|never|n''t|hardly)\s+(?:quite|really)'
      - 'simply because'                           # a cause, not a manner
      # An adverb modifies the next word across a space. `pretty-printed` is one
      # word and the rule's sense of `pretty` is not in it.
      - '\bpretty-\w'
    passive:
      auxiliary: '(?:was|were|been)'
      participle: '(?:\w+ly\s+)?\w+ed'
      # `by` marks an agent here, but the same word marks a manner: "tuned by
      # feel", "transcribed by ear", "measured by hand". Those say how the thing
      # was done rather than who did it, and there is no active voice to move
      # them to — "feel tuned the sigma" is not a sentence.
      agent: 'by(?!\s+(?:ear|feel|hand|eye|design|accident|default|mistake|now|then)\b)'
  nb:
    # Bokmål reaches the tree through the Rails locale files and nowhere else;
    # every comment in the repo is English. Scoped there, `bare` is Norwegian.
    spoken_in: '(?:\A|[/.])nb\.yml\z'
    file_languages: [yaml]
    reads: values
    ids:
      qualifiers: PROSE_OMIT_QUALIFIERS_NB
      passive: PROSE_ACTIVE_VOICE_NB
    fixtures:
      qualifiers:
        bad: 'tittel: Dette er veldig raskt'
        good: 'tittel: Dette er raskt'
      passive:
        bad: 'notis: Feilen ble rettet av vedlikeholderen'
        good: 'notis: Vedlikeholderen rettet feilen'
    # `egentlig` and `faktisk` are held out for the same reason `actually` is:
    # both mark a contrast with what was assumed rather than grading anything.
    #
    # `bare` is held out on measured evidence. It reads as English `just` and
    # carries the same split, but in this tree the restrictive sense is the only
    # one present: all 11 hits were "du kan bare slette dine egne kommentarer",
    # "bare medlemmer poster", "Dating er bare for voksne". Bokmål has no other
    # word for that "only", so deleting it inverts the sentence — the copy stops
    # saying what a reader may not do. English `just` keeps its place because
    # the merely sense does appear there; here it does not.
    leeches: [veldig, svært, ganske, nokså, temmelig, virkelig, simpelthen]
    keep:
      - 'heller enn'          # rather than
      - 'ikke bare'           # not only
    # Bokmål builds the periphrastic passive with bli/ble/blitt and marks the
    # agent with `av`, which is the same shape the English rule judges.
    passive:
      auxiliary: '(?:ble|blitt)'
      participle: '\w+(?:et|dd|tt|t)'
      agent: 'av'

# Folded from data/design_rules.yml — one file for all rules.
style:
  # Ruby, shell, and git style rules enforced by MASTER.
  # Scan rules reference these; Personality injects them into every LLM system prompt.
  # Authoritative upstream clones: tools/clone_style_guides.sh → knowledge/style_guides/
  # Codified index: data/runtime.yml#style_guides (ruby/rails/js/css/seo gates)

  # Rules that are not about any one medium. line_order declares
  # applies_to: [ruby, yaml, erb, js, css, html, sh, md] — every medium this
  # repo writes — and sat inside the Ruby bucket declaring it; comment
  # discipline, identifier naming and the blank-line limit are the same shape.
  # Filed by language, applied everywhere: the bucket was the wrong axis.
  universal:

    comments_max_lines: 1           # class/module/method comments: 1 line or none
    comments_require_why: true      # only add when WHY is non-obvious (hidden constraint, workaround)
    comments_reassess_on_touch: true  # every edit re-reads each comment in the file: delete if obvious,
                             # rewrite Strunk-and-White style if kept (active voice, omit needless
                             # words, concrete verbs, one line). No grandfathered fluff.
    comments_forbidden:
      - what_comments      # never describe what the code does — identifiers do that
      - yard_doc_blocks    # no # Public:, # Returns, # param - style blocks
      - section_separators # no # ----, # ====, # ---- Public API ---- etc.
      - numbered_steps     # no # 1., # 2. inline step comments
      - multi_line_prose   # cut verbosity; one line survives, paragraph does not

    line_order_rule: "Inverted Pyramid — reorder lines/blocks so the most important content comes first."
    line_order_rationale: "Reader who stops at the top third still has the gist. Public API > primary behavior > helpers > privates > edge cases."
    line_order_sequence:
      - "frozen_string_literal + requires"
      - "module/class declaration + headline docstring (≤1 line)"
      - "public API methods, ordered by call-frequency / importance"
      - "primary algorithm or main loop"
      - "private helpers in order of dependency"
      - "constants and lookup tables (unless small enough to inline at top)"
      - "edge-case handlers, rescue branches, fallback paths"
    line_order_applies_to: [ruby, yaml, erb, js, css, html, sh, md]
    line_order_enforced_by: "sweep IMPORTANCE_ORDER technique; council Maintainer + Layperson personas"

    naming_spell_out: true        # no abbreviations: index not idx, signature not sig, temporary_path not tmp
    naming_paths_rule: "Rails-parameterized slug density — snake_case paths; each token a concrete noun or verb; Strunk omit needless words."
    naming_paths_inspired_by: "ActiveSupport::Inflector#parameterize (meaning and density, not hyphen separator)"
    naming_paths_format: snake_case
    naming_paths_max_tokens: 4
    naming_paths_forbidden_tokens: [main, misc, base, util, helper, handlers, handler, manager, service, object, thing, stuff, tmp, old, new, copy, final, v2, data, info]
    naming_paths_examples_good: [crawl_browser, domain_alignment_gate, browser_probe_support, operator_principles]
    naming_paths_examples_bad: [misc_util, cbp, foo_helper, main_base, util_service]
    naming_forbidden_abbreviations:
      - idx
      - sig
      - tmp
      - buf
      - val
      - ret
      - obj
      - str
      - arr
      - num
      - cnt
      - ptr
      - msg   # unless it IS the domain term (e.g., a Message object named msg is ok if short-lived)
    naming_rule: "Spell identifiers out. Domain names can be short (id, url, ip) — abbreviations cannot."

    blank_lines_max_consecutive: 1     # no double blank lines anywhere

  ruby:
    quotes: double  # always double-quoted strings; single only inside regex or '\1' backrefs
    frozen_string: true  # every .rb file must start with # frozen_string_literal: true

    bugs_to_avoid:
      - pattern: "Dir.chdir"
        reason: "process-wide; thread-unsafe in multi-threaded agents"
        fix: "pass -C root to git; expand paths with File.expand_path"

      - pattern: "Prism.parse(src, freeze: true)"
        reason: "freeze: kwarg dropped in Ruby 3.4"
        fix: "Prism.parse(src)"

      - pattern: "next if condition inside flat_map"
        reason: "next if returns nil into flat_map, producing nil entries in output"
        fix: "next [] if condition"

      - pattern: "rescue => e (multi-line bare rescue)"
        reason: "unclear; explicitly name StandardError for clarity"
        fix: "rescue StandardError => e"

      - pattern: "rescue nil (inline rescue returning nil)"
        reason: "inline rescue already catches StandardError; rescue nil is correct idiom"
        note: "do NOT change to rescue StandardError — that returns the class object, not nil"

      - pattern: "@bus&.publish(...) || value"
        reason: "when bus is present, returns bus result (truthy), masking the real value"
        fix: "call @bus&.publish(...) on its own line; return value separately"

      - pattern: "backtick shell commands with interpolation"
        reason: "shell injection risk"
        fix: "Open3.capture2e('cmd', '-flag', arg) with arg arrays"

      - pattern: "system/Open3 with string interpolation"
        reason: "shell injection risk"
        fix: "Open3.capture2e(*%w[cmd -flag], variable) with separate arguments"

      - pattern: "mutate state before publishing event that reads old state"
        reason: "event receives new state instead of previous state"
        fix: "capture prev = current before mutation; use prev in publish/return"

    prefer_string_methods_rule: "Prefer start_with? / include? / end_with? / split over regex when string methods suffice."
    prefer_string_methods_rationale: "Regex is expressive but noisy. Use it when patterns require it, not as a default."
    prefer_string_methods_prefer:
      - "str.start_with?(prefix)        over  str.match?(/^prefix/)"
      - "str.include?(substr)           over  str.match?(/substr/)"
      - "str.end_with?(suffix)          over  str.match?(/suffix$/)"
      - "str.split(sep, n)              over  str.scan(/pattern/)"
    prefer_string_methods_still_use_regex_for:
      - 'Character classes: /[a-z]/, /\d+/'
      - "Anchored multiline patterns"
      - "Alternation with more than 2 branches"

    outsource_to_gems_rule: "If a well-maintained gem solves the problem correctly, use it. Do not reimplement."
    outsource_to_gems_rationale: "Gems carry tests, edge cases, and maintenance. Home-grown duplicates carry bugs."
    outsource_to_gems_examples:
      - "flay for AST-level duplicate detection"
      - "reek for code smell analysis"
      - "rubocop for style enforcement"
      - "prism for Ruby parsing"
    outsource_to_gems_caveat: "Evaluate gem quality first: maintained, tested, minimal footprint."

  shell:
    decorations_forbidden:
      - "=== banner ===" # no ASCII section banners
      - "--- separator ---"
      - "*** header ***"
      - "emoji in print/echo output"  # no ✅ ❌ 🚀 etc. in scripts
      - "numbered step comments"      # no # Step 1:, # Phase 2: etc.

    credentials_forbidden: true  # never hardcode passwords/tokens in scripts

    prefer:
      - "pure zsh parameter expansion over external tools (see zsh_patterns.yml)"
      - "Open3.capture2e with arg arrays in Ruby over shell interpolation"
      - "File.expand_path over pwd + concatenation"
      - "print -r -- \"$(<file)\" to read files in zsh (not cat, not bare < file via SSH — triggers pager)"
      - "lines=(\"${(@f)$(<file)}\") for line arrays; last 50: print -l $lines[-50,-1]"

  git:
    commit_style_voice: active           # "Fix bug" not "Fixed bug", "Add feature" not "Added feature"
    commit_style_format: "type: short summary\n\nBody if needed."
    commit_style_subject_max: 72
    commit_style_no_what_if_diff_shows: true  # don't describe what changed if the diff makes it obvious
    commit_style_separate_concerns: true      # don't mix bug fixes with style changes in one commit

    forbidden:
      - "Dir.chdir in Ruby before git commands"
      - "string-interpolated git commands"
      - "rm -rf in deploy scripts without explicit guard"

  # No operator directives under style: — they are conduct rules in law/practice.rb.
  # The block that stood here duplicated this file's own ruby.comments.reassess_on_touch
  # and html/css sections.

  erb:
    html_safe: explicit_only_after_sanitize
    partials: locals_over_instance_variables
    content_for: [title, description, head, json_ld, widgets, scripts]
    helpers: [tag, class_names, dom_id, sanitize]
    forbidden: [raw_user_html_safe, heredoc_views, inline_script_blocks, bem_classes, utility_class_soup]
    on_edit:
      - flatten_if_divitis
      - extract_repeated_to_partial
      - wire_i18n_for_literals
      # Family polish (design_rules.ui_polish / MASTER/docs/UI_POLISH_PLAYBOOK.md)
      - strip_flat_ui_shadows
      - wire_empty_search_to_t
      - align_page_header_type_tokens
      - space_not_lines_list_cards

  # Conversation directives — how MASTER addresses the user. Operator_directives
  # above shape MASTER's coding work; these shape its dialogue, voice, and
  # social register. Personality injects them verbatim into the system prompt.
  conversation_directives:
    - "Track what the user already knows; don't restate background they've established this session."
    - "Use the user's name when they've shared it; never invent one."
    - "When the user asks X, surface adjacent Y they likely also want — don't wait to be asked."
    - "Mirror the user's politeness register; terse to terse, formal to formal, profane to profane."
    - "When uncertain about intent, ask one focused question instead of guessing and acting."
    - "After a heavy exchange, respect silence; don't fill space with unprompted new threads."
    - "Note relational milestones in memory: first share of X, breakthroughs, recurring concerns."
    - "Disagree gracefully and concretely; never sycophantically agree to keep rapport."
    - "Calibrate humor to the user's register; never humor a tense moment."
    - "When looping the same point, acknowledge it; don't restate."
    - "Trust differs by domain: high in OpenBSD/Ruby, lower in subjective UI/voice calls — say so."

  # html, css, typography, nielsen, a11y — restored from master4.yml/master7.yml
  # (universal_quality_framework v66)

  html:
    semantic_only: true
    bare_tag_targeting: true        # nav a not .nav__link; section, article, aside, etc.
    forbidden:
      - divitis                     # no excessive nesting; no styling-only divs
      - class_attribute_when_tag_targetable
      - non_semantic_markup
      - copy_paste_html
      - framework_class_explosion   # no class="row col-md-6 mt-4 px-2 d-flex" soup
    landmarks:
      - header
      - nav
      - main
      - article
      - section
      - aside
      - footer
    forms_label_required: every input has a label
    forms_input_type_specific: email/url/tel/date — never bare type=text
    forms_autocomplete: "set autocomplete on every meaningful input"

  css:
    targeting: bare_tag_first        # tag selectors > attribute selectors > id; class only when nothing else fits
    layer_order: [base, components, utilities]
    custom_properties: ":root with --safe-top, --safe-right, --safe-bottom, --safe-left"
    units_length: rem                    # px only for borders <2px and 1px hairlines
    units_typography: "rem with clamp() for fluid type"
    # Was "rem multiples of .25 (4px grid)" -- silently allowed 28/36/44/52/
    # 56/60px, which design_rules.yml's eight_px_rhythm (the rule real code
    # actually enforces, per Master::Design::Thresholds) rejects. Matches
    # design_rules.yml now instead of a looser, unenforced rule of its own.
    # Names the list rather than copying it. Spelling the members out here made
    # this a third restatement of one axis, and it was already the stalest of the
    # three: it carried neither 0 nor 44 while the two lists it claimed to quote
    # disagreed about exactly those two.
    units_spacing: "design_rules.yml pixel_perfection.eight_px_rhythm (see that list; 0 and 44 included)"
    forbidden:
      - "!important except for utility overrides"
      - inline_style_attributes
      - vendor_prefixes_in_2026     # autoprefixer or skip
      - framework_class_bloat
    perf_content_visibility: "auto on long-scroll sections"
    perf_will_change: "only when actually animating, then remove"

  typography:
    style: swiss                     # objective, hierarchical, generous whitespace
    # Was "Helvetica, Arial, system-ui, sans-serif" -- didn't match either
    # design_rules.yml's stated default (Inter) or what the RAILS apps
    # actually ship (shared/_dialect_tokens.scss's real stack, below). Synced to
    # the real shipped stack rather than picking a third, different value.
    families_sans: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'
    families_mono: "ui-monospace, Menlo, Consolas, monospace"
    scale_base: 16px
    scale_ratio: 1.25                    # major-third
    leading: 1.5                     # body
    measure: 66ch                    # ideal line length, = line_length.ideal_ch
    rules:
      - "one type family per surface (mono OR sans, not both unless purposeful)"
      - "size hierarchy via scale — never arbitrary px values"
      - "color contrast >= WCAG 2.2 AAA on body text (7:1)"
      - "tracking: tighten display, loosen all-caps (.08em)"
      - "no centered body copy; left-align for left-to-right languages"

  accessibility:
    # Body text earns AAA in both modes (12.51:1 dark, 16.26:1 light, measured
    # 2026-08-03). The secondary/accent tier does not, and saying "AAA" flatly made
    # a blanket claim the palette has never met. The live number is a ceiling in
    # RAILS/gates/data/css_budget.yml (contrast_below_aa / contrast_below_aaa) so it
    # falls rather than drifts; design_rules.yml keeps 7.0 as the target it moves toward.
    target: wcag_2_2_aa_with_aaa_body_text
    requirements:
      - keyboard_navigation_complete
      - focus_visible_always
      - aria_only_when_html_insufficient
      - reduced_motion_respected         # @media (prefers-reduced-motion: reduce)
      - color_scheme_respected           # @media (prefers-color-scheme: dark)
      - color_not_only_signal
      - text_resizable_to_200pct
      - skip_to_main_link
      - alt_text_meaningful_or_empty
    forbidden:
      - tabindex_above_zero
      - autoplay_media_with_sound
      - removing_focus_outline_without_replacement
      - text_in_images_for_meaning

  parametric_design:
    principle: "components vary along measured axes (density, scale, contrast) — not by copy-paste variants"
    examples:
      - "spacing: --gap-{xs,sm,md,lg,xl} = .25/.5/1/2/4 rem"
      - "color: oklch with hue/chroma/lightness vars; light+dark via lightness flip"
      - "type: clamp(min, fluid, max) per scale step, no per-breakpoint overrides"

  cultural_sensitivity:
    text_direction: "honor dir=rtl; mirror layouts; logical properties (margin-inline-start)"
    locale_specific: "use Intl.DateTimeFormat / NumberFormat; never assume MM/DD/YYYY"
    color_meaning: "red=danger is Western; verify per locale"
    imagery: "diverse representation; avoid culture-specific idioms in core UI"
# The Rails stack this fleet runs. Lifted out of style.ruby on 2026-08-22:
# versions, gem APIs and StimulusReflex patterns are stack truth, not a style
# rule, and burying them under style.ruby put 58 of the file's leaf values
# three and four levels deep inside a block about how to write Ruby.
rails_stack:
  # Current stable versions (May 2026)
  rails: "8.1.3.1"
  turbo_rails: "2.0.23"    # 9 actions: append prepend before after replace update remove morph refresh
  stimulus: "3.x"          # static targets, values, outlets API
  pagy: "43.x"             # Pagy::OPTIONS (not Pagy::DEFAULT — redesigned API in 43.0)
  stimulus_reflex: "3.5"   # complementary to Turbo; opt-in only for advanced reactive features

  asset_pipeline: propshaft  # default in Rails 8; do not use Sprockets
  javascript: importmap      # default; esbuild only when CSS-in-JS components needed
  queue: solid_queue         # SQLite-backed by default
  cache: solid_cache         # SQLite-backed by default
  cable: solid_cable         # SQLite-backed by default

  authentication: "rails generate authentication"  # built-in, no devise
  database: sqlite3          # default; PostgreSQL only when explicitly required

  pagy_api:
    backend:  "include Pagy::Backend"   # in ApplicationController
    frontend: "include Pagy::Frontend"  # in ApplicationHelper
    options:  "Pagy::OPTIONS[:limit] = 25"  # NOT Pagy::DEFAULT (that was 8.x)
    overflow: "Pagy::OPTIONS[:overflow] = :last_page"

  turbo_stream_actions:
    - append
    - prepend
    - before
    - after
    - replace
    - update
    - remove
    - morph   # morphs DOM — preserves element state; opt-in via data-turbo-permanent
    - refresh  # triggers full page refresh with morphing

  stimulus_api:
    targets: "static targets = [\"name\"]"       # auto-generates nameTarget, nameTargets, hasNameTarget
    values:  "static values = { url: String }"   # auto-generates urlValue, hasUrlValue, urlValueChanged
    outlets: "static outlets = [\"other\"]"      # cross-controller communication
    lifecycle: [connect, disconnect, initialize]  # + nameTargetConnected/Disconnected

  stimulus_components:
    source: "https://stimulus-components.com"
    install: "bin/importmap pin @stimulus-components/<name>"
    available:
      - { name: character-counter, use: "post/comment character limits" }
      - { name: clipboard, use: "copy URL/code to clipboard" }
      - { name: dialog, use: "modal dialogs, confirmations" }
      - { name: dropdown, use: "nav menus, user menus" }
      - { name: notification, use: "toast alerts" }
      - { name: carousel, use: "image galleries, product photos" }
      - { name: sortable, use: "drag-reorder lists" }
      - { name: rails-nested-form, use: "dynamic has-many form fields" }
      - { name: password-visibility, use: "show/hide password toggle" }

  # Default StimulusReflex stack — Julian Rubisch's pattern set.
  # Install for every new Rails 8 + StimulusReflex 3.5 app unless explicitly opted out.
  stimulus_reflex_stack:
    cubism:                 "resource-scoped presence (who's-here, typing indicators) over Kredis"
    futurism:               "lazy-load expensive list rows; futurize(@record) placeholder + IntersectionObserver"
    optimism:               "real-time ActiveModel validation broadcast as selector morphs (drop-in)"
    all_futures:            "Redis-backed virtual ActiveModel for facets/wizards without session bloat"
    solder:                 "auto-cache <details>/accordion open state per [user, key]"
    cable_ready_callbacks:  "after_create_commit / after_update_commit CableReady DSL on AR models"

  stimulus_reflex_patterns:
    morph_heuristics:
      page_morph:     "spans multiple regions OR want regular controller render. Always scope with data-reflex-root."
      selector_morph: "single element, side-stepping the controller. Inline edit, list-item update, validation hint."
      nothing_morph:  "no DOM patch — only CableReady ops or dispatch_event to a Stimulus controller."
    tool_choice: "Turbo for anything covered by an HTTP verb (navigation, forms). StimulusReflex for everything else."
    cable_ready_ops:
      morph:                "list bodies — pass children_only: true"
      inner_html:           "form reset (morph won't clear inputs)"
      insert_adjacent_html: "infinite scroll, append-only feeds"
      outer_html:           "Futurism replacement, inline-edit toggle"
      dispatch_event:       "nothing morphs that kick a Stimulus controller"
      add_css_class:        "validation hints (Optimism-style)"
      set_focus:            "post-edit UX"
    anti_patterns:
      - "mutating state via GET — REST violation"
      - "hidden form + Turbo Stream for state — flickers; SR fits better"
      - "inline render in reflex — always partials/components, never heredocs"
      - "overusing connect lifecycle — prefer Outlets and useIntersection"
      - "morph to clear form inputs — use inner_html"
      - "class attributes where a tag selector works"
      - "hardcoded step counts in wizards"
      - "session-backed wizard state on multi-server — use kredis or all_futures"
    named_patterns:
      infinite_scroll:    "InfiniteScrollReflex#load_more + sentinel div + insert_adjacent_html before sentinel"
      inline_edit:        "ToggleReflex toggles show ↔ edit partial via selector morph"
      wizard:             "WizardReflex#step dispatching on @current_step; state in kredis or all_futures"
      nested_form:        "NestedFormReflex#add_fields uses .build + fields_for; needs accepts_nested_attributes_for"
      validation_inline:  "Optimism + debounced:input event (not raw input — prevents flooding)"
      autosave:           "Submittable concern; before_reflex branches create/update via element.dataset.signed_id"

  core_web_vitals:
    lcp: "<2.0s"   # Largest Contentful Paint (tightened from 2.5s in March 2026)
    inp: "responsive"  # Interaction to Next Paint
    cls: "< 0.1"   # no layout shifts — set explicit width/height on images and embeds
    font_display: "swap"  # font-display: swap in all font-face rules

  rubocop_omakase:
    quotes: double       # double-quoted strings everywhere in app/
    hash_syntax: modern  # { a: :b } not { :a => :b }
    trailing_commas: true  # in multi-line arrays/hashes/arguments
    method_calls: "Foo.method not Foo::method"
    test_assertions: "assert_not not assert !"

  realtime_hierarchy:
    - "Turbo Drive — full-page navigation"
    - "Turbo Frames — scoped page updates"
    - "Turbo Streams — server-push DOM operations"
    - "Stimulus — client-side interactivity"
    - "StimulusReflex — opt-in for advanced RPC reactive features"

# Rule inputs, not operational data. violation_priors orders which rule the fix
# loop reaches for first; stale_namespaces is the corpus NAMING's retired-constant
# check scans for. Both are read by a rule, so they live beside the rules.
# prior_p: base probability a random file contains this violation (0.0-1.0).
# language_modifiers: multiplicative adjustments per language (1.0 = neutral).
# FixLoop#ordered_rules uses (prior_p x posterior) as secondary sort key after
# violation_counts. High-probability rules run early; rules that have never
# fired on a given extension are deprioritised. Posterior is updated at
# runtime from observed violation counts; this holds the cold-start priors only.
#
# A key here must be the id of a rule the scanner builds, spelled exactly.
# RuleOrder#ordered does `priors.dig(r.id, "prior_p")` against the scanner's own
# rule objects, so a key naming anything else weights nothing. It held 59 keys
# and 4 of them resolved: the other 55 were the six law names, principle names
# from a different namespace (SIMPLICITY, COHESION, HIERARCHY), and smell names
# no rule carries. TODO.md recorded that census as unsettled because three
# earlier attempts gave three answers — Rule.registry is short until RuleDSL is
# touched, and shorter still until the rule files load. Asking the reader
# settles it: build the scanner, read `@rules`, compare ids.
violation_priors:
  DEAD_CODE:
    prior_p: 0.35
    language_modifiers: { ruby: 1.2, js: 1.1, css: 1.3 }
  FEATURE_ENVY:
    prior_p: 0.25
    language_modifiers: { ruby: 1.3, js: 1.1 }
  DATA_CLUMPS:
    prior_p: 0.20
    language_modifiers: { ruby: 1.2 }
  MAGIC_COLOR:
    prior_p: 0.45
    language_modifiers: { css: 1.6, html: 1.3 }
# Merged from former stale_namespaces.yml — retired data paths and constants
# enforced by the stale namespace audit.
# NamingRule reads stale_constants and nothing else here. stale_data_files sat
# beside it with no reader, and had gone stale itself: two of its five rows
# redirected data/injection_patterns.yml and data/zsh.yml to data/patterns.yml,
# which stopped holding either of them when injection and zsh moved into this
# file. A staleness table nobody reads cannot be corrected by anything, and this
# one was pointing the reader it never had at the wrong file.
stale_namespaces:
  stale_constants:
    - old: Master::CLI
      new: Master::CLI::Session
    - old: Master::CLI::CLI
      new: Master::CLI::Session
    - old: Master::Pipeline
      new: Master::CLI::Pipeline
    - old: Master::Stages
      new: Master::CLI::Stages
    - old: Master::Speech
      new: Master::Voice::Speech
    - old: Master::Personality
      new: Master::Voice::Personality
    - old: Master::Swarm
      new: Master::Review::Swarm
    - old: Master::Scan
      new: Master::Review::Scan
    - old: Master::Council
      new: Master::Review::Council
    - old: Master::Session
      new: Master::Trace::Session
    - old: Master::Axioms
      new: Master::Ground::Rules

# Merged from former auth_profiles.yml — auth profile lanes (OAuth/CLI before
# API keys, OpenCrabs/OpenClaw pattern).

# How MASTER writes a business plan, and prices what it sells. Distilled from the
# Innovasjon Norge pitch in README.md and its sources. A plan has to survive a
# board fact-checking it: every number a real estimate, every claim mapped to a
# criterion below.
business_plan:
  lead: purple_cow            # open bold, naming the one remarkable thing; fitting in is failing (Godin)
  structure: [idea, business, ask, horizon, proof]   # five tight movements — hierarchy and whitespace (Bringhurst)
  numbers: accurate_estimates_only                    # never a placeholder or a figure the plan cannot defend
  scope: honest                                        # say plainly what the ask does NOT cover
  criteria: [innovation, scalability, internationalisation, value_creation, sustainability]
  # Monetisation follows the same rule: sell the remarkable thing people seek out
  # and tell others about — not a safe product pushed by ads. Price the purple
  # cow, and let word of mouth from the right early users carry it (Godin).
  monetisation: purple_cow
  sources:
    - "Robert Bringhurst, The Elements of Typographic Style — hierarchy and whitespace"
    - "Seth Godin, Purple Cow — be remarkable or be invisible; the same rule prices what you sell"
    - "Innovasjon Norge startup grant criteria — en.innovasjonnorge.no/article/startups"

# The house style for every markdown document — MASTER's and the CLI agents'.
# Tadao Ando in text: brutalist, ultra-minimal, unpredictable. Concrete over
# ornament; negative space over density. Fewer sections than feel necessary,
# each heading a plane, each paragraph load-bearing. The composition is
# irregular by design so the page reads as a built thing regardless of its
# words. No decorative rules, no filler.
markdown_style:
  aesthetic: tadao_ando   # brutalist · ultra-minimal · unpredictable · negative space
  applies_to: [MASTER, claude, grok, codex]
  rules:
    - fewer sections than feel necessary; cut before you add
    - irregular composition — vary heading levels and paragraph length
    - negative space is structure, not waste
    - concrete over ornament; delete anything decorative

# The dependency graph FixLoop's topological sort reads. A rule under `after`
# must not run before its dependencies finish, or one rule's fix reintroduces
# another's violation.
#
# Every id here, key and target alike, must be one the scanner builds.
# `RuleOrder#topo_sort` does `next unless id_map[dep_id]`, so an edge naming
# anything else is skipped in silence — it reads as an ordering and imposes
# none. The graph held 35 keys and 37 distinct targets; 18 keys and 22 targets
# named nothing, and eleven more keys ordered themselves entirely behind dead
# names, which is the same as no edge at all. What is left is every edge that
# was ever in force. Nothing was reordered, only stated truthfully.
#
# The two vocabularies that produced the dead half are worth naming so they are
# not reintroduced: FLATTEN, MERGE, DEFRAG, EXTRACT and HOIST are fix-operation
# verbs rather than rule ids, and DRY, KISS and SRP are principle names carried
# by no rule the scanner builds.
rule_deps:
  # The block forms first, then the modifier form: all three ask one question of
  # three spellings, and the block form is the one a reader already knows.
  MODIFIER_SILENT_RESCUE:
    after: [SILENT_RESCUE, NARROW_SILENT_RESCUE]
  FEATURE_ENVY:
    after: [SMALL_FILES, SMALL_FUNCTIONS]

  # Remove data clumps before primitive obsession — bundling into objects
  # subsumes the primitive check.
  PRIMITIVE_OBSESSION:
    after: [DATA_CLUMPS]
  yaml_declarative:
    after: [semantic]
  veto_patterns:
    after: [yaml_declarative]
  semantic:
    after: [rubocop, reek]
  adversarial:
    after: [semantic, comment_drift]
  comment_drift:
    after: [ast_omission]
  ast_omission:
    after: [co_change_coupling]
  co_change_coupling:
    after: [interconnect]
  interconnect:
    after: [rule_coverage]
  DEPENDENCY_INVERSION:
    after: [FEATURE_ENVY]
# What the audits of the rules themselves are allowed to find.
#
# Four files held these — rule_audit.yml, rule_hygiene.yml, rule_reach.yml and
# rule_fixture_debt.yml — one ceiling apiece, beside the rules they measure but
# not with them. Named rule_ratchets rather than rule_ceilings because
# design_baseline.yml already owns that key and lint:data_singularity refuses
# one top-level key in two data files; ratchet is also the truer word.
#
# Every reader already loads this file or boots the runtime that does, so they
# are read through Master.law and add no second loader.
rule_ratchets:
  audit:
    # Ceilings for lib/operator/rule_audit.rb — the audit of the rules, not of the tree.
    #
    # blind and saturated are 0 and must stay 0. They are not a backlog: a rule whose
    # fixtures only pass because a fixture is read differently from a real file, or
    # one that flags most of what it reads, produces findings that mean nothing, and
    # it looks green from the inside. FROZEN_STRING_LITERAL sat at 423 of 423 while
    # passing prove! at every boot.
    #
    # silent is a real number and it moves in both directions. A rule that fires on
    # nothing here is usually a CSS or JavaScript law over a mostly-Ruby corpus,
    # which is a property of the sample rather than of the rule — so it is recorded
    # rather than fixed, and it moves when the corpus or the rule set does. It is a
    # ceiling so that a rule going quiet is visible; it is not evidence of a defect
    # on its own.
    #
    # 19 -> 24 as the tree got cleaner, which is the direction this counter cannot
    # read. MEANINGFUL_NAMES, WHY_NOT_WHAT, NO_COLUMN_ALIGN, STRICT_LOADING_MISSING
    # and NO_CHANGELOG_COMMENT all stopped finding anything because their findings
    # were fixed or their detector was narrowed to what it is actually about — and
    # a rule that finds nothing because nothing is left is the goal. Read the names
    # before reading the number.
    #
    # NO_CHANGELOG_COMMENT held exactly three hits in this corpus, one each in
    # rescue_handlers.rb, prune_guest_users_job.rb and _responsive.scss. All three
    # said what the code used to be; each now states why it is what it is.
    #
    # 25 -> 23 by widening the corpus to MASTER/web/public/*.js rather than by
    # touching a rule. FACE_POINT_IS_ONE_PIXEL and NO_WEBGL_GLOW_PASS govern those
    # files and nothing else, and the corpus stopped at RAILS's Stimulus
    # controllers — so the audit called two laws silent without having opened a
    # file either one judges. Both are still silent, because the face obeys them.
    # The two that came off the list are NO_VAR and NO_COLUMN_ALIGN, which were
    # never silent: viewport_inset.js declares seven `var`s, and chat.js,
    # codebase.js, face.runtime.js and face_semantics.js align their assignments
    # into columns. That is the same shape as the scss glob fixed earlier — a law
    # judged against no file of its own is untested, not clean.
    blind: 0
    saturated: 0
    # 23 -> 24 is NOISE_NAME, and it is the good direction. Identified by running
    # this audit at b81baea1c — the commit that recorded 23 — and diffing the two
    # name lists, because the ceiling is a bare integer and "over by one" otherwise
    # names nothing. Nothing else moved: no rule left the silent set.
    #
    # It is silent because the tree obeys it. Verified rather than assumed, since a
    # broken detector reads identically from here: it still fires on `class Manager`
    # and `module Utils`, and stays correctly quiet on `class PaymentHelper` and
    # `class SubscriptionBilling`, which is the domain-qualifier exemption the law
    # documents. A grep for its pattern over MASTER, RAILS and OPENBSD finds
    # no match in ordinary source at this commit or at b81baea1c.
    #
    # What is NOT established: which file it last fired on. The corpus moved 696 ->
    # 709 files and the detector set 74 -> 75 between the two commits, so this is
    # churn in the sample as much as in the tree, and the exact departure was not
    # chased. The header above already says a silent rule is a property of the
    # sample as often as of the rule, and is not evidence of a defect on its own.
    #
    # 24 -> 39, and it is a correction rather than a move. Fourteen of the fifteen
    # are the census learning to read law/ the way the runtime does. A law file
    # necessarily contains the pattern it forbids — its detector, its fix sentence,
    # its bad fixture — and FileProcessor#law_conducted neutralizes those lines at
    # the one read site so that a law does not judge itself. This audit read them
    # raw, so a law matching nothing in the tree except its own `detect` line
    # counted as having found a subject and stayed off this list. Measured both
    # ways on 2026-09-08: 24 raw against 38 conducted. FAIL_VISIBLY,
    # GUARD_EXPENSIVE_OPS, NULL_BLINDNESS and SAFE_NAVIGATION are four of the
    # fourteen, and every one of them had been reading itself.
    #
    # The fifteenth is UNBOUNDED_RETRY, which declared no `languages`. `retry` is
    # a Ruby keyword and nothing else, and its one standing finding was the word in
    # a sentence on 406-unsupported-browser.html — English prose in HTML, reported
    # at :error. Scoped to ruby it fires on nothing here, which is the honest
    # state: this tree contains no unbounded Ruby `retry`, and a correct rule with
    # no subject belongs on this list rather than in a gate as a false finding.
    #
    # 39 on 2026-09-09, having been 38 for an hour, and the round trip is the
    # useful part. It fell when nine files moved out of lib/ground into the
    # namespace whose declared purpose covers them and a silent rule found a
    # subject in its new company — a rule's reach is a property of where the code
    # sits, not only of what the rule says. It rose again when the last
    # RUBY_SYMBOL_TO_PROC finding in the tree was fixed, in io/llm.rb, leaving
    # that rule with nothing to say.
    #
    # So this row cannot tell "no subject in a clean tree" from "no subject ever",
    # and it charges the first at the same rate as the second: fixing a rule's
    # only finding is scored here as new debt. Splitting it would need the two
    # populations named separately — a rule whose pattern no configuration can
    # reach, against a rule the tree has simply stopped breaking.
    #
    # 40 on 2026-09-12, and it is the second population again: MOBILE_FIRST.
    # RAILS held eighteen `@media (max-width:` queries, fourteen of them carrying
    # a marker that exempted them from this very law. The operator ruled that the
    # law wins, so seventeen were converted and one — _root.scss:334, an upper
    # bound on an enhancement rather than a narrow-screen exception — was left and
    # does not match the detector anyway. The rule fired on eighteen subjects
    # before this pass and on none after, which is the same round trip the
    # RUBY_SYMBOL_TO_PROC note above describes.
    #
    # 43 on 2026-09-16, net of four arrivals and one departure, identified the
    # way 24 -> 23 was: this audit run at a2d6912c7 — the commit that recorded
    # 40 — and the two name lists diffed, because "over by three" names nobody.
    # Each arrival is the second population, a rule the tree stopped breaking:
    #   NO_VAR             viewport_inset.js declared seven `var`s and declares
    #                      none; it was the file the 25 -> 23 note above names.
    #   RATE_LIMITING_MISSING  authentication.rb and sso_user_provisioning.rb
    #                      were its two subjects; authentication.rb throttles now.
    #   NEVER_BATCH_DELETE database_snapshot_job.rb was its one subject.
    #   NO_MULTIPLE_LANGUAGES  its one subject was _shell.scss line 11 — a
    #                      sentence in a comment mentioning Turbo's <style>. The
    #                      file has not changed; the scanner stopped reading a
    #                      comment as code, so this arrival is a false positive
    #                      leaving rather than a subject being fixed.
    # The departure is WHY_NOT_WHAT, which found findable_by_slug.rb.
    silent: 43

  hygiene:
    # Ceilings for tools/rule_hygiene.rb. The first three are 0 as of 2026-09-05
    # and 0 is a floor: a new rule arrives with a tier or a severity, an id that
    # collides with nothing, and no alias naming something still alive.
    #
    # Half of what they used to report was the instrument. The walk collected
    # every hash in the file carrying an "id", so the eight check names inside
    # AUTOMATED_CSS_ANALYSIS's `config:` counted as eight rules with no metadata,
    # and one of them — eight_px_rhythm — collided by case with the real
    # EIGHT_PX_RHYTHM. It reads the two declared populations now.
    #
    # id_case_collisions: two ids differing only by case are two rules to a
    # registry and one rule to a reader, so findings, priors and exemptions split
    # across the pair in silence. The real one was bare_rescue/BARE_RESCUE, closed
    # by deleting the smell.
    #
    # alias_shadows_live_rule: an alias is a retired id. One naming a rule that
    # still exists makes every lookup ambiguous. DRY claimed duplicate_code, which
    # has 51 findings of its own; the alias went.
    #
    # missing_metadata: a rule with neither tier nor severity is omitted by every
    # count that groups by either, without saying so. It was 43 until the 27
    # operator_principles entries moved to soul.yml, where conduct belongs.
    id_case_collisions: 0
    alias_shadows_live_rule: 0
    missing_metadata: 0

    # cross_population_duplicates: one id with two independent detector homes.
    # The catalogue is metadata; executable Law and RuleDSL are implementations.
    # A law may deliberately have both detect and ask surfaces, but that is one
    # executable home rather than a catalogue-vs-law duplicate.
    #
    # A home is a population that detects: a law with a `detect` (not a
    # practice, which cannot fire on a line), a registry rule, or a catalogue entry
    # carrying detect_lexical, which the YamlDeclarativeRule bridge runs. There are
    # no lexical entries today; the hatch is idle, not the check.
    #
    # 0, and the twin campaign this row opened for is finished. It stands as the
    # guard against a second detector regrowing under a live id.
    cross_population_duplicates: 0

    # statement_conflicts protects remaining catalogue metadata from drifting away
    # from executable implementations. A migrated Law rule may legitimately omit
    # `fix` from the catalogue; in that case Law is the authority and no conflict exists.
    # Before retirement, this caught catalogue `fix` fields carrying older drafts (MEANINGFUL_NAMES said
    # "use domain-specific names" where the law says "name it after what the
    # right-hand side already calls it"), and those are rewritten to the law's
    # wording: whichever population holds the detector owns it. Severity is the
    # other way round — this file is the one that must carry tier and severity for
    # every rule, so ONE_SOURCE, PRIMITIVE_OBSESSION and LAZY_CLASS moved to the
    # severity declared here rather than the one their class chose.
    #
    # The last 3 — BE_CONCISE, PRESERVE_FIRST and SIMPLEST_WORKS — closed on
    # 2026-09-10, and they closed the other way round from the eleven above. A
    # `practice` cannot fire on a line, so for these three the detector is this
    # catalogue's and law/practice.rb holds the conduct: the practice takes this
    # file's `fix` and `severity` verbatim and states the rule it is named after
    # in the imperative. SIMPLEST_WORKS' practice was about god classes, which is
    # NO_GOD_CLASS's subject and has a structural detector, so that clause is
    # gone rather than reworded — a practice named after one rule and stating
    # another is how a rule's findings and its prompt come apart. BE_CONCISE was
    # not two subjects: this file names it "avoid unnecessary words, tokens, or
    # lines", which is the reply and the source both, so "minimal response"
    # survives as the second sentence of one rule.
    statement_conflicts: 0

  deps:
    # ungraphed: registry rules absent from rule_deps below. RuleRegistryAudit has
    # reported this number and `/rules deps` has printed it since either existed,
    # and until 2026-09-05 nothing failed on it — a gap that gates nothing is a
    # count, not a ratchet. It rose when 72a8cfae8 deleted the dep keys that named
    # no live rule, which is the honest direction and read like a regression
    # precisely because no ceiling was watching.
    #
    # A rule outside the graph is one RuleOrder cannot sequence: it runs wherever
    # it lands, and a rule meant to follow another (PRIMITIVE_OBSESSION after
    # DATA_CLUMPS) is only ordered because the graph says so. Down only.
    #
    # 133 -> 134 on 2026-09-06, and the extra rule is one the audit could not
    # see. rule_dsl.rb required fifteen rule files and not law_bridge_rule, so
    # LawBridgeRule joined the registry only when InfraHelpers built a scanner
    # and const_get loaded it — the audit read 133 alone and 134 after any run
    # that scanned anything. The require closes that, and the number it
    # uncovers belongs in the debt rather than in a graph entry: law_bridge
    # reports each law under the law's own id, so a rule_deps key for it would
    # order nothing in RuleOrder and exist only to make this count fall.
    #
    # 134 -> 136, and the two are PLEDGE_STAGED and AUDIT_APPEND_ONLY, written to
    # give principle_map's pledge_unveil and audit_logging a detector instead of
    # an empty rule_ids. Neither runs after anything: one reads unveil promises,
    # the other reads how an audit sink opens its file, and no other rule changes
    # what either sees. By the paragraph above, a dep key for them would order
    # nothing and exist only to keep this number flat, so the number moves and
    # names them instead.
    ungraphed: 136

  reach:
    # 56 -> 70 on 2026-09-05, and the rise is the point rather than a cost.
    # The fourteen design blocks became rules in this catalogue, which is what
    # made them countable at all: as a second top-level section they were
    # unenforceable law that no reach census could see. Each is now a named
    # rule with no detector, which is exactly what it was before -- only
    # visible. Wiring them is the work this number now tracks.
    unreachable: 70

  fixture_debt:
    # Registry rules carrying no fires:/does_not_fire: worked example, counted by
    # test/test_rule_fixtures.rb. law/ rules cannot load without fixtures; these
    # can, which is where every instrument defect this campaign found was hiding.
    # The number only ratchets down: a new RuleDSL rule must carry its examples,
    # and retro-fitting one lowers this by hand.
    #
    # 91 -> 76 on 2026-09-05, fifteen rules retro-fitted. Each pair states the
    # rule's own distinction rather than restating its regex: TODO_FIXME's
    # does_not_fire is a line naming TODO.md, DEAD_CODE's is a guard clause, and
    # PLUCK_OVER_MAP's is the pluck it recommends. RESCUE_EXCEPTION's `fires:`
    # carries a `scan: intentional` marker, because a rule's worked example is
    # the one place its own forbidden shape is legitimately spelled and
    # FAIL_VISIBLY reads that file like any other.
    #
    # 76 -> 47 on 2026-09-05: the twelve web rules, six JS and shell rules, and
    # ten universal ones, plus FOCUS_VISIBLE's own example_path — its guard is
    # a filename match, so the generic _example.scss could not have reached it.
    # Two of the ten are worth reading. CONTROL_CHARS spells its control
    # character as a unicode escape rather than a literal byte, so the file that
    # forbids them keeps holding none, which is what its own comment promises.
    # And TYPOGRAPHIC_EXCELLENCE's first draft, `warn "loading..."`, did not
    # fire: the rule reads a bare quoted ellipsis, not prose containing dots,
    # and a fixture that passes for the wrong reason is the thing this ratchet
    # exists to stop. SQL_INJECTION is deliberately left unfixtured — its
    # worked example is an interpolated `.execute(` call, the rule has no
    # self-exemption and honours no marker, so the example would be a real
    # error-severity finding in the rule file itself.
    #
    # `test_rule_fixtures.rb` gained `javascript:` and `zsh:` default paths.
    # Those are what applies_to declares; `js` is not a language any rule names,
    # so every JS and shell rule had been landing at a Ruby model path.
    #
    # 47 -> 30 on 2026-09-06: the seven cosmetic rules, three ruby, two lexical,
    # and five of surface_rules' twenty-nine. EN_DASH_RANGE, README_PROSE and
    # DEBUG_OUTPUT each needed a spelled example_path, because each guards on the
    # path rather than the source and the generic Ruby model path satisfies none
    # of them.
    #
    # 29 -> 0 on 2026-09-06, and 0 is the floor: every rule in the registry now
    # carries at least one worked example, which is what every law has always
    # had to. Twenty-four were surface_rules', the design and Rails-convention
    # half that had never had one.
    #
    # Two of them found real defects while being written, which is the whole
    # argument for the ratchet. CHOICE_OVERLOAD read the opening tag by searching
    # backwards for `<` from the body's first character, and rindex answers with
    # that character — so a body opening `<li>` made every plain <ul> look like a
    # <li> and skipped the exemption that keeps this rule off search results.
    # SCSS_NESTING_DEPTH measures depth at each line's end, so five levels written
    # on one line read zero; the example nests the way SCSS is written and says so.
    #
    # This ceiling twice recorded that a rule could not hold its own example, and
    # both times it was the fixture's shape rather than the rule's. SILENT_RESCUE
    # reads a line that STARTS with `rescue`, so an example spelled as an escaped
    # one-line string is a worked example everywhere and a finding nowhere —
    # including in the file that defines it, which still carries no path exemption.
    # SQL_INJECTION was the same mistake, closed the same day from the other end.
    #
    # PARAMETERIZED_SLUG and RUNTIME_DOCS_YAML carry a positive example and no
    # negative one, and that is the honest maximum: both judge the path rather
    # than the source, and the harness gives a rule one path.
    without_fixtures: 0

# What a decision proposal is checked against before it is offered, by
# Master::Ground::BiasGuard. `detect` accuses, `clears` acquits: a proposal
# that measured something is not accused of calling it small. `compounds_with`
# names the chains, so a proposal carrying two links of one reports it as one
# note rather than two unrelated-looking ones.
biases:
  confirmation_bias:
    countermeasure: Generate three counter-arguments before accepting a fix that only
      confirms the scanner result.
    detect: "\\b(fix|violation|same fix|still carries|scanner result)\\b"
    clears: "\\b(alternative|tradeoff|counter|review|why)\\b"
  sunk_cost_bias:
    countermeasure: Compare the current path against a simpler rollback or rewrite before
      investing more effort.
    detect: "\\b(continue|more|again|retry)\\b"
    clears: "\\brollback|simpler|stop\\b"
  authority_bias:
    countermeasure: Treat named tools and models as fallible; require local evidence
      before accepting their output.
    detect: "\\b(llm|model|scanner|rubocop|reek)\\b"
    clears: "\\bevidence|local|test|scan:"
  recency_bias:
    countermeasure: Prioritize severity x frequency x age, not most-recent findings
      alone.
    detect: "\\b(latest|just added|newest)\\b"
    clears: "\\bseverity|age|frequency\\b"
  sycophancy:
    countermeasure: Disagree when evidence conflicts with the operator preference; state
      the conflict and the safer path.
    detect: "\\b(great idea|absolutely|of course|as you wish)\\b"
    clears: "\\brisk|tradeoff|however|but\\b"
  simulation_bias:
    countermeasure: Replace future-tense promises with executed commands, diffs, or
      test output before claiming done.
    detect: "\\b(will fix|would work|should pass|going to|plan to)\\b"
    clears: "\\bdiff|passed|exit|sha256|applied\\b"
  anchoring_bias:
    countermeasure: Regenerate at least one alternative fix that ignores the first proposed
      patch shape.
    detect: "\\b(first approach|initial fix|as before)\\b"
    clears: "\\balternative|option b|second pass\\b"
  availability_bias:
    countermeasure: Search the repo for similar settled patterns before inventing a
      new structure.
    detect: "\\b(new (file|class|module|pattern))\\b"
    clears: "\\bexisting|reuse|search|found\\b"
  premature_optimization:
    countermeasure: Prove a measured bottleneck before complexity for speed.
    detect: "\\b(cache|optimize|perf|benchmark)\\b"
    clears: "\\bmeasured|profile|hot path|n\\+\\s*1\\b"
  aesthetic_neglect:
    countermeasure: For UI/views/CSS changes, run aesthetic profile scan and check spacing,
      type, flatness, and touch targets before ship.
    detect: "\\b(view|scss|css|ui|erb|face)\\b"
    clears: "\\baesthetic|spacing|contrast|touch|flat|token\\b"
  optimism_bias:
    countermeasure: State the estimate as evidence, not intent — a timing, a measured
      run, a count. An unmeasured "this is small" is the same claim as "this is done".
    compounds_with:
    - dunning_kruger_bias
    - sunk_cost_bias
    detect: "\\b(quick|trivial|simple fix|just a|minor|small change)\\b"
    clears: "\\bmeasured|took|lines|ran|timed\\b"
  dunning_kruger_bias:
    countermeasure: Require evidence proportional to stated confidence; in an unfamiliar
      subsystem read its tests before proposing a change to it.
    compounds_with:
    - optimism_bias
    - authority_bias
    detect: "\\b(obviously|clearly|straightforward|any \\w+ would)\\b"
    clears: "\\btest|read|evidence|checked|verified\\b"
  bandwagon_bias:
    countermeasure: Evaluate the popular option against this repo constraints before
      adopting it; a gem or pattern being standard elsewhere is not evidence it fits
      here.
    compounds_with:
    - authority_bias
    - confirmation_bias
    detect: "\\b(standard|common practice|everyone|idiomatic|best practice)\\b"
    clears: "\\bhere|this repo|constraint|measured|because\\b"
  framing_bias:
    countermeasure: Restate the problem in at least one other form before deciding;
      a fix that only works under the first framing is a fix to the sentence, not the
      defect.
    compounds_with:
    - anchoring_bias
    - confirmation_bias
    detect: "\\b(the real (problem|issue)|actually about|boils down to)\\b"
    clears: "\\balternativ|another (way|reading)|reframe|or it is\\b"
  survivorship_bias:
    countermeasure: Study the failures and the paths that never shipped, not only the
      green cases that survived selection.
    compounds_with:
    - availability_bias
    - recency_bias
    detect: "\\b(always works|never fails|every (time|case)|proven pattern)\\b"
    clears: "\\bfail(ed|ure)|missed|never shipped|counterexample\\b"

# Regexes Master::Review::OutputCheck matches against MASTER's own final
# output. The category names carry the severity, which lives in the reader:
# hallucination, refusal_failure and toxicity_surface are errors, hedging and
# bias_surface warnings. A category the reader does not know is ignored.
llm_output_rules:
  hallucination:
    - "i (?:created|added|wrote) `[^`]+\\.(?:rb|yml|md|js)`"
    - "(?:the command )?(?:produced|returned|output)(?:ed|s)? .{0,80}(?:as expected|successfully)"
    - "(?:the|this) `[A-Z][A-Za-z0-9_:]+#\\w+` method (?:returns|provides|gives)"

  refusal_failure:
    - "(?:i'?ll|i will|let me|sure,? i'?ll) (?:run|execute|apply|commit) .{0,80}(?<!done)$"
    - "(?:applying|running|committing) (?:the |this |that )?(?:patch|fix|change) now\\."

  hedge_violation:
    - "\\b(?:will|would|could|might)\\s+(?:probably|possibly|likely|maybe)\\b"
    - "\\b(?:should|ought to)\\s+work\\b"

  bias_surface:
    - "\\b(?:women|men|girls|boys) (?:naturally|typically|usually) (?:better|worse|more|less)"
    - "\\b(?:elderly|young people|millennials|boomers) (?:can'?t|don'?t|never|always)"

  toxicity_surface:
    - "\\b(?:stupid|idiot|moron|retard|dumb)\\b.{0,40}(?:user|person|you)"
    - "(?:kill|hurt|attack) (?:yourself|themselves)"

  refusal_failure_unhelpful:
    - "(?:i (?:cannot|can'?t)|sorry,? i (?:cannot|can'?t)) help with that\\.?$"
    - "as an ai language model"
