languages:
  ruby:
    version: 3.3+
    frozen_string_literal: required
    guard_clauses: true
    rescue: specify_type_always
    naming: snake_case
    max_params: 3
  rails:
    version: 8+
    stack:
    - solid_queue
    - solid_cache
    - solid_cable
    frontend: hotwire
    testing: minitest
    database: sqlite_default
    security:
    - strong_parameters
    - csrf
    - csp
    - ssl
    - hsts
  zsh:
    shebang: "#!/usr/bin/env zsh"
    options: set -euo pipefail; setopt nullglob extendedglob
  openbsd:
    service: rcctl
    packages: pkg_add
    firewall: pf
    privilege: doas
    http: httpd
    ssh:
      permit_root_login: false
      password_auth: false
      max_auth_tries: 3
  norwegian:
    dialect: bokmål
    rules:
    - Short sentences
    - Avoid anglicisms
    - Active voice
    - Plain language
prediction_engine:
  null_usage:
    confidence: 0.95
    autofix: null_object_pattern
  abbreviation:
    confidence: 0.99
    autofix: expand_to_full_name
  nesting_depth:
    confidence: 0.92
    autofix: extract_method
learned_smells:
- id: bare_rescue
  pattern: "^\\s*rescue\\b"
  confidence: 0.98
  autofix: rescue_standard_error
- id: frozen_string
  pattern: "\\bString\\.new\\b|%q\\(|%Q\\("
  confidence: 0.99
  autofix: add_frozen_string_literal
- id: trailing_ws
  pattern: "[ \\t]+$"
  confidence: 0.99
  autofix: strip_trailing_whitespace
- id: debug_output
  pattern: "\\b(?:puts|p|pp|warn)\\b"
  confidence: 0.97
  autofix: remove_debug_call
- id: todo_comment
  pattern: "\\b(?:TODO|FIXME|HACK)\\b"
  confidence: 0.7
  autofix: create_issue
- id: magic_number
  pattern: "\\b\\d{2,}\\b"
  confidence: 0.85
  autofix: extract_named_constant
- id: long_line
  pattern: "^.{121,}$"
  confidence: 0.9
  autofix: wrap_at_120
- id: sycophancy
  pattern: "\\b(?:absolutely|certainly|of course|happy to help)\\b"
  confidence: 0.99
  autofix: delete_phrase
- id: future_tense
  pattern: "\\b(?:will|would|might|could|perhaps|seems|appears)\\b"
  confidence: 0.95
  autofix: rewrite_indicative
- id: duplicate_code
  pattern: "\\b(?:copy|duplicate|same as)\\b"
  confidence: 0.75
  autofix: extract_shared_method
- id: god_class
  pattern: "^\\s*class\\b"
  confidence: 0.6
  autofix: propose_decomposition
- id: n_plus_one
  pattern: "\\b(?:includes|preload|eager_load)\\b"
  confidence: 0.88
  autofix: add_includes
foundations:
  information_theory:
    source: Shannon (1948); Kolmogorov complexity / minimum description length
    grounds:
    - DENSITY
    - ENTROPY_RESISTANCE
    - BE_CONCISE
    - SIMPLEST_WORKS
    principle: Maximise signal per token. The shortest faithful description wins;
      noise is measurable, not a matter of taste.
  cognitive_load:
    source: Sweller (cognitive load theory); Miller 7±2; Cowan ~4
    grounds:
    - SMALL_FUNCTIONS
    - FEW_ARGUMENTS
    - STEPDOWN
    - ONE_ABSTRACTION_LEVEL
    principle: Working memory holds ~4 chunks. Keep each unit within one mental grasp.
      ruby.max_params:3 is this limit, not a style choice.
  gestalt:
    source: Wertheimer, Koffka — Gestalt perception
    grounds:
    - PROXIMITY
    - CONSISTENT_FILE_STRUCTURE
    - AESTHETIC_MINIMALISM
    principle: Proximity, similarity, common region, and closure govern grouping in
      code layout and visual design alike.
  software_evolution:
    source: Lehman's laws of software evolution
    grounds:
    - ENTROPY_RESISTANCE
    - BROKEN_WINDOWS
    - PRESERVE_FIRST
    principle: A system in use must change; unmanaged change raises complexity and
      lowers quality. Spend work against decay every pass.
  cooperative_principle:
    source: Grice — maxims of conversation (quantity, quality, relation, manner)
    grounds:
    - BE_CONCISE
    - WHY_NOT_WHAT
    - SELF_EXPLAINING
    - GRICE_COOPERATIVE
    principle: 'Every artifact obeys four maxims: say enough and no more (quantity),
      assert nothing false (quality), stay relevant (relation), be clear and orderly
      (manner).'
rules: {}
