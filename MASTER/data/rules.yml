---
schema: 1
laws:
  ROBUSTNESS:
    priority: 1
    principle: Errors fail safely; security first; handle edge cases.
    applies_to:
    - security
    - errors
    - input_validation
    - resource_management
    research:
      - name: "IEEE Top 10 Security Vulnerabilities in Code"
        url: "https://ar5iv.labs.arxiv.org/html/2006.03281"
      - name: "OWASP Top 10"
        url: "https://owasp.org/Top10"
      - name: "Defensive Programming"
        url: "https://github.com/google/styleguide"
  SINGULARITY:
    priority: 2
    principle: One source of truth; no duplication; data integrity.
    applies_to:
    - duplication
    - consistency
    - data_integrity
    research:
      - name: "DRY Principle (Andrew Hunt, David Thomas)"
        url: "https://pragprog.com/titles/pragddd/the-pragmatic-programmer"
      - name: "Database Normalization Theory"
        url: "https://en.wikipedia.org/wiki/Database_normalization"
  LINEARITY:
    priority: 3
    principle: Sequential flow; minimal branches; clear path.
    applies_to:
    - control_flow
    - nesting
    - complexity
    research:
      - name: "Cyclomatic Complexity (McCabe 1976)"
        url: "https://en.wikipedia.org/wiki/Cyclomatic_complexity"
      - name: "Cognitive Load in Code"
        url: "https://ar5iv.labs.arxiv.org/html/2107.03127"
  PROXIMITY:
    priority: 4
    principle: Related code together; cohesive modules.
    applies_to:
    - organization
    - coupling
    - modules
    research:
      - name: "Cohesion and Coupling (Yourdon & Constantine)"
        url: "https://en.wikipedia.org/wiki/Cohesion_(computer_science)"
      - name: "SOLID Principles"
        url: "https://en.wikipedia.org/wiki/SOLID"
  ABSTRACTION:
    priority: 5
    principle: Right level; no leaky abstractions; appropriate hiding.
    applies_to:
    - interfaces
    - encapsulation
    - apis
    research:
      - name: "Leaky Abstractions (Joel Spolsky)"
        url: "https://www.joelonsoftware.com/2002/11/11/the-law-of-leaky-abstractions"
      - name: "Interface Design Patterns"
        url: "https://en.wikipedia.org/wiki/Interface_segregation_principle"
  DENSITY:
    priority: 6
    principle: Information dense; no noise; signal not noise.
    applies_to:
    - verbosity
    - comments
    - naming
    research:
      - name: "Elements of Style (Strunk & White)"
        url: "https://www.gutenberg.org/ebooks/37134"
      - name: "Signal-to-Noise Ratio in Code"
        url: "https://ar5iv.labs.arxiv.org/html/2310.19102"
engineering_fit:
  classify: 'For every problem, decide: under-engineered, over-engineered, or perfectly
    engineered — and say why.'
  under: Misses real failure modes the artifact will hit. Add only what the artifact
    actually carries.
  over: Carries machinery the artifact will never load. Strip it; defer until the
    load shows up.
  fit: Solution matches the load and the failure modes — no slack, no shortfall.
  why_required: State the load the artifact carries (users, edge cases, lifetimes,
    blast radius). The verdict follows from the load.
# Output-text bias patterns (scanned by the RuleDSL text scanner). Distinct from
# data/biases.yml's decision-proposal biases (confirmation/sunk-cost/authority),
# which BiasGuard reads separately — same word, two different pipeline stages.
beauty:
  typography_bringhurst:
  - choose_appropriate_typeface_for_function
  - set_text_in_sizes_that_suit_its_nature
  - use_vertical_motion_that_suits_typeface
  - rhythm_proportion_modulation_harmony
  architecture_ando:
  - simplicity_silence_emptiness
  - light_shadow_materiality
  - geometry_nature_coexistence
  - space_between_as_important_as_form
  design_rams:
  - innovative_useful_aesthetic
  - unobtrusive_honest_long_lasting
  - thorough_environmentally_friendly
  - as_little_design_as_possible
  code_martin:
  - meaningful_names_intention_revealing
  - functions_do_one_thing_small
  - comments_explain_why_not_what
  - error_handling_separate_from_logic
  zen_japanese:
    wabi_sabi: imperfect_authentic
    ma: emptiness_pause
    kanso: eliminate_essence
success_criteria:
- every_output_respects_axioms
- council_surfaces_real_concerns_not_theater
- system_applies_to_itself_without_exception
- engineers_trust_judgment_over_time
self_test:
  laws_apply_to_self:
    ROBUSTNESS: scan lib/ for bare_rescue + missing timeouts
    SINGULARITY: rules.yml entries unique by id; no two YAMLs define same key
    LINEARITY: no nesting_depth > 4 in lib/
    PROXIMITY: test files within 1 directory of source
    ABSTRACTION: no class > god_class threshold in lib/
    DENSITY: no method > long_method threshold in lib/
    KERNEL_ADHERENCE: infra_helpers.rb wiring layer present; rule adherence >= 35%
    PRINCIPLE_MAP: every rule id named by data/principle_map.yml resolves to a registered
      rule, and every covered principle names at least one. The reverse direction —
      every registered rule traced by some principle — is `rake lint:principle_trace`,
      a ratcheting ceiling, because it has never been zero.
  fail_action: publish self_violation event; refuse autoloop fixes that don't restore
    the law
veto_patterns:
  secrets:
    detect: sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|-----BEGIN.*KEY-----
    apply: move_to_env
    violates_law: ROBUSTNESS
  sql_injection:
    # Was `execute|query.*#\{`. The alternation binds as `(execute)|(query.*#\{)`,
    # so the bare word `execute` anywhere on a line was an unconditional merge
    # blocker. 87 findings in lib/, every one read and classified, 0 real:
    #
    #   `def execute_resync`, `execute_job`, `pre_execute?`, `phase: "post_execute"`
    #   `@db.execute(sql, [args])` — the parameterized form this rule prescribes
    #   `@db.execute(<<~SQL, args)` — likewise, via heredoc
    #   `"context: gathering for query=#{query[0, 60]}"` — a log line
    #   `# Unsafe shell never executes.` — a comment
    #
    # The one candidate that looked real was `WHERE #{where.join(" AND ")}` in
    # ground/knowledge_store/feedback_events.rb. Checked: provider_errors_query
    # builds `where` from the literals "event_type = ?" and "dimension = ?" and
    # puts every value in `args`. Parameterized. Also a false positive.
    #
    # Now: execute/query called with a quoted string that carries an
    # interpolation. Backreferenced quoting, `(["'])(?:(?!\1).)*`, so that
    # `query("... name='#{name}'")` — a single quote inside a double-quoted SQL
    # string, which is the classic injection shape — is not skipped.
    #
    # KNOWN GAP, and it is the important one: this cannot see interpolation
    # inside a heredoc, because scan_lines is per line and the `<<~SQL` line
    # carries no `#{`. Catching SQL built across lines needs an AST rule, not a
    # lexical veto. Tracked in TODO.md rather than pretended away here.
    detect: (?:execute|query)\w*\s*\(\s*(["'])(?:(?!\1).)*#\{
    apply: parameterize
    violates_law: ROBUSTNESS
  unfinished:
    # Was "\\.\\.\\.|TODO|FIXME|pending", which fired 119 times in lib/ and was
    # wrong 119 times. Measured 2026-08-12, every finding read and classified:
    #
    #   49  the word "pending" — @pending, the "pending" order state in
    #       VALID_STATES, and the substring inside depending / spending
    #   41  an ellipsis in prose or in documented syntax — "\n... [truncated]",
    #       %i[...], for...of, require(...).permit(...)
    #   26  Ruby's exclusive range operator — lines[0...-1], (1...lines.length)
    #    3  the source of the rules that detect TODO/FIXME, quoting it
    #
    # Zero real unfinished work, at :veto — the strongest severity there is.
    # 119 false vetoes do not gate anything; they teach the reader that a veto is
    # noise, which costs more than the rule was ever worth.
    #
    # Narrowed rather than deleted — the intent is right, only the reach was
    # wrong. Three clauses, each doing one thing:
    #
    #   #[^\n]*\b(TODO|FIXME)\b   a marker in a comment, which is what a marker
    #                             is. The last three false vetoes were TODO
    #                             inside the regex literals of the rules that
    #                             detect TODO; none has a `#` before it.
    #   ^\s*\.\.\.\s*$            a stubbed body — `...` alone on its line. This
    #                             is the shape lexical TODO_FIXME does not have,
    #                             and the reason to keep a veto here at all.
    #   (pending removed)         a legitimate order state in this codebase
    #                             (VALID_STATES) and a substring of depending
    #                             and spending. No narrowing rescues a word.
    #
    # The comment clause deliberately does not carry TODO_FIXME's hardcoded
    # `path.include?("/review/scan/rules/")` exemption. Copying an exemption into
    # a second file is how the two drift; being precise about what a marker looks
    # like needs no exemption at all.
    #
    # Pinned in both directions in test/test_scan_rule_false_positives.rb, per
    # that file's own rule: a narrowing has to prove what it still catches.
    detect: "#[^\\n]*\\b(TODO|FIXME)\\b|^\\s*\\.\\.\\.\\s*$"
    # The only veto pattern that means to read comments — a marker lives in one.
    # Every other pattern is about code, and a comment describing shell safety or
    # SQL injection is documentation, not the thing. See VetoPatternRule.
    reads_comments: true
    apply: complete_or_track
    violates_law: ROBUSTNESS
  unsafe_calls:
    # Interpolation is the arbitrary-code-execution risk. `system("cmd", arg, arg)`
    # is the safe arg-array form style.yml prescribes as the FIX for this, so
    # vetoing it too was a contradiction and the source's biggest false positive.
    # Every clause requires a `#{...}` reaching a shell.
    #
    # Narrowed again 2026-08-12, 23 findings in lib/ -> 3, all 20 removed ones
    # read and classified first:
    #
    #    9  a markdown fence inside a Ruby string — "```#{lang}", "```\n#{code}"
    #    6  a markdown code span in prose — "task `#{topic}`", "- `#{path}` (…)"
    #    2  backticks whose content is Shellwords.escape'd, which is the fix
    #    2  Open3 in the arg-array form, which is also the fix
    #    1  "`#{body}`", a string being wrapped in backticks for display
    #
    # Three changes. The backtick clause now needs a SINGLE backtick — `(?<!`)`(?!`)`
    # — which drops every triple-fence; it needs a space inside the backticks, so a
    # bare `#{path}` code span is not a command; and it refuses Shellwords.escape.
    # Open3 now only fires when the FIRST argument is one quoted string holding both
    # a space and an interpolation, which is the shape that reaches a shell — the
    # old `\([^)]*#\{` matched interpolation in any argument of the safe form.
    #
    # The quoted-string clauses use a backreference, `(["'])(?:(?!\1).)*`, instead
    # of `["'][^"']*`. The old class stopped at the first quote of EITHER kind, so
    # `system("rm -rf '#{dir}'")` — a shell string quoting an interpolated path,
    # which is exactly the dangerous case — did not match at all.
    #
    # What survives in lib/, and should: ps with an interpolated $USER
    # (ground/host_budget.rb), a wholly interpolated command
    # (trace/snapshot_collector.rb), and an interpolated interpreter path
    # (voice/engines.rb). Two take their value from ENV.
    detect: (?:system|exec)\s*\(\s*(["'])(?:(?!\1).)*#\{|%x[\{(\[<][^)}\]>]*#\{|(?<!`)`(?!`)(?![^`\n]*Shellwords\.escape)(?=[^`\n]*#\{)[^`\n]*\s[^`\n]*`|Open3\.\w+\s*\(\s*(["'])(?:(?!\2).)*\s(?:(?!\2).)*#\{
    apply: add_safe_nav
    violates_law: ROBUSTNESS
anti_patterns:
  forbidden:
  - pattern: eval\(.*user.*\)
    reason: arbitrary_code_execution
  - pattern: rm -rf /
    reason: data_loss
  - pattern: while true.*no sleep
    reason: resource_exhaustion
  - pattern: system\(.*\$\{
    reason: command_injection
  - pattern: Marshal\.load
    reason: deserialization_rce
  - pattern: open\(.*\$\{
    reason: shell_through_open
  discouraged:
  - pattern: god_object
    reason: violates_solid_srp
  - pattern: premature_optimization
    reason: violates_yagni
  - pattern: defensive_copying_everywhere
    reason: complexity_for_imagined_failure
  - pattern: speculative_generality
    reason: yagni_in_disguise
principle_priorities:
  # tier1/append_only, show_cost, degrade_gracefully and tier2/least_power,
  # open_closed, liskov, interface_segregation, dependency_inversion,
  # test_first, skeleton_first and tier3/user_friendly restored 2026-07-12
  # from data/axioms.jsonl (deleted — superseded by this section) after a
  # gap audit found no equivalent principle recorded anywhere else.
  tier1_critical:
  - evidence: "@assumption -> validate"
  - reversible: "@irreversible -> add_rollback"
  - security: "@untrusted -> validate_sanitize"
  - self_apply: "@output -> must_pass_own_constitution"
  - append_only: "@history_or_audit_log -> never_mutate_append_only"
  - show_cost: "@operation_has_cost -> show_cost_before_execution"
  - degrade_gracefully: "@dependency_unavailable -> degrade_not_break"
  tier2_quality:
  - dry: "@duplication>=3 -> abstract"
  - kiss: "@complexity>10 -> simplify"
  - srp: "@two_reasons_to_change -> split"
  - least_power: "@task_solvable_by_cheap_tool -> use_cheap_before_llm"
  - open_closed: "@behavior_change -> extend_not_modify"
  - liskov: "@subclass -> preserve_parent_contract"
  - interface_segregation: "@fat_interface -> split_by_client"
  - dependency_inversion: "@high_level_module -> depend_on_abstraction"
  - test_first: "@fix_or_feature -> write_failing_test_first"
  - skeleton_first: "@new_feature -> thinnest_working_slice_first"
  tier3_polish:
  - explicit: "@implicit -> make_explicit"
  - minimalism: "@bloat -> subtract"
  - rhythm: "@inconsistent -> align"
  - user_friendly: "@interface_change -> visibility_control_prevention_consistency_recognition"
preserve_user_intent:
  forbidden_changes_during_refactor:
  - public_method_signature
  - error_class_raised
  - return_type_shape
  - side_effects_order
  - log_format_consumed_by_others
  require_explicit_approval_for: behavior_change
ground_truth_check:
  require_fresh_read_before:
  - claim_task_complete
  - council_vote_on_change
  - commit_creation
  cache_max_age_seconds: 5
phantom_recovery:
  detectors:
    gaslighting_preamble: "/^(I('ll| will| can| would)|Let me|Sure,)/i"
    text_repetition_loop: same 60-char span repeats >= 3 times
    xml_tool_call_failure: "<tool> open without close OR malformed JSON in args"
    empty_tool_response: tool returned nil twice in a row
  # Detected and reported, but never counted toward the halt ladder below.
  #
  # Three of the four detectors name a malfunction: output that loops, a tool
  # call that will not parse, a tool that answered nothing twice. Discarding,
  # escalating the model tier and finally halting are all sane answers to those.
  #
  # gaslighting_preamble is not one of them. It is a style rule — soul.yml's
  # anti_simulation, already enforced by voice/output_guard, review/prompt_filter,
  # ground/maturity_scorecard and the personality prompt — and its pattern matches
  # any reply opening "I can", "I would", "Let me" or "Sure,". A model writing
  # ordinary English is working, not malfunctioning, so letting it spend the
  # ladder ends the conversation for a phrasing preference.
  style_only:
  - gaslighting_preamble
  recovery:
  - discard last response, reset context to last successful checkpoint
  - switch model tier (escalate or fall back) on second occurrence
  - publish phantom:detected event, halt loop on third
failure_taxonomy:
  transient:
    examples:
    - network_timeout
    - rate_limit
    - temp_file_conflict
    - provider_overload
    strategy: exponential_backoff
    max_retries: 3
  permanent:
    examples:
    - syntax_error
    - missing_dependency
    - permission_denied
    - schema_violation
    strategy: fail_fast
    max_retries: 0
  ambiguous:
    examples:
    - partial_write
    - unknown_error
    - half_committed_state
    strategy: human_intervention
    checkpoint_before: true
evidence_scoring:
  weights:
    test_pass: 35
    scan_clean: 25
    code_review: 20
    log_analysis: 10
    profiling_data: 10
  pass_threshold: 80
  block_threshold: 50
  # What can actually produce each kind of proof. The kind used to be whatever the
  # model wrote in the effect, so exec(["true"], evidence: "test_pass") was worth
  # 35 and four of them ended the turn — the fold graded its own paper. A command
  # that does not run the tests cannot be a passing test run.
  #
  # Unmatched scores nothing rather than blocking the effect: the fold may run what
  # it likes, it just cannot claim credit for it. Mirrors Master::Core::Proof
  # PRODUCERS, which is the Ruby source, and a test pins the two together.
  producers:
    test_pass: 'rake\s+test|rails\s+test|rspec|minitest|bin/(?:ci|check|gate)|ruby\S*\s[^;|]*\btest/'
    scan_clean: 'bin/(?:check|gate|scan)|rubocop|brakeman|bundler-audit|rake\s+(?:lint|audit|scan)'
    code_review: 'bin/(?:review|critique)|rake\s+(?:review|critique)'
    log_analysis: 'journalctl|dmesg|rcctl|/var/log|\.log\b'
    profiling_data: 'benchmark|stackprof|ruby-prof|memory_profiler|--profile'
schema_metadata:
  optional_fields:
    reversibility: free | cheap | surgical | impossible
    time_horizon: review | deploy | incident
    blast_radius: 'files_touched: integer'
    provenance:
      added_in_commit: sha
      rationale: string
      last_revised: iso8601
paths:
  skip_dirs:
  - ".git"
  - vendor
  - tmp
  - var
  - node_modules
  - ".bundle"
  - coverage
  - log
  - dist
  - knowledge
  - three_build
  tree:
    max_depth: 2
    max_lines: 200
  # Paths the agent may never write or stage. The constitution it is judged by
  # and the spine that folds its effects must not be rewritable by an effect.
  # Prefix match; a trailing "/" marks a directory subtree.
  immutable:
  - data/rules.yml
  - data/soul.yml
  # Both entries, not just the directory: the fold spine moved to lib/core/ on
  # 2026-08-12 and its entrypoint is lib/core.rb, which holds VERBS, Effect and
  # Secret. A `lib/core/` entry alone would leave the closed verb set writable
  # by an effect — the exact rewrite this rule exists to block.
  - lib/core.rb
  - lib/core/
thresholds:
  class:
    max_methods: 6
    max_lines: 200
  convergence:
    consecutive_clean_runs_required: 2
    max_iterations: 15
    stagnant_threshold: 3
    genetic_autofix_candidates: 3
languages:
  ruby:
    version: 3.3+
    frozen_string_literal: required
    guard_clauses: true
    rescue: specify_type_always
    naming: snake_case
    max_params: 3
  rails:
    version: 8+
    stack:
    - solid_queue
    - solid_cache
    - solid_cable
    frontend: hotwire
    testing: minitest
    database: sqlite_default
    security:
    - strong_parameters
    - csrf
    - csp
    - ssl
    - hsts
  zsh:
    shebang: "#!/usr/bin/env zsh"
    options: set -euo pipefail; setopt nullglob extendedglob
  openbsd:
    service: rcctl
    packages: pkg_add
    firewall: pf
    privilege: doas
    http: httpd
    ssh:
      permit_root_login: false
      password_auth: false
      max_auth_tries: 3
  norwegian:
    dialect: bokmål
    rules:
    - Short sentences
    - Avoid anglicisms
    - Active voice
    - Plain language
prediction_engine:
  null_usage:
    confidence: 0.95
    autofix: null_object_pattern
  abbreviation:
    confidence: 0.99
    autofix: expand_to_full_name
  nesting_depth:
    confidence: 0.92
    autofix: extract_method
learned_smells:
- id: bare_rescue
  pattern: "^\\s*rescue\\s*(?:=>|;|$)"
  confidence: 0.98
  autofix: rescue_standard_error
- id: frozen_string
  pattern: "\\bString\\.new\\b|%q\\(|%Q\\("
  confidence: 0.99
  autofix: add_frozen_string_literal
- id: trailing_ws
  pattern: "[ \\t]+$"
  confidence: 0.99
  autofix: strip_trailing_whitespace
# debug_output was removed 2026-08-12, for the same reason as long_line above and
# with the same evidence. It carried the SAME id as the registered DEBUG_OUTPUT
# rule, so their findings were not even distinguishable in a report — where
# long_line at least differed by case. The registered rule is :error with a
# working autofix; this copy was :warning with `autofix: remove_debug_call`, a
# name that appears nowhere but in this file.
#
# Its own comment said the narrowing had to carry "the same operator exclusions
# the DEBUG_OUTPUT Ruby rule carries" — two regexes kept in step by hand, which
# is the definition of the defect. That reasoning lives on in the registered
# rule and in test_debug_output_ignores_a_local_named_p, which pins it.
- id: todo_comment
  pattern: "\\b(?:TODO|FIXME|HACK)\\b"
  confidence: 0.7
  autofix: create_issue
- id: magic_number
  # Was "\b\d{2,}\b" — any two-digit-or-longer run anywhere, which is 4318
  # findings across the tree and is mostly years, versions, timestamps and
  # numbers that already have names.
  #
  # cross_file_analysis.rb's MAGIC_NUMBER learned this on 2026-07-31 and carries
  # the exemptions: skip years, and skip a literal that sits on the right of a
  # constant assignment or a keyword, because "PATTERN_CACHE_MAX = 512" is the
  # fix this rule recommends and firing on it made the count go up. The
  # declarative twin never got them. It does now — the same three exemptions a
  # single pattern can express.
  pattern: "(?<![\\w.])(?<!= )(?<!: )(?!19\\d{2}(?![\\d.]))(?!20\\d{2}(?![\\d.]))\\d{2,}(?![\\w.])"
  confidence: 0.85
  autofix: extract_named_constant
# long_line was removed 2026-08-12. It restated the registered LONG_LINE rule as a
# raw regex and produced 334 findings across lib/, of which THREE landed on a line
# no other rule reports — and all three are in lib/io/llm.rb, which LONG_LINE
# deliberately exempts. So the copy was 331 duplicates plus a quiet override of an
# exemption, reported at :warning where the real rule says :info and with the id as
# its whole message.
#
# The same test the EMPTY_RESCUE deletion used: how many findings are unique to it.
# Every other entry in this list passes that test — magic_number, future_tense,
# duplicate_code, sycophancy and todo_comment are the only implementations of what
# they detect, which is why this is a deletion of one entry and not of the layer.
- id: sycophancy
  pattern: "\\b(?:absolutely|certainly|of course|happy to help)\\b"
  confidence: 0.99
  autofix: delete_phrase
- id: future_tense
  pattern: "\\b(?:will|would|might|could|perhaps|seems|appears)\\b"
  confidence: 0.95
  autofix: rewrite_indicative
- id: duplicate_code
  pattern: "\\b(?:copy|duplicate|same as)\\b"
  confidence: 0.75
  autofix: extract_shared_method
# god_class/n_plus_one learned_smells removed 2026-07-12: god_class's regex
# (^\s*class\b) matched every class declaration with zero signal, riding
# alongside the real AST-based NO_GOD_CLASS rule (structural_rules.rb:78);
# n_plus_one's regex matched the FIX keywords (includes/preload/eager_load),
# not the problem, riding alongside the real N_PLUS_ONE rule
# (universal_rules.rb:40). Both were redundant, one was backwards.
rules:
  codebase:
  - id: PRESERVE_FIRST
    source: MASTER-native constitutional kernel rule
    name: Never break working code
    tier: kernel
    severity: error
    autofix: false
    detect_semantic: Does this change modify working code without reading it first?
    fix: Read before write. Preserve behavior and intent. Larger changes allowed if
      justified and tested.
  - id: ONE_SOURCE
    source: DRY — The Pragmatic Programmer (Hunt & Thomas, 1999)
    name: One authoritative representation per concept
    tier: kernel
    severity: error
    autofix: true
    detect_semantic: Is the same logic or data defined in multiple places?
    fix: Extract to single source, reference from all consumers.
  - id: DECOUPLE
    source: The Pragmatic Programmer (decoupling) — Hunt & Thomas
    name: Make hidden dependencies explicit
    tier: kernel
    severity: error
    autofix: false
    detect_semantic: Are there implicit couplings between modules that should be injected?
    fix: Inject dependencies through constructor. No global state.
  - id: DEGRADE_GRACEFULLY
    source: Release It! graceful degradation (Michael Nygard)
    name: Operate under partial failures
    tier: kernel
    severity: error
    autofix: false
    detect_semantic: Does this code crash on partial failure instead of degrading?
    fix: Circuit breakers, timeouts, fallbacks.
  - id: GALLS_LAW
    source: Gall's Law — Systemantics (John Gall, 1975)
    name: Complex systems evolve from simple working systems
    tier: philosophy
    severity: info
    autofix: false
    detect_semantic: Is this attempting to build a complex system from scratch rather
      than evolving from a working simple one?
    fix: Start simple, prove it works, then extend.
  - id: CHESTERTONS_FENCE
    source: Chesterton's Fence (G.K. Chesterton, 1929)
    name: Understand why something exists before removing it
    tier: philosophy
    severity: warning
    autofix: false
    detect_semantic: Is code being removed without understanding why it was added?
    fix: Read git blame, understand the rationale, then decide.
  - id: UNIX_PHILOSOPHY
    source: Unix philosophy — do one thing well (Doug McIlroy)
    name: Do one thing well
    tier: architecture
    severity: info
    autofix: false
    detect_semantic: Does this module try to do too many unrelated things?
    fix: Extract services. Clear module boundaries. Compose with pipes.
  - id: FUNCTIONAL_CORE
    source: Functional Core, Imperative Shell (Gary Bernhardt)
    name: Pure logic in core, side effects at edges
    tier: architecture
    severity: info
    autofix: false
    detect_semantic: Are IO/DB calls scattered deep in business logic?
    fix: Return data from core, let shell handle IO.
  - id: CONVENTION_OVER_CONFIG
    source: Convention over Configuration (Rails Doctrine, DHH)
    name: Sensible defaults reduce decisions
    tier: productivity
    severity: info
    autofix: false
    detect_semantic: Does this require explicit config where a convention would suffice?
    fix: Provide sensible defaults, override only when needed.
  - id: PROGRAMMER_HAPPINESS
    source: Optimize for Programmer Happiness (Rails Doctrine, DHH)
    name: Ceremony and friction are costs, not virtues
    tier: philosophy
    severity: info
    autofix: false
    detect_semantic: Does this force unnecessary ceremony or friction the programmer
      shouldn't have to think about?
    fix: Simplify the API surface; favor expressiveness over rigor for its own sake.
  - id: OMAKASE
    source: The Menu Is Omakase (Rails Doctrine, DHH)
    name: Prefer the curated default over a competing tool
    tier: philosophy
    severity: info
    autofix: false
    detect_semantic: Does this introduce a competing tool where a Rails-blessed default
      already exists?
    fix: Prefer the curated default (Hotwire, Solid Queue/Cache/Cable, Minitest) unless
      there is a specific reason to deviate.
  - id: NO_ONE_PARADIGM
    source: No One Paradigm (Rails Doctrine, DHH)
    name: Mix paradigms pragmatically
    tier: philosophy
    severity: info
    autofix: false
    detect_semantic: Does this force a single paradigm where a pragmatic mix would
      read better?
    fix: Mix paradigms where each fits — don't force uniformity for ideology's sake.
  - id: BEAUTIFUL_CODE
    source: Exalt Beautiful Code (Rails Doctrine, DHH)
    name: Elegance is a requirement, not a bonus
    tier: philosophy
    severity: info
    autofix: false
    detect_semantic: Would a reader consider this code elegant, or merely correct?
    fix: Rewrite for aesthetic clarity, not just passing tests.
  - id: SHARP_KNIVES
    source: Provide Sharp Knives (Rails Doctrine, DHH)
    name: Trust the programmer over guarding against misuse
    tier: philosophy
    severity: info
    autofix: false
    detect_semantic: Does this restrict a capable programmer's power to prevent a
      rare misuse, at the cost of the common case?
    fix: Trust the programmer; document the danger instead of removing the capability.
  - id: INTEGRATED_SYSTEMS
    source: Value Integrated Systems (Rails Doctrine, DHH)
    name: Prefer one cohesive system over fragmentation
    tier: philosophy
    severity: info
    autofix: false
    detect_semantic: Does this fragment a cohesive concern across services or gems
      where one integrated system would be simpler?
    fix: Prefer a well-organized monolith over premature service extraction.
  - id: PROGRESS_OVER_STABILITY
    source: Progress Over Stability (Rails Doctrine, DHH)
    name: A beneficial breaking change beats frozen compatibility
    tier: philosophy
    severity: info
    autofix: false
    detect_semantic: Is this avoiding a beneficial breaking change purely to preserve
      backward compatibility?
    fix: Take the breaking change if it meaningfully improves the design; provide
      a clear upgrade path.
  - id: BIG_TENT
    source: Push Up a Big Tent (Rails Doctrine, DHH)
    name: Write for contributors of every skill level
    tier: philosophy
    severity: info
    autofix: false
    detect_semantic: Does this alienate contributors of different skill levels or
      backgrounds unnecessarily — needless cleverness, exclusionary jargon?
    fix: Write for a big tent of contributors — clarity over cleverness, welcoming
      over gatekeeping.
  - id: MONOLITH_FIRST
    source: MonolithFirst (Martin Fowler, bliki)
    name: Start monolith, extract when team exceeds 15
    tier: architecture
    severity: info
    autofix: false
    detect_semantic: Is this prematurely splitting into services?
    fix: Keep it in one app until extraction is clearly needed.
  - id: CONSISTENT_ERROR_STRATEGY
    source: MASTER-native (uniform error handling)
    name: One error handling strategy per module
    tier: design
    severity: warning
    autofix: false
    detect_semantic: Does this module mix Result objects, exceptions, and nil-returns?
    fix: Pick one strategy per module. MASTER uses Result monad.
  - id: DUAL_DETECTION
    source: MASTER-native (lexical + semantic detection)
    name: Layer lexical and semantic detection
    tier: verification
    severity: info
    autofix: false
    detect_semantic: Is detection relying on regex alone or LLM alone?
    fix: Layer deterministic patterns with LLM semantic analysis.
  - id: MASS_GENERATE_CURATE
    source: MASTER-native (generate-then-curate)
    name: Generate many variations, curate ruthlessly
    tier: creative
    severity: info
    autofix: false
    detect_semantic: Is the first draft being accepted without exploring alternatives?
    fix: Generate a swarm and curate when stakes are high.
  - id: NO_GOD_CLASS
    source: 'Refactoring code smell: Large Class / God Object (Fowler)'
    name: No god classes
    tier: core
    severity: error
    autofix: false
    detect_structural: god_class
    fix: Decompose into focused classes.
  - id: FILE_SPRAWL
    source: soul.yml COLLAPSE_BEFORE_ADDING / FLAT_HIERARCHY — operator standing instruction, clean minimal tree
    name: One-file directories and tiny files merge into their owners
    tier: structure
    severity: warning
    autofix: false
    detect_structural: file_sprawl
    fix: Hoist the only file in a directory into its parent; absorb files under 25 code lines into their closest owner. Fold requires, Zeitwerk names and tests in the same change.
  - id: NO_SHOTGUN_SURGERY
    source: 'Refactoring code smell: Shotgun Surgery (Fowler)'
    name: One change should not require edits in many files
    tier: core
    severity: warning
    autofix: false
    detect_semantic: Does a single conceptual change span many files?
    fix: Extract the missing abstraction.
  - id: NO_HIDDEN_GLOBAL_STATE
    source: Clean Code — avoid global mutable state (R.C. Martin)
    name: No hidden global state
    tier: core
    severity: error
    autofix: false
    detect_semantic: Are there global variables or class-level mutable state shared
      across modules?
    fix: Inject configuration. Use dependency injection.
  - id: TRACER_BULLETS
    source: The Pragmatic Programmer — tracer bullets (Hunt & Thomas)
    name: End-to-end skeleton first, flesh out second
    tier: architecture
    severity: info
    autofix: false
    detect_semantic: Is this building infrastructure without an end-to-end path? Is
      this business plan elaborating budgets before proving the revenue model? Is this
      research paper expanding methodology before demonstrating the finding?
    fix: Wire the simplest end-to-end path first. Prove it works. Then add depth.
  - id: ORTHOGONALITY
    source: The Pragmatic Programmer — orthogonality (Hunt & Thomas)
    name: Changes in one dimension must not ripple into others
    tier: architecture
    severity: warning
    autofix: false
    detect_semantic: Does changing one aspect force changes in unrelated aspects? Does
      reformatting break content? Does modifying one gene's expression alter another
      pathway?
    fix: Decouple dimensions. Database changes should not require UI changes. Style
      should not affect structure.
  - id: TRANSFORMATIONS
    source: Transformation Priority Premise (Robert C. Martin)
    name: 'Think in pipelines: input transforms to output'
    tier: architecture
    severity: info
    autofix: false
    detect_semantic: Is this modeling the problem as mutable state instead of flowing
      transformations? Does this document bury its flow in scattered cross-references?
    fix: Express work as a chain of transformations. Each stage takes input, produces
      output, holds no state.
  - id: DEEP_MODULES
    source: A Philosophy of Software Design (John Ousterhout, 2018)
    name: Powerful functionality behind simple interfaces
    tier: architecture
    severity: warning
    autofix: false
    detect_semantic: Is this module shallow — complex interface, trivial implementation?
      Does this form ask 40 questions for a simple task? Does this clause require five
      cross-references?
    fix: Simple interface, rich implementation. A deep module does much with little
      ceremony.
  - id: INFORMATION_HIDING
    source: Information hiding (David Parnas, 1972; Ousterhout)
    name: Each module encapsulates one design decision
    tier: architecture
    severity: warning
    autofix: false
    detect_semantic: Is implementation detail leaking across boundaries? Would changing
      an internal decision force changes elsewhere?
    fix: Encapsulate each decision in one module. If it changes, only that module changes.
  - id: DIFFERENT_LAYER_DIFFERENT_ABSTRACTION
    source: A Philosophy of Software Design (Ousterhout)
    name: Each layer speaks a different language than its neighbors
    tier: architecture
    severity: warning
    autofix: false
    detect_semantic: Do adjacent layers use the same abstraction? Are there pass-through
      methods that add no value? Does this management layer just relay without transforming?
    fix: Each layer must transform, not relay. If a layer adds no abstraction, remove
      it.
  - id: STRUCTURAL_HONESTY
    source: MASTER-native (structure mirrors intent)
    name: The shape of the artifact must reflect the shape of the problem
    tier: architecture
    severity: warning
    autofix: false
    detect_semantic: Does the structure match the domain? Does the module hierarchy
      match the conceptual hierarchy? Does the floor plan match the workflow?
    fix: Align structure with reality. Natural domain boundaries become system boundaries.
  - id: GRACEFUL_BOUNDARIES
    source: Boundaries (Gary Bernhardt) — values at the edges
    name: Where systems meet, expect translation and loss
    tier: architecture
    severity: info
    autofix: false
    detect_semantic: Does this boundary assume perfect fidelity? Does this integration
      assume the other side never changes?
    fix: Every boundary is a translation layer. Validate at every boundary. Degrade
      gracefully when translation fails.
  - id: PULL_COMPLEXITY_DOWN
    source: A Philosophy of Software Design (Ousterhout)
    name: Simple interface matters more than simple implementation
    tier: architecture
    severity: info
    autofix: false
    detect_semantic: Is complexity pushed up to the caller instead of absorbed by the
      implementation?
    fix: Absorb complexity into the implementation. The caller should not need to know
      how it works.
  - id: ETC
    source: ETC 'Easier To Change' — The Pragmatic Programmer (Hunt & Thomas)
    name: Easier To Change — the meta-value behind every principle
    tier: philosophy
    severity: info
    autofix: false
    detect_semantic: Does this design decision make the system harder to change? Does
      this contract make renegotiation unnecessarily difficult?
    fix: Choose the option that keeps more options open. Decoupled, parameterized, replaceable.
  - id: BROKEN_WINDOWS
    source: The Pragmatic Programmer — software entropy / broken windows
    name: Zero tolerance for visible decay
    tier: philosophy
    severity: warning
    autofix: false
    detect_semantic: Is there visible rot being left unfixed — dead code, broken links,
      stale references? In a brief, citations to overruled cases?
    fix: Fix it now. One broken window invites more.
  - id: ENTROPY_RESISTANCE
    source: The Pragmatic Programmer — software entropy (Hunt & Thomas)
    name: Systems decay toward disorder unless actively maintained
    tier: philosophy
    severity: warning
    autofix: false
    detect_semantic: Is there creeping disorder — naming inconsistencies, abandoned
      conventions, accumulating exceptions? In a legal code, contradictory amendments?
    fix: Actively resist entropy. Regular cleanup. Remove what no longer serves.
  - id: DONT_OUTRUN_HEADLIGHTS
    source: The Pragmatic Programmer — don't outrun your headlights
    name: Only plan as far as you can see
    tier: philosophy
    severity: info
    autofix: false
    detect_semantic: Is this making detailed plans for unpredictable scenarios? Projecting
      five years out? Designing for hypothetical scale?
    fix: Small deliberate steps. Reassess after each. Feedback from each step illuminates
      the next.
  - id: REVERSIBILITY
    source: The Pragmatic Programmer — reversibility (Hunt & Thomas)
    name: Prefer decisions that are easy to undo
    tier: philosophy
    severity: info
    autofix: false
    detect_semantic: Is this decision hard to reverse? Does it lock in a vendor? Waive
      future rights? Have no rollback pathway?
    fix: Soft-delete over hard-delete. Option agreements over binding. Feature flags
      over big-bang.
  - id: DESIGN_IT_TWICE
    source: A Philosophy of Software Design — Design it Twice (Ousterhout)
    name: Consider at least two approaches before committing
    tier: philosophy
    severity: info
    autofix: false
    detect_semantic: Was this designed once without considering alternatives?
    fix: Sketch two designs. Compare tradeoffs. Five minutes saves five days.
  - id: PROPERTY_BASED_TESTING
    source: Property-based testing — QuickCheck (Claessen & Hughes, 2000)
    name: Test properties and invariants, not just examples
    tier: verification
    severity: info
    autofix: false
    detect_semantic: Are tests only checking specific examples instead of universal
      properties? Is QA only sampling instead of testing invariants?
    fix: Define properties that must always hold. Generate many inputs. Verify the property
      survives all.
  - id: EXPLICIT_TRADEOFF
    source: Polished Ruby Programming (Jeremy Evans, 2021) — trade-offs over absolutes
    name: Justify implementation choices by context, not as universally best
    tier: design
    severity: info
    autofix: false
    detect_semantic: Where several valid implementations exist (data structure, error
      strategy, sync vs async, inheritance vs composition), is the chosen one justified
      by stated context (access pattern, cardinality, failure mode, scale) rather than
      presented as the one right way?
    fix: 'State the trade-off: name the access pattern or failure mode that makes this
      choice fit here. Avoid ''always''/''never'' where context decides.'
  - id: LEAST_PRIVILEGE
    source: Saltzer & Schroeder (1975) — principle of least privilege
    name: Grant the minimum authority needed, for the shortest time
    tier: kernel
    severity: error
    autofix: false
    detect_semantic: Does any component hold broader access (scope, role, token, file
      mode, network reach) than its task requires?
    fix: Narrow the grant to exactly what the task needs; drop privilege immediately
      after use.
  - id: FAIL_SAFE_DEFAULTS
    source: Saltzer & Schroeder (1975) — fail-safe defaults
    name: Default to denial; grant access by explicit decision
    tier: kernel
    severity: error
    autofix: false
    detect_semantic: Does the default path permit when no rule matched, rather than
      deny? Are permissions opt-in or opt-out?
    fix: Base access on permission explicitly granted, never on the absence of denial.
  - id: COMPLETE_MEDIATION
    source: Saltzer & Schroeder (1975) — complete mediation
    name: Check authority on every access, not once and cache
    tier: kernel
    severity: error
    autofix: false
    detect_semantic: Is an authority check performed once and then trusted, leaving
      later accesses unverified after state could change?
    fix: Re-verify authority at each access; do not cache a stale allow decision across
      requests.
  - id: ECONOMY_OF_MECHANISM
    source: Saltzer & Schroeder (1975) — economy of mechanism
    name: Keep the security-critical surface small enough to audit
    tier: design
    severity: warning
    autofix: false
    detect_semantic: Is the trust- or security-critical path large or branchy enough
      that it cannot be read and verified in one sitting?
    fix: Shrink the trusted path; isolate it; make it small enough to verify by inspection.
  - id: PSYCHOLOGICAL_ACCEPTABILITY
    source: Saltzer & Schroeder (1975) — psychological acceptability
    name: The secure path must be the easy path
    tier: design
    severity: warning
    autofix: false
    detect_semantic: Does correct/secure use require effort or friction that pushes
      users toward an unsafe shortcut?
    fix: Make the safe default frictionless; never force a trade between convenience
      and safety.
  - id: MAKE_ILLEGAL_STATES_UNREPRESENTABLE
    source: Yaron Minsky — make illegal states unrepresentable
    name: Encode invariants in types/shapes so bad states cannot be built
    tier: kernel
    severity: error
    autofix: false
    detect_semantic: Can an invalid combination of fields/values be constructed at all?
      Are invariants enforced by runtime checks that could be forgotten instead of by
      the data's shape?
    fix: Reshape the data so the invalid state cannot be expressed; replace defensive
      checks with structural impossibility.
  - id: PARSE_DONT_VALIDATE
    source: Alexis King — parse, don't validate
    name: Convert untrusted input into a trusted shape once, at the boundary
    tier: design
    severity: warning
    autofix: false
    detect_semantic: Is the same input re-checked at many call sites instead of parsed
      once into a type that carries the guarantee forward?
    fix: Parse at the boundary into a value whose existence proves validity; downstream
      code receives the parsed type, never the raw input.
  - id: POKA_YOKE
    source: Toyota Production System (Ohno) — poka-yoke (error-proofing)
    name: Design interfaces so misuse is impossible, not merely discouraged
    tier: design
    severity: warning
    autofix: false
    detect_semantic: Can the API be called in a wrong order, with swappable same-typed
      args, or in a way that compiles/runs but is meaningless?
    fix: 'Make the wrong call unconstructable: distinct types, required ordering via
      builder/state, no two adjacent args of the same type.'
  - id: COMPLEX_SYSTEMS_FAIL
    source: Richard Cook — How Complex Systems Fail; Hollnagel — resilience engineering
    name: Assume latent faults; degrade and recover rather than assume success
    tier: kernel
    severity: warning
    autofix: false
    detect_semantic: Does this path assume the happy case and lack a defined degraded
      mode, or treat a single safeguard as sufficient (single point of failure)?
    fix: Add a defined degraded mode and recovery; never rely on one defence. Failure
      is normal — plan the descent.
  - id: STRONG_CENTERS
    source: Christopher Alexander — The Nature of Order (strong centers)
    name: Each module has one clear center that organises the whole
    tier: aesthetic
    severity: info
    autofix: false
    detect_semantic: Does this file/module have a single identifiable center of meaning
      that its parts support, or is it a flat bag of unrelated pieces?
    fix: Name the center; move supporting parts around it; extract pieces that belong
      to a different center.
  - id: LEVELS_OF_SCALE
    source: Christopher Alexander — The Nature of Order (levels of scale)
    name: Detail steps smoothly across scales, with no jarring jumps
    tier: aesthetic
    severity: info
    autofix: false
    detect_semantic: Is there a sudden jump in granularity (a 200-line method beside
      one-liners; a god object beside thin structs) with no intermediate level?
    fix: Introduce the missing intermediate level so structure changes gradually from
      system to line.
  file:
  - id: GUARD_EXPENSIVE
    source: MASTER-native (guard expensive operations)
    name: Check preconditions before costly work
    tier: kernel
    severity: error
    autofix: false
    detect_semantic: Does this file perform expensive operations (API calls, disk IO)
      without checking preconditions?
    fix: Guard clause before costly work. Estimate cost. Confirm if destructive.
  - id: SMALL_FILES
    source: Clean Code — small classes/files (Robert C. Martin)
    name: Files under 300 lines
    tier: clean_code
    severity: warning
    autofix: false
    detect_lexical:
    detect_structural: file_silhouette
    fix: Split at module boundaries.
  - id: CONSISTENT_FILE_STRUCTURE
    source: MASTER-native / project convention
    name: Consistent file structure order
    tier: clarity
    severity: info
    autofix: false
    detect_structural: file_layout
    fix: Reorder to match convention.
    languages:
    - ruby
  - id: FROZEN_STRING_LITERAL
    source: Ruby Style Guide / RuboCop Style/FrozenStringLiteralComment
    name: frozen_string_literal magic comment required
    tier: core
    severity: warning
    autofix: false
    detect_lexical: ~ # migrated to law/ (domain files; find by id)
    fix: 'Add ''# frozen_string_literal: true'' as first line.'
    languages:
    - ruby
  - id: SINGLE_PRIVATE_SECTION
    source: Ruby Style Guide / RuboCop Style/AccessModifierDeclarations
    name: One private keyword at bottom
    tier: design
    severity: info
    autofix: false
    detect_lexical: ~ # migrated to law/ (domain files; find by id)
    fix: Use a single 'private' keyword with methods below it.
    languages:
    - ruby
  - id: STRICT_MODE_ZSH
    source: Shell strict mode set -euo pipefail (Google Shell Style Guide)
    name: set -euo pipefail at script top
    tier: core
    severity: error
    autofix: false
    detect_lexical: ~ # migrated to law/ (domain files; find by id)
    fix: Add 'set -euo pipefail' after shebang.
    languages:
    - zsh
  - id: HTML_LANG
    source: WCAG 3.1.1 Language of Page (W3C/WAI)
    name: lang attribute on <html>
    tier: accessibility
    severity: error
    autofix: true
    detect_lexical: ~ # lives in the registry (law twin retired 2026-08-21)
    fix: Add lang="en" or appropriate locale.
    languages:
    - html
  - id: SEMANTIC_ELEMENTS
    source: HTML5 semantics / WCAG 1.3.1 (W3C)
    name: Use semantic HTML5 elements
    tier: accessibility
    severity: warning
    autofix: false
    detect_lexical: ~ # migrated to law/ (domain files; find by id)
    fix: Use <header>, <footer>, <nav>, <main>, <aside>, <article>, <section>.
    languages:
    - html
  - id: MOBILE_FIRST
    source: Mobile First (Luke Wroblewski, 2011)
    name: Mobile-first media queries
    tier: design
    severity: warning
    autofix: false
    detect_lexical: ~ # migrated to law/ (domain files; find by id)
    fix: Use min-width (mobile-first, progressive enhancement).
    languages:
    - css
  - id: NO_IMPORT_SCSS
    source: Sass best practice — @use over @import (Sass team)
    name: Replace @import with @use/@forward
    tier: design
    severity: warning
    autofix: false
    detect_lexical: ~ # migrated to law/ (domain files; find by id)
    fix: "@import is deprecated. Use @use/@forward."
    languages:
    - scss
  - id: NO_IMPORTANT
    source: CSS best practice — avoid !important (MDN)
    name: No !important
    tier: design
    severity: warning
    autofix: false
    detect_lexical: ~ # the registry (lib/review/scan/rules/web_rules.rb), not law/
    fix: Restructure selectors to avoid specificity bankruptcy.
    languages:
    - css
  - id: SQUINT_TEST
    source: Squint Test readability heuristic (Sandi Metz)
    name: Structure evident at a glance
    tier: aesthetic
    severity: info
    autofix: false
    detect_lexical: ~ # migrated to law/ (domain files; find by id)
    detect_semantic: Does this file have dense blocks with no visual breaks, or ragged
      indentation?
    fix: One blank line between sections, never more than two consecutive.
  - id: WHITESPACE_PUNCTUATION
    source: Typography / code style — whitespace as punctuation
    name: Whitespace as layout tool
    tier: aesthetic
    severity: info
    autofix: true
    detect_lexical: ~ # folded into another rule; no detector of its own
    folded_into: SQUINT_TEST # same detector; one law, two ids
    fix: One blank line between sections, never more than two.
  - id: NO_MULTIPLE_LANGUAGES
    source: MASTER-native (one language per file)
    name: One medium per artifact
    tier: clean_code
    severity: warning
    autofix: false
    detect_lexical: ~ # migrated to law/ (domain files; find by id)
    detect_semantic: Does this file embed multiple languages or notations? Does this
      document mix incompatible frameworks?
    fix: One language per layer. Separate into distinct files or clearly demarcated
      sections.
  - id: ARTIFICIAL_COUPLING
    source: The Pragmatic Programmer — avoid artificial coupling
    name: Things that do not depend on each other must not be grouped together
    tier: clean_code
    severity: warning
    autofix: false
    detect_semantic: Are unrelated concepts coupled by proximity or shared container?
      In a filing, are unrelated claims bundled into one count?
    fix: Separate into independent units. Each removable without affecting others.
  - id: I18N_COVERAGE
    source: Rails i18n best practice (no hardcoded strings)
    name: Wrap user-facing literals in I18n helpers
    tier: design
    severity: warning
    autofix: false
    detect_lexical: ~ # migrated to law/ (domain files; find by id)
    fix: Replace literal with t('.key').
    languages:
    - html
    path_match: "/app/views/"
  - id: STRICT_LOADING_MISSING
    source: Rails strict_loading — N+1 prevention (Rails Guides)
    name: AR model lacks strict_loading_by_default
    tier: design
    severity: info
    autofix: false
    detect_lexical: ~ # migrated to law/ (domain files; find by id)
    requires_absent: "\\bstrict_loading_by_default\\b"
    whole_file: true
    fix: Add `self.strict_loading_by_default = true` to surface missing eager-loads.
    languages:
    - ruby
    path_match: "/app/models/"
  - id: RATE_LIMITING_MISSING
    source: OWASP API Security — rate limiting
    name: Sensitive controller missing rate_limit/throttle
    tier: security
    severity: error
    autofix: false
    detect_lexical: ~ # migrated to law/ (domain files; find by id)
    requires_absent: rate_limit|throttle
    whole_file: true
    fix: Add rate_limit/throttle to sensitive actions.
    languages:
    - ruby
    path_match: "/app/controllers/"
  - id: MIGRATION_ADD_REFERENCE_NO_FK
    source: 'Rails migrations — foreign_key: true (Strong Migrations)'
    name: 'add_reference without foreign_key:'
