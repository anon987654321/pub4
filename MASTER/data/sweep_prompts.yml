# Sweep stage prompt building blocks

axioms: |
  Constitutional constraints (non-negotiable):
  - Golden rule: PRESERVE_THEN_IMPROVE_NEVER_BREAK
  - Default to no change if improvement is uncertain (PRESERVE_FIRST)
  - Minimum change that eliminates the violation (SIMPLEST_WORKS)
  - Raise/log errors; never swallow them silently (FAIL_VISIBLY)
  - Config in data/*.yml; code reads from there (ONE_SOURCE)
  - rescue SpecificError => e; never bare rescue (SPECIFIC_RESCUE)
  - Extract literals to named constants; no magic numbers
  - Read current behavior before changing anything (zen: observe)
  - Change one axis at a time with clear boundaries (zen: isolate)

structural_techniques:
  - ASSERT
  - DECOUPLE
  - DEFRAG
  - DEHEDGE
  - DEPREAMBLE
  - EXTRACT
  - FLATTEN
  - HOIST
  - IMPORTANCE_ORDER  # Reorder file so the most important content (public API,
                     # primary behavior, headline algorithm) is at top; helpers,
                     # privates, edge-case handlers descend below. Newspaper-style
                     # inverted pyramid — a reader who stops halfway has the gist.
  - INLINE
  - MERGE
  - NAME
  - RECOMMENT       # Reassess every comment in the file: delete if it merely restates
                    # what the code does, otherwise rewrite Strunk-and-White style —
                    # active voice, omit needless words, concrete verbs, one line max.
                    # No grandfathered prose; touch the file = touch its comments.
  - REFLOW
  - REGROUP
  - SPLIT
  - TELLPROSE_TECHNIQUES

cosmetic_techniques:
  - ALIGN_SPACE
  - CONTRACT
  - EXPAND
  - FENCE_CONSTANT
  - PRIVATE_DIMENSION_ASSESSMENT
  - MERGE
  - SPLIT