  - old: Master::Speech
    new: Master::Voice::Speech

  - old: Master::Personality
    new: Master::Voice::Personality

  - old: Master::Swarm
    new: Master::Judge::Swarm

  - old: Master::Scan
    new: Master::Judge::Scan

  - old: Master::Council
    new: Master::Judge::Council

  - old: Master::Session
