# Dead path references MASTER/tools/doc_paths.rb tolerates, with the reason.
#
# The list only shrinks. MASTER/test/test_doc_paths.rb fails on anything not
# listed here, and fails again when an entry stops being dead -- a fixed
# reference must leave the baseline rather than sit here claiming debt that no
# longer exists.
#
# Entries are findings, not decisions. The three OPENBSD/master.json entries left
# on 2026-08-07: master.json and master.yml are predecessors of the MASTER Ruby
# framework and are not supposed to exist. The inventory they named had already
# been renamed to OPENBSD/deploy_inventory.json; the constant, an env var and
# nine documents kept the dead name. Renamed rather than recreated.
#
# Two more left on 2026-08-12, both marked Open and both fixed rather than
# re-argued: MASTER/web/CLAUDE.md now says `bin/check --profile=web`, which is
# the command that exists, and RAILS/README.md documents domain_cluster as
# vendored -- the source went in 930a35ca5 and only the precompiled
# web/public/assets/domain_cluster-3bf218f7.js survives, so it ships and cannot
# be rebuilt. That was exactly what this entry asked for.

"OPENBSD/SSH_ACCESS.md":
  - path: priv/ssh/id_ed25519_brgen.pub
    why: >
      Deliberate, and load-bearing. Permanent exemption.

      Corrected 2026-08-12: this reason used to read "Keys are never committed;
      the document names where the operator keeps one locally", and on that
      reading the sentence was rewritten to send the reader to the VM instead.
      That was wrong and has been reverted. .gitignore lines 42-43 are
      `priv/ssh/` followed by `!priv/ssh/*.pub` -- public keys are explicitly
      un-ignored, so `priv/ssh/id_ed25519_brgen.pub` is where the public half is
      MEANT to live and "in repo" is accurate about the design. The file is
      simply not there yet.

      So this is not a dead reference to repair. It is a path waiting for its
      file, and the fix is to add the public key, not to reword the document.

"MASTER/DECISIONS.md":
  - path: data/design_rules.yml
    why: >
      A decision record naming the file whose fold it records. The path is
      meant to be dead; the entry explains why proximity to a consumer lost to
      having one definition. Repairing the reference would erase the decision.

"MASTER/EXAMPLES.md":
  - path: data/design_rules.yml
    why: >
      The worked example of this judgement, quoting the same file for the same
      reason as the DECISIONS.md entry above.
