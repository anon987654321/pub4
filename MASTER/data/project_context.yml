- key: reference_agent_evolution_harvest_2026_10
  name: agent-evolution harvest (EvoMap + kyrolabs lists)
  description: 12 adoptable council/memory ideas from the agent-evolution awesome-lists,
    2026-10-03
  type: reference
  body: 'Ideas, never frameworks (all Python). (1) SWE-Milestone: instruments must
    measure LONGITUDINAL decay — isolated task rate can hold while sustained behavior
    collapses (80%→38%); run past checks across evolution cycles and record the curve.
    (2) Agent0: derive curriculum from the failure ledger — unresolved scan debts/flaky
    checks become synthesized check cases, difficulty escalating. (3) Competition: candidate
    diffs in parallel worktrees, check ladder scores them, verifier merges only the
    survivor. (4) Agent Workflow Memory: distill successful repair sequences keyed
    by failure class; consult before improvising. (5) A-MEM: memory notes auto-linked;
    a new note may rewrite an older one it contradicts. (6) MemoryBank: forgetting
    curve — reinforcement on access, aging on silence, deletion as governed policy.
    (7) MemSkill: a declared policy (voice.yml-shaped) decides durable vs session-local
    memory. (8) TextGrad/OPRO/EvoPrompt: evolve the council''s critique prompts, scored
    against measured scanner false-positive rate. (9) Darwin Gödel Machine: evolution
    triggers archive variant+score (orders ledger), never single rewrites; rollback
    stays possible. (10) TMLR survey taxonomy: triggers declare their target (prompt/memory/rule)
    and timing (intra/between session) as YAML. (11) Latitude: cluster past failures
    by rule id, auto-generate regression cases per cluster. (12) ReflAct: state the
    intended terminal check-ladder state BEFORE a repair pass, diff actual against
    it. Already stronger than the lists: adversarial critique council, governance
    corpus, worktree isolation, self-consistency. Known gap: no runtime benchmark
    loop like SWE-bench.'
- key: reference_openbsd_awesome_harvest_2026_10
  name: OpenBSD harvest (ligurio/awesome-openbsd)
  description: What the OpenBSD awesome-list offers vm23; thin on memory-pressured
    services
  type: reference
  body: '2026-10-03. The list curates hosting/community/virtualization; relayd appears
    once and nothing touches httpd/rc.d/swap — man pages stay the law. Adoptables:
    OpenBSD CI runners (Sourcehut builds or GitHub vmactions/openbsd-vm) take OPENBSD/
    suites off vm23''s 1GB; bupstash — encrypted client-separated backups off the
    box; eradman''s autoinstall site-tarball — scripted full reprovision, the pipeline''s
    missing bottom rung; qbit/snap — sysmerge+package upgrades in one pass, lighter
    on 1 vCPU; M:Tier binpatches/LTS — base+package security fixes without rebuild
    cycles; snmpd (in base) with SNMP v3 for external load/swap watching (cold-TTFB
    evidence before symptoms); dmesgd.nycbug.org for peer comparison; dank-selfhosted
    and vedetta as relayd/pf reference boilerplate; upobsd for bsd.rd ritual. Anti-recommendation:
    K3s-over-vmm would eat the whole box. Nothing addresses relayd''s 8KB header limit,
    swap thrash, boot storms or per-app shared engine copies.'
- key: reference_face_restoration_harvest_2026_10
  name: face-restoration harvest (sczhou + polarisZhao lists)
  description: CPU-qualified face instruments for postpro; relight path is parse +
    3DMM normals over the DA-V2 near-map
  type: reference
  body: '2026-10-03. postpro has no face detection/parsing/3D fit — skin_protect (postpro.rb:1518)
    is an HSV hue+saturation mask that also catches wood, brick and rust. CPU-qualified
    adoptables: YuNet/libfacedetection (pure-C ms-class detector, most Ruby-friendly
    via FFI/ONNX); RetinaFace-MobileNet0.25 (~1.7MB ONNX) for true face detection;
    CelebAMask-HQ/BiSeNet parsing (19 classes) — grade skin only, leave eye whites/irises,
    give relight region masks (highest value); 3DDFA_V2 (few hundred ms CPU) — the
    one thing monocular depth cannot give: per-pixel face normals on the convex face
    plane where the DA-V2 near-map is least reliable; PRNet/2D-3D FAN — standardized
    head crops across both lora subjects before curate; ArcFace ONNX — identity-drift
    guard (refuse on similarity drop) plus dataset dedupe; CodeFormer/GFPGAN ONNX
    — pre-restore pass for degraded sources entering datasets; PSFRGAN''s pipeline
    order (parse → per-region transform) as pure design; PPR10K corpus to fit the
    skin_protect band against real portrait pairs. Adoptable path: parse regions;
    3DMM normals light face pixels; DA-V2 near-map demoted to scene. Too heavy: DR2,
    DifFace, PULSE, MyStyle (MyStyle ≈ what the lora tree already is), GPEN/VQFR training.
    No relighting models in either list.'
- key: reference_tts_voice_harvest_2026_10
  name: TTS/voice harvest (TouchSky + isaacgounton + wildminder lists)
  description: 12 adoptables and 5 gaps for the voice stack; edge-tts is cloud-reliant
    and that is the top gap
  type: reference
  body: '2026-10-03. Top: rb-edge-tts is NOT local — it calls Microsoft''s endpoint;
    a network cut silences MASTER. Adoptables: Kokoro-82M (ONNX, ~edge quality, Mac-sized)
    for genuinely offline en-US; KittenTTS (15M, <25MB) as vm23-grade rescue voice;
    eSpeak-NG as the final offline rung; KokoClone (3-10s reference) puts Johann''s
    own voice in the rotation; Scylla''s six continuous affect axes → voice.yml entries
    as affect coordinates Voice::Policy interpolates, not named-voice picks; inline
    delivery tags (<laugh>, [pause 3.2s], <|emotion|>) as a markup convention in the
    utterance stream, mapped by post_chain today and engine-agnostic tomorrow; NovaSR
    (~52kB) upsamples 16k→48k to close the speech/bed spectral gap; ZipEnhancer/PASE
    denoise before Speech#shaped for the mic path (the echo/"random facts" bugs came
    from there); UTMOS/DNSMOS + ECAPA2 speaker-similarity + WER round-trip through
    a tiny ASR — the quality ratchet MASTER ships without. Gap decisions to make explicitly:
    open-weight local models have NO nb-NO coverage (keep edge for nb, go local for
    en?); no cloning path; no closed audio loop (ASR+VAD around the mic). Do-not-chase:
    gTTS/pyttsx3, gateway+Redis+React duplicates, hand-rolled vocoders, latent-diffusion
    foley (dilla''s bespoke bed outranks one), dataset fine-tuning (no budget).'
- key: reference_grain_emulation_harvest_2026_10
  name: film-grain + grading harvest (Dehancer/Nuke/Ansel/agx/Oxio sources)
  description: Sourced grain-calibration numbers, pipeline order and destroyed-vs-emulated
    criticism — basis for postpro heavy-mode tuning
  type: reference
  body: '2026-10-03, prompted by postpro renders reading destroyed rather than enhanced.
    Ground truth: silver crystals are 2-8um (~5-6um fast colour neg), smaller than
    a 4K pixel on a 35mm frame — visible grain is CLUMPS, never pixel-locked (video.stackexchange
    q19394). Calibration: Dehancer auto-scales grain to format with its Film Resolution
    rule (smallest film detail can''t be smaller than grain size — grain amount must
    COST detail); Nuke Grain node = Proportional + Base Resolution reference width
    (postpro''s GRAIN_REFERENCE_WIDTH already matches); Ansel photographic-grain =
    4px crystals at 100% zoom, log-normal, ~30 layers; agx-emulsion fits per-stock
    Gaussian local-SD tables from real HP5/Delta/Tri-X scans. Print grain coarser
    than negative grain. PIPELINE ORDER: NR -> curves -> sharpen -> halation/glow
    -> grain LAST, exactly once; grain added over halation gets glowed (blackmagicforum
    t175096); stacking passes forbidden (r/NukeVFX). Chroma: one correlated mono signal
    split ~0.25R/0.6G/0.15B in linear light (Oxio); independent per-channel noise
    reads CG. Destroyed-look criticism: uniform exaggerated strength, static pattern,
    halation on everything (Fstoppers'' "cheugy" essay — halation belongs to wide-open
    speculars on specific stocks like 800T on digital). Yedlin: model quality beats
    scan plates. Repos: andre-gfx/agx-emulsion, EaryChow/AgX, darktable dtgrainjulia,
    JanLohse/spectral_film_lut, spektrafilm-rs (spectral neg->print with DIR couplers,
    postpro''s twin), ComfyUI-Darkroom, imazen/zenfilters, IPOL Newson 2017 + ChickenDream
    (the Boolean-disk reference). Applied same day: HEAVY_STRENGTH 2.0->1.35, HEAVY_AMPLITUDE_STRENGTH
    1.1 exempting grain+wear from widening, grain removed from all four lane pools
    (the always-grain is the only pass), vocab-check pin added.'
- key: brgen_typography_swiss_only
  name: brgen type is Swiss sans only
  description: Operator directive 2026-10-11 — no serifs anywhere in brgen, amber or the shared layer (amber added 2026-10-11)
  type: project
  body: |-
    brgen, RAILS/amber and RAILS/__shared set type in the Helvetica Neue Pro, Helvetica Neue, Arial sans stack (var(--font)), plus one monospace stack (var(--font-mono)) for the terminal chats. No serif, no other family. Editorial and display moments get contrast from scale and weight, never a serif. Enforced by Operator::TypographyLint (kind serif_family, scope RAILS/brgen* and RAILS/__shared, lightgallery.css excepted as vendored), by Master::Design::Pairing routing editorial and luxury to the swiss_house pairing, and by Master::Design::Typeface::HOUSE_RULE in the /fix visual critique prompt. A council proposal that adds a serif or another family is refused.
- key: project_ascii_face_replaces_braille_2026_10
  name: the terminal face is plain ASCII, Braille is retired
  description: Operator decision 2026-10-12 — replaces the Braille terminal face approved 2026-09-25; web and CLI render the same way
  type: project
  body: |-
    Operator, 2026-10-12: "i dont want to use braille anymore ... it has to look better. ideally just monospaced characters", then, after seeing AndrewSink/STL-to-ASCII-Generator, "a face like that would be nice!" and "the web face should be like this too, web and cli the same". This replaces the Braille point-cloud face approved on 2026-09-25. There is no Braille toggle and no Braille code.

    The renderer is Master::CLI::Face::Ascii (lib/cli/face/ascii.rb, glyphs.rb, features.rb, mesh.rb, pose.rb). It draws a lit triangle mesh (2026-10-12, operator: "go ahead with the proper 3d mesh face", replacing the point cloud): Face::Head builds a closed, outward-wound grid mesh of a few thousand triangles from the painted depth map and morphology, a CPU z-buffered rasteriser (supersampled, backface culled, identical in Ruby and in the web port, no WebGL) lights it with an orbiting key light, a fill, a rim and a cheap specular term plus cavity darkening, and each cell takes the mean tone of its samples. A mask is the same mesh under other numbers and a morph is vertex interpolation. Layers: contours (silhouette and creases only) (| - / \ with the cell aspect corrected, and ' - _ for half-cell edges), a dithered ink ramp ordered by measured glyph ink (tools/face_ascii_fixtures.rb ink; the ink column in tokens.yml) for the surface (integer ordered dither fixed in screen space, so turning does not shimmer), explicit glyph features (eyes, brows, nose line, mouth), and depth as bold near and dim far. Any ASCII STL or OBJ (Face::Mesh) shows the same way. The ramp is replaceable (MASTER_FACE_CHARS), MASTER_FACE_MODE=light inverts it, MASTER_CLI_QUIET=1 draws the plain state word, MASTER_REDUCED_MOTION=1 holds the head still. Motion is a constant slow turn with a breath, a pitch sway, blinks and glances.

    Every tunable and the algorithm steps live in data/tokens.yml, face_interface.ascii, read by Ruby and by the web face. test/fixtures/face_ascii_frames.json (written by tools/face_ascii_fixtures.rb) holds exact frames the web port asserts under node. Boot, prompt and status chrome remain ordinary text; the face renderer alone owns ASCII art.
- key: reference_openbsd_kernel_philosophy_2026_10
  name: OpenBSD kernel philosophy and agent-framework review (2026-10-13)
  description: Architectural intent plus evidence-led review of Rubik, constitutional governance projects, and repair agents.
  type: reference
  body: |-
    Intent: adopt OpenBSD engineering discipline, not copy its kernel literally. Simplicity and regularity reduce the surface that people must understand and audit. Correctness is the foundation of security. Implementations and changes should be inspectable; invalid states should become visible early; authority should be limited at explicit boundaries; platform differences should remain at real seams. Preserve observable behavior, public contracts, and side-effect order unless a deliberate change is justified and verified. Unknown, blocked, timed-out, skipped, and inconclusive are distinct from success.

    Primary OpenBSD sources: https://www.openbsd.org/goals.html ; https://man.openbsd.org/style.9 ; https://www.openbsd.org/papers/dev-sw-hostile-env.html ; https://www.openbsd.org/security.html ; https://man.openbsd.org/pledge.2 ; https://man.openbsd.org/unveil.2 .

    Existing pub4 mechanisms already embody much of this: soul.yml sets PRESERVE_THEN_IMPROVE_NEVER_BREAK and truthful-evidence constraints; laws.yml defines ROBUSTNESS, SINGULARITY, LINEARITY, PROXIMITY, ABSTRACTION and DENSITY, plus evidence-ranked transformation policy preserving semantics, public contracts, references, and side-effect order. The four-tree ownership and dependency contract lives in MASTER/data/laws.yml#architecture; the live Core::Fold, Constitution, World, Memory and Proof implementations plus their tests enforce the runtime sequence and separate observation/planning/verification from mutation. Core::World has atomic writes, symlink-aware workspace containment, secret-path refusal, and path-scoped rollback for a failed write. Core::Proof checks real command producers and distinct evidence kinds. Reinforce these; do not add duplicate registries or grow the kernel spine merely to resemble another project.

    Rubik (MIT, https://github.com/ozgurulukir/rubik): source docs describe fail-closed command/path/synthesis checks, atomic writes, audit records, a reviewable file buffer, and an LIFO inverse runtime. SECURITY.md explicitly says the optional OS sandbox is disabled by default; policy gating and OS isolation must be treated as separate controls. Study only bounded inverse/compensation semantics if a demonstrated gap justifies them; do not import Rubik's full agent/runtime architecture.

    Ruby Agent (https://github.com/stiller/ruby-agent): approved patch flow, Git checkpoint, rollback and transcript. Those primitives overlap MASTER's effect admission, scoped checkpoints and observations; no dependency is justified.

    repo-bug-hunter (https://github.com/Manishmaurya89/repo-bug-hunter): valuable evaluation method—reproduce a bug with a failing test, re-run it at submit, grade against hidden regression tests, replay every step, and compare variants on paired tasks. It is Python/Docker-based and should not become a MASTER runtime dependency; adapt its test-first experimental method in Ruby if needed.

    arifOS (https://github.com/ariffazil/arifOS): its README's current-verified-state block dated 2026-10-11 reports 2 floors passing, 4 failing, 10 unmeasured, and a mismatch where a HOLD verdict was persisted as ok:true in invocation telemetry; it also says no independent external verifier is bound. This is a caution, not a condemnation: governance slogans, dashboards, and ledgers do not prove correctness unless telemetry preserves the actual verdict and independent reconstruction can verify it. Unmeasured is not pass.

    AXIOM-MESH (https://github.com/Zoverions/AXIOM-MESH) reinforces explicit intent, policy authority, bounded effects and portable evidence, but its Node.js/runtime stack offers no demonstrated missing capability in MASTER. HELIX-CORE (https://github.com/helixprojectai-code/HELIX-CORE) advertises a multi-layer, multi-cloud system; documentation alone did not establish a concrete mechanism MASTER needs. Kestrel Sovereign (https://github.com/KestrelSovereignAI/kestrel-sovereign) is Python-first and pre-1.0; its own README identifies plaintext saved-item/RAG chunk bodies while encryption is incomplete. Neither warrants importing a framework.

    AutoDevOps AI (https://github.com/koustubh-v/AutoDevOps-AI) is a React/Node + Python service stack with Gemini and Firebase; CodeHealer (https://github.com/Deepanhp/code-healer) depends on Rails, Sidekiq, Redis, GitHub and OpenAI; both add stacks that conflict with MASTER's small pure-Ruby core. Rubyn Code (https://github.com/MatthewSuttles/rubyn-code) offers useful areas to compare—MCP, context indexing, phased plans and skills—but overlaps existing tooling and is not a reason to add its 112-skill catalog or dependency tree. The supplied iterate URL did not resolve to a README through the repository connector; no implementation claim is accepted from it. Kward, rubycode and Ocak had no repository URLs in the supplied note, so they remain unreviewed rather than guessed.

    Decision: no wholesale agent framework, new gem, multi-agent layer, cloud stack or self-modifying
    constitution. Implemented 2026-10-13: `MASTER/lib/core.rb` derives a typed reversibility
    contract from each Effect rather than trusting a model-supplied label;
    `MASTER/lib/core/constitution.rb` requires operator approval for Git stage/commit and blocks
    unhandled operations; `MASTER/lib/core/fold.rb` re-admits a declared argv compensation and
    requires operator approval after the original exec fails. A successful compensation never
    turns the original failure into success. `MASTER/lib/core/model.rb` exposes the structured
    compensation schema, `MASTER/test/test_core_reversibility.rb` covers classification,
    approval, malformed compensation, successful compensation and refusal, and
    `MASTER/data/laws.yml` is the design authority; tests pin the runtime behavior. Git history and the shared index have no automatic
    inverse. Generic exec and HTTP remain policy-gated, not presumed reversible. Do not claim
    verification yet: the tests were added but have not been run in a Ruby checkout. Future work
    must test idempotency, partial failure and concurrent changes before expanding the set of
    compensators.
- key: feedback_write_straight_to_main_2026_10_19
  name: historical direct-to-main restriction superseded
  description: Historical 2026-10-19 restriction; superseded by the explicit 2026-10-27 directive to restore managed worktrees and short-lived branches.
  type: feedback
  body: >-
    The 2026-10-19 instruction to write every change directly to main is historical
    and superseded by the explicit 2026-10-27 decision to restore isolated worktrees.
    Use a managed worktree and short-lived topic branch for broad, parallel or
    architectural work; use path-scoped direct-to-main landing only for small
    corrections made from a clean main checkout. Never use git commit -a in a
    shared checkout. Worktree creation refuses dirty source state unless the
    operator explicitly opts out, and worktree removal refuses dirty trees while
    preserving the branch. bin/operator land pushes only the current branch; a
    topic branch reaches main only after deliberate integration.
- key: feedback_stream_long_runs_live_2026_10_22
  name: stream long runs live
  description: 2026-10-22 directive, Johann - a suite, check or /fix run reports as it goes, never only at its end
  type: feedback
  body: >-
    Johann, 2026-10-22: "why do i have to wait 20 minutes? why cant you read the result in real time?
    ... i dont wanna have to wait days for some results only to find out it got stuck and never wrote
    any output". Why - a run that reports only at its end hides a hang or a silent death until the
    whole budget is spent; a MASTER rake test once stopped after 3,632 tests with no report at all.
    How to apply - every long run writes its output as it happens and is watched: each failing test
    named when it fails, progress at least once a minute, and a stall called when nothing finishes
    for two minutes. bin/check streams each step to .master/check/<step>.log as it runs; fix-here
    stops a run its StallWatch finds stalled. Run minitest with TESTOPTS="-v --seed=N" (the = form;
    rake splits a space).
- key: feedback_fix_the_fixer_offline_2026_10_22
  name: fix /fix before running it
  description: 2026-10-22 directive, Johann - /fix is repaired through its suites and code, not by trial runs
  type: feedback
  body: >-
    Johann, 2026-10-22: "i told you to fully fix /fix before using it". Three bounded trials that day
    each stopped on a /fix defect (a spent run journal resumed, HEAD in the baseline key, a known-red
    record naming steps not tests, a test that exits ending the suite). Why - a trial costs over thirty
    minutes, writes autofix edits into the shared checkout and finds defects the suites and code
    should have shown. How to apply - find and fix /fix defects through test_fix_*, test_proof_*,
    test_check_chain and the full suite; run /fix only when Johann says so after hearing what is fixed.
