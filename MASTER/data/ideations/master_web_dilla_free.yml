  - { candidate: free_f01, verdict: keep, attack: "The stale number makes the router hammer a limit four times past reality (200 assumed vs 50 actual) and read 429s as flapping instead of quota — the correction is executable today and grounded in the provider's own docs. The risk is that limits move again; the comment carries the date and the unlock rule so the next check has something to compare against." }
