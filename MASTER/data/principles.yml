principles:
  01-kiss:
    name: KISS (Keep It Simple, Stupid)
    description: The most famous principle
    tier: core
    priority: 1
    auto_fixable: false
    anti_patterns:
      - name: over_engineering
        smell: Building for hypothetical future requirements
        fix: Delete abstractions until it hurts
      - name: unnecessary_complexity
        smell: Nested conditionals, convoluted logic, too many parameters
        fix: Extract methods, use early returns, simplify
      - name: premature_abstraction
        smell: Creating interfaces or base classes before a second use case
        fix: Wait for duplication, then abstract
  02-dry:
    name: DRY (Don't Repeat Yourself)
    description: Every piece of knowledge must have a single, authoritative representation
    tier: core
    priority: 2
    auto_fixable: true
    anti_patterns:
      - name: duplicate_code
        smell: Same logic in multiple places
        fix: Extract to a shared method or module
      - name: copy_paste_programming
        smell: Copying code instead of abstracting
        fix: Parameterize the original and reuse it
  03-yagni:
    name: YAGNI (You Aren't Gonna Need It)
    description: Implement only what is needed now, not what might be needed later
    tier: core
    priority: 3
    auto_fixable: true
    anti_patterns:
      - name: speculative_generality
        smell: Building for imagined future requirements
        fix: Delete until actually needed
      - name: unused_code
        smell: Methods or classes never called
        fix: Delete them
      - name: dead_code
        smell: Unreachable code paths
        fix: Delete them
  04-separation-of-concerns:
    name: Separation of Concerns
    description: Divide the program into distinct sections, each addressing a single concern
    tier: core
    priority: 4
    auto_fixable: false
    anti_patterns:
      - name: mixed_concerns
        smell: One module handles unrelated responsibilities
        fix: Split into focused modules (e.g., UserAuth, UserMailer, UserBilling)
      - name: ui_logic_in_models
        smell: Domain models contain presentation logic
        fix: Use presenters or decorators for display logic
      - name: business_logic_in_views
        smell: Templates contain conditionals and calculations
        fix: Move logic to models or presenters and expose simple flags
  05-single-responsibility:
    name: Single Responsibility (SOLID S)
    description: A module should have one, and only one, reason to change
    tier: solid
    priority: 5
    auto_fixable: true
    anti_patterns:
      - name: god_class
        smell: Class over 300 lines or more than 10 public methods
        fix: Extract concerns into focused classes
      - name: feature_envy
        smell: Method uses another class more than its own
        fix: Move the method to the class it envies
      - name: long_method
        smell: Method over 20 lines or with more than five nesting levels
        fix: Extract into smaller, well‑named methods
  06-open-closed:
    name: Open‑Closed (SOLID O)
    description: Open for extension, closed for modification
    tier: solid
    priority: 6
    auto_fixable: false
    anti_patterns:
      - name: shotgun_surgery
        smell: One change requires edits in many files
        fix: Use the Strategy pattern or dependency injection
      - name: rigid_design
        smell: Cannot extend without modifying core code
        fix: Use polymorphism, plugins, or hooks
  07-liskov-substitution:
    name: Liskov Substitution (SOLID L)
    description: Subtypes must be substitutable for their base types
    tier: solid
    priority: 7
    auto_fixable: false
    anti_patterns:
      - name: refused_bequest
        smell: Subclass does not use inherited methods
        fix: Prefer composition or remove the inheritance
      - name: type_checking
        smell: Checking class type instead of using polymorphism
        fix: Define a common interface and let each type implement it
  08-interface-segregation:
    name: Interface Segregation (SOLID I)
    description: Clients should not depend on interfaces they do not use
    tier: solid
    priority: 8
    auto_fixable: false
    anti_patterns:
      - name: fat_interface
        smell: Interface with too many methods
        fix: Split into smaller, role‑based interfaces
      - name: forced_implementation
        smell: Empty or stub implementations of interface methods
        fix: Remove the method from the interface or use mixins
  09-dependency-inversion:
    name: Dependency Inversion (SOLID D)
    description: Depend on abstractions, not concretions
    tier: solid
    priority: 9
    auto_fixable: false
    anti_patterns:
      - name: tight_coupling
        smell: Class directly instantiates its dependencies
        fix: Inject dependencies through the constructor
      - name: hard_coded_dependencies
        smell: Concrete class names scattered throughout code
        fix: Inject abstractions so implementations can be swapped
  10-law-of-demeter:
    name: Law of Demeter
    description: Only talk to your immediate friends
    tier: design
    priority: 10
    auto_fixable: true
    anti_patterns:
      - name: message_chains
        smell: Long chains like `a.b.c.d.e`
        fix: Add a delegate method, e.g., `order.customer_city`
      - name: inappropriate_intimacy
        smell: Class knows too much about another’s internals
        fix: Use the public interface and hide implementation details
  11-composition-over-inheritance:
    name: Composition Over Inheritance
    description: Favor object composition instead of class inheritance
    tier: design
    priority: 11
    auto_fixable: false
    anti_patterns:
      - name: deep_hierarchy
        smell: Inheritance chain deeper than three levels
        fix: Flatten with mixins or composition
      - name: refused_bequest
        smell: Subclass ignores or overrides most parent methods
        fix: Use composition (`has_a`) rather than inheritance (`is_a`)
      - name: inheritance_abuse
        smell: Inheriting for code reuse, not substitutability
        fix: Compose a class with reusable components instead
  12-fail-fast:
    name: Fail Fast
    description: Errors should be reported as soon as they are detected
    tier: reliability
    priority: 12
    auto_fixable: true
    anti_patterns:
      - name: silent_failure
        smell: Errors caught and ignored
        fix: Log, re‑raise, or handle explicitly
      - name: swallowed_exceptions
        smell: Catching broad exceptions and hiding the root cause
        fix: Catch specific exceptions; let others bubble up
      - name: defensive_nulls
        smell: Returning `nil` instead of raising on error
        fix: Raise an exception or use a Result monad
  13-principle-of-least-astonishment:
    name: Principle of Least Astonishment
    description: Systems should behave as users expect
    tier: ux
    priority: 13
    auto_fixable: false
    anti_patterns:
      - name: surprising_behavior
        smell: Method does something unexpected from its name
        fix: Rename or split, e.g., `save_and_notify`
      - name: inconsistent_api
        smell: Similar methods behave differently
        fix: Establish conventions and document behavior
      - name: hidden_side_effects
        smell: Getter that modifies state
        fix: Separate query from command
  14-command-query-separation:
    name: Command‑Query Separation
    description: Methods should either change state OR return data, never both
    tier: design
    priority: 14
    auto_fixable: true
    anti_patterns:
      - name: side_effects_in_queries
        smell: Getter modifies state
        fix: Split into `stack.top` and `stack.remove`
      - name: mixed_responsibilities
        smell: Method both computes and persists
        fix: Separate calculation from persistence
  15-boy-scout-rule:
    name: Boy Scout Rule
    description: Leave the code cleaner than you found it
    tier: practice
    priority: 15
    auto_fixable: true
    anti_patterns:
      - name: technical_debt_ignored
        smell: TODO comments never addressed
        fix: Fix now or delete the comment
      - name: broken_windows
        smell: Visible code rot left unfixed
        fix: Clean up on each commit, no exceptions
  16-unix-philosophy:
    name: Unix Philosophy
    description: Do one thing and do it well
    tier: architecture
    priority: 16
    auto_fixable: false
    anti_patterns:
      - name: monolithic_design
        smell: Single application does everything
        fix: Extract services and use clear module boundaries
      - name: tight_coupling
        smell: Components cannot be used independently
        fix: Communicate via stdin/stdout and compose with pipes
  17-functional-core-imperative-shell:
    name: Functional Core, Imperative Shell
    description: Pure logic lives in the core; side effects are confined to the edges
    tier: architecture
    priority: 17
    auto_fixable: false
    anti_patterns:
      - name: scattered_side_effects
        smell: IO/DB calls deep in business logic
        fix: Return data from the core and let the shell handle IO
      - name: impure_core
        smell: Core functions depend on global state
        fix: Inject configuration and keep core deterministic
  18-idempotent-operations:
    name: Idempotent Operations
    description: Repeated identical calls produce the same result
    tier: reliability
    priority: 18
    auto_fixable: false
    anti_patterns:
      - name: non_idempotent_mutations
        smell: Repeated calls yield different outcomes
        fix: Use an explicit idempotent operation, e.g., `set_counter(value)`
      - name: unsafe_retries
        smell: Retry logic without idempotency keys
        fix: Add an idempotency key and check before processing
  19-defensive-programming:
    name: Defensive Programming
    description: Never trust input
    tier: reliability
    priority: 19
    auto_fixable: true
    anti_patterns:
      - name: missing_validation
        smell: User input used without checks
        fix: Whitelist, sanitize, and validate all input
      - name: trust_boundary_violation
        smell: Internal code trusts external data
        fix: Validate at boundaries and fail on invalid data
  20-graceful-degradation:
    name: Graceful Degradation
    description: Partial functionality is preferable to total failure
    tier: reliability
    priority: 20
    auto_fixable: false
    anti_patterns:
      - name: missing_fallback
        smell: Single point of failure crashes the system
        fix: Provide fallback resources, e.g., stale data from a cache
      - name: cascade_failures
        smell: One service down brings others down
        fix: Use circuit breakers, timeouts, and bulkheads
  21-explicit-over-implicit:
    name: Explicit Over Implicit
    description: Favor clarity; make intent obvious
    tier: clarity
    priority: 21
    auto_fixable: true
    anti_patterns:
      - name: magic_values
        smell: Unexplained literals in code
        fix: Define constants, e.g., `STATUS_APPROVED = 7`
      - name: hidden_behavior
        smell: Implicit conversions or callbacks
        fix: Make transformations explicit in the code path
      - name: implicit_conversions
        smell: Type coercion without an explicit cast
        fix: Use explicit casts, e.g., `int("5") + 3`
  22-convention-over-configuration:
    name: Convention Over Configuration
    description: Sensible defaults reduce boilerplate
    tier: productivity
    priority: 22
    auto_fixable: false
    anti_patterns:
      - name: excessive_configuration
        smell: Every behavior requires explicit configuration
        fix: Provide sensible defaults and override only when needed
      - name: missing_defaults
        smell: No default behavior; everything is explicit
        fix: Supply defaults, e.g., localhost:5432, timeout 30 s
  23-progressive-disclosure:
    name: Progressive Disclosure
    description: Show basics first, reveal details on demand
    tier: ux
    priority: 23
    auto_fixable: false
    anti_patterns:
      - name: information_overload
        smell: All options displayed at once
        fix: Use a wizard flow; show advanced options only when requested
      - name: no_hierarchy
        smell: Flat presentation with no visual priority
        fix: Make primary actions prominent, secondary actions subdued
  24-real-time-feedback:
    name: Real‑Time Feedback
    description: Keep users informed of system status
    tier: ux
    priority: 24
    auto_fixable: true
    anti_patterns:
      - name: silent_operations
        smell: No indication that work is happening
        fix: Show a spinner, progress bar, or status message
      - name: missing_progress
        smell: Long operation with no updates
        fix: Display step info, e.g., “Installing 3/7: database…”
  25-meaningful-names:
    name: Meaningful Names
    description: Names should reveal intent
    tier: clarity
    priority: 25
    auto_fixable: true
    anti_patterns:
      - name: cryptic_names
        smell: Single‑letter or unclear abbreviations
        fix: Use descriptive parameters, e.g., `def process_payment(amount, currency, user)`
      - name: abbreviated_names
        smell: Shortened names that obscure meaning
        fix: Spell out full words; IDE autocomplete can help
      - name: generic_names
        smell: Names that could mean anything
        fix: Be specific, e.g., `user_profile`, `error_message`
  26-small-functions:
    name: Small Functions
    description: Functions should do one thing and do it well
    tier: clean_code
    priority: 26
    auto_fixable: true
    anti_patterns:
      - name: long_method
        smell: Method over 20 lines
        fix: Extract into focused helpers such as `validate`, `calculate`, `persist`
      - name: multiple_responsibilities
        smell: Method does unrelated things
        fix: Split into separate methods like `save`, `email`, `log`
  27-few-arguments:
    name: Few Arguments
    description: Ideal is zero to two arguments per method
    tier: clean_code
    priority: 27
    auto_fixable: true
    anti_patterns:
      - name: long_parameter_list
        smell: More than four parameters
        fix: Group into a parameter object or builder
      - name: parameter_objects_needed
        smell: Same parameters are passed together repeatedly
        fix: Create a dedicated object, e.g., `ConnectionConfig`
  28-no-side-effects:
    name: No Side Effects
    description: Functions should not change state they do not own
    tier: functional
    priority: 28
    auto_fixable: false
    anti_patterns:
      - name: hidden_side_effects
        smell: Function modifies external state silently
        fix: Make side effects explicit, e.g., `get_user` then `touch_user`
      - name: global_mutation
        smell: Function mutates global variables
        fix: Return a value instead of mutating globals
  29-immutability:
    name: Immutability
    description: Prefer immutable data structures
    tier: functional
    priority: 29
    auto_fixable: false
    anti_patterns:
      - name: mutable_shared_state
        smell: Multiple threads or functions modify the same object
        fix: Freeze objects and use thread‑local copies
      - name: defensive_copies_needed
        smell: Need to copy data to prevent corruption
        fix: Default to frozen/immutable structures
  30-pure-functions:
    name: Pure Functions
    description: Same input always yields the same output
    tier: functional
    priority: 30
    auto_fixable: true
    anti_patterns:
      - name: impure_functions
        smell: Output depends on hidden state
        fix: Pass all dependencies as parameters
      - name: hidden_dependencies
        smell: Function reads from global or environment without declaring it
        fix: Accept required values as arguments, e.g., `process(mode)`
  31-cost-transparency:
    name: Cost Transparency
    description: Show LLM costs in real time
    tier: llm
    priority: 31
    auto_fixable: true
    anti_patterns:
      - name: hidden_costs
        smell: API calls without displaying token or cost counts
        fix: Display `[$0.0023, 847 tokens]` after each call
      - name: surprise_bills
        smell: Users discover costs only at billing
        fix: Show a running total and alert at thresholds
  32-cache-aggressively:
    name: Cache Aggressively
    description: Cache LLM responses whenever possible
    tier: llm
    priority: 32
    auto_fixable: true
    anti_patterns:
      - name: redundant_api_calls
        smell: Same prompt sent multiple times
        fix: Hash the prompt and cache the response for 24 h
      - name: wasted_tokens
        smell: Re‑computing results that could be cached
        fix: Pre‑compute, cache, and reuse
  33-squint-test:
    name: Squint Test (Visual Rhythm)
    description: Code and documents should look pleasing from afar
    tier: aesthetic
    priority: 33
    auto_fixable: true
    anti_patterns:
      - name: wall_of_text
        smell: Dense blocks with no visual breaks
        fix: Add breathing room between logical sections
      - name: ragged_indentation
        smell: Inconsistent nesting that zigzags visually
        fix: Enforce consistent indentation
      - name: orphan_lines
        smell: Single lines isolated between large blocks
        fix: Group related code together
      - name: asymmetric_structure
        smell: Lopsided files with logic concentrated at one end
        fix: Balance method sizes or extract classes
      - name: no_paragraph_breaks
        smell: Prose without visual chunking
        fix: Break into digestible paragraphs
  34-prose-over-lists:
    name: Prose Over Lists
    description: Flowing prose is easier to read than bullet points, numbered lists, or tables
    tier: communication
    priority: 34
    auto_fixable: false
    anti_patterns:
      - name: bullet_point_thinking
        smell: Ideas expressed as disconnected bullets
        fix: Write a sentence that connects the ideas
      - name: numbered_steps
        smell: Instructions presented as a numbered list rather than narrative
        fix: Describe the workflow as continuous prose
      - name: table_abuse
        smell: Tables used for non‑tabular data
        fix: Use prose or a simple inline format
  35-mass-generation-curation:
    name: Mass Generation with Curation
    description: When quality matters, generate many variations and curate ruthlessly
    tier: creative
    priority: 35
    auto_fixable: false
    anti_patterns:
      - name: first_draft_syndrome
        smell: Accepting the first output without alternatives
        fix: Generate a swarm and curate
      - name: incremental_refinement
        smell: Polishing one idea instead of exploring many
        fix: Explore breadth before depth
      - name: false_scarcity
        smell: Treating AI generation as expensive when it is cheap
        fix: Generate abundantly for high‑stakes tasks
  36-analog-warmth:
    name: Analog Warmth Over Digital Perfection
    description: Perfect is sterile
    tier: aesthetic
    priority: 36
    auto_fixable: true
    anti_patterns:
      - name: clinical_output
        smell: Generated images with zero texture or character
        fix: Apply film‑stock emulation and subtle grain
      - name: over_sharpening
        smell: Artificial clarity that screams digital
        fix: Embrace natural softness of vintage lenses
      - name: uniform_color
        smell: Mathematically perfect color with no drift
        fix: Add lift to shadows and a subtle color cast
  37-guard-expensive-operations:
    name: Guard Expensive Operations
    description: Some operations cost real money or have irreversible consequences
    tier: safety
    priority: 37
    auto_fixable: true
    anti_patterns:
      - name: silent_spending
        smell: API calls without cost visibility
        fix: Display a cost estimate before execution
      - name: accidental_production
        smell: Destructive operations without confirmation
        fix: Require explicit opt‑in for dangerous actions
      - name: runaway_loops
        smell: Unbounded iteration over expensive operations
        fix: Set hard limits and use circuit breakers
  38-dual-detection:
    name: Dual Detection (Literal and Conceptual)
    description: Run both literal pattern matching and conceptual analysis when searching for violations
    tier: verification
    priority: 38
    auto_fixable: false
    anti_patterns:
      - name: regex_only
        smell: Relying solely on pattern matching
        fix: Add LLM‑based semantic analysis
      - name: llm_only
        smell: Relying solely on LLM judgment
        fix: Add deterministic pattern matching first
      - name: single_pass
        smell: Running detection once instead of layered
        fix: Layer multiple detection strategies
  39-accessible-then-technical:
    name: Accessible Then Technical
    description: Documentation should welcome newcomers first, then gradually become technical
    tier: communication
    priority: 39
    auto_fixable: false
    anti_patterns:
      - name: jargon_first
        smell: Opening with technical terminology
        fix: Lead with a plain‑English explanation
      - name: buried_vision
        smell: Purpose hidden after implementation details
        fix: State the vision in the first paragraph
      - name: uniform_depth
        smell: Same technical level throughout
        fix: Gradually increase depth from accessible to technical
  40-no-abbreviations:
    name: No Abbreviations
    description: Write full words
    tier: communication
    priority: 40
    auto_fixable: true
    anti_patterns:
      - name: jargon_soup
        smell: Text dense with abbreviations
        fix: Expand all abbreviations to full words
      - name: inconsistent_abbreviation
        smell: Same term abbreviated differently
        fix: Pick a single form and use it everywhere
      - name: ambiguous_shorthand
        smell: Abbreviation with multiple meanings
        fix: Write the full word to remove ambiguity
  41-graceful-degradation-under-load:
    name: Graceful Degradation Under Load
    description: Reduce quality incrementally rather than crashing when performance degrades
    tier: performance
    priority: 41
    auto_fixable: true
    anti_patterns:
      - name: all_or_nothing_quality
        smell: System runs at full quality until it crashes
        fix: Add EWMA frame timing and dynamic resolution scaling
      - name: hidden_tab_burn
        smell: Full rendering continues when the tab is hidden
        fix: Check `document.hidden` and throttle or pause rendering
      - name: no_emergency_brake
        smell: Runaway performance spiral with no floor
        fix: Set a minimum quality floor and an emergency reset
  42-precompute-math:
    name: Precompute Expensive Math
    description: Trigonometric functions, noise lookups, and complex formulas should be pre‑computed when possible
    tier: performance
    priority: 42
    auto_fixable: true
    anti_patterns:
      - name: hot_path_trig
        smell: `Math.sin` and `Math.cos` called every frame per object
        fix: Precompute trig tables indexed by angle step
      - name: repeated_noise
        smell: Noise function called repeatedly with the same inputs
        fix: Generate a noise texture once and sample from it
      - name: redundant_sqrt
        smell: Distance calculated multiple times for the same points
        fix: Cache the distance or use squared‑distance comparisons
  43-audio-smoothing:
    name: Audio‑Reactive Smoothing
    description: Raw audio data is noisy and causes visual jitter
    tier: aesthetic
    priority: 43
    auto_fixable: false
    anti_patterns:
      - name: raw_audio_jitter
        smell: Visual elements jump erratically with audio
        fix: Apply an exponential smoothing accumulator
      - name: uniform_reactivity
        smell: Everything reacts the same way to audio
        fix: Use separate accumulators with different decay rates
      - name: instant_attack_decay
        smell: Visual snaps to audio with no envelope
        fix: Apply an attack‑decay envelope for beat pulses
  44-typography-discipline:
    name: Typography Discipline
    description: Structure through contrast, whitespace, and restraint—not decoration
    tier: aesthetic
    priority: 44
    auto_fixable: false
    anti_patterns:
      - name: ascii_separators
        pattern: '[-=]{3,}'
        description: ASCII separators add visual noise
      - name: box_drawing
        pattern: '[╭╮╰╯│─]'
        description: Box‑drawing characters clutter the interface
      - name: overused_bold
        pattern: '\*\*.*\*\*.*\*\*.*\*\*'
        description: Overuse of bold defeats hierarchy
    detection:
      type: regex
      patterns:
        - puts.*[-=]{5,}
        - print.*[╭╮╰╯]
    guidelines:
      - Hierarchy via weight and brightness, never ASCII art
      - One color per semantic meaning
      - Whitespace is the primary layout tool
      - Proximity groups related items
      - Success whispers; errors speak loudly
      - Maximum five icons, each with a single meaning
    examples:
      good:
        - "[ok] Committed 3 files"
        - "Status     Active\n\nCommits    1,247\n\nCost       $0.04\n"
      bad:
        - "========== SUCCESS =========="
        - "╭──────────────────────╮"
  45-silence-by-default:
    name: Silence by Default
    description: Successful operations produce minimal output; verbosity is opt‑in
    tier: interface
    priority: 45
    auto_fixable: true
    anti_patterns:
      - name: verbose_success
        pattern: puts.*[Ss]uccess.*\n.*puts
        description: Multi‑line success messages
      - name: overly_chatty
        pattern: puts.*[Cc]omplete.*\n.*puts.*\n.*puts
        description: Verbose routine completions
    detection:
      type: conceptual
      prompt: Does this output say more than necessary for successful operations?
    guidelines:
      - Default to silence on success
      - One line for routine completions
      - Verbose output only via an explicit flag
      - Errors always receive full context
      - Never bury the outcome in noise
    examples:
      good:
        - "[ok] Done"
        - "3 files updated"
      bad:
        - "========================================\n\nOperation completed successfully!\n\nAll files have been processed.\n\nThank you for using our tool.\n\n========================================"
  meta-principles:
    name: Meta‑Principles
    description: Principles about principles
    tier: meta
    priority: 0
    auto_fixable: false
    anti_patterns: []