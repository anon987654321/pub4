# Visual contract for MASTER web surfaces.
# Source: DESIGN.md v1. Any UI change must comply with these directives.
# These are constitutional for the web layer — treat as PROTECTED tier.

colors:
  background: "#000000"
  foreground: "#ffffff"
  muted_foreground: "rgba(255,255,255,0.55)"
  phosphor_cream: "oklch(86% 0.02 80)"
  danger: "oklch(62% 0.18 28)"

spacing:
  base: 0.5rem
  scale: [0.5rem, 1rem, 1.5rem, 2rem, 3rem]

typography:
  body: "system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
  mono: "ui-monospace, SFMono-Regular, Menlo, monospace"
  text_size: "0.95rem"
  line_length_ch:  66
  min_size_px:     16
  scale_ratio:     1.25

borders:
  hairline: "1px solid #ffffff"
  radius: "0"

particles:
  size: "1px"
  shape: "square"
  count: 3000
  color: "#ffffff"
  phosphor_decay: true

phosphor:
  palette: "cream monochrome via CSS tokens (--c-text, --face-fg, --face-bg)"
  persistence: "framebuffer decay in WebGL — not CSS glow or bloom"
  allowed_overlays:
    - "CRT scanlines (monochrome repeating-linear-gradient)"
    - "edge vignette (radial-gradient to black)"
    - "transient chromatic aberration on data-face-flash only"
  forbidden:
    - "ornamental glow, bloom, or blur halos"
    - "accent palette beyond danger/mic indicator"

directives:
  - "Absolute black (#000000) edge-to-edge background."
  - "White or cream monochrome foreground. No decorative accent palette."
  - "Particle visuals are 1px square device pixels in WebGL. Phosphor persistence via framebuffer decay, not CSS blur or bloom."
  - "CRT scanlines and edge vignette are functional overlays, not ornamental chrome."
  - "Preserve whitespace. Typography stays restrained and readable."
  - "No ornamental components: no hamburger menus, no decorative borders, no floating chrome."
  - "Prefer declarative HTML + SSE updates. Minimize custom JavaScript to simulation and runtime needs."
  - "rem-based spacing on an 8px grid."
  - "No framework class explosion and no !important."
  - "Transitions use cubic-bezier easing only — no ease or linear keywords."

canvas_states:
  idle: "Low-amplitude Brownian drift."
  boot: "Brief wireframe face coalescence (~2s) then dissolve."
  command: "Particles regroup into structural diagrams for scans, pipeline stages, council signals."
  mood: "Motion quality reflects homeostat state (focused / curious / tense / weary)."
  audio: "Low frequencies influence cohesion. Transients trigger short scatter impulses."

text_treatment:
  messages: "Plain white text, upper-third left alignment."
  assistant_emphasis: "Temporary 1px left hairline."
  input: "Bottom hairline that expands only while typing."

performance:
  lcp_max_ms:    2500
  inp_max_ms:     200
  cls_max:        0.1
  fcp_max_ms:    1800
  ttfb_max_ms:   800
  bundle_max_kb: 150

accessibility:
  contrast_normal: 4.5
  contrast_large:  3.0
  touch_target_px: 24
  focus_visible:   true
  reduced_motion:  true