# Visual contract for MASTER web surfaces.
# Source: x.com design system (shared with RAILS/brgen). Constitutional for the web layer.
# Tokens: RAILS/shared/design_tokens.yml + RAILS/shared/app/assets/stylesheets/_x_base.scss

reference: x.com
source_of_truth:
  - RAILS/shared/app/assets/stylesheets/_x_base.scss
  - RAILS/shared/design_tokens.yml

colors:
  background: "#000000"
  surface: "#000000"
  surface_elevated: "#16181c"
  search_bg: "#202327"
  text: "#e7e9ea"
  text_secondary: "#71767b"
  border: "#2f3336"
  accent: "#1d9bf0"
  accent_hover: "#1a8cd8"
  danger: "#f4212e"

layout:
  sidebar: "275px"
  feed_max: "600px"
  widgets: "350px"
  layout_max: "1265px"
  shell: three_column

typography:
  body: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'
  mono: '"JetBrainsMono Nerd Font", "JetBrains Mono", ui-monospace, monospace'
  font_size: "16px"
  line_height: "20px"
  large_screen_font_size: "21px"
  large_screen_line_height: "28px"
  line_length_ch: 66
  min_size_px: 16

spacing:
  base: 8px
  rhythm: 8px

borders:
  hairline: "1px solid var(--x-border)"
  radius_card: "16px"
  radius_pill: "9999px"

flat_rule:
  forbidden:
    - box-shadow
    - text-shadow
    - backdrop-filter
    - "filter: blur()"
    - "filter: drop-shadow()"
  elevation: "1px hairline border or solid background only"

directives:
  - "x.com three-column shell: 275px sidebar / 600px feed / 350px widgets / 1265px max."
  - "Shared --x-* tokens from design_tokens.yml social palette; accent #1d9bf0."
  - "System UI font stack; 16/20 base, 21/28 at min-width 1280px."
  - "Flat chrome only — no shadows, blur, or glassmorphism."
  - "WebGL face canvas lives inside the center feed column, not full-viewport overlay."
  - "Sticky feed header 53px; pill compose; mobile bottom tab bar below 768px."
  - "rem-based spacing on an 8px grid."
  - "Transitions use cubic-bezier easing only."

canvas_states:
  idle: "Low-amplitude particle drift inside feed stage."
  boot: "Brief wireframe coalescence then dissolve."
  command: "Particles regroup for scans and pipeline diagrams."
  mood: "Motion reflects homeostat state."
  audio: "Low frequencies influence cohesion."

text_treatment:
  messages: "Plain --x-text in chat log above compose bar."
  assistant_emphasis: "Bold name + secondary meta line (x-post header pattern)."
  input: "Bottom compose bar in feed column (x.com post composer shape)."

performance:
  lcp_max_ms: 2500
  inp_max_ms: 200
  cls_max: 0.1
  fcp_max_ms: 1800
  ttfb_max_ms: 800
  bundle_max_kb: 150

accessibility:
  contrast_normal: 4.5
  contrast_large: 3.0
  touch_target_px: 44
  focus_visible: true
  reduced_motion: true