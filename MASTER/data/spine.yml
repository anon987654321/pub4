# The spine ratchet. `rake lint:spine` fails when lib/ grows past the ceiling.
#
# core/SEVERANCE.md (written as ABSORPTION.md) asserted "the spine never grows"
# and nothing measured it,
# so lib/ gained 8,022 lines in the three weeks after core/ landed while core/
# gained none. An invariant nothing measures is decoration -- the same critique
# DEBT.md makes of data/limits.yml, where 44 of 94 second-level keys have no
# reader. This file is the reader.
#
# What this file claims, settled 2026-08-11 (DECISIONS.md, "The invariant"):
# `core_files: 6` is the invariant — a new top-level concept in core/ is a design
# change. `lib_code_ceiling` is a BUDGET WITH A SPONSOR, not a promise that lib/
# never grows: it has been raised three times and the unit changed once, so the
# old sentence had already been disproved by its own log. The mechanism is
# unchanged; the claim is now the one that is true.
#
# The ceiling only ever goes down. When lib/ shrinks, run `rake lint:spine
# RATCHET=1` to record the new low; there is no task that raises it. Raising it
# is a deliberate edit to this file, in a commit that says why.
spine:
  # Total lines across lib/**/*.rb.
  #
  # RAISED 2026-08-01, 47583 -> 47660 (+77), one day after the previous raise —
  # which is precisely the pattern the note below warns about, so it is worth
  # being exact about what it is. All 77 lines are one commit, 3481e2638, and one
  # file: voice/tts_supervisor.rb, fixing a worker pool that leaked a process a
  # minute. It is a bug fix in a supervisor, not a new subsystem, and core/ has
  # no verb or constraint it belongs to.
  #
  # Two raises in two days is still the wrong direction. The next one should not
  # be granted on the strength of "it was only a bug fix" — by then the honest
  # move is to make lib/ fall back first.
  #
  # RAISED 2026-07-31, 47316 -> 47583 (+267), the first raise since the ratchet
  # landed one day earlier. Every one of those lines is scan/fix/review tooling
  # from eleven commits that day -- cross_file_analysis +98 (rules that measure
  # code instead of their own regexes), ast_fixer +62 (it was rewriting the
  # fixtures that prove it works), surface_rules +45, snapshot_publisher +31,
  # deliberation +25, llm_dispatcher +23. None of it is absorbable by this
  # file's own standard: core/ takes a handler per verb and a rule per
  # constraint, and a council timeout budget or an autofixer fixture bug is
  # neither. Absorbing them would grow the spine with exactly the accretion the
  # ratchet exists to catch.
  #
  # Read the raise as the tripwire working, not as permission. A ceiling that
  # rises whenever a day's work pushes against it measures nothing, which is the
  # critique this file makes of data/limits.yml four lines up. If it is raised
  # again without lib/ ever falling back, the honest conclusion is that "the
  # spine never grows" is not the invariant anyone is holding, and the number
  # should be replaced by one that is.
  # RATCHETED 2026-08-03, 47660 -> 47530. lib/ had reached 48,162 (+502) with the
  # raise allowance spent, so the breach was closed by deleting 656 lines of code
  # nothing referenced -- six files, verified against every constant across lib/
  # core/ bin/ test/ spec/ web/ tools/ data/ before removal (DEBT.md, "Spine
  # Ceiling"). A 632-line net fall for the session.
  #
  # Recorded once, at the end. An intermediate ratchet to 47,506 was taken while
  # the tree still carried an open [DENSITY] finding, and it immediately blocked
  # the +10 that closing that finding required -- the ratchet had locked in a
  # state that was not actually clean. Ratchet after the work settles, not during.
  #
  # RATCHETED 2026-08-03 (second pass), 47530 -> 47458. The ceiling above was
  # breached by +38 within hours of being recorded, by a single commit (44d8fc5d5)
  # that rewrote CONFIG_HIERARCHY's duplicate-key check onto Psych -- a real fix,
  # 8,166 false findings removed tree-wide, not something to revert. Closed by
  # deleting ground/cluster_registry.rb: 109 lines, zero callers anywhere in the
  # repo, and the only defense of it was START_HERE.md prose describing a reader
  # that never ran.
  #
  # Two ratchets in one day is the ratchet working, but note what it did NOT
  # settle: lint:spine counts comment lines and [DENSITY] deliberately does not,
  # so a rationale paragraph above a tricky line satisfies one rule and breaches
  # the other. Three passes have now been paid for out of dead code instead of
  # deciding which rule means it.
  # RE-EXPRESSED 2026-08-10. The unit changed: this is now **code lines**
  # (non-blank, non-comment) across lib/**/*.rb, not raw lines. Operator decision,
  # settling the conflict the note directly above records and did not resolve —
  # lint:spine charged for comment lines while [DENSITY] deliberately does not, so
  # a rationale paragraph above a tricky line satisfied one rule and breached the
  # other, and three ratchet passes had been paid for out of dead code instead of
  # deciding which rule meant it. They now agree.
  #
  # The key is renamed with the unit. A stale 47458 under `lib_code_ceiling` would
  # have passed silently with ~20% slack; under a renamed key the Rakefile fails
  # to load instead. Same reason the count is code lines: a number nobody can
  # misread by accident.
  #
  # Recorded at 38219, which is the measurement, not a target. No raise allowance
  # spent — this is a re-expression of the same tree, not permission to grow.
  #
  # For the record, because the switch happened while the old ceiling was
  # breached: lib/ was 47753 raw lines here, +295 over the old 47458. That breach
  # was real and traced to four commits — +119 (22e012e52, a TTS lock that
  # outlived its owner), +141 (ae7f3f5a6, restoring lib/pub4/status_report.rb,
  # which an orphan sweep had deleted while bin/pub4 still required it), +29
  # (f82bcf63c), +6 (2839ab805). None of it is accretion the ratchet exists to
  # catch; one of them is a deletion being undone. Switching units does not
  # forgive it, and the number below is the honest post-fact measurement.
  # RAISED 2026-08-11, 38219 -> 38294 (+75), operator-sponsored. The first raise
  # under the code-line unit, and the first one this file's own refusal made
  # somebody ask for rather than take.
  #
  # All 75 lines are five commits, and every one is a fix: 50471a924 (one voice
  # pinned in all four places that name one), ca92b7d2b (137 principles the tree
  # had forgotten), be274db22 (two thirds of the law only fired on files that had
  # already failed something), 51424ab63 (a second copy of the level that undid
  # every previous attempt), ffa0730ff (two YAML files nothing read).
  #
  # What makes this a raise rather than a deletion: the three previous breaches
  # were each paid for out of orphaned code, and that account is now empty. A
  # sweep of all 445 lib/ files -- no extension filter, repo root as the scan
  # root, both blindnesses of the 2026-08-03 sweep corrected -- returned one
  # candidate, ground/pledge.rb, and it was a false positive: the sweep read its
  # inner LibC module as the file's constant while Pledge itself is live. Neither
  # is any of the five absorbable by core/'s own standard, which takes a handler
  # per verb and a rule per constraint; a scan rule's regex is neither.
  #
  # Second raise now needs the same conversation. This one leaves the allowance
  # at 1 of 2.
  lib_code_ceiling: 38294
  # Raw-line history, kept so the drift stays legible across the unit change.
  # These are NOT comparable to lib_code_ceiling.
  lib_raw_at_switch: 47753
  lib_raw_ceiling_before_switch: 47458
  # What the ceiling was when the ratchet was introduced, so drift is legible.
  lib_at_introduction: 47331
  introduced: "2026-07-30"
  raised:
    - "2026-08-11: 38219 -> 38294 (+75), operator-sponsored. Five fix commits, no
      orphan left to pay for it (445 files swept), nothing absorbable by core/."
  # How many raises may stand before lint:spine refuses another. The allowance was
  # spent on 2026-08-01 and the 2026-08-03 ratchet cleared the log, which is the
  # mechanism working: a genuine fall earns the budget back, so this is a budget
  # rather than a countdown. It also settled the +502 breach by deletion instead
  # of by a third raise, which is the outcome the refusal exists to force.
  #
  # This exists because the warning above was ignorable, and was ignored twice by
  # the same argument both times — that the growth was justified. It usually is.
  # That is exactly why the number needed teeth rather than prose.
  consecutive_raises_allowed: 2
  # core/ is allowed to grow only by a handler per verb and a rule per
  # constraint; this is a tripwire on new top-level concepts, not on line count.
  core_files: 6
