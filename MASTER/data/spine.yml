  # two real splits the file-length ratchet asked for, and each is one subject.
  # 2371 -> 2372 for gates/support/bounded_command.rb. Six gate subprocesses
  # called capture2e with no timeout, so a gate could hang on a browser or a
  # remote host and the run would report nothing at all rather than a failure.
