# The spine ratchet. `rake lint:spine` fails when lib/ grows past the ceiling.
#
# docs/SEVERANCE.md (written as core/ABSORPTION.md) asserted "the spine never grows"
# and nothing measured it,
# so lib/ gained 8,022 lines in the three weeks after core/ landed while core/
# gained none. An invariant nothing measures is decoration -- the same critique
# DEBT.md makes of data/limits.yml, where 44 of 94 second-level keys have no
# reader. This file is the reader.
#
# What this file claims, settled 2026-08-11 (DECISIONS.md, "The invariant"):
# `core_files: 6` is the invariant — a new top-level concept in core/ is a design
# change. `lib_body_ceiling` is a BUDGET WITH A SPONSOR, not a promise that lib/
# never grows: it has been raised three times and the unit changed once, so the
# old sentence had already been disproved by its own log. The mechanism is
# unchanged; the claim is now the one that is true.
#
# The ceiling only ever goes down. When lib/ shrinks, run `rake lint:spine
# RATCHET=1` to record the new low; there is no task that raises it. Raising it
# is a deliberate edit to this file, in a commit that says why.
# UNIT CHANGED 2026-08-25, lib_code_ceiling -> lib_body_ceiling, 38962 -> 36970.
#
# Body lines are code lines minus the ones Zeitwerk forces: a `module` whose
# body is exactly one module or class, and its matching `end`. Those carry no
# implementation — the loader maps a path to a constant and the file would not
# resolve without them — and counting them set this ratchet against
# lint:cohesion, which wants files shelved into namespaces that cost exactly
# two lines per file.
#
# That was not theoretical. Three rounds of regrouping in two days were paid
# for in turn by luck (each family happened to expose dead code), by the last
# orphan class in lib/, and finally by a budget raise because nothing was left.
# A ratchet that charges for structure will get structure it did not want.
#
# 2014 lines, about 5%, are wrappers. The number below is the remainder,
# measured once at the rename. A module holding a constant, a method or two
# children is doing work and still counts; so does a `class` wrapping a class,
# which nothing forced.
# RAISED 2026-08-25, 37042 -> 37057 (+15), and 8 of those are not mine.
# 37057 -> 37082 net. Two sponsors, both about a rule reaching something, minus
# the accessor and the second prompt block that the aesthetic_rules collapse
# made unnecessary. Two sponsors, both about a rule reaching
# something. CommentDriftRule now grades a missing CLI as cosmetic instead of
# writing 4,663 identical load-bearing entries. PersonalityPromptBuilder now
# emits soul absolute.aesthetic_rules as well as absolute.rules, which took the
# aesthetic half from 0 of 19 in the system prompt to 19 of 19, and Ground::Rules
# gained the accessor for it.
#
# +7 is ReplicateClient#input_keys, which reads the input parameter names a
# model currently declares from the same GET latest_version already makes. It
# is what `rake repligen:schema_audit` compares MODEL_CAPABILITIES against.
# repligen keeps that table so it can refuse an unsupported option rather than
# let the API ignore one — the right call, and a second source of truth, so it
# goes stale silently: the tests check the table against itself and drift
# surfaces as a 422 in production or a setting quietly dropped.
#
# +8 arrived in 9b7d92a69 ("bin/pub4 status invented a tree called ASTER")
# between this ceiling being set and this commit. Recorded here rather than
# left to fail the next session's unrelated patch, which is the convention the
# +15 raise below already set.
# RAISED 2026-08-25, 36970 -> 37042 (+72). lib/pub4/readers.rb, which answers
# "who reaches this file" across all four trees before somebody deletes it.
#
# The sponsor is a defect that has now cost this repo four times, most recently
# hash_dig_compat.rb: merged into a test helper as "its only reader is this
# helper", when STUDIO's music_gems.rb required it by File.expand_path from
# another tree, with the extension left off, inside a `rescue LoadError` — so it
# warned instead of raising and dilla rendered without coltrane for days. The
# other three are _search_loading (a partial spelled without its underscore or
# its extensions), RepoMap (a constant, no path anywhere) and Log::Evidence
# (referenced only by a test).
#
# Each of those was a grep that could not see one spelling. 72 lines that make
# the count right is what a budget with a sponsor is for, and the alternative is
# the fifth one.
# RAISED 2026-08-25, 36970 -> 36976 (+6), the first raise under the body-line
# unit. Io::Shell#sandbox_error, which wires Ground::Policy::Sandbox into the
# shell preflight. That module was written from an adversarial corpus and was
# reached by nothing but its own tests while Shell consulted a separate
# BLOCKLIST — two gates, and the hardened one was not the live one. Six lines
# that make a security gate run is what a budget with a sponsor is for, and the
# new unit means these six are code rather than ceremony.
# RAISED 2026-08-25, 36892 -> 36930 (+38). Two effects in Core::World could
# destroy work that was not the fold's, and both are now scoped.
#
# `git commit -m msg` committed THE INDEX. This checkout is shared — other
# sessions and a human stage into it — so the fold signed its message onto
# whatever they had staged. CLAUDE.md forbids exactly that of agents, and the
# fold was the one agent doing it. Commit is path-scoped now and refuses to run
# unscoped, with a matching constitutional rule so the refusal is stated law.
#
# `rollback` undid ONE failed effect with `git reset --hard HEAD`, discarding
# every uncommitted change in the tree. Anything a concurrent session had
# touched since the checkpoint was outside the patch and simply gone. Rollback
# now restores only the path the failed write names, and reports rather than
# resets when it cannot scope — PRESERVE_FIRST over a convenient guess.
#
# The lines are the two scoped paths plus their git helpers, after tightening
# five out. They buy a property no scanner could: the fold cannot take or
# destroy another session's work. Pinned by four tests, each mutation-checked
# against the old behaviour.
# RAISED 2026-08-25, 36930 -> 36944 (+14). Two more from the same review, both
# about what the fold can learn and what it can claim.
#
# do_exec passed `env: nil`, which reads as "nothing the model supplied rides
# through" and is true — but it also inherits the whole process environment, and
# exec output becomes an Observation that Memory records and the next turn hands
# back to the model. `exec(["env"])` was therefore a supported way to read every
# API key into the transcript. no_secret_rule watches write and note, so the one
# direction it never covered was the one flowing INTO the model. Credential-shaped
# names are now unset in the child; everything else is inherited exactly as before,
# because the toolchain the fold proves its work with is the broad moving set and
# an allowlist would break `bundle exec rake test` the first time it forgot one.
#
# Proof#evidence_score summed every recorded score. So three `test_pass` tags were
# 105 points from one kind of proof, and evidence earned before a write still
# counted after it — a fold could test, rewrite the file it tested, and reach
# `done` on the earlier run. Score is now per-kind and per-generation, where a
# write advances the generation. Re-earning after a change works, so staleness is
# not a dead end.
#
# Still NOT fixed, and deliberately: the evidence kind is whatever the model
# labelled the exec with, so exec(["true"], evidence: "test_pass") still scores.
# Binding kinds to the commands that can produce them is a policy table and a
# separate decision.
# RAISED 2026-08-25, 36944 -> 36955 (+11). The hardened shell policy now gates the
# constitutional exec path. Io::Shell has consulted Ground::Policy::Sandbox — an
# adversarial corpus covering dangerous rm in any flag order, fork bombs,
# curl-piped-to-shell, device truncation — since that gate was wired in, but the
# Fold does not exec through Io::Shell. It execs through World, so the hardened
# gate was live on the tool path and absent from the one that runs unattended.
# Injected, not required, because core reaches nothing in lib/: the same seam
# `verify:` already uses, and a denial-only mapping because the policy answers
# :ask for anything it does not recognise and treating that as a refusal would
# stop the fold running its own tests.
#
# THIRD RAISE IN ONE SESSION, and the note twenty lines up says exactly what that
# means: a ceiling that rises whenever a day's work pushes against it measures
# nothing. Recording it rather than spreading the three across commits to make
# each look small. All three are security fixes to the fold's own boundary and
# each is pinned by mutation-checked tests, which is what a sponsor is — but the
# allowance is now spent, and the honest next move is lib/ falling back rather
# than a fourth raise.
#
# RAISED 2026-08-25, 36955 -> 36970 (+15), and not by the session raising it.
# lib/boot/hash_dig_compat.rb, restored in d1f6a31af. Coltrane 2.1.5 redefines
# Hash#dig directly on Hash, so it wins for the whole process the moment coltrane
# is required and raises NoMethodError where MRI returns nil; the prepend restores
# MRI's behaviour. The file had been merged into test_helper.rb under the note
# "its only reader is this helper" when it had two — STUDIO's music_gems.rb
# required it by absolute path, that require landed inside a `rescue LoadError`,
# and dilla rendered without coltrane's chord parsing for as long as it took to
# notice.
#
# Recorded here because the commit that added it did not, and a ratchet nobody
# reconciles is the decoration this file opens by criticising. Fifteen lines that
# restore a load-bearing file is a sponsor; the point of writing it down is that
# the breach had an owner and a reason rather than being absorbed silently.
#
# CORRECTION, same day: this paragraph named the Transcendent half of lib/voice
# as the candidate, "reached by nothing". That was repeated from a stale note and
# is false. lib/voice/transcendent.rb is called from lib/voice/speech.rb in five
# places, from bin/tts-speak, and has its own test. It is live. The candidate
# evaporated on the first grep, which is the whole reason DEBT.md says to trace
# the caller before proposing a deletion — and the reason this correction is
# here rather than quietly removed: the claim was committed, so the retraction
# belongs beside it.
