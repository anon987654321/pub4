# The spine ratchet. `rake lint:spine` fails when lib/ grows past the ceiling,
# and equally when lib/ falls below it and the ceiling was not lowered to match:
# slack the next change grows into is the same defect as debt. This file is the
# reader that keeps the invariant from being decoration.
#
# Two claims, settled in DECISIONS.md ("The invariant"):
#   - core_files is the real invariant. A new top-level concept in core/ is a
#     design change, argued for here — not a line-count question.
#   - lib_body_ceiling is a budget with a sponsor. It may be raised, but only in
#     a commit that names what the lines buy, and consecutive_raises_allowed
#     caps how many raises may stand before a genuine fall earns the budget
#     back. Raising it to absorb another change's unaccounted growth is how a
#     ceiling stops measuring anything — a good reason is always available,
#     which is why the number needs teeth rather than prose.
#
# The ceiling only falls on its own: `rake lint:spine RATCHET=1` records a new
# low when lib/ shrinks. Raising it is a deliberate edit here. Every raise and
# ratchet is a commit — the history reads there, not in this file.
#
# Body lines are code lines minus Zeitwerk ceremony: a `module` whose body is
# exactly one module or class, and its matching `end`, which map a path to a
# constant and carry no implementation. Counting them would set this ratchet
# against lint:cohesion, which asks for those wrappers. The counter is
# Master::Review::Scan::CodeMetrics.body_lines, shared with lint:spine and
# SmallFunctionsRule so the repo counts code exactly one way.

spine:
  # Non-blank, non-comment lines across lib/**/*.rb, minus the Zeitwerk wrappers.
  # Present sponsors, all the same shape — a rule that could only be judged by a
  # model now judged deterministically: cross_file_analysis's structural-clone
  # detector for DRY, MiddleManRule for the over-engineering half of
  # engineering_fit, and StrunkPass's brevity mode wired onto conversational
  # output so a terse reply sheds its padding, not its structure.
  lib_body_ceiling: 37464
  # Raw-line anchors from before the 2026-08-10 code-line unit change, kept only
  # so the old numbers stay legible. Not comparable to lib_body_ceiling.
  lib_raw_at_switch: 47753
  lib_raw_ceiling_before_switch: 47458
  lib_at_introduction: 47331
  introduced: "2026-07-30"
  # Raises standing since the last fall. lint:spine refuses another once this
  # reaches consecutive_raises_allowed; a genuine fall clears it.
  raised:
  - >-
    lib/ground/quota_gate.rb and the paths that read it. A paid provider limit
    was discovered once per persona and once per file, and the tier it deleted
    left no mark on the verdict, so a run that could not review reported the
    same as one that did. The lines buy three things nothing else held. The
    limit is now its own failure class rather than a rate limit, one trip
    serves the whole process instead of N refusals bought at N call sites, and
    the skipped tier travels with the result so a summary cannot fold "could
    not run" into "passed". They also buy the resume — the gate re-probes on
    the taxonomy's own backoff, so the tier comes back without a code change or
    an operator remembering a reset.
  consecutive_raises_allowed: 2
  # A tripwire on new top-level concepts in the fold, not on line count. Counted
  # as lib/{core.rb,core/*.rb} — the entrypoint plus the directory — so the glob
  # cannot hand out a free concept by reading one fewer than the ceiling.
  core_files: 7

# The coarse sprawl net over all four trees: one source-file ceiling each, so a
# new file anywhere fails `bin/pub4 measure` until it folds into an existing one
# or the ceiling is raised here with the reason in the commit. dilla's engine has
# a finer per-part guard in STUDIO/gate.rb. On-disk source files (code, style,
# markup, config, docs), vendored/generated excluded.
pub4_source_ceilings:
  # Lowered when the per-tree backlog files were consolidated into the repo-root
  # TODO.md (which sits in no tree and so counts toward none): MASTER -1 (DEBT.md),
  # RAILS -2 (TODO.md, BLOCKERS.md), OPENBSD -1 (data/debt.yml).
  # 1037 -> 1038 accounts for lib/autonomy/dream_loop.rb, which ca0d8d104 added
  #
  # 1038 -> 1040 is tools/sprawl_census.rb and data/sprawl_census.yml, named
  # the same way. Two files to measure whether the tree is growing files is a
  # trade this line is the right place to record: FILE_SPRAWL sees only
  # MASTER's .rb and skips law/, core/, test/ and spec/, so nothing counted
  # shape in RAILS, OPENBSD or STUDIO at all.
  # without raising this. Named rather than absorbed: the note at the top of
  # this file says a raise that swallows another change's unaccounted growth is
  # how the ratchet dies, and naming the file is what makes this accounting
  # rather than swallowing.
  #
  # STUDIO is over by one too and is NOT raised here. Its overage is
  # free_midi_chords.yml (committed) plus lib/engine/album_signature.rb
  # (untracked) less lora/curate.rb (deleted, uncommitted) -- two thirds of it
  # is work nobody has landed, and a ceiling raised to fit uncommitted files
  # is the swallowing the note warns about.
  #
  # 1040 -> 1038 is a fall, not a raise. After face_points_gl.js, MASTER
  # measured 1036 against a ceiling of 1040. quota_gate.rb and
  # test/test_quota_gate.rb take it to 1038. Named, both of them: the gate is
  # the one place that answers "is the paid tier reachable right now", and it
  # folds into neither failure_taxonomy.rb (which classifies and holds no
  # state) nor model_skip_cache.rb (which parks one endpoint and cannot speak
  # for a tier). Locking the number here is what stops the remaining two files
  # of slack from being spent without an argument.
  #
  # 1038 -> 1040 is lib/pub4/gate_chain.rb and test/test_gate_chain.rb: the one
  # ladder `bin/pub4 gate` runs, and the test that pins its order, which of its
  # stages may write, and its third state. Two files against five invocations
  # nobody ran together. bin/test-safety went the other way in the same commit
  # and costs nothing here, having no extension to count.
  # 1040 -> 1044 is four test files, one per thing that had no test at all:
  # test_provider_key_wiring.rb (providers.yml naming a RubyLLM setter the
  # installed gem has no method for — the runtime did not boot for a day),
  # test_agy_reachability.rb (agy ids leading a fallback chain on machines with
  # no agy binary, and the four keyless assertions that passed or failed by
  # host), test_circuit_breaker_states.rb (the closed, open, half_open and
  # recovered states, which the unified handoff's 3.2 asked for) and
  # test_smell_detectors.rb (the four new detectors, each with the source it
  # must flag and the source it must not). None folds into a sibling: the four
  # subjects share no fixture and no setup.
  #
  # A raise to 1044 and not to 1052, deliberately. MASTER measures 1052, and the
  # eight above 1044 are growth this change did not make and cannot account for.
  # Raising to fit them is the swallowing the note above warns about, so the row
  # stays red with the overage that is actually unexplained.
  # 1044 -> 1045 is test/test_scan_deterministic_mode.rb, which holds
  # MASTER_SCAN_DETERMINISTIC: that the model-backed rules lose their agent
  # under it, that the council stops running inside /scan, that neither happens
  # by default, and that bin/gate still asks for it. Four claims about a switch
  # whose absence meant the gate's first stage had never once reported; a switch
  # nothing requests is the same as no switch, so the last of those is the
  # load-bearing one. It folds into no existing test: nothing else here tests a
  # scan the runtime is not allowed to spend money on.
  # 1045 -> 1046 is test/test_markdown_style_reaches_the_prompt.rb, which holds
  # that data/rules.yml's markdown_style section reaches the built system
  # prompt AND that it is read rather than restated. The second half is the one
  # worth a file: a restatement in the builder would satisfy every "the words
  # appear" assertion and defeat the reason the section exists. Verified by
  # mutation — hardcoding the four rules in the builder turns three of its eight
  # red. It folds into no existing test; nothing else here reads a rules.yml
  # section into a prompt and checks the file is the source.
  # 1046 -> 1047 is test/test_self_findings_drift.rb. Third census in this tree
  # to record a bare integer, after data_reach and rule_audit, and the one where
  # the detail already existed and was thrown away: by_rule has always returned
  # a rule => count hash. The test holds that a total-only baseline says
  # attribution is unavailable rather than "no rule moved", which are different
  # claims and the confusion the old format could not avoid.
  # 1047 -> 1049 restores lib/review/scan/constitution_triage.rb and its test.
  # e3489813c deleted both as unused while the Rakefile was calling the class,
  # which left `rake constitution` -- and so `rake audit` and `bin/check
  # --profile=full` -- dead at LoadError. This ceiling was recorded after that
  # deletion, so the two files are room this change has to account for rather
  # than room it is taking back.
  #
  # To 1049 and not to 1064, on the grounds the 1044 note above already states:
  # the rest is growth this change did not make and cannot explain, and raising
  # to swallow it is what this file's header forbids. The row stays red on the
  # overage that is actually unexplained.
  MASTER: 1049
  # 2359 -> 2360 for RAILS/gates/probes/face_capture_probe.rb, which gets the
  # MASTER face past its primer gate so it can be recorded. A probe, not a gate:
  # it belongs beside the other probes and folds into nothing.
  #
  # 2360 -> 2356 locks four collapses into RAILS/shared: fingerprints_controller.rb
  # and passwords_mailer.rb (amber + brgen), lib/tasks/visits.rake (amber + brgen)
  # and jox_logo_controller.js (amber + bsdports) each became one engine file where
  # there were two. Eight app files out, four engine files in.
  #
  # 2356 -> 2358 is destroy_cascade_examples.rb and user_auth_examples.rb, the
  # engine-owned copies of the two tests that had been living once per app.
  # Two files against three copies of the same assertion; brgen keeps the
  # behavioural destroy cases on top of the include.
  RAILS: 2358
  # 106 -> 107 is test/test_githooks.rb. dev/githooks holds the three guards
  # that are the whole defence against a shared index, and nothing tested any of
  # them — a hook that stopped firing looks exactly like a week in which nobody
  # made the mistake. It runs all three through real git in a throwaway
  # repository, because a hook is installed behaviour: a unit test of its logic
  # would not catch a lost chmod or a core.hooksPath pointing elsewhere. It
  # folds into no existing OPENBSD test; every one of those is about the box.
  OPENBSD: 107
  # 220 -> 222 for lora/seed_media.yml and lora/_toolkit/install_seed_media.rb,
  # the prompt set for every seeded photograph and the script that grades and
  # files what comes back from it. Two files, both named, neither foldable:
  # the prompts are data and the installer is the only thing that writes a
  # catalogue row.
  #
  # This deliberately leaves STUDIO one over. That one is not mine --
  # lib/engine/album_signature.rb is untracked, so raising for it would fit
  # the ceiling to a file nobody has landed.
  # 222 -> 224 for lora/_toolkit/run_seed_media_colab.rb and the seed_media.ipynb
  # it generates. The notebook is committed because Colab opens a notebook from a
  # public repo URL and cannot be handed one any other way, and the generator is
  # committed because the notebook says edits belong in it.
  # 224 -> 138 is a fall, not a raise, and it is the largest one this file has
  # recorded. dilla's engine folded from lib/engine/ into dilla.rb — 81 parts to
  # one file, 129 ruby files to 48 — and the ceiling was never lowered to match,
  # so STUDIO has been carrying 86 files of room the next change could grow into
  # without argument. That is the defect the note at the top of this file names,
  # measured rather than argued: `test_no_ratchet_is_slack` had never reported
  # it, because it skips on a dirty tree and this checkout is always dirty.
  #
  # Recorded from a clean worktree at 1bcb58524, which is the condition that
  # assertion asks for. The next STUDIO file now fails `measure` on the day it
  # is written and wants a named raise here — which is the point, and is what
  # 224 had stopped doing.
  STUDIO: 138

# Executable files directly under each tree's own bin/ — the number CLAUDE.md's
# "two surfaces, no third" makes a claim about while nothing counted it. MASTER
# reached 28 without a single failure, because prose in a doc is not an
# instrument. Twelve of those overlap on "check things": check, gate, ci, audit,
# dogfood, preflight, probe, smoke, smoke-web, doctor, nsaudit, and test-safety
# until it folded into `bin/check --profile=ci`'s superset.
#
# Directly under bin/, so an app's generated bin/rails and a tool's own bin/
# scripts are not counted as surfaces of the tree. STUDIO has no bin/ of its own
# and records 0, which is the true number rather than a blind one — every STUDIO
# tool is invoked as `ruby STUDIO/<tool>/<tool>.rb`.
#
# A ceiling at the honest count rather than at the two the prose asks for: a
# target nobody can reach is a ratchet everyone learns to override. It falls as
# they collapse, and a new script fails `bin/pub4 measure` until somebody argues
# for it here.
#
# 28 -> 27 folds bin/test-safety away. It ran 21 hand-picked spec files from no
# caller anywhere in the repo, 20 of them already inside `rake spec`'s FileList
# and the 21st naming spec/providers/catalog_index_spec.rb, which moved to
# spec/io/ in the lib rename — so every invocation aborted, and nothing noticed
# because nothing invoked it. Its one reader was a bin/doctor check asserting
# the file exists, which went with it.
pub4_entrypoint_ceilings:
  MASTER: 27
  RAILS: 2
  OPENBSD: 17
  STUDIO: 0
