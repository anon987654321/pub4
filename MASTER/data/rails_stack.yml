# The Rails stack every app in RAILS/ pins. Three readers: the production gate, the
# stack contract test, and the voice's one-line "Stack:" in the prompt (read through
# Laws#data(:rails_stack), which resolves this file by name).
#
# The values are the ones the Gemfiles and Gemfile.locks carry; the contract test fails
# when an app's Gemfile or lock drifts from rails, rails_source and rails_ref.
rails: "8.2.0.alpha"
rails_source: "rails/rails"
rails_ref: "c9e85dbe297e248dd2f217d04f84a94881ac046a"
turbo_rails: "2.0.23"
stimulus: "3.x"
asset_pipeline: propshaft
javascript: importmap
queue: solid_queue
cache: solid_cache
cable: solid_cable
database: sqlite3
