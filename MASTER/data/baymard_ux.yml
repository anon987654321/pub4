# Baymard-informed UX review profile.
# This is an original audit profile, not Baymard content, a licensed reproduction,
# an official Baymard score, or a claim of affiliation. Public research is cited
# as provenance; criteria below are independently worded and mapped to MASTER Laws.

schema: 1
research:
  provider: Baymard Institute
  authority_law: EXTERNAL_RESEARCH_IS_EVIDENCE_NOT_AUTHORITY
  methodology_url: https://baymard.com/research/methodology
  benchmark_url: https://baymard.com/ux-benchmark
  checkout_research_url: https://baymard.com/research-articles/ecommerce-checkout-usability-report-and-benchmark
  cart_abandonment_url: https://baymard.com/lists/cart-abandonment-rate
  inline_validation_url: https://baymard.com/research-articles/inline-form-validation
  reviewed_on: "2026-11-01"
  scope: "Ecommerce research informs applicable commerce journeys; site-wide usability checks also apply where relevant."
  boundary: "Do not copy proprietary guideline text, screenshots, benchmark scores, or imply Baymard certification. This profile is not an official Baymard audit."

checks:
  form_control_names:
    area: forms
    mode: source
    applies_when: all
    severity: error
    law_ids: [REACH_form_label, REACH_aria_labels]
    statement: "Exposed form controls must have an inspectable accessible name."
    verification: "Inspect rendered labels and accessible names, including controls generated by framework helpers."

  image_alternatives:
    area: product_information
    mode: source
    applies_when: all
    severity: error
    law_ids: [REACH_img_alt]
    statement: "Informative images must expose meaningful alternative text; decorative images must be identified as decorative."
    verification: "Inspect the computed accessibility tree and confirm that alternative text communicates the image's purpose."

  interactive_names:
    area: accessibility
    mode: source
    applies_when: all
    severity: error
    law_ids: [REACH_aria_labels]
    statement: "Buttons and links must expose a meaningful accessible name."
    verification: "Inspect the rendered accessibility tree; icon-only controls need an explicit accessible name."

  native_click_targets:
    area: accessibility
    mode: source
    applies_when: all
    severity: warning
    law_ids: [REACH_aria_labels, POLA_intuitive_navigation]
    statement: "Interactive actions should use native interactive elements or provide equivalent semantics and keyboard behaviour."
    verification: "Test keyboard activation, focus order, role, name and state in the browser."

  focus_visibility:
    area: accessibility
    mode: source
    applies_when: all
    severity: error
    law_ids: [REACH_focus_visible]
    statement: "Removing the browser focus outline requires a visible replacement for keyboard focus."
    verification: "Tab through every interactive control at each relevant theme and viewport."

  mobile_viewport:
    area: mobile
    mode: source
    applies_when: all
    severity: warning
    law_ids: [REACH_touch_target_min, POLA_intuitive_navigation]
    statement: "Full-page layouts declare a device-width viewport so the browser can size the page to the device."
    verification: "Inspect each rendered full-page layout and confirm its viewport declaration includes width=device-width. Reflow, clipping, touch geometry and occlusion are measured by the existing rendered layout checks."

  first_screen_purpose:
    area: homepage
    mode: task
    applies_when: all
    severity: warning
    law_ids: [TRUTHFUL_STATUS, POLA_intuitive_navigation]
    statement: "A first-time visitor should be able to infer the product's purpose and the primary next action without explanation."
    task: "Show the initial screen to a participant unfamiliar with the product. Ask what the service is, who it is for, and what they would do next. Record the words and the chosen action."
    verification: "Record the visitor's unaided description of the service and the next action they choose."

  navigation_findability:
    area: navigation
    mode: task
    applies_when: all
    severity: warning
    law_ids: [POLA_intuitive_navigation, PROXIMITY_path_purpose]
    statement: "A visitor should be able to locate a representative task using the site's own navigation and labels."
    task: "Give a realistic destination task without naming the menu path. Record whether the participant finds it, the path taken, hesitation and any wrong turns."
    verification: "Record task completion, navigation path, hesitation, wrong turns and requests for help."

  search_recovery:
    area: search
    mode: task
    applies_when: search
    severity: warning
    law_ids: [POLA_intuitive_navigation, TRUTHFUL_STATUS]
    statement: "Search should help a visitor recover from an imprecise query or an empty result set."
    task: "Try a common query, a partial query, a spelling variation and a query with no matches. Record result quality, recovery options, filters and whether the visitor can clear or revise the search."
    verification: "Record result relevance, query repair, filter use and recovery from an empty result."

  product_evaluation:
    area: product_information
    mode: task
    applies_when: product
    severity: warning
    law_ids: [TRUTHFUL_STATUS, DENSITY, REACH_img_alt]
    statement: "A visitor should be able to understand and compare the offer, price, important attributes, availability and choices before committing."
    task: "Ask a participant to evaluate two relevant offers and explain the material differences, total price, availability and selectable options using only the page."
    verification: "Record whether the visitor can compare the offer, total price, important attributes, availability and choices unaided."

  cart_editing_and_costs:
    area: cart
    mode: task
    applies_when: cart
    severity: warning
    law_ids: [TRUTHFUL_STATUS, POLA_intuitive_navigation, BAYMARD_CART_ABANDONMENT_CONTEXT, BAYMARD_CHECKOUT_COST_TRANSPARENCY]
    statement: "A visitor should be able to review, edit and understand the cart total before entering checkout; abandonment rates must be interpreted by reason, not treated as a diagnosis."
    task: "Add an item, change quantity, remove it, return to the cart and explain the current subtotal, delivery charges, fees and total. Record where each cost first becomes clear; distinguish stated purchase intent from browsing or price comparison rather than pressuring the participant to buy."
    verification: "Record quantity edits, removal, cost disclosure, the participant's stated intent and whether the visitor can explain the final total."

  checkout_guest_and_recovery:
    area: checkout
    mode: task
    applies_when: checkout
    severity: error
    law_ids: [TRUTHFUL_STATUS, REACH_form_label, REACH_aria_labels, BAYMARD_INLINE_VALIDATION_RECOVERY, BAYMARD_USER_AGENCY_OVER_CONVERSION, BAYMARD_CHECKOUT_COST_TRANSPARENCY]
    statement: "A purchase flow should not force avoidable account creation, hide material costs or use coercive choices; field errors must be recoverable without losing entered information."
    task: "Complete a disposable checkout as a guest where the product permits it. Enter an invalid value, correct it, and record whether feedback appears too early, names the specific problem, clears when corrected and preserves unrelated values. Also record account barriers, cost disclosure, optional extras, refusal/cancellation paths, delivery choices and the final confirmation."
    verification: "Record inline error timing and correction, retained values, avoidable account barriers, visible total costs, optional extras, refusal/cancellation clarity and confirmation."

  mobile_task_completion:
    area: mobile
    mode: task
    applies_when: all
    severity: warning
    law_ids: [REACH_touch_target_min, REACH_focus_visible, POLA_intuitive_navigation]
    statement: "The primary visitor task should remain understandable and completable on a phone without horizontal page scrolling or obstructed controls."
    task: "Repeat one representative task at a narrow phone viewport and with touch input. Record clipping, sticky overlays, target misses, keyboard obstruction and any task failure."
    verification: "Record task completion, clipping, target misses, obstruction and keyboard occlusion at the tested phone viewport."

  keyboard_and_assistive_technology:
    area: accessibility
    mode: task
    applies_when: all
    severity: error
    law_ids: [REACH_aria_labels, REACH_focus_visible, REACH_skip_to_main]
    statement: "The core journey should remain perceivable and operable without pointer input and expose meaningful names, roles, states and errors."
    task: "Complete a core journey using keyboard only, then inspect key controls with a screen reader. Record focus order, announcements, validation errors, modal handling and state changes."
    verification: "Record focus order, accessible announcements, error recovery, modal operation and completion without pointer input."
# A source or participant-task result is only as strong as its evidence.
# Rendered browser checks also run through MASTER/checks' existing instruments;
# participant tasks remain inconclusive until observations are supplied.
evidence_policy:
  required:
    source:
      pass: [source_files, source_inventory_sha256]
      finding: [finding_path, line, source_sha256]
    task: [method, participants, summary, artifacts, sha256]
  task_privacy: >-
    Store only manually anonymised aggregate observations; do not persist
    participant names, contact details, recordings or raw personal data. The
    automated text scan rejects emails, phone-like strings and common structured
    participant/customer name or ID fields, but is a guardrail rather than a
    complete PII detector. Image artifacts require explicit human review and
    redaction attestation before acceptance.
  verdicts: [pass, fail, inconclusive, not_applicable]
