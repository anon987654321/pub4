---
# Physical order is intentional: governing laws first, then how /fix applies them, proves them, and reaches the world.
# The first nine entries are priority-ranked laws (eight operating principles plus the inter-model protocol). The remaining sections are execution policy, adapters, topology, runtime, and
# operator-owned configuration. Historical change belongs in git; comments here state present constraints only.

CAPABILITY_STATUS_MUST_BE_TRUTHFUL:
  priority: 1
  tier: constitutional
  severity: error
  statement: Unavailable capabilities must never be reported as ready.
  applies_to:
  - security
  - observability
  - service_status
  provenance: openbsd_status

ROBUSTNESS:
  priority: 1
  tier: constitutional
  statement: Errors fail safely; security first; handle edge cases.
  applies_to:
  - security
  - errors
  - input_validation
  - resource_management
  research:
    - name: "IEEE Top 10 Security Vulnerabilities in Code"
      url: "https://ar5iv.labs.arxiv.org/html/2006.03281"
    - name: "OWASP Top 10"
      url: "https://owasp.org/Top10"
    - name: "Defensive Programming"
      url: "https://github.com/google/styleguide"

SINGULARITY:
  priority: 2
  tier: constitutional
  severity: error
  statement: One source of truth; no duplication; data integrity.
  applies_to:
  - duplication
  - consistency
  - data_integrity
  research:
    - name: "DRY (Andrew Hunt, David Thomas)"
      url: "https://pragprog.com/titles/pragddd/the-pragmatic-programmer"
    - name: "Database Normalization Theory"
      url: "https://en.wikipedia.org/wiki/Database_normalization"

LINEARITY:
  priority: 3
  tier: constitutional
  severity: error
  statement: Sequential flow; minimal branches; clear path.
  applies_to:
  - control_flow
  - nesting
  - complexity
  research:
    - name: "Cyclomatic Complexity (McCabe 1976)"
      url: "https://en.wikipedia.org/wiki/Cyclomatic_complexity"
    - name: "Cognitive Load in Code"
      url: "https://ar5iv.labs.arxiv.org/html/2107.03127"

PROXIMITY:
  priority: 4
  tier: constitutional
  statement: Related code together; cohesive modules.
  applies_to:
  - organization
  - coupling
  - modules
  research:
    - name: "Cohesion and Coupling (Yourdon & Constantine)"
      url: "https://en.wikipedia.org/wiki/Cohesion_(computer_science)"
    - name: "SOLID Principles"
      url: "https://en.wikipedia.org/wiki/SOLID"

ABSTRACTION:
  priority: 5
  tier: constitutional
  statement: Right level; no leaky abstractions; appropriate hiding.
  applies_to:
  - interfaces
  - encapsulation
  - apis
  research:
    - name: "Leaky Abstractions (Joel Spolsky)"
      url: "https://www.joelonsoftware.com/2002/11/11/the-law-of-leaky-abstractions"
    - name: "Interface Design Patterns"
      url: "https://en.wikipedia.org/wiki/Interface_segregation_principle"

DENSITY:
  priority: 6
  tier: constitutional
  statement: Information dense; no noise; signal not noise.
  applies_to:
  - verbosity
  - comments
  - naming
  research:
    - name: "Elements of Style (Strunk & White)"
      url: "https://www.gutenberg.org/ebooks/37134"
    - name: "Signal-to-Noise Ratio in Code"
      url: "https://ar5iv.labs.arxiv.org/html/2310.19102"

RENDERED_VALUES:
  priority: 7
  tier: constitutional
  statement: Rendered values are operator-owned.
  applies_to:
  - aesthetics
  - colors
  - fonts
  - sound_parameters
  - layout_constants
  research:
    - name: "Operator Sovereignty over Aesthetics"
      url: "internal:operator_decision_log"


# Executable counterpart lives in law/inter_model.rb and is enforced by the council adapter.
INTER_MODEL_CONTRACT:
  priority: 8
  tier: constitutional
  severity: error
  statement: >
    Every council turn uses a validated structured request envelope and returns
    evidence-backed findings. Invalid responses receive one structured rejection
    and retry; repeated invalidity is reported as a failed peer turn, never concurrence.
  applies_to: [inter_model, council, chamber, multi_model]
  research:
    - name: "Signal-to-noise"
      url: "internal:laws.yml#DENSITY"
    - name: "Anti-simulation"
      url: "internal:soul.yml#absolute.anti_simulation"
  fixtures:
    bad: "@agent.ask(prompt)"
    good: "@agent.ask(request_prompt)"

languages:
  ruby:
    version: "3.3+"

markdown_style:
  aesthetic: tadao_ando
  applies_to: [MASTER, claude, grok, codex]
  rules:
    - fewer sections than feel necessary; cut before you add
    - irregular composition — vary heading levels and paragraph length
    - negative space is structure, not waste
    - concrete over ornament; delete anything decorative

visual_identity_contract:
  name: signal_and_stillness
  value_authority: MASTER/data/tokens.yml#tokens.visual_identity
  purpose: "An original pub4 identity built from contrast, scale, stillness and one restrained semantic signal."
  rules: ["A first screen has one dominant focal point and one clearly primary next action.", "Neutral surfaces, typography, alignment and negative space carry hierarchy before decoration.", "The signal colour marks meaning; it does not replace local product identity or semantic status text.", "Motion must represent a real state change and have a reduced-motion equivalent.", "Reduced-motion policy applies to every animated layer and transition, including audio-driven, pointer-driven and status-driven effects; retain semantic information without continuous movement.", "Concurrent visual layers share a device budget; no adapter may spend the whole renderer budget independently or create an unbounded point, pulse or trail population.", "Rendering adapters must expose bounded lifecycle and failure status, release resources they own, and never describe a lost or uninitialized context as ready.", "Performance claims distinguish JavaScript render-call cadence from GPU completion or validated frame rate, and include device and viewport evidence when measured.", "Surface treatments remain flat; no decorative glow, ornamental shadow or generic AI gradient.", "Real product, garment, person and media colours remain truthful.", "Every tree adapts the visual language to its task instead of sharing one forced palette.", "Never copy the reference's wordmark, key art, characters or distinctive protected expression.", "The signal occupies no more than the declared highlight-area budget and remains a semantic accent rather than a universal page background.", "Selected navigation and command-palette items have an explicit state marker and remain understandable without colour.", "The display role is opt-in; body, metadata and technical type retain their separate semantic roles.", "Product photographs, clothing colours, faces and media grades are not recoloured to satisfy branding.", "Brand marks are original artwork; wordmark typography does not replace semantic page headings.", "CLI and OpenBSD operator output retain plain-text state labels, location and actionable recovery without decorative colour.", "Generated artwork keeps critical copy editable and out of generative photographic pixels."]
  adapters:
    master: "signal-and-stillness; monochrome console chrome; expressive face is the only organic focal centerpiece"
    rails: "shared typography and semantic signal; retain each product dialect recorded in apps.yml"
    openbsd: "OpenBSD Operator prompt and dmesg discipline; plain text remains complete without colour"
    studio: "editorial composition only where appropriate; rendered values and media fidelity remain operator-owned"
  acceptance:
    required: [canonical_tokens, generated_artifact_sync, executable_law_fixtures, contrast, semantic_states, reduced_motion, reduced_motion_runtime, aggregate_render_budget, renderer_lifecycle, render_state_regression, device_performance_evidence, typography_roles, product_dialect_contracts, media_fidelity, narrow_and_wide_screens, rendered_screenshots, original_brand_assets, ux_refinement_catalog, cli_prompt_contract, input_recovery, browser_reconnection, visible_status, keyboard_accessibility, terminal_modes]
    evidence: "Record commit, generator/test output, viewport dimensions and before/after screenshots; source inspection alone is not visual proof."

prose:
  en:
    spoken_in: '.'
    file_languages: [markdown, ruby]
    # Where the language is written inside those files. English here is the
    # prose in comments, so the detector has to skip the code around them;
    # `values` reads a locale file, where the strings are the prose and the keys
    # are not.
    reads: comments
    ids:
      qualifiers: PROSE_OMIT_QUALIFIERS
      passive: PROSE_ACTIVE_VOICE
    fixtures:
      qualifiers: { bad: '# This is very fast.', good: '# This is fast.' }
      passive:
        bad: '# The bug was fixed by the maintainer.'
        good: '# The maintainer fixed the bug.'
    # `actually` and `literally` are absent on purpose. Both read as leeches
    # and neither is one here: they are contrastive, setting what is against
    # what was claimed, which is this repo's recurring subject. 85 and 4 hits
    # respectively, every one of them that use.
    leeches: [very, rather, really, quite, pretty, somewhat, just, basically, simply]
    keep:
      - 'rather than'                              # a contrast, not a degree
      - 'rather\s*$'                               # "rather than" wrapped mid-phrase
      - 'just (?:as|because|before|after|when)'    # a comparison
      - '(?:not|never)\s+(?:just|simply|only)'     # a negation
      - 'n''t\s+(?:just|simply|only)'
      - 'just\s+(?:\w+ed|found|said|ran|saw|built)' # moments ago, a tense marker
      - '(?:the|this|that|its) very'               # a determiner picking a thing out
    passive:
      auxiliary: '(?:was|were|been)'
      participle: '(?:\w+ly\s+)?\w+ed'
      agent: 'by'
  nb:
    # Bokmål reaches the tree through the Rails locale files and nowhere else;
    # every comment in the repo is English. Scoped there, `bare` is Norwegian.
    spoken_in: '(?:\A|[/.])nb\.yml\z'
    file_languages: [yaml]
    reads: values
    ids:
      qualifiers: PROSE_OMIT_QUALIFIERS_NB
      passive: PROSE_ACTIVE_VOICE_NB
    fixtures:
      qualifiers:
        bad: 'tittel: Dette er veldig raskt'
        good: 'tittel: Dette er raskt'
      passive:
        bad: 'notis: Feilen ble rettet av vedlikeholderen'
        good: 'notis: Vedlikeholderen rettet feilen'
    # `egentlig` and `faktisk` are held out for the same reason `actually` is:
    # both mark a contrast with what was assumed rather than grading anything.
    #
    # `bare` is held out on measured evidence. It reads as English `just` and
    # carries the same split, but in this tree the restrictive sense is the only
    # one present: all 11 hits were "du kan bare slette dine egne kommentarer",
    # "bare medlemmer poster", "Dating er bare for voksne". Bokmål has no other
    # word for that "only", so deleting it inverts the sentence — the copy stops
    # saying what a reader may not do. English `just` keeps its place because
    # the merely sense does appear there; here it does not.
    leeches: [veldig, svært, ganske, nokså, temmelig, virkelig, simpelthen]
    keep:
      - 'heller enn'          # rather than
      - 'ikke bare'           # not only
    # Bokmål builds the periphrastic passive with bli/ble/blitt and marks the
    # agent with `av`, which is the same shape the English Law judges.
    passive:
      auxiliary: '(?:ble|blitt)'
      participle: '\w+(?:et|dd|tt|t)'
      agent: 'av'

# One file holds the governing Law catalogue and its supporting execution policy.

# Detector-health policy. Measurement-only findings stay visible to observation but
# do not become automatic repair targets until their detectors have stronger evidence.
zsh:
  banned_commands: [sed, awk, tr, cut, find, head, tail, wc, perl, python, bash]
  forbidden_commands:
    - command: sed
      replacement: '${var//find/replace}'
    - command: awk
      replacement: '${(s:,:)var} and zsh parameter expansion'
    - command: tr
      replacement: '${(L)var} / ${(U)var}'
    - command: cut
      replacement: '${(s:,:)var}'
    - command: find
      replacement: 'zsh globs such as **/*.rb, *(.) and *(/)'
    - command: head
      replacement: '${array[1]} or a bounded slice'
    - command: tail
      replacement: '${array[-1]} or a bounded slice'
    - command: wc
      replacement: 'Ruby File.size or a Ruby count'
  native_patterns:
    replace_all: '${var//find/replace}'
    lowercase: '${(L)var}'
    uppercase: '${(U)var}'
    split: '${(s:,:)var}'
    join: '${(j:,:)arr}'
    unique: '${(u)arr}'
    sort: '${(o)arr}'
    include_match: '${(M)arr:#*pattern*}'
    exclude_match: '${arr:#*pattern*}'
  ssh_reading:
    law: 'Read remote files through SSH with Ruby or zsh instead of invoking external text filters.'
  token_economics:
    philosophy: 'Prefer one zsh expansion or one Ruby expression over a pipeline of external processes; each subprocess adds cost and policy surface.'

detection_calibration:
  measurement_only:
    CQS:
      reason: "AST detector still has valid command/query boundary cases."
    MAGIC_COLOR:
      reason: "Raw colour literals can be intentional rendered values owned by the operator."
    DOUBLE_QUOTES_RUBY:
      reason: "Quote style is advisory and must not block convergence."

phantom_recovery:
  detectors:
    gaslighting_preamble: "/^(I('ll| will| can| would)|Let me|Sure,)/i"
    text_repetition_loop: same 60-char span repeats >= 3 times
    xml_tool_call_failure: "<tool> open without close OR malformed JSON in args"
    empty_tool_response: tool returned nil twice in a row
  # Detected and reported, but never counted toward the halt ladder below.
  #
  # The malfunction detectors name a real failure: repeated output, an invalid
  # tool call, or an empty tool response twice. A style complaint does not.
  # It is reported to the trace and critique but cannot spend the recovery ladder.
  style_only:
  - gaslighting_preamble
  recovery:
  - discard last response, reset context to last successful checkpoint
  - switch model tier (escalate or fall back) on second occurrence
  - publish phantom:detected event, halt loop on third

transformation_policy:
  version: 1
  invariants:
    public_api: "Keep public constants, public method signatures, command verbs, routes, and observable behaviour unchanged."
    public_import_paths: "Keep existing require and import paths; when a path must move, retain a tested compatibility shim and prove its loader contract."
    dependency_direction: "lib never requires bin; the core never requires optional clusters; do not reverse an established dependency edge."
    out_of_scope: "Name protected paths and excluded surfaces before writing; never infer permission from the task being nearby."
    behavior: "Characterize the unchanged baseline first; tests, golden output, and side-effect order must remain equivalent."
    file_creation: "New production files are move targets or independently owned concepts, never summaries, changelogs, design notes, or wrappers without a caller."
    deletion: "Delete only a named path with evidence; inspect constants, dynamic dispatch, reflection, loaders, render paths, and deployment references."
  candidate_map:
    minimum_alternatives: 15
    minimum_distinct_target_paths: 3
    score_range: [1, 5]
    exhaustion: "If fewer defensible alternatives or distinct target paths exist, report the actual count; never pad the map with paraphrases."
  loop:
    convergence: "DONE only when a fresh structural scan has no actionable findings."
    plateau: "PLATEAU when candidates remain but a complete round keeps no verified improvement."
    veto: "VETO when a constitutional invariant, preservation contract, or scope guard refuses the proposed change."
    bounded_run: "LIMIT_REACHED when the configured run budget ends before convergence; never report DONE."
  operation_rules:
    remove:
      when: "Dead or redundant material is proven unreachable and its contracts are accounted for."
      not_when: "Dynamic dispatch, reflection, external consumers, generated artifacts, or deployment paths are unresolved."
    defragment:
      when: "One concept is scattered across files that change together for the same decision."
      not_when: "The pieces have independent owners or independent reasons to change."
    flatten:
      when: "A wrapper or directory carries no domain, lifecycle, security, or compatibility meaning."
      not_when: "Depth mirrors a genuine domain boundary or a public loader path."
    decouple:
      when: "A dependency leaks across an ownership boundary and causes unrelated changes to ripple."
      not_when: "A new abstraction only adds indirection for one caller."
    split:
      when: "One unit holds responsibilities with distinct reasons to change."
      not_when: "The split creates one-use files or moves complexity without improving traceability."
    hoist:
      when: "Several consumers share one invariant or value with one authoritative owner."
      not_when: "The value is local by nature or consumers only look syntactically similar."
    merge:
      when: "At least three sites encode the same decision and history or ownership evidence shows they change together."
      not_when: "Fewer than three sites exist, clients diverge, or the common abstraction hides different decisions."
    relocate:
      when: "Ownership and the actual dependency graph place a concept beside another owner."
      not_when: "The move changes a public import path, loader expectation, or external mirror without a compatibility proof."
    rename:
      when: "A name is materially misleading and every reference can be rewritten while preserving public contracts."
      not_when: "A public name would disappear without a compatibility alias or path shim."
    reorder:
      when: "Primary facts or load-bearing logic are buried below secondary detail."
      not_when: "Order controls side effects, initialization, precedence, or external output."
    reflow:
      when: "Physical boundaries obscure the existing semantic structure."
      not_when: "Line wrapping is the only claimed benefit or a generated artifact owns the text."
    simplify:
      when: "A shorter form preserves meaning and reduces decisions or indirection."
      not_when: "The removed distinction carries a real invariant, useful name, or failure boundary."
    recommend:
      when: "The evidence identifies a plausible improvement but cannot prove safe automatic mutation."
      not_when: "Recommendation is being used to hide a deterministic check that should be run."
  decision_table:
    - condition: "Fewer than three independent sites."
      choose: "KISS; retain duplication."
    - condition: "Three or more sites encode the same decision and co-change for the same reason."
      choose: "DRY; consolidate the decision at its owner."
    - condition: "Three or more lookalike sites serve divergent clients or change for different reasons."
      choose: "KISS; keep distinct implementations."
  scorecard:
    history_window_commits: 200
    metrics: [cohesion, coupling, domain_depth, decision_duplication, traceability, concepts, loc]
    measurements:
      cohesion: "Use actual recurring Git co-change pairs; never infer cohesion from neighbouring paths alone."
      coupling: "Count concrete static require/import/render reference edges as a proxy; inspect ownership before interpreting the count."
      domain_depth: "Measure maximum path depth and single-child directories, then distinguish redundant layers from meaningful domain paths."
      decision_duplication: "Requires naming the decision and comparing actual sites; raw repeated lines alone are insufficient."
      traceability: "Requires measuring files needed to follow one behaviour; mark unmeasured unless the relevant dependency path is known."
      concepts: "Count tracked paths plus named declarations; a new concept must earn its cost by reducing traceability or coupling."
      loc: "Measure tracked source lines; the structural ratchet is a non-increasing ceiling, not a per-step shrink mandate."
    acceptance:
      regression: "Every measured regression needs an operation-specific justification; unmeasured dimensions remain explicitly inconclusive."
      concepts: "Prefer non-increasing concepts; a new concept must earn its cost by reducing traceability or coupling."
      loc: "Never raise a ratchet without an explicit measured reason."
      tie: "keep_current_tree"
  proof_of_equivalence:
    required: [pass_set_before_after, public_constant_diff, require_path_diff, source_hashes_before_after, scorecard_before_after, ratchet_delta, residual_risk]
    no_narrative_substitute: true
  structural_checks:
    UNALIASED_MOVE:
      detector: "Master::Fix::Restructure::Proof#unaliased_move_failure"
      positive_fixture: "MASTER/test/test_restructure.rb#test_unaliased_move_is_refused"
      negative_fixture: "MASTER/test/test_restructure.rb#test_dead_constant_deletion_is_not_a_move"
    MIXED_COMMIT:
      detector: "Master::Fix::Restructure::Plan#validate_operations!"
      positive_fixture: "MASTER/test/test_restructure.rb#test_plan_rejects_mixed_test_and_production_changes"
      negative_fixture: "MASTER/test/test_restructure.rb#test_plan_spares_a_production_only_change"
    SINGLE_CHILD_DIR:
      detector: "Master::Review::Scan::Laws::FileSprawlLaw"
      positive_fixture: "MASTER/test/test_scan_law_contracts.rb#test_file_sprawl_flags_lone_files_and_tiny_files_but_not_core_or_law"
      negative_fixture: "MASTER/test/test_scan_law_contracts.rb#test_file_sprawl_spares_what_rails_names_and_nothing_else"
    BATCH_DELETE:
      detector: "Master::Fix::Restructure::Plan#validate_operations! and MASTER/law/shell.rb:NEVER_BATCH_DELETE"
      positive_fixture: "MASTER/test/test_restructure.rb#test_plan_rejects_multiple_named_deletions"
      negative_fixture: "MASTER/test/test_restructure.rb#test_dead_constant_deletion_is_not_a_move"
  not_applicable_operations:
    FUZZY_MOVE: "Restructure plans replace complete named file bodies; there is no fuzzy search/replace move path. Do not add a parallel fuzzy matcher."

  preflight:
    - inventory
    - classify
  # One dependency-aware sequence. Remove proven waste before defragmenting;
  # flatten before decoupling; split unlike concerns before merging like ones;
  # hoist shared values before the merge; reflow only after structural changes.
  # law_deps adds law-specific constraints that do not fit a universal sequence.
  order: [remove, defragment, flatten, decouple, split, hoist, merge, relocate, rename, reorder, reflow, simplify, recommend]
  postflight:
    - prove
  operations:
    remove: "Delete only proven dead, redundant, historical, transitional, or otherwise unnecessary material."
    defragment: "Bring one concept or source of truth back together when it is unnecessarily scattered."
    flatten: "Remove needless wrappers, nesting, delegation layers, directories, and abstractions."
    decouple: "Remove unnecessary dependencies and references between independent concerns, after flattening exposes them."
    split: "Separate unlike concerns that have been fused into one unit before consolidating equivalent units."
    hoist: "Lift a shared constant or invariant to its authoritative owner before merging its consumers."
    merge: "Join equivalent or near-equivalent logic, prose, configuration, or structure only after checking their reason to change."
    relocate: "Put code, data, prose, and configuration beside the thing that owns or consumes it."
    rename: "Names state present meaning; rename files, constants, methods, variables, laws, and sections when the existing name misleads."
    reorder: "Put primary facts and load-bearing logic before secondary detail and exceptions."
    reflow: "Change physical line and paragraph boundaries to follow semantic structure and reading rhythm after structural edits."
    simplify: "Pull incidental complexity out after structural changes and prefer the smallest coherent form."
    recommend: "When evidence is insufficient for a safe automatic transformation, recommend the smallest useful change instead of guessing."
  preservation:
    semantic_meaning: required
    public_contracts: required
    reference_graph: required
    side_effect_order: required
    rendered_output: required_when_applicable
  acceptance:
    concepts: "after <= before, or after <= before + 1 when traceability improves"
    loc: "ceiling never rises; tighten it when a step lowers the measure"
    tie: keep_current_tree
  co_change:
    shared_decision: defragment
    leaky_dependency: decouple
  exit:
    convergence: "no candidate clears the payoff/risk threshold"
    plateau: "five consecutive steps without a scorecard improvement"
    veto: "an invariant or preservation check fails"
  reconsider:
    trigger: "cohesion or traceability regresses across a window of landed steps"
    action: "open a revert candidate; the base tree is not sacred once the measure falls"
  delete:
    not_when: "dynamic dispatch, send, require_dependency, reflection, or public API surface reaches it"
  candidates:
    distinct: "pairwise-distinct target files; paraphrases of one change count once"
    thresholds: "rule of three for merge sites; other counts configurable with a recorded reason"
  proof: "every edit to this section ships a fixture that fails against the prior text"
  evidence:
    before: "Record hashes and measured facts from the observed state before mutation."
    after: "Re-observe the changed artifact and compare the same facts after mutation."
    no_content_copy: true
    automatic_change: "Requires deterministic proof or an existing transformation with a proven preservation contract."
  comments:
    redundant: remove
    changelog_history: "Use git commit history, not source comments, for historical change records."
    rationale: "Keep a comment when it explains a non-obvious present constraint, invariant, or reason."
  rename:
    scopes: [files, constants, methods, variables, laws, sections]
    require_reference_rewrite: true
    preserve_public_signatures: true
  modes:
    deterministic: "May transform automatically when its proof contract is satisfied."
    review: "May propose and apply only after hostile review and preservation proof."
    recommendation: "Propose only; never mutate."
  evidence_hierarchy:
    - id: characterization
      strength: highest
      practice: "Capture observable behavior, output, public contracts, and fixtures before structural change."
    - id: structural
      strength: high
      practice: "Prefer AST, dependency, reference, and schema facts over lexical guesses."
    - id: runtime
      strength: high
      practice: "Use tests, execution traces, timing, and output digests when behavior or performance is part of the contract."
    - id: history
      strength: medium
      practice: "Use git history, blame, and co-change evidence to distinguish stable similarity from shared reasons to change."
    - id: visual
      strength: high
      practice: "For rendered surfaces, compare geometry, hierarchy, accessibility, and a visual baseline before and after."
    - id: semantic
      strength: medium
      practice: "Use maintainer or model judgment only after deterministic evidence narrows the question."
    - id: taste
      strength: lowest
      practice: "Aesthetic preference alone may recommend a change but never authorizes an automatic mutation."
  smell_catalog:
    code: [dead_code, long_method, god_class, deep_nesting, shotgun_surgery, feature_envy, speculative_generality, duplicate_abstraction, primitive_obsession, flag_argument]
    ruby: [non_idiomatic_iteration, needless_indirection, misplaced_visibility, generic_names, mutable_constants, unnecessary_option_hash, boolean_condition_complexity]
    rails: [fat_controller, n_plus_one, callback_sprawl, validation_overreach, duplicated_view_logic, configuration_drift]
    prose: [duplicated_claim, throat_clearing, qualifier_noise, passive_agent, undefined_term, hierarchy_drift, historical_comment, paragraph_overload]
    visual: [hierarchy_flattening, spacing_drift, token_fragmentation, component_duplication, decoration_compensation, interaction_inconsistency, responsive_drift, inaccessible_state]
  domain_adapters:
    ruby: "Use Prism/RuboCop-style AST and syntax-aware measurements before lexical transformations."
    rails: "Check framework conventions, routes, Zeitwerk paths, controller/model boundaries, queries, callbacks, and rendered behavior."
    prose: "Check claims, terminology, paragraph/heading hierarchy, reading measure, and meaning before style-level edits."
    visual: "Check semantic HTML, geometry, type hierarchy, spacing, interaction targets, accessibility, and visual regression before decoration."
  refactoring_playbook:
    methods:
      - id: characterize_before_change
        action: "Capture behavior and contracts before structural change."
      - id: one_hat
        action: "Change structure or behavior in a small step, then verify before the next step."
      - id: delete_before_abstract
        action: "Try deletion or consolidation before introducing a new abstraction."
      - id: same_reason_to_change
        action: "Consolidate only when the units share a reason to change; superficial similarity is insufficient. Below three sites keep the duplication: a wrong abstraction costs more than a repeated line."
      - id: preparatory_refactoring
        action: "Reshape code toward a safe seam before making the requested behavior change."
      - id: history_as_evidence
        action: "Use git co-change and blame evidence to distinguish accidental similarity from architectural coupling."
      - id: make_deletion_easy
        action: "Prefer boundaries and ownership that make obsolete material easy to remove."
      - id: domain_first
        action: "Use AST/schema/rendered evidence appropriate to the artifact before lexical cleanup."
    technique_by_domain:
      ruby: [rename, extract_method, inline_method, move_method, extract_class, inline_class, replace_conditional_with_polymorphism, introduce_parameter_object, split_phase, separate_query_from_modifier]
      rails: [extract_controller_service, move_query_to_model_or_query_object, remove_callback_sprawl, eliminate_n_plus_one, consolidate_view_logic]
      prose: [rename_concept, extract_concept, inline_redundant_explanation, split_overloaded_paragraph, reorder_for_information_hierarchy, remove_throat_clearing, delete_historical_comment]
      visual: [establish_layout, establish_hierarchy, normalize_spacing, consolidate_tokens, consolidate_components, remove_decorative_compensation, verify_accessibility, verify_visual_regression]
    checks: ["No transformation without an identified smell, seam, or contract improvement.", "No automatic mutation when evidence is weaker than the transformation mode requires.", "After every mutation, re-run the same evidence used to justify it.", "If the measured result is not an improvement, revert rather than rationalize."]
  automatic_vetoes: ["Do not auto-refactor a public interface without reference-graph and contract proof.", "Do not auto-merge similar code when the units have different reasons to change.", "Do not delete a file based on absence of textual references alone; inspect constants, loaders, runtime discovery, and deployment paths.", "Do not rewrite prose when the transformation changes a claim, obligation, or legal/constitutional meaning.", "Do not make visual redesigns from taste alone; require a measured usability, accessibility, hierarchy, or consistency defect.", "Do not optimize performance without before/after measurement and output-equivalence evidence."]
