ROBUSTNESS_exemption_without_expiry:
  parent: ROBUSTNESS
  statement: "A review resolution accepted with no expiry."
  resolution: never

ROBUSTNESS_expired_exemption:
  parent: ROBUSTNESS
  statement: "A review resolution past its expiry still in force."
  resolution: never

# ---

SINGULARITY:
  node: singularity
  statement: "Every fact has one definition. Copies drift silently."
  severity: error
  resolution: review
  mechanical: Master::Law::Universal#singularity
  semantic: human

DRY:
  parent: SINGULARITY
  statement: >
    Don't Repeat Yourself. Every piece of knowledge has one
    authoritative representation in the system. Repetition of a
    decision is duplication; repetition of a shape with three different
    reasons to change is not.
  resolution: review
  rule_of_three: >
    Three or more sites encoding one decision, co-changing for the same
    reason, consolidate at the owner. Fewer than three, keep the
    duplication; a wrong abstraction costs more than a repeated line.
    Three or more lookalike sites serving divergent clients, keep them
    distinct.
  lineage: "Hunt & Thomas, The Pragmatic Programmer"

SINGULARITY_one_true_mark:
  parent: SINGULARITY
  statement: "Two marks for one meaning."
  resolution: automatic
  proof: MASTER/test/test_cosmetic_laws.rb#test_en_dash_range

SINGULARITY_configuration_shape:
  parent: SINGULARITY
  statement: "A config that reads as a program."
  resolution: review

SINGULARITY_magic_color:
  parent: SINGULARITY
  statement: "A raw colour literal outside the token source."
  resolution: review
  calibration: measurement_only

