# Style contracts shared by postpro, replicate and dilla. These domain policies
# are enforced by STUDIO's registry and modality adapters. They enter MASTER's
# priority constitutional parity gate only if matching MASTER detector coverage
# is added; aesthetic choices remain operator-owned.
STYLE_REGISTRY:
  tier: policy
  severity: error
  statement: "Each named style resolves to one immutable versioned entry per modality; tools consume the registry instead of maintaining parallel house looks."
  applies_to: [style, registry, cross_modal]
  see_also: [SINGULARITY, RENDERED_VALUES]

STYLE_SCOPE:
  tier: policy
  severity: error
  statement: "Reference-derived styles transfer only explicitly declared attribute classes, each with its own source fingerprint and strength."
  applies_to: [style, references, attributes]
  see_also: [DENSITY]

STYLE_LINEAGE:
  tier: policy
  severity: error
  statement: "Style manifests separate inputs used (lineage) from measured output influence; lineage alone never proves influence, and null influence requires a reason."
  applies_to: [style, provenance, attribution]
  see_also: [CAPABILITY_STATUS_MUST_BE_TRUTHFUL]

STYLE_VERSIONING:
  tier: policy
  severity: error
  statement: "Released style versions are write-once; changes mint a higher version with owner, rationale and predecessor while prior versions remain resolvable."
  applies_to: [style, versioning, reproducibility]
  see_also: [SINGULARITY, RENDERED_VALUES]

STYLE_TEMPORAL_CONSTANCY:
  tier: policy
  severity: error
  statement: "A render uses one style instance throughout unless a schedule hash is declared in both the registry and render manifest."
  applies_to: [style, video, audio, temporal]
  see_also: [LINEARITY]

STYLE_REFUSAL:
  tier: policy
  severity: error
  statement: "Negative-list constraints are evaluated before rendering; refusal reports the matched constraint and never masquerades as a generation failure."
  applies_to: [style, refusal, brand_safety]
  see_also: [ROBUSTNESS]

STYLE_ARBITRATION:
  tier: policy
  severity: error
  statement: "Reviewers adjudicate declared contracts and evidence, not taste; aesthetic decisions remain with the operator under RENDERED_VALUES."
  applies_to: [style, review, arbitration]
  see_also: [INTER_MODEL_CONTRACT, RENDERED_VALUES]


# Ad visuals are governed by the same declaration → detector → gate chain as copy.
# The token contract is a child of the canonical token source; no parallel palette.
VISUAL_IDENTITY_TOKENS_ONLY:
  tier: policy
  severity: error
  statement: "Ad-organ CSS resolves colour, typography and spacing through the canonical visual token contract; hardcoded presentation values fail the audit."
  applies_to: [ads, visual_identity, css]
  contract: "MASTER/data/tokens.yml#tokens.ad_visual_contract"
  detector: "Master::Visual::AdAudit.identity_tokens"

VISUAL_CONTRAST_WCAG_AA:
  tier: policy
  severity: error
  statement: "Every audited ad text/background pair meets WCAG AA contrast thresholds in the token contract and in rendered evidence."
  applies_to: [ads, accessibility, contrast]
  detector: "Master::Visual::AdAudit.contrast"

VISUAL_DISCLOSURE_PROMINENCE:
  tier: policy
  severity: error
  statement: "Native and affiliate creatives identify their commercial nature near the content with readable, contrasting disclosure."
  applies_to: [ads, disclosure, compliance]
  detector: "Master::Visual::AdAudit.disclosure"

VISUAL_ALT_TEXT_PRESENT:
  tier: policy
  severity: error
  statement: "Every image in an ad creative has non-empty alternative text unless it is explicitly decorative."
  applies_to: [ads, accessibility, images]
  detector: "Master::Visual::AdAudit.alt_text"

VISUAL_SAFE_ZONE_RESPECTED:
  tier: policy
  severity: error
  statement: "Rendered headline, logo and call-to-action bounds remain inside the placement safe zone."
  applies_to: [ads, placement, composition]
  detector: "Master::Visual::AdAudit.safe_zone"

VISUAL_RENDER_INTEGRITY:
  tier: policy
  severity: error
  statement: "A creative passes only with rendered evidence proving assets loaded, transfer size within budget and layout shift within budget."
  applies_to: [ads, rendering, performance]
  detector: "Master::Visual::AdAudit.render_integrity"
