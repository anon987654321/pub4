# ---

LINT_SEVERITY_IN_VOCABULARY:
  root: visible_state
  statement: "Every severity is one of info, warning, error, critical, veto."
  severity: error
  resolution: never
  enforcement: bin/master lint:laws#severity_in_vocabulary

LINT_AUTOFIX_HAS_PROOF:
  root: visible_state
  statement: "resolution automatic names a proof fixture that fails before and passes after."
  severity: error
  resolution: never
  enforcement: bin/master lint:laws#autofix_has_proof

LINT_MEASUREMENT_DOES_NOT_MUTATE:
  root: visible_state
  statement: "calibration measurement_only forbids resolution automatic on the same law."
  severity: error
  resolution: never
  enforcement: bin/master lint:laws#measurement_does_not_mutate

LINT_NO_EXCLUDE:
  root: visible_state
  statement: >
    A law does not carry exclude, path, or path_pattern. A file's kind
    is a fact; the finding is made; the review resolution carries the
    reason and the expiry.
  severity: error
  resolution: never
  enforcement: bin/master lint:laws#no_exclude

LINT_NO_SCOPE:
  root: visible_state
  statement: >
    A law does not carry applies_to or domain. A universal law does not
    say where it applies; if a file contains the pattern, the law
    catches it. If it does not, there is no finding.
  severity: error
  resolution: never
  enforcement: bin/master lint:laws#no_scope

LINT_BOTH_MODALITIES:
  root: visible_state
  statement: >
    Every law names a mechanical and a semantic detector. A detector
    declared human is a gap, counted by the duality ratchet.
  severity: error
  resolution: never
  enforcement: bin/master lint:laws#both_modalities

LINT_EVERY_LAW_HAS_ROOT_OR_NODE:
  root: visible_state
  statement: "Every top-level law names either a soul node or a root; every child inherits from its parent."
  severity: error
  resolution: never
  enforcement: bin/master lint:laws#every_law_has_root_or_node

LINT_IDS_UNIQUE:
  root: visible_state
  statement: "Every law id is unique across the file."
  severity: error
  resolution: never
  enforcement: bin/master lint:laws#ids_unique

LINT_EVERY_FINDING_EMITTED:
  root: visible_state
  statement: >
    Soul.emit is called for every finding; a finding not emitted is a
    finding under APPLICATION_IS_UNIFORM_unrecorded_finding.
  severity: error
  resolution: never
  enforcement: bin/master lint:laws#every_finding_emitted

LINT_SOUL_PRINT_MATCHES_SOURCE:
  root: visible_state
  statement: "data/soul.yml body_sha256 equals Soul.print body_sha256 for the loaded soul.rb."
  severity: error
  resolution: never
  enforcement: bin/master lint:laws#soul_print_matches_source

LINT_FAMOUS_NAMES_PRESERVED:
  root: visible_state
  statement: >
    A law whose canonical name is well established (DRY, KISS, SOLID,
    POLA, YAGNI, Law of Demeter, Strunk & White, Bringhurst, Rails
    Doctrine, CQS, SRP, OCP, LSP, ISP, DIP) keeps that name as its id.
    A rename of a famous law is a rename, not a clarification.
  severity: error
  resolution: never
  enforcement: bin/master lint:laws#famous_names_preserved

# ---

META_SCHEMA:
  root: visible_state
  statement: "The schema version of this file."
  severity: info
  resolution: never
  value: 8

META_VERSION:
  root: visible_state
  statement: "The version of this file."
  severity: info
  resolution: never
  value: "8.0.0-first"

META_AUTHOR:
  root: visible_state
  statement: "The author of record, in whom authority vests."
  severity: info
  resolution: never
  value: operator

META_LANGUAGE:
  root: visible_state
  statement: "The language of record."
  severity: info
  resolution: never
  value: english

META_DIALECT:
  root: visible_state
  statement: "The dialect of the operator's secondary language."
  severity: info
  resolution: never
  value: american

SEVERITY_VOCABULARY:
  root: visible_state
  statement: "Every severity is one of these five. warn is a typo, not a synonym."
  severity: error
  resolution: never
  values: [info, warning, error, critical, veto]

ROOTS_VOCABULARY:
  root: visible_state
  statement: "The twelve roots a universal law names."
  severity: info
  resolution: never
  values: [one_source, no_surplus, one_responsibility, least_surprise,
           visible_state, bounded_load, stable_contract, proportion,
           least_authority, stewardship, reach, abstraction]

EVIDENCE_SCORING:
  root: visible_state
  statement: >
    Test pass, scan clean, and code review each contribute; the
    threshold is all three. No margin, no partial credit.
  severity: error
  resolution: never
  weights: { test_pass: 35, scan_clean: 25, code_review: 20 }
  pass_threshold: 80
  require_all_kinds: true

STYLE_REGISTRY:
  parent: OPERATOR_RENDERED
  statement: "Each named style resolves to one immutable versioned entry per modality; tools consume the registry instead of maintaining parallel house looks."
  severity: error
  resolution: review

STYLE_SCOPE:
  parent: OPERATOR_RENDERED
  statement: "Reference-derived styles transfer only explicitly declared attribute classes, each with its own source fingerprint and strength."
  severity: error
  resolution: review

STYLE_LINEAGE:
  parent: OPERATOR_RENDERED
  statement: "Style manifests separate inputs used from measured output influence; lineage alone never proves influence, and null influence requires a reason."
  severity: error
  resolution: review

STYLE_VERSIONING:
  parent: OPERATOR_RENDERED
  statement: "Released style versions are write-once; changes mint a higher version with owner, rationale and predecessor while prior versions remain resolvable."
  severity: error
  resolution: review

STYLE_TEMPORAL_CONSTANCY:
  parent: OPERATOR_RENDERED
  statement: "A render uses one style instance throughout unless a schedule hash is declared in both the registry and render manifest."
  severity: error
  resolution: review

STYLE_REFUSAL:
  parent: OPERATOR_RENDERED
  statement: "Negative-list constraints are evaluated before rendering; refusal reports the matched constraint and never masquerades as a generation failure."
  severity: error
  resolution: review

STYLE_ARBITRATION:
  parent: OPERATOR_RENDERED
  statement: "Reviewers adjudicate declared contracts and evidence, not taste; aesthetic decisions remain with the operator under RENDERED_VALUES."
  severity: error
  resolution: review

VISUAL_IDENTITY_TOKENS_ONLY:
  parent: OPERATOR_RENDERED
  statement: "Ad-organ CSS resolves colour, typography and spacing through the canonical visual token contract; hardcoded presentation values fail the audit."
  severity: error
  resolution: review
  contract: "MASTER/data/tokens.yml#tokens.ad_visual_contract"
  detector: "Master::Visual::AdAudit.identity_tokens"

VISUAL_CONTRAST_WCAG_AA:
  parent: OPERATOR_RENDERED
  statement: "Every audited ad text/background pair meets WCAG AA contrast thresholds in the token contract and in rendered evidence."
  severity: error
  resolution: review
  detector: "Master::Visual::AdAudit.contrast"

VISUAL_DISCLOSURE_PROMINENCE:
  parent: OPERATOR_RENDERED
  statement: "Native and affiliate creatives identify their commercial nature near the content with readable, contrasting disclosure."
  severity: error
  resolution: review
  detector: "Master::Visual::AdAudit.disclosure"

VISUAL_ALT_TEXT_PRESENT:
  parent: OPERATOR_RENDERED
  statement: "Every image in an ad creative has non-empty alternative text unless it is explicitly decorative."
  severity: error
  resolution: review
  detector: "Master::Visual::AdAudit.alt_text"

VISUAL_SAFE_ZONE_RESPECTED:
  parent: OPERATOR_RENDERED
  statement: "Rendered headline, logo and call-to-action bounds remain inside the placement safe zone."
  severity: error
  resolution: review
  detector: "Master::Visual::AdAudit.safe_zone"

VISUAL_RENDER_INTEGRITY:
  parent: OPERATOR_RENDERED
  statement: "A creative passes only with rendered evidence proving assets loaded, transfer size within budget and layout shift within budget."
  severity: error
  resolution: review
  detector: "Master::Visual::AdAudit.render_integrity"
