# laws.yml — operative law, flat, ordered by importance.
#
# Every top-level key is a law. A finding is a law with a parent.
# A ratchet is a law with value and may_only: fall. A kind is a law
# with expiry. A lint is a law with enforcement.
#
# Order runs from most important to least:
#   1. The axiom that makes the pipeline exist.
#   2. The nine constitutional invariants, in soul.rb's precedence order.
#   3. Constitutional support: authorship, modality, finding hygiene,
#      attestation.
#   4. The named principles the reader already knows.
#   5. The remaining universal laws.
#   6. The transformation operations.
#   7. Kinds, ratchets, lints, and the file's own metadata.
#
# A law names no domain, no path, no exclude. The detector finds the
# pattern; if the pattern is not there, there is no finding. A file's
# kind is data the review reads; it is not a scope that exempts the file.
#
# Famous names are not renamed. DRY is DRY, KISS is KISS, SOLID is SOLID,
# POLA is POLA. A law whose famous name is a child of another carries
# parent as data and keeps its own name as its id.
#
# Precedence among constitutional laws lives in soul.rb's graph. This
# file never restates it.

# ==========================================================================
# 1. THE AXIOM
# ==========================================================================

APPLICATION_IS_UNIFORM:
  statement: >
    Every file passes through every law in both modalities. There is no
    path that skips a law. There is no file exempt by location. A file's
    kind is a fact, recorded; a finding is made against the fact, not
    against a bypass.
  root: visible_state
  severity: error
  resolution: never
  mechanical: Master::Pipeline#apply_all
  semantic: human

APPLICATION_IS_UNIFORM_skipped_law:
  parent: APPLICATION_IS_UNIFORM
  statement: "A file passed through without one of the laws."
  resolution: never

APPLICATION_IS_UNIFORM_unrecorded_finding:
  parent: APPLICATION_IS_UNIFORM
  statement: "A finding made and not emitted."
  resolution: never

APPLICATION_IS_UNIFORM_constitution_self_governed:
  parent: APPLICATION_IS_UNIFORM
  statement: "The law catalogue or its validator is treated as exempt from the laws it declares."
  resolution: never

# ==========================================================================
# 2. THE NINE CONSTITUTIONAL INVARIANTS
# ==========================================================================

TRUTHFUL_STATUS:
  node: truthful_status
  statement: >
    Report observed state, not intended. A claim about state carries
    evidence of its class.
  severity: error
  resolution: never
  mechanical: Master::Law::Interface#capability_status
  semantic: Master::Law::Interface#claims_match_evidence

TRUTHFUL_STATUS_false_ready:
  parent: TRUTHFUL_STATUS
  statement: "A capability reported ready when unavailable."
  resolution: never

TRUTHFUL_STATUS_unverified_claim:
  parent: TRUTHFUL_STATUS
  statement: "A claim about state with no evidence of its class."
  resolution: review
  evidence: { read: sha256, modify: diff, complete: output }

TRUTHFUL_STATUS_dishonest_kind:
  parent: TRUTHFUL_STATUS
  statement: "A file's declared kind does not match its content."
  resolution: review

TRUTHFUL_STATUS_silent_test_skip:
  parent: TRUTHFUL_STATUS
  statement: "A skipped test with no reason."
  resolution: review

TRUTHFUL_STATUS_unfinished:
  parent: TRUTHFUL_STATUS
  statement: "A TODO or FIXME in a comment, or an ellipsis body standing alone."
  resolution: review
  reads_comments: true

TRUTHFUL_STATUS_transient_feedback:
  parent: TRUTHFUL_STATUS
  statement: "A loading, success, or failure state that flashes away."
  resolution: review

TRUTHFUL_STATUS_hidden_system_status:
  parent: TRUTHFUL_STATUS
  statement: "The system does not tell the reader what it is doing in time to be useful."
  resolution: review

# ---

