# ---

OPERATOR_RENDERED:
  node: operator_rendered
  statement: >
    Rendered values are operator-owned. The system names the operator's
    choice; it never substitutes.
  severity: error
  resolution: never
  mechanical: Master::Visual::Identity#substitution
  semantic: Master::Visual::Identity#operator_declared

OPERATOR_RENDERED_aesthetic_substitution:
  parent: OPERATOR_RENDERED
  statement: "The system substituted its own aesthetic choice."
  resolution: never

OPERATOR_RENDERED_paper_not_pure_white:
  parent: OPERATOR_RENDERED
  statement: "A brand-export ground is not the declared ground."
  resolution: never

OPERATOR_RENDERED_contract:
  parent: OPERATOR_RENDERED
  statement: "The visual identity contract: signal and stillness."
  resolution: never
  source: MASTER/data/tokens.yml#tokens.visual_identity
  rules:
    - A first screen has one dominant focal point and one clearly primary next action.
    - The signal colour marks meaning; it does not replace local product identity.
    - Motion represents a real state change and has a reduced-motion equivalent.
    - Surface treatments remain flat; no decorative glow, ornamental shadow, or generic AI gradient.
    - Real product, garment, person, and media colours remain truthful.
    - Selected navigation items have an explicit state marker and remain understandable without colour.
    - Brand marks are original artwork; wordmark typography does not replace semantic page headings.
    - Generated artwork keeps critical copy editable and out of generative photographic pixels.
    - Never copy another work's wordmark, key art, characters, or protected expression.

