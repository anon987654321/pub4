    accent_hover: "#4a3fb0"
    danger: "#a9483c"
  # brgen vertical accent map (single source — mirrored in $vertical-accents in brgen's application.scss)
  #
  # Every accent below was tuned to be legible AS INK on a light surface, which
  # makes all seven too light to carry light ink themselves: against --bg
  # (#f7f6fa) they measure 1.77–3.46:1. Anything painting on one of these uses
  # --accent-ink, not --bg. The ink's value lives in $vertical-accent-ink in
  # brgen's application.scss, which is where it is measured. When adding a
  # vertical, check every
  # column, not just the one you need — the `hover` column is the one that has
  # been missed twice.
  vertical_accents:
    # Marketplace's blues are dark enough that the shared dark ink measured 3.67, 2.83 and 2.18:1
    # on its accent, hover and light fill; brgen's light ink reads 4.80, 6.23 and 8.11. A vertical
    # names its own `ink` only where the shared one fails on what it paints.
    marketplace: { accent: "#2563EB", hover: "#1D4ED8", light: "#1E40AF", ink: "#f7f6fa" }
    tv: { accent: "#dc635c", hover: "#b83a33", light: "#dc635c" }
    dating: { accent: "#00d4aa", hover: "#00b391", light: "#009579" }
    takeaway: { accent: "#e07b39", hover: "#c26a30", light: "#c26a30" }
    playlist: { accent: "#12b6c4", hover: "#0f9aa6", light: "#0e8a94" }
    maps: { accent: "#5b8fd4", hover: "#4a7ab8", light: "#5585c5" }
    messenger: { accent: "#6b7fd7", hover: "#5566c4", light: "#6b7fd7" }
  vertical_accent_ink: "#110f19"
  # The rhythm scale. Every spacing, radius, line-height and weight literal in the
  # family's stylesheets must land on a step below, or on a token that resolves to
  # one. Operator::ScaleLint reads this; scale_lint_test.rb ratchets the findings.
  #
  # This is the same argument `viewport:` above makes, applied to the axis it says
  # is already single-sourced and is not. Colour, motion, elevation and the dialect
  # maps are single-sourced. Rhythm was never measured, and on 2026-08-15 it
  # measured 539 spacing literals over 93 distinct values, and 13 distinct
  # line-heights for what is one body-text rhythm.
  #
  # NOT CSS custom properties, and mostly cannot be: `padding: 0.35rem` is a
  # literal an author typed, and no variable exists that would have stopped them.
  # Like `viewport:`, this is a declared set that a lint asserts the sheets obey,
  # not a variable the sheets consume.
  scale:
    space_px: &eight_px_rhythm [0, 1, 2, 3, 4, 8, 12, 16, 20, 24, 28, 32, 36, 40, 44, 48, 56, 64, 72, 80, 96, 128]
    letter_spacing_em: [-0.03, -0.02, -0.01, 0, 0.05, 0.08, 0.14]
    line_height: &line_height_scale [1, 1.25, 1.4, 1.5, 1.6]
    radius_px: [0, 2, 4, 8, 12, 16]
    font_weight: [400, 500, 600, 700, 800]
    opacity: [0.03, 0.05, 0.08, 0.1, 0.12, 0.2, 0.4, 0.6, 0.8]
    duration_ms: [180, 300]
    # Measured 2026-10-27, not raised to quiet new debt: at 3e077b94c, the commit that first
    # wrote these rows, the sheets already counted apps spacing 35 against 7 and radius 19
    # against 0, so the rows never described the tree and the ratchet could not run. These are
    # the counts as they stand. /fix --lane visual snaps off-scale values to the nearest step
    # (ScaleSnap, operator-approved), and each snap lowers its row here.
    baselines:
      apps:
        off_scale_space: 35
        off_scale_line_height: 23
        absolute_line_height: 0
        off_scale_radius: 19
        off_scale_font_weight: 0
        off_scale_tracking: 7
        off_scale_opacity: 22
        off_scale_duration: 16
      face:
        off_scale_space: 17
        off_scale_radius: 0
        off_scale_line_height: 3
        absolute_line_height: 0
        off_scale_font_weight: 0
        off_scale_tracking: 12
        off_scale_opacity: 27
        off_scale_duration: 29


  layout_rules:
    grid:
      columns: 12
      base_unit_px: 8
      # Canonical membership. pixel_perfection.eight_px_rhythm aliases this
      # list; they drifted on 0 and 44 when they were two copies. Source:
      # MASTER/data/tokens.yml#tokens.scale.space_px.
      source: MASTER/data/tokens.yml#tokens.scale.space_px
      # The rule is "a hairline at or below 3px, or a multiple of 4", and it is
      # stated and tested at RAILS/test/scale_lint_test.rb:119 as
      # `reject { |px| px <= 3 || (px % 4).zero? }`. This enumeration is that
      # rule written out, and it drifted from it twice: on 0 and 44 when it was
      # two copies, and again by 2026-09-08, when it held thirteen values and
      # omitted 1, 2 and 3 as well as 28, 36, 56, 72, 80 and 128 — every one of
      # those a multiple of 4 the rule admits.
      #
      # The second drift cost six days of deploys. `--space-0-5: 0.125rem` (2px)
      # is used in ten places across five stylesheets, rhythm_lint reads this
      # list, and brgen's CI has been red on it since 2026-09-02 — so no brgen
      # deploy has landed since 2026-08-27. A number that disagrees with the
      # rule beside it stops a release rather than catching a defect.
      allowed_spacing_px: *eight_px_rhythm
      action: Prefer 8px rhythm and 12-column structure; allow 4px for hairline adjustments. Full scale in design_tokens.
    proportion:
      golden_ratio: 1.618
      split_main_ratio: 0.618
      split_sidebar_ratio: 0.382
      action: Use proportional splits for major panels instead of arbitrary widths.
    whitespace:
      internal_not_greater_than_external: true
      gap_over_margin: true
      paragraph_margin_em: 1.5
      section_padding_min_rem: 4
      section_padding_max_rem: 8
      action: Padding should not exceed separation between unrelated groups; use gap before margin hacks.
    reading_patterns:
      text_heavy: f_pattern
      landing_page: z_pattern
      primary_area: top_left
      terminal_area: bottom_right
      weak_area: bottom_left
      action: Place critical information along the dominant scan path.
    alignment:
      avoid_default_center_alignment: true
      center_text_max_lines: 3
      body_text_alignment: left
      rag: right
      action: Use asymmetry and alignment before decoration.
    touch:
      target_min_px: &touch_min_px 44
      target_recommended_px: &touch_recommended_px 48
      thumb_zone_primary_actions: bottom_center
      action: Flag critical mobile interactions in unreachable top corners.

  kinetic_depth:
    technique: point_cloud
    principle: >-
      Depth is implied by coherent motion, never by shaded surfaces. Flat 2D
      points that move together read as one solid volume; this is the kinetic
      depth effect and it is the house way of drawing dimension.
    depth_cues:
      - parallax_under_rotation
      - point_size_attenuation_with_distance
      - brightness_and_alpha_falloff
      - density
    forbidden:
      - lit_meshes
      - material_systems
      - per_surface_shading
    renderer: raw_webgl_points
    action: >-
      Draw dimension as a field of projected points. Reach for gl.POINTS and two
      short shaders before reaching for a 3D library, and never introduce a
      scene graph to solve a problem a point cloud already solves.
    exceptions: >-
      MASTER's face still uses THREE for its wireframe mesh. That is history
      rather than intent, and the migration path is already open --
      web/public/particle_kernel.js calls itself the Pixel Field kernel and says
      it exists to replace ad-hoc particle loops in face, codebase and ecology one
      at a time. It is 2D today: its cells carry x, y, vx, vy and no z, and it
      draws through getContext("2d"). Adding a depth axis and a gl.POINTS
      renderer is the work; rewriting a mesh by hand is not.
    already_correct: >-
      brgen's radio tunnel (app/javascript/radio_brgen_tunnel.js) is raw WebGL
      with a 2D fallback and no library at all. It is the reference
      implementation, not the exception.
    constraint_that_still_holds: >-
      Deferred WebGL boot is sacred (DECISIONS.md). A point cloud is cheaper than
      a mesh, which makes the primer check easier to honour, not optional.

  visual_design:
    semantics:
      reject_arbitrary_decoration: true
      action: Every ornament must communicate state, hierarchy, affordance, or tone.
    syntactics:
      enforce_visual_grammar: true
      action: Reuse spacing, color, radius, and type tokens consistently.
    pragmatics:
      must_be_understandable: true
      action: Prefer self-explanatory affordances over clever ambiguity.
    rams:
      useful: true
      understandable: true
      unobtrusive: true
      honest: true
      thorough: true
      action: Score design changes against Dieter Rams-style usefulness and honesty.
    font_personality:
      traditional_trustworthy: neo_grotesque_sans
      modern_innovative: geometric_sans
      accessible_interface: humanist_sans
      impact: bold_display
      action: Match typography mood to content rather than trend.
    screen_legibility:
      prefer_high_x_height: true
      prefer_open_apertures: true
      disambiguate_characters:
      - 1/l/I
      - 0/O
      - B/8
      action: Design for degraded conditions and small sizes first.

  motion_and_sound:
    timing:
      avoid_quantized_feel: true
      preserve_silence: true
      action: Treat pauses, decay, and negative space as first-class design elements.
    audio_accessibility:
      no_autoplay_without_intent: true
      mute_path_required: true
      must_not_mask_speech: true
      must_not_conflict_with_screen_readers: true
      graceful_failure_required: true
      action: Sound is feedback, not surprise; silence must always be available.
    sonic_hierarchy:
      foreground: critical_state_change
      midground: interaction_confirmation
      background: ambience_or_texture
      action: Layer sounds like UI depth; avoid frequency and attention masking.

  data_visualization:
    data_ink_ratio_target: 1.0
    lie_factor_target: 1.0
    reject_chartjunk: true
    small_multiples_require_identical_scales: true
    sparklines_no_frames_or_ticks: true
    action: Remove non-data ink unless it adds comprehension.

  automated_css_analysis:
    # Each flag should name an enforcer. Flags without enforce: are guidance only.
    checks:
    - id: off_scale_line_height
      enforce: [LINE_HEIGHT_ON_SCALE, Operator::ScaleLint]
    - id: absolute_line_height
      enforce: [LINE_HEIGHT_ON_SCALE, Operator::ScaleLint]
    - id: measure_bounds
      enforce: [geometry_type worn_type.profiles]
    - id: hanging_list_markers
      enforce: [geometry_type check_hanging]
    - id: micro_typography
      enforce: [Design::Thresholds.micro_typography]
    - id: touch_target
      enforce: [TOUCH_TARGET_MIN]
    - id: eight_px_rhythm
      enforce: [surface_rules spacing scan, Operator::ScaleLint]
    - id: chrome_i18n
      enforce: [Operator::ChromeI18nLint]
    flag:
    - line length outside typography.line_length bounds
    - line height below typography.line_height.body_min for prose
    - off-scale unitless line-height not in typography.line_height.allowed
    - absolute px line-height on prose (prefer unitless; ScaleLint absolute_line_height)
    - continuous prose without max-width measure (66ch / var(--measure))
    - all caps without letter spacing
    - body text below 16px
    - contrast below WCAG AAA thresholds (7:1 body, 4.5:1 large)
    - more than two font families
    - more than three font weights
    - spacing off the 4px or 8px grid
    - touch targets below 44px
    - centered prose longer than three lines
    - justified text without hyphenation
    - prose missing orphans/widows 3
    - hyphenation without hyphenate-limit-chars 6 3 2
    - prose missing default OpenType kern/liga/clig/onum/pnum
    - body numerals not oldstyle-nums
    - tables missing tabular/lining numerals
    - heading hierarchy ratios below 1.2
    - font weight differences below 200
    - decorative chart ink that does not encode data
    - decorative UI elements that do not encode state, hierarchy, affordance, or tone
    - non-token spacing, radius, color, or typography values in generated UI

  ux_laws:
    fitts:
      target_min_px: *touch_min_px
      target_recommended_px: *touch_recommended_px
      primary_action_min_px: *touch_recommended_px
      action: Flag interactive controls smaller than 44px; prefer 48px for primary actions.
    hick:
      max_visible_choices: 7
      nav_items_warn: 9
      action: Flag navigation or action groups with more than 7 peer choices without progressive disclosure.
    chunking:
      max_items_per_group: 7
      action: Group long lists; flag flat menus over 7±2 items.
    progressive_disclosure:
      require_advanced_hidden: true
      action: Advanced/secondary controls should start collapsed or on secondary surfaces.

  # The type thresholds that Design::Thresholds, DesignMetricsCheck, CssConstitutionCheck,
  # the rendered geometry checks and visual_contract_lint read as typography.*. Without
  # them every reader returned early on a zero threshold and reported "body>=0px". Each
  # value is one a reader's own fallback or Design::Typography.bringhurst already states.
  # Operator-owned under RENDERED_VALUES: correct a number here and every check follows.
  typography:
    accessibility:
      body_min_px: 16
      mobile_input_min_px: 16
      normal_text_contrast: 7.0
      large_text_contrast: 4.5
    line_length:
      min_ch: 45
      max_ch: 75
      ideal_ch: 66
    line_height:
      allowed: *line_height_scale
      body_preferred: 1.5
    hierarchy:
      max_font_families: 2
      max_font_weights: 3
      max_font_sizes: 8
      min_weight_delta: 200
      min_size_ratio_between_levels: 1.2
      h1_body_min_ratio: 1.75
      h1_body_max_ratio: 5.5
      h2_body_min_ratio: 1.5
      h2_body_max_ratio: 3.5
      h3_body_min_ratio: 1.25
      h3_body_max_ratio: 2.5
    letter_spacing:
      all_caps_min_em: 0.05
      all_caps_max_em: 0.15
      lowercase_body_should_letterspace: false
    micro:
      default_features: [kern]
      body_numerals: oldstyle-nums
      table_numerals: tabular-nums
      hyphenate_limit_chars: [6, 3, 2]
      orphans: 3
      widows: 3
      void_target: 0.7

  worn_type:
    type_scale_ratio: 1.25
    type_scale_tolerance_px: 1.5
    baseline_module_px: 4
    hanging_marker_max_inset_px: 0
    golden_split:
      min: 0.55
      max: 0.70
    profiles:
      feed:
        measure_min_ch: 35
        measure_max_ch: 55
        mobile_min_ch: 30
        mobile_max_ch: 50
        rhythm_off_max_pct: 25
        empty_min_pct: 20
        empty_max_pct: 75
        accents_max: 2
      catalog:
        measure_min_ch: 20
        measure_max_ch: 50
        rhythm_off_max_pct: 15
        empty_min_pct: 15
        empty_max_pct: 70
        accents_max: 2
        require_tabular_nums: true
      chat:
        measure_min_ch: 0
        measure_max_ch: 0
        rhythm_off_max_pct: 45
        empty_min_pct: 10
        empty_max_pct: 85
        accents_max: 2
      immersive:
        measure_min_ch: 0
        measure_max_ch: 0
        rhythm_off_max_pct: 40
        empty_min_pct: 8
        empty_max_pct: 90
        accents_max: 2
      map:
        measure_min_ch: 0
        measure_max_ch: 0
        label_min_px: 12
        rhythm_off_max_pct: 40
        empty_min_pct: 0
        empty_max_pct: 100
        accents_max: 2
      legal:
        measure_min_ch: 55
        measure_max_ch: 75
        rhythm_off_max_pct: 20
        empty_min_pct: 25
        empty_max_pct: 70
        accents_max: 1
      auth:
        measure_min_ch: 0
        measure_max_ch: 0
        rhythm_off_max_pct: 30
        empty_min_pct: 20
        empty_max_pct: 80
        accents_max: 2
    rag:
      inspect_from_lines: 5
      extreme_last_line_ratio: 0.12
    action: >
      Judge each surface under its profile. Count worn characters, computed
      sizes, baselines, tabular figures, accent hues, empty ratio, and
      main/aside split. Do not grep stylesheets for these.

  pixel_perfection:
    forbidden_css:
    - box-shadow
    - text-shadow
    - 'filter: blur'
    - backdrop-filter
    - glassmorphism
    - soft glow
    # The last two are the WebGL spellings of "soft glow". They belong in this
    # key because it is read into the design prompt, so the model is told the ban
    # rather than only scanned for it; FACE_POINT_IS_ONE_PIXEL and
    # NO_WEBGL_GLOW_PASS in law/javascript.rb are what enforce them.
    - additive second pass behind a point cloud
    - gl_PointSize above 1.0
    forbidden_patterns:
    - 'box-shadow\s*:'
    - 'text-shadow\s*:'
    - filter\s*:\s*[^;]*blur\s*\(
    - 'backdrop-filter\s*:'
    forbid_arbitrary_radius_px_above: 16
    # Same list as layout_rules.grid.allowed_spacing_px — one axis, one
    # spelling. 44 is tap_min; the name says eight, but 4, 12, 20 and 44
    # are on the 4px grid too.
    eight_px_rhythm: *eight_px_rhythm
    magic_color_hex_ban_inline: true
    image_smoothing_enabled: false
    exception_policy:
      allowed: true
      scope: single named component, not a blanket relaxation
      must_document_at_point_of_use: true
      must_state_reason: true
      action: A forbidden pattern may be used for one specific, named element when flatness
        would remove its only legible depth or affordance cue -- document the reason in
        a comment where the exception lives, the same way a one-off structural exception
        gets documented, rather than relaxing the rule generally or leaving it unexplained.
    action: 'Pixel-perfect flat UI: no blur/glow/shadow ornament; spacing on 8px rhythm; tokens over magic
      colors. Exceptions follow exception_policy -- scoped and documented, not silent.'

  rams_checklist:
    useful: Does this control or surface serve a concrete user goal?
    understandable: Is hierarchy and affordance obvious without decoration?
    unobtrusive: Does chrome recede so content leads?
    honest: Does UI state match system state without fake progress?
    thorough: Are empty, loading, error, and reduced-motion states designed?
    action: Score UI diffs against Rams criteria in council and aesthetic scan tags.

  ui_polish:
    default_locale: nb
    available_locales: [nb, en]
    chrome_i18n:
      action: >
        Shell and empty/search chrome must use I18n t() keys (empty.*, search.*,
        nav.*, auth.*). Hardcoded English "No …" titles and "Search …" placeholders
        are debt. Ratchet: MASTER/tools/chrome_i18n_lint.rb (CI).
        Opt-out: <%# chrome_i18n: ok %> above the line.
      empty_partial: shared/empty_state
      empty_requires_action: true
      empty_cta_lint: MASTER/tools/empty_state_lint.rb
      adhoc_empty_lint: MASTER/tools/adhoc_empty_lint.rb
    space_not_lines:
      action: >
        List/grid cards separate with gap + surface elevation, not hairline
        box borders. Forms and CRT dialect (bsdports) may keep 1px borders.
        Prefer border: 0; background: var(--surface-elevated).
    type_tokens:
      action: >
        Page titles use var(--text-title, 1.25rem) and var(--font). Do not hardcode
        font-size: 20px for headers. Dialect fonts (Caprasimo luxury, JetBrains
        mono CRT) only on named brand surfaces.
      tokens:
        text_title: 1.25rem
        text_display: 1.75rem
        page_header_min_height: 48px
    flat_ui:
      action: >
        No ornamental box-shadow/text-shadow/backdrop-filter/filter blur.
        Floating chrome uses 1px border + elevated surface. CHECK_AUTOFIX strips
        shadows. Exception policy under pixel_perfection.exception_policy.
    btn_aliases:
      action: >
        Family supports both btn-primary and btn--primary (and btn-ghost /
        btn--ghost). Empty-state CTAs should emit both class names.
    playbook_order:
      - strip_flat_ui_shadows
      - wire_empty_search_to_t
      - align_page_header_type_tokens
      - space_not_lines_list_cards
      - verify_empty_state_cta_lint
      - verify_chrome_i18n_lint
    action: >
      When polishing RAILS or MASTER/web UI, run this playbook. Prefer mechanical
      autofix + CI ratchets over one-off manual style. Never raise lint baselines
      to silence new debt.

  pwa:
    philosophy:
      performance_is_the_design: true
      offline_is_a_designed_state: true
      radical_lightness: true
      action: Treat speed, the offline state, and data cost as design surfaces, not
        engineering afterthoughts. The apps already ship a manifest, a service worker
        and offline controllers; the budget is what is missing.
    weight:
      ceiling_lives_in: MASTER/checks/data/, in the css_budget.yml ratchet shape —
        a number measured from a real run that only ever ratchets down.
      baseline_source: generated application.css is deliberately untracked and rebuilt
        from the checked-in SCSS before asset checks or deployment. JS builds are also
        ignored, so budgets are measured only after an explicit source-to-build pass.
      action: Set a ceiling from a run of this tree, never from another product's
        published figure — Pinterest's 150KB and Tinder's 20KB CSS describe their
        trees, not this one, and a ceiling nothing measured is a wish. A budget
        nothing enforces is a comment.
    offline_first:
      queue_writes_for_background_sync: true
      cache_read_paths: true
      design_the_disconnected_screen: true
      action: The network-loss state earns the same care as the happy path. Starbucks
        fills a cart offline and sends it on reconnect; Trivago answers a dropped
        connection with a branded playable maze rather than an error.
    user_agency_over_data:
      honour_save_data_header: true
      placeholder_before_full_asset: true
      state_the_cost_before_the_download: true
      action: Let the reader decide when to spend data, and say what it costs first.
        Twitter Lite renders 1KB blurred thumbnails and fetches the full asset on tap.
    native_grade_motion:
      target_fps: 60
      virtualize_long_feeds: true
      optimistic_render_from_cache: true
      action: Render only the visible slice of a feed, and paint a detail view from
        cached data before the fetch returns, so navigation never shows a spinner.

  ultraminimalism:
    philosophy:
      typography_is_design: true
      absence_is_material: true
      remove_until_nothing_left_to_remove: true
      less_but_better: true
      action: Prefer absence, typography, alignment, and whitespace over ornamental UI.
    authoritative_design:
      priority: 1
      role: meta_doctrine
      purpose: Make every visual decision feel deliberate, credible, legible, and specific to its product and task.
      order:
      - purpose
      - agency
      - clarity
      - hierarchy
      - trust
      - consistency
      - craft
      - delight
      style_never_overrides:
      - user_agency
      - readable_information
      - recognizable_platform_patterns
      - accessibility
      - truthful_content
      - responsive_continuity
      require:
      - one_primary_focal_point
      - explicit_action_hierarchy
      - stable_alignment_system
      - typographic_intent
      - content_before_chrome
      - coherent_spacing_rhythm
      - rendered_evidence
      - reversible_refinement
      reject:
      - decoration_without_a_job
      - generic_ai_aesthetic
      - competing_focal_points
      - arbitrary_type_pairings
      - novelty_that_hides_status_or_action
      - style_borrowed_without_context
      action: Establish authority through purpose, hierarchy, consistency, precision, and craft before selecting an aesthetic school.

      sources:
      - "https://designsystem.digital.gov/design-principles/"
      - "https://www.w3.org/WAI/WCAG2/supplemental/patterns/o1p02-familiar-design/"
      - "https://www.w3.org/WAI/WCAG2/supplemental/patterns/o1p03-consistent-design/"
      - "https://design-system.w3.org/styles/typography.html"
      - "https://techlab.bol.com/en/blog/shaping-the-future-of-bol-our-design-system-helps-speed-up-innovation/"
      - "https://over.bol.com/en/news/why-do-i-see-these-specific-products-when-i-search-on-bol/"
      - "https://www.kaufland.de/"
      - "https://pangrampangram.com/blogs/journal/pairing-fonts"
    design_schools:
      swiss:
        inherits_authoritative_design: true
        layout: modular_grid_asymmetric
        typography: grotesk_flush_left_ragged_right
        imagery: objective_photography
        color: restrained_one_accent
        shape: geometric
        motion: quiet
        signatures:
        - mathematical_grid
        - asymmetric_balance
        - type_as_structure
        - active_whitespace
        avoid:
        - centered_hero_as_default
        - ornamental_effects
        - arbitrary_font_pairing
      social:
        inherits_authoritative_design: true
        layout: identity_content_action_stream
        typography: humanist_or_neutral_sans
        imagery: people_identity_and_media
        color: restrained_identity_accents
        shape: conversational_containers
        motion: responsive_micro_feedback
        signatures:
        - avatar_or_identity_anchor
        - content_first_post
        - compact_action_row
        - reaction_and_reply_affordance
        - time_or_freshness_signal
        avoid:
        - campaign_like_banner_everywhere
        - hidden_identity
        - actionless_decoration
      cute:
        inherits_authoritative_design: true
        layout: friendly_modular_play_space
        typography: rounded_display_plus_sturdy_text
        imagery: characters_objects_and_play
        color: cheerful_bounded_palette
        shape: soft_geometric_forms
        motion: playful_but_optional
        signatures:
        - friendly_expression
        - tactile_shape_language
        - surprising_scale
        - clear_emotional_cue
        - joyful_microcopy
        avoid:
        - unreadable_display_type
        - unlimited_colors
        - mascot_competition
        - motion_without_reduced_motion_path
      editorial:
        inherits_authoritative_design: true
        layout: publication_grid
        typography: high_contrast_reading_hierarchy
        imagery: content_led
        color: restrained
        shape: quiet
        motion: subtle
        signatures:
        - strong_headline
        - readable_measure
        - deliberate_captioning
        - image_text_relationship
        avoid:
        - novelty_for_its_own_sake
        - decorative_type_in_body_copy
      commerce_editorial:
        inherits_authoritative_design: true
        references:
        - kaufland
        - bol
        reference_mission: "Kaufland catalogue breadth and campaign entry points; bol cleanliness, service clarity, recommendation rails, product-first imagery, and restrained product chrome."
        sources:
        - "https://www.kaufland.de/"
        - "https://retailmedia.bol.com/en/onsite-display/"
        - "https://techlab.bol.com/en/blog/shaping-the-future-of-bol-our-design-system-helps-speed-up-innovation/"
        layout: product_image_plus_typographic_offer
        typography: display_contrast_plus_neutral_utility
        imagery: product_first
        color: quiet_base_plus_campaign_accent
        shape: restrained_storefront_geometry
        motion: functional
        signatures:
        - immediate_price
        - product_as_hero
        - display_headline
        - compact_proof
        - direct_action
        avoid:
        - fake_urgency
        - fake_reviews
        - embedded_image_text
      industrial:
        inherits_authoritative_design: true
        layout: explicit_system_grid
        typography: mono_or_technical_sans
        imagery: diagrams_and_state
        color: high_contrast_restrained
        shape: flat
        motion: quiet_state_change
        signatures:
        - status_visibility
        - stable_columns
        - numerical_precision
        - obvious_failure_state
        avoid:
        - ornamental_depth
        - ambiguous_controls
      luxury:
        inherits_authoritative_design: true
        layout: spacious_editorial_product
        typography: restrained_high_contrast
        imagery: material_and_detail
        color: low_chroma
        shape: quiet
        motion: subtle
        signatures:
        - generous_measure
        - deliberate_materiality
        - sparse_chrome
        avoid:
        - discount_carnival
        - excessive_badges

    typeface_rules:
      role_specific: true
      prefer_one_family_first: true
      max_families_per_surface: 2
      max_display_faces: 1
      require_role_definition: true
      require_deployable_assets: true
      avoid_same_voice_pairing: true
      inspect:
      - classification
      - x_height
      - width
      - contrast
      - weight_range
      - optical_sizing
      - glyph_coverage
      - licence
      action: Pair by function and measured characteristics, then verify in the rendered surface; never pair by popularity alone.

    typefaces:
      house_sans:
        family: house_sans
        css: "var(--font)"
        classification: neo_grotesk
        x_height: high
        width: normal
        contrast: low
        weight_range: [400, 800]
        optical_sizing: inherited
        glyph_coverage: site_default
        roles:
        - body
        - ui
        - price
        - metadata
        - swiss_display
        availability: shipped
      ibm_plex_sans:
        family: IBM Plex Sans
        css: '"IBM Plex Sans", sans-serif'
        classification: grotesk
        x_height: high
        width: normal
        contrast: low
        weight_range: [100, 700]
        optical_sizing: variable

        roles:
        - body
        - ui
        - technical_display
        availability: optional_webfont
      source_sans_3:
        family: Source Sans 3
        css: '"Source Sans 3", sans-serif'
        classification: humanist_sans
        x_height: high
        width: normal
        contrast: low
        weight_range: [200, 900]
        optical_sizing: variable

        roles:
        - body
        - ui
        availability: optional_webfont
      mona_sans:
        family: Mona Sans
        css: '"Mona Sans", sans-serif'
        classification: industrial_grotesk_variable
        x_height: high
        width: variable
        contrast: low
        weight_range: [100, 900]
        optical_sizing: variable
        roles:
        - body
        - display
        - ui
        availability: optional_webfont
      hubot_sans:
        family: Hubot Sans
        css: '"Hubot Sans", sans-serif'
        classification: geometric_variable
        x_height: high
        width: variable
        contrast: low
        weight_range: [100, 900]
        optical_sizing: variable
        roles:
        - display
        - playful_accent
        availability: optional_webfont
      pp_neue_montreal:
        family: PP Neue Montreal
        css: '"PP Neue Montreal", var(--font)'
        classification: contemporary_neo_grotesk
        x_height: high
        width: variable
        contrast: low
        weight_range: [100, 900]
        optical_sizing: variable
        roles:
        - display
        - body
        - ui
        availability: licensed_external
        licence: "Pangram Pangram Foundry commercial licence required"

      jetbrains_mono:
        family: JetBrains Mono
        css: 'var(--font-mono)'
        classification: monospace
        roles:
        - terminal
        - code
        - technical
        availability: shipped

    font_pairings:
      swiss_house:
        school: swiss
        strategy: single_family_contrast
        display: house_sans
        body: house_sans
        price: house_sans
        metadata: house_sans
        rationale: Use scale, weight, width, alignment, and whitespace for contrast before adding a second family.
      marketplace_sale:
        school: commerce_editorial
        reference: pangram
        typographic_intent: contemporary_grotesk_neutral_with_character
        strategy: single_family_contrast
        display: house_sans
        body: house_sans
        price: house_sans
        metadata: house_sans
        rationale: Marketplace authority comes from product, price, hierarchy, alignment and trust; borrow the character of contemporary grotesk branding without importing a decorative display face.
      playful_mona_hubot:
        school: cute
        strategy: related_variable_family_pair
        display: hubot_sans
        body: mona_sans
        price: mona_sans
        metadata: mona_sans
        rationale: Related variable sans families create play through shape and scale without sacrificing utility.
      terminal_mono:
        school: industrial
        strategy: single_family
        display: jetbrains_mono
        body: jetbrains_mono
        price: jetbrains_mono
        metadata: jetbrains_mono

    compositions:
      marketplace_sale:
        school: commerce_editorial
        pairing: marketplace_sale
        grid: storefront_columns
        focal_order:
        - product
        - price
        - headline
        - proof
        - action
        mobile: stack_image_then_offer_without_changing_priority
        signatures:
        - product_identity_preserved
        - price_visible_without_interaction
        - display_headline
        - neutral_transaction_text
        variants:
          kaufland_catalogue:
            reference: kaufland
            structure: campaign_plus_category_panel
            grid: wide_promo_and_catalogue_navigation
            focal_order: [campaign, categories, products]
            signature: broad_discovery
          bol_clean:
            reference: bol
            structure: full_width_promo_then_category_and_product_rail
            grid: single_clean_storefront_column
            focal_order: [search, campaign, product, service_proof]
            signature: clean_product_first
          brgen_hybrid:
            references: [kaufland, bol]
            structure: asymmetric_campaign_plus_local_discovery
            grid: seven_five_split
            focal_order: [local_context, product, price, categories, action]
            signature: local_marketplace_identity
      swiss_poster:
        school: swiss
        pairing: swiss_house
        grid: twelve_column_modular
        focal_order:
        - primary_message
        - image_or_number
        - supporting_information
        mobile: collapse_columns_but_preserve_anchor_relationships
      social_feed:
        school: social
        pairing: swiss_house
        grid: feed_stream
        focal_order:
        - identity
        - content
        - action
        - freshness
        mobile: one_content_column
      cute_retail:
        school: cute
        pairing: playful_mona_hubot
        grid: friendly_modular
        focal_order:
        - product_or_character
        - playful_headline
        - benefit
        - action
        mobile: preserve_character_and_action_anchor
      editorial_commerce:
        school: commerce_editorial
        pairing: marketplace_sale
        grid: asymmetric_product_editorial
        focal_order:
        - image
        - display_headline
        - offer
        - proof
        mobile: image_then_copy
      industrial_system:
        school: industrial
        pairing: terminal_mono
        grid: explicit_system_columns
        focal_order:
        - state
        - primary_value
        - action
        - detail
        mobile: collapse_secondary_columns
    swiss_style:
      left_aligned_ragged_right: true
      sans_serif_default: Helvetica Neue Pro
      alternative_faces:
      - Helvetica Neue
      - Arial
      visible_grid_optional: false
      font_feature_settings:
        Inter: '"ss03" 1'
      action: Use an invisible mathematical grid with type-led hierarchy.
    negative_space:
      primary_design_material: true
      chunk_forms_by_proximity: true
      avoid_tunnel_vision_distance: true
      card_padding_px: 24
      section_gap_px: 48
      hero_breathing_room_px: 96
      content_width: min(66ch, 100% - 3rem)  # aligned with typography.line_length.ideal_ch / --measure
      action: Space communicates grouping; whitespace must clarify relationships.
    color:
      max_palette_roles: 4
      roles:
      - primary
      - secondary
      - accent
      - highlight
      prefer_monochrome_with_one_accent: true
      action: Reject color variety when value, spacing, and type can do the work.
    interaction:
      minimal_js_default: Stimulus
      no_build_options:
      - Stimulus
      - PetiteVue
      - Alpine
      - VanJS
      - HTMX
      progressive_enhancement_required: true
      data_attributes_bridge_behavior: true
      action: Keep behavior small, recoverable, and legible in HTML.
    design_tokens:
      required_for_generation: true
      exact_token_use: true
      token_categories:
      - color
      - spacing
      - radius
      - typography
      - motion
      action: Inject tokens before generation; flag new ad-hoc values.
    prompting:
      constitutional_rules: true
      positive_constraints_over_negative: true
      self_refine_loop: true
      designer_personas:
      - Dieter Rams
      - Massimo Vignelli
      - Josef Mueller-Brockmann
      require_design_rationale_before_code: true
      action: Force design decisions before code; iterate by critique then revision.
    automated_iteration:
      screenshot_first: true
      ferrum_capture: true
      visual_regression: BackstopJS
      max_iterations: 5
      target_score: 95
      action: Capture, compare, critique, patch, and repeat until differences are intentional.
    mcp:
      enabled_targets:
      - filesystem
      - puppeteer
      - git
      - figma
      - accessibility
      primitives:
      - tools
      - resources
      - prompts
      action: Prefer standard tool bridges over bespoke glue when integrating design automation.
