---
# Design tokens: the one source for colour, type, spacing, viewport, dialects and the face
# interface. RAILS/__shared/design_tokens.yml, the face CSS :root and the SCSS views are
# generated from this file (MASTER/tools/design_tokens.rb). Read it through Master.tokens;
# values here are operator-owned (laws.yml RENDERED_VALUES).
tokens:
  # Canonical material design values. This block is the only machine-readable
  # design-token authority; RAILS/__shared/design_tokens.yml is a generated view.
  # Canonical design token anchors — keep in sync with _dialect_tokens.scss defaults and face.css :root.
  # Regenerate face :root: ruby MASTER/tools/rails/generate_face_root_css.rb
  #
  # Dialect → consumer map (do not merge casually):
  #   social       → brgen + shared shell (IRIX flat dark/light)
  #   light        → light-mode overlay for social apps (theme toggle)
  #   luxury       → amber wardrobe (Aesop/Toteme warm neutrals)
  #   openbsd_wscons → bsdports terminal green (opt-in via body class)
  #   face_root    → MASTER web face.css :root only (CRT-flat, all radii 0)
  # Intent: social = soft radii; face/bsdports = CRT-flat zeros; luxury = calm product.
  # Light social = indigo on cool paper (not Twitter
  # The viewport scale. Every other axis in this system is single-sourced; this one
  # was not, so responsive breakpoints were written by hand and drifted: 13 distinct
  # widths across 58 media queries in the three apps plus the engine.
  #
  # NOT a CSS custom property, and cannot be one: `@media (min-width: var(--x))` is
  # invalid CSS, so a media query has to carry a literal. That is why this section is
  # a declared set rather than a generated variable — the numbers stay in the
  # stylesheets and Operator::BreakpointLint asserts they are these numbers.
  #
  # Every edge below is `min-width`. A max-width bound is the edge MINUS 1px, never
  # the edge itself: `(max-width: 768px)` and `(min-width: 768px)` both match at
  # exactly 768px, so both blocks apply and the later one silently wins.
  #
  # Each edge is here because something already uses it, with the count as of
  # 2026-08-11. New work picks one of these; a new edge is a design decision that
  # goes in this list first.
  visual_identity:
    name: "signal_and_stillness"
    # The primary material under the identity: greyscale particle stipple. The meaning of
    # each face state in that material is face_interface.stipple.semantics.
    material: "greyscale_particle_stipple"
    principle: >
      Reality is assembled from many small carriers. The interface does not pretend to be a
      solid skin; it shows the field. Density is belonging, luminosity is attention, ripple is
      signal, negative space is as real as matter. Colour is a sparse semantic accent, never
      the substance.
    lineage:
      - "e pluribus unum — out of many, one readable form"
      - "signal as propagating state, not ornament"
      - "turned and unturned density as membership in the field"
      - "residual — individuality survives inside the collective"
      - "stillness by default — motion only when meaning moves"
    signal: "#C8F55F"
    signal_ink: "#101010"
    signal_on_light: "#50630A"
    display_size: "clamp(40px, 6vw, 88px)"
    contrast:
      signal_on_ink_min: 7.0
      signal_on_white_min: 4.5
      signal_on_paper_min: 4.5
    max_highlight_area_fraction: 0.08
    usage:
      - "primary action or selected marker where the local dialect permits"
      - "focus and attention on dark surfaces"
      - "meaningful state transition, never perpetual decoration"
    avoid:
      - "large full-page signal-colour backgrounds"
      - "signal colour as body text on white"
      - "glow, lens flare, ornamental gradients or shadows"
      - "copied wordmarks, campaign art, characters or protected brand expression"
    composition:
      hierarchy: "one unmistakable focal point per first screen"
      negative_space: "intentional and measured, never filled by decoration"
      surfaces: "flat and structured by alignment, type and rules"
      typography: "expressive display scale paired with readable body text"
    motion:
      default: "still"
      change_requires_semantic_state: true
      reduced_motion_must_preserve_meaning: true
    art_direction:
      subject_count: 1
      background: "flat paper or ink"
      typography_layer: "separate and editable; never bake critical copy into generated photography"
      signal_usage: "original graphic overlays only; never colour-grade photographic subjects with the signal"
      preserve_media_colour: true
      preserve_likeness: true
      grade_is_explicit: true
      avoid: ["copied campaign art", "copied wordmarks", "false product colours", "decorative lens flare"]
    typography_roles:
      display: "text-display"
      body: "text-base"
      technical: "font-mono"
      wordmark: "original pub4 artwork only"
    adaptations:
      master: >-
        brgen's dark family: #000 ground, #111 surfaces, #efefef ink and one Helvetica
        sans for chrome under brgen's deep-blue band; mono only in the chat; the
        particle face stays greyscale and the sole expressive centerpiece
      brgen: "retain deep-blue city identity and local editorial photography; signal is a sparse semantic accent only"
      amber: "retain neutral fashion surfaces and truthful garment colour; signal never recolours product photography"
      bsdports: "retain OpenBSD terminal green and flat monochrome surfaces"
      openbsd: "plain operational text; signal never substitutes for a truthful written state"
      studio: "retain media fidelity, operator-owned grades and original subject identity"
  viewport:
    xs: 480
    sm: 576
    md: 640
    lg: 768
    desktop: 1024
    wide: 1265
    xl: 1280
  # Shared motion + elevation (borders, never box-shadow) — export via CSS vars in apps.
  # Layout chrome is the family contract across MASTER face + RAILS apps (dialects may
  # restyle surfaces; they must not invent a second z-scale, tap floor, or skip-link).
  shared_chrome:
    space_2xs: "0.25rem"
    space_xs: "0.5rem"
    space_sm: "0.75rem"
    space_md: "1.5rem"
    space_lg: "2rem"
    space_xl: "3rem"
    space_2xl: "4rem"
    color_success: "#00ba7c"
    color_warning: "#c9a227"
    color_info: "#5b9fd4"
    color_danger: "#d1594a"
    focus_ring: "2px solid var(--accent, currentColor)"
    elev_1: "1px solid var(--border)"
    transition_fast: "180ms"
    transition_normal: "300ms"
    ease_out: "cubic-bezier(0.16,1,0.3,1)"
    ease_spring: "cubic-bezier(0.32,0.72,0,1)"
    font_size_meta: "0.8125rem"
    font_size_body: "1rem"
    font_size_title: "1.25rem"
    font_size_display: "1.75rem"
    measure_body: "66ch"
    font: '"Helvetica Neue Pro", "Helvetica Neue", Arial, sans-serif'
    font_code: '"JetBrainsMono Nerd Font", "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace'
    chrome_inset: "12px"
    tap_min: "44px"
    bar_height: "44px"
    page_gutter: "clamp(16px, 5vw, 48px)"
    feed_max: "600px"
  # The one geometry. Measured from joi.com on 2026-08-31 at 1440x900 with images
  # and media blocked, then moulded to this repo's law. Structure lives here and
  # is shared by every app; colour stays in the dialect blocks below, which is why
  # merging the three dialects did not mean deleting them.
  #
  # Kept, because each beats what stood here:
  #   opacity ladder  a tokenised alpha scale composed into colour, instead of
  #                   hand-typed rgba() literals. The tree had no equivalent axis.
  #   two radii       cards at one step, controls fully round. 104 measured
  #                   elements carried the card radius and 48 the pill; nothing
  #                   else but avatars. This family ran four card radii.
  #   control block   44px tall, 8px internal gap, pill, hairline border. 44 is
  #                   already tap_min here, so the measurement met the law.
  #   tile grid       equal tracks, wide row gap, narrow column gap — what makes
  #                   a dense catalogue scan as rows rather than as a mosaic.
  #
  # Rejected, with the reason, because a measurement is not a mandate:
  #   10px root       its whole rem ladder hangs off html font-size 10px. brgen
  #                   sets 18px (see chrome_inset above); rescaling moves every
  #                   rem in three apps.
  #   shadow depth    its elevation is glow and drop shadow throughout.
  #                   css_constitution FLAT_PATTERN forbids all of it and this
  #                   family elevates with borders.
  #   2px / 6px gaps  its base grid. Ours is 8px with a 4px hairline.
  #   absolute leading it leads in px. design_rules line_height forbid_absolute_px
  #                   is true, and px leading does not inherit through an 18px root.
  #   weight 500      its body weight, 100 from normal against a min_weight_delta
  #                   of 200 — a step you cannot see.
  #   the palette     hot rose on near-black, for a product that is not this one.
  system:
    tile_min: "224px"
    tile_gap_row: "24px"
    tile_gap_col: "8px"
    control_pad_inline: "16px"
    control_gap: "8px"
    radius_card: "16px"
  storefront_art:
    name: "matte_product_promotion"
    family: "marketplace_takeaway"
    purpose: "Generate clean promotional product artwork while Rails owns all readable copy and offer data."
    composition:
      aspect: "14:5"
      text_zone: "left 48%"
      product_zone: "right 44%"
      safe_gap: "24px"
      product_max_height: "82%"
      product_max_width: "42%"
    typography:
      headline_lines: 2
      headline_role: "dominant"
      support_lines: 2
      offer_role: "secondary"
      cta_role: "tertiary"
      embedded_text: false
    surface:
      material: "matte paper"
      texture: "barely perceptible"
      lighting: "soft diffuse studio light"
      contrast: "calm"
    imagery:
      product_count: "one hero product or one coherent small group"
      product_cutout: true
      perspective: "natural"
      background_scene: false
      generic_stock_scene: false
    palette:
      marketplace: ["warm white", "stone", "charcoal", "single campaign accent"]
      takeaway: ["warm white", "cream", "charcoal", "single cuisine accent"]
    forbidden:
      - "glow"
      - "drop_shadow"
      - "busy_background"
      - "embedded_typography"
      - "fake_price"
      - "fake_rating"
      - "decorative_lifestyle_scene"
    prompt_template: "Clean matte promotional artwork for {vertical}: {subject}; isolated product, natural proportions, soft diffuse studio light, quiet paper-like background, generous negative space on the left for real typography, no readable text, no logos, no badges, no price, no interface elements."
  radio:
    name: "radio"
    inspirations:
      - "soundcloud"
      - "whyp"
    home: "discovery_first"
    player: "waveform_first"
    sharing: "single_track_permalink"
    privacy: "private_and_unlisted_first"
    chrome: "dark_audio"
  # amber's wardrobe dialect: the family greyscale, so the garment photographed
  # on it is the only colour on the page. Use in amber + shared product views.
  luxury:
    light_bg: "#efefef"
    light_surface: "#ffffff"
    light_text: "#333333"
    light_muted: "#4d4d4d"
    light_border: "#888888"
    light_accent: "#000000"
    light_danger: "#82372d"
    dark_bg: "#000000"
    dark_surface: "#111111"
    dark_text: "#efefef"
    dark_muted: "#999999"
    dark_border: "#666666"
    dark_accent: "#efefef"
    space_2xs: "0.25rem"
    space_xs: "0.5rem"
    space_sm: "0.75rem"
    space_md: "1.5rem"
    space_lg: "2rem"
    space_xl: "3rem"
    space_2xl: "4rem"
    color_success: "#00ba7c"
    color_warning: "#c9a227"
    color_info: "#5b9fd4"
    radius_sm: "6px"
    radius_md: "10px"
    radius_lg: "14px"
    font_size_display: "clamp(1.953rem, 1.5rem + 2vw, 2.441rem)"
    font_size_title: "1.563rem"
    font_size_body: "1rem"
    font_size_meta: "0.875rem"
    letter_spacing_tight: "-0.01em"
    line_height_tight: "1.25"
    line_height_relaxed: "1.6"

  # Storefront promotional-art system for Marketplace and Takeaway. The image is
  # generated without typography; Rails places real copy over it. This keeps
  # product art reusable across campaigns and keeps prices/headlines exact.
  promotional_art:
    layouts:
      hero:
        aspect_ratio: "16:9"
        copy_zone: "42%"
        product_zone: "58%"
        safe_inset: "32px"
      campaign:
        aspect_ratio: "3:2"
        copy_zone: "40%"
        product_zone: "60%"
        safe_inset: "28px"
      tile:
        aspect_ratio: "1:1"
        copy_zone: "100%"
        product_zone: "100%"
        safe_inset: "20px"
      portrait:
        aspect_ratio: "4:5"
        copy_zone: "44%"
        product_zone: "56%"
        safe_inset: "24px"
    matte_backgrounds:
      chalk: "#f7f5ef"
      paper: "#efede8"
      stone: "#e2ded5"
      sand: "#e9decb"
      charcoal: "#292725"
    matte_inks:
      chalk: "#292725"
      paper: "#292725"
      stone: "#292725"
      sand: "#292725"
      charcoal: "#f7f5ef"
    product:
      max_items: 4
      primary_share: "0.58"
      secondary_share: "0.30"
      edge_clearance: "8%"
      object_fit: "contain"
      lighting: "large soft studio source, neutral white balance"
      shadow: "soft natural contact shadow only"
    typography:
      eyebrow:
        size: "0.8125rem"
        weight: 600
        leading: "1.25"
      headline:
        size: "clamp(2rem, 5vw, 4rem)"
        weight: 400
        leading: "1"
        max_lines: 2
      body:
        size: "1rem"
        weight: 400
        leading: "1.5"
        max_lines: 3
      price:
        size: "clamp(2rem, 4vw, 3rem)"
        weight: 800
        leading: "1"
      cta:
        max_words: 4
    copy:
      max_headline_characters: 54
      max_body_characters: 120
      max_badge_words: 4
      max_cta_words: 4
    generation:
      image_only: true
      preserve_product_identity: true
      background: "clean matte studio paper, nearly uniform tone"
      composition: "product separated from copy zone with generous negative space"
      typography_in_image: false
      fake_logo_in_image: false
      fake_badge_in_image: false
      watermark_in_image: false
      gradients: false
      glow: false
      decorative_props: false
      busy_background: false
      hard_crop: false
      product_reflection: false
      prompt_negative:
        - "text"
        - "typography"
        - "headline"
        - "price text"
        - "sale badge"
        - "watermark"
        - "busy background"
        - "decorative props"
        - "dramatic glow"
        - "lens flare"
        - "hard crop"
        - "cut-off product"

  face_root:
    # The face is brgen's family (operator, 2026-10-27). face.css embeds the
    # social :root first (DesignTokens.family_tokens_block), so a value written
    # var(--text) here is brgen's #efefef, not a copy of it. What stays the
    # face's own: the grey signal, because face_sparse_field.js tints particles
    # from --c-accent and the head stays greyscale; flat radii; and the code tint.
    palette:
      signal: "#D4D4D4"
      signal_ink: "#080808"
      signal_on_light: "#3A3A3A"
      c_text: "var(--text)"
      x_text: "var(--text)"
      c_accent: "var(--pub4-signal)"
      c_danger: "var(--danger)"
      c_code: "oklch(81% 0 0)"
    anchors:
      c_text: "oklch(93% 0.025 250)"
      x_text: "#e7eeff"
      c_accent: "var(--pub4-signal)"
      c_danger: "oklch(60% 0.14 35)"
      c_code: "oklch(81% 0.10 268)"
    font_mono: '"JetBrainsMono Nerd Font", "JetBrains Mono", "Cascadia Code", "Fira Code", ui-monospace, monospace'
    font_label: '"JetBrainsMono Nerd Font", "JetBrains Mono", "Cascadia Code", "Fira Code", ui-monospace, monospace'
    # A literal, not var(--bg): the views print it into <meta name="theme-color">.
    # It equals social.bg, and design_tokens_test asserts that.
    face_bg: "#000000"
    derived:
      face_fg: "var(--x-text)"
      face_muted: "var(--text-secondary)"
      face_dim: "rgb(176 176 176 / 18%)"
      face_soft: "rgb(176 176 176 / 7%)"
      face_alert: "color-mix(in oklch, var(--c-danger) 75%, white)"
      mood_accent: "var(--c-accent)"
      canvas_mood_accent: "var(--c-accent)"
      border_faint: "rgb(164 164 164 / 16%)"
      border_soft: "rgb(164 164 164 / 23%)"
      border_strong: "rgb(175 175 175 / 34%)"
      hover_tint: "color-mix(in srgb, var(--face-fg) 8%, transparent)"
      chrome_bg: "var(--surface)"
      chrome_surface: "var(--surface)"
      chrome_surface_active: "#222222"
      chrome_border: "var(--border)"
      chrome_hover: "var(--hover)"
      chrome_text: "var(--text)"
      chrome_muted: "var(--text-secondary)"
      chrome_focus: "var(--accent)"
      # brgen's header band (--brgen-header-bg/-ink/-muted in
      # RAILS/brgen/app/assets/stylesheets/application.scss), which master's
      # titlebar carries. brgen declares them app-locally rather than in a
      # dialect, so they are restated here; face_boot.test.mjs fails if the two
      # disagree. ink on band 10.59:1, muted on band 7.25:1.
      chrome_band: "#143d5b"
      chrome_band_ink: "#f5f7fa"
      chrome_band_muted: "#c4d0dc"
    layout:
      tap-min: 44px
      text-meta: "0.8125rem"
      text-title: "1.25rem"
      baseline: "4px"
      measure: "60ch"
      leading-body: "1.5"
      leading-title: "1.25"
      radius-xs: "0"
      radius-sm: "0"
      radius-md: "0"
      radius-lg: "0"
      radius-pill: "0"
      face-bar-height: "44px"
      bar-height: "44px"
      hud-tier-status: "calc(var(--face-bar-height) + var(--safe-bottom) + 8px)"
      hud-tier-caption: "calc(var(--face-bar-height) + var(--safe-bottom) + var(--tap-min))"
      face-phosphor-decay: "0.80"
      transition-fast: "180ms"
      transition-normal: "300ms"
      ease-out: "cubic-bezier(0.16,1,0.3,1)"
      ease-linear: "cubic-bezier(0,0,1,1)"
      ease-in-out: "cubic-bezier(0.65,0,0.35,1)"
      ease-spring: "cubic-bezier(0.32,0.72,0,1)"
      z-canvas: "1"
      z-chrome: "10"
      z-ui: "90"
      z-overlay: "100"
      z-modal: "1000"
      z-toast: "1100"
      z-skip: "2000"
  # One semantic face contract. CLI, browser HUD, 2D fallback and 3D FaceWorld
  # consume this vocabulary; renderers may project it, but may not redefine it.
  face_interface:
    schema: 1
    prompt:
      font: font_code
      measure_ch: 66
      max_ch: 72
      line_height: 1.5
      user_token: "user"
      master_token: "master"
    state:
      modes: [idle, listening, thinking, working, speaking, warning, error, sleeping, ready]
      default_mode: idle
      default_topology: papua-mask
      entropy: 0.18
      confidence: 0.86
      attention: 1.0
      arousal: 0.22
      valence: 0.18
      focus: 0.86
      activity: 0.14
      risk: 0.0
    # How the stipple layer looks in each state in `modes` above; the web face
    # reads this through MASTER_FACE_CONTRACT and Ruby through Face::Contract.
    stipple:
      # Point-size parameters are consumed as shader uniforms; keep them here so
      # the renderer does not quietly grow a second visual-tuning contract.
      point_size:
        base: 0.90
        bias_scale: 0.35
        bias_min: 0.25
        bias_max: 1.50
        reference_depth: 5.0
        distance_min: 0.75
        distance_max: 1.25
        output_min: 1.0
        output_max: 1.5
      profiles:
        idle:      { density: 0.44, ripple: 0.03, turbulence: 0.04, luminosity: 0.76, attract: 0.14 }
        thinking:  { density: 0.72, ripple: 0.16, turbulence: 0.28, luminosity: 0.91, attract: 0.74 }
        listening: { density: 0.62, ripple: 0.17, turbulence: 0.09, luminosity: 0.85, attract: 0.86 }
        working:   { density: 0.75, ripple: 0.24, turbulence: 0.34, luminosity: 0.90, attract: 0.60 }
        speaking:  { density: 0.84, ripple: 0.60, turbulence: 0.19, luminosity: 0.98, attract: 0.40 }
        warning:   { density: 0.84, ripple: 0.52, turbulence: 0.48, luminosity: 0.96, attract: 0.22 }
        error:     { density: 0.56, ripple: 0.82, turbulence: 0.65, luminosity: 1.00, attract: 0.04 }
        ready:     { density: 0.60, ripple: 0.06, turbulence: 0.06, luminosity: 0.82, attract: 0.25 }
        sleeping:  { density: 0.30, ripple: 0.00, turbulence: 0.00, luminosity: 0.48, attract: 0.10 }
    # What each state means in the material, as parallel maps keyed by state so no path runs deeper
    # than the configuration depth law allows. The dials for a state are in stipple.profiles; these
    # say why they are what they are. Membership runs unturned < transitional < turned < locked.
    # uncertainty reads as warning and convergence as ready; working and sleeping extend the same
    # forces to the states this face has beyond the original seven.
    stipple_vocabulary:
      pluribus: "many discrete carriers"
      unum: "one coherent readable form"
      signal: "propagating change of membership or attention; the lime accent marks admission and focus"
      turned: "high density and luminosity, admitted into the field"
      unturned: "low density, still individual, not yet joined"
      residual: "the particular inside the collective, kept in idle"
      void: "negative space as equal material"
      gather: "parts pull toward one locus"
      ripple: "a signal crosses the field"
      fragment: "parts leave the form"
      settle: "the field re-coheres"
    stipple_membership:
      idle: transitional
      listening: transitional
      thinking: turned
      working: turned
      speaking: turned
      warning: transitional
      error: unturned
      ready: locked
      sleeping: unturned
    stipple_force:
      idle: residual
      listening: ripple
      thinking: gather
      working: gather
      speaking: ripple
      warning: residual
      error: fragment
      ready: settle
      sleeping: residual
    stipple_note:
      idle: "many at rest; individual seeds still visible"
      listening: "the field opens to incoming signal"
      thinking: "parts concentrate toward one locus"
      working: "the locus holds while work runs"
      speaking: "signal leaves through the mouth region"
      warning: "binding loosens; individuals reappear"
      error: "admission fails; the field breaks, may rejoin"
      ready: "out of many, one stable form"
      sleeping: "carriers at rest; the field dims, not erased"
    stipple_forbidden:
      - bright_multicolour_particle_fields
      - decorative_particle_carpets_behind_content
      - signal_as_body_text_on_white
      - signal_as_large_background_fill
      - glow_lens_flare_ornamental_gradients
      - solid_mesh_as_primary_face_material
      - motion_without_semantic_state
      - erasing_all_residual_individuality_in_idle
    interaction:
      states: [idle, waking, listening, holding, yielded, processing, speaking, sleeping, error]
      turn_states: [draft, listening, committed, interrupted, discarded, failed]
      task_states: [queued, active, waiting-human, waiting-network, waiting-model, complete, failed, cancelled]
      tool_states: [queued, active, retry, complete, failed]
      events:
        - speech:start
        - speech:partial
        - speech:end
        - speech:abort
        - speech:attention
        - tts:start
        - tts:end
        - tts:interrupt
        - turn:started
        - turn:committed
        - turn:discarded
        - turn:interrupted
        - audio:update
        - render:frame
        - render:quality
        - performance:receipt
        - workspace:node:created
        - workspace:node:updated
        - workspace:node:removed
        - workspace:relation:created
        - workspace:focus
        - memory:added
        - task:queued
        - task:active
        - task:waiting-human
        - task:waiting-network
        - task:waiting-model
        - task:complete
        - task:failed
        - task:cancelled
        - tool:queued
        - tool:active
        - tool:retry
        - tool:complete
        - tool:failed
    audio:
      fields: [rms, peak, bass, mid, high, centroid, onset, speechActivity, speaker, playback,
               sentencePosition, sampleRate, channels, analyserWindow, latencyMs, playbackBufferMs, underruns]
    performance:
      target_fps: 60
      target_frame_ms: 16.667
      main_thread_budget_ms: 8
      gpu_budget_mb: 128
      memory_budget_mb: 192
    workspace:
      persistence: explicit_opt_in
      stable_ids: true
      provenance: required
      relationships: true
    mode_aliases:
      phantom: error
      escalation: warning
      tool: thinking
      memory: thinking
      event: thinking
      codebase: working
      fixing: working
      complete: ready
      converged: ready
      settled: idle
    # The plain-ASCII face: a lit triangle mesh rasterised in software and
    # sampled onto a ramp of characters. Two readers: lib/cli/face/ascii.rb (the
    # terminal) and the web face (RAILS/master), which ports the same steps
    # with no WebGL, so every tunable lives here and nowhere else. Braille is
    # retired. Rounding is floor(x + 0.5), half up, and every cell index is a
    # floor; the dither is an integer matrix; the renderer uses no randomness.
    # A frame of rows x cols cells is a buffer of cols*samples by 2*rows*samples
    # square samples: a cell is `samples` wide and 2*samples tall, being twice as
    # tall as wide. Steps, in order:
    #  0 the mesh (Face::Head, built once per window size and kept): `mesh.rows`
    #    rings of `mesh.around` vertices, each an ellipse at angle theta from the
    #    front (x = A sin, z = D cos), A the ring's half width times the face scale
    #    and cranial width, D its half width times the depth ratio. The half width
    #    at height y is the painting's face ellipse (DepthMap's first layer: x
    #    radius 0.255 of the canvas, centred at its CX, CY): sqrt(1 - t^2) of its
    #    widest, with t running to 0 at `mesh.skull` half widths above the widest
    #    row, and below it (1 - t^2)^mesh.jaw at `mesh.chin` half widths down. The
    #    front half is lifted by the painted relief (brightness blurred over a
    #    cross of `mesh.blur`, minus 0.5) and by the mask's ridges and sockets, in
    #    proportion to cos theta. Two pole vertices at the apexes close the top and
    #    bottom, so every edge has two triangles and the winding is outward. A mask
    #    is the same grid under other numbers (Face::Masks), so a morph is plain
    #    vertex interpolation. Vertex normals are the area-weighted mean of the
    #    faces round the vertex; a vertex's cavity is how far its neighbours' mean
    #    stands out along the normal, over the squared edge length.
    #  1 fit: scale = min((cols/2 - 1) / R, (2*rows - 2) / spanY) * fit, with R
    #    the largest hypot(x, z) of the vertices, so turning never resizes it.
    #  2 turn each vertex and normal by yaw (look.yaw + look.turn), then pitch,
    #    then roll; k = scale * look.scale * c / (c - rz) with c = camera /
    #    look.dolly; x = samples * (cols/2 + x*k), y = samples * (rows - y*k -
    #    bob*scale), depth rz*scale. The camera distance c is the field of view:
    #    the half angle is atan(1/camera) of the head radius.
    #  3 rasterise every triangle whose screen area is front facing: edge
    #    functions at sample centres (i + 0.5, j + 0.5), barycentric weights
    #    that are all >= 0, a z-buffer that keeps the largest depth and, on a
    #    tie, the first triangle drawn. Each sample keeps its triangle and two
    #    weights; shading waits until the last triangle is in.
    #  4 light each covered sample, in view space. Key: unit vector (sin a cos e,
    #    sin e, cos a cos e) with a = light.start + light.orbit * look time (the
    #    Look's `light`) and e = light.elevation; fill: the fixed light.fill_dir;
    #    rim: (-sin a, 0.4, -cos a), behind the head and opposite the key. lum =
    #    ambient + key*max(n.K, 0) + fill*max(n.F, 0) + rim*max(n.R, 0), times
    #    (1 - paint + paint*brightness) and (1 - cavity.gain*ao); a specular term
    #    spec * max(n.H, 0)^shininess (H = unit(K + (0, 0, 1)), shininess an
    #    integer power of two, by squaring) is added where n.K > 0. n is the
    #    barycentric mix of vertex normals, renormalised. A mesh read from a file
    #    has vertices of its own for every triangle, so its normals are its faces'
    #    and it is shaded flat; smooth shading was chosen for the head because flat
    #    shows the facets as creases at 28 by 64.
    #  5 per cell: coverage is covered samples over samples*2*samples, below
    #    `cover` the cell is a space. A silhouette cell (a 4-neighbour below
    #    `cover`) takes its glyph from the gradient of coverage over the 3x3
    #    cells, if it is at least edge_gradient. Otherwise a step cell (the mean
    #    depth, as a fraction of the visible range, differs from a 4-neighbour's by
    #    at least depth_edge) takes the line across the depth gradient. Otherwise a
    #    crease cell: every covered sample whose four neighbours are covered reads
    #    the change of the surface slope across itself (central differences, a
    #    sample being square), and if the larger |eigenvalue| times `samples`
    #    reaches `crease` it votes for the glyph of the ridge's direction; the
    #    cell takes the glyph with most votes (a tie to the later in character
    #    order) if they are at least `vote` of its covered samples. Otherwise
    #    shade: tone = mean lum of covered samples * gain * (1 - edge_fade +
    #    edge_fade * coverage), capped at `ceiling`, raised to `gamma`, plus
    #    depth.tone * (depth fraction - 0.5), clamped to 0..1. The tone is a place
    #    in ink space: ramp glyph k sits at ink[k] / ink[densest] (light mode
    #    mirrors that), and the cell takes the glyph below the tone or the one
    #    above it, the upper when the tone's share of the gap exceeds
    #    0.5 + ((bayer[row%4][col%4] + 0.5)/16 - 0.5) * dither_gain, the dither
    #    fixed in screen space. A glyph with no measured ink takes an even step.
    #    The samples a side are `samples`, or samples_large.samples from
    #    samples_large.cells cells (rows * cols), where the cells carry the detail.
    #  6 a line direction (dx, dy_up) in square samples picks "-", "/", "|"
    #    or "\" by the glyph's own slope on a cell: "/" is atan(aspect) from
    #    horizontal. A horizontal edge picks by sub-row: boundary at the cell
    #    top "'", middle "-", bottom "_".
    #  7 features over the shading (eyes, brows, nose line, mouth), placed from
    #    the mesh's landmarks, projected like vertices and drawn only where the
    #    z-buffer does not hide them.
    #  8 depth class: rz*scale as a fraction of the visible range, at least `near` bold,
    #    at most `far` dim.
    #  The ramp is ordered by ink: `ink` holds each glyph's measured share of a
    #  character cell (`ruby tools/face_ascii_fixtures.rb ink`, Menlo at 72 px), and a test holds
    #  `chars` ascending in it. MASTER_FACE_CHARS replaces the ramp.
    #  A port keeps three habits of the Ruby that plain arithmetic would not: a
    #  sum is a plain left-to-right loop (never Array#sum, which compensates); min_by
    #  and max_by keep the first of equal elements; and Float#% is fmod moved into
    #  the divisor's sign. sin, cos, asin, atan2 and exp may differ in the last
    #  bit between runtimes (the fixtures allow 0.01 on the Look and nothing on a
    #  character). The web port, RAILS/master/public/face_ascii.js, rebuilds
    #  the mesh from the depth map and morphology here rather than receiving it,
    #  and test/face_ascii.test.mjs holds it to test/fixtures/face_ascii_frames.json.
    #  Pose.at(state, t, seed) gives the Look for a still frame: turn = spin * t in
    #  the spin states, else 0; scale = 1 + breath*sin(breath_rate*t); pitch =
    #  pitch_sway*sin(pitch_rate*t); roll and bob likewise; light = light.start +
    #  light.orbit * t; the eyes shut while
    #  (t + (seed mod 7) * 0.37) mod blink_period >= blink_period - blink_length;
    #  speaking opens the mouth by 0.7*|sin(1.1*k)| + 0.15*(k mod 3), k = floor(20*t).
    ascii:
      # Shared OpenBSD-style shell glyphs, consumed by the CLI and web face.
      prompt: { input: "|-", continuation: "\\_", output: "/" }
      chars: " .,:~;r+=civ*YnyeaXPq&#8W@"
      # Named alternatives remain ordered subsets of the calibrated ink ramp.
      # Web keyboard controls and MASTER_FACE_RAMP use this same catalogue.
      ramps:
        sculpt: " .,:~;r+=civ*YnyeaXPq&#8W@"
        classic: " .:;=*#@"
        high_contrast: " .;=#@"
        fine_detail: " .:;=*#@"
      # Ink: each ramp glyph's share of one character cell, measured (Menlo at 72 px).
      # A tone is quantised in this space (step 5). Glyphs the
      # contours and features use (| - / \ ' _ ( ) o) stay out of the ramp.
      ink: { " ": 0.0, ".": 0.0362, ",": 0.0492, ":": 0.0576, "~": 0.0646, ";": 0.0753, "r": 0.0802, "+": 0.0834, "=": 0.0910, "c": 0.0967, "i": 0.1003, "v": 0.1030, "*": 0.1103, "Y": 0.1161, "n": 0.1222, "y": 0.1288, "e": 0.1379, "a": 0.1442, "X": 0.1499, "P": 0.1574, "q": 0.1633, "&": 0.1718, "#": 0.1797, "8": 0.1871, "W": 0.2010, "@": 0.2099 }
      mode: dark
      # Neutral graphite depth tones: far (faint), mid, and near (bold).
      tone_far: "#555555"
      tone_mid: "#A6A6A6"
      tone_near: "#F0F0F0"
      fit: 0.92
      camera: 3.2
      aspect: 2.0
      samples: 2
      # The cheaper path: from this many cells a side is one sample wide (a cell
      # is samples x 2*samples), since the cells themselves carry the detail.
      samples_large: { cells: 6000, samples: 1 }
      # How the window is sized (Face::Sizing; the terminal only). The face takes
      # the terminal less `margin` cells a side, at least `floor` (rows, cols) if
      # the terminal has it, at most `cap`. The head keeps its proportions at
      # any size, and a window wider than rows * aspect * span is cut to that
      # width since the extra is empty. aspect is the cell height over its
      # width. mode: auto, small, large, or WxH (columns by rows); `small` is
      # the floor.
      size: { mode: auto, margin: { cols: 2, rows: 0 }, floor: [28, 64], cap: [120, 300], span: 1.25 }
      mesh: { rows: [40, 96], per_row: 1.6, around: [48, 150], per_col: 0.9, skull: 1.45, chin: 1.2, jaw: 0.6, blur: 0.02, back: 0.72 }
      light:
        start: -0.6
        orbit: 0.6
        elevation: 0.5
        fill_dir: [-0.4, 0.25, 0.9]
        ambient: 0.16
        key: 0.62
        fill: 0.16
        rim: 0.3
        spec: 0.22
        shininess: 16
      shade: { paint: 0.6, gain: 1.0, gamma: 1.2, ceiling: 0.97 }
      cavity: { gain: 0.15 }
      cover: 0.2
      edge_fade: 0.4
      edge_gradient: 0.5
      crease: 0.6
      vote: 0.35
      depth_edge: 0.15
      dither_gain: 0.55
      dither: [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]]
      depth: { near: 0.62, far: 0.30, tone: 0.08 }
      # Read by the web view only (face_ascii.js): the rows a viewport is divided
      # into, the font size bounds in px, and the alpha of far, mid and near ink.
      # The terminal has the window it is given and needs none of it.
      web: { rows: 44, font: [9, 20], tone: [0.45, 0.75, 1.0] }
      # Read by Face::Motion (live, springs and noise) and by Face::Pose, the
      # pure function of (state, t, seed) a port can match to the float.
      motion:
        spin: 0.35
        breath: 0.015
        breath_rate: 1.6
        pitch_sway: 0.06
        pitch_rate: 0.43
        roll: 0.18
        roll_rate: 0.7
        bob: 0.02
        bob_rate: 1.1
        blink_period: 3.4
        blink_length: 0.16
        glance_initial: 0.72
        glance_interval: [0.28, 1.85]
        glance_horizontal: 0.065
        glance_vertical: 0.028
        dolly: { idle: 1.0, listening: 1.018, thinking: 1.045, speaking: 1.032 }
        spin_states: [idle, thinking, working, sleeping, ready]
      occlusion: 2.5
      facing: 0.1
      min_rows: 8
      min_cols: 16
      features:
        eye_open: "("
        eye_close: ")"
        pupil: "o"
        # From eye_tall_at columns wide an eye has lids (three rows), a larger
        # pupil and its brow a row higher; an eye is at most eye_floor columns wide or eye_share of the window's columns. A nose
        # nostril_at rows long shows nostrils flanking its tip.
        pupil_large: "O"
        eye_floor: 9
        eye_share: 0.1
        eye_tall_at: 13
        eye_lid_top: [".", "-", "."]
        eye_lid_bottom: ["'", "-", "'"]
        nostril_at: 7
        nostril: ["(", ")"]
        lid: "-"
        brow: "-"
        nose: "|"
        nose_tip: "."
        mouth_line: "-"
        mouth_listening: ["\\", "_", "/"]
        mouth_corner_top: "."
        mouth_corner_bottom: "'"
      # Mask morph targets: the head eases toward one of these while MASTER is
      # thinking, and back when it stops. Provenance: the proportions are
      # abstracted from the mask traditions of Papua New Guinea, named here as
      # sources only - Maprik and Yam woven masks, Iatmul mei, Baining bark-cloth
      # masks, Sepik basketry masks, and the Highlands gourd form. They are
      # ceremonial objects; only their proportions are stylized here as numbers.
      # No mask is MASTER's face, and none is named as such in the interface.
      # A target is a set of overrides on `neutral` (the human head, whose
      # geometry keys are the morphology block, so a key there is not repeated);
      # Face::Masks.morph(from, to, s) blends every key by smoothstep(s) =
      # s*s*(3-2s), clamped, and returns `from` at s <= 0 and `to` at s >= 1
      # exactly. The mesh is the human head's grid, vertex for vertex; only where
      # each vertex sits changes, so the count and the triangles never do. A mesh
      # at a mix is the neutral and the target's vertices (and landmarks) blended
      # by the same smoothstep, and the extras below follow the blended numbers. Keys:
      #  width, face_length, depth_scale: scales of x, y and z on the head.
      #  upper_face_scale, lower_face_scale, cranial_width, cranium_scale,
      #    facial_verticalization, jaw_projection, jaw_softening,
      #    masticatory_scale, nasal_projection: the morphology keys, absolute.
      #  relief: scales the painted relief; flatten, flat_brightness: pull the
      #    painted brightness toward one value (a smooth gourd has no paint).
      #  socket_depth: sinks the eye zones (the groove under a ring eye).
      #  brow_ridge, brow_y, brow_width, brow_height: a horizontal ridge; from
      #    brow_min it is drawn as a second row of glyphs.brow_heavy above the brow.
      #  beak_projection, beak_top, beak_length, beak_width, beak_flare: a nose
      #    ridge that grows toward its tip (head units; the flare is the drawn
      #    rails' spread at the tip).
      #  ring (amount 0..1), ring_radius, ring_count: concentric eye rings.
      #  halo (amount), halo_radius, halo_rise, halo_span (degrees), halo_rows,
      #    halo_gap: an arc above the crown, amount scaling its rise and span.
      #  disc (amount), disc_radius, disc_offset, disc_height: ear discs.
      #  brow_line, nose_line: 1 draws the glyph line, below one half it is gone.
      # The step that draws them, after the mouth: a ring is the circle of the
      # eye's own plane sampled at ring_radius*ring*i/ring_count, outermost
      # first, glyphs from `glyphs.ring` cycling inward; the halo is the arc of
      # radius halo_radius centred (0, top + rise - radius), drawn in `-` and
      # `'`; a disc is two circles at x = +-(widest + offset). Each sample is
      # drawn only where the z-buffer does not hide it. Sample counts are
      # ceil(2*span_degrees)+1 for an arc and max(ceil(9.42*r_px), 12) for a
      # circle; columns are floor(x + 0.5), rows floor(y / 2).
      # The trigger: Face::Masks.mix(state, t, since:, from:) ramps linearly
      # from `from` (the mix when the state last changed, at time `since`)
      # to 1 in a trigger state over ease.in seconds, else to 0 over ease.out.
      # pick(session) is FNV-1a over the session id's UTF-8 bytes, mod
      # order.size, so the terminal and the web face choose alike.
      masks:
        order: [maprik_yam, iatmul_mei, baining, sepik_woven, highlands_gourd]
        default_session: master
        trigger_states: [thinking]
        ease: { in: 1.2, out: 0.8 }
        takeover: 0.5
        beak_min: 0.015
        brow_min: 0.03
        # How much nearer a surface may stand and still leave the mouth's corners
        # seen (head units): a narrow mask curves its chin steeply away.
        mouth_slack: 0.08
        ring_min_px: 1.0
        glyphs: { ring: "OoO0", disc: "Oo", halo: ["-", "'"], beak_tip: "\\_/", brow_heavy: "=" }
        neutral:
          width: 1.0
          face_length: 1.0
          depth_scale: 1.0
          relief: 1.0
          flatten: 0.0
          flat_brightness: 0.72
          socket_depth: 0.0
          brow_ridge: 0.0
          brow_y: 0.14
          brow_width: 0.26
          brow_height: 0.04
          beak_projection: 0.0
          beak_top: 0.02
          beak_length: 0.28
          beak_width: 0.06
          beak_flare: 0.0
          ring: 0.0
          ring_radius: 0.10
          ring_count: 2
          halo: 0.0
          halo_radius: 0.50
          halo_rise: 0.14
          halo_span: 70.0
          halo_rows: 2
          halo_gap: 0.035
          disc: 0.0
          disc_radius: 0.10
          disc_offset: 0.04
          disc_height: 0.04
          brow_line: 1.0
          nose_line: 1.0
        targets:
          maprik_yam:
            face_length: 1.10
            width: 0.95
            socket_depth: 0.04
            beak_projection: 0.12
            beak_length: 0.26
            beak_flare: 0.05
            ring: 1.0
            ring_radius: 0.105
            ring_count: 2
            halo: 1.0
            halo_radius: 0.42
            halo_rise: 0.12
            halo_span: 58.0
            brow_line: 0.0
          iatmul_mei:
            face_length: 1.30
            width: 0.80
            depth_scale: 0.92
            relief: 1.2
            brow_ridge: 0.07
            beak_projection: 0.11
            beak_length: 0.32
            beak_flare: 0.035
          baining:
            face_length: 0.95
            width: 1.35
            depth_scale: 0.75
            lower_face_scale: 0.96
            socket_depth: 0.03
            beak_projection: 0.06
            beak_length: 0.28
            beak_width: 0.09
            beak_flare: 0.04
            ring: 1.0
            ring_radius: 0.12
            ring_count: 1
            brow_line: 0.0
          sepik_woven:
            face_length: 1.35
            width: 0.78
            lower_face_scale: 0.90
            socket_depth: 0.03
            beak_projection: 0.05
            beak_length: 0.22
            beak_flare: 0.03
            ring: 1.0
            ring_radius: 0.085
            ring_count: 2
            disc: 1.0
            disc_radius: 0.09
            disc_offset: 0.10
            disc_height: -0.06
            brow_line: 0.0
          highlands_gourd:
            face_length: 0.95
            width: 1.20
            depth_scale: 1.10
            upper_face_scale: 0.82
            lower_face_scale: 1.0
            relief: 0.15
            flatten: 0.85
            brow_line: 0.0
            nose_line: 0.0
    spatial:
      topology_profiles:
        papua-mask: { tilt_x: 0.00, tilt_y: 0.00, density: 1.00, fracture: 0.00 }
        face:        { tilt_x: 0.00, tilt_y: 0.00, density: 1.00, fracture: 0.00 }
        codebase:    { tilt_x: -0.08, tilt_y: 0.10, density: 1.18, fracture: 0.08 }
        ecology:     { tilt_x: 0.12, tilt_y: -0.06, density: 1.32, fracture: 0.12 }
      # Speculative distant-human design, not a biological forecast. The
      # defensible direction comes from observed Homo cranial evolution:
      # greater neurocranial globularity and facial retraction, then a restrained
      # speculative extension toward a future with less mastication pressure and
      # more visually mediated communication. Skin tone is deliberately not
      # inferred: future human diversity is not a single phenotype.
      morphology:
        model: speculative_distant_human_2026_r3
        generation: 10
        cranium_scale: 1.22
        cranial_width: 1.07
        cranial_height: 1.08
        upper_face_scale: 0.95
        lower_face_scale: 0.76
        facial_verticalization: 1.07
        masticatory_scale: 0.74
        orbital_scale: 1.08
        orbital_vertical_scale: 1.04
        brow_scale: 0.60
        nose_scale: 0.82
        nasal_projection: 0.82
        mouth_scale: 0.86
        facial_projection: 0.78
        jaw_projection: 0.76
        jaw_softening: 0.95
        malar_scale: 0.96
        pupil_scale: 0.86
        asymmetry: 0.012
        asymmetry_seed: 73421
        variation_band: 0.028
        climate_variant: neutral
      shell:
        radius: 1.58
        width_segments: 28
        height_segments: 20
      task_ring:
        enabled: true
        max_nodes: 12
        radius_x: 2.02
        radius_y: 1.72
        depth: -0.12
        dot_radius: 0.027
        orbit_speed: 0.000004
        terminal_lifetime_ms: 12000
      nodes:
        lib: [-1.38, 0.10, -0.28]
        law: [-0.70, 1.18, -0.10]
        tools: [1.40, 0.05, -0.20]
        web: [0.70, -1.10, -0.12]
        openbsd: [-0.82, -1.05, -0.16]
      links: [[lib, law], [law, tools], [tools, web], [web, openbsd], [openbsd, lib],
              [lib, tools], [law, web], [tools, openbsd], [web, lib], [openbsd, law]]
      layers: [identity, eyes, mouth, cognition, repository, event_field, camera, hud]
      camera:
        distance: 5.20
        parallax: 0.06
        orbit_limit: 0.16
        fov: 38
      budget:
        # A single additive-point ceiling is partitioned between stipple and FaceWorld.
        # These weights must sum to 1; FaceState normalizes defensively at runtime.
        point_allocation: { stipple_fraction: 0.75, world_fraction: 0.25 }
        desktop_points: 1200
        mobile_points: 420
        desktop_particles: 200
        mobile_particles: 120
        reduced_motion_particles: 64
        max_device_pixel_ratio: 2.0
        active_fps: 24
        idle_fps: 12
        hidden_fps: 0
        reduced_motion_fps: 8
        battery_fps: 12
        pulse_limit: 24
        hud_labels: 5
      sparse_field:
        max_particles: 260
        mobile_max_particles: 140
