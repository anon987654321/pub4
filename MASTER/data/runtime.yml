---
cognitive_spine:
  id: cognitive_runtime
  tier: core
  area: runtime
  status: active
  source: docs/cognitive_runtime.md
  target_shape:
  - models propose intents
  - orchestrator validates intents
  - every decision and mutation appended to disk
  - providers scored and quarantined
  - memory tiered and compacted
  - failures become repair input
  - workflows replayable from checkpoints
  invariants:
  - id: agents_no_direct_mutation
    rule: Agents do not directly mutate durable state
  - id: external_action_events
    rule: Every external action emits an event before and after execution
  - id: provider_routing
    rule: Provider calls routed through capability, health, cost, and fallback policy
  - id: append_only_telemetry
    rule: Telemetry is append-only JSONL unless explicitly compacted
  - id: tiered_memory
    rule: Memory moves through canonical, episodic, semantic, compressed, and snapshot tiers
  - id: repair_pipeline
    rule: Repair follows observe → classify → propose → sandbox → validate → merge
  - id: tool_contracts
    rule: Tool contracts define inputs, outputs, permissions, retries, timeout, and validation
  - id: git_repair_memory
    rule: Git history mined as repair memory
  - id: context_pressure
    rule: Context pressure measured before escalation, compaction, or topology changes
  landed_subsystems:
  - path: brain/providers/routing.yml
    role: declarative provider routing and fallback policy
  - path: runtime/events/
    role: append-only cognition/event stream
  - path: runtime/telemetry/
    role: failure, correction, latency, token, and context-pressure journals
  - path: runtime/context_pressure.rb
    role: cognitive-pressure tracking
  - path: runtime/experience.rb
    role: plan/provider/tool-route scoring
  - path: runtime/event_record.rb
    role: canonical event record primitive
  - path: runtime/replay_reader.rb
    role: replay reader for JSONL event streams
  - path: runtime/stale_namespace_audit.rb
    role: post-refactor namespace drift scanner
  - path: repair/git_history_miner.rb
    role: commit-history mining for lost repair logic
  - path: tools/contracts/runtime_event.yml
    role: contract for append-only event emission
  - path: data/patterns.yml#stale_namespaces
    role: migration registry for stale constants
  spine_flow:
  - workflow
  - event_record
  - append_only_stream
  - replay_reader
  - telemetry_derivation
  - repair_learning
  - provider_scoring
  - orchestration_refinement
  rollout_order:
  - Land runtime primitives and policy files
  - Make smoke and stale-namespace audit hard refactor gates
  - Route all model calls through provider policy
  - Wrap tool execution with contracts and event logging
  - Add failure digest and provider health jobs to heartbeat
  - Add checkpoint/replay reconstruction for full workflows
  - Feed visual bridge from canonical runtime events
  - UI panels for event stream, provider health, context pressure, repair queue
  deletion_pressure:
    remove:
    - silent_retries
    - hidden_mutable_globals
    - provider_specific_execution_branches
    - duplicate_registries
    - telemetry_only_state
    - ui_owned_runtime_state
    - stale_namespace_compatibility_shims
collaboration:
  id: collaboration_protocol
  tier: ops
  area: workflow
  status: active
  source: docs/collaboration_protocol.md
  hard_rule: Do not push directly to main when more than one session may be active
  branch_pattern: session/<agent>-<focus>-<yyyymmdd>
  branch_examples:
  - session/master-visualizer-20260514
  - session/master-epistemics-20260514
  - session/master-repo-ecology-20260514
  branch_discipline:
    rule: Each session branch contains one coherent focus
    valid_focuses:
    - visualizer
    - pressure_engine
    - repo_ecology
    - reference_graph
    - epistemics
    - runtime_hardening
    - refactor_pass
    avoid: mixing unrelated architectural work
  merge_protocol:
    steps:
    - Rebase onto current main
    - Run syntax checks
    - Run /scan or equivalent static scan
    - Run /ecology if tree structure changed
    - Review touched paths
    - Confirm no overlapping session changed the same files
    - Merge with a clear summary
  conflict_policy:
    same_file_touched:
    - stop both branches
    - compare intent
    - preserve smaller coherent change
    - manually merge
    - rerun checks
    force_push: never over another session's work unless explicitly approved
  commit_shape:
    good:
    - small
    - reversible
    - focused
    - testable
    - named by behavior
    bad:
    - giant mixed patches
    - vague cleanup
    - unrelated visual + runtime + docs changes
    - speculative architecture without executable code
  safety_requirements:
    report:
    - files changed
    - commands added
    - runtime risks
    - rollback behavior
    - test status
    - known uncertainty
  preferred_flow:
  - branch
  - implement
  - scan
  - ecology
  - syntax/test
  - rebase
  - review
  - merge
  convergence_rule: MASTER optimizes for convergence over accumulation; multiple sessions useful only when they reduce entropy
event_registry:
  id: event_naming
  tier: core
  area: bus
  status: active
  source: docs/event_naming.md
  pattern: namespace:action
  namespaces:
  - namespace: master
    owner: core runtime
    when: pipeline lifecycle, visual state, codebase-wide signals
  - namespace: attention
    owner: ground/now
    when: attention context changes, breadcrumb updates
  - namespace: judge
    owner: judge
    when: scan results, council start/done, violations
  - namespace: trace
    owner: trace
    when: session records, telemetry, audit entries
  - namespace: voice
    owner: voice
    when: TTS start/done, speech errors
  established_events:
  - event: master:visual
    target: visual_bridge.js
    purpose: topology/mode changes
  - event: master:clusters
    target: cluster registry
    purpose: cluster registry updates
  - event: master:codebase
    target: codebase visual
    purpose: repo-map or file-tree refreshes
  - event: master:rule_event
    target: scan pipeline
    purpose: scan rule fired
  - event: attention:context
    target: attention breadcrumb
    purpose: attention breadcrumb changed
  - event: judge:scan_start
    target: judge
    purpose: scan begun on a path
  - event: judge:scan_done
    target: judge
    purpose: scan results available
  - event: judge:council_start
    target: judge
    purpose: council deliberation opened
  - event: judge:council_done
    target: judge
    purpose: council result ready
  - event: sound_critique_start
    target: legacy
    purpose: sound critique panel assembling — prefer judge:*
    legacy: true
  - event: sound_critique_done
    target: legacy
    purpose: sound critique result ready — prefer judge:*
    legacy: true
  rules:
  - Prefer namespace:noun over namespace:verb_noun (attention:context not attention:context_changed)
  - master:* is for signals that cross subsystem boundaries
  - Never emit raw subsystem internals on master:*
  - JS listeners in visual_bridge.js normalize inbound events to master:visual
  - New events must appear in this registry before shipping
face3d_migration:
  id: face3d_migration
  tier: ui
  area: face
  status: active
  source:
  - docs/face3d_engine.md
  - docs/face3d_runtime_hardening.md
  goals:
  - keep retro Atkinson/Bayer/ZX/phosphor white dithered pixel look
  - normalized 3D face coordinates
  - blendshape-driven expression logic
  - semantic anatomical zone particles
  - typed arrays in hot loops
  - speech, mood, confidence, tool events, verdicts drive one face state
  - mine visual clusters into shared emotion/topology system
  modules:
  - path: web/public/face3d_engine.js
    role: standalone MasterFace3D namespace with typed-array particle core
  - path: web/public/face3d_renderer.js
    role: Face3DCanvasRenderer retro phosphor/dither adapter
  - path: web/public/face3d_preview.js
    role: optional boot when ?face3d=1 or auto via visual_bridge
  - path: web/public/cluster_miner.js
    role: groups master:visual/codebase/rule_event into master:clusters
  - path: lib/rails/face3d_runtime_policy.rb
    role: quality degradation and audit policy
  clusters:
  - id: face_particle_body
    files:
    - web/public/face.js
    - face3d_engine.js
    - face3d_renderer.js
    - face3d_preview.js
    purpose: semantic particle face with normalized topology and blendshapes
  - id: cognition_ecology
    files:
    - web/public/cognition_ecology.js
    purpose: terrain, weather, trails, memories, agent spirits
  - id: codebase_topology
    files:
    - web/public/codebase.js
    purpose: modules as particle clusters; violations agitate, fixes settle
  - id: runtime_visual_bridge
    files:
    - web/public/visual_bridge.js
    purpose: normalize runtime events to master:visual state
  - id: speech_audio_body
    files:
    - lib/voice/speech.rb
    - bin/tts-worker
    - web/public/face.js
    purpose: TTS stream, audio analysis, mouth shaping during playback
  - id: repo_ecology
    files:
    - data/runtime.yml#repo_ecology
    purpose: repository as semantic topology and cognitive geography
  proposed_clusters:
  - id: cluster_miner
    role: runtime browser cluster miner with heat, confidence, evidence
  - id: evidence_graph
    role: tracks why files/events belong to clusters
  - id: emotion_bus
    role: entropy/confidence/mode/provider/cluster heat → emotion vector
  - id: topology_registry
    role: papua-mask, serpent, neural, torus, sphere, codebase forms
  - id: migration_radar
    role: ranks safe migration steps by blast radius and rollback plan
  blendshape_mapping:
  - blink
  - squint
  - browInnerUp
  - browDown
  - smile
  - frown
  - jawOpen
  - mouthWide
  - mouthRound
  - pupilDilate
  - nostrilFlare
  - cheekRaise
  - shock
  - chibi
  emotion_vector:
    fields:
    - arousal
    - valence
    - focus
    - confidence
    - fatigue
    rule: blendshapes derived from emotion vector for continuity
  migration_steps:
  - id: step_1
    order: 1
    action: Load face3d_engine, renderer, preview, cluster_miner alongside face.js
    status: implemented
  - id: step_2
    order: 2
    action: Verify preview with ?face3d=1
    status: implemented
  - id: step_3
    order: 3
    action: Inspect clusters via MASTERClusterMiner.snapshot
    status: implemented
  - id: step_4
    order: 4
    action: Route master:clusters into Face3D emotion state
    status: implemented
  - id: step_5
    order: 5
    action: Use VisemeDriver for duration-based lipsync
    status: implemented
  - id: step_6
    order: 6
    action: Replace direct mouth mutation with blendshape targets
    status: implemented
  - id: step_7
    order: 7
    action: Convert mask builders to normalized anchors one mask at a time
    status: implemented
  - id: step_8
    order: 8
    action: Move particle storage from objects to typed arrays
    status: implemented
  - id: step_9
    order: 9
    action: Add spatial hash repulsion in CPU tick
    status: implemented
  - id: step_10
    order: 10
    action: Optional WebGL renderer preserving retro canvas default
    status: partial
    note: visibility throttle + deviceorientation shipped; WebGL path deferred per hardening rules
  hardening:
    implementation_order:
    - Keep typed-array particle core
    - Replace allocation-heavy spatial lookup with fixed typed-array buckets
    - Add spatial repulsion inside CPU tick
    - Gate expensive effects through quality controller
    - Add visibility throttling before worker or GPU experiments
    - Add worker physics after main-thread CPU path stable
    - Add WebGPU only as optional acceleration after CPU fallback proven
    runtime_rules:
    - No parallel Face3D runtime
    - No WebGPU until CPU fallback complete
    - No per-frame object particles
    - No synchronous GPU readback
    - No canvas resize inside animation loop
    - No layout-changing DOM writes in render path
    quality_degradation_order:
    - bloom
    - spatial_repulsion
    - oscilloscope_effects
    - frame_cap
    - particle_count_on_rebuild
    preserve_in_degraded: core face motion and expression blendshapes
    next_safe_patch: visibility throttling before worker physics experiments
