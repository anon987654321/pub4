schema: 1
name: pub4_gap_ledger
purpose: >
  The registry of what the suite is MISSING — logic, content, knowledge and
  UX that no scanner can see, because absence leaves no diff to scan. Every
  scanner law measures what exists; this file gives MASTER a word for what
  does not. It is seeded from the planned rows of RAILS/apps.yml and
  RAILS/apps.horizon.yml, from the rows the first ideation pass itself
  surfaced, and from the master-web surface audit of 2026-10-27 — the
  operator's window was already shipped, so absence there looked like
  completeness until the audit read its contracts against what the surface
  renders. The chain is one direction: ledger -> ideation record
  (data/ideations/) -> pick -> convergence.yml workstream -> law-gated
  implementation. This file routes appetite; it grants no authority of its
  own — laws remain in soul.yml and laws.yml, and the budget ratchet still
  only ever goes down.
authorization: >
  Operator request of 2026-10-27 (chat e2c7ceca): ideate over the planned
  rows, keep the survivors, implement the winners. Same chat, follow-up
  "what about master web?": the audit-sourced master rows below carry the
  same authorization and the same fences. This does not lift the
  horizon fence for silent building: a row becomes implementation only
  through a recorded pick with loser rationale, a convergence workstream,
  and the normal pipeline.
states: [open, ideating, picked, satisfied, rejected, blocked]
kinds: [logic, content, knowledge, ux]
sources:
  apps_yml: "RAILS/apps.yml planned rows (feature statuses verified against landed code)"
  horizon: "RAILS/apps.horizon.yml (aspirational; agent_policy set to ignore at seed time)"
  pass_1: "rows the first ideation pass itself surfaced (source: ideation_pass_1)"
  master_audit: "master-web surface audit 2026-10-27: contracts (CLAUDE.md, routes, dashboard payload) read against what the surface actually renders"
  operator_chat: "operator messages of 2026-10-27 in the same chat (e2c7ceca): 'especially its face, making it more visually appealing and soothing' and 'the tts voice, making it sound way cooler using digital sound processing and/or fm modulation or creative use of audio effects etc.'"
