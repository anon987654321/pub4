  OPENBSD/SSH_ACCESS.md:
  - path: priv/ssh/id_ed25519_brgen.pub
    why: |
      Deliberate, and load-bearing. Permanent exemption.
      Corrected 2026-08-12: this reason used to read "Keys are never committed; the document names where the operator keeps one locally", and on that reading the sentence was rewritten to send the reader to the VM instead. That was wrong and has been reverted. .gitignore lines 42-43 are `priv/ssh/` followed by `!priv/ssh/*.pub` -- public keys are explicitly un-ignored, so `priv/ssh/id_ed25519_brgen.pub` is where the public half is MEANT to live and "in repo" is accurate about the design. The file is simply not there yet.
      So this is not a dead reference to repair. It is a path waiting for its file, and the fix is to add the public key, not to reword the document.
