  RAILS/shared/reference/affiliate_banner/README.md:
  - value: 44px
    why: 'Not prescribed — criticised. The line reads "Comic Sans MS at 44px, against
      a two-family type rule", in a list of what is wrong with a third-party reference
      banner we chose not to copy. Naming --tap-min here would say the opposite of
      what the sentence says, and there is no token that owns a font size we rejected.
      Permanent while the file stays a critique; if it ever prescribes anything, the
      numbers come out.

      '
