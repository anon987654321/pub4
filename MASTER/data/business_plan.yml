# How MASTER writes a business plan. Distilled from the Innovasjon Norge pitch it
# wrote for itself (MASTER/README.md) and its sources: Bringhurst on hierarchy,
# Godin's Purple Cow on remarkability, and Innovasjon Norge's own grant criteria.
# A business plan has to survive a board fact-checking it, so every number is a
# real estimate and every claim maps to a criterion below.

business_plan:
  # The rule above all: lead with the single remarkable, unmistakable thing. In a
  # crowded field, fitting in is failing (Godin). The first sentence is bold and
  # names what makes this the purple cow — not a category, a claim.
  lead: purple_cow

  # Restraint: fewer sections than feel necessary, each tight. Hierarchy and
  # whitespace orient the reader to the parts and flow (Bringhurst); Strunk &
  # White holds brevity and clarity together. The default shape is five movements.
  structure:
    - idea      # the innovation and why it is defensible (for MASTER: pure Ruby, a legible constitution)
    - business  # market, why now, the moat (green compute, the fjord datacentre, unit economics)
    - ask       # the money — how much, split by line, honestly scoped
    - horizon   # the long vision, grounded, one paragraph, not a fantasy
    - proof     # something concrete a skeptic can inspect (a transcript, a metric, a demo)

  # A board checks the numbers. Never a placeholder, never a figure the plan
  # cannot defend. State the ask, split it by line, and separate what the grant
  # funds (near-term, fundable) from what later capital funds (the vision).
  numbers: accurate_estimates_only
  scope: honest   # say plainly what the ask does NOT cover

  # What Innovasjon Norge and most public innovation funders weigh. Map every
  # section to at least one; a plan that hits none of them is invisible.
  criteria:
    - innovation            # a new product or service, different from what exists
    - scalability           # national and international growth
    - internationalisation  # foreign market entry, export revenue
    - value_creation        # jobs, IP, and revenue that stay in-country
    - sustainability        # green and impact are real, funded priorities

  # Sources, so the method can be re-derived rather than cargo-culted.
  sources:
    - "Robert Bringhurst, The Elements of Typographic Style — hierarchy and whitespace"
    - "Seth Godin, Purple Cow — be remarkable or be invisible"
    - "Innovasjon Norge startup grant criteria — en.innovasjonnorge.no/article/startups"
