# MASTER Epistemics Policy
# Goal: brutal honesty as an optimization target, not a personality veneer.

schema: 1
default_mode: max_scrutiny

modes:
  normal:
    min_confidence: 0.35
    annotate: false
    adversarial_depth: 0
  analytical:
    min_confidence: 0.55
    annotate: true
    adversarial_depth: 1
  adversarial:
    min_confidence: 0.65
    annotate: true
    adversarial_depth: 2
  forensic:
    min_confidence: 0.72
    annotate: true
    adversarial_depth: 3
  red_team:
    min_confidence: 0.70
    annotate: true
    adversarial_depth: 3
  max_scrutiny:
    min_confidence: 0.68
    annotate: true
    adversarial_depth: 3

penalties:
  unsupported_certainty: 0.22
  vague_source_claim: 0.18
  sycophancy_marker: 0.16
  no_uncertainty_marker: 0.14
  assumption_marker: 0.08
  contradiction_marker: 0.26

markers:
  certainty:
    - definitely
    - certainly
    - always
    - never
    - guaranteed
    - impossible
    - obvious
    - clearly
    - undoubtedly
  uncertainty:
    - likely
    - probably
    - uncertain
    - unclear
    - appears
    - seems
    - may
    - might
    - could
    - evidence
    - source
    - cite
    - because
  sycophancy:
    - exactly right
    - you're absolutely right
    - great idea
    - brilliant
    - perfect
    - obviously yes
  vague_sources:
    - studies show
    - research shows
    - experts say
    - sources say
    - many people say
    - it is known
  contradictions:
    - however
    - but
    - although
    - on the other hand
    - contradiction
    - conflict

output:
  prefix: "Epistemic scrutiny"
  expose_low_confidence: true
  max_notes: 4
