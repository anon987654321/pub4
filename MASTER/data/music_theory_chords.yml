# Canonical harmonic vocabulary shared by MASTER and STUDIO/dilla.
# Intervals are semitones above the root; ordered extensions are intentional in
# Dilla because later intervals are octave-raised by the voicer.
schema: music_theory.chords.v1

scales:
  major: [0, 2, 4, 5, 7, 9, 11]
  minor: [0, 2, 3, 5, 7, 8, 10]
  dorian: [0, 2, 3, 5, 7, 9, 10]
  phrygian: [0, 1, 3, 5, 7, 8, 10]
  lydian: [0, 2, 4, 6, 7, 9, 11]
