# Root-independent harmonic functions and common movement grammars.
progressions:
  dilla_love: [i7, iv7, bVII7, bVI7]
  neo_soul_loop: [i7, iv7, bVII7, bVI7]
  ii_v_i: [ii7, V7, Imaj7]
  ii_v_i_minor: [ii7b5, V7b9, im7]
  backdoor: [iv7, bVII7, Imaj7]
  tritone_resolution: [II7, bII7, Imaj7]
  chromatic_mediant: [Imaj7, bIIImaj7, vi7, bVImaj7]
  minor_descent: [i9, bVIImaj7, bVImaj7, V7alt]
  gospel_69: [I69, VI7, ii9, V13]
  suspended_cycle: [isus4, IVsus4, bVII7, V7sus4]
  modal_drift: [i7, III7, bVII7, iv7]
  lydian_float: [Imaj7#11, IImaj7, vi7, V13]
  altered_turnaround: [Imaj7, vi7, ii7, V7alt]
  circle_soft: [vi9, ii9, V13, Imaj9]
  chromatic_bass: [Imaj9, Imaj9/G#, vi9, V13/F#]
  # Fantastic loops: minor sevenths as the ground colour, often moving by
  # step inside one key rather than by cadence.
  players_loop: [i7, iv7, ii7, v7]
  minor_seventh_descent: [i7, v7, ii7, vi7]
  look_of_love: [iii7, iii7, IVmaj7, vi7]
  dilla_soul: [i7, iv7, bVIImaj7, bIIImaj7]
  dual_tonal: [i9, ii7, "#vii7"]
  # Pass-3 additions (2026-10-27 research pass; each row cites its source and
  # uses only the roman vocabulary already in this file):
  # The Time: Donut of the Heart loop — Jackson 5, All I Do Is Think of You
  # (1975), also Sweet Charles, Yes It's You. A descending-diatonic family
  # loop whose step-wise descent resists closure the way the Fantastic loops
  # do.
  j5_donut_loop: [IVmaj7, iii7, vi7, ii7]
  # Get Dis Money's sampled phrase (Hein 2022): each major sonority answered
  # by its relative minor — the answer chord re-colours rather than cadences.
  relative_answer: [Imaj7, vi7, IVmaj7, ii7]
  # Minor key with the Dorian major fourth as the second pole of the loop —
  # Everytime (HookTheory), and Forget Me Nots' G#m7 borrowed from F-sharp
  # Dorian inside F-sharp natural minor (Hein, Memory Songs).
  dorian_four: [i9, IV9]
  # Remind Me's loop (Hein, Memory Songs): Dm -> Am11 -> Amaj9 reads as both
  # i of D minor with a flexible sixth and the pivot of A major with a
  # flexible seventh — tonality held in suspension rather than resolved.
  # (vm11 follows the file's im7 precedent: lowercase degree, m-suffix.)
  flexible_sixth: [i9, vm11, Vmaj9]
  # Climax (Fantastic Vol. 2): Emaj7 -> G#m7 -> G#maj7 — the mediant lifts by
  # a chromatic half step to the major-on-the-same-root sonority, a shimmer
  # inside one key rather than a modulation out of it.
  mediant_lift: [Imaj7, iii7, IIImaj7]

# How the vocabulary is actually played — voicing practice the transcriptions
# and the analyses name. Deliberately descriptive like families: guidance for
# humans and the generator's interpretive layer, executable by nothing.
voicings:
  so_what_quartal: "stack fourths on the 3rd/7th above a rootless m11 — the m11 and m13 rows read best this way"
  rootless_ninth: >-
    3-5-7-9 over the bass's root: Am11 is Em7-over-A thinking (Hein, Memory Songs, on Rushen's Remind
    Me)
  add2_cluster: >-
    Fadd2/A-type spellings — the closest-spaced colour in the neo-soul family; the Glasper three-voicing
    practice (m11/m9, maj7, add2-over-bass) covers most loops (PianoWorld 2022)
  pedal_planing: >-
    move the chord in parallel over a static bass — Get Dis Money's /E loop (Hein 2022; the
    transcription's alternate row and pedal field carry the concrete case)
  flexible_sixth: >-
    natural-minor melody over a Dorian iv/IV — the sixth is a colour the melody chooses, not a key
    change (Hein, Memory Songs)
  voice_leading: >-
    step the top voice and keep common tones; Dilla's loops move by step inside one key rather than by
    cadence — see the Fantastic loops comment above

# Metadata for humans/tools. This is deliberately descriptive rather than a
# second executable rulebook.
families:
  suspended: [sus2, sus4, 7sus2, 7sus4, 9sus2, 9sus4, 13sus4]
  dominant_altered: [7b5, 7#5, 7b9, 7#9, 7#11, 7b13, 7alt, 7#5b9, 7#5#9, 7#9#11, 7b9#11, 13b9, 13#11]
  neo_soul: [m7, m9, m11, m13, maj7, maj9, maj13, 69, m69, 7#9, 7sus4]
  rootless_friendly: [7, 9, 13, 7b9, 7#9, 7#11, 13b9, 13#11]
  symmetrical: [dim, dim7, aug, aug7]
