---
id: fail_visibly
name: Fail Visibly
description: Never rescue Exception or swallow errors.
principle: ROBUSTNESS
severity: error
mode: violation
auto_fix: false
adapters:
- medium: ruby
  detection:
    lexical:
      file_line:
        pattern: "^\\s*rescue\\s*$|rescue\\s+Exception"
        message: Rescue StandardError
