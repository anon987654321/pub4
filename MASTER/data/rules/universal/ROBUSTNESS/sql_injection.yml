---
id: sql_injection
name: SQL Injection
description: String interpolation in SQL – use parameterized queries.
principle: ROBUSTNESS
severity: error
mode: violation
auto_fix: false
adapters:
- medium: ruby
  detection:
    lexical:
      file_line:
        pattern: (?<!safe_)execute\(.*#\{|where\(\".*#\{|find_by_sql\(\".*#\{
        message: Use ? placeholders
