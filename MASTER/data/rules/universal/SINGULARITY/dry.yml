---
id: dry
name: DRY (Don't Repeat Yourself)
description: Duplicate logic across files – extract to shared abstraction.
principle: SINGULARITY
severity: info
mode: opportunity
auto_fix: false
adapters:
- medium: any
  detection:
    semantic:
      file_tree:
        prompt: Identify identical or near-identical code blocks. Suggest a shared
          abstraction.
