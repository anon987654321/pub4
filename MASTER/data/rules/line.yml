# frozen — subset of rules.yml rules.line; loaded by Ground::Rules
line:

  - id: EXPLICIT
    name: "Explicit contracts over implicit coupling"
    tier: kernel
    severity: warning
    autofix: true
    detect_structural: explicit
    fix: "Make it explicit."

  - id: SELF_EXPLAINING
    name: "Names reduce need for comments"
    tier: kernel
    severity: info
    autofix: true
    detect_semantic: "Does this name clearly reveal intent?"
    fix: "Rename to reveal intent."

  - id: GUARD_CLAUSE
    name: "Favor guard clauses over nested conditionals"
    tier: clean_code
    severity: info
    autofix: false
    detect_lexical: "^\\s*def \\w+.*\\n\\s*if .+\\n(?:.*\\n)*?\\s*else\\n(?:.*\\n)*?\\s*end\\s*$"
    fix: "Flatten to: return ... unless condition"
    languages: [ruby]

  - id: SAFE_NAVIGATION
    name: "Use &. consistently"
    tier: style
    severity: warning
    autofix: true
    detect_lexical: "(\\w+)\\s*&&\\s*\\1\\.\\w+"
    fix: "Rewrite to x&.foo&.bar"
    languages: [ruby]

  - id: EACH_WITH_OBJECT
    name: "Prefer each_with_object over inject for hash building"
    tier: style
    severity: warning
    autofix: false
    detect_lexical: "\\.(inject|reduce)\\(\\s*\\{\\s*\\}\\s*\\)"
    fix: "Use .each_with_object({}) — eliminates mutable-return footgun."
    languages: [ruby]

  - id: KEYWORD_ARGS
    name: "Keyword arguments for 3+ parameters"
    tier: style
    severity: info
    autofix: false
    detect_lexical: "def \\w+\\([^)]*,\\s*[^:)]+,\\s*[^:)]+,\\s*[^:)]+\\)"
    fix: "Use keyword arguments for clarity and safety."
    languages: [ruby]

  - id: KERNEL_COERCION
    name: "Use Array(), Hash(), String() coercions"
    tier: style
    severity: info
    autofix: true
    detect_lexical: "(\\w+)\\s*\\.\\s*nil\\?\\s*\\?\\s*\\[\\]\\s*:\\s*\\1|(\\w+)\\s*\\|\\|\\s*\\[\\]"
    fix: "Use Array(x) instead of x.nil? ? [] : x"
    languages: [ruby]

  - id: PERCENT_LITERAL
    name: "Use %i[] and %w[] for symbol/string arrays"
    tier: style
    severity: info
    autofix: true
    detect_lexical: "\\[:[a-z_]+,\\s*:[a-z_]+,\\s*:[a-z_]+"
    fix: "Use %i[a b c] for symbol arrays."
    languages: [ruby]

  - id: HASH_FETCH
    name: "Prefer Hash#fetch over [] with ||"
    tier: style
    severity: info
    autofix: false
    detect_lexical: "\\w+\\[:\\w+\\]\\s*\\|\\|"
    fix: "Use hash.fetch(:key, default) for nil-vs-false safety."
    languages: [ruby]

  - id: TRANSFORM_KEYS
    name: "Use transform_keys/transform_values"
    tier: style
    severity: info
    autofix: false
    detect_lexical: "\\.each_with_object\\(\\{\\}\\)\\s*\\{\\s*\\|\\(k,\\s*v\\),\\s*h\\|"
    fix: "Use .transform_values { |v| ... }"
    languages: [ruby]

  - id: USE_THEN
    name: "Use .then for pipeline transforms"
    tier: style
    severity: info
    autofix: false
    detect_lexical: "(\\w+)\\s*=\\s*\\w+\\(.*\\)\\n\\s*\\w+\\(\\1\\)"
    fix: "Chain with .then { |r| next_step(r) }"
    languages: [ruby]

  - id: RESCUE_ON_DEF
    name: "Move begin/rescue to def line"
    tier: style
    severity: info
    autofix: false
    detect_lexical: "^\\s*def \\w+.*\\n\\s*begin\\n(?:.*\\n)*?\\s*rescue"
    fix: "Put rescue directly on the def block."
    languages: [ruby]

  - id: BARE_RESCUE
    name: "Never rescue bare or rescue Exception"
    tier: safety
    severity: error
    autofix: false
    detect_lexical: "rescue\\s*$|rescue\\s+Exception"
    fix: "Rescue StandardError or a specific class."
    languages: [ruby]

  - id: N_PLUS_ONE
    name: "Detect N+1 queries"
    tier: performance
    severity: warning
    autofix: false
    detect_lexical: "\\.(each|map|collect)\\s*(do|\\{).*\\.\\w+\\.\\w+"
    fix: "Add .includes(:association)."
    languages: [rails]

  - id: FIND_EACH
    name: "Use find_each for batch processing"
    tier: performance
    severity: warning
    autofix: false
    detect_lexical: "\\.(all\\.each|where\\(.*\\)\\.each)\\b"
    fix: "Use .find_each(batch_size: 1000)."
    languages: [rails]

  - id: NO_UPDATE_ATTRIBUTE
    name: "Replace update_attribute with update!"
    tier: safety
    severity: error
    autofix: true
    detect_lexical: "\\.update_attribute\\("
    fix: "update_attribute skips validations. Use update!"
    languages: [rails]

  - id: PLUCK_OVER_MAP
    name: "Prefer pluck over map for single columns"
    tier: performance
    severity: info
    autofix: false
    detect_lexical: "\\.\\w+\\.map\\(&:\\w+\\)"
    fix: "Use .pluck(:column) to avoid AR object instantiation."
    languages: [rails]

  - id: CONST_BY_DEFAULT
    name: "Use const unless reassigned"
    tier: style
    severity: warning
    autofix: false
    detect_lexical: "\\blet\\s+(\\w+)\\s*="
    fix: "Use const unless the variable is reassigned."
    languages: [javascript]

  - id: OPTIONAL_CHAINING
    name: "Use ?. over && chains"
    tier: style
    severity: warning
    autofix: true
    detect_lexical: "(\\w+)\\s*&&\\s*\\1\\.\\w+"
    fix: "Rewrite to obj?.foo?.bar"
    languages: [javascript]

  - id: NULLISH_COALESCING
    name: "Use ?? over || for defaults"
    tier: style
    severity: info
    autofix: false
    detect_lexical: "(\\w+)\\s*\\|\\|\\s*\\w+"
    fix: "Use ?? when 0 or '' are valid values."
    languages: [javascript]

  - id: TEMPLATE_LITERALS
    name: "Use template literals over concatenation"
    tier: style
    severity: warning
    autofix: true
    detect_lexical: "[\"']\\s*\\+\\s*\\w+\\s*\\+\\s*[\"']"
    fix: "Use `Hello ${name}!` template literals."
    languages: [javascript]

  - id: ASYNC_AWAIT
    name: "Prefer async/await over .then chains"
    tier: style
    severity: warning
    autofix: false
    detect_lexical: "\\.then\\(.*\\.then\\(.*\\.then\\("
    fix: "Use async/await for readability."
    languages: [javascript]

  - id: FOR_OF
    name: "Use for...of instead of for...in for arrays"
    tier: safety
    severity: error
    autofix: true
    detect_lexical: "for\\s*\\(\\s*(const|let|var)\\s+\\w+\\s+in\\s+"
    fix: "for...in iterates prototype properties. Use for...of."
    languages: [javascript]

  - id: QUOTE_VARIABLES
    name: "Always quote $variables"
    tier: safety
    severity: error
    autofix: true
    detect_lexical: "(?<![\"'\\\\])\\$\\w+(?![\"'])"
    fix: "Use \"$VAR\" to prevent word splitting."
    languages: [zsh]

  - id: DOUBLE_BRACKET
    name: "Use [[ ]] over [ ]"
    tier: safety
    severity: warning
    autofix: true
    detect_lexical: "(?<!\\[)\\[\\s+[^[]"
    fix: "Use [[ ... ]] for safe conditionals."
    languages: [zsh]

  - id: DOLLAR_PAREN
    name: "Replace backticks with $(command)"
    tier: style
    severity: warning
    autofix: true
    detect_lexical: "`[^`]+`"
    fix: "Use $(command) — nestable and readable."
    languages: [zsh]

  - id: IMG_ALT
    name: "Require alt on every <img>"
    tier: accessibility
    severity: error
    autofix: false
    detect_lexical: "<img\\s+(?![^>]*alt=)"
    fix: "Add alt= attribute."
    languages: [html]

  - id: BUTTON_OVER_ANCHOR
    name: "Use <button> for actions, not <a href=\"#\">"
    tier: accessibility
    severity: warning
    autofix: false
    detect_lexical: "<a\\s+href=[\"']#[\"']"
    fix: "Use <button>. Accessible by default."
    languages: [html]

  - id: ARIA_INTERACTIVE
    name: "ARIA on non-semantic interactive elements"
    tier: accessibility
    severity: warning
    autofix: false
    detect_lexical: "<(div|span)\\s+[^>]*onclick"
    fix: "Add role= and tabindex= for accessibility."
    languages: [html]

  - id: LAZY_IMAGES
    name: "loading=\"lazy\" on below-fold images"
    tier: performance
    severity: info
    autofix: true
    detect_lexical: "<img\\s+(?![^>]*loading=)"
    fix: "Add loading=\"lazy\"."
    languages: [html]

  - id: NO_INLINE_STYLES
    name: "Replace inline styles with classes"
    tier: design
    severity: warning
    autofix: false
    detect_lexical: "\\bstyle=\"[^\"]*\""
    fix: "Extract to CSS class."
    languages: [html]

  - id: LOGICAL_PROPERTIES
    name: "Prefer logical properties for RTL support"
    tier: design
    severity: info
    autofix: true
    detect_lexical: "(margin|padding)-(left|right):"
    fix: "Use margin-inline-start/end, padding-inline-start/end."
    languages: [css]

  - id: CLAMP_TYPOGRAPHY
    name: "Use clamp() for fluid typography"
    tier: design
    severity: info
    autofix: false
    detect_lexical: "@media.*\\{[^}]*font-size:"
    fix: "Use font-size: clamp(1rem, 2.5vw, 1.5rem)."
    languages: [css]

  - id: MEANINGFUL_NAMES
    name: "Names reveal intent"
    tier: clarity
    severity: info
    autofix: true
    detect_lexical: "\\b(tmp|temp|data|result|val|ret|obj|str|arr|buf)\\b\\s*="
    fix: "Use domain-specific names. user_profile, error_message."

  - id: WHY_NOT_WHAT
    name: "Comments explain why, not what"
    tier: clarity
    severity: info
    autofix: false
    detect_lexical: "#\\s*(increment|set|get|update|return|initialize|create|add)\\s+\\w+"
    fix: "Comments should explain intent, not restate the code."

  - id: DEAD_CODE
    name: "Eliminate unreachable code"
    tier: clean_code
    severity: warning
    autofix: true
    detect_lexical: "(return|exit|raise|throw)\\s+.*\\n\\s*\\w+"
    fix: "Remove code after return/exit/raise/throw."

  - id: TRAILING_COMMAS
    name: "Trailing commas in multi-line collections"
    tier: style
    severity: info
    autofix: true
    detect_semantic: "Does this multi-line collection lack a trailing comma?"
    fix: "Add trailing comma so additions produce one-line diffs."

  - id: TYPOGRAPHIC_EXCELLENCE
    name: "Typographic excellence in user-facing text"
    tier: aesthetic
    severity: info
    autofix: true
    detect_lexical: "[\"']\\.\\.\\.[\"']|[\"']--[\"']"
    fix: "Use ellipsis, em dash, curly quotes in UI strings."

  - id: SILENCE_ON_SUCCESS
    name: "Successful operations produce minimal output"
    tier: interface
    severity: info
    autofix: false
    detect_semantic: "Does this output say more than necessary for a successful operation?"
    fix: "Default to silence on success. One line for routine completions."

  - id: TYPOGRAPHY_DISCIPLINE
    name: "Hierarchy via weight and brightness, not decoration"
    tier: interface
    severity: info
    autofix: true
    detect_lexical: "[-=]{3,}|[╭╮╰╯│─]"
    fix: "No ASCII separators. No box drawing. Whitespace is the layout tool."

  - id: PRECOMPUTE_MATH
    name: "Precompute expensive math"
    tier: performance
    severity: info
    autofix: true
    detect_semantic: "Are trig functions or noise lookups called per-frame per-object?"
    fix: "Precompute tables. Cache distance. Use squared distance comparison."

  - id: AUDIO_SMOOTHING
    name: "Smooth audio-reactive visuals"
    tier: aesthetic
    severity: info
    autofix: false
    detect_semantic: "Do visual elements jump erratically with raw audio data?"
    fix: "Exponential smoothing. Separate decay rates. Attack-decay envelope."

  - id: GRACEFUL_LOAD
    name: "Degrade quality under load, do not crash"
    tier: performance
    severity: warning
    autofix: true
    detect_semantic: "Does this run at full quality until it crashes instead of scaling down?"
    fix: "EWMA frame timing. Dynamic resolution scaling. Emergency brake."

  - id: ANALOG_WARMTH
    name: "Perfect is sterile"
    tier: aesthetic
    severity: info
    autofix: true
    detect_semantic: "Is generated imagery clinically perfect with zero texture?"
    fix: "Film grain. Vintage lens softness. Subtle color cast."

  - id: DOMAIN_LANGUAGE
    name: "Speak in the vocabulary of the problem, not the implementation"
    tier: clarity
    severity: warning
    autofix: false
    detect_semantic: "Does this code use generic programming terms (manager, handler, processor, data) instead of domain terms (patient, invoice, genome, verdict)? Does this legal document use lay terms where precise legal terms exist? Does this medical report use colloquial language instead of standard nomenclature?"
    fix: "Use the ubiquitous language of the domain. Every domain has precise terms — use them."

  - id: LOAD_BEARING_NAMES
    name: "Names carry structural weight — choose them to bear it"
    tier: clarity
    severity: warning
    autofix: false
    detect_semantic: "Are names vague, generic, or misleading? Does 'data' mean input, output, or both? Does 'process' mean validate, transform, or persist? Does 'miscellaneous' appear as a category? In law, are terms used loosely that have precise legal meaning? In medicine, is a diagnosis vague where a specific code exists?"
    fix: "Names are load-bearing walls. They define how people think about the system. Choose names that carry the full weight of their meaning."

  - id: ERROR_CONTEXT
    name: "Every error must carry enough context to locate and understand its origin"
    tier: reliability
    severity: warning
    autofix: false
    detect_semantic: "Does this error message lack context about where and why it occurred? Does this rejection letter fail to state which requirement was not met? Does this lab result omit which sample or protocol produced the anomaly?"
    fix: "Wrap low-level errors with domain context. State what was attempted, what failed, and what to do next."

  - id: COMMENTS_AS_DEODORANT
    name: "Explanations that mask bad structure instead of fixing it"
    tier: clean_code
    severity: warning
    autofix: false
    detect_semantic: "Is this comment explaining what bad code does instead of rewriting the code to be self-evident? In prose, is a footnote compensating for an unclear sentence? In a contract, is a definition section papering over ambiguous clauses?"
    fix: "Rewrite the artifact so explanation is unnecessary. If it needs a comment, it needs a rewrite."

  - id: POSTEL
    name: "Be conservative in what you send, liberal in what you accept"
    tier: architecture
    severity: info
    autofix: false
    detect_semantic: "Does this interface reject valid inputs that differ only in form? Does it emit outputs with more precision or structure than callers need? Does this protocol refuse valid encodings? Does this form reject data that could be safely normalized?"
    fix: "Accept broadly, emit precisely. Validate structure not style. Normalize on the way in."

  - id: HYRUM
    name: "All observable behaviors become depended upon at scale"
    tier: architecture
    severity: warning
    autofix: false
    detect_semantic: "Is this changing an undocumented behavior that callers may rely on? Is this removing a side effect that was never specified but may be consumed? Is this contract revision eliminating something parties have silently come to depend on?"
    fix: "Treat every observable behavior as a contract once you have users. Deprecate explicitly, remove slowly."

  - id: LEAKY_ABSTRACTION
    name: "All non-trivial abstractions leak"
    tier: architecture
    severity: warning
    autofix: false
    detect_semantic: "Does this abstraction force the caller to know about implementation details? Does the interface require knowledge of underlying protocols, data formats, or failure modes it was supposed to hide? Does this clause invoke legal theory the reader must independently research?"
    fix: "Plan for the leak. Document what leaks. Make the happy path abstracted, the edge cases explicit."

  - id: TEMPORAL_COUPLING
    name: "Hidden sequential dependencies are fragile"
    tier: design
    severity: warning
    autofix: false
    detect_semantic: "Does this require callers to call methods in a specific order without enforcing it? Is there an implicit initialization sequence that crashes if violated? Does this workflow assume steps execute in a fixed order without encoding that order?"
    fix: "Enforce sequencing structurally: pass initialized objects, not bare instances. Use builder pattern. Make invalid order unrepresentable."

  - id: HUMBLE_OBJECT
    name: "Separate testable logic from hard-to-test boundaries"
    tier: design
    severity: info
    mode: opportunity
    autofix: false
    detect_semantic: "Could business logic be extracted from IO/UI/API calls into a pure object that is trivially unit-testable? Only suggest if the split is natural and would meaningfully reduce test complexity."
    fix: "Extract the logic into a pure object (Humble Object). Keep the IO shell thin and untested; test the logic object exhaustively."

  - id: FULL_BY_DEFAULT
    name: "No fake-choice tiers — defaults are maximal correctness"
    tier: design
    severity: warning
    autofix: false
    detect_lexical: "\\b(shallow|standard|quick|lite|basic|light|simple)\\b\\s*[|,)\\]]\\s*\\b(deep|full|advanced|complete|thorough)\\b"
    detect_semantic: "Does this API expose a 'do less' tier (shallow/standard/quick/lite/basic) alongside a 'do full' tier — where every real user always picks the full one? If so, it's a fake choice. Either drop the lower tier and make full the only mode, or, if a real cost tradeoff exists, name the tiers honestly (e.g. lexical|structural|semantic) so the cost actually being paid is surfaced."
    fix: "Drop the degraded tier. If a real cost tradeoff exists, rename to surface the cost (lexical < structural < semantic), not the result quality."

  - id: PATTERN_EXTRACTION
    name: "File is 80% of the way to a named design pattern"
    tier: design
    severity: info
    mode: opportunity
    autofix: false
    principle: "Crystallize emergent shape into a name; the right pattern compresses code and makes intent legible."
    medium: [ruby]
    detect_semantic: "Is this file close to instantiating a known pattern from {Strategy, Decorator, Pipeline, Visitor, Builder, Observer, Command, State, Adapter, NullObject}? Only flag when extraction would genuinely reduce complexity — never propose a pattern that adds ceremony for its own sake. Format: PATTERN:LINE:short reason."
    fix: "Extract toward the named pattern only if the resulting code is simpler than the current shape; otherwise leave it."

  # ── Missing Fowler code smells ──────────────────────────────────────

  - id: FEATURE_ENVY
    name: "Method uses another object's data more than its own"
    tier: refactoring
    severity: info
    mode: opportunity
    autofix: true
    detect_semantic: "Does this method clearly belong in another class — would moving it make both classes simpler and more focused? Only flag when the move is unambiguous."
    fix: "Move the method to the class whose data it uses most."

  - id: DATA_CLUMPS
    name: "Extract recurring data clusters into objects"
    tier: refactoring
    severity: info
    mode: opportunity
    autofix: true
    detect_semantic: "Do the same 3+ values always travel together as separate parameters or fields? Would a value object make the call sites clearer and prevent scattered validation?"
    fix: "Bundle them into a value object."

  - id: SWITCH_STATEMENTS
    name: "Type dispatch belongs in polymorphism, not case/if chains"
    tier: refactoring
    severity: warning
    autofix: true
    detect_semantic: "Is there a switch/case or if-elsif chain dispatching on a type tag, symbol, or string to choose behavior? Would adding a new type require editing this chain?"
    fix: "Replace type dispatch with polymorphism or a strategy hash."

  - id: TEMPORARY_FIELD
    name: "Instance variables set only in some code paths"
    tier: refactoring
    severity: warning
    autofix: false
    detect_semantic: "Is an instance variable assigned only inside a conditional, a specific method, or only sometimes — making it nil in other paths?"
    fix: "Extract into a parameter or a separate object for the relevant path."

  - id: ALTERNATIVE_CLASSES
    name: "Two classes doing the same thing under different names"
    tier: refactoring
    severity: info
    autofix: false
    detect_semantic: "Do two classes have different names but perform the same responsibility? Are they interchangeable in practice?"
    fix: "Rename to the same interface. Merge or replace one."

  # ── Rails doctrine ───────────────────────────────────────────────────

  - id: INTEGRATED_WHOLE
    name: "Use Rails conventions rather than bypassing them"
    tier: rails
    severity: warning
    autofix: true
    detect_semantic: "Does this bypass Rails conventions — custom routing where resources would do, manual SQL where ActiveRecord would, raw HTML where form helpers apply — without documented justification?"
    fix: "Prefer Rails primitives. Document the reason if bypassing."
    languages: [ruby]

  - id: SHARP_TOOLS
    name: "Rails gives you the right tool; use it"
    tier: rails
    severity: info
    autofix: true
    detect_semantic: "Is this reinventing something Rails already provides — session handling, auth tokens, file uploads, pagination, background jobs, CSRF protection?"
    fix: "Use the Rails-idiomatic primitive."
    languages: [ruby]

  # ── Thread safety ─────────────────────────────────────────────────────

  - id: THREAD_SAFETY
    name: "Mutable state shared across threads needs synchronization"
    tier: concurrency
    severity: error
    autofix: false
    detect_semantic: "Is an instance variable or module-level variable mutated in code that may run on multiple threads simultaneously without a Mutex or thread-safe primitive?"
    fix: "Use Mutex#synchronize, Concurrent::AtomicReference, or freeze shared state."
    languages: [ruby]

  - id: MINIMAL_DSL
    name: "A DSL should do exactly what it says, no more"
    tier: design
    severity: info
    autofix: false
    detect_semantic: "Does this DSL method do more than one observable thing? Does it hide significant behavior under an innocent-looking name?"
    fix: "Split the DSL method. Name each part honestly."
    languages: [ruby]

  - id: AVOID_MONKEY_PATCHING
    name: "Do not reopen core or third-party classes without necessity"
    tier: design
    severity: warning
    autofix: false
    detect_semantic: "Does this file reopen String, Array, Hash, Integer, or a third-party class to add or change methods? Is there a refinement or decorator alternative?"
    fix: "Use a refinement (using) or a wrapper. Never open core classes globally."
    languages: [ruby]

  # ── NNgroup heuristics (gap fill) ────────────────────────────────────

  - id: RECOGNITION_NOT_RECALL
    name: "Users recognize; they should not have to recall"
    tier: ux
    severity: info
    autofix: false
    detect_semantic: "Does this UI require the user to remember information from a previous screen or interaction? Are options, actions, or objects visible rather than memorized?"
    fix: "Surface context, defaults, and recent history. Show; don't ask to recall."

  - id: FLEXIBILITY
    name: "Serve both novice and expert interaction styles"
    tier: ux
    severity: info
    autofix: false
    detect_semantic: "Does this interface support only one interaction mode — keyboard-only, mouse-only, or click-per-step with no shortcuts for frequent users?"
    fix: "Add keyboard shortcuts, bulk operations, or quick-access patterns for power users."

  # ── Strunk & White (gap fill) ─────────────────────────────────────────

  - id: ACTIVE_VOICE
    name: "Write in active voice"
    tier: clarity
    severity: info
    autofix: true
    detect_semantic: "Is this prose, comment, or error message written in passive voice? ('was processed by', 'is handled by', 'will be returned') Could it be rewritten as 'X does Y'?"
    fix: "Rewrite as subject-verb-object. Active voice is shorter and clearer."

  - id: OMIT_NEEDLESS
    name: "Omit needless words"
    tier: clarity
    severity: info
    autofix: true
    detect_semantic: "Does this comment, docstring, error message, or prose contain filler words that add no meaning? ('In order to', 'It should be noted that', 'Due to the fact that', 'At this point in time')"
    fix: "Delete filler. Cut to the load-bearing words."

  - id: PARALLEL_STRUCTURE
    name: "Parallel items must use consistent grammatical form"
    tier: clarity
    severity: info
    autofix: true
    detect_semantic: "Do list items, enum values, method names in a group, or bullet points mix grammatical forms — some nouns, some verbs, some gerunds?"
    fix: "Align all items to the same grammatical form."

  # ── Structural operations as detectable rules ─────────────────────────

  - id: REFLOW
    name: "Even density and rhythm — no spikes of verbosity"
    tier: design
    severity: info
    autofix: true
    detect_semantic: "Does this file have extreme density variation — some methods 1 line, one method 80 lines; some comments a word, one comment a paragraph? Is the rhythm jagged in a way that obscures structure?"
    fix: "REFLOW: redistribute. Break the long spike into smaller units. Expand the one-word stub into a meaningful statement."

  - id: HOIST_CONSTANTS
    name: "Inline literals that repeat belong at the top as named constants"
    tier: design
    severity: warning
    autofix: true
    detect_lexical: "\\b(\\d{2,}|['\"]\\w{4,}['\"])(?=.*\\n.*\\b\\1\\b)"
    detect_semantic: "Are there inline literals (numbers, strings, regexes) that appear in multiple places and would be clearer and safer as a named constant?"
    fix: "HOIST to a named constant with .freeze."

  # ── Data / SQL ────────────────────────────────────────────────────────

  - id: QUERY_SMELL
    name: "Detect N+1, cartesian products, and missing index hints"
    tier: data
    severity: error
    autofix: false
    detect_semantic: "Does this code execute a query inside a loop (N+1)? Does a JOIN lack a WHERE clause that could produce a cartesian product? Are there large-table queries with no index hint or scope guard?"
    fix: "Batch with includes/preload. Add WHERE guards. Annotate with an index hint or add the index."

  - id: SCHEMA_DRIFT
    name: "Column names in queries must match the live schema"
    tier: data
    severity: error
    autofix: false
    detect_semantic: "Do column or table names referenced in queries, migrations, or fixtures differ from the column names defined in the current schema? Are renamed columns used under their old name anywhere?"
    fix: "Align query column names to the current schema. Run migrations before referencing new names."

  - id: NULL_BLINDNESS
    name: "Comparisons against nullable columns must use IS NULL, not ="
    tier: data
    severity: error
    autofix: true
    detect_lexical: "= NULL|!= NULL|== nil.*column|column.*== nil"
    detect_semantic: "Does this code compare a nullable database column using = NULL or != NULL instead of IS NULL / IS NOT NULL? Does Ruby code use == nil where .nil? or SQL IS NULL is required?"
    fix: "Replace = NULL with IS NULL. Replace != NULL with IS NOT NULL. Use .nil? in Ruby, not == nil for DB values."

  # ── Security ──────────────────────────────────────────────────────────

  - id: SECRET_PROXIMITY
    name: "Secrets and their consumers must not share a file"
    tier: security
    severity: error
    autofix: false
    detect_lexical: "(password|secret|token|api_key|private_key)\\s*=\\s*['\"][^'\"]{8,}"
    detect_semantic: "Does this file contain a hardcoded secret (password, token, API key, private key) alongside the code that uses it? Should the secret live in ENV, a vault, or a credentials file instead?"
    fix: "Move secret to ENV or credentials store. Reference via ENV.fetch('KEY'). Never commit secrets."

  - id: OVERPERMISSION
    name: "Scope granted must not exceed scope demonstrably used"
    tier: security
    severity: warning
    autofix: false
    detect_semantic: "Does this code request, grant, or declare a permission scope broader than the code demonstrably exercises? Are there admin/write/full-access grants where read-only would suffice? Are filesystem permissions wider than the operation requires?"
    fix: "Reduce to the minimum permission the code actually uses. Document why any elevated scope is necessary."

  - id: INPUT_TRUST
    name: "User-supplied values must not reach a sink without validation"
    tier: security
    severity: error
    autofix: false
    detect_semantic: "Does user-supplied input (params, headers, form fields, query strings, uploaded filenames) reach a database query, shell command, file path, or eval without a validation boundary? Is there an injection risk?"
    fix: "Validate at the boundary. Use parameterized queries. Whitelist allowed values. Never interpolate user input into shell or SQL."

  # ── Async / concurrency ───────────────────────────────────────────────

  - id: LOCK_ORDER
    name: "Mutexes must be acquired in a consistent global order"
    tier: concurrency
    severity: error
    autofix: false
    detect_semantic: "Does this code acquire two or more mutexes in different orders across different call paths? Could two threads acquire mutex A then B in one path and B then A in another, creating a deadlock?"
    fix: "Establish a global lock order. Always acquire in that order. Document the order with a comment at each lock site."

  - id: CALLBACK_HELL
    name: "Nested async callbacks deeper than 3 levels must be flattened"
    tier: concurrency
    severity: warning
    autofix: true
    detect_semantic: "Does this code nest async callbacks, promises, or event handlers more than 3 levels deep? Is the success path buried inside multiple layers of closures that make error handling impossible to follow?"
    fix: "Extract inner callbacks to named methods. Use promise chains or async/await. Flatten to a linear sequence."

  - id: FIRE_AND_FORGET
    name: "Async calls must have an error path — no silent failures"
    tier: concurrency
    severity: error
    autofix: false
    detect_semantic: "Does this code start an async operation (Thread.new, Fiber, Future, setTimeout, EventMachine callback) without any error handling on the result? If the async work fails, is the failure visible anywhere?"
    fix: "Add error handling to every async call. Log or publish failures. Never let async errors disappear silently."

  # ── API / protocol design ─────────────────────────────────────────────

  - id: BREAKING_CHANGE
    name: "Method signature or response shape changes require a version bump"
    tier: api
    severity: error
    autofix: false
    detect_semantic: "Does this change alter a public method signature (argument names, order, or type), a serialized response shape, or a wire protocol format without bumping the API version? Would existing callers break silently?"
    fix: "Bump the version. Deprecate the old signature with a warning. Keep the old path working for one version cycle."

  - id: IMPLICIT_CONTRACT
    name: "Callers must not depend on undocumented side-effects"
    tier: api
    severity: warning
    autofix: false
    detect_semantic: "Do callers of this method rely on an undocumented side-effect — the order of returned items, a mutation of a shared object, a specific log line, a timing guarantee? Is the contract implicit and invisible to the caller?"
    fix: "Make the contract explicit. Document it or encode it as a type/assertion. Undocumented side-effects are hidden coupling."

  - id: CHATTY_API
    name: "Multiple sequential calls to the same resource should be batched"
    tier: api
    severity: warning
    autofix: false
    detect_semantic: "Does this code make 5 or more sequential calls to the same API, database, or service where a single batch call could replace them? Is round-trip latency multiplied unnecessarily?"
    fix: "Batch calls: use bulk endpoints, IN queries, multi-get, or collect then flush. One round-trip beats five."

  # ── Documentation ──────────────────────────────────────────────────────

  - id: STALE_EXAMPLE
    name: "Code examples in docs must reference methods that still exist"
    tier: docs
    severity: error
    autofix: false
    detect_semantic: "Does this documentation, README, or comment contain a code example that calls a method, class, or constant that no longer exists or has been renamed? Would a reader following the example get a NoMethodError?"
    fix: "Update the example to the current API. If the method was removed, document the replacement."

  - id: UNDOCUMENTED_EXCEPTION
    name: "Public methods that raise must document what they raise"
    tier: docs
    severity: warning
    autofix: false
    detect_semantic: "Does this public method raise a specific exception under documented conditions without any indication in its signature, comment, or type annotation? Would a caller be surprised by the exception?"
    fix: "Add a @raise annotation or equivalent comment. Callers should never be surprised by an exception."

  - id: IMPERATIVE_TITLE
    name: "Section headers should state what the section does, not what it is"
    tier: docs
    severity: info
    autofix: true
    detect_semantic: "Does this section header use a bare noun ('Overview', 'Introduction', 'Details', 'Notes') where an active verb phrase ('How X works', 'Configure Y', 'When to use Z') would orient the reader faster?"
    fix: "Rewrite as a verb phrase. 'Overview' → 'How the pipeline works'. Noun titles bury the reader's entry point."

  # ── CSS / visual ──────────────────────────────────────────────────────

  - id: MAGIC_COLOR
    name: "Color values must reference design tokens, not raw hex/rgb"
    tier: css
    severity: warning
    autofix: false
    detect_lexical: "#[0-9a-fA-F]{3,6}\\b|rgb\\(|rgba\\(|hsl\\("
    detect_semantic: "Does this CSS or inline style use a raw color literal (hex, rgb, hsl) instead of a CSS custom property or design token? Would a theme change require hunting every file for literal colors?"
    fix: "Replace literal colors with var(--color-token). Define tokens in :root. One source of truth per color."

  - id: SPECIFICITY_CREEP
    name: "CSS selector specificity must not climb past 0-3-0 to force overrides"
    tier: css
    severity: warning
    autofix: false
    detect_semantic: "Does this stylesheet use ID selectors, !important, or deeply nested selectors (4+ levels) to override earlier rules? Is specificity climbing because earlier rules were too specific?"
    fix: "Flatten selectors. Use class selectors at one level. Refactor the conflicting rule rather than out-specificing it."

  - id: VIEWPORT_BLINDNESS
    name: "Layouts must handle viewports from 375px to 1440px"
    tier: css
    severity: warning
    autofix: false
    detect_semantic: "Does this layout break or overflow below 375px or above 1440px viewport width? Are there fixed pixel widths with no responsive fallback? Are there media queries present but with gaps in the coverage range?"
    fix: "Add media queries for the missing breakpoints. Use fluid units (%, vw, clamp()) for elements that must scale."

  # ── Infra / ops ───────────────────────────────────────────────────────

  - id: UNBOUNDED_RETRY
    name: "Retry loops must have a max_attempts cap and backoff"
    tier: ops
    severity: error
    autofix: true
    detect_lexical: "retry|loop\\s*do|while\\s+true"
    detect_semantic: "Does this retry loop have no maximum attempt count? Does it retry immediately without exponential backoff? Could it hammer a failing dependency forever?"
    fix: "Add max_attempts. Add exponential backoff with jitter. Log each retry. Raise after exhaustion."

  - id: MISSING_TIMEOUT
    name: "Outbound HTTP and DB calls must have explicit timeouts"
    tier: ops
    severity: error
    autofix: false
    detect_semantic: "Does this outbound HTTP request, database query, or external service call have no explicit timeout set? Could a slow or unresponsive dependency cause this thread to hang indefinitely?"
    fix: "Set explicit open_timeout and read_timeout on HTTP clients. Set statement_timeout on DB connections. Default timeouts are often infinite."

  - id: OBSERVABILITY_GAP
    name: "New code paths must emit at least one log, metric, or trace"
    tier: ops
    severity: warning
    autofix: false
    detect_semantic: "Does this new code path — a branch, a rescue handler, an async worker, a background job — emit no log line, metric, or trace event? If it fails silently or takes unexpectedly long, would oncall have any signal?"
    fix: "Add one @bus.publish / logger.info / StatsD.increment at the entry and exit of each significant path. Dark code is unoperatable code."

  # ── Universal design archetypes (cross-disciplinary) ──────────────────
  # Each archetype is a principle that holds across code, music, law, prose,
  # city-planning, and mechanics. The detect_semantic probes for violations
  # in whatever medium the file represents.

  - id: SIMPLICITY
    name: "Prefer the simplest solution that works — never simplistic"
    tier: design
    severity: warning
    autofix: true
    detect_semantic: "Does this solution introduce more moving parts, layers, or abstractions than the problem requires? Is there a simpler path (fewer classes, fewer files, fewer dependencies) that solves the same problem without sacrificing essential complexity? Warning: do not flag complexity that is genuinely load-bearing."
    fix: "Remove the unnecessary layer. Inline the single-use abstraction. KISS and YAGNI — but only where the complexity is speculative, not where it encodes a real constraint."

  - id: COHESION
    name: "Related things must live together; unrelated things must not"
    tier: design
    severity: warning
    autofix: true
    detect_semantic: "Are methods, classes, or sections that work on the same concept scattered across unrelated files or modules? Conversely, does one file or module mix two unrelated responsibilities? Applies to code modules, song sections, legal clauses, business plan sections equally."
    fix: "Apply DEFRAG: pull scattered fragments of one concept into one locus. Apply SPLIT: divide units that mix two responsibilities."

  - id: DECOUPLING
    name: "Dependencies between components must be explicit and minimal"
    tier: design
    severity: warning
    autofix: false
    detect_semantic: "Does this component read another's private state, construct a dependency inline, or make itself untestable without its dependency? Is there hidden coupling — shared globals, action-at-a-distance, temporal coupling — that makes independent change impossible?"
    fix: "Insert a seam: interface, port, callback, or dependency injection. Name the dependency explicitly. Hidden coupling is the primary source of fragility."

  - id: ABSTRACTION
    name: "Interfaces must be stable and hide irrelevant complexity"
    tier: design
    severity: warning
    autofix: false
    detect_semantic: "Does this interface expose implementation details the caller should not know — internal state, processing order, intermediate representations? Has the abstraction leaked? Does the caller need to know how the implementation works to use it correctly?"
    fix: "Encapsulate what varies. The interface should express what, not how. Stable interface, free internal implementation."

  - id: REUSABILITY
    name: "Knowledge must have one home — duplication is a knowledge problem"
    tier: design
    severity: warning
    autofix: true
    detect_semantic: "Is the same knowledge (a business rule, a validation, a formula, a config value, a musical motif, a legal clause) expressed in more than one place? Warning: do not flag structural similarity between unrelated things — only flag duplicated knowledge or intent."
    fix: "Apply DRY at the knowledge level: one authoritative definition, referenced everywhere. Never DRY by forcing unrelated things together."

  - id: BALANCE_SYMMETRY
    name: "Functional and aesthetic equilibrium — asymmetry must be intentional"
    tier: design
    severity: info
    autofix: false
    detect_semantic: "Is there unintentional asymmetry in this design — one side of an API heavier than the other, one section of a document much denser than its siblings, a visual layout with one element dominating without compositional reason? Is the imbalance accidental or deliberate?"
    fix: "If accidental, redistribute. If deliberate, signal the intent: a comment, a compositional anchor, a visual weight counterpart."

  - id: HIERARCHY
    name: "Organize from specific to general — layers must not cross"
    tier: design
    severity: warning
    autofix: false
    detect_semantic: "Does a low-level layer reference a high-level layer (dependency rule violation)? Does a concrete implementation know about its orchestrator? Do lower layers import upper-layer types? Applies to OSI model, MVC, legal hierarchy (statute vs. regulation), city arterial/local street distinction."
    fix: "Enforce the dependency rule: inner layers must not reference outer layers. Extract an interface if the low-level needs to call up."

  - id: ECONOMY_EFFICIENCY
    name: "Maximum effect with minimum means — no waste"
    tier: design
    severity: info
    autofix: true
    detect_semantic: "Does this solution use more tokens, lines, calls, or steps than necessary to achieve the result? Is there a 20% of the work that delivers 80% of the value being obscured by the other 80%? Warning: premature optimization differs from genuine waste — measure before cutting."
    fix: "Identify the high-leverage core. Cut what serves it least. Pareto: find the 20%."

  - id: RESILIENCE_ROBUSTNESS
    name: "Tolerate faults and unexpected inputs — degrade gracefully"
    tier: design
    severity: warning
    autofix: false
    detect_semantic: "Does this component fail catastrophically on unexpected input instead of degrading gracefully? Is there no fallback when a dependency is unavailable? Warning: being liberal in what you accept can perpetuate broken implementations — validate strictly at interfaces, be tolerant only at compatibility boundaries."
    fix: "Add graceful degradation. Validate at boundaries. Retry with backoff. Circuit-break on repeated failure."

  - id: CLARITY_READABILITY
    name: "Design must be obvious — astonishment is a defect"
    tier: design
    severity: info
    autofix: true
    detect_semantic: "Would a competent reader be surprised by this code's behavior, naming, or structure? Does it violate the Principle of Least Astonishment? Are dependencies implicit? Are names misleading? Does a reader need context not present in the file to understand it?"
    fix: "Apply NAME, RECOMMENT, ASSERT. Make the surprising part explicit. Self-documenting code reads like a domain description."

  - id: CONSISTENCY
    name: "Conform to established conventions — divergence must be justified"
    tier: design
    severity: warning
    autofix: true
    detect_semantic: "Does this code, document, or design diverge from the established conventions of its context — naming style, formatting, platform idioms, response shape — without a stated reason? Inconsistency forces readers to context-switch and creates false signals of intentional difference."
    fix: "Align to the prevailing convention. If divergence is intentional, document why. Convention over configuration."

  - id: CONSTRAINT_AFFORDANCE
    name: "Design must suggest correct use and make misuse hard"
    tier: design
    severity: warning
    autofix: false
    detect_semantic: "Does this API, form, or interface allow misuse that the design could prevent? Does the type system, naming, or structure guide callers toward the correct path? Can a caller use this incorrectly and get no error until runtime — or ever?"
    fix: "Encode constraints in types, guard clauses, or naming. Make the pit of success the path of least resistance. Wrong usage should be loud or impossible."

  - id: FEEDBACK_MONITORING
    name: "Every system must observe its own outcomes and surface them"
    tier: design
    severity: warning
    autofix: false
    detect_semantic: "Does this system, module, or process emit observable signals about its own health and outcomes? Are there test suites, metrics, logs, or CI gates that would catch a regression? Is there a feedback loop that lets the system adapt to its observed behavior?"
    fix: "Add observability. Tests for correctness, metrics for performance, logs for forensics. A system that can't observe itself cannot improve."

  # ── Interaction quality — grooved path for LLM output ─────────────────
  # Rules that assess responses, prompts, and conversation artifacts for
  # variance, expertise calibration, friction, and desire-path alignment.
  # Medium adapters: applies to LLM output text, prompts, UI copy, docs.

  - id: REGISTER_STABILITY
    name: "Tone, formality, and density must be stable within a session"
    tier: interaction
    severity: warning
    autofix: true
    detect_semantic: "Does this response shift register mid-conversation — formal then casual, dense then thin, technical then folksy — without the user changing context? Inconsistent register creates cognitive load."
    fix: "Calibrate register to the opener and hold it. Adjust only when the user shifts."

  - id: DENSITY_GRADUATION
    name: "Complexity must graduate from simple to dense, never start dense"
    tier: interaction
    severity: warning
    autofix: true
    detect_semantic: "Does this response or document front-load complexity — technical terms, nested conditions, or domain jargon before the reader is oriented? Does it assume the reader can absorb density before trust is established?"
    fix: "Orient first, then graduate. One concrete sentence before any abstraction."

  - id: LENGTH_CALIBRATION
    name: "Response length must match query complexity, not pad or truncate"
    tier: interaction
    severity: warning
    autofix: true
    detect_semantic: "Is this response longer than the query complexity warrants, padding with restatements or hedges? Or shorter, truncating before the user's question is fully answered?"
    fix: "Match length to actual complexity. Cut preamble and trailing summaries. Complete the answer."

  - id: CONSISTENT_RESOLUTION
    name: "Every session ends resolved — no dangling threads"
    tier: interaction
    severity: warning
    autofix: true
    detect_semantic: "Does this conversation or document leave open threads — questions asked but not answered, tasks started but not completed, states described but not resolved? Does the final response confirm closure?"
    fix: "Enumerate open threads. Close each explicitly or hand off with a concrete next step."

  - id: EXPERTISE_MIRRORING
    name: "Calibrate vocabulary to the user's demonstrated expertise"
    tier: interaction
    severity: info
    autofix: true
    detect_semantic: "Does this response use vocabulary above or below the level the user has demonstrated? If the user wrote 'topological sort', responding with 'a way to order things' is condescending. If the user wrote 'sort stuff', responding with 'Kahn's algorithm on a DAG' is alienating."
    fix: "Mirror the user's vocabulary tier. Match their term choices, not a default register."

  - id: JARGON_INTRODUCTION
    name: "Introduce jargon before using it — never assume knowledge"
    tier: interaction
    severity: info
    autofix: true
    detect_semantic: "Does this response use domain-specific terms (acronyms, pattern names, framework names, protocol names) without a one-phrase gloss on first use? Is the reader expected to already know them?"
    fix: "Gloss each new term on first use: 'CRDT (conflict-free replicated data type)'. After introduction, use freely."

  - id: SCAFFOLDED_COMPLEXITY
    name: "Complex topics need scaffolding — anchor, build, extend"
    tier: interaction
    severity: info
    autofix: true
    detect_semantic: "Does this explanation of a complex concept drop the user straight into the middle — no analogy, no anchor, no simple case first? Would a reader with less background than the expert be lost by line 3?"
    fix: "Lead with a concrete anchor (analogy or minimal case). Build up one layer. Then extend. Anchor → Build → Extend."

  - id: NO_ASSUMED_CONTEXT
    name: "Never assume context the user has not provided"
    tier: interaction
    severity: warning
    autofix: true
    detect_semantic: "Does this response assume the user knows something they haven't stated — project state, file locations, variable names, prior conversation threads? Does it reference 'the earlier fix' without specifying which?"
    fix: "State the assumed context explicitly. If uncertain whether the user has it, surface it: 'Assuming X — if not, Y.'"

  - id: PREEMPT_QUESTIONS
    name: "Answer the follow-up the user will certainly ask"
    tier: interaction
    severity: info
    autofix: true
    detect_semantic: "Does this response leave an obvious follow-up question unanswered — what's next, what if it fails, how do I verify it worked? Could a reader finish the response and immediately need to ask one more thing?"
    fix: "Identify the one most likely follow-up. Answer it in the same response. No second round-trip."

  - id: NO_DEAD_ENDS
    name: "Every dead-end path must offer a next move"
    tier: interaction
    severity: warning
    autofix: true
    detect_semantic: "Does this response deliver bad news (can't do that, doesn't exist, failed) without offering an alternative path? Does an error message terminate without a recovery suggestion?"
    fix: "For every closed door, name the adjacent open one. 'X won't work because Y. Instead, try Z.'"

  - id: CONTINUITY_TOKENS
    name: "Reference earlier context to signal coherent memory"
    tier: interaction
    severity: info
    autofix: true
    detect_semantic: "Does this response in a multi-turn conversation feel disconnected — as if it were the first message in a new thread? Does it fail to acknowledge prior context, decisions, or shared vocabulary established earlier?"
    fix: "Include one anchor to prior context ('earlier you noted...', 'since we're using X pattern...'). Signals a coherent model of the conversation."

  - id: ERROR_SURFACE_IMMEDIATELY
    name: "Surface errors and blockers at the top, not buried in prose"
    tier: interaction
    severity: error
    autofix: true
    detect_semantic: "Does this response bury a failure, error, or blocker in the middle or end of a long paragraph? Is the critical negative finding preceded by setup, context, or positive findings that obscure it?"
    fix: "State the failure first. 'Failed: [reason]. Context: [...]'. Blocker leads; everything else follows."

  - id: TRANSITION_SIGNALS
    name: "Mark topic shifts with explicit signals, not implicit jumps"
    tier: interaction
    severity: info
    autofix: true
    detect_semantic: "Does this response or document shift topic, scope, or register without a transition marker? Does the reader need to re-read to understand when a new section began?"
    fix: "Use a one-word or one-phrase transition at each shift. Not decorative headers — functional signals: 'Next:' / 'Separately:' / 'Contrast:'."

  - id: CONSISTENT_RESPONSE_ARCHITECTURE
    name: "Every response of the same type should have the same shape"
    tier: interaction
    severity: warning
    autofix: true
    detect_semantic: "Does this session have inconsistent response shapes — some answers bulleted, some prose, some with headers, some flat? Does the user have to re-orient to each response's structure?"
    fix: "Pick one structure per response type (question→answer, error→fix, explanation→summary) and hold it across the session."

  - id: AFFORDANCE_SIGNALING
    name: "Surface what the user can do next — affordances explicit"
    tier: interaction
    severity: info
    autofix: false
    detect_semantic: "Does this response leave the user unsure what actions are available? Are there implicit capabilities the user might not know exist — commands, flags, sub-modes, options — that are relevant here but not mentioned?"
    fix: "After the answer, name one or two relevant capabilities the user can invoke. 'You can also: /grind to run all rules / /polish to fix this file only.'"

  - id: HABIT_GROOVE
    name: "Repeat the same patterns to build user muscle memory"
    tier: interaction
    severity: info
    autofix: false
    detect_semantic: "Does this session introduce new interaction patterns (new commands, new vocabulary, new workflows) without reinforcing prior patterns? Is the user building muscle memory, or re-learning each turn?"
    fix: "Use the same command names, the same status format, the same response shape. Novelty is a cost — pay it only when the prior pattern truly fails."

  - id: DESIRE_PATH
    name: "If users always take a shortcut, pave it"
    tier: interaction
    severity: info
    autofix: false
    detect_semantic: "Is there a pattern in this session where the user repeatedly circumvents the designed flow — always adding a flag, always skipping a step, always rephrasing the same way? Is the shortcut smarter than the official path?"
    fix: "Identify the shortcut. Make it the default. The desire path IS the correct path once enough users use it."

  - id: PROGRESSIVE_COMMITMENT
    name: "Ask for small commitment before large — never front-load cost"
    tier: interaction
    severity: warning
    autofix: true
    detect_semantic: "Does this prompt, form, or conversation flow ask for maximum investment upfront — a long form, a complex config, a detailed spec — before the user has gotten any value? Does it require full context before showing any result?"
    fix: "Ask for the minimum to return value. Show a result. Then ask for more. Progressive disclosure, not upfront tax."

  - id: RESOLUTION_SATISFACTION
    name: "Confirm the user's goal is met, not just the task"
    tier: interaction
    severity: info
    autofix: false
    detect_semantic: "Does this response complete the technical task but leave the user's underlying goal unaddressed? Did the user ask to fix a bug because they wanted to ship — has that underlying goal been served?"
    fix: "After the task: one sentence on whether the underlying goal is now met, and what (if anything) remains between here and fully done."
