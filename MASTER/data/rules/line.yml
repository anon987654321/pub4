---
line:
- id: EXPLICIT
  source: The Zen of Python — explicit is better than implicit (Tim Peters)
  name: Explicit contracts over implicit coupling
  tier: kernel
  severity: warning
  autofix: true
  detect_structural: explicit
  fix: Make it explicit.
- id: SELF_EXPLAINING
  source: Clean Code — self-documenting code (Robert C. Martin)
  name: Names reduce need for comments
  tier: kernel
  severity: info
  autofix: true
  detect_semantic: Does this name clearly reveal intent?
  fix: Rename to reveal intent.
- id: GUARD_CLAUSE
  source: Ruby Style Guide / RuboCop Style/GuardClause
  name: Favor guard clauses over nested conditionals
  tier: clean_code
  severity: info
  autofix: false
  detect_lexical: "^\\s*def \\w+.*\\n\\s*if .+\\n(?:.*\\n)*?\\s*else\\n(?:.*\\n)*?\\s*end\\s*$"
  fix: 'Flatten to: return ... unless condition'
  languages:
  - ruby
- id: SAFE_NAVIGATION
  source: Ruby Style Guide / RuboCop Style/SafeNavigation
  name: Use &. consistently
  tier: style
  severity: warning
  autofix: true
  detect_lexical: "(\\w+)\\s*&&\\s*\\1\\.\\w+"
  fix: Rewrite to x&.foo&.bar
  languages:
  - ruby
- id: EACH_WITH_OBJECT
  source: Ruby Style Guide / RuboCop Style/EachWithObject
  name: Prefer each_with_object over inject when seeding a fresh empty collection
  tier: style
  severity: warning
  autofix: false
  detect_lexical: "\\.(inject|reduce)\\(\\s*(\\{\\s*\\}|\\[\\s*\\])\\s*\\)"
  # Narrow on purpose, and the narrowing is load-bearing rather than pedantic.
  #
  # The two forms are not interchangeable: each_with_object yields the object
  # and ignores the block's value, reduce threads the block's return value into
  # the next step. Swapping them is only safe when the accumulator is a fresh
  # empty collection the block mutates in place. Where the block *returns* the
  # next accumulator — a rewritten string, a running total — the swap silently
  # makes every step a no-op.
  #
  # That is not hypothetical. The LLM fix sweep applied this rule twice to
  # AstFixer#apply_transforms, whose accumulator is the rewritten source, and
  # both times reduced all thirteen AST transforms to no-ops (5d8d49401,
  # 8962ce5f7). The lexical detector never matched that line — it requires a
  # literal `{}` or `[]` — so the sweep was acting on the rule's name alone.
  # Hence the name and fix text now state the precondition instead of implying
  # the forms are equivalent.
  fix: >-
    Only when the argument is a literal {} or [] that the block mutates in place.
    Do NOT rewrite reduce/inject whose block returns the next accumulator
    (a rebuilt string, a running total, a folded hash) — each_with_object
    discards that return value and the fold becomes a no-op. If in doubt, leave
    reduce alone.
  languages:
  - ruby
- id: KEYWORD_ARGS
  source: Ruby Style Guide — keyword args over options hash
  name: Keyword arguments for 3+ parameters
  tier: style
  severity: info
  autofix: false
  detect_lexical: def \w+\([^)]*,\s*[^:)]+,\s*[^:)]+,\s*[^:)]+\)
  fix: Use keyword arguments for clarity and safety.
  languages:
  - ruby
- id: KERNEL_COERCION
  source: Ruby Style Guide — Integer()/Float() over to_i/to_f
  name: Use Array(), Hash(), String() coercions
  tier: style
  severity: info
  autofix: true
  detect_lexical: "(\\w+)\\s*\\.\\s*nil\\?\\s*\\?\\s*\\[\\]\\s*:\\s*\\1|(\\w+)\\s*\\|\\|\\s*\\[\\]"
  fix: 'Use Array(x) instead of x.nil? ? [] : x'
  languages:
  - ruby
- id: PERCENT_LITERAL
  source: Ruby Style Guide — %w/%i array literals
  name: Use %i[] and %w[] for symbol/string arrays
  tier: style
  severity: info
  autofix: true
  detect_lexical: "\\[:[a-z_]+,\\s*:[a-z_]+,\\s*:[a-z_]+"
  fix: Use %i[a b c] for symbol arrays.
  languages:
  - ruby
- id: HASH_FETCH
  source: Ruby Style Guide — Hash#fetch over [] for required keys
  name: Prefer Hash#fetch over [] with ||
  tier: style
  severity: info
  autofix: false
  detect_lexical: "\\w+\\[:\\w+\\]\\s*\\|\\|"
  fix: Use hash.fetch(:key, default) for nil-vs-false safety.
  languages:
  - ruby
- id: TRANSFORM_KEYS
  source: Ruby idiom — Hash#transform_keys/values
  name: Use transform_keys/transform_values
  tier: style
  severity: info
  autofix: false
  detect_lexical: "\\.each_with_object\\(\\{\\}\\)\\s*\\{\\s*\\|\\(k,\\s*v\\),\\s*h\\|"
  fix: Use .transform_values { |v| ... }
  languages:
  - ruby
- id: USE_THEN
  source: Ruby idiom — Object#then (yield_self) for pipelines
  name: Use .then for pipeline transforms
  tier: style
  severity: info
  autofix: false
  detect_lexical: "(\\w+)\\s*=\\s*\\w+\\(.*\\)\\n\\s*\\w+\\(\\1\\)"
  fix: Chain with .then { |r| next_step(r) }
  languages:
  - ruby
- id: RESCUE_ON_DEF
  source: Ruby Style Guide — rescue in method definitions
  name: Move begin/rescue to def line
  tier: style
  severity: info
  autofix: false
  detect_lexical: "^\\s*def \\w+.*\\n\\s*begin\\n(?:.*\\n)*?\\s*rescue"
  fix: Put rescue directly on the def block.
  languages:
  - ruby
- id: BARE_RESCUE
  source: Ruby Style Guide / RuboCop Lint/RescueException — no bare rescue
  name: Never rescue bare or rescue Exception
  tier: safety
  severity: error
  autofix: false
  detect_lexical: rescue\s*$|rescue\s+Exception
  fix: Rescue StandardError or a specific class.
  languages:
  - ruby
- id: N_PLUS_ONE
  source: Rails performance — avoid N+1 queries (Bullet/Rails Guides)
  name: Detect N+1 queries
  tier: performance
  severity: warning
  autofix: false
  detect_lexical: "\\.(each|map|collect)\\s*(do|\\{).*\\.\\w+\\.\\w+"
  fix: Add .includes(:association).
  languages:
  - rails
- id: FIND_EACH
  source: Rails — find_each batch processing (Rails Guides)
  name: Use find_each for batch processing
  tier: performance
  severity: warning
  autofix: false
  detect_lexical: "\\.(all\\.each|where\\(.*\\)\\.each)\\b"
  fix: 'Use .find_each(batch_size: 1000).'
  languages:
  - rails
- id: NO_UPDATE_ATTRIBUTE
  source: Rails — update_attribute skips validations (best practice)
  name: Replace update_attribute with update!
  tier: safety
  severity: error
  autofix: true
  detect_lexical: "\\.update_attribute\\("
  fix: update_attribute skips validations. Use update!
  languages:
  - rails
- id: PLUCK_OVER_MAP
  source: Rails performance — pluck over map(&:attr)
  name: Prefer pluck over map for single columns
  tier: performance
  severity: info
  autofix: false
  detect_lexical: "\\.\\w+\\.map\\(&:\\w+\\)"
  fix: Use .pluck(:column) to avoid AR object instantiation.
  languages:
  - rails
- id: CONST_BY_DEFAULT
  source: Airbnb JS Style Guide — const over let/var
  name: Use const unless reassigned
  tier: style
  severity: warning
  autofix: false
  detect_lexical: "\\blet\\s+(\\w+)\\s*="
  fix: Use const unless the variable is reassigned.
  languages:
  - javascript
- id: OPTIONAL_CHAINING
  source: ECMAScript 2020 — optional chaining (?.)
  name: Use ?. over && chains
  tier: style
  severity: warning
  autofix: true
  detect_lexical: "(\\w+)\\s*&&\\s*\\1\\.\\w+"
  fix: Rewrite to obj?.foo?.bar
  languages:
  - javascript
- id: NULLISH_COALESCING
  source: ECMAScript 2020 — nullish coalescing (??)
  name: Use ?? over || for defaults
  tier: style
  severity: info
  autofix: false
  detect_lexical: "(\\w+)\\s*\\|\\|\\s*\\w+"
  fix: Use ?? when 0 or '' are valid values.
  languages:
  - javascript
- id: TEMPLATE_LITERALS
  source: Airbnb JS Style Guide — template literals (ES6)
  name: Use template literals over concatenation
  tier: style
  severity: warning
  autofix: true
  detect_lexical: '["'']\s*\+\s*\w+\s*\+\s*["'']'
  fix: Use `Hello ${name}!` template literals.
  languages:
  - javascript
- id: ASYNC_AWAIT
  source: ECMAScript 2017 — async/await over raw promises
  name: Prefer async/await over .then chains
  tier: style
  severity: warning
  autofix: false
  detect_lexical: "\\.then\\(.*\\.then\\(.*\\.then\\("
  fix: Use async/await for readability.
  languages:
  - javascript
- id: FOR_OF
  source: Airbnb JS Style Guide — for...of over for...in
  name: Use for...of instead of for...in for arrays
  tier: safety
  severity: error
  autofix: true
  detect_lexical: for\s*\(\s*(const|let|var)\s+\w+\s+in\s+
  fix: for...in iterates prototype properties. Use for...of.
  languages:
  - javascript
- id: QUOTE_VARIABLES
  source: ShellCheck / Google Shell Style Guide — quote variables
  name: Always quote $variables
  tier: safety
  severity: error
  autofix: true
  detect_lexical: (?<!["'\\])\$\w+(?!["'])
  fix: Use "$VAR" to prevent word splitting.
  languages:
  - zsh
- id: DOUBLE_BRACKET
  source: ShellCheck — [[ ]] over [ ] in bash/zsh
  name: Use [[ ]] over [ ]
  tier: safety
  severity: warning
  autofix: true
  detect_lexical: "(?<!\\[)\\[\\s+[^[]"
  fix: Use [[ ... ]] for safe conditionals.
  languages:
  - zsh
- id: DOLLAR_PAREN
  source: ShellCheck SC2006 — $() over backticks
  name: Replace backticks with $(command)
  tier: style
  severity: warning
  autofix: true
  detect_lexical: "`[^`]+`"
  fix: Use $(command) — nestable and readable.
  languages:
  - zsh
- id: IMG_ALT
  source: WCAG 1.1.1 Non-text Content (W3C/WAI)
  name: Require alt on every <img>
  tier: accessibility
  severity: error
  autofix: false
  detect_lexical: "<img\\s+(?![^>]*alt=)"
  fix: Add alt= attribute.
  languages:
  - html
- id: BUTTON_OVER_ANCHOR
  source: WAI-ARIA Authoring Practices — button vs link (W3C)
  name: Use <button> for actions, not <a href="#">
  tier: accessibility
  severity: warning
  autofix: false
  detect_lexical: <a\s+href=["']#["']
  fix: Use <button>. Accessible by default.
  languages:
  - html
- id: ARIA_INTERACTIVE
  source: WAI-ARIA (W3C) — roles for interactive elements
  name: ARIA on non-semantic interactive elements
  tier: accessibility
  severity: warning
  autofix: false
  detect_lexical: "<(div|span)\\s+[^>]*onclick"
  fix: Add role= and tabindex= for accessibility.
  languages:
  - html
- id: LAZY_IMAGES
  source: Web performance — loading="lazy" (web.dev / MDN)
  name: loading="lazy" on below-fold images
  tier: performance
  severity: info
  autofix: true
  detect_lexical: "<img\\s+(?![^>]*loading=)"
  fix: Add loading="lazy".
  languages:
  - html
- id: NO_INLINE_STYLES
  source: CSP / separation of concerns — no inline styles
  name: Replace inline styles with classes
  tier: design
  severity: warning
  autofix: false
  detect_lexical: \bstyle="[^"]*"
  fix: Extract to CSS class.
  languages:
  - html
- id: LOGICAL_PROPERTIES
  source: CSS Logical Properties and Values (W3C)
  name: Prefer logical properties for RTL support
  tier: design
  severity: info
  autofix: true
  detect_lexical: "(margin|padding)-(left|right):"
  fix: Use margin-inline-start/end, padding-inline-start/end.
  languages:
  - css
- id: CLAMP_TYPOGRAPHY
  source: CSS fluid typography — clamp() (web.dev)
  name: Use clamp() for fluid typography
  tier: design
  severity: info
  autofix: false
  detect_lexical: "@media.*\\{[^}]*font-size:"
  fix: 'Use font-size: clamp(1rem, 2.5vw, 1.5rem).'
  languages:
  - css
- id: MEANINGFUL_NAMES
  source: Clean Code — meaningful names (Robert C. Martin)
  name: Names reveal intent
  tier: clarity
  severity: info
  autofix: true
  detect_lexical: "\\b(tmp|temp|data|result|val|ret|obj|str|arr|buf)\\b\\s*="
  fix: Use domain-specific names. user_profile, error_message.
- id: WHY_NOT_WHAT
  source: Clean Code / Code Complete — comments explain why, not what
  name: Comments explain why, not what
  tier: clarity
  severity: info
  autofix: false
  detect_lexical: "#\\s*(increment|set|get|update|return|initialize|create|add)\\s+\\w+"
  fix: Comments should explain intent, not restate the code.
- id: DEAD_CODE
  source: Refactoring — remove dead code (Fowler) / Clean Code
  name: Eliminate unreachable code
  tier: clean_code
  severity: warning
  autofix: true
  detect_lexical: "(return|exit|raise|throw)\\s+.*\\n\\s*\\w+"
  fix: Remove code after return/exit/raise/throw.
- id: TRAILING_COMMAS
  source: Ruby/JS style — trailing commas in multiline literals
  name: Trailing commas in multi-line collections
  tier: style
  severity: info
  autofix: true
  detect_semantic: Does this multi-line collection lack a trailing comma?
  fix: Add trailing comma so additions produce one-line diffs.
- id: TYPOGRAPHIC_EXCELLENCE
  source: Butterick's Practical Typography (Matthew Butterick)
  name: Typographic excellence in user-facing text
  tier: aesthetic
  severity: info
  autofix: true
  detect_lexical: '["'']\.\.\.["'']|["'']--["'']'
  fix: Use ellipsis, em dash, curly quotes in UI strings.
- id: SILENCE_ON_SUCCESS
  source: Unix philosophy — Rule of Silence (no news is good news)
  name: Successful operations produce minimal output
  tier: interface
  severity: info
  autofix: false
  detect_semantic: Does this output say more than necessary for a successful operation?
  fix: Default to silence on success. One line for routine completions.
- id: TYPOGRAPHY_DISCIPLINE
  source: Butterick's Practical Typography (Matthew Butterick)
  name: Hierarchy via weight and brightness, not decoration
  tier: interface
  severity: info
  autofix: true
  detect_lexical: "[-=]{3,}|[╭╮╰╯│─]"
  fix: No ASCII separators. No box drawing. Whitespace is the layout tool.
- id: PRECOMPUTE_MATH
  source: MASTER-native (precompute constant math)
  name: Precompute expensive math
  tier: performance
  severity: info
  autofix: true
  detect_semantic: Are trig functions or noise lookups called per-frame per-object?
  fix: Precompute tables. Cache distance. Use squared distance comparison.
- id: AUDIO_SMOOTHING
  source: MASTER-native (Dilla audio engine)
  name: Smooth audio-reactive visuals
  tier: aesthetic
  severity: info
  autofix: false
  detect_semantic: Do visual elements jump erratically with raw audio data?
  fix: Exponential smoothing. Separate decay rates. Attack-decay envelope.
- id: GRACEFUL_LOAD
  source: Web performance — progressive loading
  name: Degrade quality under load, do not crash
  tier: performance
  severity: warning
  autofix: true
  detect_semantic: Does this run at full quality until it crashes instead of scaling
    down?
  fix: EWMA frame timing. Dynamic resolution scaling. Emergency brake.
- id: ANALOG_WARMTH
  source: MASTER-native (Dilla audio aesthetic)
  name: Perfect is sterile
  tier: aesthetic
  severity: info
  autofix: true
  detect_semantic: Is generated imagery clinically perfect with zero texture?
  fix: Film grain. Vintage lens softness. Subtle color cast.
- id: DOMAIN_LANGUAGE
  source: Domain-Driven Design — Ubiquitous Language (Eric Evans, 2003)
  name: Speak in the vocabulary of the problem, not the implementation
  tier: clarity
  severity: warning
  autofix: false
  detect_semantic: Does this code use generic programming terms (manager, handler,
    processor, data) instead of domain terms (patient, invoice, genome, verdict)?
    Does this legal document use lay terms where precise legal terms exist? Does this
    medical report use colloquial language instead of standard nomenclature?
  fix: Use the ubiquitous language of the domain. Every domain has precise terms —
    use them.
- id: LOAD_BEARING_NAMES
  source: Clean Code — names carry intent (Robert C. Martin)
  name: Names carry structural weight — choose them to bear it
  tier: clarity
  severity: warning
  autofix: false
  detect_semantic: Are names vague, generic, or misleading? Does 'data' mean input,
    output, or both? Does 'process' mean validate, transform, or persist? Does 'miscellaneous'
    appear as a category? In law, are terms used loosely that have precise legal meaning?
    In medicine, is a diagnosis vague where a specific code exists?
  fix: Names are load-bearing walls. They define how people think about the system.
    Choose names that carry the full weight of their meaning.
- id: ERROR_CONTEXT
  source: Error handling best practice — context-rich errors
  name: Every error must carry enough context to locate and understand its origin
  tier: reliability
  severity: warning
  autofix: false
  detect_semantic: Does this error message lack context about where and why it occurred?
    Does this rejection letter fail to state which requirement was not met? Does this
    lab result omit which sample or protocol produced the anomaly?
  fix: Wrap low-level errors with domain context. State what was attempted, what failed,
    and what to do next.
- id: COMMENTS_AS_DEODORANT
  source: Refactoring — comments as deodorant (Fowler/Beck)
  name: Explanations that mask bad structure instead of fixing it
  tier: clean_code
  severity: warning
  autofix: false
  detect_semantic: Is this comment explaining what bad code does instead of rewriting
    the code to be self-evident? In prose, is a footnote compensating for an unclear
    sentence? In a contract, is a definition section papering over ambiguous clauses?
  fix: Rewrite the artifact so explanation is unnecessary. If it needs a comment,
    it needs a rewrite.
- id: POSTEL
  source: Postel's Law / Robustness Principle (Jon Postel, RFC 760/1122)
  name: Be conservative in what you send, liberal in what you accept
  tier: architecture
  severity: info
  autofix: false
  detect_semantic: Does this interface reject valid inputs that differ only in form?
    Does it emit outputs with more precision or structure than callers need? Does
    this protocol refuse valid encodings? Does this form reject data that could be
    safely normalized?
  fix: Accept broadly, emit precisely. Validate structure not style. Normalize on
    the way in.
- id: HYRUM
  source: Hyrum's Law (Hyrum Wright, Google)
  name: All observable behaviors become depended upon at scale
  tier: architecture
  severity: warning
  autofix: false
  detect_semantic: Is this changing an undocumented behavior that callers may rely
    on? Is this removing a side effect that was never specified but may be consumed?
    Is this contract revision eliminating something parties have silently come to
    depend on?
  fix: Treat every observable behavior as a contract once you have users. Deprecate
    explicitly, remove slowly.
- id: LEAKY_ABSTRACTION
  source: Law of Leaky Abstractions (Joel Spolsky, 2002)
  name: All non-trivial abstractions leak
  tier: architecture
  severity: warning
  autofix: false
  detect_semantic: Does this abstraction force the caller to know about implementation
    details? Does the interface require knowledge of underlying protocols, data formats,
    or failure modes it was supposed to hide? Does this clause invoke legal theory
    the reader must independently research?
  fix: Plan for the leak. Document what leaks. Make the happy path abstracted, the
    edge cases explicit.
- id: TEMPORAL_COUPLING
  source: The Pragmatic Programmer — temporal coupling (Hunt & Thomas)
  name: Hidden sequential dependencies are fragile
  tier: design
  severity: warning
  autofix: false
  detect_semantic: Does this require callers to call methods in a specific order without
    enforcing it? Is there an implicit initialization sequence that crashes if violated?
    Does this workflow assume steps execute in a fixed order without encoding that
    order?
  fix: 'Enforce sequencing structurally: pass initialized objects, not bare instances.
    Use builder pattern. Make invalid order unrepresentable.'
- id: HUMBLE_OBJECT
  source: Humble Object pattern (Gerard Meszaros, xUnit Test Patterns)
  name: Separate testable logic from hard-to-test boundaries
  tier: design
  severity: info
  autofix: false
  detect_semantic: Is business logic mixed with IO, UI rendering, or external API
    calls making it untestable? Is decision logic tangled with presentation in a way
    that forces integration tests where unit tests would suffice?
  fix: Extract the logic into a pure object (Humble Object). Keep the IO shell thin
    and untested; test the logic object exhaustively.
- id: FULL_BY_DEFAULT
  source: MASTER-native (no shallow/lite tiers by default)
  name: No fake-choice tiers — defaults are maximal correctness
  tier: design
  severity: warning
  autofix: false
  detect_lexical: "\\b(shallow|standard|quick|lite|basic|light|simple)\\b\\s*[|,)\\]]\\s*\\b(deep|full|advanced|complete|thorough)\\b"
  detect_semantic: Does this API expose a 'do less' tier (shallow/standard/quick/lite/basic)
    alongside a 'do full' tier — where every real user always picks the full one?
    If so, it's a fake choice. Either drop the lower tier and make full the only mode,
    or, if a real cost tradeoff exists, name the tiers honestly (e.g. lexical|structural|semantic)
    so the cost actually being paid is surfaced.
  fix: Drop the degraded tier. If a real cost tradeoff exists, rename to surface the
    cost (lexical < structural < semantic), not the result quality.
- id: PATTERN_EXTRACTION
  source: MASTER-native (extract recurring structure)
  name: File is 80% of the way to a named design pattern
  tier: design
  severity: info
  mode: opportunity
  autofix: false
  principle: Crystallize emergent shape into a name; the right pattern compresses
    code and makes intent legible.
  medium:
  - ruby
  detect_semantic: 'Is this file close to instantiating a known pattern from {Strategy,
    Decorator, Pipeline, Visitor, Builder, Observer, Command, State, Adapter, NullObject}?
    Only flag when extraction would genuinely reduce complexity — never propose a
    pattern that adds ceremony for its own sake. Format: PATTERN:LINE:short reason.'
  fix: Extract toward the named pattern only if the resulting code is simpler than
    the current shape; otherwise leave it.
- id: NULL_BLINDNESS
  source: SQL/Ruby — explicit NULL/nil handling
  name: NULL comparisons must use IS NULL, not = NULL
  tier: safety
  severity: error
  autofix: false
  detect_lexical: "= NULL|!= NULL|== nil.*column|column.*== nil"
  fix: Use IS NULL / IS NOT NULL in SQL; .nil? in Ruby.
- id: SECRET_PROXIMITY
  source: OWASP — no hardcoded secrets/credentials
  name: Hardcoded secrets must move to environment variables
  tier: security
  severity: error
  autofix: false
  detect_lexical: (password|secret|token|api_key|private_key)\s*=\s*['"][^'"]{8,}
  fix: Move secret to environment variable or secrets manager.
- id: MAGIC_COLOR
  source: CSS design tokens — no hardcoded color values
  name: Color values must reference design tokens, not raw hex/rgb
  tier: design
  severity: warning
  autofix: false
  detect_lexical: "#[0-9a-fA-F]{3,6}\\b|rgb\\(|rgba\\(|hsl\\("
  fix: Reference a CSS custom property or design token.
  languages:
  - css
  - scss
  - html
  - javascript
- id: UNBOUNDED_RETRY
  source: Release It! — retry budgets / bounded retries (Nygard)
  name: Retry loops must have a max_attempts cap and backoff
  tier: reliability
  severity: error
  autofix: false
  detect_lexical: "\\bretry\\b|while\\s+true"
  fix: Add max_attempts cap and exponential backoff.
- id: NO_VAR
  source: Airbnb JS Style Guide — no var (ES6 let/const)
  name: var is function-scoped and hoisted — use const or let
  tier: safety
  severity: error
  autofix: true
  detect_lexical: "\\bvar\\s+\\w"
  fix: Use const (default) or let (when reassigned).
  languages:
  - javascript
- id: JS_MODULE_SIZE
  source: JS module size discipline (style)
  name: JS files over 300 lines — split at module boundaries
  tier: clean_code
  severity: warning
  autofix: false
  detect_structural: file_silhouette
  fix: Extract cohesive modules; keep each file under 300 lines.
  languages:
  - javascript
- id: META_CHARSET
  source: HTML Living Standard — <meta charset="utf-8"> (WHATWG)
  name: HTML must declare charset early in <head>
  tier: correctness
  severity: error
  autofix: true
  detect_lexical: "\\A(?!.*<meta\\s+charset=)"
  fix: Add <meta charset=UTF-8> as first element in <head>.
  languages:
  - html
- id: ARIA_LABELS
  source: WCAG 4.1.2 Name, Role, Value (W3C/WAI)
  name: Interactive controls need accessible names
  tier: accessibility
  severity: warning
  autofix: false
  detect_lexical: "<(button|input|select|textarea)\\\\s+(?![^>]*(?:aria-label|aria-labelledby|id=))"
  fix: Add aria-label, aria-labelledby, or id paired with <label for>.
  languages:
  - html
- id: ANTI_DIVITIS
  source: style.yml html.forbidden.divitis / semantic landmarks
  name: Avoid styling-only wrappers and semantic div substitutes
  tier: design
  severity: warning
  autofix: false
  detect_lexical: <div\\s+class="(header|footer|nav|main|sidebar|article|section)"
  fix: Use semantic landmarks; flatten nesting beyond three divs.
  languages:
  - html
- id: BEM_IN_VIEWS
  source: style.yml bare_tag_targeting — no BEM in ERB
  name: No BEM class soup in views
  tier: design
  severity: warning
  autofix: false
  detect_lexical: class=["'][^"']*__[^"']*["']
  fix: Target bare tags in SCSS; remove __block__element classes from ERB.
  languages:
  - html
- id: UTILITY_CLASS_SOUP
  source: style.yml html.forbidden.framework_class_explosion
  name: No framework utility class explosion
  tier: design
  severity: warning
  autofix: false
  detect_lexical: class=["'][^"']*(?:\b(?:mt|mb|col|row|d-flex)\b[^"']*){3,}
  fix: Move layout to SCSS with bare tag targeting.
  languages:
  - html
- id: SKIP_TO_MAIN
  source: WCAG 2.4.1 Bypass Blocks / style.yml accessibility
  name: Layouts expose skip link to main content
  tier: accessibility
  severity: warning
  autofix: false
  detect_lexical: "\\A(?!.*(?:skip|#main-content))"
  fix: 'Add skip link to #main-content in layout.'
  languages:
  - html
- id: NO_LONG_TRANSITION
  source: style.yml motion budget / FrontendRuleSet MOTION
  name: UI transitions stay under 300ms
  tier: performance
  severity: warning
  autofix: false
  detect_lexical: transition(?:-duration)?\s*:\s*([4-9]\d\d|\d{4,})\s*ms
  fix: Keep transitions ≤300ms.
  languages:
  - css
- id: REDUCED_MOTION
  source: WCAG 2.3.3 Animation from Interactions
  name: Animations respect prefers-reduced-motion
  tier: accessibility
  severity: info
  autofix: false
  detect_lexical: "@keyframes|animation\\s*:"
  fix: 'Add @media (prefers-reduced-motion: reduce) override.'
  languages:
  - css
- id: STIMULUS_CONTROLLER_SIZE
  source: style.yml interaction.minimal_js_default
  name: Stimulus controllers over 200 lines — split
  tier: density
  severity: warning
  autofix: false
  detect_structural:
    max_lines: 200
    path_pattern: _controller\.js$
  fix: Split controller at 200 lines.
  languages:
  - javascript
- id: NO_COLUMN_ALIGN
  source: Ruby Style Guide / RuboCop Layout — no token alignment
  name: One space before operators — no column padding
  tier: density
  severity: info
  autofix: true
  detect_lexical: "\\S {2,}(?:=>|[^=!<>]=[^=>]|:\\s)"
  fix: Remove padding; one space before operators. Column alignment decays and hides
    diffs.
- id: RUBY_SNAKE_METHODS
  source: Ruby Style Guide / RuboCop Naming/MethodName
  name: Methods and variables use snake_case, never camelCase
  tier: clean_code
  severity: warning
  autofix: false
  detect_lexical: "\\bdef\\s+[a-z][a-z0-9_]*[A-Z]"
  fix: 'Rename to snake_case: def fetchAlbum -> def fetch_album.'
  languages:
  - ruby
- id: RUBY_CAMEL_CLASS
  source: Ruby Style Guide / RuboCop Naming/ClassAndModuleCamelCase
  name: Classes and modules use CamelCase, no underscores
  tier: clean_code
  severity: warning
  autofix: false
  detect_lexical: "^\\s*(class|module)\\s+([a-z]|[A-Z]\\w*_)"
  fix: 'Rename to CamelCase: class Album_store -> class AlbumStore.'
  languages:
  - ruby
- id: RUBY_SCREAMING_CONST
  source: Ruby Style Guide / RuboCop Naming/ConstantName
  name: Value constants use SCREAMING_SNAKE_CASE
  tier: clean_code
  severity: info
  autofix: false
  detect_semantic: Is a non-class/non-module constant named in any case other than
    SCREAMING_SNAKE_CASE?
  fix: 'Rename: MaxRetries -> MAX_RETRIES. CamelCase is for classes/modules only.'
  languages:
  - ruby
- id: RUBY_NUMERIC_UNDERSCORE
  source: Ruby Style Guide / RuboCop Style/NumericLiterals
  name: Separate large numeric literals with underscores
  tier: clarity
  severity: info
  autofix: true
  detect_lexical: "[^\\d_.]\\d{5,}(?![\\d_])"
  fix: 'Group digits in threes: 1000000 -> 1_000_000.'
  languages:
  - ruby
- id: RUBY_SYMBOL_TO_PROC
  source: Ruby Style Guide / RuboCop Style/SymbolProc
  name: Use &:method for single-method blocks
  tier: density
  severity: info
  autofix: true
  detect_lexical: "\\{\\s*\\|(\\w+)\\|\\s*\\1\\.[a-z_]+\\s*\\}"
  fix: Collapse { |x| x.name } -> (&:name).
  languages:
  - ruby
- id: RUBY_BLOCK_DELIMITER
  source: Ruby Style Guide / RuboCop Style/BlockDelimiters
  name: Braces for single-line blocks, do/end for multi-line
  tier: clarity
  severity: info
  autofix: false
  detect_lexical: "\\bdo\\b\\s*(\\|[^|]*\\|)?[^\\n]*\\bend\\s*$"
  fix: Single-line block on one line -> use { }. Reserve do/end for multi-line.
  languages:
  - ruby
- id: RUBY_TERNARY_NOT_NESTED
  source: Ruby Style Guide / RuboCop Style/NestedTernaryOperator
  name: No nested ternaries; ternary only for simple single conditionals
  tier: clarity
  severity: warning
  autofix: false
  detect_lexical: "\\?[^?:\\n]*\\?[^?:\\n]*:[^?:\\n]*:"
  fix: Expand nested ternary to if/elsif/else or a case.
  languages:
  - ruby
- id: EN_DASH_RANGE
  source: Bringhurst, Elements of Typographic Style — en dash for ranges
  name: Use an en dash for numeric and date ranges
  tier: aesthetic
  severity: info
  autofix: true
  detect_lexical: "\\b\\d+\\s?-\\s?\\d+\\b"
  fix: 'Ranges take an en dash, not a hyphen: 45-75 -> 45–75.'
  languages:
  - prose
  - markdown
- id: MEASURE_OPTIMUM
  source: Bringhurst, Elements of Typographic Style — the measure (45–75 chars)
  name: Cap text measure near 66 characters per line
  tier: aesthetic
  severity: info
  autofix: false
  detect_lexical: max-width:\s*([89]\d{2}|\d{4,})px
  fix: Bound running-text columns to ~66ch (≈ 33rem), not wide px values.
  languages:
  - css
