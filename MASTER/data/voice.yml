# Voice output rules — extracted from rules.yml (scan corpus stays in rules.yml).
# TTS synthesis policy: Ruby (speech.rb, tts_controller) and JS (face_speech_runtime.js) read `tts`.
# Persona registries (personas.yml, soul.yml) affect LLM text/style only when persona_affects_text_only is true.
# Engine chain / transcendent mode: data/tts.yml (not used by web TtsJob). VPS env: OPENBSD/etc/rc.d/master.
tts:
  # MASTER speaks English in an American woman's voice. Operator decision
  # 2026-09-12, asked for as US English and female.
  #
  # en-US-JennyNeural is an English (United States) neural voice, so the accent
  # is the locale's own rather than a second language reading English — which is
  # why soul.yml keeps language.primary: english and moves only `dialect`, to
  # american.
  #
  # A name lives in more places than the value, and every earlier voice change
  # left the tree disagreeing with itself by moving one of them. So this pass
  # moves the registry with the value: policy.rb's fallbacks, personas.yml's
  # header, agent_map.yml's note, soul.yml's voice, tts_voice and dialect, the
  # idle signatures in expression.rb and face.part1.txt, the JS fallback in
  # face_speech_runtime.js and face.runtime.js, and the assertions in
  # test_yaml_registries.rb.
  single_voice: jenny
  neural: en-US-JennyNeural
  # Two mouths, one script. Operator decision 2026-09-13.
  #
  # single_voice stays the contract and stays jenny: every reader still agrees
  # with it, an absent or single-entry rotation changes nothing downstream, and
  # the browser payload carries both so the face rotates with the server rather
  # than drifting from it.
  #
  # This is NOT a persona list. personas.yml affects LLM text only, and
  # persona_affects_text_only above is still true; a rotation changes which
  # mouth says the same sentence and nothing about what the sentence is.
  #
  # Chosen at random per utterance rather than round-robin. A session is not a
  # sequence anybody counts, and strict alternation makes the pattern audible,
  # which draws attention to the mechanism instead of the words.
  rotation:
    - jenny
    - christopher
  persona_affects_text_only: true
  # ON as of 2026-08-14. pushLiveStreamTts (face.part1.txt) pulls each finished
  # sentence off the model's stream and speaks it while the rest is still being
  # generated. With this false, nothing is spoken until the whole reply has been
  # generated AND the whole thing synthesised — two serial waits before any
  # sound, on a box with one CPU.
  #
  # Measured on the live box, same text, /chat/tts round trip:
  #
  #   idle          four sentences 3.05s   one sentence 2.16s
  #   under deploy  four sentences 19.31s  split by sentence: first audio 1.98s,
  #                 all four done by 8.6s
  #
  # So splitting is never worse and is dramatically better exactly when the box
  # is busy, which is when the wait is noticed. It also removes the whole
  # generation time from the wait, which no synthesis tuning can.
  #
  # It was `false` because it shipped as opt-in ("optional /voice stream on",
  # c129719c2), not because it broke. The guards were already here: listings are
  # not spoken mid-stream (looksLikeListingStream), and fragments below
  # TTS_MIN_CHUNK are held back. `/voice stream off` still turns it off per
  # browser, and that preference wins over this default.
  stream_live_default: true
  # With persona_affects_text_only these two ARE the effective rate/pitch for
  # every utterance (Personality#browser_profile substitutes them for the
  # persona's own).
  #
  # Neutral, because this voice has not been heard yet. Rate and pitch tuning
  # does not survive a voice change: -4% was measured on Ezinne, -35Hz on Osman
  # before her, and the -20Hz before that was picked for en-GB Ryan and then
  # carried onto a Norwegian voice it had never been heard on. Roughly ±15% rate
  # and ±50Hz is where Azure neural voices stay natural, so whoever reads the
  # README aloud on Jenny has room to move these.
  default_rate: "+0%"
  default_pitch: "+0Hz"

  # What the voice is put through after synthesis. Operator decision 2026-09-13,
  # chosen by ear on a live session.
  #
  # Edge returns a bare neural voice at roughly broadcast level and no shaping
  # of its own, so everything below is post. The chain is dilla's, borrowed
  # rather than invented: `STUDIO/dilla/dilla.rb:2719` carries a vocoder wash
  # built as three resonant peaks near the vowel formants — 520, 1480 and 2520
  # Hz — and its own comment says it is only the formant HALF of a vocoder,
  # "because a real vocoder needs a modulator the renderer does not have".
  #
  # A speaking voice is the modulator that renderer lacks. Those peaks were
  # tuned for a synth pad and land on speech for the first time here: the
  # formants sit where a voice already puts its energy and lift it.
  #
  # loudnorm BEFORE the gain, and the gain before the limiter. Normalising
  # first brings quiet sentences up to meet loud ones rather than only lifting
  # peaks; gain after a limiter is distortion rather than loudness.
  #
  # A reader that cannot run ffmpeg should skip the chain and speak dry. A
  # missing filter must cost the effect, never the sentence.
  post_chain: "equalizer=f=520:t=q:w=1.1:g=4.5,equalizer=f=1480:t=q:w=1.3:g=3.6,equalizer=f=2520:t=q:w=1.5:g=2.8,chorus=0.5:0.7:19|27:0.3|0.26:0.24|0.2:0.9|1.4,aphaser=type=t:speed=0.12:decay=0.3:delay=2.4,highpass=f=200,lowpass=f=6000,loudnorm=I=-9:TP=-0.5:LRA=7,volume=8dB,alimiter=limit=0.98"

  # The bed under the speech, so a pause is not silence.
  #
  # dilla's own maj7_minor_cycle — Dbmaj9, Cm9, Fm9, Bbm9, four seconds each —
  # from CHORD_PROGRESSIONS at `STUDIO/dilla/dilla.rb:11423`, which the engine
  # lists under ARTIST_VERIFIED_PROGRESSIONS. A verified progression rather than
  # an invented one is the difference between a bed and a drone.
  #
  # -14dB, not lower. At -26 it mixed correctly and was inaudible, which is the
  # same as not running.
  bed:
    # The chords are dilla's, and only the ones he actually played.
    #
    # dilla keeps two tables. CHORD_PROGRESSIONS has 242 entries and most are
    # theory — cycles, ladders, whole-tone bridges — which under speech sound
    # like an exercise. ARTIST_VERIFIED_PROGRESSIONS is the short one, and every
    # row is transcribed from a record with the artist and title attached. Five
    # of those rows are Fantastic Vol 2: Fall in Love twice, Get Dis Money twice,
    # Climax. That album and Flying Lotus's Los Angeles are the target.
    #
    # It is a smaller world on purpose. Twelve chords drawn from eight verified
    # progressions repeat far more than twelve drawn from two hundred, and
    # repetition is what a loop is for.
    source: STUDIO/dilla/dilla.rb
    progressions: artist_verified
    records: ["Slum Village - Fantastic Vol 2", "Flying Lotus - Los Angeles"]
    bpm: 88
    # Two bars each is a march, and a march is what a machine writes. The meter
    # runs two, two, one, three, so the harmony arrives early once and then
    # hangs. The drums keep their own four-bar count, so the two cycles only line
    # up every twelve bars. That drift is the point.
    meter: [2, 2, 1, 3]
    chords_per_pass: 12
    gain_db: -14
    # Open voicings, not clusters. Forcing every note into one octave stacks
    # seconds and a ninth chord comes out as a smear; these spread, with at least
    # a minor third between neighbours, the way a player lays them out.
    voicing: { spread_semitones: 3, bass_range: [33, 45], upper_range: [52, 84] }
    # The oscillators render at four times the sample rate and come back down
    # through the resampler. A saw or square written as a modulo has a vertical
    # edge, so every harmonic above 22 kHz folds back as an inharmonic tone;
    # sixteen of them is a field of bleeps that moves with the notes.
    oversample: 4
    # Treat the progression as a sample, because that is what Dilla did to one.
    #
    # He did not play a loop through. He chopped it, put the chops back in a
    # different order, repeated one, dropped one, ran one backwards, and let a
    # chop cut a note off where it fell. The result still sits on the grid but
    # the harmony arrives in an order nobody wrote, which is most of why those
    # records sound like they do. Chops stay on bar lines so the drums still
    # land where they should, and the total length is preserved.
    chop:
      unit: bar
      orders: [[0, 1, 2, 3], [0, 0, 1, 2], [0, 1, 0, 1], [0, 2, 1, 3], [0, 1, 3, 2], [3, 1, 2, 0]]
      reverse_odds: 0.12
    # Three instruments, not sixteen sounds. A patch list is a menu; a family is
    # an instrument you recognise across several settings, which is what makes a
    # record sound like a band rather than a preset browser. The family rotates
    # chord by chord, not the preset.
    #
    #   rhodes   struck, not blown: fast attack, inharmonic partials from the
    #            tine, no filter sweep. FM is the only honest way to get those
    #            partials out of an oscillator, which is why every digital
    #            Rhodes since the DX7 has been FM.
    #   moog     three detuned saws, a 24 dB ladder, a resonant cutoff low
    #            enough to hear it move, a slow attack — the character is the
    #            filter chasing a bowed note and never arriving.
    #   prophet  the poly answer: two to four detuned oscillators and a pulse
    #            width never quite square, which is why its pads are wide where
    #            the Moog is thick.
    families: [rhodes, moog, prophet]
    patches:
      - { name: rhodes mk1,        family: rhodes,  wave: fm_wood,  cutoff: 1400, res: 2.0, attack: 0.04, voices: 2, sub: true }
      - { name: rhodes suitcase,   family: rhodes,  wave: fm_bell,  cutoff: 1500, res: 1.5, attack: 0.05, voices: 3, sub: true }
      - { name: rhodes bark,       family: rhodes,  wave: fm_glass, cutoff: 1200, res: 3.5, attack: 0.03, voices: 2, sub: false }
      - { name: rhodes soft,       family: rhodes,  wave: sine,     cutoff: 1100, res: 1.0, attack: 0.09, voices: 3, sub: true }
      - { name: moog bowed,        family: moog,    wave: saw,      cutoff: 900,  res: 5.5, attack: 1.4,  voices: 3, sub: true }
      - { name: moog bassoon,      family: moog,    wave: square,   cutoff: 560,  res: 8.5, attack: 0.6,  voices: 2, sub: true }
      - { name: moog horn,         family: moog,    wave: saw,      cutoff: 780,  res: 6.5, attack: 1.1,  voices: 3, sub: true }
      - { name: moog reed,         family: moog,    wave: pulse,    cutoff: 1050, res: 7.0, attack: 0.5,  voices: 3, sub: false }
      - { name: prophet strings,   family: prophet, wave: saw,      cutoff: 1050, res: 4.0, attack: 2.0,  voices: 4, sub: false }
      - { name: prophet pwm,       family: prophet, wave: pulse,    cutoff: 1300, res: 3.5, attack: 0.8,  voices: 4, sub: false }
      - { name: prophet brass,     family: prophet, wave: saw,      cutoff: 1450, res: 5.0, attack: 0.35, voices: 3, sub: true }
      - { name: prophet choir,     family: prophet, wave: triangle, cutoff: 1200, res: 2.5, attack: 1.7,  voices: 4, sub: false }
    # Four racks for the pads, one picked per pass. A rack is a whole signal
    # path, not a setting, and they rotate for the same reason the patches do.
    # Every one ends in the same tail — lowpass, low-mid lift, limiter — because
    # whatever happens upstairs the bed has to stay smooth enough to talk over.
    # The strangeness is in the middle, never at the output.
    #
    #   wash      dilla's vocoder formants and chorus. The house sound.
    #   shimmer   the pad copied, pitched up an octave and sent into a long
    #             feedback delay under itself. This is the trick behind every
    #             angelic pad ever made: the same chord an octave up arriving
    #             late and blurred, which the ear reads as a choir.
    #   spectral  magnitudes kept, phases thrown away, window by window.
    #             Discarding phase is what makes a sound lose its attack and its
    #             place in time — it stops being played and starts being
    #             remembered.
    #   alien     the whole spectrum shifted by 3 Hz. Not transposed: every
    #             partial moves by the same NUMBER of hertz rather than the same
    #             ratio, so the harmonic series is destroyed and the overtones
    #             belong to no note at all.
    # Two racks, not four. A rack that shifts the whole spectrum by a few hertz,
    # or throws the phases away window by window, is interesting and is wrong on
    # the chords: both destroy the harmonic series, and the harmony is the
    # beautiful part. They stay on the lead, which is sparse enough to be strange.
    pad_racks: [wash, shimmer]
    # Hocket II, properly: eight channels, each its own oscillator, octave,
    # stereo position and decay, so a phrase of eight notes is eight instruments
    # passing a melody between them and no two consecutive notes come from the
    # same place. Pan is applied as an equal-power pair.
    hocket_channels: 8
    # About one chord in three hockets: the notes stop arriving together, each
    # entering on its own sixteenth and holding, so the chord assembles in front
    # of you rather than being struck. Every chord doing it is an arpeggio, and
    # an arpeggio under speech is a competing melody.
    hocket_odds: 0.33
    reverse_odds: 0.17
    # MIDI Bag: record, then retrieve. The device stores notes as they are played
    # and triggers what is stored when new MIDI arrives — so what you hear is not
    # this chord, it is a chord from earlier retriggered by the rhythm of now. It
    # is the only thing in the bed with a memory. Filtered to the pitch classes
    # the current chord and the next one share, so what comes out still belongs
    # where it lands.
    bag_depth: 3
    lead:
      reference: ringtone_tools
      rhythm_from: bar_shape
      pitch_from: chord_bag
      # Bach states his figure three times at successively lower pitches. A
      # three-note shape is taken from the bag and restated lower on each entry,
      # intervals kept and the start falling. Random pitches are decoration, and
      # decoration with nothing to follow is what boring sounds like.
      motive: { notes: 3, statements: 3, direction: descending }
      plays_odds: 0.25
      gain_db: -7
      # Four racks, rotating per bar, and the lead is the one voice allowed to be
      # strange — it plays one bar in four, so it can afford two of everything.
      # Two phasers at different rates beating against each other is the
      # difference between an effect and a texture: one is a sweep you can
      # follow, two is weather.
      racks: [tape, weather, octave, inharmonic]
    # The pads and the lead duck under the kick, keyed on the kit itself, so the
    # pumping follows what the drummer just played rather than a fixed rate.
    sidechain:
      pads: { threshold: 0.055, ratio: 7, attack_ms: 4, release_ms: 190, makeup: 1.6 }
      lead: { threshold: 0.08, ratio: 4, attack_ms: 3, release_ms: 150, makeup: 1.2 }
    # One master bus, and everything crosses it.
    #
    # Three sources coloured three different ways do not sound like one record —
    # they sound like three recordings played together. The mix takes dilla's
    # Sonitex at the subtle preset: the same flow as the kit gets, but 14-bit at
    # an 18 percent blend instead of 12 at 52, because the kit has already been
    # through the hard version and running it twice at full strength is mud.
    # Constants from SONITEX_PRESETS[:subtle] at dilla.rb:10062.
    master_bus: { preset: subtle, drive: 1.25, crush_bits: 14, crush_mix: 0.18, width: 1.08, limit: 0.92 }
    # The tilt, measured against a reference rather than chosen by ear.
    #
    # Nine octave bands of this bed were compared with a professional record and
    # the deltas inverted what the ear said. The problem was never a dull top:
    # relative to its own sub the bed ran 4 dB hot at 350 Hz, 6.8 at 700, 7.3 at
    # 1.4 k and 6.4 at 2.8 k while sitting 3.6 dB light at 85 — a thin kick under a
    # cluttered midrange, which is what an amateur mix is, and which no amount of
    # choosing filters by ear would have found.
    #
    # Seventy percent of each delta is applied. A full correction chases the
    # reference into its own arrangement, and this one has speech on top of it.
    #
    # The tilt sits AFTER the output compressor and before the limiter, which is
    # the mastering order and not a detail: with the compressor downstream, its
    # makeup gain simply put the cut midrange back.
    #
    # Measuring one render against another measures nothing, because every pass
    # picks different progressions, patches, racks and shapes. The only comparison
    # that means anything is the same audio with and without the filter.
    tilt:
      applied_fraction: 0.7
      position: after_compressor
      bells:
        - { hz: 85,    octaves: 1.0, gain_db: 2.5 }
        - { hz: 350,   octaves: 1.2, gain_db: -2.8 }
        - { hz: 700,   octaves: 1.2, gain_db: -4.8 }
        - { hz: 1400,  octaves: 1.2, gain_db: -5.1 }
        - { hz: 2800,  octaves: 1.2, gain_db: -4.5 }
        - { hz: 5600,  octaves: 1.2, gain_db: 0.5 }
        - { hz: 11000, octaves: 1.2, gain_db: 5.0 }
    # Vinyl, under everything, all the time.
    #
    # Dilla sampled off records, Madlib works off an SP-303 and a stack of vinyl,
    # and Theo Parrish is described as lumpy drums, detuned keys, hissing hats,
    # vinyl noise and very loose loops, his beats finger-drummed in takes rather
    # than programmed. The imperfection is not a garnish on that sound, it is the
    # sound, and it is the one thing filtering an oscillator will never produce: a
    # synth is silent between the notes and a record never is.
    dust: { hiss_db: -30, crackle_db: -14, band_hz: [900, 7000] }
    drums:
      reference: dilla_time
      kit: karriem_riggins
      # The kit is recordings, not arithmetic.
      #
      # Everything else here synthesises — an oscillator, a filter, an envelope —
      # and that is how you make a sound, not how you make a drum. A real kick is
      # a beater on a head in a room through a microphone onto tape and then
      # through a sampler, and every stage is in what you hear. dilla keeps a
      # crate; these are its files, triggered, each hit delayed to its place and
      # scaled by its velocity. The pattern stays ours, the sound is a record.
      crate: STUDIO/dilla/samples/drums
      samples: { kick: kick.wav, snare: snare.wav, ghost: ghost.wav, hat: hat.wav, open_hat: open_hat.wav, clap: ind_clap.wav }
      # The accent contour, the other half of why a hand sounds different from a
      # grid: downbeats hard, the sixteenths between them soft. Not a random
      # velocity per hit, which is noise. A shape.
      hat_accents: { downbeat: 0.95, eighth: 0.7, sixteenth: 0.45, jitter: 0.3 }
      finish: sonitex_sp1200
      machines: [sp1200, mpc3000]
      gain_db: -5
      # Three banks, and which one a four-bar block takes is the arrangement.
      # Techno carries most of it — the kick as a clock rather than an event —
      # because a rigid floor is what the swing and the lay-back in feels are
      # heard against. That is the conflict Dilla Time describes with the rigid
      # part moved from the hats to the kick. Dilla's eight are the relief, and
      # the Flying Lotus six are rare: a bed made mostly of broken bars is a bed
      # nobody can talk over.
      banks: { techno: 4, dilla: 8, flylo: 6 }
      arrangement: { bars_per_shape: 4, variation_bar: 4 }
      shapes: [so far, workin, runnin, the light, stakes, dont cry, fall in love, two turntables,
               flylo triplets, flylo double time, flylo hole, flylo displaced, flylo stagger, flylo drift,
               techno floor, techno offbeat, techno rolling, techno broken]
      # Charnas's claim is precise and it is not loose drums. Before Dilla there
      # were two time-feels: straight, where the beats are even, and swing, where
      # they are not. What Dilla did with the MPC's swing and shift was run both
      # at once — some elements rigid on the grid, others pulled off it, so the
      # parts disagree and the ear cannot resolve them into one feel. He pushed
      # snares forward so they sounded rushed and let kicks lag. The friction is
      # the music, and none of it was accidental, which is why this is a table
      # rather than a random walk.
      #
      # seconds; shift is negative for early, positive for late
      feels:
        hat:   { swing: 0.0,  shift: 0.0,    drift: 0.0 }
        snare: { swing: 0.0,  shift: -0.014, drift: 0.002 }
        kick:  { swing: 0.17, shift: 0.016,  drift: 0.004 }
        ghost: { swing: 0.17, shift: 0.026,  drift: 0.004 }
      # Three layers, because one oscillator is a tone and three are a drum. The
      # punch is the layer the ear reads as hard; the click is what carries the
      # hit through speech at bed level. What it is not is a bass note: an 808
      # ring under the sub made it one, because a 42 Hz sine held for three
      # quarters of a second IS a bass note whatever it is labelled.
      #
      # Every envelope clamps its span at zero. exp() is evaluated across the
      # whole bar including the seconds before the hit, where the exponent is
      # large and positive; at these decay rates it overflows to infinity, the
      # gate multiplies that by zero, and the bar comes out NaN — silent and
      # clipped. Five bars in six were doing exactly that.
      kick:
        envelope_span: clamped
        sub: { hz: 45, fall_ms: 11, phase: integrated }
        punch: { hz: 112, fall_ms: 6, phase: integrated }
        drive_db: 11
        click: { source: anoisesrc, band_hz: [2000, 7000], gain_db: -8 }
      # The doubled snare — a second hit a sixteenth behind the backbeat, quieter
      # — is the single most recognisable thing in his drums.
      snare:
        source: anoisesrc
        body_hz: [120, 340]
        rasp_hz: [600, 2400]
        double_velocity: 0.55
        ghost_velocity: [0.22, 0.34]
      # anoisesrc rather than random() inside an aeval expression, because a
      # declared source states its colour and amplitude. Not because random() is
      # fake: measured at entropy 0.84 and flat factor 0, it is real noise, and
      # dilla uses it for tape hiss. The old hats were simply far too bright and
      # the snare underneath them was made of sine waves.
      hat: { source: anoisesrc, band_hz: [4000, 9000], gain_db: -17, open_odds: 0.35 }
      # Sonitex STX-1260, sp1200 preset, with dilla's own measured constants from
      # dilla.rb:10033 — compressor, tape saturation between pre- and
      # de-emphasis, vinyl bandwidth with a resonant head bump, wow and flutter,
      # the sampler at 12 bits and 26.09 kHz, then an output limiter. Its
      # numbers, not ours: changing them changes a rendered sound.
      sonitex: { preset: sp1200, crush_bits: 12, crush_hz: 26095, crush_mix: 0.52, head_bump_hz: 58, drive: 1.45 }
      # The 12 ms fade is not cosmetic: every envelope is cut at the bar line and
      # a decay truncated mid-flight is a step discontinuity, which is a click on
      # every join, once a bar, all session.
      bar_end_fade_ms: 12
  # No default_volume. The daemon protocol is {voice,rate,pitch,text} and
  # RbEdgeTTS::Communicate takes rate: and pitch: only, so a volume here was
  # read by nothing for as long as it existed. Adding one back means
  # extending the worker protocol first, and that changes how loud MASTER
  # is, which is an operator decision rather than a wiring one.
  # edge-tts --volume. The browser chain is the other half of "louder"
  # (face_speech_runtime.js: masterGain 1.9 -> 3.4, partial no longer played at
  # 0.85); this raises the synthesised signal itself rather than only its
  # playback gain, so the two do not fight for the same headroom.

voice:
  style: openbsd_dmesg
  # anti_simulation lives once, in soul.yml absolute.anti_simulation. The
  # copy that stood here was a shadow the accessor only read if soul lost
  # the key — and it had already drifted one word from the original.
  banned_output:
    - headlines
    - section_markers
    - bullet_lists_without_content
    - filler_phrases
    - hedging
    - sycophancy
  strunk:
    preambles: ["In summary,", "Consequently,", "Therefore,", "Notably,", "Importantly,"]
    hedges: ["I think that", "I believe", "will", "would", "might", "could", "perhaps", "seems", "appears"]
    endings: ["as a result.", "for this reason.", "thus.", "in effect.", "accordingly."]
    code_preambles: ["# TODO: clarify intent", "# FIXME: review edge cases", "# NOTE: performance considerations", "# HACK: temporary workaround", "# REVIEW: assess after refactor"]
    apply_to: [prose, comments, documentation, strings]
    never_apply_to: [code_logic, algorithms, data_structures]
    safeguards:
      - never_delete_variable_names
      - never_delete_function_calls
      - never_simplify_conditional_logic
      - never_collapse_diagnostic_output
  inverted_pyramid:
    - "Lead with the outcome."
    - "Provide key evidence next."
    - "Add implementation detail last."

  preserve:
    boot_message: "5-line dmesg style, never collapse to one line"
    diagnostic_output: "structured multi-line output is intentional, never compress to abbreviations"
    help_text: "include command name, description, and at least one example"
    spinner_feedback: "show elapsed time and status, do not remove progress indicators"
    refinement_scope:
      streamline: "remove redundancy, not information"
      polish: "refine wording, not delete output"
      minimize: "applies to prompt tokens, not diagnostic output"
