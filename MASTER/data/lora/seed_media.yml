# The wardrobe. Every garment alone on the one backdrop above, so the clothes
# are the only thing that changes between seventeen photographs.
#
# `garment` is prepended to the backdrop clause at render time rather than
# written out seventeen times, because the backdrop is the constant and
# restating it is how two of the seventeen would end up subtly different.
