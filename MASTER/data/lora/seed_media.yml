      A 28-year-old Norwegian woman with auburn hair in a loose braid, an editor,
      sitting on a bench at the Fløyen viewpoint before breakfast with a paperback
      and a thermos cup, quiet smile, early overcast light, Bergen harbour soft
      far below, 85mm at f/2 from three metres, natural skin texture
    bergen-dating-magnus: >-
      A 24-year-old man of Eritrean-Norwegian heritage with short twists, a
      psychology student, sitting on stone steps outside a university building
      with an acoustic guitar across his knees, laughing mid-strum, flat grey
      Bergen daylight, 50mm at f/2.8 from two and a half metres
