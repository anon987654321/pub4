# Every photograph the three RAILS apps seed with, as a prompt.
#
# Sibling to ideas.yml and built on the same conviction: a prompt names a real
# light, a real distance and a real subject, because that is the part a
# diffusion model can act on. "Beautiful lighting" gets the average of
# everything it has seen.
#
# Two lanes render it. _toolkit/run_seed_media_replicate.rb pays per frame on
# Replicate and needs nothing else; _toolkit/run_seed_media_colab.rb writes a
# notebook for a free GPU session. Both write <key>.jpg, and
# _toolkit/install_seed_media.rb files the graded frame where the app looks.
# Shared::DemoMedia tries the catalogue before picsum, so a key that has a file
# is seeded from it with no change to the seeders.
#
# Three populations, three rules, and they do not mix:
#
#   dating   General-model strangers, every one an adult with a stated age and
#            matched to the bio it illustrates. No subject adapter: the seeds
#            publish on public hosts, and ragnhild and johann are real people
#            whose likeness is theirs to publish, not a seed's.
#   amber    No face anywhere. Each garment alone on one backdrop, so
#            seventeen items are comparable rather than seventeen unrelated
#            stock photographs.
#   scene    No adapter. The picture comes from what the post actually says --
#            a thread about fog over Vagen gets fog over Vagen, not "Norway".
#
# Prompting follows MASTER/tools/lora/README.md, which is measured rather than folklore:
# Subject + Action + Style + Context with the subject first; 30-80 words, a real
# ceiling and not a style note; hex codes instead of colour words; a named body
# and aperture; and subject DISTANCE, because perspective distortion is a
# function of distance alone and no grade corrects a face shot from 40 cm.
#
# No negative prompts anywhere. FLUX has no negative conditioning, so what would
# have been a negative is folded into the positive instead.

meta:
  base: flux1-dev
  # The Replicate lane. A general photoreal model with no adapter slot, which is
  # the point for a public seed.
  replicate_model: black-forest-labs/flux-1.1-pro
  # nf4 on a free Colab T4: 16 GB of Turing with no bf16 cannot hold FLUX.1-dev's
  # 23.8 GB fp16, which is the whole reason colab_render.ipynb fell back to SDXL.
  # Quantised it fits, renders slower, and is still FLUX and still her adapter.
  quantize: nf4
  guidance: 3.5
  steps: 28
  # Set per entry where it matters; this is the fallback.
  aspect_ratio: "3:2"
  postpro: landscape

# One backdrop for the whole wardrobe, stated once and appended to every
# garment, so the clothes are the only thing that changes between frames.
#
# A flat lay rather than a figure. It shows the garment and nothing else, and it
# means amber ships no likeness at all, which is the honest default for someone
# else's clothes. Kept short because it is spent on every garment.
backdrop: >-
  laid flat and neatly styled on a warm off-white #F2EFE9 linen backdrop, shot
  from directly above, soft north window light from camera-left, true colour,
  Hasselblad X2D 90mm at f/8, no person, no text

# The dating app. Each profile is written against its bio in
# RAILS/brgen/lib/brgen/bergen_demo_data.rb -- the age, the job and the part of
# town -- so the picture and the words describe one person.
#
# Two to three metres on every one. A dating profile shot at arm's length reads
# as a phone selfie because it IS one, and that is a projection rather than a
# rendering -- no grade reaches it.
#
# `pool` is the set the bulk Faker seed draws from by gender, so a generated
# profile gets a photograph of a person rather than a picsum landscape.
dating:
