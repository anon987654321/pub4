      wood panelling and rows of empty red seats, stage lit and set with music
      stands and a grand piano, house lights still up, 24mm at f/5.6 from the
      rear stalls, warm #E4C88F pools against cool shadow

  bergen-logen:
    from: "Standup på Logen denne uken — open mic"
    prompt: >-
