# Kernel axioms — enforced by scan rules, pipeline stages, or tool guards
kernel:
  PRESERVE_FIRST: "Never break working code. Read before write."
  SIMPLEST_WORKS: "Fewest moving parts that solve the problem."
  FAIL_VISIBLY: "Errors surface immediately. Never swallow exceptions."
  ONE_SOURCE: "One authoritative representation per concept."
  DECOUPLE: "Hidden dependencies become explicit."
  GUARD_EXPENSIVE: "Check preconditions before costly work."
  DEGRADE_GRACEFULLY: "Works with partial failures."
  BE_CONCISE: "No unnecessary words, tokens, or lines."

# Philosophy layer [P] — advisory only, never blocking.
# Restored from MASTER2 and trimmed to top 25 prioritized axioms.
philosophy:
  prioritized_top_25:
    - id: ONE_JOB
      priority: 1
      statement: "Each module should have one clear reason to change."
    - id: NO_SURPRISES
      priority: 2
      statement: "Prefer predictable behavior over clever behavior."
    - id: EXTEND_DONT_MODIFY
      priority: 3
      statement: "Add capability via composition before rewriting stable parts."
    - id: COMPOSABLE
      priority: 4
      statement: "Build small pieces that combine cleanly."
    - id: LEAVE_BETTER
      priority: 5
      statement: "Leave touched code cleaner than found."
    - id: TEST_FIRST
      priority: 6
      statement: "Design for testability before implementation complexity."
    - id: REVERSIBLE
      priority: 7
      statement: "Prefer steps that are easy to rollback."
    - id: ONE_CHANGE
      priority: 8
      statement: "Keep each patch focused on one coherent intent."
    - id: EXPLICIT
      priority: 9
      statement: "Prefer explicit contracts over implicit coupling."
    - id: IDEMPOTENT
      priority: 10
      statement: "Operations should be safe to repeat."
    - id: CQS
      priority: 11
      statement: "Separate queries from state mutations."
    - id: IMMUTABLE
      priority: 12
      statement: "Default to immutable data flow where practical."
    - id: APPEND_ONLY
      priority: 13
      statement: "Favor append-only logs for auditability."
    - id: CACHE_FIRST
      priority: 14
      statement: "Cache high-cost deterministic work with bounded TTL."
    - id: SELF_EXPLAINING
      priority: 15
      statement: "Names and structure should reduce need for comments."
    - id: ACCESSIBLE_FIRST
      priority: 16
      statement: "Design outputs for broad readability and accessibility."
    - id: SQUINT_TEST
      priority: 17
      statement: "The structure should make sense at a glance."
    - id: JUST_ENOUGH
      priority: 18
      statement: "Avoid overbuilding before proof of need."
    - id: CHESTERTONS_FENCE
      priority: 19
      statement: "Understand why something exists before removing it."
    - id: GALLS_LAW
      priority: 20
      statement: "Complex systems should evolve from simple working systems."
    - id: OCCAMS_RAZOR
      priority: 21
      statement: "Prefer simpler hypotheses and designs first."
    - id: PARETO
      priority: 22
      statement: "Ship the 20% that delivers 80% value first."
    - id: FINISH_FIRST
      priority: 23
      statement: "Close the loop before opening new threads."
    - id: MEASURE_THEN_OPTIMIZE
      priority: 24
      statement: "Benchmark before optimization work."
    - id: BLAME_SELF
      priority: 25
      statement: "Assume your change introduced the bug until disproven."

  anti_patterns:
    - god_class
    - shotgun_surgery
    - speculative_abstraction
    - hidden_global_state
    - duplicate_logic
    - n_plus_one_queries
    - silent_rescue
    - temporal_coupling

  zen_method:
    observe: "Read current behavior before changing anything."
    simplify: "Reduce moving parts before adding new components."
    isolate: "Change one axis at a time with clear boundaries."
    verify: "Run checks and gather objective evidence."
    reflect: "Capture learning and improve defaults."

  strunk_white:
    - "Omit needless words."
    - "Use definite, specific, concrete language."
    - "Put statements in positive form."
    - "Use active voice by default."

  inverted_pyramid:
    - "Lead with the outcome."
    - "Then provide key evidence."
    - "Then provide implementation detail."

  rails_doctrine:
    - "Convention over configuration"
    - "Optimize for programmer happiness"
    - "The menu is omakase"
    - "Value integrated systems"

# Nielsen Norman Group — 10 Usability Heuristics
# Source: nngroup.com/articles/ten-usability-heuristics/
# Applied to CLI/API/output design as much as UI.
ux:
  nielsen_heuristics:
    - id: SYSTEM_STATUS
      priority: 1
      statement: "Always keep the user informed about what is happening through timely feedback."
      code_mapping: "Progress indicators, streaming output, non-silent background operations."
    - id: REAL_WORLD_MATCH
      priority: 2
      statement: "Speak the user's language. Match concepts to their mental model, not the system's internals."
      code_mapping: "Error messages in plain language; command names matching intent, not implementation."
    - id: USER_CONTROL
      priority: 3
      statement: "Support undo and emergency exits. Users make mistakes."
      code_mapping: "Every write operation must be reversible. Undo stack. Dry-run modes."
    - id: CONSISTENCY
      priority: 4
      statement: "Follow conventions. Same word means same thing everywhere."
      code_mapping: "Uniform return types, consistent error shapes, one naming convention throughout."
    - id: ERROR_PREVENTION
      priority: 5
      statement: "Design to prevent problems before they occur. Confirm destructive actions."
      code_mapping: "Guard clauses, validation at boundaries, governor checks before writes."
    - id: RECOGNITION_NOT_RECALL
      priority: 6
      statement: "Minimize memory load. Make options visible. Don't require users to remember context."
      code_mapping: "Self-documenting APIs, --help text, named keyword arguments over positional."
    - id: FLEXIBILITY
      priority: 7
      statement: "Serve both novices and experts. Accelerators for power users."
      code_mapping: "Short commands with sensible defaults; full flags for expert control."
    - id: AESTHETIC_MINIMALISM
      priority: 8
      statement: "Don't show irrelevant or rarely needed information. Every element must earn its place."
      code_mapping: "Quiet by default, verbose on request. No noise in logs or output."
    - id: ERROR_RECOVERY
      priority: 9
      statement: "Error messages must name the problem and suggest a fix in plain language."
      code_mapping: "Result.err messages include what failed and what to do next."
    - id: HELP_AND_DOCS
      priority: 10
      statement: "When help is needed it must be easy to find, concrete, and task-focused."
      code_mapping: "/help command, inline examples, not abstract reference docs."
