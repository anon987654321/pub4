detection:
  triggers:
  - pre_commit
  - pre_response
  - post_response
  - on_file_save
  patterns:
    bash_invocation:
      regex: "\\bbash\\b(?!\\s*#)"
      severity: critical
      message: use zsh on OpenBSD
      msg: use zsh
    python_call:
      regex: "\\bpython[23]?\\b"
      severity: high
      message: use ruby for analysis
      msg: use ruby
    pipe_abuse:
      regex: "\\|.*\\|.*\\|"
      severity: medium
      message: "excessive piping, refactor to zsh"
      msg: refactor to zsh
    sudo_usage:
      regex: \bsudo\b
      severity: critical
      message: use doas on OpenBSD
      msg: use doas
    sed_awk_usage:
      regex: "\\b(sed|awk|tr|wc|head|tail|cut|find)\\b"
      severity: high
      message: use zsh parameter expansion or ruby
      msg: use zsh/ruby
    magic_number:
      regex: "(?<![a-zA-Z_])\\b\\d{2,}\\b(?![a-zA-Z_])"
      except: "0,1,2,ports"
      severity: low
    long_line:
      check: "length>120"
      severity: low
    deep_nesting:
      check: "indent>3"
      severity: medium
    long_function:
      check: "lines>20"
      severity: medium
    unclear_name:
      regex: "\\b[a-z]{1,2}\\b|tmp|temp|data|info|obj"
      severity: low
    no_error_handling:
      check: no_error_path
      severity: high
adversarial:
  threshold: 0.7
  run_even_at_zero_violations: true
  personas:
    security:
      weight: 0.2
      veto: true
      checks:
      - injection
      - validation
      - secrets
      - pledge_unveil
      temperature: 0.1
      asks:
      - How could this be exploited?
      - Is all input validated?
      - Are secrets protected?
      - Least privilege applied?
      veto_triggers:
      - unvalidated_input
      - data_exposure
      - missing_auth
      - injection_risk
    maintainer:
      weight: 0.2
      veto: true
      checks:
      - debuggable
      - recoverable
      - readable
      temperature: 0.3
      asks:
      - Clear at 3am?
      - Can junior debug this?
      - Error messages helpful?
      - Will I understand in 6 months?
      veto_triggers:
      - incomprehensible
      - missing_docs
      - debugging_nightmare
    minimalist:
      weight: 0.1
      checks:
      - simplest
      - necessary
      - removable
      temperature: 0.3
      veto: false
      asks:
      - What is the simplest solution?
      - What can we remove?
      - Is this actually needed?
    performance:
      weight: 0.06
      checks:
      - complexity
      - memory
      - scaling
      - n_plus_one
      temperature: 0.3
      veto: false
      asks:
      - Big-O complexity?
      - Memory waste?
      - Bottlenecks?
    architect:
      weight: 0.05
      checks:
      - coupling
      - dependencies
      - extensibility
      temperature: 0.3
      veto: false
      asks:
      - Coupling acceptable?
      - Dependencies reasonable?
      - Does it scale?
    realist:
      weight: 0.08
      checks:
      - feasible
      - valuable
      - timely
    chaos:
      weight: 0.05
      checks:
      - failure_modes
      - recovery
      - cascade
      temperature: 0.5
      veto: false
      asks:
      - How does this break?
      - What are the edge cases?
      - Failure modes?
      - Blast radius if wrong?
    user:
      weight: 0.04
      checks:
      - serves_user
      - friction
      - clarity
      temperature: 0.5
      veto: false
      asks:
      - Does it solve the actual problem?
      - Is it usable?
      - Intuitive?
    attacker:
      weight: 0.18
      temperature: 0.1
      veto: true
      asks:
      - What is the weakest link?
      - Any race conditions?
      - Privilege escalation paths?
      - Data exfiltration opportunities?
      veto_triggers:
      - exploitable_race
      - escalation_path
      - exfiltration_risk
    skeptic:
      weight: 0.12
      temperature: 0.2
      veto: false
      asks:
      - Where is the evidence?
      - Has this been proven?
      - Can we measure this?
      - What assumptions are hidden?
  mandatory: true
  consensus_threshold: 0.7
  veto_holders:
  - security
  - attacker
  - maintainer
  veto_override: not_possible_must_address_and_revalidate
  consensus_calculation: Σ(weight × approval) / Σ(weights)
evidence:
  philosophy: evidence_first_then_conclusion_never_claim_without_proof
  types:
    cryptographic:
      weight: 1.0
      points: 3
      examples:
      - sha256_file_hash
      - digital_signature
      - merkle_proof
      format: "sha256:abc123...def456"
      when: always_for_file_verification
    executable:
      weight: 0.95
      points: 2
      examples:
      - passing_test
      - benchmark_result
      - working_demo
      format: "tests: 47 passed, 0 failed [coverage: 83%]"
      when: primary_evidence_for_functionality
    empirical:
      weight: 0.85
      points: 2
      examples:
      - performance_measurement
      - user_testing
      - monitoring_data
      format: "benchmark: 15ms ± 2ms (n=100)"
      when: performance_optimization_claims
    cited:
      weight: 0.8
      points: 1
      examples:
      - rfc_reference
      - research_paper
      - official_docs
      format: "cite: RFC-7231 section 6.5.4"
      when: standards_compliance
    consensus:
      weight: 0.7
      points: 1
      examples:
      - persona_agreement
      - peer_review
      format: "personas: 8/9 agree [security: approved]"
      when: subjective_design_decisions
  scoring:
    formula: sum(points × quality_factor)
    quality_factors:
      perfect: 1.0
      good: 0.8
      adequate: 0.6
    thresholds:
      trivial: 3
      routine: 5
      significant: 10
      critical: 15
      safety: 20
  5_layer_verification:
    layer_1_source_grounding:
      technique: citation_verification
      check: Does claim have traceable source?
    layer_2_cross_reference:
      technique: consistency_check
      check: Does claim contradict other sources?
    layer_3_chain_of_verification:
      technique: CoVe_self_correction
      steps:
      - generate_initial_response
      - create_verification_questions
      - answer_questions_independently
      - check_for_contradictions
      - revise_if_contradictions_found
    layer_4_sha256:
      technique: cryptographic_hash
      when: file_manipulation
      reliability: absolute
    layer_5_executable:
      technique: run_and_verify
      when: code_generation
      reliability: very_high
  anti_simulation:
    forbidden_words:
      future_tense:
      - will
      - would
      - could
      - should
      - might
      - going_to
      - plan_to
      vague_completion:
      - done
      - complete
      - finished
      - fixed
      - processed
      - handled
      planning_not_doing:
      - we_need_to
      - first_we
      - then_we
      - lets
      - we_should
      hedging:
      - probably
      - likely
      - should_work
      - might_fix
      - seems_to
    require_proof_for:
    - file_read_claims
    - modification_claims
    - completion_claims
    - test_results
    - command_execution
    on_detection:
    - halt_response_immediately
    - log_violation_with_context
    - demand_evidence_before_continuing
    - restart_with_action_not_description
    traps:
      checksum_trap: "If you read this file, report sha256 prefix"
      sequence_trap: Process files in exact order listed
      count_trap: Report exact line count
  evidence_format:
    file_read: "verified: {file} ({lines} lines, sha256:{prefix})"
    fix_applied: "applied to {file}: {diff_summary}"
    convergence: "iteration {n}: {before}→{after} violations, delta: {delta}"
    completion: "task complete: {evidence_list}"
    test_results: "tests: {passed} passed, {failed} failed, exit: {code}"
ideation:
  generate_alternatives: 15
  sweet_spot:
  - 8
  - 15
  rationale: Ideas 1-7 are conventional; breakthrough comes from persistence
  never: accept_first_working_solution
  process:
  - generate_15_alternatives
  - score_each_with_adversarial_personas
  - identify_best_elements_across_all
  - synthesize_hybrid_solution
  - validate_against_principles
  temperature_by_phase:
    discovery: 0.8
    analysis: 0.5
    ideation: 0.9
    design: 0.6
    implementation: 0.3
    validation: 0.1
convergence:
  strategy: multi_metric_AND
  metrics:
  - violations_remaining
  - quality_delta
  - adversarial_score
  - test_pass_rate
  - files_verified_with_evidence
  iteration:
    min_cycles: 3
    max_cycles: 10
    early_exit: false
    backtrack_on_regression: true
    min: 3
    max: 10
  exit_conditions:
    complete:
      violations: 0
      quality_delta: "<0.02"
      adversarial_score: ">=0.80"
      tests: all_passing
      evidence: all_claims_backed
    diminishing: "delta < 0.02 for 3 consecutive cycles AND cycles >= 3"
    hard_stop:
      max_iterations: 15
    diminishing_returns:
      delta_threshold: 0.001
      consecutive_iterations: 3
  exit:
    complete: "violations == 0 AND delta < 0.02 AND adversarial >= 0.8"
    diminishing: "delta < 0.02 for 3 cycles AND cycles >= 3"
    hard_stop: "cycles >= 10"
  oscillation_detection:
    enabled: true
    detect: same_violations_three_consecutive_iterations
    action: rollback_to_best_state_and_stop
    track: full_iteration_history_with_hashes
    rationale: Prevents infinite loops where fixes alternate
  premature_exit_prevention:
    never_exit_if:
    - files_unread
    - violations_above_5
    - evidence_missing
    - tests_failing
    - claims_unverified
    require_before_exit:
    - all_files_verified_with_sha256
    - all_violations_addressed_or_justified
    - evidence_for_every_completion_claim
execution:
  first_step: verify_all_inputs_read_with_sha256
  self_execution:
    trigger_on:
    - user_request_to_run_framework
    - detect_violations_in_target
    - scheduled_maintenance
    loop:
    - internalize_framework_fully
    - detect_violations_using_principles
    - apply_structural_ops
    - auto_fix_with_remediation
    - measure_quality_delta
    - if_delta_positive_commit_and_version
    - repeat_until_convergence
    frequency: on_demand_not_automatic
    output: "✓ improved: violations={before}→{after} quality=+{delta}% lines={old}→{new}"
  workflow_phases:
    discover:
      input: problem
      output: definition
      questions:
      - specific_and_measurable?
      - who_affected_how_often?
      - current_impact?
      - evidence_supporting?
      - if_nothing_done?
    analyze:
      input: definition
      output: analysis
      actions:
      - identify_assumptions
      - estimate_cost
      - assess_risk
      - check_bias
      questions:
      - hidden_assumptions?
      - what_could_be_wrong?
      - dependencies?
      - biases_present?
    ideate:
      input: analysis
      output: 15_alternatives
      actions:
      - generate_15
      - apply_personas
      - synthesize_best
      mandatory: 15_or_incomplete
    design:
      input: alternatives
      output: plan_with_tests
      questions:
      - minimum_viable?
      - irreversible_decisions?
      - test_strategy?
      - maintainable?
    implement:
      input: plan
      output: code_with_tests
      actions:
      - tests_first
      - implement_simplest
      - refactor
      questions:
      - tests_prove_correctness?
      - edge_cases_covered?
      - can_simplify?
      - duplication_present?
    validate:
      input: implementation
      output: verified_quality
      actions:
      - run_detectors
      - adversarial_review
      - quality_gates
      questions:
      - how_does_it_break?
      - what_did_we_miss?
      - principles_violated?
    deliver:
      input: verified
      output: deployed
      questions:
      - deployment_ready?
      - docs_complete?
      - monitoring_configured?
      - rollback_plan?
  core_loop:
    phases:
    - detect
    - adversarial_reason
    - fix
    - validate
    - converge
    max_iterations: 15
    convergence_criteria: "zero_violations AND delta < 0.02"
    auto_iteration: mandatory_2x_minimum
  rollback:
    true:
    - syntax_error
    - test_failure
    - behavior_change
    - quality_drop
    strategy: restore_best_known_state
    preserve: iteration_history_for_analysis
thresholds:
  code:
    test_coverage: 80.0
    function_lines: 20.0
    nesting_depth: 3.0
    line_length: 120.0
    complexity: 10.0
    parameters: 5.0
    list_items: 7.0
  decision:
    confidence_auto: 0.9
    confidence_minimum: 0.7
    beautification_delta: 0.02
self_test:
  activation: true
  checks:
  - all principles have operations
  - all operations exist in operations section
  - all principle.detects exist in smells
  - confidence bounds valid (0.0-1.0)
  - convergence uses AND not OR
  - "min_cycles >= 3"
  - adversarial runs always
  - all modes have violation_handling
  - every principle.detects maps to a smell category entry
  - every principle.operation maps to operations
  - "veto personas present: security, attacker, maintainer"
  - evidence anti_simulation rules loaded
  true: activation
tooling:
  banned:
  - bash
  - powershell
  - sed
  - awk
  - python
  - sudo
  - grep
  - cat
  - wc
  - head
  - tail
  - sort
  - find
  preferred:
    shell: zsh
    analysis: ruby
    privilege: doas
  external:
  - rubocop
  - prettier
  - eslint
  - rustfmt
  - shfmt
  allowed:
  - ruby
  - zsh
  - view_tool
  - edit_tool
  - create_tool
  - glob_tool
  - grep_tool
  bash_exceptions:
  - git
  - npm
  - bundle
  - rails
  - rake
  zsh_efficiency:
    rationale: Builtins save ~700 tokens per operation
    patterns:
      string_ops:
        remove_crlf: "${var//$'\\r'/}"
        lowercase: "${(L)var}"
        uppercase: "${(U)var}"
        replace_all: "${var//search/replace}"
        trim_both: "${${var##[[:space:]]#}%%[[:space:]]#}"
      array_ops:
        match_pattern: "${(M)arr:#*pattern*}"
        exclude_pattern: "${arr:#*pattern*}"
        unique: "${(u)arr}"
        join: "${(j:,:)arr}"
        sort_asc: "${(o)arr}"
      replacements:
        awk: zsh array/string operations
        sed: zsh parameter expansion
        tr: zsh case conversion
        grep: zsh pattern matching with (M) flag
        cut: "zsh field splitting with (s:delim:)"
orchestration:
  purpose: "master.yml defines principles, @*.sh implements specialized workflows"
  delegation:
    rails_setup: "rails/@setup_rails_app.sh"
    rails_features: "rails/@features_*.sh (voting, comments, tiptap, etc)"
    openbsd_deploy: openbsd/openbsd.sh
    testing: "Run existing test suites, don't create new ones"
  workflow:
    step_1: master.yml scans for violations
    step_2: "If Rails-specific, delegate to rails/@*.sh"
    step_3: "If OpenBSD-specific, consult openbsd_conventions"
    step_4: Apply fixes using operations defined here
    step_5: Verify with convergence metrics
rails_conventions:
  views:
    principle: Ultraminimalistic - no divitis
    pattern: Use Rails tag helpers over raw HTML
    good: "<%= tag.p t('hello_world') %>"
    bad: "<p><%= t :hello_world %></p>"
    avoid: "Nested div soup, unnecessary containers"
    prefer: "Semantic HTML5 tags (article, section, nav, aside)"
  controllers:
    principle: "Thin controllers, fat models"
    pattern: Business logic in models/services
  models:
    principle: Single responsibility per model
    pattern: Use concerns for shared behavior
  helpers:
    principle: View-specific formatting only
    pattern: Complex logic belongs in models/services
  javascript:
    principle: Stimulus controllers for behavior
    libraries:
    - stimulus-components
    - lightgallery
    - swiper
    - tiptap
    pattern: "Progressive enhancement, mobile-first"
  css:
    principle: "Modern CSS, no preprocessor bloat"
    avoid: "Deep nesting, overly specific selectors"
    prefer: Utility classes for spacing/sizing
  shared_features:
    voting: Merit gem for reputation/badges/points
    comments: "Nested with voting via @features_voting_comments.sh"
    editor: "Tiptap rich text via @features_tiptap_editor.sh"
    realtime: ActionCable + StimulusReflex
    pwa: "Service workers, offline support"
    lightbox: stimulus-lightbox (licensed)
    social: Sharing buttons across all apps
openbsd_conventions:
  daemon_management:
    principle: "Use rcctl, not systemd"
    pattern: Check man.openbsd.org for all daemons
    required: rc.conf.local configuration
    monitoring: "Use built-in tools (systat, top, vmstat)"
  security:
    principle: doas instead of sudo
    pattern: Least privilege always
    required: pledge() and unveil() where applicable
  shell:
    principle: "Use zsh, not bash"
    pattern: set -euo pipefail at start
    avoid: bashisms
  networking:
    principle: pf firewall configuration
    pattern: "Simple rules, block by default"
  updates:
    principle: syspatch for security
    pattern: Regular pkg_add -u for packages
interfaces:
  web_chat:
    mode_default: balanced
    features:
    - real_time_feedback
    - progressive_disclosure
    constraints: limit_response_length
  cli:
    mode_default: strict
    features:
    - piping_support
    - batch_processing
    constraints: enforce_stages
  api:
    mode_default: strict
    features:
    - structured_output
    - streaming
    constraints: validate_all_inputs
version_control:
  strategy: atomic_commits
  workflow: git
  commit_on:
  - convergence_achieved
  - milestone_reached
  - user_request
  message_format: "v{version}: {change_summary} [violations={before}→{after}]"
  branch_policy: main_only_for_framework
  tag_releases: true
self_adherence:
  applied_principles:
  - MODULARITY
  - CONSISTENCY
  - DENSITY_OPTIMIZATION
  - SELF_REFERENTIAL_CONSISTENCY
  - CLARITY
  - EVOLUTIONARY_ADAPTATION
  - PRINCIPLE_VALIDATION
  - SYMBIOTIC_RELATIONSHIPS
  compliance_checklist:
  - density: no_decorative_elements
  - consistency: uniform_section_structure
  - clarity: all_terms_defined
  - modularity: loose_coupling_between_sections
  - protection: critical_sections_marked
  - evidence: claims_backed_by_rationale
  feedback_loop: violations_trigger_self_update
  on_self_run:
    action: apply_all_detectors_and_fixers_to_this_file
    expected: zero_violations_or_minimal_improvements
    if_violations: auto_fix_and_increment_version
glossary:
  center: core purpose all changes preserve
  universal: principles apply across all domains and contexts
  flattened: "no hierarchical nesting, direct access"
  convergence: "Iterative improvement until violations == 0 or delta < 0.02"
  pledge: OpenBSD syscall restriction
  unveil: OpenBSD filesystem restriction
  doas: OpenBSD privilege escalation (not sudo)
  smell: "Detectable code issue (e.g., long_function, duplication)"
  principle: "Rule that detects smells (e.g., human_scale detects long_function)"
  operation: "Fix action (e.g., extract, simplify, delete)"
  severity: "critical > high > medium > low"
  confidence: How certain we are (0.0-1.0)
  adversarial: "Multiple personas evaluate fixes, must exceed threshold 0.7"
  mode: "Adherence posture: loose | balanced | strict | transcendent"
  evidence: Proof required before completion claims
  steroids: Advanced multi-perspective reasoning modes
  bias: Known LLM failure pattern to detect and correct
