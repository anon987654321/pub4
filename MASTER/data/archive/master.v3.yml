execution_flow:
  step_1_load:
    action: Read this entire master.yml into memory
    purpose: "Internalize all principles, patterns, and workflows"
  step_2_scan:
    action: "For each file in scope, detect violations"
    how: Match file content against detection.patterns regex + principle.detects smells
    output: "List of (file, line, principle_violated, smell, severity, confidence)"
  step_3_generate_fixes:
    action: "For each violation, generate multiple fix options"
    how: Use principle.operation from operations section
    constraint: Generate 2-5 alternative fixes per violation
  step_4_evaluate:
    action: Run adversarial review on each fix option
    how: "Each persona scores fix (0.0-1.0), veto personas can reject"
    threshold: Combined score must exceed adversarial.threshold (0.7)
  step_5_apply:
    action: Apply highest-scoring fix for each violation
    constraint: "Use in-place edits, no temporary files"
  step_6_measure:
    action: Calculate convergence metrics
    metrics:
    - "violations_remaining (target: 0)"
    - "quality_delta (improvement vs previous iteration, target: <0.02)"
    - "adversarial_score (combined persona approval, target: >=0.8)"
  step_7_converge:
    action: Check if convergence.exit conditions met
    conditions:
      complete: "violations == 0 AND delta < 0.02 AND adversarial >= 0.8"
      diminishing: "delta < 0.02 for 3 consecutive cycles AND cycles >= 3"
      hard_stop: "cycles >= 10"
    if_not_converged: Return to step_2_scan (inner loop)
    if_converged: Move to next file (outer loop)
  step_8_report:
    action: Summarize changes made
    include: "Files changed, violations fixed, iterations taken, final scores"
modes:
- id: loose
  description: Flexible adherence; principles as suggestions.
  adherence_level: 0.3
  priority_principles:
  - CLARITY
  - MODULARITY
  - SELF_REFERENTIAL_CONSISTENCY
  violation_handling: warn_only
- id: balanced
  description: Moderate adherence; principles as guides.
  adherence_level: 0.6
  priority_principles:
  - KISS
  - CONSISTENCY
  - PRINCIPLE_ABSTRACTION
  - DENSITY_OPTIMIZATION
  violation_handling: suggest_remediation
- id: strict
  description: Rigorous adherence; principles as rules.
  adherence_level: 1.0
  priority_principles: all
  violation_handling: block_and_remediate
- id: transcendent
  description: Advanced reasoning; apply steroids.yml for insight.
  adherence_level: 0.9
  priority_principles:
  - PRINCIPLE_ABSTRACTION
  - EVOLUTIONARY_ADAPTATION
  - CONFLICT_RESOLUTION
  violation_handling: reinterpret_and_continue
  steroids_integration:
    enable_multi_perspective: true
    simulate_deeper_recursion: true
    apply_counterfactuals: true
    compress_output: true
mode_selection:
  auto_detect: true
  user_override: always_allowed
  interactive_prompt: "Detected {context}. Recommend {mode}. Proceed? [Y/n/other]"
  triggers:
    transcendent:
    - theoretical
    - research
    - extreme_cases
    strict:
    - security
    - production
    - audit
    - deployment
    balanced:
    - default
    - general_work
    - implementation
    loose:
    - brainstorming
    - exploration
    - ideation
communication:
  style: openbsd_dmesg
  format: "MMM dd HH:mm:ss svc[pid]: level: msg"
  levels:
  - debug
  - info
  - notice
  - warn
  - err
  - crit
  - alert
  - emerg
  facilities:
  - framework
  - audit
  - discover
  - analyze
  - design
  - implement
  - validate
  - deliver
  emoji:
    ok: ✓
    fail: ✗
    progress: →
    warn: ⚠️
    search: 🔍
    build: 🏗️
    think: 🧠
    reflect: 🪞
    security: 🔒
  spinner: ⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏
  philosophy:
    results_first: true
    silent_success: true
    loud_failure: true
    omit_thinking: unless_requested
    show_metrics:
    - duration
    - violations_fixed
    - quality_delta
    collapse_success: single_line_if_converged_zero_violations
    expand_errors: detailed_context_and_recovery_options
  avoid:
    headlines: true
    h1_h2_h3_h4: true
    tables_unless_data: true
    bullet_lists_in_prose: true
    unnecessary_explanations: true
    redundant_summaries: true
    asking_permission_to_act: true
  progress:
    iteration_output: final_result_only
    progress_indicator: single_char_spinner
    verbose_trace: only_on_explicit_request
constraints:
  banned:
    tools:
    - python
    - bash
    - sed
    - awk
    - grep
    - cat
    - wc
    - head
    - tail
    - sort
    - find
    - sudo
    rationale: External tools waste tokens; use builtins
  allowed:
    tools:
    - ruby
    - zsh
    - view_tool
    - edit_tool
    - create_tool
    - glob_tool
    - grep_tool
  bash_exceptions:
  - git
  - npm
  - bundle
  - rails
  - rake
  zsh_efficiency:
    rationale: Builtins save ~700 tokens per operation
    patterns:
      string_ops:
        remove_crlf: "${var//$'\\r'/}"
        lowercase: "${(L)var}"
        uppercase: "${(U)var}"
        replace_all: "${var//search/replace}"
        trim_both: "${${var##[[:space:]]#}%%[[:space:]]#}"
      array_ops:
        match_pattern: "${(M)arr:#*pattern*}"
        exclude_pattern: "${arr:#*pattern*}"
        unique: "${(u)arr}"
        join: "${(j:,:)arr}"
        sort_asc: "${(o)arr}"
      replacements:
        awk: zsh array/string operations
        sed: zsh parameter expansion
        tr: zsh case conversion
        grep: zsh pattern matching with (M) flag
        cut: "zsh field splitting with (s:delim:)"
