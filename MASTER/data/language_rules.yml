# Language rules — per-language coding standards enforced by scan rules.

ruby:
  version: "3.3+"
  frozen_string_literal: required
  magic_comments: true
  guard_clauses: true
  max_method_lines: 12
  max_class_lines: 200
  max_params: 3
  rescue: specify_type_always
  lint:
    style: strict
    complexity: low
    todo_comments: forbidden
    unused_variables: error
    naming_convention: snake_case
    mutable_state: forbidden
    duplicated_logic: error
  documentation: required
  type_checking: strict
  security:
    taint_mode: true
    safe_navigation: required

rails:
  version: "8+"
  stack:
    - solid_queue
    - solid_cache
    - solid_cable
  frontend: hotwire
  database: sqlite_default
  testing: minitest
  security:
    strong_parameters: true
    csrf_protection: true
    content_security_policy: true
    ssl_enforced: true
    cookie_secure: true
    http_strict_transport_security: true
  assets:
    digest: true
    compile: false
    precompile: true
  time_zone: UTC
  locales:
    default: en
    available:
      - en
      - nb
  background_jobs:
    adapter: solid_queue
    max_concurrent: 10
    retry_attempts: 3
    queue_prefix: master

zsh:
  shebang: "#!/usr/bin/env zsh"
  options: "set -euo pipefail; setopt nullglob extendedglob"
  banned_commands:
    - sed
    - awk
    - tr
    - grep
    - cut
    - head
    - tail
    - find
    - wc
    - sudo
    - perl
    - ruby
    - dd
    - xargs
  enforce_strict:
    - errexit
    - nounset
    - pipefail
    - noclobber
    - noglob
    - noexec
  allowed_builtin: false

openbsd:
  service_manager: rcctl
  package_manager: pkg_add
  firewall: pf
  privilege: doas
  http: httpd
  mail: smtpd
  update:
    daily: true
    mirror: secure
    auto_security: true
    auto_reboot: false
  syslog: inet
  ssh:
    permit_root_login: no
    password_authentication: no
    allow_agent_forwarding: no
    permit_empty_passwords: no
    allow_tcp_forwarding: no
    max_auth_tries: 3
    enable_publickey_authentication: true
  cron:
    allow_user: master
    deny_user: root
  user_add_defaults:
    umask: "027"
    login_class: daemon
    home_directory: "/var/master"
  sysctl:
    net.inet.ip.forwarding: 0
    kern.random.tls_entropy: 1
    vm.swappiness: 0
    net.inet.tcp.msl: 15000