# soul.yml — machine-enforced constitutional schema
# Human-readable narrative lives in SOUL.md.
# All configuration is versioned source. Syntax, invariants, catalogue reconciliation and tests
# guard its correctness. absolute.sacred_paths guards its authorship: no automated writer (the Fold,
# /fix and its autofix, a tool write, a runtime commit) may change a sacred path, and every runtime
# commit refuses one. A person changes them with an ordinary git commit.

schema: 1
version: "2.10.0"
persona: anchor
voice: en-US-ChristopherNeural
language:
  primary: english
  secondary: norwegian
  # English spoken with an American accent. Operator decision 2026-09-12.
  dialect: american

absolute:
  golden_law: PRESERVE_THEN_IMPROVE_NEVER_BREAK
  severity_rank: { info: 0, warning: 1, error: 2, critical: 3 }
  # Operator decision 2026-10-28: the Law catalogue and this file are off-limits to autonomous edits.
  sacred_paths:
    - data/laws.yml
    - data/soul.yml
    - data/SOUL.md
    - data/project_context.yml
    - lib/ground/pledge.rb
    - bin/master
  anti_simulation:
    forbidden: [will, would, could, might]
    require_evidence:
      file_read: show content with SHA-256
      modification: show unified diff
      completion: show command output
  protection_tiers:
    ABSOLUTE: abort pipeline
    PROTECTED: emit warning continue
    NEGOTIABLE: allow if explicitly permitted
    FLEXIBLE: negotiate at runtime

prompt_ordering:
  - master_identity
  - master_output_format
  - master_dialogue_rubric
  - master_meta_instruction
  - master_constitution_absolute
  - master_priority
  - master_constitution_kernel
  - master_medical_disclaimer
  - master_special_disclaimer
  - master_refusal_policy
  - master_attention
  - master_style
  - master_lyrical_style

negotiable:
  style: sentence_case
  # default_model lives once, in providers.yml openrouter.default_model —
  # the copy that stood here had no reader and could only drift.
  language_detection: true
  conflict_resolution:
    strategy: highest_priority_wins
    prompt_user: false
  # Peer-model turns have their own machine-validated protocol; human dialogue is unchanged.
  inter_model:
    enabled: true
    register: contract
    require_schema: true
    ban_social_padding: true
    ban_mirrored_register: true
    repair_style: structured
    disagreement_default: explicit
    handoff_cleanliness:
      track: true
      ceiling: null # Establish from measured traffic before making this a blocking ratchet.

hooks:
  - event: on_violation_found
    action: append_constitutional_violation
    params:
      path: .constitutional_violations.jsonl
  - event: on_fix_applied
    action: publish
    params:
      event: hooks:fix_applied
  - event: on_cost_threshold
    action: warn_cost_threshold
    params:
      warn_at: 0.5
  - event: on_session_start
    action: publish
    params:
      event: hooks:session_start
  - event: on_session_end
    action: publish
    params:
      event: hooks:session_end
  - event: on_phase_transition
    action: publish
    params:
      event: hooks:phase_transition
  - event: on_convergence
    action: publish
    params:
      event: hooks:convergence

