# 44 -> 41: brgen/vendor/javascript carried its own byte-identical copies of
# three @stimulus-components files (sortable, animated-number,
# character-counter) that shared/config/importmap_baseline.rb already pins to
# shared/vendor/javascript, on brgen's own config.assets.paths via
# Shared::Engine's shared.vendor_javascript initializer. Leftover from before
# the promotion to the shared baseline; nothing pinned, imported, or
# referenced them by the brgen-local path. Deleted the brgen copies, kept
# shared's.
#
# 41 -> 39, 2026-08-28: the trymbot retirement and the MASTER dedupe pass took
# the last copies of four files out of the tree. Measured in a clean worktree,
# not in the shared checkout -- there the three db schema files read as three
# extra duplicate sets, because another session has them regenerated and
# uncommitted and this tool reads content from disk while taking its paths
# from git ls-files.
#
# 39 -> 35: four files that existed twice in RAILS now exist once, in the
# shared engine — fingerprints_controller.rb and passwords_mailer.rb (amber +
# brgen), lib/tasks/visits.rake (amber + brgen), jox_logo_controller.js (amber
# + bsdports). The engine already reached all three apps for each of them: a
# top-level constant in shared/app resolves by bare name, Rails::Engine loads
# the engine lib/tasks, and stimulus_boot registers the logo only where the
# element appears. Measured in a clean worktree; the shared checkout reads
# three higher because another session has the db schema files regenerated and
# uncommitted.
#
# 35 -> 30: brgen/vendor/javascript carried five more byte-identical
# @stimulus-components copies (auto-submit, clipboard, dropdown, lightbox,
# notification) that the shared engine already served. Same collapse as the
# sortable / animated-number / character-counter set above. Measured in a
# clean worktree after that deletion.
# 30 -> 29 on 2026-09-09: MASTER/web and RAILS/shared no longer carry the same
# filter_parameter_logging.rb. Recorded rather than left, because a ceiling above
# the real number is room the next duplicate grows into without an argument -- the
# ratchet test fails on slack in exactly the way it fails on debt.
#
# 29 -> 25 on 2026-09-16, four sets out and one in, read by diffing the recorded
# members against the census rather than by trusting the integer.
#   -3  shared/public/404, 422 and 500.html are gone. 90644d6b5 gave each app
#       its own ground and its own Norwegian, and stopped the deploy copying
#       shared's over them, so bsdports' three no longer shadow anything.
#   -1  the three bin/ci are still byte-identical and are now 120 bytes, under
#       this census's 200-byte floor for stubs that legitimately repeat. Each
#       is five lines handing over to config/ci.rb, which is the collapse.
#   -1  MASTER/web/bin/setup took `# frozen_string_literal: true` and stopped
#       matching RAILS/shared/bin/setup. MASTER/web/Rakefile did the same and
#       left the Rakefile set, which still has its other three members.
#   +1  add_link_embed_to_posts, written identically into amber and brgen.
#
# 25 -> 26 on 2026-09-25, measured from the live main tree after the shared
# Rails application scaffolding was deleted and the vertical schemas settled.
#   -1  the three-way app index.js set is no longer byte-identical.
#   -2  shared/Rakefile and shared/config/boot.rb disappeared with the shared
#       application stubs, leaving the two-app Rakefile and three-app boot sets.
#   +2  brgen and bsdports carry byte-identical generated cache_schema.rb and
#       cable_schema.rb; they are app database structure, so the census prices
#       the repetition instead of pretending the files have a common owner.
#   -1/+1  the remaining app-local Rakefile and boot sets are the measured
#       survivors of that scaffolding collapse.
