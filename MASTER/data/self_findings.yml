#
# 56 -> 58 on the registry row, and for the third time it is the instrument
# rather than the tree. CodeMetrics.public_method_count read visibility off a
# stop marker: the walk ended at the first `private` or `protected`, which is
# not what either keyword does. Every consequence was an undercount, and the
# largest was that it never descended into `class << self` -- so a class whose
# whole API is written inside one measured zero public methods.
#
# Four arrive and none leaves, which is what says this is newly visible rather
# than newly written. Ground::RuntimeCatalog and Brgen::RadioBergenManifest are
# both the `class << self` shape and both read 0 before; Deploy::GeometryProbe
# mixes `def self.` with one; Ground::AttentionContext is thirteen instance
# methods across two `private` sections. All four are true and all four were
# invisible. Across MASTER's lib, law and tools the count went 2,588 -> 2,663
# over twenty classes.
#
# Recorded rather than exempted. The decompositions are TODO.md's now.
