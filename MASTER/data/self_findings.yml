# What MASTER's own rules find in MASTER's own tree, and the three sibling trees.
#
# 534 across 759 files from the 70 rules that carry a lexical detector. This is
# the honest answer to "would running MASTER through its own rules make it
# tidier": yes for names, spacing and comments, which is where almost all of it
# sits. It is not the answer for defragmentation — COLLAPSE_BEFORE_ADDING,
# MERGE_BEFORE_MULTIPLY, FLAT_HIERARCHY and NO_NEW_FILES have no detector at
# all, so no number here moves when the tree is restructured.
#
# Lexical only. The full gate's semantic pass blocks on a model call: measured at
# 17 minutes elapsed against 4 minutes of CPU, idle in a TLS read. A number that
# needs a network and a key is a number nobody has.
findings: 534
