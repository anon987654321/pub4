---
# Ceilings for tools/rule_hygiene.rb.
#
# id_case_collisions: bare_rescue/BARE_RESCUE and eight_px_rhythm/EIGHT_PX_RHYTHM.
# Two ids differing only by case are two rules to a registry and one rule to a
# reader, so findings, priors and exemptions split across the pair.
#
# alias_shadows_live_rule: DRY claims duplicate_code, which is still its own
# rule. One of the two is a fold nobody finished; closing it means deleting the
# absorbed rule or dropping the alias, and that is a decision per pair.
#
# missing_metadata: 16 rules declare neither tier nor severity, so every count
# that groups by either omits them without saying so. It was 43 until the 27
# operator_principles entries moved to soul.yml, where conduct belongs and where
# a tier and a severity were never the right shape for them.
id_case_collisions: 2
alias_shadows_live_rule: 1
missing_metadata: 16

# cross_population_duplicates: one id defined in two places, in two wordings,
# with no way to tell which governs. FAIL_VISIBLY had three. Resolve one by
# keeping the wording where the detector is; a population that only restates it
# is the copy.
cross_population_duplicates: 21
