# Root-independent harmonic functions and common movement grammars.
progressions:
  dilla_love: [i7, iv7, bVII7, bVI7]
  neo_soul_loop: [i7, iv7, bVII7, bVI7]
  ii_v_i: [ii7, V7, Imaj7]
  ii_v_i_minor: [ii7b5, V7b9, im7]
  backdoor: [iv7, bVII7, Imaj7]
  tritone_resolution: [II7, bII7, Imaj7]
  chromatic_mediant: [Imaj7, bIIImaj7, vi7, bVImaj7]
  minor_descent: [i9, bVIImaj7, bVImaj7, V7alt]
  gospel_69: [I69, VI7, ii9, V13]
  suspended_cycle: [isus4, IVsus4, bVII7, V7sus4]
  modal_drift: [i7, III7, bVII7, iv7]
  lydian_float: [Imaj7#11, IImaj7, vi7, V13]
  altered_turnaround: [Imaj7, vi7, ii7, V7alt]
  circle_soft: [vi9, ii9, V13, Imaj9]
  chromatic_bass: [Imaj9, Imaj9/G#, vi9, V13/F#]

# Metadata for humans/tools. This is deliberately descriptive rather than a
# second executable rulebook.
families:
  suspended: [sus2, sus4, 7sus2, 7sus4, 9sus2, 9sus4, 13sus4]
  dominant_altered: [7b5, 7#5, 7b9, 7#9, 7#11, 7b13, 7alt, 7#5b9, 7#5#9, 7#9#11, 7b9#11, 13b9, 13#11]
  neo_soul: [m7, m9, m11, m13, maj7, maj9, maj13, 69, m69, 7#9, 7sus4]
  rootless_friendly: [7, 9, 13, 7b9, 7#9, 7#11, 13b9, 13#11]
  symmetrical: [dim, dim7, aug, aug7]
