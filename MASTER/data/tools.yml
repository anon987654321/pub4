# Tool registry — declarative metadata for built-in tools. The adapters are the
# classes lib/builder.rb's DEFAULT_TOOL_MAP builds, which live in lib/io/; this
# file supplies exposure, visibility and boot state. Operators tune which
# tools a model is handed without editing code.
#
# `elevated` is exposure, not approval. Each adapter's TIER constant (safe,
# guarded, dangerous, open) is what Fix::Governor paces and asks about once a
# tool is called; `elevated` decides whether an unelevated model is handed the
# tool at all. WebFetch is guarded and not elevated: any session may fetch, and
# the governor rate-limits it.
#
# Schema:
#   name        — adapter class name (under Master::Io)
#   elevated    — true withholds the tool from a model until the session is elevated
#   visitor     — true if visitors can call (visitor allow-list)
#   default     — true to enable on boot; false leaves it off until /enable
#   file_types  — optional list of file extensions that should activate the tool
#   description — one-line, surfaced in tool list

---
- { name: AskLlm, elevated: false, visitor: true, default: true, description: "Sub-LLM call for nested reasoning, required_context: \"A specific sub-question and optional context.\", usage_rules: [\"Use for isolated reasoning that should not pollute current context.\"], error_recovery: \"If too broad, rewrite as one concrete question.\"" }
- { name: ReadFile, elevated: false, visitor: false, default: true, description: "Read a file from disk; full=true reads the complete file without the normal line cap, required_context: \"Specific file path.\", usage_rules: [\"Never guess path names.\", \"Read before modifying related files.\"], error_recovery: \"If missing, ask for exact path or run directory listing first.\"" }
- { name: WriteFile, elevated: true, visitor: false, default: true, description: "Write a new file, required_context: \"Target path and complete content.\", usage_rules: [\"Prefer patch-like edits when file exists.\", \"Keep writes minimal and reversible.\"], error_recovery: \"If uncertain, read the file first and propose a diff.\"" }
- { name: DeletePath, elevated: true, visitor: false, default: true, description: "Delete a file or directory under the workspace; recursive deletion is explicit, required_context: \"Target path and whether recursive deletion is required.\", usage_rules: [\"Read or list the target before deleting.\", \"Never delete sacred or credential paths.\"], error_recovery: \"If the path is protected or ambiguous, stop and inspect it.\"" }
- { name: StrReplace, elevated: true, visitor: false, default: true, description: "Replace exact string in a file, required_context: \"Exact unique old string and replacement.\", usage_rules: [\"Fail if old string is ambiguous.\"], error_recovery: \"If multiple matches, refine old_string with more context.\"" }
- { name: BatchReplace, elevated: true, visitor: false, default: true, description: Replace many files in one call }
- { name: AstEdit, elevated: true, visitor: false, default: true, file_types: [".rb"], description: Prism AST-aware Ruby edit }
- { name: Tree, elevated: false, visitor: false, default: true, description: Directory tree summary }
- { name: ListDir, elevated: false, visitor: false, default: true, description: List a single directory }
- { name: SearchFiles, elevated: false, visitor: false, default: true, description: Glob/grep file search }
- { name: SearchKnowledge, elevated: false, visitor: false, default: true, description: Search knowledge/ snapshots }
- { name: SymbolLookup, elevated: false, visitor: false, default: true, description: Look up symbol via code_index }
- { name: Shell, elevated: true, visitor: false, default: true, description: "Execute zsh command, required_context: \"Concrete command and expected effect.\", usage_rules: [\"Prefer read-only commands first.\", \"Never use destructive commands without explicit confirmation.\"], error_recovery: \"If blocked or risky, suggest safer equivalent command.\"" }
- { name: GitContext, elevated: false, visitor: false, default: true, description: git status/log summary }
- { name: WebFetch, elevated: false, visitor: false, default: true, description: Fetch public http(s) URL content; full=true returns the complete response within the guarded full-response limit; SSRF and governor checks remain active }
- { name: ExternalAudit, elevated: false, visitor: false, default: true, description: "Passively assess public website headers and observable HTML semantics; optional browser screenshot evidence", required_context: "Public HTTP(S) URL; render=true only when screenshot evidence is useful.", usage_rules: ["Treat observations as hypotheses until corroborated.", "Use rendered browser and vision evidence for visual judgement.", "Missing headers alone are not confirmed vulnerabilities."], error_recovery: "Report blocked or inconclusive checks explicitly." }
- { name: VulCheck, elevated: true, visitor: false, default: true, description: "Read-only local security posture inventory; optional already-installed scanners require separate dangerous-tier approval", required_context: "Local host; run_scanners=true only when explicitly requested.", usage_rules: ["Never install packages, update signatures or elevate automatically.", "Distinguish unavailable and inconclusive checks from clean results.", "Root indicators are heuristics, not proof."], error_recovery: "Report missing capabilities without installing dependencies." }
- { name: Nmap, elevated: true, visitor: false, default: true, description: "Bounded Nmap TCP assessment for one explicitly authorized hostname or IP", required_context: "Single target, authorized=true, and a basic, services, or safe profile.", usage_rules: ["Never scan without explicit target authorization and governor approval.", "No CIDR, full-port sweep, brute force or exploit scripts.", "The safe NSE category is not a guarantee of zero impact."], error_recovery: "Refuse ambiguous scope, report exact failure and retain bounded results." }
- { name: WebBrowse, elevated: false, visitor: false, default: true, description: "Render a page in headless Chrome and read its visible text and links; for JavaScript sites web_fetch cannot read; read-only, SSRF and governor checks remain active, required_context: \"The page URL; build a site's search URL yourself.\", usage_rules: [\"Use when web_fetch returns a near-empty shell.\", \"Try it before saying a site cannot be read.\"], error_recovery: \"If the page shows a captcha or login wall, report exactly what it showed.\"" }
- { name: Browser, elevated: false, visitor: false, default: true, description: Sessionful SSRF-guarded browser; status navigate manual-login extract screenshot look same-host href follow bounded paginate close; GET/HEAD-only host-bound sessions; fresh human approval for interactive controls; no fingerprint spoofing or platform evasion; external communication requires consent and AI transparency }
- { name: WebSearch, elevated: false, visitor: true, default: true, description: Web search (visitor allowed) }
- { name: HostFiles, elevated: false, visitor: false, default: true, description: Read-only host filesystem list/read/search/info under actual OS permissions; relative paths start at HOME; no privilege escalation }
- { name: Lovdata, elevated: false, visitor: false, default: true, description: "Search official Lovdata law/regulation references. A single document may be read only with explicit local acknowledgement of no storage/no training; no crawling, bulk download, caching or RAG." }
- { name: Linguist, elevated: false, visitor: false, default: true, description: "Find dictionary and language-authority references for meaning, etymology, grammar, idioms, register and pragmatics; returns sources, not an automatic verdict." }
- { name: CodePen, elevated: false, visitor: false, default: true, description: Browse CodePen trending ideas or inspect a public Pen as untrusted source text }
- { name: Gist, elevated: false, visitor: false, default: true, description: Read a public GitHub Gist as untrusted source text }
- { name: YouTubeTranscript, elevated: false, visitor: false, default: true, description: Fetch available public YouTube captions as untrusted transcript text }
- { name: GitHubRepoMiner, elevated: false, visitor: false, default: true, description: Search public GitHub repositories by topic and rank by stars or recent updates; never clone or execute code }
- { name: ArxivResearch, elevated: false, visitor: false, default: true, description: "Search public arXiv paper metadata and abstracts, link ar5iv HTML, and optionally retrieve a bounded full-text excerpt" }
- { name: Clean, elevated: true, visitor: false, default: true, description: Remove tmp/build artifacts }
- { name: FeedbackRecord, elevated: false, visitor: false, default: true, description: "Record a tool, provider or correction outcome in the feedback ledger" }
- { name: MemoryRecord, elevated: false, visitor: false, default: true, description: Append durable context to data/project_context.yml }
- { name: SubdomainOrchestrator, elevated: false, visitor: true, default: true, description: "Inspect or synchronize a pub4 subdomain cluster (marketplace, maps, amber, bsdports, etc.)" }
- { name: PluginObserve, elevated: false, visitor: false, default: true, description: "Observe declared read-only plugin capabilities without granting plugin write authority", required_context: "Plugin id, declared observation action, and optional JSON arguments.", usage_rules: ["Use for browser or local-device observation when the evidence router identifies that capability.", "Never treat it as permission to send, post, remember, or otherwise mutate external state."], error_recovery: "Use status first when capability or runtime is unclear." }
- { name: DynamicHttp, elevated: false, visitor: false, default: true, description: Call HTTP endpoints declared in data/tools.dynamic.yml (name + params) }
- { name: AssistantTasks, elevated: false, visitor: false, default: true, description: "Maintain owner-local personal tasks and step-by-step evidence; never executes commands", required_context: "A task action and its identifier; provide observed evidence for verified steps and completion.", usage_rules: ["Use for multi-step personal objectives, follow-ups, and due dates.", "Record evidence actually observed; the ledger labels evidence as supplied, not independently authenticated.", "Never claim a reminder was sent; this ledger does not send background notifications."], error_recovery: "Read task status and correct the action; do not overwrite a corrupt ledger." }
- { name: CapabilityCatalog, elevated: false, visitor: false, default: true, description: "Discover built-in tools and declared read-only plugin capabilities without executing plugins", required_context: "Use list, search with a query, or describe with a tool/plugin name.", usage_rules: ["Use this when unsure which tool or plugin provides a capability.", "Treat registration as metadata, not proof that a capability is reachable.", "Only declared plugin observation actions are surfaced; writes require the plugin's own governed path."], error_recovery: "Report unavailable or inconclusive metadata rather than assuming a provider exists." }
# Postpro and Replicate are not adapters: Io::MediaIntent routes them through MASTER/tools.
