# Typography Rules — constitutional quality for text rendering
# MASTER2 enforces these when generating or reviewing typographic decisions

principles:
  - "Typography serves readability, not decoration"
  - "System font stack preferred over web fonts for performance"
  - "Vertical rhythm maintained with consistent line-height multiples"
  - "Measure (line length) between 45-75 characters for body text"

font_stack:
  body: "system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
  mono: "'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace"
  heading: "inherit from body (consistency over variety)"

scale:
  method: "modular scale (1.25 ratio — major third)"
  base: "1rem (16px)"
  sizes:
    xs: "0.64rem"
    sm: "0.8rem"
    base: "1rem"
    lg: "1.25rem"
    xl: "1.563rem"
    xxl: "1.953rem"
    xxxl: "2.441rem"

line_height:
  body: "1.5"
  heading: "1.2"
  code: "1.4"
  tight: "1.25"

spacing:
  paragraph: "1em margin-bottom"
  heading: "1.5em margin-top, 0.5em margin-bottom"
  list: "0.25em between items"

rules:
  - "Never use more than 2 font families per page"
  - "Body text minimum 16px (1rem)"
  - "Never justify text on screens (ragged right preferred)"
  - "Use tabular-nums for numeric data in tables"
  - "Hyphenation: auto for body text, none for headings"
  - "Letter-spacing: slight positive for uppercase, none for body"
  - "Font-weight: 400 for body, 600-700 for emphasis (never 900)"
  - "Underline links in body text (distinguish from surrounding text)"

dark_mode:
  - "Reduce font-weight by 1 step (400→300) to compensate for halation"
  - "Off-white text (#e0e0e0) on dark background — never pure white on pure black"
  - "Increase letter-spacing slightly (+0.01em) for light-on-dark"
