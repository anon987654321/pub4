# Overlay for constitutional enforcement metadata (merged onto data/laws.yml by LawParity).
# A green parity result reports the declared evidence type; it does not imply every Law has a deterministic detector.
#
# enforcement: active | deferred
# coverage_mode: deterministic | semantic | tagged | deferred
# detector_ids: concrete detector registrations, not merely Law.define identities
# coverage: tagged_detectors — umbrella laws enforced via tags on registered scan detectors
# expires_on: required when coverage_mode is deferred

CAPABILITY_STATUS_MUST_BE_TRUTHFUL:
  enforcement: active
  coverage_mode: deterministic
  detector_ids:
    - CAPABILITY_STATUS_MUST_BE_TRUTHFUL

ROBUSTNESS:
  enforcement: active
  coverage_mode: semantic

SINGULARITY:
  enforcement: active
  coverage_mode: semantic

LINEARITY:
  enforcement: active
  coverage_mode: semantic

PROXIMITY:
  severity: error
  enforcement: active
  coverage_mode: semantic

ABSTRACTION:
  severity: error
  enforcement: active
  coverage_mode: semantic

DENSITY:
  severity: error
  enforcement: active
  coverage_mode: semantic

RENDERED_VALUES:
  severity: error
  enforcement: active
  coverage_mode: semantic

INTER_MODEL_CONTRACT:
  severity: error
  enforcement: active
  coverage_mode: deterministic
  detector_ids:
    - INTER_MODEL_CONTRACT
