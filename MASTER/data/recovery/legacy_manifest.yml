---
source_repo: anon987654321/pub
target_repo: anon987654321/pub4
audit_date: 2026-10-01
purpose: >
  Machine-readable restore ledger for legacy pub material that pub4 has not
  fully restored as source, behavior, or explicit retirement decision.

states:
  restored: source and behavior exist in pub4
  ported: behavior exists in new architecture
  absorbed: concept exists, but old source/provenance is not preserved
  archived: source is kept but not active
  missing: neither active nor archived
  partial: some legacy capabilities are ported, while the listed capabilities remain missing
  retired: intentionally rejected with reason

legacy_roots:
  - path: __OLD_BACKUPS/MEGA_ALL_APPS.md
    state: missing
    priority: critical
    target_path: RECOVERY/pub/__OLD_BACKUPS/MEGA_ALL_APPS.md
    sha_seen: 1649c9d03e5b6981cf5d76e843f2296810807d4a
    reason: >
      Canonical old mega-ledger for Rails/OpenBSD app restoration. It records
      install payloads, checksums, app scope, and old assumptions.
    action: >
      Copy full file from pub into RECOVERY/pub/__OLD_BACKUPS/ and port intent
      into RAILS/apps.yml. Do not execute old generated installers.

  - path: ai3/
    state: absorbed
    priority: critical
    target_path: RECOVERY/pub/ai3/
    reason: >
      MASTER absorbed the idea, but the old standalone Ruby CLI, assistant
      inventory, LangChain/Weaviate/Ferrum layout, installers, and config
      provenance are not preserved.
    known_files:
      - ai3/README.md
      - ai3/ai3.rb
      - ai3/install.sh
      - ai3/install_ass.sh
      - ai3/Gemfile
      - ai3/config/config.yml
      - ai3/config/locales/en.yml
      - ai3/lib/cognitive.rb
      - ai3/lib/multimedia.rb
      - ai3/lib/scraper.rb
      - ai3/lib/utils/config.rb
      - ai3/lib/utils/file.rb
      - ai3/lib/utils/llm.rb
    action: >
      Preserve source under RECOVERY/pub/ai3/legacy or implement a deterministic
      importer into MASTER plugins/council roles.

  - path: bplans/consolidated/
    state: missing
    priority: high
    target_path: owner decision — archive, import, or explicitly retire the source
    reason: >
      The 2026-09-06 source measurement found 163 historical bplans files in pub,
      but no generator or shared HTML template. pub4 deliberately retired the
      dead generator brief instead of inventing a pipeline. Some source pages are
      personal or sensitive, so copying them into public pub4 is an owner decision.
    known_files:
      - bplans/consolidated/README.md
      - bplans/technology/rails-ecosystem-overview.md
      - bplans/__letters/thor.html
    action: >
      Preserve the source in pub history or record an explicit archive/retirement
      decision. Do not rebuild a generator that never existed.

  - path: plugin_schema_v1.json
    state: archived
    priority: medium
    target_path: MASTER/data/recovery/plugin_schema_v1.json
    reason: >
      Old framework plugin/module schema. MASTER has a runtime plugin registry,
      but schema provenance should stay available.

  - path: README.md
    state: ported
    priority: medium
    target_path: STUDIO/postpro/README.md
    reason: >
      Old root README described the image-processing/analog-engine product
      positioning; the current postpro boundary carries that purpose in its
      canonical README rather than preserving a second documentation file.

  - path: misc/vulcheck/
    state: ported
    priority: low
    target_path: DEPLOY/sh/tools/vulcheck.rb
    reason: >
      vulcheck exists in pub4 deploy tools. Keep source mapping for provenance.

  - path: brgen_app/
    state: ported
    priority: medium
    target_path: RAILS/brgen/
    reason: >
      Old Rails app shell exists in pub; pub4 uses the active RAILS/brgen app
      as its implementation. Preserve legacy intent as provenance, not as a
      second application shell.
    action: >
      Keep the current RAILS/brgen implementation canonical; do not restore the
      placeholder README as product truth.

rails_restore_debt:
  # Reconciled 2026-10-01 against RAILS/apps.yml. This ledger records only
  # capabilities still absent from the active trees; the inventory is the
  # implementation source of truth.
  brgen:
    state: ported
    missing: []

  amber:
    state: partial
    missing:
      - garment segmentation/background removal
      - closet organisation tips AI

  blognet:
    state: retired
    missing: []
    reason: >
      Retired from the active stack on 2026-08-12. Old content-generation
      material remains recovery-only context; its former feature backlog is not
      active restore debt.

  bsdports:
    state: ported
    missing: []

  hjerterom:
    state: retired
    missing: []
    reason: >
      Retired from the active stack on 2026-08-12. Old source and databases are
      recovery-only context; its former feature backlog is not active restore debt.

active_app_decisions:
  # Decided 2026-09-06, after four months at archived_port. The fleet is three
  # apps and apps.yml is feature truth: brgen, amber, bsdports. privcam has no
  # route, no host in the domain registry, no model, no view and no line of
  # code in any of the four trees — only this row and the ledger entry that
  # produced it. Restoring it is not a recovery task, it is starting a fourth
  # app, and that is a product decision with a moderation surface attached.
  #
  # Reversing this is one line: set state back to archived_port and add the
  # row to apps.yml. The provenance in __OLD_BACKUPS stays either way, which
  # is what "retired" means here rather than "deleted".
  privcam:
    legacy_state: active_app
    pub4_state: retired
    state: retired
    decided: 2026-09-06
    reason: >
      Not in apps.yml, not in the domain registry, and no source in pub4.
      A fourth Rails app is a product decision, not a restore.
  pub_attorney:
    legacy_state: archived_or_external
    pub4_state: archived_port
    decision_needed: restore_or_retire
  mytoonz:
    legacy_state: archived_or_external
    pub4_state: archived_port
    decision_needed: restore_or_retire

