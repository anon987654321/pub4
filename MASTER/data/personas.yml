# MASTER personas — LLM style descriptor and legacy voice fields.
# TTS synthesis always uses data/voice.yml (single_voice: osman / ms-MY) — persona affects text only.
# The per-persona `voice:` fields below are legacy and are NOT synthesized while
# persona_affects_text_only is true; they only feed idle-signature lookups.
# Add a new persona here, restart MASTER (or wait for hot-reload).
# style: deep | heavy | slow | normal | natural — see lib/voice/speech.rb STYLES.

schema: 1
malay:
  voice: ms-MY-OsmanNeural
  # Natural, soothing single voice: -32%/-180Hz pushed the neural engine well
  # past the range it renders cleanly (most Azure/edge neural voices start
  # showing artifacts past roughly +-15% rate / +-50Hz pitch) — very likely
  # what read as "choking" alongside the enqueue-race and TTS rate-limit bugs
  # fixed the same night. -8%/-35Hz keeps the same measured, low-key character
  # without leaving the engine's natural-sounding range.
  tts_rate: "-8%"
  tts_pitch: "-35Hz"
  style: auto
  description: "Terse. Direct. No filler. Dark, with inflection."
  knowledge_sources:
    - https://man.openbsd.org/
    - https://docs.ruby-lang.org/

