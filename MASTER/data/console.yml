# What MASTER prints and what each model turn is shown: the console's dmesg
# grammar and boot colours (lib/trace/dmesg.rb), and the orientation every
# model turn starts from (lib/ai/orientation.rb).
#
# Split out of data/limits.yml on 2026-10-31. Its zeitwerk section did not move:
# nothing read it, lib/master.rb holds the loader's inflections, and the copy
# had drifted (seven missing, one for a file that does not exist).

dmesg:
  enabled: true
  verbosity: normal
  style: openbsd
  format: "unitN at parent: detail | unitN: detail"
  env: MASTER_DMESG
  through: true
  scan_progress: true
  milestones: true
  flush: true
  # SGR for lines printed while MASTER boots: the OpenBSD console's kernel
  # colours, white on blue. Terminals only; the prompt and session stay plain.
  # Empty turns it off, as does NO_COLOR. The blue is 24-bit #0000FF, because
  # palette blue (44) is whatever the terminal theme says, and most themes make
  # it a light, washed-out blue. A terminal that does not set COLORTERM to
  # truecolor or 24bit reads the 24-bit form as faint and a reset, so it gets
  # boot_sgr_basic: palette white on palette blue, as the OpenBSD console has.
  boot_sgr: "37;48;2;0;0;255"
  boot_sgr_basic: "37;44"

# What every model turn is oriented with (lib/ai/orientation.rb). `tree: fix` is the /fix Tree, with sizes
# and the sprawl signals; read_in_full is the rule the turn is told, so an analysis reads a file whole
# before it judges it.
orientation:
  tree: fix
  tree_max_bytes: 6000
  read_in_full: >-
    read each important file whole with the file tool before judging it; a search for a string is not a
    reading, and an empty result proves nothing until the search is shown to find a known line.
