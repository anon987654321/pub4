schema: 1
orchestrator: lora/training/ragnhild/ai_toolkit/run_generate.sh
manifest: lora/training/ragnhild/manifest.json
prompt_file: lora/training/ragnhild/ai_toolkit/prompts.yaml
helpers:
  gate_check: lora/training/ragnhild/ai_toolkit/check_hf_flux_access.rb
  render_config: lora/training/ragnhild/ai_toolkit/render_config.rb
  postpro: lora/training/ragnhild/ai_toolkit/postpro_samples.rb
  ai_toolkit_runner: lora/training/ragnhild/ai_toolkit/run_ai_toolkit.rb
images_root: lora
weights_dir: lora/training/ragnhild/ai_toolkit/weights/ragnhild_v2
device_env: RAGNHILD_DEVICE
devices:
  - mps
  - cuda
  - cpu
upstream:
  name: ai-toolkit
  entrypoint: run.py
  note: only upstream boundary uses ai-toolkit venv python
mode_flags:
  check: --check
  train: --train
  generate: --generate
  postpro: --postpro
