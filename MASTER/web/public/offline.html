<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover">
<title>brgen — offline</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #000; color: #f5f0e8; font: 400 16px/1.5 "Inter", system-ui, sans-serif; }
body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.25rem; padding: 24px; text-align: center; }
p { opacity: .55; font-size: .9rem; max-width: 28rem; }
button {
  border: 1px solid color-mix(in srgb, #f5f0e8 28%, transparent);
  background: transparent;
  color: inherit;
  font: inherit;
  padding: 10px 18px;
  cursor: pointer;
  letter-spacing: .04em;
}
button:active { transform: scale(.98); }
</style>
</head>
<body>
<div>brgen</div>
<p id="status">you're offline — reconnect to continue</p>
<button type="button" id="retry">retry</button>
<script>
document.getElementById('retry').addEventListener('click', function() {
  var status = document.getElementById('status');
  status.textContent = 'retrying…';
  fetch('/', { cache: 'no-store' }).then(function(res) {
    if (res.ok) { location.reload(); return; }
    status.textContent = 'still offline — check connection';
  }).catch(function() {
    status.textContent = 'still offline — check connection';
  });
});
window.addEventListener('online', function() { location.reload(); });
</script>
</body>
</html>
