<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>brgen — frakoblet</title>
<style>
* { box-sizing: border-box; margin: 0; }
html, body {
  min-height: 100%;
  background: #000;
  color: #f5f0e8;
  font: 400 16px/1.5 "Helvetica Neue Pro", "Helvetica Neue", Arial, sans-serif;
}
body {
  display: grid;
  min-height: 100vh;
  place-items: center;
  padding: 24px;
}
main {
  display: grid;
  gap: 1.25rem;
  justify-items: center;
  max-width: 28rem;
  text-align: center;
}
p {
  max-width: 28rem;
  color: color-mix(in srgb, currentColor 55%, transparent);
  font-size: .9rem;
}
a {
  display: inline-flex;
  min-height: 44px;
  align-items: center;
  justify-content: center;
  border: 1px solid color-mix(in srgb, currentColor 28%, transparent);
  padding: 10px 18px;
  color: inherit;
  text-decoration: none;
  letter-spacing: .04em;
}
a:hover,
a:focus-visible {
  border-color: currentColor;
  text-decoration: underline;
  text-underline-offset: .2em;
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto; }
}
</style>
</head>
<body>
<main id="main-content">
  <header>brgen</header>
  <p>du er frakoblet — koble til igjen for å fortsette</p>
  <a href="/">prøv igjen</a>
</main>
</body>
</html>
