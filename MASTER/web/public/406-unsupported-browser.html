<!doctype html>
<html lang="en">
<head>
  <title>browser not supported</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    html, body {
      min-height: 100dvh;
      background: #000;
      color: #f5f0e8;
      font: 400 16px/1.5 "Inter", system-ui, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }
    main { max-width: 28rem; display: grid; gap: 12px; }
    h1 { font-weight: 200; font-size: clamp(1.4rem, 4vw, 2rem); letter-spacing: -.04em; }
    p { opacity: .55; font-size: .95rem; }
    a { color: inherit; opacity: .8; }
  </style>
</head>
<body>
  <main>
    <h1>update your browser</h1>
    <p>MASTER needs a modern browser with modules, WebSocket, and import maps. Try the latest Safari, Chrome, Firefox, or Edge.</p>
    <p><a href="/">retry anyway</a></p>
  </main>
</body>
</html>
