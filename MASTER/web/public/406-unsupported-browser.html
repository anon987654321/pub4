<!doctype html>
<html lang="en">
<head>
  <title>browser not supported</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    html, body {
      min-height: 100dvh;
      background: #000;
      color: #d8d6e0;
      font: 400 15px/1.5 ui-monospace, "JetBrains Mono", Menlo, monospace;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;,
    }
    main { max-width: 28rem; display: grid; gap: 14px; }
    h1 { font-weight: 400; font-size: clamp(1.1rem, 3.5vw, 1.4rem); letter-spacing: .04em; text-transform: lowercase; }
    p { opacity: .62; font-size: .9rem; }
    a.btn {
      display: inline-block;
      margin-top: 8px;
      padding: 12px 18px;
      min-height: 44px;
      border: 1px solid color-mix(in srgb, #d8d6e0 24%, transparent);
      color: inherit;
      text-decoration: none;
      border-radius: 0;,
    }
    a.btn:focus-visible { outline: 2px solid oklch(78% 0.10 300); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>open in safari or chrome</h1>
    <p>MASTER needs modules, WebSocket, and import maps. Update Safari, Chrome, Firefox, or Edge — then retry.</p>
    <p><a class="btn" href="/">retry</a></p>
  </main>
</body>
</html>
