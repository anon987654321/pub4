<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>swarm</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0a0c0a}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:none}
body::after{
  content:"";
  position:fixed;inset:0;
  pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0,rgba(0,0,0,.22) 1px,transparent 1px,transparent 3px);
  mix-blend-mode:multiply;
  z-index:9;
  animation:scan 24s linear infinite;
}
@keyframes scan{0%{background-position:0 0}100%{background-position:0 200px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const W = 320, H = 200;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha:false });
ctx.imageSmoothingEnabled = false;

function resize(){
  const dpr = Math.min(devicePixelRatio||1, 2);
  cv.width = Math.floor(innerWidth * dpr);
  cv.height = Math.floor(innerHeight * dpr);
}
resize();
addEventListener('resize', resize);

const N = 480;
const boids = new Array(N);
for (let i=0; i<N; i++) {
  boids[i] = {
    x: Math.random()*W, y: Math.random()*H,
    vx: (Math.random()-0.5)*1.2, vy: (Math.random()-0.5)*1.2
  };
}

let mode = 'idle';
let modeUntil = 0;
let speed = 1.0;
let target = null;
let flashUntil = 0;
const pointer = { x: W/2, y: H/2, active:false };

const PALETTE = {
  idle: '#cdc5b6',
  cohere: '#4a7d80',
  burst: '#d6a13f',
  ripple: '#a0522d',
  slow: '#1f221d'
};
const FRAME_MS = 1000/30;
let lastFrame = 0;

const density = new Uint8Array(W*H);

function paintDefaultDensity(){
  density.fill(0);
  for (let y=8; y<H-8; y+=14) {
    for (let x=W*0.18|0; x<W*0.82; x++) {
      const a = 220 - Math.abs(x - W/2)*1.4;
      if (a > 0) density[y*W + x] = Math.max(density[y*W + x], a|0);
    }
  }
  const corners = [[10,10],[W-12,10],[10,H-12],[W-12,H-12]];
  for (const [cx,cy] of corners) {
    for (let dy=-6; dy<=6; dy++) for (let dx=-6; dx<=6; dx++) {
      const x = cx+dx, y = cy+dy;
      if (x<0||y<0||x>=W||y>=H) continue;
      const a = 255 - (dx*dx+dy*dy)*4;
      if (a > 0) density[y*W + x] = Math.max(density[y*W + x], a|0);
    }
  }
}
paintDefaultDensity();

function paintRectsDensity(rects){
  density.fill(0);
  for (const r of rects) {
    const x0 = Math.max(0, r.x|0), y0 = Math.max(0, r.y|0);
    const x1 = Math.min(W, (r.x + r.w)|0), y1 = Math.min(H, (r.y + r.h)|0);
    const peak = r.kind === 'metal' ? 255 : 180;
    for (let y=y0; y<y1; y++) for (let x=x0; x<x1; x++) {
      density[y*W + x] = Math.max(density[y*W + x], peak);
    }
  }
}

addEventListener('pointermove', e => {
  pointer.x = (e.clientX / innerWidth) * W;
  pointer.y = (e.clientY / innerHeight) * H;
  pointer.active = true;
});
addEventListener('pointerout', () => { pointer.active = false; });

addEventListener('message', e => {
  const d = e.data || {};
  switch (d.type) {
    case 'morph':
      mode = 'cohere'; modeUntil = performance.now() + 2400;
      target = { x: W/2, y: H/2 }; break;
    case 'confidence':
      speed = 0.6 + Math.max(0, Math.min(1, +d.c||0)) * 1.0; break;
    case 'escalation':
      mode = 'burst'; modeUntil = performance.now() + 900;
      flashUntil = performance.now() + 120; break;
    case 'tool':
      mode = 'ripple'; modeUntil = performance.now() + 600;
      target = { x: Math.random()*W, y: Math.random()*H }; break;
    case 'confirm:pending':
      mode = 'slow'; modeUntil = performance.now() + 3000; break;
    case 'density':
      Array.isArray(d.rects) ? paintRectsDensity(d.rects) : paintDefaultDensity(); break;
  }
});

function sampleGradient(x, y){
  const xi = x|0, yi = y|0;
  if (xi<1||yi<1||xi>=W-1||yi>=H-1) return [0,0,0];
  const here = density[yi*W + xi];
  const gx = density[yi*W + xi+1] - density[yi*W + xi-1];
  const gy = density[(yi+1)*W + xi] - density[(yi-1)*W + xi];
  return [gx, gy, here];
}

const buf = document.createElement('canvas');
buf.width = W; buf.height = H;
const bctx = buf.getContext('2d', { alpha:false });
bctx.imageSmoothingEnabled = false;
bctx.fillStyle = '#0a0c0a';
bctx.fillRect(0,0,W,H);

function step(now){
  if (now - lastFrame < FRAME_MS) { requestAnimationFrame(step); return; }
  lastFrame = now;
  if (now > modeUntil) mode = 'idle';
  bctx.fillStyle = 'rgba(10,12,10,0.22)';
  bctx.fillRect(0,0,W,H);

  const sepR = 4, alignR = 12, cohR = 16;
  const cohereBoost = mode === 'cohere' ? 4 : 1;
  const burstBoost  = mode === 'burst'  ? 2 : 1;
  const slowDamp    = mode === 'slow'   ? 0.4 : 1;
  const densityK    = mode === 'burst' ? 0.00018 : 0.00065;

  for (let i=0; i<N; i++) {
    const b = boids[i];
    let sx=0, sy=0, ax=0, ay=0, cx=0, cy=0, sn=0, an=0, cn=0;
    for (let j=0; j<N; j++) {
      if (i===j) continue;
      const o = boids[j];
      const dx = o.x - b.x, dy = o.y - b.y;
      const d2 = dx*dx + dy*dy;
      if (d2 < sepR*sepR && d2 > 0.001) { sx -= dx; sy -= dy; sn++; }
      if (d2 < alignR*alignR) { ax += o.vx; ay += o.vy; an++; }
      if (d2 < cohR*cohR)    { cx += o.x;  cy += o.y;  cn++; }
    }
    if (sn>0) { b.vx += (sx/sn)*0.05; b.vy += (sy/sn)*0.05; }
    if (an>0) { b.vx += (ax/an - b.vx)*0.04; b.vy += (ay/an - b.vy)*0.04; }
    if (cn>0) { b.vx += (cx/cn - b.x)*0.0008*cohereBoost; b.vy += (cy/cn - b.y)*0.0008*cohereBoost; }

    const [gx, gy] = sampleGradient(b.x, b.y);
    b.vx += gx * densityK; b.vy += gy * densityK;

    const aim = (mode === 'cohere' || mode === 'ripple') ? target : (pointer.active ? pointer : null);
    if (aim) {
      const dx = aim.x - b.x, dy = aim.y - b.y;
      const k = mode === 'ripple' ? -0.012 : 0.004;
      b.vx += dx*k; b.vy += dy*k;
    }

    b.vx *= slowDamp; b.vy *= slowDamp;

    const sp = Math.hypot(b.vx, b.vy);
    const cap = 1.6 * speed * burstBoost;
    if (sp > cap) { b.vx = b.vx/sp*cap; b.vy = b.vy/sp*cap; }

    b.x += b.vx; b.y += b.vy;
    if (b.x < 0) b.x += W; else if (b.x >= W) b.x -= W;
    if (b.y < 0) b.y += H; else if (b.y >= H) b.y -= H;
  }

  const baseColor = (now < flashUntil) ? '#cdc5b6' : PALETTE[mode] || PALETTE.idle;
  bctx.fillStyle = baseColor;
  for (let i=0; i<N; i++) {
    const b = boids[i];
    const x = b.x|0, y = b.y|0;
    bctx.fillRect(x, y, 2, 2);
  }

  if (pointer.active) {
    bctx.fillStyle = '#cdc5b6';
    const px = pointer.x|0, py = pointer.y|0;
    bctx.fillRect(px-1, py, 3, 1);
    bctx.fillRect(px, py-1, 1, 3);
  }

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, 0, 0, cv.width, cv.height);

  requestAnimationFrame(step);
}

requestAnimationFrame(step);
</script>
</body>
</html>
