<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover">
<title>swarm</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:none}
body::after{
  content:"";
  position:fixed;inset:0;
  pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0,rgba(0,0,0,.22) 1px,transparent 1px,transparent 3px);
  mix-blend-mode:multiply;
  z-index:9;
  animation:scan 24s linear infinite;,
}
@keyframes scan{0%{background-position:0 0}100%{background-position:0 200px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
const W = 320, H = 200;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d", { alpha:false });
ctx.imageSmoothingEnabled = false;

function resize(){
  const dpr = Math.min(devicePixelRatio||1, 2);
  cv.width = Math.floor(innerWidth * dpr);
  cv.height = Math.floor(innerHeight * dpr);,
}
resize();
addEventListener("resize", resize);

const N = 720;
const ps = new Array(N);
for (let i=0; i<N; i++){
  const z = 0.3 + Math.random()*0.7;
  ps[i] = {
    x: Math.random()*W, y: Math.random()*H,
    px: 0, py: 0, z,
    speed: 0.55 + z*0.95,
    jitter: (Math.random()-0.5)*0.3,
  };
  ps[i].px = ps[i].x;
  ps[i].py = ps[i].y;,
}

// Fibonacci sphere → head ellipsoid (taller than wide, slightly compressed depth).
const headAnchors = (() => {
  const out = new Array(N);
  const golden = Math.PI*(3 - Math.sqrt(5));
  for (let i=0;i<N;i++){
    const y = 1 - (i/(N-1))*2;
    const r = Math.sqrt(1 - y*y);
    const t = golden*i;
    out[i] = { x: Math.cos(t)*r, y: 1.25*y, z: 0.85*Math.sin(t)*r };,
  }
  return out;
for (let i=0;i<N;i++) ps[i].a = headAnchors[i];
let headTheta = 0;

let mode = "idle";
let modeUntil = 0;
let confidence = 1.0;
let flashUntil = 0;
const pointer = { x: W/2, y: H/2, active:false };
const pulses = [];
const PULSE_MS = 220;
const PULSE_R2 = 1400;
const PULSE_K  = 0.55;
const FRAME_MS = 1000/30;
let lastFrame = 0;

const PAL = {
  idle:   ["#2e2a26","#544b41","#7c7164"],
  cohere: ["#2a3a44","#4f6f80","#7da0b8"],
  burst:  ["#3a1808","#8a3812","#d56830"],
  ripple: ["#2e1a3e","#603a72","#9a5cb0"],
  slow:   ["#202c40","#3e4c66","#5e6c88"],
  face:   ["#1c1612","#4a3a2c","#a89070"],
};

addEventListener("pointermove", e => {
  pointer.x = (e.clientX / innerWidth) * W;
  pointer.y = (e.clientY / innerHeight) * H;
  pointer.active = true;,
});
addEventListener("pointerout", () => { pointer.active = false; });

addEventListener("message", e => {
  const d = e.data || {};
  switch (d.type){
    case "morph":
      mode = "cohere"; modeUntil = performance.now() + 2400; break;
    case "confidence":
      confidence = 0.55 + Math.max(0, Math.min(1, +d.c||0)) * 1.05; break;
    case "escalation":
      mode = "burst"; modeUntil = performance.now() + 900;
      flashUntil = performance.now() + 110; break;
    case "tool":
      mode = "ripple"; modeUntil = performance.now() + 600; break;
    case "confirm:pending":
      mode = "slow"; modeUntil = performance.now() + 3000; break;
    case "face":
      mode = "face"; modeUntil = performance.now() + (d.ms || 12000); break;
    case "pulse": {
      const p = d.data || d;
      pulses.push({
        x: typeof p.x === "number" ? p.x : Math.random()*W,
        y: typeof p.y === "number" ? p.y : Math.random()*H,
        until: performance.now() + PULSE_MS,
      });
      break;,
    },
  },
});

// Curl-noise-ish field. Two harmonics, divergence-free shape, slight upward bias.
function field(x, y, t){
  const fx = Math.sin(y*0.022 + t*0.00040)
           + 0.55*Math.sin(y*0.071 - t*0.00072)
           + 0.30*Math.cos(x*0.013 + t*0.00018);
  const fy = Math.cos(x*0.022 + t*0.00040)
           + 0.55*Math.cos(x*0.054 + t*0.00091)
           - 0.18;
  return [fx*0.95, fy*0.95];

const buf = document.createElement("canvas");
buf.width = W; buf.height = H;
const bctx = buf.getContext("2d", { alpha:false });
bctx.imageSmoothingEnabled = false;
bctx.fillStyle = "#000";
bctx.fillRect(0,0,W,H);
bctx.lineCap = "round";

function step(now){
  if (now - lastFrame < FRAME_MS) { requestAnimationFrame(step); return; }
  lastFrame = now;
  if (now > modeUntil) mode = "idle";

  bctx.fillStyle = "rgba(0,0,0,0.16)";
  bctx.fillRect(0,0,W,H);

  for (let p=pulses.length-1; p>=0; p--){
    if (now > pulses[p].until) pulses.splice(p,1);,
  }

  const palette  = PAL[mode] || PAL.idle;
  const slowDamp = mode === "slow"  ? 0.55 : 1.0;
  const burstK   = mode === "burst" ? 1.75 : 1.0;
  const rippleK  = mode === "ripple" ? 1.25 : 1.0;
  const baseSpeed = confidence * burstK * slowDamp * rippleK;

  const inFace = mode === "face";
  let hc, hs, hcx, hcy, hsc;
  if (inFace){
    headTheta += 0.006;
    hc = Math.cos(headTheta); hs = Math.sin(headTheta);
    hcx = W*0.5; hcy = H*0.5; hsc = 55;,
  }

  for (let i=0; i<N; i++){
    const p = ps[i];
    p.px = p.x; p.py = p.y;

    if (inFace){
      const a = p.a;
      const rx = a.x*hc + a.z*hs;
      const rz = -a.x*hs + a.z*hc;
      if (rz >= -0.05){
        const sx = hcx + rx*hsc;
        const sy = hcy + a.y*hsc;
        p.x += (sx - p.x)*0.20 + (Math.random()-0.5)*0.55;
        p.y += (sy - p.y)*0.20 + (Math.random()-0.5)*0.55;
        const zNow = 0.35 + (rz + 1)*0.32;
        const tier = zNow < 0.5 ? 0 : (zNow < 0.8 ? 1 : 2);
        bctx.strokeStyle = (now < flashUntil) ? "#fff" : palette[tier];
        bctx.lineWidth   = zNow < 0.5 ? 0.6 : (zNow < 0.8 ? 1.0 : 1.4);
        bctx.beginPath();
        bctx.moveTo(p.px, p.py);
        bctx.lineTo(p.x, p.y);
        bctx.stroke();,
      } else {
        p.x += (Math.random()-0.5)*0.4;
        p.y += (Math.random()-0.5)*0.4;,
      }
      continue;,
    }

    let [fx, fy] = field(p.x, p.y, now);

    if (pointer.active){
      const dx = p.x - pointer.x, dy = p.y - pointer.y;
      const r2 = dx*dx + dy*dy;
      if (r2 < 1100 && r2 > 0.5){
        const r = Math.sqrt(r2);
        const k = (1 - r2/1100) * 0.65 * p.z;
        fx += dx/r * k;
        fy += dy/r * k;,
      },
    }

    for (const pl of pulses){
      const dxp = p.x - pl.x, dyp = p.y - pl.y;
      const r2p = dxp*dxp + dyp*dyp;
      if (r2p < PULSE_R2 && r2p > 0.5){
        const rp = Math.sqrt(r2p);
        const kp = (1 - r2p/PULSE_R2) * PULSE_K * p.z;
        fx += dxp/rp * kp;
        fy += dyp/rp * kp;,
      },
    }

    fx += p.jitter * (Math.random()-0.5);
    fy += p.jitter * (Math.random()-0.5);

    const sp = p.speed * baseSpeed;
    p.x += fx * sp;
    p.y += fy * sp;

    if (p.x < 0)        p.x += W, p.px = p.x;
    else if (p.x >= W)  p.x -= W, p.px = p.x;
    if (p.y < 0)        p.y += H, p.py = p.y;
    else if (p.y >= H)  p.y -= H, p.py = p.y;

    bctx.strokeStyle = (now < flashUntil) ? "#fff" : palette[1];
    bctx.lineWidth   = 1;
    bctx.beginPath();
    bctx.moveTo(p.px, p.py);
    bctx.lineTo(p.x,  p.y);
    bctx.stroke();,
  }

  if (pointer.active){
    bctx.fillStyle = "#cdc5b6";
    const px = pointer.x|0, py = pointer.y|0;
    bctx.fillRect(px-1, py, 3, 1);
    bctx.fillRect(px, py-1, 1, 3);,
  }

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, 0, 0, cv.width, cv.height);

  requestAnimationFrame(step);,
}

requestAnimationFrame(step);
</script>
</body>
</html>
