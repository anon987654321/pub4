# Norwegian for the MASTER web surface. ai.brgen.no is the only host relayd
# forwards here, it is a .no domain, and every other surface in this repo
# defaults to nb.
#
# Parity with en.yml is enforced by RAILS/test/locale_contract_test.rb, for the
# reason that file gives: Rails falls back to :en for a key nb does not carry,
# so a missing translation renders as English and raises nothing.
#
# The lowercase style matches en.yml. The dashboard is a mission-control panel
# whose labels are lowercase by design; they are not sentence fragments missing
# a capital.
nb:
  skip_to_content: "Hopp til hovedinnhold"
  skip_to_prompt: "Hopp til skrivefeltet"
  dashboard:
    title: "MASTER — kontrollrom"
    heading_chat: "← samtale"
    heading_sep: "·"
    heading_mission: "kontrollrom"
    main_label: "Kontrollrom"
    loading: "laster…"
    auth_required: "kontrollrommet krever operatørnøkkelen"
    empty_none: "(ingen)"
    empty_empty: "(tom)"
    empty_quiet: "(stille)"
    panels:
      status: "status"
      rtk: "rtk-besparelse"
      plan: "aktiv plan"
      rsi: "rsi-innboks"
      skills: "ferdigheter"
      pressure: "kontekstpress"
      providers: "leverandørhelse"
      repair: "reparasjonskø"
      bus: "siste busshendelser"
    status:
      model: "modell"
      # ctx, tokens and rtk stay as they are: they are the names MASTER's own
      # runtime prints, and a panel that says "ktx" where the log says "ctx" is
      # a translation that costs the reader the match.
      ctx: "ctx"
      tokens: "tokens"
      cost: "kostnad"
      agent_pool: "agentpool"
      breakers: "brytere"
      breakers_none: "ingen"
    rtk:
