# Norwegian for the MASTER web surface. ai.brgen.no is the only host relayd
# forwards here, it is a .no domain, and every other surface in this repo
# defaults to nb.
#
# Parity with en.yml is enforced by RAILS/test/locale_contract_test.rb, for the
# reason that file gives: Rails falls back to :en for a key nb does not carry,
# so a missing translation renders as English and raises nothing.
#
# The lowercase style matches en.yml. The dashboard is a mission-control panel
# whose labels are lowercase by design; they are not sentence fragments missing
# a capital.
nb:
  hello: "Hei verden"
  skip_to_content: "Hopp til hovedinnhold"
  skip_to_prompt: "Hopp til skrivefeltet"
  dashboard:
    title: "MASTER — kontrollrom"
    heading_chat: "← samtale"
    heading_sep: "·"
    heading_mission: "kontrollrom"
    main_label: "Kontrollrom"
    loading: "laster…"
    empty_none: "(ingen)"
    empty_empty: "(tom)"
    empty_quiet: "(stille)"
    panels:
      status: "status"
      rtk: "rtk-besparelse"
      plan: "aktiv plan"
      rsi: "rsi-innboks"
      skills: "ferdigheter"
      pressure: "kontekstpress"
      providers: "leverandørhelse"
      repair: "reparasjonskø"
      bus: "siste busshendelser"
    status:
      model: "modell"
      # ctx, tokens and rtk stay as they are: they are the names MASTER's own
      # runtime prints, and a panel that says "ktx" where the log says "ctx" is
      # a translation that costs the reader the match.
      ctx: "ctx"
      tokens: "tokens"
      cost: "kostnad"
      agent_pool: "agentpool"
      breakers: "brytere"
      breakers_none: "ingen"
    rtk:
      commands: "kommandoer"
      saved: "spart"
      bytes: "byte"
    pressure:
      band: "bånd"
      tokens: "tokens"
      pct: "pst"
      headroom: "ledig kapasitet"
    providers:
      status: "status"
      open_breakers: "åpne brytere"
      agent_pool: "agentpool"
      breakers_none: "ingen"
  face:
    skip_prompt: "Hopp til skrivefeltet"
    face_aria: "MASTER-ansiktet — visuelt speil av tilstanden"
    chat_aria: "MASTER-samtale"
    prompt_aria: "MASTER-skrivefelt"
    message_aria: "Melding"
    attach_photo: "Legg ved bilde"
    pause_speech: "Pause eller fortsett tale"
    placeholder: "spør om hva som helst"
    mic_state: "Mikrofon"
    primer_title: "start AI"
    primer_capabilities: "stemme · bilde · musikk · kode"
    primer_consent: "Starter bilde og lyd. Mikrofonen spørres om først når du velger stemme; tekst virker om grafikken feiler."
    primer_start_with_voice: "Start med stemme"
    starting: "starter…"
    loading_title: "laster… %{n}%"
    loading_status: "laster ansiktet %{n}%"
    still_loading: "laster fortsatt ansiktet…"
    retrying: "prøver igjen…"
    failed: "ansiktet lastet ikke — last siden på nytt eller sjekk konsollen"
    failed_live: "ansiktet lastet ikke (WebGL/primer-timing?). Last siden på nytt eller se konsollen for MASTER_FACE-feil."
