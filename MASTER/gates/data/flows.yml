      - name: the_mail
        mail:
          to: "$FLOW_BSDPORTS_EMAIL"
          capture: [{ pattern: 'session/magic\?token=([A-Za-z0-9_-]{16,})', as: magic }]
      - name: open_the_link
        get: /session/magic?token=$magic
        expect_status: [200]
        expect_final_path: { not_matches: '^/session' }
      - name: the_link_is_single_use
