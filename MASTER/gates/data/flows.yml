        get: /manifest.json
        asset: true
        expect_status: [200]
        expect_body: ['"start_url"', '"name"']
      - name: service_worker
        get: /service-worker.js
        asset: true
        expect_status: [200]
      - name: offline
        get: /offline
        expect_status: [200]

  # --- bsdports --------------------------------------------------------------

  - id: bsdports_search_then_open_port
    app: bsdports
    description: Search the catalogue, open the first hit, and land on that port's page.
    steps:
      - name: search
        get: /ports?q=git
        expect_status: [200]
        capture: [{ pattern: 'href="(/ports/\d+)"', as: hit, optional: true }]
      - name: open_the_hit
        get: $hit
        needs: [hit]
        expect_status: [200]
        expect_final_path: $hit
        expect_any: ['(?i)<h1']

  - id: bsdports_category_to_port
    app: bsdports
    description: Browse the categories, open one and open a port inside it.
    steps:
      - name: categories
        get: /categories
        expect_status: [200]
        capture: [{ pattern: 'href="(/categories/[^"]+)"', as: category, optional: true }]
      - name: open_category
        get: $category
        needs: [category]
        expect_status: [200]
        capture: [{ pattern: 'href="(/ports/\d+)"', as: port_path, optional: true }]
      - name: open_port
        get: $port_path
        needs: [port_path]
        expect_status: [200]
        expect_final_path: $port_path

  - id: bsdports_pwa_manifest_and_service_worker
    app: bsdports
    description: The install manifest and the service worker answer.
    steps:
      - name: manifest
        get: /manifest
        asset: true
        expect_status: [200]
        expect_body: ['"start_url"']
      - name: service_worker
        get: /service-worker
        asset: true
        expect_status: [200]

  # --- master ----------------------------------------------------------------
  # Master's one write is a chat turn, which calls a model and costs credits, so
  # no journey sends one. What can be exercised for free is the runtime a face
  # boots from and the one command that must refuse a stranger.

  - id: master_runtime_endpoints_answer
    app: master
    description: The runtime the face boots from answers with JSON — config, status, skills — and the manifest installs.
    steps:
      - name: config
        get: /runtime/config
        accept: "application/json"
        asset: true
        expect_status: [200]
        expect_body: ['^\s*[\{\[]']
      - name: status
        get: /runtime/status
        accept: "application/json"
        asset: true
        expect_status: [200]
        expect_body: ['^\s*[\{\[]']
      - name: skills
        get: /chat/skills
        asset: true
        expect_status: [200]
      - name: manifest
        get: /manifest
        accept: "application/manifest+json,*/*"
        asset: true
        expect_status: [200]
        expect_body: ['"start_url"|"name"']

  - id: master_unlock_refuses_a_wrong_token
    app: master
    description: A visitor cannot unlock tool access with a guess, and the refusal is a 401, not a 500 or a silent success.
    steps:
      - name: face
        get: /
        expect_status: [200]
      - name: wrong_unlock
        post: /chat/command
        params: { command: "/unlock not-the-token-$unique" }
        asset: true
        expect_status: [401]
        expect_body: ['unlock denied']
