  # The three journeys below are the signed-in half of the product, which every
  # flow above this line leaves unmeasured: 55 steps, all GET, no flow declaring
  # an actor. A read-only suite proves 23 journeys do not 500 for a stranger and
  # cannot tell a working form from one that renders and drops what you type.
  #
  # Each one signs in, writes, and then reads the write back on a later page —
  # asserting the record ARRIVED, not that the POST returned a tolerable status.
  # A 302 to the index is what a successful create and a silently discarded one
  # both look like.
  #
  # They need an account on whatever database is running, so each names the
  # environment it wants rather than carrying a credential. Unset, the flow is
  # named in the gate's "Not checked" list and never counted as having passed --
  # but the gate still passes on the journeys that did run, in strict mode too,
  # because GATE_STRICT_INCONCLUSIVE promotes only a gate that measured nothing
  # at all. Seed an account, export the pair, and the journey runs:
  #
  #   FLOW_BSDPORTS_EMAIL=you@example.no FLOW_BSDPORTS_PASSWORD=... \
  #     ruby MASTER/gates/runner.rb user_flow
  # bsdports has no comment form: the route and the controller exist (a POST to
  # /ports/:id/comments lands), but ports/show renders no field to write in, so a
  # journey that "comments" would invent a request no visitor can make. The
  # signed-in write a visitor can make is watching a port.
  - id: bsdports_signed_in_watch_lands
    app: bsdports
    description: A signed-in visitor watches a port and the page offers to unwatch it, then unwatches and it offers to watch again.
    requires_credentials: [FLOW_BSDPORTS_EMAIL, FLOW_BSDPORTS_PASSWORD]
    steps:
      - name: sign_in_form
        get: /session/new
        expect_status: [200]
      - name: sign_in
        post: /session
        params: { email_address: "$FLOW_BSDPORTS_EMAIL", password: "$FLOW_BSDPORTS_PASSWORD" }
        expect_status: [200]
        # Landing back on /session/new means the credentials were refused and
        # every step after this would test a guest while claiming to test an
        # account — the exact confusion this journey exists to end.
        expect_final_path: { not: /session/new }
      - name: ports
        get: /ports
        expect_status: [200]
        capture: [{ pattern: 'href="(/ports/\d+)"', as: port_path, optional: true }]
      - name: start_unwatched
        post: $port_path/unwatch
        needs: [port_path]
        params: { _method: delete }
        expect_status: [200]
      - name: a_port
        get: $port_path
        expect_status: [200]
        expect_body: ['action="$port_path/watch"']
      - name: watch
        post: $port_path/watch
        expect_status: [200]
        expect_final_path: $port_path
        expect_body: ['action="$port_path/unwatch"']
        forbid_body: ['action="$port_path/watch"']
      - name: unwatch
        post: $port_path/unwatch
        params: { _method: delete }
        expect_status: [200]
        expect_final_path: $port_path
        expect_body: ['action="$port_path/watch"']

  - id: bsdports_magic_link_signs_in
    app: bsdports
    description: Ask for a sign-in link by email, open it from the mail, and be signed in (the page offers watching).
    requires_credentials: [FLOW_BSDPORTS_EMAIL]
    steps:
      - name: sign_in_form
        get: /session/new
        expect_status: [200]
      - name: request_link
