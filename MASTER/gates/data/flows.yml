  # ---------------------------------------------------------------------------
  # Write journeys. Everything above reads; these change state and read the
  # change back on a later page.
  #
  # They need no seeded account and no credentials: brgen lets a guest post,
  # vote, comment and order (a guest is a real, saved user), and the journeys
  # that need a registered account create one with $unique in its address, so a
  # run never collides with an earlier run's rows. The confirmation and reset
  # mails are read from the app's tmp/mails (RAILS/__shared development.rb
  # writes them there); FLOW_<APP>_PORT points a flow at a copy booted on a
  # spare port. Sign-up is rate limited to 10 per 10 minutes per address, and
  # these journeys use three of them.
  #
  # mutates: true marks a journey that creates accounts, posts, listings or orders
  # in whatever database the app under test uses. The gate runs it on a laptop's
  # development triangle and refuses it on the deploy host, where the app it would
  # write to is production (GATE_ALLOW_WRITES=1 overrides, for a throwaway copy).
  #
  # Vocabulary beyond the first half of this file:
  #   $name           a string captured earlier, an env credential, or $unique
  #   capture:        first group of a pattern, kept as a string ($name later)
  #   number:         first group as an integer, comparable in assert[] (delta: shifts right)
  #   needs: [name]   inconclusive, not failed, when an earlier capture found nothing
  #   mail:           open the message sent to `to` and capture from the link in it
  #   capture_final_path: name   keep the path a redirect ended on
  #   expect_final_path: { matches: re } | { not_matches: re }
  # ---------------------------------------------------------------------------

  - id: brgen_signup_confirm_email_then_post
    app: brgen
    mutates: true
    description: >
      Sign up, find the account refused a post until the emailed link is opened,
      open it, and see the post land. Confirmation is the only gate between a
      registered account and the feed.
    steps:
      - name: sign_up_form
        get: /users/new
        expect_status: [200]
        expect_any: ['name="user\[email_address\]"']
      - name: sign_up
        post: /users
        params:
          user:
            email_address: "flow-$unique@example.test"
            username: "flow$unique"
            password: "Passord-123456"
            password_confirmation: "Passord-123456"
          accept_terms: "1"
          accept_age: "1"
        expect_status: [200]
        expect_final_path: /
      - name: signed_in_now
        get: /account
        expect_status: [200]
        expect_final_path: /account
      - name: compose_form
        get: /posts/new
        expect_status: [200]
      - name: post_before_confirming_is_refused
        post: /posts
        params: { post: { title: "Ubekreftet $unique", content: "skal ikke lande" } }
        expect_status: [200]
        expect_final_path: /posts/new
      - name: confirmation_mail
        mail:
          to: "flow-$unique@example.test"
          capture: [{ pattern: 'verify/([A-Za-z0-9_-]{16,})', as: token }]
      - name: open_the_emailed_link
        get: /verify/$token
        expect_status: [200]
        expect_final_path: /
      - name: compose_form_again
        get: /posts/new
        expect_status: [200]
      - name: post_after_confirming_lands
        post: /posts
        params: { post: { title: "Bekreftet $unique", content: "dette lander" } }
        expect_status: [200]
        expect_final_path: { matches: '^/posts/' }
        expect_body: ['Bekreftet $unique']
        capture_final_path: post_path
      - name: it_is_in_the_feed
        get: /posts?sort=fresh
        expect_status: [200]
        expect_body: ['Bekreftet $unique']
        forbid_body: ['Ubekreftet $unique']

  - id: brgen_sign_out_in_profile_bookmark_report
    app: brgen
    mutates: true
    description: >
      A registered account signs out, is turned away with a wrong password, signs
      back in, edits its profile, bookmarks a post and reports it. Each write is
      read back on the page that shows it.
    steps:
      - name: sign_up_form
        get: /users/new
        expect_status: [200]
      - name: sign_up
        post: /users
        params:
          user:
            email_address: "flow-$unique@example.test"
            username: "flow$unique"
            password: "Passord-123456"
            password_confirmation: "Passord-123456"
          accept_terms: "1"
          accept_age: "1"
        expect_status: [200]
        capture: [{ pattern: 'x^', as: nothing, optional: true }]
      - name: account
        get: /account
        expect_status: [200]
        expect_final_path: /account
        capture: [{ pattern: 'href="/users/(\d+)"', as: uid }]
      - name: sign_out
        post: /session
        params: { _method: delete }
        expect_status: [200]
        expect_final_path: /session/new
      - name: wrong_password_is_refused
        post: /session
        params: { email_address: "flow-$unique@example.test", password: "feil-passord-000" }
        expect_status: [200]
        expect_final_path: /session/new
      - name: right_password_signs_in
        post: /session
        params: { email_address: "flow-$unique@example.test", password: "Passord-123456" }
        expect_status: [200]
        expect_final_path: { not: /session/new }
      - name: account_again
        get: /account
        expect_status: [200]
        expect_final_path: /account
      - name: profile_form
        get: /users/$uid/edit
        expect_status: [200]
        expect_any: ['name="user\[display_name\]"']
      - name: profile_edit
        post: /users/$uid
        params: { _method: patch, user: { display_name: "Flowny $unique", username: "flow$unique" } }
        expect_status: [200]
        expect_body: ['Flowny $unique']
      - name: notifications_open
        get: /notifications
        expect_status: [200]
        expect_final_path: /notifications
      - name: a_post_to_act_on
        get: /posts
        expect_status: [200]
        capture:
          - { pattern: 'action="(/posts/[a-z0-9-]+)/repost"', as: target_post, optional: true }
