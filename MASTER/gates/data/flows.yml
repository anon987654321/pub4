  - id: brgen_vote_up_down_toggles
    app: brgen
    mutates: true
    description: >
      Upvote, upvote again (undo), downvote, downvote again (undo), upvote then
      flip to a downvote. The score on the post page moves by exactly what the
      controller promises: a repeated vote withdraws, a changed vote replaces.
    steps:
      - name: compose_form
        get: /posts/new
        expect_status: [200]
      - name: publish
        post: /posts
        params: { post: { title: "Stemmetest $unique", content: "stem her" } }
        expect_status: [200]
        capture_final_path: post_path
      - name: score_start
        get: $post_path
        expect_status: [200]
        number: [{ pattern: 'post-vote-score">\s*(-?\d+)', as: s0 }]
      - name: upvote
        post: $post_path/vote
        params: { vote: { value: 1 } }
        expect_status: [200]
      - name: score_after_up
        get: $post_path
        expect_status: [200]
        number: [{ pattern: 'post-vote-score">\s*(-?\d+)', as: s_up }]
      - name: upvote_again_withdraws
        post: $post_path/vote
        params: { vote: { value: 1 } }
        expect_status: [200]
      - name: score_after_undo
        get: $post_path
        expect_status: [200]
        number: [{ pattern: 'post-vote-score">\s*(-?\d+)', as: s_undo_up }]
      - name: downvote
        post: $post_path/vote
        params: { vote: { value: -1 } }
        expect_status: [200]
      - name: score_after_down
        get: $post_path
        expect_status: [200]
        number: [{ pattern: 'post-vote-score">\s*(-?\d+)', as: s_down }]
      - name: downvote_again_withdraws
        post: $post_path/vote
        params: { vote: { value: -1 } }
        expect_status: [200]
      - name: score_after_undo_down
        get: $post_path
        expect_status: [200]
        number: [{ pattern: 'post-vote-score">\s*(-?\d+)', as: s_undo_down }]
      - name: upvote_then_flip
        post: $post_path/vote
        params: { vote: { value: 1 } }
        expect_status: [200]
      - name: flip_to_down
        post: $post_path/vote
        params: { vote: { value: -1 } }
        expect_status: [200]
      - name: score_after_flip
        get: $post_path
        expect_status: [200]
        number: [{ pattern: 'post-vote-score">\s*(-?\d+)', as: s_flip }]
    assert:
      - { left: s0, op: "==", right: 0, why: "a new post starts at zero" }
      - { left: s_up, op: "==", right: s0, delta: 1, why: "an upvote adds one" }
      - { left: s_undo_up, op: "==", right: s0, why: "voting the same way twice withdraws the vote" }
      - { left: s_down, op: "==", right: s0, delta: -1, why: "a downvote subtracts one" }
      - { left: s_undo_down, op: "==", right: s0, why: "downvoting twice withdraws the vote" }
      - { left: s_flip, op: "==", right: s0, delta: -1, why: "a changed vote replaces the old one, it does not stack (up then down is -1, not -2 or 0)" }

