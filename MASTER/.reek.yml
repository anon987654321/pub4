# Reek configuration for MASTER
#
# Who reads this: nothing, by default — and that is easy to get wrong. reek
# appears in no CI step, but lib/review/scan/rules/external_linter_rules.rb
# defines a "reek" scan rule that shells out to `reek --format json <path>`,
# which picks this file up. That rule returns early unless
# MASTER_EXTERNAL_LINT=1, and nothing in lib/, bin/, data/ or OPENBSD sets it.
#
# So these thresholds are inert today and become live the moment someone
# exports that variable. Worth knowing before flipping it: max_methods was
# lowered from 25 to 10 on 2026-07-31 to match the scanner's own METHOD_LIMIT,
# which took TooManyMethods across MASTER/lib from 6 findings to 85. Those are
# not new god classes — the scanner has been reporting them all along and reek
# was the one disagreeing — but /scan output would grow by that much in one
# step.
detectors:
  # Module/class comments not required — naming + structure is the doc.
  IrresponsibleModule:
    enabled: false

  # Single-char block vars are idiomatic Ruby.
  UncommunicativeVariableName:
    accept:
      - a
      - b
      - c
      - d
      - e
      - f
      - g
      - h
      - i
      - j
      - k
      - l
      - m
      - n
      - o
      - p
      - q
      - r
      - s
      - t
      - u
      - v
      - w
      - x
      - y
      - z
      - t0
      - t1
      - id

  UncommunicativeParameterName:
    accept:
      - _
      - _e
      - _k
      - _v

  # Threshold: 3+ calls to same expr warrant extraction; 2 is normal Ruby.
  DuplicateMethodCall:
    max_calls: 3
    allow_calls:
      - puts
      - print
      - raise

  # method(bool) is valid for simple flag params; use keyword args for complex.
  BooleanParameter:
    enabled: false

  # Parameter-controlled flow is normal; caller decides behavior.
  ControlParameter:
    enabled: false

  # Mixins accessing @ivars they don't own is expected in this codebase.
  InstanceVariableAssumption:
    enabled: false

  # _prefix convention covers unused params.
  UnusedParameters:
    enabled: false

  # Grouped params (bus:, root:, agent:) are intentional constructor patterns.
  DataClump:
    enabled: false

  # nil? and &. are idiomatic.
  NilCheck:
    enabled: false

  # Static utility helpers don't need to be moved.
  UtilityFunction:
    enabled: false

  ManualDispatch:
    enabled: true
  MissingSafeMethod:
    enabled: false
  FeatureEnvy:
    enabled: false

  TooManyStatements:
    max_statements: 20

  TooManyMethods:
    max_methods: 10

  TooManyInstanceVariables:
    max_instance_variables: 10

  TooManyConstants:
    max_constants: 12

  LongParameterList:
    max_params: 5

  NestedIterators:
    max_allowed_nesting: 2

  RepeatedConditional:
    max_ifs: 3
