cases:
  # A greeting is the model's to answer, not a canned line: no grammar claims it.
  - id: greeting
    input: "hello"
  - id: repeat
    input: "again"
    grammar: repeat
  - id: shell_chain
    input: "ls && pwd"
    grammar: direct_shell
  - id: shell_pipe
    input: "ls | pwd"
    grammar: direct_shell
  - id: focus
    input: "focus mode"
    grammar: toggle_focus
  - id: language_fallback
    input: "tell me a funny story"
    grammar:
