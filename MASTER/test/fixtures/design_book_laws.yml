- law: GESTURE_HAS_TAP_EQUIVALENT
  path: RAILS/brgen/app/javascript/controllers/nowhere_swipe_controller.js
  flags: true
  match: like
  code: |
    export default class extends Controller {
      connect() { this.element.addEventListener("touchend", (e) => this.end(e)) }
      end(e) { if (this.dx > 60) this.like() }
      like() { this.element.remove() }
    }
- law: GESTURE_HAS_TAP_EQUIVALENT
  path: RAILS/brgen/app/javascript/controllers/nowhere_swipe_controller.js
  flags: false
  code: |
    export default class extends Controller {
      connect() { this.element.addEventListener("touchend", (e) => this.end(e)) }
      tap() { this.element.addEventListener("click", () => this.like()) }
      end(e) { if (this.dx > 60) this.like() }
      like() { this.element.remove() }
    }
