# Cases for test/test_design_book_laws.rb, one list: per Law, the code a source detector (or a snapshot
# adapter) must flag and the code it must pass, at the path the scanner would hand it. flags
# says which; match, where given, is a pattern the first message must carry. source reads the
# code from a repository file instead, with replace applied first. Typographic marks are YAML
# escapes, so this file stays ASCII. ask, on a Law's first case, is a phrase its semantic question
# must carry.
- law: QUOTES_BY_LOCALE
  path: RAILS/brgen/config/locales/nb.yml
  flags: true
  match: U\+00AB
  code: |
    nb:
      search:
        empty: 'Ingen treff for "%{q}"'
- law: QUOTES_BY_LOCALE
  path: RAILS/brgen/config/locales/en.yml
  flags: true
  match: U\+201C
  code: |
    en:
      search:
        empty: 'No match for "%{q}"'
- law: QUOTES_BY_LOCALE
  path: RAILS/brgen/config/locales/nb.yml
  flags: false
  code: "nb:\n  search:\n    empty: \"Ingen treff for \u00AB%{q}\u00BB\"\n"
