---
# Axiom conflict resolution protocol
# When two ABSOLUTE axioms deadlock, precedence breaks the tie.
# The losing axiom is logged as deferred debt, not silently dropped.

absolute_precedence:
  - PRESERVE_FIRST
  - SELF_APPLY

resolution_strategy:
  same_level: "Higher-precedence axiom wins. Losing axiom logged as deferred_debt."
  cross_level: "ABSOLUTE always beats PROTECTED. PROTECTED always beats NEGOTIABLE."

deferred_debt:
  description: "Violations that cannot be fixed without breaking a higher-precedence axiom."
  storage: "data/deferred_debt.jsonl"
  review_trigger: "on next major refactor or when blocking axiom is relaxed"
  fields:
    - axiom_id
    - file
    - line
    - reason_deferred
    - blocking_axiom
    - timestamp

# Explicit conflict rules -- lower-level tensions between NEGOTIABLE axioms
conflict_rules:
  - condition: "ONE_SOURCE conflicts with WET or AHA"
    resolution: "Favor WET/AHA when duplication count < 3. Favor ONE_SOURCE when count >= 3."
    rationale: "Rule of Three: extract only after pattern proves stable."
  - condition: "SIMPLEST_WORKS conflicts with FUNCTIONAL_CORE"
    resolution: "Favor SIMPLEST_WORKS for scripts and utilities; FUNCTIONAL_CORE for library/pipeline code."
  - condition: "BE_CONCISE conflicts with SELF_EXPLAINING"
    resolution: "Favor SELF_EXPLAINING. Clarity beats brevity in code."
  - condition: "CACHE_FIRST conflicts with IDEMPOTENT"
    resolution: "Ensure cache keys include all inputs that affect the result. Never cache non-deterministic output without TTL."
