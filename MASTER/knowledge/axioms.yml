# Kernel axioms — enforced by scan rules, pipeline stages, or tool guards
kernel:
  PRESERVE_FIRST: "Never break working code. Read before writing."
  SIMPLEST_WORKS: "Prefer the fewest moving parts that solve the problem."
  FAIL_VISIBLY: "Surface errors immediately; never swallow exceptions."
  ONE_SOURCE: "Maintain a single authoritative representation per concept."
  DECOUPLE: "Make hidden dependencies explicit."
  GUARD_EXPENSIVE: "Check preconditions before costly work."
  DEGRADE_GRACEFULLY: "Operate under partial failures."
  BE_CONCISE: "Avoid unnecessary words, tokens, or lines."

# Philosophy layer — advisory only, never blocking.
philosophy:
  prioritized_top_25:
    - id: ONE_JOB
      priority: 1
      statement: "Each module has one clear reason to change."
    - id: NO_SURPRISES
      priority: 2
      statement: "Prefer predictable behavior over clever tricks."
    - id: EXTEND_DONT_MODIFY
      priority: 3
      statement: "Add capability via composition before rewriting stable parts."
    - id: COMPOSABLE
      priority: 4
      statement: "Build small pieces that combine cleanly."
    - id: LEAVE_BETTER
      priority: 5
      statement: "Leave touched code cleaner than found."
    - id: TEST_FIRST
      priority: 6
      statement: "Design for testability before adding complexity."
    - id: REVERSIBLE
      priority: 7
      statement: "Prefer steps easy to roll back."
    - id: ONE_CHANGE
      priority: 8
      statement: "Keep each patch focused on one coherent intent."
    - id: EXPLICIT
      priority: 9
      statement: "Prefer explicit contracts over implicit coupling."
    - id: IDEMPOTENT
      priority: 10
      statement: "Operations are safe to repeat."
    - id: CQS
      priority: 11
      statement: "Separate queries from state mutations."
    - id: IMMUTABLE
      priority: 12
      statement: "Default to immutable data flow where practical."
    - id: APPEND_ONLY
      priority: 13
      statement: "Favor append‑only logs for auditability."
    - id: CACHE_FIRST
      priority: 14
      statement: "Cache high‑cost deterministic work with bounded TTL."
    - id: SELF_EXPLAINING
      priority: 15
      statement: "Names and structure reduce the need for comments."
    - id: ACCESSIBLE_FIRST
      priority: 16
      statement: "Design outputs for broad readability."
    - id: SQUINT_TEST
      priority: 17
      statement: "Structure should be clear at a glance."
    - id: JUST_ENOUGH
      priority: 18
      statement: "Avoid building before proof of need."
    - id: CHESTERTONS_FENCE
      priority: 19
      statement: "Understand why something exists before removing it."
    - id: GALLS_LAW
      priority: 20
      statement: "Complex systems evolve from simple working systems."
    - id: OCCAMS_RAZOR
      priority: 21
      statement: "Prefer simpler hypotheses and designs first."
    - id: PARETO
      priority: 22
      statement: "Ship the 20 % that delivers 80 % value first."
    - id: FINISH_FIRST
      priority: 23
      statement: "Close the loop before opening new threads."
    - id: MEASURE_THEN_OPTIMIZE
      priority: 24
      statement: "Benchmark before optimization work."
    - id: BLAME_SELF
      priority: 25
      statement: "Assume your change introduced the bug until disproved."

  anti_patterns:
    - god_class
    - shotgun_surgery
    - speculative_abstraction
    - hidden_global_state
    - duplicate_logic
    - n_plus_one_queries
    - silent_rescue
    - temporal_coupling

  zen_method:
    observe: "Read current behavior before changing anything."
    simplify: "Reduce moving parts before adding new components."
    isolate: "Change one axis at a time with clear boundaries."
    verify: "Run checks and gather objective evidence."
    reflect: "Capture learning and improve defaults."

  strunk_white:
    - "Omit needless words."
    - "Use definite, specific, concrete language."
    - "Put statements in positive form."
    - "Use active voice by default."

  inverted_pyramid:
    - "Lead with the outcome."
    - "Then provide key evidence."
    - "Then provide implementation detail."

  rails_doctrine:
    - "Convention over configuration"
    - "Optimize for programmer happiness"
    - "The menu is omakase"
    - "Value integrated systems"

# Nielsen Norman Group — 10 Usability Heuristics
ux:
  nielsen_heuristics:
    - id: SYSTEM_STATUS
      priority: 1
      statement: "Keep users informed of progress through timely feedback."
    - id: REAL_WORLD_MATCH
      priority: 2
      statement: "Speak the user's language; match mental models, not internals."
    - id: USER_CONTROL
      priority: 3
      statement: "Support undo and emergency exits; users make mistakes."
    - id: CONSISTENCY
      priority: 4
      statement: "Follow conventions; same word means same thing everywhere."
    - id: ERROR_PREVENTION
      priority: 5
      statement: "Prevent problems; confirm destructive actions."
    - id: RECOGNITION_NOT_RECALL
      priority: 6
      statement: "Minimize memory load; make options visible."
    - id: FLEXIBILITY
      priority: 7
      statement: "Serve novices and experts; provide accelerators for power users."
    - id: AESTHETIC_MINIMALISM
      priority: 8
      statement: "Show only relevant information; every element must earn its place."
    - id: ERROR_RECOVERY
      priority: 9
      statement: "Error messages name the problem and suggest a fix in plain language."
    - id: HELP_AND_DOCS
      priority: 10
      statement: "When help is needed it must be easy to find, concrete, and task‑focused."

# Clean Code — Robert C. Martin
clean_code:
  - id: ONE_ABSTRACTION_LEVEL
    statement: "Each function operates at a single level of abstraction; no mixing high‑level policy with low‑level detail."
  - id: NEWSPAPER_METAPHOR
    statement: "Code reads top‑to‑bottom; important declarations first, implementation detail below."
  - id: STEPDOWN_RULE
    statement: "Each function calls only functions one abstraction level below it."
  - id: BOUNDARY_ISOLATION
    statement: "Third‑party code is wrapped at the edge; it never leaks into the domain."
  - id: CLEAN_TESTS
    statement: "Tests are first‑class code; one concept per test, no production logic in tests."
  - id: NO_MAGIC
    statement: "Eliminate unexplained constants, flags, or mode switches; everything is named."

# Refactoring — Martin Fowler
refactoring_smells:
  - id: PRIMITIVE_OBSESSION
    statement: "Replace repeated raw primitives (strings, ints as IDs) with value objects."
  - id: MESSAGE_CHAIN
    statement: "a.b.c.d breaks Law of Demeter — talk only to immediate collaborators."
  - id: MIDDLE_MAN
    statement: "A class delegating most methods to another should be eliminated or renamed."
  - id: LAZY_CLASS
    statement: "A class too small to justify its existence should be inlined."
  - id: TEMP_FIELD
    statement: "Instance variables set only in some paths are confusing — extract object."
  - id: DIVERGENT_CHANGE
    statement: "A class changed for multiple unrelated reasons violates SRP — split it."
  - id: SHOTGUN_SURGERY
    statement: "One conceptual change requiring edits across many files signals missing abstraction."
  - id: INAPPROPRIATE_INTIMACY
    statement: "Classes should not access each other's private data — enforce boundaries."
  - id: ALTERNATIVE_CLASSES
    statement: "Two classes doing the same thing under different names must be unified."
  - id: SPECULATIVE_GENERALITY
    statement: "Remove code written for hypothetical needs that is never used."