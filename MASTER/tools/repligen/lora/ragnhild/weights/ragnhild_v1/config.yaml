job: extension
config:
  name: zikigirl_v1
  process:
  - type: sd_trainer
    training_folder: /Users/mac/Documents/GitHub/pub4/DEPLOY/repligen/lora/zikigirl/weights
    device: mps
    trigger_word: zikigirl
    network:
      type: lora
      linear: 16
      linear_alpha: 16
    save:
      dtype: float16
      save_every: 250
      max_step_saves_to_keep: 4
      push_to_hub: false
    datasets:
    - folder_path: /Users/mac/Documents/GitHub/pub4/DEPLOY/repligen/lora/zikigirl/train
      caption_ext: txt
      caption_dropout_rate: 0.05
      shuffle_tokens: false
      cache_latents_to_disk: true
      resolution:
      - 512
      - 768
      - 1024
    train:
      batch_size: 1
      steps: 1000
      gradient_accumulation_steps: 1
      train_unet: true
      train_text_encoder: false
      gradient_checkpointing: true
      noise_scheduler: flowmatch
      optimizer: adamw8bit
      lr: 0.0001
      ema_config:
        use_ema: true
        ema_decay: 0.99
      dtype: bf16
    model:
      name_or_path: black-forest-labs/FLUX.1-dev
      is_flux: true
      quantize: true
      low_vram: true
    sample:
      sampler: flowmatch
      sample_every: 250
      width: 1024
      height: 1024
      prompts:
      - zikigirl, woman, portrait, natural light, detailed face
      - photo of zikigirl, woman, candid, soft background
      - zikigirl, woman, studio portrait, neutral backdrop
      neg: ''
      seed: 42
      walk_seed: true
      guidance_scale: 4
      sample_steps: 20
    meta:
      name: zikigirl_v1
      version: '1.0'
      master_trigger: zikigirl
meta:
  name: zikigirl_v1
  version: '1.0'
