<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pub4 matrix control</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; color: #0c0; font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; }
    #master-overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.92); z-index: 10; cursor: pointer; }
    #master-overlay span { color: #0f0; letter-spacing: .12em; }
    #core-interface { display: none; height: 100vh; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; }
    body.booted #master-overlay { display: none; }
    body.booted #core-interface { display: grid; }
    .pane { border: 1px solid #020; display: flex; flex-direction: column; padding: 8px; height: 100%; overflow: hidden; }
    .log-container { flex: 1; overflow-y: auto; background: #000; color: #0c0; margin-bottom: 5px; }
    input { width: 100%; background: #000; color: #0f0; border: 1px solid #0f0; padding: 5px; font-family: inherit; outline: none; }
    #domain-cluster-bar { display: flex; gap: 6px; padding: 4px; background: #010; border-bottom: 1px solid #030; overflow-x: auto; font-size: 9px; }
    .domain-node { padding: 2px 6px; border: 1px solid #040; border-radius: 3px; color: #080; cursor: pointer; white-space: nowrap; }
    .domain-node.active { border-color: #0f0; color: #0f0; background: #020; }
  </style>
</head>
<body>
  <div id="master-overlay"><span>tap to boot matrix</span></div>
  <div id="core-interface">
    <div class="pane">
      <div id="domain-cluster-bar">
        <div class="domain-node active" data-domain="brgen.no">brgen.no</div>
        <div class="domain-node" data-domain="marketplace.brgen.no">marketplace</div>
        <div class="domain-node" data-domain="playlist.brgen.no">playlist</div>
        <div class="domain-node" data-domain="takeaway.brgen.no">takeaway</div>
        <div class="domain-node" data-domain="tv.brgen.no">tv</div>
        <div class="domain-node" data-domain="messenger.brgen.no">messages</div>
        <div class="domain-node" data-domain="maps.brgen.no">maps</div>
        <div class="domain-node" data-domain="amber.brgen.no">amber</div>
        <div class="domain-node" data-domain="bsdports.org">bsdports.org</div>
      </div>
      <div style="border-bottom:1px solid #030;padding-bottom:4px;margin-bottom:6px;">[ FOREGROUND EXECUTIVE OBJECTIVE SHELL ]</div>
      <div id="stdout-term" class="log-container"></div>
      <input type="text" id="shell-input" placeholder="Enter instruction..." autofocus />
    </div>
    <div class="pane">
      <div style="border-bottom:1px solid #030;padding-bottom:4px;margin-bottom:6px;">[ MATRIX TELEMETRY BUS ]</div>
      <div id="matrix-term" class="log-container"></div>
    </div>
  </div>
  <script>
    window.EcosystemEngine = {
      activeDomain: "brgen.no",
      evt: null,

      boot() {
        document.body.classList.add("booted");
        this.connectTransport();
        this.logForeground("Matrix control center online. SSE bridge to MASTER /events/stream.");
      },

      switchDomain(domainString) {
        this.activeDomain = domainString;
        document.querySelectorAll(".domain-node").forEach((el) => {
          const label = el.textContent.trim();
          const root = domainString.split(".")[0];
          const active = label === domainString || label === root || (domainString === "brgen.no" && label === "brgen.no");
          el.classList.toggle("active", active);
        });
        this.logForeground(`Switched active visual execution context to: ${domainString}`);
        this.sendDirective(`Synchronize telemetry profile for ${domainString}`);
      },

      logForeground(str) {
        const t = document.getElementById("stdout-term");
        t.innerHTML += `<div>&gt; ${str}</div>`;
        t.scrollTop = t.scrollHeight;
      },

      logMatrix(key, data, time) {
        const t = document.getElementById("matrix-term");
        t.innerHTML += `<div>[${time}] KEY: <span style="color:#0f0;">${key}</span> -> ${JSON.stringify(data)}</div>`;
        t.scrollTop = t.scrollHeight;
      },

      connectTransport() {
        if (!window.EventSource) {
          this.logForeground("EventSource unavailable — static matrix only.");
          return;
        }
        const origin = location.origin.includes("127.0.0.1") || location.origin.includes("localhost")
          ? "https://ai.brgen.no"
          : "";
        const url = `${origin}/events/stream`;
        this.evt = new EventSource(url, { withCredentials: true });
        this.evt.onopen = () => this.logForeground("SSE pipeline structurally sound. Awaiting instructions.");
        this.evt.onmessage = (e) => {
          if (e.data === "[DONE]") return;
          this.logMatrix("message", e.data, new Date().toISOString().slice(11, 19));
        };
        this.evt.addEventListener("dmesg", (e) => this.logMatrix("dmesg", e.data, new Date().toISOString().slice(11, 19)));
        this.evt.addEventListener("tool", (e) => this.logMatrix("tool", e.data, new Date().toISOString().slice(11, 19)));
        this.evt.onerror = () => this.logForeground("SSE reconnect pending (auth may be required on ai.brgen.no).");
      },

      sendDirective(text) {
        const origin = location.origin.includes("127.0.0.1") || location.origin.includes("localhost")
          ? "https://ai.brgen.no"
          : "";
        fetch(`${origin}/chat/message`, {
          method: "POST",
          headers: { "Accept": "text/event-stream", "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ message: text, active_domain: this.activeDomain }),
          credentials: "include"
        }).catch(() => this.logForeground("Directive transport deferred (open ai.brgen.no for live chat)."));
      }
    };

    document.getElementById("master-overlay").addEventListener("click", (e) => {
      e.preventDefault();
      window.EcosystemEngine.boot();
    }, { passive: false });

    document.querySelectorAll(".domain-node").forEach((node) => {
      node.addEventListener("click", () => window.EcosystemEngine.switchDomain(node.dataset.domain));
    });

    document.getElementById("shell-input").addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const val = e.target.value;
      e.target.value = "";
      window.EcosystemEngine.sendDirective(val);
      window.EcosystemEngine.logForeground(`user_directive [${window.EcosystemEngine.activeDomain}]: "${val}"`);
    });
  </script>
</body>
</html>
