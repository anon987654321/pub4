name: runtime_event
version: 1

purpose: append-only runtime event emission

inputs:
  workflow_id:
    type: string
    required: true

  subsystem:
    type: string
    required: true

  event_type:
    type: string
    required: true

  payload:
    type: object
    required: true

outputs:
  accepted:
    type: boolean

  event_id:
    type: string

permissions:
  filesystem:
    - runtime/events
    - runtime/telemetry

timeouts:
  execution_ms: 100

retry_policy:
  max_attempts: 3
  exponential_backoff: true

validation:
  require_timestamp: true
  require_json_object: true
  reject_empty_payload: true

side_effects:
  - append_event_log
  - emit_telemetry

failure_policy:
  quarantine_after_failures: 10
  open_repair_ticket: true
