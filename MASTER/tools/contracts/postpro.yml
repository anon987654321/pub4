name: postpro
version: 1
risk_tier: dangerous

purpose: apply cinematic post-processing workflows to generated multimedia assets

inputs:
  target_dir:
    type: path
    required: true

  preset:
    type: enum
    values:
      - portrait
      - landscape
      - street
      - blockbuster
    required: false

  variations:
    type: integer
    required: false
    minimum: 1
    maximum: 5

  recipe:
    type: string
    required: false

outputs:
  summary:
    type: string

permissions:
  filesystem:
    read:
      - multimedia/postpro.rb
      - target_dir
    write:
      - target_dir
      - runtime/events
      - runtime/telemetry

  binaries:
    - ruby
    - vips

timeouts:
  execution_seconds: 600

validation:
  require_directory_exists: true
  require_known_preset_or_recipe: true
  clamp_variations: true
  require_script_exists: true

side_effects:
  - image_mutation
  - asset_generation
  - runtime_event_append

failure_policy:
  emit_failure_event: true
  rollback_partial_outputs: recommended
  quarantine_after_failures: 10
