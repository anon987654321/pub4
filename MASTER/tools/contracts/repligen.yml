name: repligen
version: 1
risk_tier: dangerous

purpose: discover, index, and inspect Replicate model inventory from MASTER

inputs:
  action:
    type: enum
    values:
      - sync
      - search
      - stats
    required: true

  query:
    type: string
    required: false
    required_when:
      action: search

  limit:
    type: integer
    required: false
    minimum: 1
    maximum: 1000

outputs:
  stdout:
    type: string

permissions:
  env:
    - REPLICATE_API_TOKEN
  filesystem:
    read:
      - multimedia/repligen.rb
    write:
      - multimedia
      - runtime/events
      - runtime/telemetry
  network:
    - replicate.com

timeouts:
  execution_seconds: 1200

validation:
  reject_unknown_action: true
  require_replicate_token_for_sync: true
  clamp_limit: true
  require_script_exists: true

side_effects:
  - provider_inventory_update
  - local_model_index_update
  - runtime_event_append

failure_policy:
  emit_failure_event: true
  classify_as_provider_error_on_nonzero_exit: true
  quarantine_after_failures: 5
  require_manual_approval_for_sync_over_100: true
