name: web_pwa
version: 1

purpose: enforce semantic web, PWA, accessibility, performance, and runtime-visualization rules

inputs:
  path:
    type: string
    required: true

  artifact_type:
    type: string
    enum:
      - html
      - erb
      - css
      - js
      - manifest
      - service_worker
    required: true

outputs:
  violations:
    type: array

  score:
    type: number

  autofixable:
    type: boolean

permissions:
  filesystem:
    - read
    - write_if_autofix

checks:
  semantic_html:
    fail_on:
      - div_soup
      - buttonless_click_handlers
      - missing_landmarks
      - missing_form_labels

  pwa:
    require:
      - manifest
      - service_worker
      - offline_shell
      - theme_color
      - responsive_viewport

  accessibility:
    require:
      - keyboard_navigation
      - visible_focus
      - aria_when_needed
      - reduced_motion_support
      - sufficient_contrast

  performance:
    budgets:
      lcp_ms: 2500
      inp_ms: 200
      cls: 0.1

    fail_on:
      - hydration_bloat
      - unbounded_animation
      - synchronous_heavy_js
      - unnecessary_client_state

  runtime_visualization:
    require_source: runtime_events
    dom_inference_allowed_as_fallback: true

retry_policy:
  max_attempts: 1
  exponential_backoff: false

failure_policy:
  open_repair_ticket: true
  quarantine_after_failures: 5
