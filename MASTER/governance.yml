tool_approval:
 safe:
    - :read_file
    - :list_dir
    - :search_files
  guarded:
    - :write_file
    - :str_replace
    - :apply_diff    - :ask_llm
    - :web_search
  dangerous:
    - :zsh

blocked_commands:
  - :rm_rf_root
  - :sudo
  - :reboot
  - :shutdown
  - :mkfs
  - :dd_if
  - :output_to_dev_null
  - :chmod_777
  - :curl_pipe_sh
  - :wget_pipe_shbudgets:
  per_request_usd: 1.00
  per_session_usd: 10.00

rate_limit:
  requests_per_minute: 30