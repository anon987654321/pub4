tool_approval:
  safe:
    - :read_file
    - :list_dir
    - :search_files
    - :symbol_lookup
  guarded:
    - :write_file
    - :str_replace
    - :apply_diff
    - :ask_llm
    - :web_search
    - :search_knowledge
  dangerous:
    - :zsh
    - :shell

blocked_commands:
  - :rm_rf_root
  - :sudo
  - :reboot
  - :shutdown
  - :mkfs
  - :dd_if
  - :output_to_dev_null
  - :chmod_777
  - :curl_pipe_sh
  - :wget_pipe_sh
  - :kill_all
  - :poweroff

budgets:
  per_request_usd: 1.0
  per_session_usd: 10.0
  max_concurrent_requests: 3

rate_limit:
  requests_per_minute: 30
  burst_capacity: 5
  penalty_seconds: 60
  sliding_window_seconds: 60

audit:
  enabled: true
  log_file: "log/governance_audit.log"
  retain_days: 30
  redact_sensitive: true
  format: json

notifications:
  on_violation:
    - :email
    - :slack
    - :pagerduty
  on_escalation:
    - :sms
    - :pagerduty

escalation:
  threshold:
    per_request_usd: 5.0
    per_session_usd: 50.0
    consecutive_violations: 3
  actions:
    - :notify_admin
    - :disable_tool
    - :terminate_session
    - :lock_user
  cooldown_minutes: 15