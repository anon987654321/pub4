<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>MASTER</title>
<script src="face_bridge.js" defer></script>
<style>
/* The phone face, in the signal-and-stillness identity laws.yml names. */
:root {
  --ink: #101010;
  --paper: #111111;
  --chrome: #e8e8e8;
  --chrome-muted: #a0a0a0;
  --chrome-focus: #c8c8c8;
  --signal: #c8f55f;
  --tap-min: 44px;
  --bar: 44px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-code: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  background: var(--ink);
  color: var(--chrome);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
body {
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}
#stage {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: var(--paper);
  min-height: 40vh;
}
#face {
  width: min(72vw, 320px);
  height: min(72vw, 320px);
  border-radius: 0;
  background: #0a0a0a;
  position: relative;
  overflow: hidden;
  background-image:
    radial-gradient(circle at 30% 40%, #2a2a2a 0 1px, transparent 1.5px),
    radial-gradient(circle at 70% 60%, #1f1f1f 0 1px, transparent 1.5px),
    radial-gradient(circle at 50% 50%, #181818 0 1px, transparent 1.5px);
  background-size: 12px 12px, 18px 18px, 8px 8px;
}
#face[data-mode="listening"] { outline: 1px solid var(--chrome-focus); }
#visage {
  position: absolute;
  inset: 27% 18% 35%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 8% 0;
  transform-origin: center;
}
#eyes { display: flex; justify-content: space-between; width: 62%; }
.eye {
  position: relative;
  display: block;
  width: 20px;
  height: 20px;
  border: 1px solid #bdbdbd;
  border-radius: 50%;
}
.eye::after {
  content: "";
  position: absolute;
  width: 6px;
  height: 6px;
  left: 6px;
  top: 6px;
  border-radius: 50%;
  background: #e8e8e8;
}
#mouth {
  width: 34px;
  height: 4px;
  border-top: 2px solid #bdbdbd;
  border-radius: 50%;
  transform-origin: center;
}
#face[data-mode="thinking"] #visage { animation: attend 520ms ease-out 1 both; }
#face[data-mode="listening"] #eyes { animation: listen 460ms ease-out 1 both; }
#face[data-mode="speaking"] #mouth { animation: speak 280ms ease-out 1 both; }
@keyframes attend {
  from { opacity: 0.65; transform: translateY(5px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes listen {
  from { transform: scaleY(0.65); }
  to { transform: scaleY(1.15); }
}
@keyframes speak {
  from { height: 4px; border-radius: 50%; }
  to { height: 18px; border-radius: 40%; }
}
#face[data-mode="speaking"] { outline: 1px solid var(--signal); }
#face[data-mode="error"] { outline: 1px solid #c44; }
#face[data-mode="thinking"] { outline: 1px solid var(--chrome-muted); }
#status {
  position: absolute;
  bottom: 12px;
  left: 0;
  right: 0;
  text-align: center;
  font-family: var(--font-code);
  font-size: 0.8125rem;
  color: var(--chrome-muted);
}
#status .signal-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  background: var(--signal);
  margin-right: 6px;
  vertical-align: middle;
}
#log {
  max-height: 28vh;
  overflow-y: auto;
  padding: 12px 16px;
  font-family: var(--font-code);
  font-size: 0.875rem;
  border-top: 1px solid #222;
  background: var(--ink);
}
#log .u { color: var(--chrome-muted); }
#log .m { color: var(--chrome); }
#log .sys { color: var(--chrome-muted); opacity: 0.8; }
#bar {
  display: flex;
  border-top: 1px solid #222;
  min-height: var(--bar);
  background: var(--ink);
}
#bar input {
  flex: 1;
  min-height: var(--tap-min);
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--chrome);
  padding: 0 16px;
  font: inherit;
  font-family: var(--font-code);
}
#bar input:focus {
  outline: 1px solid var(--chrome-focus);
  outline-offset: -1px;
}
#bar button {
  min-width: var(--tap-min);
  min-height: var(--tap-min);
  border: 0;
  border-left: 1px solid #222;
  border-radius: 0;
  background: transparent;
  color: var(--chrome);
  font-family: var(--font-code);
  font-size: 0.8125rem;
  padding: 0 14px;
  cursor: pointer;
}
#bar button.primary {
  box-shadow: inset 0 -2px 0 var(--signal);
}
#bar button:focus-visible {
  outline: 1px solid var(--signal);
  outline-offset: -2px;
}
#bar button:disabled { color: var(--chrome-muted); cursor: not-allowed; }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
  <main id="stage" aria-label="MASTER face">
    <div id="face" data-mode="idle" role="img" aria-label="MASTER face, idle">
      <div id="visage" aria-hidden="true">
        <div id="eyes"><span class="eye"></span><span class="eye"></span></div>
        <div id="mouth"></div>
      </div>
      <div id="status"><span class="signal-dot" aria-hidden="true"></span><span id="status-text">idle</span></div>
    </div>
  </main>
  <div id="log" aria-live="polite" aria-relevant="additions"></div>
  <form id="bar" autocomplete="off">
    <input id="input" type="text" name="q" placeholder="message" aria-label="Message" maxlength="4000" />
    <button type="button" id="listen">listen</button>
    <button type="submit" class="primary" id="send">send</button>
  </form>
</body>
</html>
