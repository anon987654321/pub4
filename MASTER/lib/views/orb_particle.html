<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Particle Orb</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#000}
canvas{position:fixed;inset:0;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cvs=document.getElementById('c'),c=cvs.getContext('2d');
let wd,ht,aud=0,tm=0;
let dots=[];

function onResize(){
  wd=cvs.width=window.innerWidth;
  ht=cvs.height=window.innerHeight;
  initDots();
}

function initDots(){
  dots=[];
  const midX=wd/2,midY=ht/2;
  for(let i=0;i<80;i++){
    const ang=Math.random()*Math.PI*2;
    const dist=Math.random()*50;
    dots.push({
      x:midX+Math.cos(ang)*dist,
      y:midY+Math.sin(ang)*dist,
      vx:(Math.random()-0.5)*0.8,
      vy:(Math.random()-0.5)*0.8,
      ph:Math.random()*Math.PI*2,
      hue:170+Math.random()*20
    });
  }
}

function render(){
  tm+=0.016;
  const midX=wd/2,midY=ht/2;
  
  c.fillStyle='rgba(0,0,0,0.12)';
  c.fillRect(0,0,wd,ht);
  
  for(const d of dots){
    d.ph+=0.02;
    d.vx+=Math.cos(d.ph)*0.1;
    d.vy+=Math.sin(d.ph*1.3)*0.1;
    
    const diffX=midX-d.x,diffY=midY-d.y;
    const len=Math.sqrt(diffX*diffX+diffY*diffY);
    d.vx+=diffX*0.002;
    d.vy+=diffY*0.002;
    
    d.vx+=(Math.random()-0.5)*aud*2;
    d.vy+=(Math.random()-0.5)*aud*2;
    
    d.vx*=0.98;d.vy*=0.98;
    
    d.x+=d.vx;d.y+=d.vy;
    
    const maxDist=60+aud*20;
    if(len>maxDist){
      const theta=Math.atan2(diffY,diffX);
      d.x=midX-Math.cos(theta)*maxDist;
      d.y=midY-Math.sin(theta)*maxDist;
      d.vx*=-0.5;d.vy*=-0.5;
    }
    
    const h=(d.hue+tm*10+aud*30)%360;
    c.fillStyle=`hsl(${h},70%,${50+aud*20}%)`;
    c.fillRect(d.x,d.y,2,2);
  }
  
  requestAnimationFrame(render);
}

navigator.mediaDevices?.getUserMedia({audio:true}).then(strm=>{
  const ac=new AudioContext(),asrc=ac.createMediaStreamSource(strm),analyzer=ac.createAnalyser();
  analyzer.fftSize=256;asrc.connect(analyzer);
  const freq=new Uint8Array(analyzer.frequencyBinCount);
  (function tick(){
    analyzer.getByteFrequencyData(freq);
    let total=0;for(let j=0;j<50;j++)total+=freq[j];
    aud=total/50/255;
    requestAnimationFrame(tick);
  })();
}).catch(()=>{});

onResize();
window.addEventListener('resize',onResize);
render();
</script>
</body>
</html>
