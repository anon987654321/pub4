<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blob Orb</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#000}
canvas{position:fixed;inset:0;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cvs=document.getElementById('c'),c=cvs.getContext('2d');
let wd,ht,tm=0,aud=0;
let shapes=[
  {x:0,y:0,rad:60,ph:0,spd:0.02,col:'#00CED1'},
  {x:0,y:0,rad:55,ph:2,spd:0.015,col:'#40E0D0'},
  {x:0,y:0,rad:50,ph:4,spd:0.025,col:'#48D1CC'}
];

function onResize(){
  wd=cvs.width=window.innerWidth;
  ht=cvs.height=window.innerHeight;
  shapes.forEach(s=>{s.x=wd/2;s.y=ht/2});
}
onResize();
window.addEventListener('resize',onResize);

function render(){
  tm+=0.016;
  c.fillStyle='rgba(0,0,0,0.15)';
  c.fillRect(0,0,wd,ht);
  
  const midX=wd/2,midY=ht/2;
  for(const sh of shapes){
    sh.ph+=sh.spd+aud*0.03;
    const pulse=Math.sin(tm*1.5+sh.ph)*8+aud*15;
    const radius=sh.rad+pulse;
    
    c.save();
    c.translate(midX,midY);
    c.beginPath();
    for(let ang=0;ang<=Math.PI*2;ang+=0.1){
      const warp=1+Math.sin(ang*3+sh.ph)*0.2+Math.sin(ang*5-tm)*0.1;
      const rr=radius*warp;
      const xx=Math.cos(ang)*rr;
      const yy=Math.sin(ang)*rr;
      if(ang===0)c.moveTo(xx,yy);
      else c.lineTo(xx,yy);
    }
    c.closePath();
    const grad=c.createRadialGradient(0,0,0,0,0,radius);
    grad.addColorStop(0,sh.col);
    grad.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=grad;
    c.fill();
    c.restore();
  }
  requestAnimationFrame(render);
}

navigator.mediaDevices?.getUserMedia({audio:true}).then(strm=>{
  const ac=new AudioContext(),asrc=ac.createMediaStreamSource(strm),analyzer=ac.createAnalyser();
  analyzer.fftSize=256;asrc.connect(analyzer);
  const freq=new Uint8Array(analyzer.frequencyBinCount);
  (function tick(){
    analyzer.getByteFrequencyData(freq);
    let total=0;for(let j=0;j<50;j++)total+=freq[j];
    aud=total/50/255;
    requestAnimationFrame(tick);
  })();
}).catch(()=>{});

window.addEventListener('message',ev=>{
  if(ev.data?.mood){
    const moodMap={
      positive:['#4DDF98','#44AD7D','#74E1A0'],
      negative:['#DF4D4D','#AD4444','#E17474'],
      calm:['#4D7DDF','#4454AD','#74A0E1'],
      excited:['#DF4DDF','#AD44AD','#E174E1']
    };
    if(moodMap[ev.data.mood])shapes.forEach((s,idx)=>s.col=moodMap[ev.data.mood][idx]||s.col);
  }
});

render();
</script>
</body>
</html>
