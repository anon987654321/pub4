<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tunnel Rings</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#000}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let w,h,scale=2,time=0;

function resize(){
  w=Math.floor(window.innerWidth/scale);
  h=Math.floor(window.innerHeight/scale);
  canvas.width=w;canvas.height=h;
}
resize();
window.addEventListener('resize',resize);

let audio=0,bass=0;

// Audio setup
navigator.mediaDevices?.getUserMedia({audio:true}).then(stream=>{
  const actx=new AudioContext(),src=actx.createMediaStreamSource(stream),an=actx.createAnalyser();
  an.fftSize=256;src.connect(an);
  const data=new Uint8Array(an.frequencyBinCount);
  
  (function loop(){
    an.getByteFrequencyData(data);
    const n2=Math.floor(data.length*0.2);
    let sum=0,avg=0;
    for(let i=0;i<n2;i++)sum+=data[i];
    for(let i=0;i<data.length;i++)avg+=data[i];
    bass=sum/(n2*255);
    audio=avg/(data.length*255);
    requestAnimationFrame(loop);
  })();
}).catch(()=>{});

function draw(){
  // Clear with trail
  ctx.fillStyle='rgba(0,0,0,0.1)';
  ctx.fillRect(0,0,w,h);
  
  const cx=w/2,cy=h/2;
  const maxRadius=Math.min(w,h)*0.45;
  const numRings=8;
  
  // Draw concentric rings pulsating with audio
  for(let i=0;i<numRings;i++){
    const t=i/numRings;
    const baseR=maxRadius*t;
    const pulse=baseR+bass*20*Math.sin(time*2+i*0.5);
    
    // Cyan gradient from center to edge
    const alpha=0.3+t*0.5;
    const r=Math.round(0+t*100);
    const g=Math.round(200-t*50);
    const b=Math.round(200-t*50);
    
    ctx.strokeStyle=`rgba(${r},${g},${b},${alpha})`;
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(cx,cy,pulse,0,Math.PI*2);
    ctx.stroke();
  }
  
  time+=0.016;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
