<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Orb</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#000}
canvas{position:fixed;inset:0;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cvs=document.getElementById('c'),c=cvs.getContext('2d');
let wd,ht,aud=0,tm=0,spinY=0,spinX=0;
let pts=[];

function onResize(){
  wd=cvs.width=window.innerWidth;
  ht=cvs.height=window.innerHeight;
  makePts();
}

function makePts(){
  pts=[];
  const count=120;
  const phi=(1+Math.sqrt(5))/2;
  for(let i=0;i<count;i++){
    const yval=1-(i/(count-1))*2;
    const rval=Math.sqrt(1-yval*yval);
    const tval=2*Math.PI*i/phi;
    pts.push({
      x:Math.cos(tval)*rval*40,
      y:yval*40,
      z:Math.sin(tval)*rval*40,
      h:i*3
    });
  }
}

function render(){
  tm+=0.016;
  spinY+=0.01+aud*0.03;
  spinX+=0.005;
  
  c.fillStyle='rgba(0,0,0,0.15)';
  c.fillRect(0,0,wd,ht);
  
  const midX=wd/2,midY=ht/2;
  const cosY=Math.cos(spinY),sinY=Math.sin(spinY);
  const cosX=Math.cos(spinX),sinX=Math.sin(spinX);
  const rad=35+aud*15;
  
  const mapped=pts.map(pt=>{
    const sx=pt.x*(rad/40),sy=pt.y*(rad/40),sz=pt.z*(rad/40);
    let xr=sx*cosY-sz*sinY;
    let zr=sx*sinY+sz*cosY;
    let yr=sy*cosX-zr*sinX;
    zr=sy*sinX+zr*cosX;
    const fov=80;
    const proj=fov/(fov+zr);
    return{px:midX+xr*proj,py:midY+yr*proj,z:zr,h:pt.h,proj};
  }).sort((a,b)=>b.z-a.z);
  
  for(const m of mapped){
    const depth=(m.z+50)/100;
    const brightness=0.3+depth*0.5;
    const tval=(Math.sin(m.h*0.05+tm)+1)/2;
    const rr=brightness*(0+tval*72);
    const gg=brightness*(180+tval*44);
    const bb=brightness*(190+tval*19);
    
    c.fillStyle=`rgb(${rr},${gg},${bb})`;
    c.fillRect(m.px-1,m.py-1,2,2);
  }
  
  requestAnimationFrame(render);
}

navigator.mediaDevices?.getUserMedia({audio:true}).then(strm=>{
  const ac=new AudioContext(),asrc=ac.createMediaStreamSource(strm),analyzer=ac.createAnalyser();
  analyzer.fftSize=256;asrc.connect(analyzer);
  const freq=new Uint8Array(analyzer.frequencyBinCount);
  (function tick(){
    analyzer.getByteFrequencyData(freq);
    let total=0;for(let j=0;j<50;j++)total+=freq[j];
    aud=total/50/255;
    requestAnimationFrame(tick);
  })();
}).catch(()=>{});

document.addEventListener('mousemove',ev=>{
  spinX=(ev.clientY/window.innerHeight-0.5)*0.5;
});

onResize();
window.addEventListener('resize',onResize);
render();
</script>
</body>
</html>
