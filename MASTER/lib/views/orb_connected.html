<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connected Orbs</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#000}
canvas{position:fixed;inset:0;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cvs=document.getElementById('c'),c=cvs.getContext('2d');
let wd,ht,aud=0,colorPhase=7,nodes=[];

function onResize(){
  wd=cvs.width=window.innerWidth;
  ht=cvs.height=window.innerHeight;
  initNodes();
}

function initNodes(){
  nodes=[];
  for(let i=0;i<25;i++){
    nodes.push({
      x:Math.random()*wd,
      y:Math.random()*ht,
      vx:(Math.random()-0.5)*1.5,
      vy:(Math.random()-0.5)*1.5
    });
  }
}

function getPhaseCol(angle){
  const tval=(Math.sin(angle*0.3)+1)/2;
  const rr=0+tval*72;
  const gg=180+tval*44;
  const bb=190+tval*19;
  return `rgb(${rr},${gg},${bb})`;
}

function render(){
  colorPhase+=0.02+aud*0.05;
  const proximity=(60+aud*25);
  
  c.fillStyle='rgba(0,0,0,0.12)';
  c.fillRect(0,0,wd,ht);
  
  const col=getPhaseCol(colorPhase);
  
  for(let i=0;i<nodes.length;i++){
    for(let j=i+1;j<nodes.length;j++){
      const dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y;
      const len=Math.sqrt(dx*dx+dy*dy);
      if(len<=proximity){
        const alpha=(1-len/proximity)*0.5;
        c.strokeStyle=col.replace(')',`,${alpha})`).replace('rgb','rgba');
        c.lineWidth=1;
        c.beginPath();
        c.moveTo(nodes[i].x,nodes[i].y);
        c.lineTo(nodes[j].x,nodes[j].y);
        c.stroke();
      }
    }
  }
  
  for(const n of nodes){
    n.x+=n.vx;n.y+=n.vy;
    if(n.x<0||n.x>=wd)n.vx*=-1;
    if(n.y<0||n.y>=ht)n.vy*=-1;
    
    c.fillStyle=col;
    const rad=1+aud*2;
    c.fillRect(n.x-rad,n.y-rad,rad*2,rad*2);
  }
  
  requestAnimationFrame(render);
}

navigator.mediaDevices?.getUserMedia({audio:true}).then(strm=>{
  const ac=new AudioContext(),asrc=ac.createMediaStreamSource(strm),analyzer=ac.createAnalyser();
  analyzer.fftSize=256;asrc.connect(analyzer);
  const freq=new Uint8Array(analyzer.frequencyBinCount);
  (function tick(){
    analyzer.getByteFrequencyData(freq);
    let total=0;for(let j=0;j<50;j++)total+=freq[j];
    aud=total/50/255;
    requestAnimationFrame(tick);
  })();
}).catch(()=>{});

onResize();
window.addEventListener('resize',onResize);
render();
</script>
</body>
</html>
