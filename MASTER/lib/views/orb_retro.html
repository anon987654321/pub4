<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retro Orb</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#000;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cvs=document.getElementById('c'),c=cvs.getContext('2d');
let wd,ht,midX,midY;
let tm=0;
let audioData={bass:0.5,mid:0.5,high:0.5,beat:0};
let mouseOffX=0,mouseOffY=0;

function onResize(){
  wd=Math.min(256,window.innerWidth);
  ht=Math.min(256,window.innerHeight);
  cvs.width=wd;
  cvs.height=ht;
  cvs.style.width=window.innerWidth+'px';
  cvs.style.height=window.innerHeight+'px';
  midX=wd/2;midY=ht/2;
}
onResize();
window.addEventListener('resize',onResize);

const segments=16;
const cosTbl=new Float32Array(segments);
const sinTbl=new Float32Array(segments);
for(let i=0;i<segments;i++){
  const ang=i*Math.PI*2/segments;
  cosTbl[i]=Math.cos(ang);
  sinTbl[i]=Math.sin(ang);
}

function drawCircle(x,y,rad,col){
  c.strokeStyle=col;
  c.lineWidth=1;
  c.beginPath();
  for(let i=0;i<=segments;i++){
    const idx=i%segments;
    const px=x+cosTbl[idx]*rad;
    const py=y+sinTbl[idx]*rad;
    if(i===0)c.moveTo(px,py);
    else c.lineTo(px,py);
  }
  c.closePath();
  c.stroke();
}

function render(){
  c.fillStyle='#000';
  c.fillRect(0,0,wd,ht);
  
  const layers=6;
  const baseRad=28;
  const fov=150;
  
  const dynFov=fov+audioData.bass*30;
  
  for(let layer=0;layer<layers;layer++){
    const zval=(layer-layers/2)*20;
    const scale=dynFov/(dynFov+zval);
    const radius=(baseRad+audioData.bass*8)*scale;
    
    const depth=layer/6;
    const rr=0+depth*30;
    const gg=160+depth*50;
    const bb=180+depth*30;
    const col=`rgb(${rr},${gg},${bb})`;
    
    const offX=mouseOffX*scale*0.3;
    const offY=mouseOffY*scale*0.3;
    const orbX=midX+offX;
    const orbY=midY+offY;
    
    drawCircle(orbX,orbY,radius,col);
  }
  
  tm+=0.02;
  requestAnimationFrame(render);
}

navigator.mediaDevices.getUserMedia({audio:true}).then(function(strm){
  const actx=new AudioContext();
  const asrc=actx.createMediaStreamSource(strm);
  const analyzer=actx.createAnalyser();
  analyzer.fftSize=256;
  asrc.connect(analyzer);
  const freq=new Uint8Array(analyzer.frequencyBinCount);
  (function tick(){
    analyzer.getByteFrequencyData(freq);
    let bass=0,mid=0,high=0;
    for(let i=0;i<20;i++)bass+=freq[i];
    for(let i=20;i<60;i++)mid+=freq[i];
    for(let i=60;i<100;i++)high+=freq[i];
    audioData.bass=bass/20/255;
    audioData.mid=mid/40/255;
    audioData.high=high/40/255;
    audioData.beat=audioData.bass>0.6?1:0;
    requestAnimationFrame(tick);
  })();
}).catch(function(){});

document.addEventListener('mousemove',function(ev){
  mouseOffX=(ev.clientX/window.innerWidth-0.5)*20;
  mouseOffY=(ev.clientY/window.innerHeight-0.5)*20;
});

render();
</script>
</body>
</html>
