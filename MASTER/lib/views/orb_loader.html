<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loader Orb</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#000}
canvas{position:fixed;inset:0;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cvs=document.getElementById('c'),c=cvs.getContext('2d');
let wd,ht,aud=0,tm=0,mood='neutral';

const MOODS={
  neutral:{c1:'#005055',c2:'#00CED1',c3:'#40E0D0'},
  positive:{c1:'#006464',c2:'#48D1CC',c3:'#7FFFD4'},
  negative:{c1:'#003C41',c2:'#008B8B',c3:'#20B2AA'},
  calm:{c1:'#005055',c2:'#00CED1',c3:'#40E0D0'},
  excited:{c1:'#007878',c2:'#00FFFF',c3:'#7FFFD4'}
};

let sparks=[];

function hexToRgba(hexCol, opacity){
  const rVal=parseInt(hexCol.slice(1,3),16);
  const gVal=parseInt(hexCol.slice(3,5),16);
  const bVal=parseInt(hexCol.slice(5,7),16);
  return `rgba(${rVal},${gVal},${bVal},${opacity})`;
}

function onResize(){
  wd=cvs.width=window.innerWidth;
  ht=cvs.height=window.innerHeight;
}

function makeSpark(cx,cy,rad){
  const ang=Math.random()*Math.PI-Math.PI/2;
  const dist=Math.random()*rad*0.6;
  sparks.push({
    x:cx+Math.cos(ang+Math.PI/2)*dist,
    y:cy+rad-3,
    vy:-1.5-Math.random()*3-aud*4,
    vx:(Math.random()-0.5)*1.2,
    life:0.6+Math.random()*0.4,
    size:1+Math.random()*1.5
  });
}

function render(){
  tm+=0.016;
  const moodColors=MOODS[mood]||MOODS.neutral;
  const midX=wd/2,baseY=ht*0.55;
  const bounce=Math.sin(tm*2)*8;
  const orbY=baseY+bounce;
  const radius=Math.min(wd,ht)*0.15+aud*10;
  
  c.fillStyle='#000';
  c.fillRect(0,0,wd,ht);
  
  const shadowY=ht*0.7;
  const grad=c.createRadialGradient(midX,shadowY,0,midX,shadowY,radius*1.5);
  grad.addColorStop(0,'rgba(0,0,0,0.3)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=grad;
  c.fillRect(0,0,wd,ht);
  
  const spawnCnt=3+Math.floor(aud*8);
  for(let s=0;s<spawnCnt;s++){
    if(Math.random()<0.7)makeSpark(midX,orbY,radius);
  }
  
  for(let i=sparks.length-1;i>=0;i--){
    const sp=sparks[i];
    sp.x+=sp.vx;sp.y+=sp.vy;
    sp.life-=0.015;
    if(sp.life<=0){sparks.splice(i,1);continue}
    
    const opacity=sp.life*0.8;
    c.fillStyle=hexToRgba(moodColors.c3,opacity);
    c.fillRect(sp.x,sp.y,sp.size*sp.life,sp.size*sp.life);
  }
  
  const orbGrad=c.createRadialGradient(midX-radius*0.3,orbY-radius*0.4,0,midX,orbY,radius);
  orbGrad.addColorStop(0,moodColors.c3);
  orbGrad.addColorStop(0.5,moodColors.c2);
  orbGrad.addColorStop(1,moodColors.c1);
  c.fillStyle=orbGrad;
  c.beginPath();
  c.arc(midX,orbY,radius,0,Math.PI*2);
  c.fill();
  
  if(sparks.length>100)sparks.splice(0,20);
  requestAnimationFrame(render);
}

navigator.mediaDevices?.getUserMedia({audio:true}).then(strm=>{
  const ac=new AudioContext(),asrc=ac.createMediaStreamSource(strm),analyzer=ac.createAnalyser();
  analyzer.fftSize=256;asrc.connect(analyzer);
  const freq=new Uint8Array(analyzer.frequencyBinCount);
  (function tick(){
    analyzer.getByteFrequencyData(freq);
    let total=0;for(let j=0;j<50;j++)total+=freq[j];
    aud=total/50/255;
    requestAnimationFrame(tick);
  })();
}).catch(()=>{});

mood=new URLSearchParams(location.search).get('mood')||'neutral';
window.addEventListener('message',ev=>{if(ev.data?.mood)mood=ev.data.mood});
onResize();
window.addEventListener('resize',onResize);
render();
</script>
</body>
</html>
