<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Backlight Orb</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#000}
canvas{position:fixed;inset:0;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cvs=document.getElementById('c'),c=cvs.getContext('2d');
let wd,ht,aud=0,tm=0,mood='neutral';

const MOODS={
  neutral:{c1:'#00CED1',c2:'#40E0D0'},
  positive:{c1:'#48D1CC',c2:'#7FFFD4'},
  negative:{c1:'#008B8B',c2:'#20B2AA'},
  calm:{c1:'#00CED1',c2:'#40E0D0'},
  excited:{c1:'#00FFFF',c2:'#7FFFD4'}
};

function onResize(){
  wd=cvs.width=window.innerWidth;
  ht=cvs.height=window.innerHeight;
}

function render(){
  tm+=0.016;
  const moodColors=MOODS[mood]||MOODS.neutral;
  const midX=wd/2,midY=ht/2;
  const baseRad=Math.min(wd,ht)*0.25;
  const radius=baseRad+aud*baseRad*0.3;
  
  c.fillStyle='#000';
  c.fillRect(0,0,wd,ht);
  
  const glowOffX=Math.sin(tm*0.5)*radius*0.15;
  const glowOffY=Math.cos(tm*0.7)*radius*0.15;
  
  const grad=c.createRadialGradient(midX+glowOffX,midY+glowOffY,0,midX+glowOffX,midY+glowOffY,radius*1.8);
  grad.addColorStop(0,moodColors.c1);
  grad.addColorStop(0.5,moodColors.c2);
  grad.addColorStop(1,'rgba(0,0,0,0)');
  c.globalAlpha=0.4+aud*0.3;
  c.fillStyle=grad;
  c.fillRect(0,0,wd,ht);
  c.globalAlpha=1;
  
  c.fillStyle='#000';
  c.beginPath();
  c.arc(midX,midY,radius,0,Math.PI*2);
  c.fill();
  
  requestAnimationFrame(render);
}

navigator.mediaDevices?.getUserMedia({audio:true}).then(strm=>{
  const ac=new AudioContext(),asrc=ac.createMediaStreamSource(strm),analyzer=ac.createAnalyser();
  analyzer.fftSize=256;asrc.connect(analyzer);
  const freq=new Uint8Array(analyzer.frequencyBinCount);
  (function tick(){
    analyzer.getByteFrequencyData(freq);
    let total=0;for(let j=0;j<50;j++)total+=freq[j];
    aud=total/50/255;
    requestAnimationFrame(tick);
  })();
}).catch(()=>{});

mood=new URLSearchParams(location.search).get('mood')||'neutral';
window.addEventListener('message',ev=>{if(ev.data?.mood)mood=ev.data.mood});
onResize();
window.addEventListener('resize',onResize);
render();
</script>
</body>
</html>
