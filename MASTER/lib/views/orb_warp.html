<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warp Orb</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#000}
canvas{position:fixed;inset:0;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cvs=document.getElementById('c'),c=cvs.getContext('2d');
let wd,ht,aud=0,tm=0;
let circles=[],stars=[];

function onResize(){
  wd=cvs.width=window.innerWidth;
  ht=cvs.height=window.innerHeight;
  makeCircles();makeStars();
}

function makeCircles(){
  circles=[];
  for(let zval=-200;zval<200;zval+=25){
    circles.push({z:zval,ph:Math.random()*Math.PI*2});
  }
}

function makeStars(){
  stars=[];
  for(let i=0;i<80;i++){
    stars.push({
      x:(Math.random()-0.5)*wd*3,
      y:(Math.random()-0.5)*ht*3,
      z:Math.random()*400-200
    });
  }
}

function render(){
  tm+=0.016;
  const velocity=2+aud*4;
  const midX=wd/2,midY=ht/2,fov=150;
  
  c.fillStyle='rgba(0,0,0,0.2)';
  c.fillRect(0,0,wd,ht);
  
  for(const star of stars){
    star.z-=velocity*0.5;
    if(star.z<-200){star.z+=400;star.x=(Math.random()-0.5)*wd*3;star.y=(Math.random()-0.5)*ht*3}
    
    const scale=fov/(fov+star.z);
    const sx=midX+star.x*scale;
    const sy=midY+star.y*scale;
    
    if(sx>=0&&sx<wd&&sy>=0&&sy<ht){
      const bright=100+((200-star.z)/400)*155;
      c.fillStyle=`rgb(0,${bright*0.85},${bright})`;
      c.fillRect(sx,sy,1,1);
    }
  }
  
  for(const ring of circles){
    ring.z-=velocity;
    if(ring.z<-200)ring.z+=400;
    
    const scale=fov/(fov+ring.z);
    const radius=Math.max(1,40*scale+aud*20*scale);
    const depth=(ring.z+200)/400;
    
    if(radius>0){
      c.strokeStyle=`rgb(${depth*72},${180+depth*44},${200+depth*9})`;
      c.lineWidth=1;
      c.beginPath();
      c.arc(midX,midY,radius,0,Math.PI*2);
      c.stroke();
    }
  }
  
  requestAnimationFrame(render);
}

navigator.mediaDevices?.getUserMedia({audio:true}).then(strm=>{
  const ac=new AudioContext(),asrc=ac.createMediaStreamSource(strm),analyzer=ac.createAnalyser();
  analyzer.fftSize=256;asrc.connect(analyzer);
  const freq=new Uint8Array(analyzer.frequencyBinCount);
  (function tick(){
    analyzer.getByteFrequencyData(freq);
    let total=0;for(let j=0;j<50;j++)total+=freq[j];
    aud=total/50/255;
    requestAnimationFrame(tick);
  })();
}).catch(()=>{});

onResize();
window.addEventListener('resize',onResize);
render();
</script>
</body>
</html>
