roles:
  classifier:
    providers:
      - gemini-flash
      - qwen
      - llama
    strategy: fastest_healthy
    max_cost_usd: 0.002

  compressor:
    providers:
      - qwen
      - llama
    strategy: cheapest
    max_cost_usd: 0.001

  retrieval:
    providers:
      - gemini-flash
      - qwen
    strategy: lowest_latency

  coding:
    providers:
      - deepseek-coder
      - qwen-coder
      - claude-sonnet
    strategy: capability_weighted

  review:
    providers:
      - claude-opus
      - gpt-5
    strategy: quorum
    quorum: 2

fallback_policy:
  retries: 2
  exponential_backoff: true
  quarantine_after_failures: 5
  cooldown_minutes: 30

health_weights:
  latency: 0.3
  failure_rate: 0.4
  hallucination_rate: 0.2
  timeout_rate: 0.1
