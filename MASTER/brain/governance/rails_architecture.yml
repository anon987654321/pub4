principles:
  - skinny_controller
  - skinny_model
  - service_objects
  - query_objects
  - presenters
  - policies
  - background_jobs_for_side_effects
  - progressive_enhancement
  - html_first
  - runtime_event_visibility

controllers:
  max_lines: 150
  forbid:
    - business_logic
    - direct_sql
    - multi_step_orchestration
    - hidden_mutation

models:
  forbid:
    - callback_spaghetti
    - service_orchestration
    - presentation_logic
    - network_side_effects

views:
  require:
    - semantic_html
    - accessibility_landmarks
    - keyboard_navigation

  forbid:
    - div_soup
    - inline_style
    - inline_script

stimulus:
  philosophy:
    - state_in_dom
    - progressive_enhancement
    - morph_over_rerender
    - avoid_global_state

  forbid:
    - application_god_controller
    - hidden_side_effects
    - runtime_state_duplication

jobs:
  require:
    - idempotent
    - retry_policy
    - telemetry_emission
    - runtime_events

observability:
  required:
    - runtime_events
    - telemetry
    - replay_visibility
    - workflow_visibility

repair:
  route_failures_to:
    - repair_queue
    - telemetry
    - replay_snapshots
