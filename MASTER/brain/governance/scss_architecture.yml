principle: pure_scss_over_utility_frameworks

research_basis:
  - awesome CSS lists emphasize CSS style guides, Sass guidelines, semantic/classless systems, normalize/reset discipline, and modular architecture.
  - awesome HTML5 lists emphasize semantics, canvas, speech synthesis/recognition, service workers, offline caching, storage, performance, mobile, WebGL, and accessibility.
  - awesome JavaScript lists emphasize browser APIs, keyboard wrappers, notifications, streaming, voice commands, storage, benchmarks, WebGL, timelines, and code highlighting.
  - awesome Web Components material reinforces encapsulation, custom elements, templates, accessibility, and styling boundaries, but MASTER should prefer Hotwire/Stimulus before custom element sprawl.

forbid:
  - tailwind
  - utility_class_sprawl
  - inline_style
  - inline_script
  - decorative_wrapper_classes
  - arbitrary_z_index
  - component_css_that_hides_runtime_state

scss:
  architecture:
    - tokens
    - base
    - typography
    - layout
    - components
    - runtime
    - traces
    - canvas
    - states
    - pwa
    - print

  naming:
    prefer:
      - semantic_classes
      - component_names
      - state_attributes
      - data_attributes

    avoid:
      - visual_class_names
      - spacing_encoded_classes
      - color_encoded_classes
      - nested_bem_sprawl

  selectors:
    max_specificity: 0_3_0
    max_nesting_depth: 2
    prefer_data_state: true
    prefer_where_is: true

  themes:
    dark_light:
      method: data_theme_attribute
      no_framework_required: true

    high_contrast:
      method: data_contrast_attribute
      wcag_target: AAA

motion:
  allowed:
    - state_transition
    - trace_replay
    - provider_latency
    - repair_activity
    - canvas_interaction

  forbid:
    - decorative_idle_motion
    - infinite_animation_without_state
    - motion_without_runtime_event

ascii:
  spinner_allowed: true
  allowed_spinners:
    - slash_dash_backslash_pipe

  forbid_decorative:
    - square_bracket_chrome
    - bullet_glyphs
    - pipe_chrome
    - heavy_boxes
    - emoji_status
    - ornamental_banners

web_ui_tiers:
  core:
    always_on:
      - theme_toggle
      - pwa_shell
      - offline_trace_cache
      - runtime_event_stream
      - timeline_scrubber
      - trace_export
      - keyboard_shortcuts
      - accessibility
      - high_contrast

  optional:
    collapsible:
      - span_heatmap
      - health_gauge
      - council_vote_chart
      - git_diff_preview
      - fullscreen_canvas
      - widget_customization

  experimental:
    disabled_by_default:
      - particle_field
      - particle_trails
      - vote_bursts
      - video_export

particles:
  identity: runtime_topology_visualization_not_decoration

  require:
    - runtime_event_source
    - reduced_motion_off_switch
    - mobile_fps_throttle
    - lazy_init
    - bounded_particle_count
    - zero_activity_quiet_state

  forbid:
    - ambient_fake_activity
    - decorative_idle_orb
    - unbounded_animation
    - gpu_dependency_for_core_ui

rails:
  css_delivery:
    - propshaft_or_asset_pipeline
    - scss_compilation
    - no_tailwind_dependency

  hotwire:
    - turbo_streams_for_runtime_updates
    - stimulus_for_canvas_interaction
    - server_rendered_first
