source:
  - master4.yml
  - master.yml v31/v49/v96
  - ruby_style.yml reunifications
  - rails stack audits
  - Nielsen/WCAG restorations

identity:
  philosophy:
    - clarity_over_decoration
    - semantic_structure_first
    - typography_is_system_design
    - motion_must_convey_state
    - accessibility_is_non_optional
    - minimalism_is_operational
    - defaults_should_feel_finished

web:
  semantic_html:
    required: true
    prefer:
      - section
      - article
      - nav
      - aside
      - main
      - header
      - footer
      - button
      - dialog

  css:
    philosophy:
      - bare_tag_first
      - utility_second
      - component_scoped_last
      - avoid_specificity_wars
      - avoid_framework_lockin

    avoid:
      - div_soup
      - deeply_nested_selectors
      - inline_styles
      - arbitrary_zindex
      - animation_noise
      - ornamental_gradients

  pwa:
    required:
      - manifest
      - service_worker
      - offline_shell
      - installability
      - responsive_layout
      - background_sync
      - cache_strategy

    cache:
      shell: stale_while_revalidate
      api: network_first
      assets: cache_first

    install:
      standalone: true
      splash_screen: true
      theme_color_required: true

rails:
  architecture:
    - skinny_controller
    - skinny_model
    - service_objects
    - query_objects
    - presenters
    - explicit_policies
    - background_jobs_for_side_effects
    - typed_form_objects

  avoid:
    - fat_models
    - callback_spaghetti
    - implicit_state_mutation
    - helper_god_objects
    - controller_business_logic
    - n_plus_one_queries

  hotwire:
    preferred: true
    stimulus:
      philosophy:
        - html_first
        - progressive_enhancement
        - state_in_dom_not_js_globals
        - morph_over_rerender

typography:
  principles:
    - bringhurst
    - swiss_modernist
    - courtroom_clarity
    - high_signal_low_noise

  text:
    line_length:
      ideal: 66_to_78_chars

    line_height:
      prose: 1.5_to_1.75
      ui: 1.2_to_1.4

    hierarchy:
      required: true
      avoid_microtext: true
      avoid_shouting: true

  fonts:
    ui:
      preferred:
        - Inter
        - SF_Pro
        - IBM_Plex_Sans

    mono:
      preferred:
        - JetBrains_Mono
        - Berkeley_Mono
        - Iosevka

  anti_patterns:
    - decorative_fonts
    - justified_text
    - low_contrast_gray
    - excessive_uppercase
    - narrow_line_spacing
    - dense_visual_noise

design:
  aesthetics:
    - ultra_minimalist
    - monochrome_plus_single_accent
    - structural_rhythm
    - whitespace_as_structure
    - motion_as_feedback
    - confidence_through_restraint

  avoid:
    - dashboard_casino_ui
    - glassmorphism_everywhere
    - animation_for_animation_sake
    - excessive_shadows
    - unnecessary_borders
    - skeuomorphism

motion:
  rules:
    - state_transition_only
    - sub_300ms_default
    - interruptible
    - reduced_motion_respected
    - avoid_infinite_animation

observability_ui:
  runtime_visualization:
    source_of_truth: runtime_events
    avoid_dom_inference: true

  visual_metrics:
    - entropy
    - confidence
    - provider_health
    - workflow_pressure
    - repair_activity
    - replay_state

a11y:
  wcag: AAA_target

  required:
    - keyboard_navigation
    - focus_visibility
    - aria_labels
    - semantic_landmarks
    - reduced_motion
    - screen_reader_support
    - sufficient_contrast
    - touch_target_spacing

performance:
  web_vitals:
    lcp: under_2_5s
    inp: under_200ms
    cls: under_0_1

  principles:
    - avoid_hydration_bloat
    - stream_when_possible
    - lazy_load_noncritical
    - minimize_runtime_js
    - prefer_server_rendering

copy:
  style:
    - direct
    - active_voice
    - concise
    - no_sycophancy
    - no_empty_hype
    - operationally_precise

  avoid:
    - certainly
    - great_question
    - of_course
    - needless_apologies
    - theatrical_marketing_language
