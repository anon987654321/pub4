AllCops:
  NewCops: disable
  SuggestExtensions: false
  DisabledByDefault: true
  Exclude:
    - "web/**"
    - "knowledge/**"
    - "vendor/**"
    - "tmp/**"
    - "node_modules/**"

# Cops aligned with rubocop/ruby-style-guide and data/laws.yml style. A cop that
# measures what a MASTER Law measures, at the same or a looser threshold, is off
# and names that Law: two sources of one number reported every breach twice.
# Metrics/AbcSize (20, against ABC_SIZE's ratchet 40) and Metrics/ClassLength
# (200, against the Laws' 300) stay on while they are stricter than the Law; which
# number holds is the operator's call.
Metrics/MethodLength: # one source: the SMALL_FUNCTIONS (max 20) Law
  Enabled: false

Metrics/ClassLength:
  Enabled: true
  Max: 200

Metrics/AbcSize:
  Enabled: true
  Max: 20

Metrics/CyclomaticComplexity: # one source: the CYCLOMATIC_COMPLEXITY (under 10) Law
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: true
  Max: 11

Metrics/ParameterLists: # one source: the LONG_PARAMETER_LIST (at most 4, stricter than this cop's 5) Law
  Enabled: false

Lint/RescueException:
  Enabled: true

Lint/SuppressedException:
  Enabled: true

Lint/DuplicateMethods:
  Enabled: true

Style/GuardClause: # one source: the GUARD_CLAUSE Law
  Enabled: false

Style/ReturnNil:
  Enabled: true

Style/MethodCalledOnDoEndBlock:
  Enabled: true

Naming/MethodParameterName:
  Enabled: true
  MinNameLength: 3
  AllowNamesEndingInNumbers: false
  AllowedNames: [io, id, to, by, ok, on]

Layout/LineLength: # one source: the LONG_LINE (120) Law
  Enabled: false

Style/FrozenStringLiteralComment: # one source: the FROZEN_STRING_LITERAL Law
  Enabled: false

Style/SafeNavigation:
  Enabled: true

Style/EachWithObject:
  Enabled: true

Style/SymbolProc:
  Enabled: true
  AllowedMethods:
    - respond_to
    - define_method

Style/BlockDelimiters:
  Enabled: true
  EnforcedStyle: line_count_based

# Detect only. RuboCop's correction rewrites a nested ternary into an `if` whose
# branches sit at column 0 and leaves the inner ternary standing; it broke the
# ASCII face's golden frame on 2026-10-12.
Style/NestedTernaryOperator: # one source: the RUBY_TERNARY_NOT_NESTED Law
  Enabled: false

Naming/MethodName:
  Enabled: true
  EnforcedStyle: snake_case

Naming/ClassAndModuleCamelCase:
  Enabled: true

Style/NumericLiterals:
  Enabled: true
  MinDigits: 5

Style/StringLiterals: # one source: the DOUBLE_QUOTES_RUBY Law
  Enabled: false

Style/HashSyntax:
  Enabled: true
  EnforcedStyle: ruby19
  EnforcedShorthandSyntax: always

Style/RedundantReturn:
  Enabled: true

Style/EmptyLiteral:
  Enabled: true

Style/WordArray:
  Enabled: true
  MinSize: 2

Style/TrailingCommaInArguments: # one source: the TRAILING_COMMAS Law
  Enabled: false

Style/TrailingCommaInArrayLiteral: # one source: the TRAILING_COMMAS Law
  Enabled: false

Style/TrailingCommaInHashLiteral: # one source: the TRAILING_COMMAS Law
  Enabled: false

Layout/TrailingWhitespace: # one source: the TRAILING_WHITESPACE Law
  Enabled: false

Layout/TrailingEmptyLines: # one source: the FINAL_NEWLINE Law
  Enabled: false

Layout/EmptyLines: # one source: the CONSECUTIVE_BLANK_LINES Law
  Enabled: false

Lint/UnusedMethodArgument:
  Enabled: true
  AllowUnusedKeywordArguments: true

Lint/RedundantCopDisableDirective:
  Enabled: true
