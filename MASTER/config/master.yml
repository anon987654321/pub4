# Feature Flags (for gradual rollout)
features:
  # Constitutional AI features
  enable_constitutional_ai: true
  enable_bug_hunting: false
  enable_resilience: false
  enable_systematic_protocols: true
  
  # System features
  event_sourcing: true           # Phase 2 ✅
  capability_security: false     # Phase 8
  immutable_state: false         # Phase 5
  plugin_system: false           # Phase 4
  hexagonal_ports: false         # Phase 6
  command_pipeline: false        # Phase 7
  database_integration: false    # Phase 9
  modular_monolith: false        # Phase 10
  workflow_engine: false         # Phase 12
  dynamic_loading: false         # Phase 11 (microkernel dynamic loading)
  
  # Operational features
  enable_caching: true
  enable_metrics: true
  enable_achievements: false

# Performance Settings
performance:
  lazy_loading: true
  cache_principles: true
  cache_personas: true
  semantic_cache_ttl: 3600
  
# Security Settings
security:
  openbsd_pledge: true
  max_file_size_mb: 100
  allowed_commands:
    - ruby
    - git
    - test
  
# Logging and Observability
logging:
  level: info
  format: openbsd
  audit_trail: true
  
# Cost Tracking
cost:
  enabled: true
  warn_threshold: 1.0
  max_per_session: 10.0
  
# Backward Compatibility
compatibility:
  legacy_autoload: true
  v1_api: true
  migration_mode: false

# Metadata
stats:
  total_principles: 48
  total_personas: 7
  total_biases: 12
  total_depth_techniques: 7
  total_bug_hunting_phases: 8
