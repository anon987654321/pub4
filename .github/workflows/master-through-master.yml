name: MASTER through MASTER

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  master-self-scan:
    name: MASTER scans MASTER
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: MASTER

      - name: Run MASTER self-scan
        working-directory: MASTER
        run: |
          printf '/scan .\n' | bundle exec ruby bin/cli

  deploy-scan:
    name: MASTER scans DEPLOY
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: master-self-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: MASTER

      - name: Run DEPLOY scan through MASTER
        working-directory: MASTER
        run: |
          printf '/scan ../DEPLOY\n' | bundle exec ruby bin/cli
