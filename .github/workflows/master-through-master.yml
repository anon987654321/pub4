name: MASTER through MASTER

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  master-gate:
    name: Full-history inventory, valuables audit, MASTER gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout complete pub4 history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: MASTER

      - name: Verify complete history checkout
        run: |
          git rev-parse --is-inside-work-tree
          git rev-list --count HEAD
          git log --oneline --decorate -n 20

      - name: Inventory current repo sprawl
        run: |
          ruby MASTER/tools/repo_inventory.rb --json | tee repo_inventory.json

      - name: Audit entire pub4 history for lost valuables
        run: |
          HISTORY_WINDOW=--all ruby MASTER/tools/history_valuables.rb . | tee history_valuables.json

      - name: Run MASTER gate
        working-directory: MASTER
        run: |
          ruby bin/gate
