name: MASTER through MASTER

# Manual dispatch only. The GitHub Actions billing lock that first paused this
# job was cleared on 2026-07-18; the push/pull_request block below was left
# commented out and never restored, so nothing outside this file is holding it.
# Price the run before uncommenting: it checks out the full history
# (fetch-depth: 0), audits every commit for lost valuables, and carries a
# 120-minute timeout.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

jobs:
  master-gate:
    name: Full-history inventory, valuables audit, MASTER gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout complete pub4 history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

          bundler-cache: true
          working-directory: MASTER

      - name: Verify complete history checkout
        run: |
          git rev-parse --is-inside-work-tree
          git rev-list --count HEAD
          git log --oneline --decorate -n 20

      - name: Inventory current repo sprawl
        run: |
          ruby MASTER/tools/repo_inventory.rb --json | tee repo_inventory.json

      - name: Audit entire pub4 history for lost valuables
        run: |
          HISTORY_WINDOW=--all ruby MASTER/tools/history_valuables.rb . | tee history_valuables.json

      - name: Run MASTER gate
        working-directory: MASTER
        run: |
          ruby bin/gate
