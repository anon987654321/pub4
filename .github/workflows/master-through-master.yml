name: MASTER through MASTER

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  master-gate:
    name: Inventory, history audit, MASTER gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: MASTER

      - name: Inventory current repo sprawl
        run: |
          ruby MASTER/tools/repo_inventory.rb --json | tee repo_inventory.json

      - name: Audit git history for lost valuables
        run: |
          ruby MASTER/tools/history_valuables.rb MASTER DEPLOY .github README.md MASTER.md CLAUDE.md

      - name: Run MASTER gate
        working-directory: MASTER
        run: |
          ruby bin/gate
