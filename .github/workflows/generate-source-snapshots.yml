name: generate source snapshots

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshots:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify runner Ruby
        run: |
          set -euo pipefail
          ruby --version
          ruby -c MASTER/tools/snapshot.rb

      - name: Generate governed snapshots
        id: generate
        shell: bash
        run: |
          set +e
          ruby MASTER/tools/snapshot.rb > snapshot-generation.log 2>&1
          status=$?
          cat snapshot-generation.log
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Publish snapshot branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="snapshot/generated-${GITHUB_RUN_ID}"
          git switch --create "${branch}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          status="${{ steps.generate.outputs.status }}"
          if [[ "${status}" != "0" ]]; then
            git add snapshot-generation.log
            git commit -m "chore(repo): record snapshot generation failure"
            git push origin "HEAD:${branch}"
            gh pr create               --base main               --head "${branch}"               --title "chore(repo): diagnose source snapshot generation"               --body "MASTER/tools/snapshot.rb exited with status ${status}. The captured output is in snapshot-generation.log."
            exit 1
          fi

          git add snapshot_MASTER.md snapshot_OPENBSD.md snapshot_RAILS.md
          git rm .github/workflows/generate-source-snapshots.yml
          git commit -m "chore(repo): add current source snapshots"
          git push origin "HEAD:${branch}"
          gh pr create             --base main             --head "${branch}"             --title "chore(repo): add current source snapshots"             --body "Generated from main by MASTER/tools/snapshot.rb. The workflow removes itself in this publication commit."
