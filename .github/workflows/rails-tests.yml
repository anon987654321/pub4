name: RAILS Tests

# Manual dispatch only. The GitHub Actions billing lock that first paused these
# jobs was cleared on 2026-07-18; the push/pull_request block below was left
# commented out and never restored with master-tests.yml's. Nothing outside this
# file is holding it, so uncommenting is all that is needed — do not read the
# comment-out as an external block.
#
# Local equivalent:
#   cd RAILS/<app> && bundle exec bin/ci
# Or via root: OPENBSD/bin/check-rails --profile=contributor
# Full: ruby RAILS/gates/runner.rb domain_alignment production etc.
on:
  workflow_dispatch:
  # push:
  #   paths:
  #     - "RAILS/**"
  #     - ".github/workflows/rails-tests.yml"
  # pull_request:
  #   paths:
  #     - "RAILS/**"
  #     - ".github/workflows/rails-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [amber, brgen, bsdports]

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

          bundler-cache: true
          working-directory: RAILS/${{ matrix.app }}

      - name: Run ${{ matrix.app }} CI
        working-directory: RAILS/${{ matrix.app }}
        run: bundle exec bin/ci
