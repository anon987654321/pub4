name: RAILS Tests

# Continuous application validation; workflow_dispatch remains available for
# deliberate reruns.
on:
  push:
    paths:
      - "RAILS/**"
      - ".ruby-version"
      - ".github/workflows/rails-tests.yml"
  pull_request:
    paths:
      - "RAILS/**"
      - ".ruby-version"
      - ".github/workflows/rails-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [amber, brgen, bsdports]

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: RAILS/${{ matrix.app }}

      - name: Run ${{ matrix.app }} CI
        working-directory: RAILS/${{ matrix.app }}
        run: bundle exec bin/ci
