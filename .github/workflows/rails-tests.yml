name: RAILS Tests

# Manual dispatch only.
#
# Local fast path:
#   cd RAILS/<app> && bundle exec bin/ci
#   OPENBSD/bin/check-rails --profile=contributor
#
# Full gates:
#   ruby MASTER/gates/runner.rb domain_alignment production etc.
#
# GitHub Actions remains available for deliberate validation without making
# every push or pull request pay for the full matrix.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [amber, brgen, bsdports]

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: RAILS/${{ matrix.app }}

      - name: Run ${{ matrix.app }} CI
        working-directory: RAILS/${{ matrix.app }}
        run: bundle exec bin/ci
