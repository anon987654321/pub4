name: RAILS Tests

# Runs on every push to main and on pull requests, the same as master-tests.yml.
# RAILS validated on each push is what makes small frequent pushes safe — the
# alternative, hoarding a week of work for one mega-push, is how a late failure
# strands everything.
#
# Local equivalent:
#   cd RAILS/<app> && bundle exec bin/ci
# Or via root: OPENBSD/bin/check-rails --profile=contributor
# Full: ruby RAILS/gates/runner.rb domain_alignment production etc.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [amber, brgen, bsdports]

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

          bundler-cache: true
          working-directory: RAILS/${{ matrix.app }}

      - name: Run ${{ matrix.app }} CI
        working-directory: RAILS/${{ matrix.app }}
        run: bundle exec bin/ci
