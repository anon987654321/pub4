name: MASTER Self‑Improvement (Manual Only)

on:
  workflow_dispatch:          # no schedule, only manual trigger
    inputs:
      max_autoloop_cycles:
        description: 'Number of autoloop cycles'
        required: false
        default: '10'
        type: string
      run_triad:
        description: 'Run /triad after autoloop?'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

          bundler-cache: true

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install gems
        run: bundle install --jobs 4 --retry 3

      - name: Run baseline tests
        run: bundle exec rake test

      - name: Autoloop
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cycles="${{ inputs.max_autoloop_cycles }}"
          echo "/autoloop $cycles" | bundle exec ruby exe/master
        continue-on-error: true

      - name: Run triad (if enabled)
        if: inputs.run_triad == true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "/triad ." | bundle exec ruby exe/master
        continue-on-error: true

      - name: Re‑run tests
        run: bundle exec rake test

      - name: Commit improvements
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: MASTER self‑improvement (manual) [skip ci]"
            echo "no_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Push
        if: steps.commit.outputs.no_changes == 'false'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
