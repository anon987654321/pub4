name: Deploy Weekly Integrity

# The integrity pass runs on vm23, not on a GitHub runner — it needs the box's
# live services, certs and relayd. This workflow is a signpost to that, which is
# why its only job echoes the command rather than running one, and why it has no
# schedule to restore.
# On VPS: add OPENBSD/vps_weekly_integrity.sh to root crontab (weekly, off-peak).
on:
  workflow_dispatch:

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Weekly integrity runs on vm23, not GitHub runners."
          echo "SSH: cd /home/dev/pub4 && sh OPENBSD/vps_weekly_integrity.sh"
          echo "Log: /var/log/pub4/weekly_integrity.log"
