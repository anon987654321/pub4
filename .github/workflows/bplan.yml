name: BPLAN CI

on:
  workflow_dispatch:
  push:
    paths:
      - "BPLAN/**"
      - ".github/workflows/bplan.yml"
  pull_request:
    paths:
      - "BPLAN/**"
      - ".github/workflows/bplan.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: BPLAN/rails

      - name: Build plans
        working-directory: BPLAN
        run: ruby build_plans.rb

      - name: Build legats
        working-directory: BPLAN
        run: ruby build_legats.rb

      - name: BPLAN validate tests
        working-directory: BPLAN
        run: make test

      - name: Rails tests
        working-directory: BPLAN/rails
        run: bundle exec rails test