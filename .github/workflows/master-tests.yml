name: MASTER Tests

# Manual dispatch only.
#
# Fast path:
#   cd MASTER && bin/check --profile=full
#   OPENBSD/bin/check --profile=contributor && cd MASTER && bin/check --profile=agent
#
# GitHub Actions remains available for deliberate validation without making
# every push or pull request pay for the full suite.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: MASTER

      - name: Run MASTER CI
        working-directory: MASTER
        run: bundle exec bin/ci

  structural:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: MASTER

      - name: Run structural cohesion tests
        working-directory: MASTER
        run: |
          bundle exec ruby -Itest -Ilib test/test_cohesion.rb
          bundle exec ruby -Itest -Ilib test/test_structural_stage.rb
          bundle exec ruby -Itest -Ilib test/test_visual_reference.rb

  reliability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: MASTER

      - name: Run reliability kernel tests
        working-directory: MASTER
        run: |
          bundle exec ruby -Itest -Ilib test/test_reliability_kernel.rb
          bundle exec ruby -Itest -Ilib test/test_reliability_second_tranche.rb
          bundle exec ruby -Itest -Ilib test/test_runtime_hardening.rb
          bundle exec ruby -Itest -Ilib test/test_fix_rollback.rb

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: MASTER

      - name: Run MASTER browser CI
        working-directory: MASTER
        env:
          MASTER_CI_BROWSER: "1"
          PROBE_REQUIRE_BROWSER: "1"
        run: bundle exec bin/ci
