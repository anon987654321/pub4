name: MASTER Tests

# Auto-runs on push and PR. The GitHub Actions billing lock that once paused
# every workflow in this directory was cleared on 2026-07-18, and these triggers
# were restored with it.
#
# Local: cd MASTER && bin/check --profile=full
# Or: OPENBSD/bin/check --profile=contributor && cd MASTER && bin/check --profile=agent
on:
  workflow_dispatch:
  push:
    paths:
      - "MASTER/**"
      - ".github/workflows/master-tests.yml"
  pull_request:
    paths:
      - "MASTER/**"
      - ".github/workflows/master-tests.yml"

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: MASTER

      - name: Run MASTER CI
        working-directory: MASTER
        run: bundle exec bin/ci

  structural:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: MASTER

      - name: Run structural cohesion tests
        working-directory: MASTER
        run: |
          bundle exec ruby -Itest -Ilib test/test_cohesion.rb
          bundle exec ruby -Itest -Ilib test/test_structural_stage.rb

  reliability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: MASTER

      - name: Run reliability kernel tests
        working-directory: MASTER
        run: |
          bundle exec ruby -Itest -Ilib test/test_reliability_kernel.rb
          bundle exec ruby -Itest -Ilib test/test_reliability_second_tranche.rb
          bundle exec ruby -Itest -Ilib test/test_runtime_hardening.rb
          bundle exec ruby -Itest -Ilib test/test_fix_rollback.rb

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: MASTER

      - name: Run MASTER browser CI
        working-directory: MASTER
        env:
          MASTER_CI_BROWSER: "1"
          PROBE_REQUIRE_BROWSER: "1"
        run: bundle exec bin/ci
