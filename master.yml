# master.yml v101

meta:
  version: "101.0"
  updated: "2025-12-20"
  path: "~/pub/master.yml"
  consumers: ["GitHub Copilot", "Claude Code", "cli.rb"]

principles:
  preserve_then_improve: "Never break working code"
  chestertons_fence: "Understand before removing"
  pareto: "80% value from 20% effort"
  dry: "Single source of truth"
  kiss: "Simplest solution"
  yagni: "Build when needed"
  single_responsibility: "One reason to change"
  small_functions: "Under 20 lines"
  omit_needless_words: "Brevity"

practices:
  no_analysis_files: "No summary/plan/report files"
  single_source: "One location per concept"
  edit_in_place: "Modify existing files"
  orchestrator_helpers: "Main calls _underscore helpers"
  idempotency: "Check before generate"
  clean_html: "Semantic elements"
  dependency_first: "Use packages before custom code"

workflow:
  phases: [assess, plan, execute, verify]
  loop: "Repeat until no violations"
  max_iterations: 10

modes:
  edit_existing:
    description: "Modify existing files only"
    when: "Refactoring, fixes, consolidation"
    default: true
  scaffold:
    description: "May create new files"
    when: "New apps, explicit request"

refactoring:
  before_custom_code:
    - "Check stimulus-components.com"
    - "Check stimulus-use behaviors"
    - "Check Rails generators"
    - "Check rubygems/npm"
  consolidation:
    triggers:
      - "3+ files with same prefix"
      - "File under 50 lines"
      - "Duplicate functions"
    deprecation: "# DEPRECATED: Merged into @[target].sh"
  cross_reference:
    before: ["Map dependencies", "Find duplicates", "List unused"]
    after: ["Verify paths", "Syntax check", "Test imports"]

ai:
  communication: "Report failures only"
  file_ops: "Native tools, not shell"
  banned_patterns:
    - "Creating analysis files"
    - "Asking permission"
    - "Explaining intent"
    - "New files in edit mode"

stacks:
  ruby:
    frozen_string_literal: true
    small_methods: true
  rails:
    version: "8.x"
    stack: "Solid Queue/Cache/Cable"
    auth: "bin/rails generate authentication"
  javascript:
    importmap_first: true
    stimulus_components: [clipboard, dropdown, dialog, reveal, character-counter, password-visibility, auto-submit, sortable]
    stimulus_use: [useIntersection, useDebounce, useClickOutside, useLazyLoad]
  zsh:
    mandate: "Parameter expansion over external tools"
    banned: [sed, awk, bash, python, tr, wc, head, tail, cut, find]
  css:
    custom_properties: true
    dark_mode: "@media (prefers-color-scheme: dark)"

constraints:
  thresholds:
    max_method_lines: 20
    max_file_lines: 200

validation:
  zsh: "zsh -n file.sh"
  ruby: "ruby -c file.rb"

convergence:
  enabled: true
  auto_fix: true

escape:
  emergency: "# VIOLATION: [principle] | Revert: [date]"
