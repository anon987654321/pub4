rules:
  authorities:
    - robert_c_martin_clean_code
    - martin_fowler_refactoring
    - elements_of_style_strunk_white
  
  axioms:
    purpose: foundational_truths_that_ground_all_other_rules
    list:
      - code_is_read_more_than_written
      - complexity_grows_quadratically_without_discipline
      - implicit_knowledge_creates_technical_debt
      - systems_drift_toward_entropy_without_governance
      - early_defects_cost_exponentially_more_later
      - working_software_beats_comprehensive_documentation
      - change_is_the_only_constant
  
  principles:
    do_one_thing:
      description: "Functions should perform a single, well-defined operation at one level of abstraction"
      rationale: "Reduces cognitive load, improves testability, enables reuse"
      violation_example: "Function that validates input, updates database, sends email, and logs"
      remedy: "Extract each responsibility into separate focused functions"
    
    one_level_of_abstraction:
      description: "All statements in a function should operate at the same conceptual level"
      rationale: "Makes code easier to read and understand by maintaining consistent mental models"
      violation_example: "Mixing high-level business logic with low-level string manipulation"
      remedy: "Extract lower-level operations into separate helper functions"
    
    few_arguments:
      description: "Functions should accept 3 or fewer parameters; consider objects for complex inputs"
      rationale: "Reduces complexity, improves testability, makes function calls easier to understand"
      violation_example: "def process(name, email, phone, address, city, state, zip)"
      remedy: "def process(user_info) where user_info is an object/hash"
    
    intention_revealing_names:
      description: "Names should clearly communicate purpose without requiring comments"
      rationale: "Self-documenting code reduces maintenance burden and misunderstandings"
      violation_example: "def calc(x, y) or temp_var"
      remedy: "def calculate_total_price(item_price, tax_rate) or total_after_tax"
    
    pronounceable_names:
      description: "Variable and function names should be easy to say aloud and discuss"
      rationale: "Facilitates communication among team members"
      violation_example: "genymdhms (generation year month day hour minute second)"
      remedy: "generation_timestamp or created_at"
    
    searchable_names:
      description: "Use meaningful constants instead of magic numbers; avoid single-letter variables except in tiny scopes"
      rationale: "Makes code greppable and refactorable"
      violation_example: "if status == 7 or for i in range(86400)"
      remedy: "if status == STATUS_COMPLETED or SECONDS_PER_DAY = 86400"
    
    one_word_per_concept:
      description: "Use consistent terminology across codebase for the same concept"
      rationale: "Reduces confusion and mental translation overhead"
      violation_example: "fetch_user, get_account, retrieve_profile all doing similar things"
      remedy: "Standardize on get_user, get_account, get_profile"
    
    exceptions_over_error_codes:
      description: "Use exceptions for error handling rather than return codes or special values"
      rationale: "Separates happy path from error handling, makes errors harder to ignore"
      violation_example: "return -1 on error, nil on not found, false on validation failure"
      remedy: "raise NotFoundError or raise ValidationError with descriptive messages"
    
    specific_exception_types:
      description: "Define and use specific exception classes rather than generic RuntimeError"
      rationale: "Allows precise error handling and better debugging"
      violation_example: "raise RuntimeError, 'file not found'"
      remedy: "raise FileNotFoundError, 'config.yml missing from /etc/app/'"
    
    context_in_error_messages:
      description: "Error messages should include actionable context about what failed and why"
      rationale: "Reduces debugging time and improves user experience"
      violation_example: "raise 'invalid input'"
      remedy: "raise ValidationError, 'email must be valid format, got: #{raw_input}'"
    
    content_over_decoration:
      description: "Focus on meaningful content; avoid decorative elements like ASCII art borders"
      rationale: "Decorations add noise without adding information"
      violation_example: "# ============== SECTION =============="
      remedy: "# User authentication"
    
    why_not_what:
      description: "Comments should explain why decisions were made, not what the code does"
      rationale: "Code shows what, comments should add insight the code cannot express"
      violation_example: "# Increment counter"
      remedy: "# Using modulo to wrap counter at 255 due to API limitation"
    
    plain_english_over_jargon:
      description: "Prefer clear, simple language over technical jargon or abbreviations"
      rationale: "Makes code accessible to broader audience and reduces learning curve"
      violation_example: "def proc_req_w_val or AbstractFactoryBeanProviderAdapter"
      remedy: "def process_request_with_validation or UserFactory"
  
  thresholds:
    function_length_lines: 20
    class_length_lines: 300
    cyclomatic_complexity: 10
    parameter_count: 3
    nesting_depth: 3
    comment_ratio: under_ten_percent
  
  naming_patterns:
    boolean_methods: "is_*, has_*, can_*, should_*"
    predicate_methods: "valid?, empty?, present?"
    bang_methods: "save!, create!, update!"
  
  smells:
    - commented_out_code
    - todo_without_issue_link
    - obvious_explanations
    - empty_descriptions
    - copy_paste_from_method_name
    - side_effects_without_documentation
    - output_arguments
    - flag_arguments
    - mixed_case_words
    - hyphen_separators
    - all_uppercase_except_constants
    - plaintext_secrets
  
  anti_patterns:
    - fictional_operations
    - stubbed_logic
    - placeholder_implementations
    - horizontal_rule_decorators
    - emoji_headers
    - bracket_decorators

