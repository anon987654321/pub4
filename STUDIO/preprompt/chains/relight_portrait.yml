description: >
  Her, then her under different light, then film. The one chain shape that can
  change the light on a face without inventing the face: the identity is fixed
  by stage 1 and the stage after it holds the subject while moving the light.

  Why this and not relighting the training set. A LoRA learns whatever is
  constant across its images, and the shadow under a cheekbone is how the
  cheekbone is read. Relight the training photographs and the model learns a
  generated bone structure welded to a real name. Here the face arrives already
  hers from stage 1, and only the light moves.

  zsxkib/ic-light carries `unverified: true` in MODEL_CAPABILITIES, so
  Chain.problems refuses this chain until `rake preprompt:schema_audit` has
  confirmed its input keys against Replicate. That refusal is the point: a
  guessed key validates cleanly, gets dropped by the API, and returns a
  plausible picture with a stage silently skipped.
stages:
  # Identity. flux-2-max holds a character across up to eight reference images,
  # so this is where "it is her" is decided and nothing downstream revisits it.
  - name: subject
    model: black-forest-labs/flux-2-max
    prompt: >
      ragnhild standing in a doorway on a Bergen street, late afternoon,
      photographed at three metres on a 85mm lens at f/2, natural expression
    options:
      aspect_ratio: "4:5"

  # Light. IC-Light takes the subject frame as `subject_image` and replaces its
  # illumination. It inherits stage 1's frame directly: a depth stage between
  # them would hand IC-Light a depth map as the subject, and it reads no depth.
  #
  # `postpro: house` grades this frame, the last one, after the API returns.
  # Last in the chain for the same reason it is last in a darkroom: nothing in a
  # relighting model knows what film does to a highlight.
  - name: relight
    model: zsxkib/ic-light
    prompt: >
      low winter sun from camera left, warm key raking across the face,
      cool skylight fill from the right, deep but open shadows
    inherits: [image]
    timeout: 900
    options:
      light_source: Left Light
      postpro: house
