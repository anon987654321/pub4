description: FLUX 2 consistency spine. Each later stage takes every earlier output as a reference, so a character accumulates instead of drifting.
stages:
  - name: establish
    model: black-forest-labs/flux-2-max
    prompt: a woman on a Bergen quayside in winter light
  - name: hold
    model: black-forest-labs/flux-2-max
    prompt: the same person, three metres back, overcast
    inherits: [image, references]
