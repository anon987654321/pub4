<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Ideas — five grades</title>
  <style>
    :root {
      color-scheme: dark;
      background: #111;
      color: #ddd;
      font: 14px/1.5 system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr));
      gap: 1rem;
      width: min(100%, 64rem);
      margin-inline: auto;
      padding: 1rem;
    }

    figure { min-width: 0; margin: 0; }

    img, video {
      display: block;
      width: 100%;
      height: auto;
      background: #000;
    }

    figcaption {
      padding-block-start: 0.5rem;
      color: #ddd;
      overflow-wrap: anywhere;
    }

  </style>
</head>
<body>
  <main aria-label="Five photographic grades and one animated frame">
    <figure>
      <img src="01-north-window.jpg" width="832" height="1248" alt="North-window photograph with a Portra portrait grade" decoding="async">
      <figcaption>Portrait · Portra</figcaption>
    </figure>
    <figure>
      <img src="02-eleven.jpg" width="832" height="1248" alt="Eleven photograph with a Vision3 500T cinematic grade" decoding="async">
      <figcaption>Cinematic · Vision3 500T</figcaption>
    </figure>
    <figure>
      <img src="03-darkness.jpg" width="832" height="1248" alt="Darkness photograph with a Tri-X street grade" decoding="async">
      <figcaption>Street · Tri-X</figcaption>
    </figure>
    <figure>
      <img src="04-dancing.jpg" width="832" height="1248" alt="Dancing photograph with a Cinestill 800T neon-night grade" decoding="async">
      <figcaption>Neon night · Cinestill 800T</figcaption>
    </figure>
    <figure>
      <img src="05-profile.jpg" width="832" height="1248" alt="Profile photograph with an Ektachrome E-6 grade" decoding="async">
      <figcaption>Process E-6 · Ektachrome</figcaption>
    </figure>
    <figure>
      <video src="dancing.mp4" controls playsinline preload="metadata" aria-label="Animated neon-night grade">
        Your browser does not support embedded video.
      </video>
      <figcaption>The neon-night frame, animated</figcaption>
    </figure>
  </main>
</body>
</html>
