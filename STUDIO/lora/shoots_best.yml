# The short list. Twenty-four, drawn from the other two sets by reference.
#
# References, not copies. A cherry-picked set that duplicated the prose would
# drift from its source the first time a scene was reworded, and then two files
# would describe the same sitting differently with nothing saying which rendered.
#
# Chosen on three criteria, in this order:
#
#   1. The face has to be readable. Likeness is the weak point right now, so a
#      figure at 30 m is a beautiful idea and a wasted render. "Small in the
#      Landscape" is the best composition in shoots.yml and it is not here.
#
#   2. No two from the same light. Four different greys is one grey. Overcast,
#      sodium and studio each appear once or twice, not four times.
#
#   3. SDXL has to be able to draw it. This is the criterion that removes the
#      most interesting warp entries, and it is not a judgement on the ideas:
#      VHS tracking error, sprocket holes, chain-link with selective focus,
#      sheeting water, sharp-face-inside-motion-blur and multiplied mirror
#      reflections are all things this model renders as mush. They stay in
#      shoots_warp.yml for a base that can hold them — FLUX can.
#
# Everything cut is still in its own file. Nothing here is a deletion.
selection:
