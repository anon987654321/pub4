# Every written sitting, in one file.
#
# Two briefs and a short list, in one file because the short list names
# sittings in the other two by number: split across three files, reading one
# meant opening all three.
#
# A sitting names a real light — a direction, a quality, a time of day —
# because that is the part a diffusion model can act on. "Beautiful lighting"
# gets the average of everything the model has seen; "north window,
# camera-left, no sun ever enters it" gets a picture. distance is here because
# perspective distortion is a function of subject distance alone, and nearly
# every sitting asks for two to three metres. scene is the clause that reaches
# CLIP; note is the reason, for people. Neither is generated at render time: a
# prompt that drifts between runs makes two takes incomparable.
#
# Every sitting is subject-agnostic. TRIGGER and DESCRIPTOR come from the
# subject.env of whoever is being rendered, so this file is the same for every
# LoRA.
#
# set says which brief a sitting belongs to, and the two do not average.
#
#   shoots  fifty sittings, a record of light, and it flatters on purpose.
#
#   warp    the press shoot, in the tradition Warp built with The Designers
#           Republic, Chris Cunningham and Boards of Canada, where the picture
#           is not trying to be liked. Degraded media as the subject rather
#           than an effect over it; clinical rather than dramatic, because flat
#           and frontal reads as a document; obstruction, the face there and
#           you work for it; hard flash and deep black, so bone structure is
#           the subject. Every sitting is still lit by something nameable and
#           still shot from a real distance: an unflattering light is the
#           brief, a badly made photograph is not.
#
# best is the short list, twenty-four chosen by reference rather than copied,
# so the prose has one home and a cherry-picked set cannot drift from it. The
# criteria, in order: the face has to be readable, since likeness is the weak
# point and a figure at 30 m is a wasted render; no two from the same light,
# because four different greys is one grey; and the base has to be able to draw
# it, which is what removes the most interesting warp entries — VHS tracking
# error, sprocket holes, sheeting water and multiplied mirror reflections come
# back as mush on SDXL. They stay in the warp set for a base that can hold
# them. Nothing here is a deletion.
#
# Numbers are per set: shoots 1 to 50, warp 1 to 24, and best renumbers what it
# points at. --only reads them inside whichever set is named.
sets:
  shoots:
    sides:
    - Northern Light
    - Rooms She Lives In
    - After Dark
    - Weather
    - Silver
    - Moving
    - Editorial
    - Quiet
  warp:
    sides:
    - Degraded Transmission
    - Document
    - Obstruction
    - Field Recording
    - Hard Flash
    - Duration
ideas:
