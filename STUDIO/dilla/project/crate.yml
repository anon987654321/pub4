# The crate — what the samples are dug from.
#
# samples/ and crate are the same thing, and neither is in git: the audio is
# large, and some of it is not ours to redistribute. That was the right call
# and it stayed right until 2026-08-31, when the whole checkout went to the
# Trash and the Trash was emptied. Everything tracked came back from origin in
# minutes. samples/ did not come back at all, because the only record of what
# was in it lived inside samples/ — samples/dug/provenance.json, ignored along
# with the audio it described.
#
# So provenance lives here instead, outside the ignore, and this file is the
# one thing that makes the crate reproducible. The audio stays out of git; what
# it was dug from does not.
#
# Re-dig with dilla's own pipeline, not by hand:
#
#   ruby dilla.rb source <url>        yt-dlp capture
#   ruby dilla.rb demux <url> deep    6-stem demucs
#   ruby dilla.rb chop <path>         bar-aligned loops into samples/chopped/
#
# `duration_s: ~` and `title: NA` mean YouTube no longer serves that id. Nine
# of the sixty-one were already gone when this was captured; they are kept
# listed rather than dropped, because a crate that quietly shrinks is a crate
# nobody can audit.
