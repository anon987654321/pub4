  - path: renders/beats/beauty_fugue.mp3
    title: beauty fugue
    why: LRA 6.6
  - path: renders/beats/liquid_dnb.mp3
    title: liquid dnb
    why: distinct genre
  - path: renders/beats/vaular_remix.mp3
    title: vaular remix
    why: distinct source
  - path: renders/beats/su_tunnel_choir.mp3
