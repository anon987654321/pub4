<!DOCTYPE html><!-- MASTER2 voice-first interface. Zero keyboard required. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000">
  <title>MASTER2</title>
  <style>
    /* ── Reset & tokens ─────────────────────────────────────────── */
    :root {
      --safe-t: env(safe-area-inset-top,    0px);
      --safe-r: env(safe-area-inset-right,  0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left,   0px);
      --orb-idle:    #1a1a2e;
      --orb-listen:  #0f3460;
      --orb-think:   #16213e;
      --orb-speak:   #0a2342;
      --ring-idle:   rgba(100,120,200,.15);
      --ring-listen: rgba( 80,140,255,.6);
      --ring-think:  rgba(180, 80,255,.4);
      --ring-speak:  rgba( 80,200,140,.5);
      --text:        #dcdcdc;
      --dim:         #666;
      --mono:        ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      background: #000;
      color: var(--text);
      font-family: var(--mono);
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Canvas ─────────────────────────────────────────────────── */
    canvas {
      position: fixed; inset: 0;
      width: 100dvw; height: 100dvh;
      background: #000;
      touch-action: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* ── Overlay layer ──────────────────────────────────────────── */
    #overlay {
      position: fixed; inset: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      pointer-events: none;
      z-index: 10;
    }

    /* ── Header bar ─────────────────────────────────────────────── */
    #header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: calc(12px + var(--safe-t)) calc(16px + var(--safe-r)) 0 calc(16px + var(--safe-l));
    }
    #orb-name {
      font-size: clamp(13px, 3.5vw, 22px);
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text);
      line-height: 1;
    }
    #status-badge {
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--dim);
      transition: color .25s;
      text-align: right;
      line-height: 1.6;
    }
    #status-badge.listen { color: #5090ff; }
    #status-badge.think  { color: #b050ff; }
    #status-badge.speak  { color: #50c88c; }
    #status-badge.error  { color: #ff4444; }

    /* ── Transcript scroll area ─────────────────────────────────── */
    #transcript {
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 calc(20px + var(--safe-r)) 0 calc(20px + var(--safe-l));
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 14px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
      pointer-events: auto;
    }
    #transcript::-webkit-scrollbar { display: none; }

    .msg {
      max-width: min(560px, 88vw);
      font-size: clamp(13px, 3.2vw, 15px);
      line-height: 1.55;
      animation: msg-in .25s ease-out both;
    }
    @keyframes msg-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }
    .msg-user { align-self: flex-end; color: var(--text); }
    .msg-user .bubble {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 18px 18px 4px 18px;
      padding: 10px 15px;
    }
    .msg-agent { align-self: flex-start; color: var(--text); }
    .msg-agent .bubble {
      background: transparent;
      color: #c8c8c8;
      padding: 2px 0;
    }
    .msg-meta {
      font-size: 10px;
      color: var(--dim);
      margin-top: 4px;
      letter-spacing: .06em;
    }
    .msg-user .msg-meta { text-align: right; }

    /* streaming cursor */
    .cursor {
      display: inline-block;
      width: 2px; height: 1em;
      background: #5090ff;
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink .9s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── Voice bar (primary UI) ─────────────────────────────────── */
    #voice-bar {
      padding: 0 calc(16px + var(--safe-r)) calc(16px + var(--safe-b)) calc(16px + var(--safe-l));
      pointer-events: auto;
    }

    #voice-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Mic button — the primary UI element */
    #mic {
      flex-shrink: 0;
      width: 72px; height: 72px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.04);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s ease;
      position: relative;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #mic:active { transform: scale(.92); }
    #mic.listening {
      border-color: #5090ff;
      background: rgba(80,144,255,.12);
      box-shadow: 0 0 0 0 rgba(80,144,255,.4);
      animation: mic-pulse 1.4s ease-out infinite;
    }
    #mic.thinking {
      border-color: #b050ff;
      background: rgba(176,80,255,.1);
      animation: mic-spin 2s linear infinite;
    }
    #mic.speaking {
      border-color: #50c88c;
      background: rgba(80,200,140,.1);
      animation: mic-wave 0.6s ease-in-out infinite alternate;
    }
    @keyframes mic-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(80,144,255,.5); }
      70%  { box-shadow: 0 0 0 22px rgba(80,144,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(80,144,255,0); }
    }
    @keyframes mic-spin {
      from { box-shadow: 0 0 0 2px rgba(176,80,255,.2); }
      to   { box-shadow: 0 0 0 10px rgba(176,80,255,0); }
    }
    @keyframes mic-wave {
      from { transform: scale(1); }
      to   { transform: scale(1.06); }
    }

    /* Mic icon SVG */
    .mic-icon { transition: opacity .2s; }
    .stop-icon { position: absolute; opacity: 0; transition: opacity .2s; }
    #mic.listening .mic-icon  { opacity: 0; }
    #mic.listening .stop-icon { opacity: 1; }

    /* Live transcript line */
    #live-text {
      flex: 1;
      font-size: clamp(13px, 3.2vw, 15px);
      color: var(--dim);
      min-height: 44px;
      display: flex;
      align-items: center;
      transition: color .2s;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    #live-text.active { color: var(--text); }
    #live-text.hint   { color: var(--dim); font-style: italic; }

    /* Secondary: type button */
    #type-btn {
      flex-shrink: 0;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.1);
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s;
      -webkit-tap-highlight-color: transparent;
    }
    #type-btn:active { transform: scale(.9); }
    #type-btn.active { border-color: rgba(255,255,255,.3); color: var(--text); }

    /* Type input — hidden by default, shown when type-btn pressed */
    #type-area {
      display: none;
      gap: 8px;
      margin-top: 10px;
      align-items: center;
    }
    #type-area.visible { display: flex; }
    #type-input {
      flex: 1;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 22px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
      padding: 10px 16px;
      outline: none;
      transition: border-color .2s;
      min-height: 44px;
    }
    #type-input:focus { border-color: rgba(255,255,255,.3); }
    #send-btn {
      flex-shrink: 0;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(80,144,255,.7);
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s;
    }
    #send-btn:active { transform: scale(.9); background: rgba(80,144,255,1); }

    /* ── Continuous mode toggle ─────────────────────────────────── */
    #continuous-toggle {
      position: fixed;
      top: calc(14px + var(--safe-t));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 9px;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--dim);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: color .2s;
    }
    #continuous-toggle.on { color: #50c88c; }
    .toggle-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--dim);
      transition: background .2s;
    }
    #continuous-toggle.on .toggle-dot { background: #50c88c; }

    /* ── Orb state indicator (bottom-right) ─────────────────────── */
    #orb-info {
      position: fixed;
      bottom: calc(100px + var(--safe-b));
      right: calc(14px + var(--safe-r));
      z-index: 15;
      text-align: right;
      pointer-events: auto;
      cursor: pointer;
    }
    #orb-state-label {
      font-size: 9px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--dim);
    }
    #orb-arrows {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 4px;
    }
    .orb-arrow {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.12);
      background: transparent;
      color: var(--dim);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: all .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .orb-arrow:active { transform: scale(.88); color: var(--text); }

    /* ── Audio waveform bars ────────────────────────────────────── */
    #waveform {
      position: fixed;
      bottom: calc(96px + var(--safe-b));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 2px;
      height: 32px;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
      z-index: 12;
    }
    #waveform.active { opacity: 1; }
    .wave-bar {
      width: 3px;
      border-radius: 2px;
      background: #5090ff;
      min-height: 3px;
      transition: height .08s ease;
      transform-origin: bottom;
    }

    /* ── TTS progress bar ───────────────────────────────────────── */
    #tts-progress {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: transparent;
      z-index: 20;
      pointer-events: none;
    }
    #tts-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #50c88c, #5090ff);
      transition: width .1s linear;
    }

    /* ── Voice availability notice ──────────────────────────────── */
    #voice-notice {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      text-align: center;
      max-width: 280px;
      display: none;
    }
    #voice-notice.show { display: block; }
    #voice-notice p {
      font-size: 13px;
      color: var(--dim);
      line-height: 1.6;
    }
    #voice-notice button {
      margin-top: 16px;
      padding: 10px 24px;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.2);
      background: transparent;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Keyboard shortcut hints ───────────────────────────────── */
    #hints {
      position: fixed;
      bottom: calc(94px + var(--safe-b));
      left: calc(16px + var(--safe-l));
      font-size: 9px;
      letter-spacing: .12em;
      color: rgba(102,102,102,.6);
      pointer-events: none;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- Continuous mode toggle -->
  <div id="continuous-toggle" role="button" aria-label="Toggle continuous listening" tabindex="0">
    <div class="toggle-dot"></div>
    <span id="continuous-label">continuous</span>
  </div>

  <!-- Main overlay grid -->
  <div id="overlay">
    <!-- Header -->
    <div id="header">
      <div id="orb-name">MASTER2</div>
      <div id="status-badge">
        <div id="status-line">ready</div>
        <div id="model-line"></div>
      </div>
    </div>

    <!-- Transcript -->
    <div id="transcript" role="log" aria-live="polite" aria-label="Conversation history"></div>

    <!-- Voice bar -->
    <div id="voice-bar">
      <div id="voice-row">
        <!-- Primary: mic button -->
        <button id="mic" aria-label="Hold to speak" aria-pressed="false">
          <svg class="mic-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="2" width="6" height="12" rx="3"/>
            <path d="M5 10a7 7 0 0 0 14 0"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
            <line x1="8"  y1="21" x2="16" y2="21"/>
          </svg>
          <svg class="stop-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="6" y="6" width="12" height="12" rx="2"/>
          </svg>
        </button>

        <!-- Live speech transcript -->
        <div id="live-text" class="hint" aria-live="assertive">tap mic or say anything</div>

        <!-- Secondary: type button -->
        <button id="type-btn" aria-label="Toggle keyboard input">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <rect x="2" y="6" width="20" height="12" rx="2"/>
            <line x1="6"  y1="10" x2="6"  y2="10"/><line x1="10" y1="10" x2="10" y2="10"/>
            <line x1="14" y1="10" x2="14" y2="10"/><line x1="18" y1="10" x2="18" y2="10"/>
            <line x1="6"  y1="14" x2="18" y2="14"/>
          </svg>
        </button>
      </div>

      <!-- Type input (hidden by default) -->
      <div id="type-area" role="group" aria-label="Text input">
        <input id="type-input" type="text" placeholder="type a message…" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
        <button id="send-btn" aria-label="Send message">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Orb state nav -->
  <div id="orb-info">
    <div id="orb-state-label">sphere</div>
    <div id="orb-arrows">
      <button class="orb-arrow" id="orb-prev" aria-label="Previous orb state">‹</button>
      <button class="orb-arrow" id="orb-next" aria-label="Next orb state">›</button>
    </div>
  </div>

  <!-- Waveform visualizer -->
  <div id="waveform" aria-hidden="true">
    <!-- bars injected by JS -->
  </div>

  <!-- TTS progress -->
  <div id="tts-progress" aria-hidden="true"><div id="tts-bar"></div></div>

  <!-- Keyboard hints -->
  <div id="hints" aria-hidden="true">space · listen<br>esc · cancel<br>ctrl+k · clear</div>

  <!-- Voice not available notice -->
  <div id="voice-notice" role="alert">
    <p>Voice input unavailable.<br>Use the keyboard button → to type.</p>
    <button id="voice-notice-ok">OK</button>
  </div>

  <script>
  // ── Constants ──────────────────────────────────────────────────────────────
  const TOKEN       = window.MASTER_TOKEN || '';
  const TTS_KEY     = window.TTS_BACKEND_KEY || '';
  const CHAT_URL    = '/chat';
  const POLL_URL    = '/poll';
  const TTS_URL     = '/tts';
  const ORB_STATES  = [
    'sphere','helix','cube','torus','cone','cylinder','spiral','ring','disk',
    'vortex','mobius','klein','enneper','roman','log-spiral','plane','grid',
    'rose','orbits','poly','tree','neural-net','fireworks','petals','leaf',
    'galaxy','rain','concentric','curtain','brownian','orbit-ring',
    'waterfall','pendulum','swarm','snake','pendula','bounce','spiral-grow',
    'heartbeat','interference','rotation','noise-plane','ripple','fractal',
    'lorenz','singularity','spiro-rings','lightning','galactic','sphere2'
  ];

  // ── DOM refs ───────────────────────────────────────────────────────────────
  const canvas    = document.getElementById('canvas');
  const ctx       = canvas.getContext('2d');
  const transcript= document.getElementById('transcript');
  const micBtn    = document.getElementById('mic');
  const liveText  = document.getElementById('live-text');
  const typeBtn   = document.getElementById('type-btn');
  const typeArea  = document.getElementById('type-area');
  const typeInput = document.getElementById('type-input');
  const sendBtn   = document.getElementById('send-btn');
  const statusLine= document.getElementById('status-line');
  const modelLine = document.getElementById('model-line');
  const statusBadge=document.getElementById('status-badge');
  const orbLabel  = document.getElementById('orb-state-label');
  const waveform  = document.getElementById('waveform');
  const ttsBar    = document.getElementById('tts-bar');
  const contToggle= document.getElementById('continuous-toggle');
  const contLabel = document.getElementById('continuous-label');
  const voiceNotice=document.getElementById('voice-notice');

  // ── State ──────────────────────────────────────────────────────────────────
  let currentOrb  = 0;
  let sessionId   = sessionStorage.getItem('master_session_id') || '';
  let agentState  = 'idle';   // idle | listening | thinking | speaking
  let continuous  = false;
  let audioLevel  = 0;
  let tiltX = 0, tiltY = 0;
  let localTtsAvailable = false;
  let speechSynth = window.speechSynthesis;
  let voices      = [];

  // ── Waveform bars ──────────────────────────────────────────────────────────
  const WAVE_COUNT = 24;
  for (let i = 0; i < WAVE_COUNT; i++) {
    const b = document.createElement('div');
    b.className = 'wave-bar';
    b.style.height = '3px';
    waveform.appendChild(b);
  }
  const waveBars = [...waveform.querySelectorAll('.wave-bar')];

  function animateWave(level) {
    waveBars.forEach((b, i) => {
      const phase = (i / WAVE_COUNT) * Math.PI * 2;
      const h = Math.max(3, level * 28 * (0.5 + 0.5 * Math.sin(phase + Date.now() * 0.006)));
      b.style.height = h + 'px';
    });
  }

  // ── Canvas / Orb ──────────────────────────────────────────────────────────
  const W = 2000;
  let neurons = [];

  function resize() {
    canvas.width  = window.innerWidth  * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width  = window.innerWidth  + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  class Neuron {
    constructor(i) { this.i = i; this.reset(0); }
    reset(s) {
      // 50 geometric configurations — each is a valid orb state
      const n = this.i, N = W;
      if (s === 0)  { const φ=Math.acos(1-2*(n+.5)/N),θ=Math.PI*(1+Math.sqrt(5))*n; this.ox=Math.cos(θ)*Math.sin(φ)*50; this.oy=Math.cos(φ)*50; this.oz=Math.sin(θ)*Math.sin(φ)*50; }
      else if(s===1){ const t=(n/N)*Math.PI*8,r=(n/N)*40; this.ox=Math.cos(t)*r; this.oy=(n/N)*60-30; this.oz=Math.sin(t)*r; }
      else if(s===2){ const f=Math.floor(n/(N/6)),u=(n%(N/6))/(N/6)*2-1,v=Math.random()*2-1,fs=[[1,u,v],[-1,u,v],[u,1,v],[u,-1,v],[u,v,1],[u,v,-1]]; [this.ox,this.oy,this.oz]=fs[f].map(x=>x*40); }
      else if(s===3){ const u=(n/N)*Math.PI*2,v=((n*7)%N/N)*Math.PI*2,R=35,r=15; this.ox=(R+r*Math.cos(v))*Math.cos(u); this.oy=r*Math.sin(v); this.oz=(R+r*Math.cos(v))*Math.sin(u); }
      else if(s===4){ const h=(n/N)*60-30,r=(1-n/N)*30,a=(n*137.5)%360; this.ox=Math.cos(a)*r; this.oy=h; this.oz=Math.sin(a)*r; }
      else if(s===5){ const h=(n/N)*60-30,a=(n*137.5)%360; this.ox=Math.cos(a)*30; this.oy=h; this.oz=Math.sin(a)*30; }
      else if(s===6){ const t=(n/N)*Math.PI*6,r=(n/N)*40; this.ox=Math.cos(t)*r; this.oy=(n/N)*60-30; this.oz=Math.sin(t)*r; }
      else if(s===7){ const a=(n/N)*Math.PI*2; this.ox=Math.cos(a)*40; this.oy=Math.sin(a)*40; this.oz=0; }
      else if(s===8){ const a=(n/N)*Math.PI*2,r=Math.sqrt(n/N)*40; this.ox=Math.cos(a)*r; this.oy=Math.sin(a)*r; this.oz=0; }
      else if(s===9){ const u=(n/N)*Math.PI*2,v=((n*3)%N/N)*.4-.2; this.ox=(1+v*Math.cos(u/2))*Math.cos(u)*40; this.oy=(1+v*Math.cos(u/2))*Math.sin(u)*40; this.oz=v*Math.sin(u/2)*40; }
      else { const φ=Math.acos(1-2*(n+.5)/N),θ=Math.PI*(1+Math.sqrt(5))*n*((s%5)+1); this.ox=Math.cos(θ)*Math.sin(φ)*(30+s%3*8); this.oy=Math.cos(φ)*(30+s%3*8); this.oz=Math.sin(θ)*Math.sin(φ)*(30+s%3*8); }
      this.px=this.ox; this.py=this.oy; this.pz=this.oz;
      this.vx=0; this.vy=0; this.vz=0; this.c=0; this.think=0;
    }
    update(t) {
      const speed = agentState === 'thinking' ? 1.8 : agentState === 'speaking' ? 1.2 : 0.7;
      const wave = Math.sin(t * speed + this.i * 0.003) * audioLevel * 8;
      this.px += ((this.ox + wave * (this.i % 3 - 1)) - this.px) * 0.06;
      this.py += ((this.oy + wave * 0.5) - this.py) * 0.06;
      this.pz += (this.oz - this.pz) * 0.06;
      if (agentState === 'thinking' && Math.random() < 0.002) this.think = 1;
      if (this.think > 0) this.think = Math.max(0, this.think - 0.03);
    }
    project(W, H) {
      const tilt = 0.3;
      const rx = this.px + tiltX * tilt;
      const ry = this.py + tiltY * tilt;
      const rz = this.pz;
      const fov = 250, z = rz + 120;
      const scale = fov / z;
      return { x: W/2 + rx * scale, y: H/2 - ry * scale, z: rz, scale };
    }
  }

  neurons = Array.from({ length: W }, (_, i) => new Neuron(i));

  function setOrb(idx) {
    currentOrb = ((idx % ORB_STATES.length) + ORB_STATES.length) % ORB_STATES.length;
    neurons.forEach(n => n.reset(currentOrb));
    orbLabel.textContent = ORB_STATES[currentOrb];
  }

  // Orb color by agent state
  function orbColor() {
    switch (agentState) {
      case 'listening': return [80, 144, 255];
      case 'thinking':  return [176, 80, 255];
      case 'speaking':  return [80, 200, 140];
      default:          return [120, 130, 180];
    }
  }

  let animT = 0;
  function draw() {
    animT += 0.016;
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    const [r, g, b] = orbColor();
    const alpha = agentState === 'idle' ? 0.45 : 0.75;

    neurons.forEach(n => n.update(animT));

    const sorted = [...neurons].sort((a, b) => a.pz - b.pz);

    sorted.forEach(n => {
      const p = n.project(W, H);
      const depth = (n.pz + 60) / 120;
      const a = Math.max(0, Math.min(1, depth * alpha));
      const size = Math.max(0.5, p.scale * 0.8);

      if (n.think > 0) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, size * 2, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${r},${g},${b},${n.think * 0.9})`;
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
        ctx.fill();
      }
    });

    requestAnimationFrame(draw);
  }
  draw();

  // ── Device tilt ───────────────────────────────────────────────────────────
  window.addEventListener('deviceorientation', e => {
    tiltX = (e.gamma || 0) / 45;
    tiltY = (e.beta  || 0) / 45;
  });

  // ── Agent state management ─────────────────────────────────────────────────
  function setState(s) {
    agentState = s;
    micBtn.className = s === 'listening' ? 'listening' : s === 'thinking' ? 'thinking' : s === 'speaking' ? 'speaking' : '';
    micBtn.setAttribute('aria-pressed', s === 'listening' ? 'true' : 'false');
    statusBadge.className = s !== 'idle' ? s : '';
    const labels = { idle: 'ready', listening: '● recording', thinking: '◌ thinking', speaking: '▶ speaking' };
    statusLine.textContent = labels[s] || s;
    if (s === 'listening') {
      waveform.classList.add('active');
      liveText.classList.remove('hint');
      liveText.classList.add('active');
    } else {
      waveform.classList.remove('active');
      if (!liveText.textContent || liveText.classList.contains('hint')) {
        liveText.textContent = 'tap mic or say anything';
        liveText.className = 'hint';
      }
    }
  }

  // ── Transcript ─────────────────────────────────────────────────────────────
  function addMsg(role, text, meta) {
    const div = document.createElement('div');
    div.className = `msg msg-${role}`;
    const bub = document.createElement('div');
    bub.className = 'bubble';
    bub.textContent = text;
    div.appendChild(bub);
    if (meta) {
      const m = document.createElement('div');
      m.className = 'msg-meta';
      m.textContent = meta;
      div.appendChild(m);
    }
    transcript.appendChild(div);
    transcript.scrollTop = transcript.scrollHeight;
    return bub;
  }

  function addStreamingMsg() {
    const div = document.createElement('div');
    div.className = 'msg msg-agent';
    const bub = document.createElement('div');
    bub.className = 'bubble';
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    bub.appendChild(cursor);
    div.appendChild(bub);
    transcript.appendChild(div);
    transcript.scrollTop = transcript.scrollHeight;
    return { bub, cursor };
  }

  // ── Chat API ───────────────────────────────────────────────────────────────
  async function sendMessage(text) {
    if (!text.trim()) return;
    setState('thinking');
    addMsg('user', text);
    liveText.textContent = '';
    liveText.className = 'hint';

    const { bub, cursor } = addStreamingMsg();
    let fullText = '';

    try {
      const res = await fetch(CHAT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...(TOKEN && { 'Authorization': `Bearer ${TOKEN}` }) },
        body: JSON.stringify({ text, session_id: sessionId }),
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const data = await res.json();
      sessionId = data.session_id || sessionId;
      sessionStorage.setItem('master_session_id', sessionId);
      fullText = data.response || data.text || '';
      const meta = data.model ? `${data.model} · ${data.tokens || ''}tok` : '';
      modelLine.textContent = meta;

      // Stream text visually
      cursor.remove();
      bub.textContent = '';
      let i = 0;
      const stream = setInterval(() => {
        if (i < fullText.length) {
          bub.textContent += fullText[i++];
          transcript.scrollTop = transcript.scrollHeight;
        } else {
          clearInterval(stream);
          setState('speaking');
          speak(fullText);
        }
      }, 12);
    } catch (e) {
      cursor.remove();
      bub.textContent = `error: ${e.message}`;
      bub.style.color = '#ff4444';
      setState('idle');
    }
  }

  // ── TTS ────────────────────────────────────────────────────────────────────
  function loadVoices() {
    voices = speechSynth?.getVoices() || [];
    localTtsAvailable = voices.length > 0;
  }
  if (speechSynth) {
    loadVoices();
    speechSynth.onvoiceschanged = loadVoices;
  }

  function speakLocal(text) {
    if (!speechSynth || !localTtsAvailable) return false;
    speechSynth.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    // Prefer a calm, neutral voice
    const pref = voices.find(v => /samantha|karen|moira|en.gb/i.test(v.name)) || voices[0];
    if (pref) utt.voice = pref;
    utt.rate = 0.95;
    utt.pitch = 1.0;
    utt.onend = () => {
      setState('idle');
      ttsBar.style.width = '0%';
      if (continuous) startListening();
    };
    // Animate TTS progress bar
    const dur = Math.max(1500, text.length * 60);
    const start = Date.now();
    const tick = setInterval(() => {
      const prog = Math.min(100, ((Date.now() - start) / dur) * 100);
      ttsBar.style.width = prog + '%';
      if (prog >= 100) clearInterval(tick);
    }, 80);
    speechSynth.speak(utt);
    return true;
  }

  async function speakRemote(text) {
    try {
      const res = await fetch(TTS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...(TOKEN && { 'Authorization': `Bearer ${TOKEN}` }) },
        body: JSON.stringify({ text, backend_key: TTS_KEY }),
      });
      if (!res.ok) throw new Error('TTS HTTP ' + res.status);
      const blob = await res.blob();
      const url  = URL.createObjectURL(blob);
      const audio = new Audio(url);
      const dur = 0; // unknown until play
      audio.onended = () => { setState('idle'); ttsBar.style.width='0%'; URL.revokeObjectURL(url); if (continuous) startListening(); };
      audio.onplay  = () => { /* animate */ };
      await audio.play();
    } catch {
      setState('idle');
      if (continuous) startListening();
    }
  }

  function speak(text) {
    if (speakLocal(text)) return;
    if (TTS_KEY) { speakRemote(text); return; }
    setState('idle');
    if (continuous) startListening();
  }

  // ── Speech recognition ─────────────────────────────────────────────────────
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let recognizing = false;

  if (SR) {
    recognition = new SR();
    recognition.continuous    = false;
    recognition.interimResults= true;
    recognition.lang          = 'en-US';

    recognition.onstart = () => { recognizing = true; setState('listening'); audioLevel = 0.3; };
    recognition.onend   = () => {
      recognizing = false;
      audioLevel = 0;
      waveBars.forEach(b => b.style.height = '3px');
      if (agentState === 'listening') setState('idle');
    };
    recognition.onerror = e => {
      recognizing = false;
      if (e.error !== 'no-speech' && e.error !== 'aborted') {
        statusLine.textContent = 'mic: ' + e.error;
        statusBadge.className = 'error';
      }
      setState('idle');
    };
    recognition.onresult = e => {
      let interim = '', final = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += t; else interim += t;
      }
      liveText.textContent = final || interim;
      liveText.className = (final || interim) ? 'active' : 'hint';
      // Simulate audio level from speech activity
      audioLevel = final || interim ? 0.5 + Math.random() * 0.5 : 0.2;
      animateWave(audioLevel);
      if (final) {
        recognition.stop();
        sendMessage(final.trim());
      }
    };
  } else {
    voiceNotice.classList.add('show');
  }

  function startListening() {
    if (!recognition || recognizing || agentState === 'thinking' || agentState === 'speaking') return;
    try { recognition.start(); } catch { /* already running */ }
  }

  function stopListening() {
    if (!recognition || !recognizing) return;
    recognition.stop();
    setState('idle');
  }

  // ── Controls ───────────────────────────────────────────────────────────────
  micBtn.addEventListener('click', () => {
    if (agentState === 'thinking') return;
    if (agentState === 'speaking') { speechSynth?.cancel(); setState('idle'); return; }
    if (recognizing) stopListening(); else startListening();
  });

  // Long press = hold-to-talk
  let holdTimer = null;
  micBtn.addEventListener('pointerdown', () => { holdTimer = setTimeout(() => startListening(), 150); });
  micBtn.addEventListener('pointerup',   () => { clearTimeout(holdTimer); });

  typeBtn.addEventListener('click', () => {
    typeArea.classList.toggle('visible');
    typeBtn.classList.toggle('active');
    if (typeArea.classList.contains('visible')) {
      setTimeout(() => typeInput.focus(), 100);
    }
  });

  sendBtn.addEventListener('click', () => {
    const t = typeInput.value.trim();
    if (t) { sendMessage(t); typeInput.value = ''; }
  });

  typeInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const t = typeInput.value.trim();
      if (t) { sendMessage(t); typeInput.value = ''; }
    }
  });

  // Continuous toggle
  contToggle.addEventListener('click', () => {
    continuous = !continuous;
    contToggle.classList.toggle('on', continuous);
    contLabel.textContent = continuous ? 'continuous on' : 'continuous';
    if (continuous) startListening();
  });

  // Orb navigation
  document.getElementById('orb-prev').addEventListener('click', () => setOrb(currentOrb - 1));
  document.getElementById('orb-next').addEventListener('click', () => setOrb(currentOrb + 1));

  // Voice notice dismiss
  document.getElementById('voice-notice-ok').addEventListener('click', () => {
    voiceNotice.classList.remove('show');
    typeBtn.click();
  });

  // Keyboard
  window.addEventListener('keydown', e => {
    if (e.target === typeInput) return;
    if (e.code === 'Space') { e.preventDefault(); if (agentState === 'idle') startListening(); else if (agentState === 'listening') stopListening(); }
    if (e.key  === 'Escape') { stopListening(); speechSynth?.cancel(); setState('idle'); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); while (transcript.firstChild) transcript.removeChild(transcript.firstChild); sessionId=''; sessionStorage.removeItem('master_session_id'); }
    if (e.key === 'ArrowLeft')  setOrb(currentOrb - 1);
    if (e.key === 'ArrowRight') setOrb(currentOrb + 1);
  });

  // Session restore
  if (location.hash) sessionId = location.hash.slice(1);

  // Waveform animation loop
  let waveActive = false;
  setInterval(() => {
    if (agentState === 'listening') {
      audioLevel = Math.max(0.1, audioLevel * 0.95 + Math.random() * 0.3);
      animateWave(audioLevel);
    } else if (agentState === 'speaking') {
      audioLevel = 0.2 + Math.sin(Date.now() * 0.004) * 0.15;
      animateWave(audioLevel);
    } else {
      audioLevel = Math.max(0, audioLevel * 0.8);
    }
  }, 50);

  // ── Initial state ──────────────────────────────────────────────────────────
  setOrb(1); // helix default — more dynamic than sphere
  setState('idle');

  // Auto-start listening if browser allows (mobile may require gesture first)
  setTimeout(() => {
    if (SR && !voiceNotice.classList.contains('show')) {
      // Attempt auto-start; will silently fail if no mic permission yet
      try { recognition.start(); } catch { /* needs gesture */ }
    }
  }, 800);
  </script>
</body>
</html>
