job: extension
config:
  name: ragnhild_v2
  process:
  - type: sd_trainer
    training_folder: /Users/mac/Documents/GitHub/pub4/lora/training/ragnhild/ai_toolkit/weights
    device: mps
    trigger_word: ragnhild
    network:
      type: lora
      linear: 32
      linear_alpha: 16
    save:
      dtype: float16
      save_every: 250
      max_step_saves_to_keep: 4
      push_to_hub: false
    datasets:
    - folder_path: /Users/mac/Documents/GitHub/pub4/lora/training/ragnhild/ai_toolkit/dataset
      caption_ext: txt
      caption_dropout_rate: 0.08
      shuffle_tokens: false
      cache_latents_to_disk: true
      resolution:
      - 512
    train:
      batch_size: 1
      steps: 1800
      skip_first_sample: true
      gradient_accumulation_steps: 1
      train_unet: true
      train_text_encoder: false
      gradient_checkpointing: true
      noise_scheduler: flowmatch
      optimizer: adamw
      lr: 1.0e-05
      ema_config:
        use_ema: true
        ema_decay: 0.995
      dtype: fp16
    model:
      name_or_path: black-forest-labs/FLUX.1-dev
      is_flux: true
      quantize: true
      low_vram: true
    sample:
      sampler: flowmatch
      sample_every: 250
      width: 1024
      height: 1024
      seed: 42
      walk_seed: true
      guidance_scale: 3.5
      sample_steps: 28
      prompts:
      - ragnhild, adult Norwegian woman in her 40s, exact likeness, no hat, Bergen
        rain-window close portrait, soft grey daylight, steady eyes, natural mature
        skin, Portra 400 scan, muted blacks, fine grain, 85mm lens
      - ragnhild, adult Norwegian woman in her 40s, exact likeness, no hat, Hardanger
        fjord golden-hour portrait, wind in blonde hair, warm rim light, gentle smile,
        Kodak Gold warmth, soft highlight rolloff, 50mm lens
      - ragnhild, adult Norwegian woman in her 40s, exact likeness, no hat, Trondheim
        cafe cinematic still, tungsten practicals, window-blue fill, quiet expression,
        lifted shadows, subtle halation, ARRI-style color
      - ragnhild, adult Norwegian woman in her 40s, exact likeness, no hat, black-and-white
        Tri-X documentary headshot, direct gaze, real skin texture, silver-rich contrast,
        soft grain, 90mm portrait lens
      - ragnhild, adult Norwegian woman in her 40s, exact likeness, no hat, Nordic
        editorial studio portrait, large softbox, clean catchlights, restrained makeup,
        natural mouth and eyes, Hasselblad medium-format feel
      - ragnhild, adult Norwegian woman in her 40s, exact likeness, no hat, coastal
        winter portrait, pale sky, wool coat, cool sea light, calm face, low saturation,
        cyan shadows, protected skin tone
      - ragnhild, adult Norwegian woman in her 40s, exact likeness, no hat, warm kitchen
        film still, morning side light, shallow depth, lived-in background, honest
        face proportions, soft color negative grade
      - ragnhild, adult Norwegian woman in her 40s, exact likeness, no hat, mountain-road
        travel portrait, overcast Hardanger light, relaxed posture, documentary realism,
        neutral colors, gentle analog grain
      - ragnhild, adult Norwegian woman in her 40s, exact likeness, no hat, high-fashion
        but natural portrait, black wool coat, sculpted soft key light, deep muted
        background, elegant Hollywood color grade
      - ragnhild, adult Norwegian woman in her 40s, exact likeness, no hat, candid
        laughing portrait, Bergen street corner, wet pavement reflections, handheld
        35mm photojournalism, warm skin, cool environment
      - ragnhild, adult Norwegian woman in her 40s, exact likeness, no hat, simple
        profile avatar, face centered, plain background, clean catchlights, skin texture
        intact, realistic color, no stylization
      - ragnhild, adult Norwegian woman in her 40s, exact likeness, no hat, identity
        check portrait, front view, plain light, face shape, eyes, mouth, age, and
        expression clear before any cinematic grade
      neg: plastic skin, waxy face, over-smoothed, airbrushed, doll, uncanny, deformed
        eyes, asymmetrical eyes, extra teeth, bad hands, harsh HDR, oversaturated,
        anime, illustration, CGI, face swap artifacts, cap, hat, selfie distortion,
        beauty filter, heavy makeup, face morph, identity drift, teenage face, overly
        young face, generic influencer face, different woman
    meta:
      name: ragnhild_v2
      version: '2.0'
      master_trigger: ragnhild
