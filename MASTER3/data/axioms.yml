# Kernel axioms — enforced by scan rules, pipeline stages, or tool guards
kernel:
  PRESERVE_FIRST:    "Never break working code. Read before write."
  SIMPLEST_WORKS:    "Fewest moving parts that solve the problem."
  FAIL_VISIBLY:      "Errors surface immediately. Never swallow exceptions."
  ONE_SOURCE:        "One authoritative representation per concept."
  DECOUPLE:          "Hidden dependencies become explicit."
  GUARD_EXPENSIVE:   "Check preconditions before costly work."
  DEGRADE_GRACEFULLY: "Works with partial failures."
  BE_CONCISE:        "No unnecessary words, tokens, or lines."

